            - application "Rich Text Editor, editarea" [ref=f235e318]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f235e332]: "<p class=\"lt-phys-64681\">The last two sections introduced you to many new concepts, and we hope that through those, you have seen one major idea emerge. Astronomers can learn about the elements in stars and galaxies by decoding the information in their spectral lines. There is a complicating factor in learning how to decode the message of starlight, however. If a star is moving toward or away from us, its lines will be in a slightly different place in the spectrum from where they would be in a star at rest. And most objects in the universe do have some motion relative to the Sun.</p> <h3 class=\"lt-phys-64681\">Motion Affects Waves</h3> <p class=\"lt-phys-64681\">In 1842, Christian <span class=\"no-emphasis\" data-type=\"term\" group-by=\"D\">Doppler</span> first measured the effect of motion on waves by hiring a group of musicians to play on an open railroad car as it was moving along the track. He then applied what he learned to all waves, including light, and pointed out that if a light source is approaching or receding from the observer, the light waves will be, respectively, crowded more closely together or spread out. The general principle, now known as the <span data-type=\"term\" group-by=\"D\">Doppler effect</span>, is illustrated in Figure 5.22.</p> <figure><span data-alt=\"This figure illustrates the Doppler effect. Part A shows even concentric rings representing waves moving over an observer. The center of the rings is labeled “S” for source, and from innermost to outermost the rings are labeled “4”, “3”, “2”, and “1”. An arrow points outward from the outmost ring, and is labeled “to observer”. Part B shows uneven concentric rings representing waves moving over three observers. The center of the rings is labeled “S 4” for source, and from innermost to outermost the rings are labeled “4”, “3”, “2”, and “1”. Labels “S 3”, “S 2”, and “S 1” are marked vertically above “S 4”, and represent the movement of the source “to Observer A” at the bottom of the outmost ring. “To observer B” is labeled at the left, and “to observer C” at the top of the outmost ring.\" data-type=\"media\"><img alt=\"This figure illustrates the Doppler effect. Part A shows even concentric rings representing waves moving over an observer. The center of the rings is labeled “S” for source, and from innermost to outermost the rings are labeled “4”, “3”, “2”, and “1”. An arrow points outward from the outmost ring, and is labeled “to observer”. Part B shows uneven concentric rings representing waves moving over three observers. The center of the rings is labeled “S 4” for source, and from innermost to outermost the rings are labeled “4”, “3”, “2”, and “1”. Labels “S 3”, “S 2”, and “S 1” are marked vertically above “S 4”, and represent the movement of the source “to Observer A” at the bottom of the outmost ring. “To observer B” is labeled at the left, and “to observer C” at the top of the outmost ring.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46136/2e31d65d9eef6dd9d8a5fd17863d6d4d54e2cc02\" /> </span> <figcaption>Figure 5.22 : Doppler Effect. (a) A source, S, makes waves whose numbered crests (1, 2, 3, and 4) wash over a stationary observer. (b) The source S now moves toward observer <em data-effect=\"italics\">A</em> and away from observer <em data-effect=\"italics\">C</em>. Wave crest 1 was emitted when the source was at position S1, crest 2 at position S2, and so forth. Observer <em data-effect=\"italics\">A</em> sees waves compressed by this motion and sees a blueshift (if the waves are light). Observer <em data-effect=\"italics\">C</em> sees the waves stretched out by the motion and sees a redshift. Observer <em data-effect=\"italics\">B</em>, whose line of sight is perpendicular to the source’s motion, sees no change in the waves (and feels left out).</figcaption> </figure> <p class=\"lt-phys-64681\">In part (a) of the figure, the light source (S) is at rest with respect to the observer. The source gives off a series of waves, whose crests we have labeled 1, 2, 3, and 4. The light waves spread out evenly in all directions, like the ripples from a splash in a pond. The crests are separated by a distance, λ, where λ is the wavelength. The observer, who happens to be located in the direction of the bottom of the image, sees the light waves coming nice and evenly, one wavelength apart. Observers located anywhere else would see the same thing.</p> <p class=\"lt-phys-64681\">On the other hand, if the source of light is moving with respect to the observer, as seen in part (b), the situation is more complicated. Between the time one crest is emitted and the next one is ready to come out, the source has moved a bit, toward the bottom of the page. From the point of view of observer <em data-effect=\"italics\">A</em>, this motion of the source has decreased the distance between crests—it’s squeezing the crests together, this observer might say.</p> <p class=\"lt-phys-64681\">In part (b), we show the situation from the perspective of three observers. The source is seen in four positions, S<sub>1</sub>, S<sub>2</sub>, S<sub>3</sub>, and S<sub>4</sub>, each corresponding to the emission of one wave crest. To observer <em data-effect=\"italics\">A</em>, the waves seem to follow one another more closely, at a decreased wavelength and thus increased frequency. (Remember, all light waves travel at the speed of light through empty space, no matter what. This means that motion cannot affect the speed, but only the wavelength and the frequency. As the wavelength decreases, the frequency must increase. If the waves are shorter, more will be able to move by during each second.)</p> <p class=\"lt-phys-64681\">The situation is not the same for other observers. Let’s look at the situation from the point of view of observer <em data-effect=\"italics\">C</em>, located opposite observer <em data-effect=\"italics\">A</em> in the figure. For her, the source is moving away from her location. As a result, the waves are not squeezed together but instead are spread out by the motion of the source. The crests arrive with an increased wavelength and decreased frequency. To observer <em data-effect=\"italics\">B</em>, in a direction at right angles to the motion of the source, no effect is observed. The wavelength and frequency remain the same as they were in part (a) of the figure.</p> <p class=\"lt-phys-64681\">We can see from this illustration that the Doppler effect is produced only by a motion toward or away from the observer, a motion called <span data-type=\"term\" group-by=\"r\">radial velocity</span>. Sideways motion does not produce such an effect. Observers between <em data-effect=\"italics\">A</em> and <em data-effect=\"italics\">B</em> would observe some shortening of the light waves for that part of the motion of the source that is along their line of sight. Observers between <em data-effect=\"italics\">B</em> and <em data-effect=\"italics\">C</em> would observe lengthening of the light waves that are along their line of sight.</p> <p class=\"lt-phys-64681\">You may have heard the Doppler effect with sound waves. When a train whistle or police siren approaches you and then moves away, you will notice a decrease in the pitch (which is how human senses interpret sound wave frequency) of the sound waves. Compared to the waves at rest, they have changed from slightly more frequent when coming toward you, to slightly less frequent when moving away from you.</p> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64681\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p class=\"lt-phys-64681\">A nice example of this change in the sound of a train whistle can be heard at the end of the classic Beach Boys song “Caroline, No” on their album <em data-effect=\"italics\">Pet Sounds</em>. To hear this sound, go to this <a href=\"https://openstax.org/l/30BBtrain\" rel=\"noopener nofollow\" target=\"_blank\">YouTube</a> version of the song. The sound of the train begins at approximately 2:20.</p> </div> <h3 class=\"lt-phys-64681\">Color Shifts</h3> <p class=\"lt-phys-64681\">When the source of waves moves toward you, the wavelength decreases a bit. If the waves involved are visible light, then the colors of the light change slightly. As wavelength decreases, they shift toward the blue end of the spectrum: astronomers call this a <em data-effect=\"italics\">blueshift</em> (since the end of the spectrum is really violet, the term should probably be <em data-effect=\"italics\">violetshift</em>, but blue is a more common color). When the source moves away from you and the wavelength gets longer, we call the change in colors a <em data-effect=\"italics\">redshift</em>. Because the Doppler effect was first used with visible light in astronomy, the terms “<span class=\"no-emphasis\" data-type=\"term\" group-by=\"b\">blueshift</span>” and “<span class=\"no-emphasis\" data-type=\"term\" group-by=\"r\">redshift</span>” became well established. Today, astronomers use these words to describe changes in the wavelengths of radio waves or X-rays as comfortably as they use them to describe changes in visible light.</p> <p class=\"lt-phys-64681\">The greater the motion toward or away from us, the greater the Doppler shift. If the relative motion is entirely along the line of sight, the formula for the Doppler shift of light is</p> <p class=\"lt-phys-64681\"><math display=\"block\"><semantics><mrow><mrow><mfrac><mrow><mtext>Δ</mtext><mtext>λ</mtext></mrow><mtext>λ</mtext></mfrac><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mi>v</mi><mi>c</mi></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><mtext>Δ</mtext><mtext>λ</mtext></mrow><mtext>λ</mtext></mfrac></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mi>v</mi><mi>c</mi></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64681\">where λ is the wavelength emitted by the source, Δλ is the difference between λ and the wavelength measured by the observer, <em data-effect=\"italics\">c</em> is the speed of light, and <em data-effect=\"italics\">v</em> is the relative speed of the observer and the source in the line of sight. The variable <em data-effect=\"italics\">v</em> is counted as positive if the velocity is one of recession, and negative if it is one of approach. Solving this equation for the velocity, we find <em data-effect=\"italics\">v</em> = <em data-effect=\"italics\">c</em> × Δλ/λ.</p> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64681\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p class=\"lt-phys-64681\">Click-and-drag the object emitting waves or the object receiving waves in this <a href=\"https://openstax.org/l/30doppsim\" rel=\"noopener nofollow\" target=\"_blank\">simulator</a> to experiment with the Doppler effect yourself. The plots along the top show how the detected wavelengths change if the objects are approaching each other or moving further apart.</p> </div> <p class=\"lt-phys-64681\">If a star approaches or recedes from us, the wavelengths of light in its continuous spectrum appear shortened or lengthened, respectively, as do those of the dark lines. However, unless its speed is tens of thousands of kilometers per second, the star does not appear noticeably bluer or redder than normal. The Doppler shift is thus not easily detected in a continuous spectrum and cannot be measured accurately in such a spectrum. The wavelengths of the absorption lines can be measured accurately, however, and their Doppler shift is relatively simple to detect.</p> <div class=\"box-example\"> <h5 class=\"box-legend lt-phys-64681\"><span class=\"lt-icon-default\">Example 5.6: The Doppler Effect</span></h5> <p class=\"lt-phys-64681\">We can use the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"D\">Doppler effect</span> equation to calculate the radial velocity of an object if we know three things: the speed of light, the original (unshifted) wavelength of the light emitted, and the difference between the wavelength of the emitted light and the wavelength we observe. For particular absorption or emission lines, we usually know exactly what wavelength the line has in our laboratories on Earth, where the source of light is not moving. We can measure the new wavelength with our instruments at the telescope, and so we know the difference in wavelength due to Doppler shifting. Since the speed of light is a universal constant, we can then calculate the radial velocity of the star.</p> <p class=\"lt-phys-64681\">A particular emission line of hydrogen is originally emitted with a wavelength of 656.3 nm from a gas cloud. At our telescope, we observe the wavelength of the emission line to be 656.6 nm. How fast is this gas cloud moving toward or away from Earth?</p> <h6 class=\"lt-phys-64681\">Solution</h6> <p class=\"lt-phys-64681\">Because the light is shifted to a longer wavelength (redshifted), we know this gas cloud is moving away from us. The speed can be calculated using the Doppler shift formula:</p> <p class=\"lt-phys-64681\"><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mi>ν</mi></mtd><mtd columnalign=\"left\"><mo>=</mo><mi>c</mi><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mtext>Δ</mtext><mtext>λ</mtext></mrow><mtext>λ</mtext></mfrac><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.3</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow><mrow><mn>656.3</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow></mfrac></mrow><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow><mrow><mn>656.3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow></mfrac></mrow><mo>)</mo></mrow></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>140,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>m</mtext><mtext>/s</mtext><mo>=</mo><mn>140</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mtext>/</mtext></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mtext>s</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mi>ν</mi></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"left\"><mo>=</mo><mi>c</mi><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mtext>Δ</mtext><mtext>λ</mtext></mrow><mtext>λ</mtext></mfrac><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.3</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow><mrow><mn>656.3</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow></mfrac></mrow><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow><mrow><mn>656.3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow></mfrac></mrow><mo>)</mo></mrow></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>140,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>m</mtext><mtext>/s</mtext><mo>=</mo><mn>140</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mtext>/s</mtext></mtd></mtr></mtable></annotation-xml></semantics></math></p> </div> <section class=\"box-exercise\"> <h5 class=\"box-legend lt-phys-64681\"><span class=\"lt-icon-default\">Exercise \\(\\PageIndex{1}\\)</span></h5> <p class=\"lt-phys-64681\">Suppose a spectral line of hydrogen, normally at 500 nm, is observed in the spectrum of a star to be at 500.1 nm. How fast is the star moving toward or away from Earth?</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64681\">&nbsp;</p> <p class=\"lt-phys-64681\">Because the light is shifted to a longer wavelength, the star is moving away from us:</p> <p class=\"lt-phys-64681\"><math display=\"inline\"><semantics><mrow><mrow><mi>ν</mi><mo>=</mo><mi>c</mi><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mtext>Δ</mtext><mtext>λ</mtext></mrow><mtext>λ</mtext></mfrac><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.1</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow><mrow><mn>500</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow></mfrac></mrow><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.1</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–</mtext></mrow></msup></mrow><mrow><msup><mrow><mtext>9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow><mrow><mn>500</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow></msup></mrow><mrow><msup><mrow><mtext>–9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow></mfrac></mrow><mo>)</mo></mrow><mo>=</mo><mn>60,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>m</mtext><mtext>/s.</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>ν</mi><mo>=</mo><mi>c</mi><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mtext>Δ</mtext><mtext>λ</mtext></mrow><mtext>λ</mtext></mfrac><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.1</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow><mrow><mn>500</mn><mspace width=\"0.2em\"></mspace><mtext>nm</mtext></mrow></mfrac></mrow><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mrow><mn>3.0</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mfrac><mrow><mn>0.1</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–</mtext></mrow></msup></mrow><mrow><msup><mrow><mtext>9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow><mrow><mn>500</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow></msup></mrow><mrow><msup><mrow><mtext>–9</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow></mfrac></mrow><mo>)</mo></mrow><mo>=</mo><mn>60,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>m</mtext><mtext>/s.</mtext></mrow></annotation-xml></semantics></math> Its speed is<br /> 60,000 m/s.</p> </dd> </dl> </section> <p class=\"lt-phys-64681\">You may now be asking: if all the stars are moving and motion changes the wavelength of each spectral line, won’t this be a disaster for astronomers trying to figure out what elements are present in the stars? After all, it is the precise wavelength (or color) that tells astronomers which lines belong to which element. And we first measure these wavelengths in containers of gas in our laboratories, which are not moving. If every line in a star’s spectrum is now shifted by its motion to a different wavelength (color), how can we be sure which lines and which elements we are looking at in a star whose speed we do not know?</p> <p class=\"lt-phys-64681\">Take heart. This situation sounds worse than it really is. Astronomers rarely judge the presence of an element in an astronomical object by a single line. It is the <em data-effect=\"italics\">pattern</em> of lines unique to hydrogen or calcium that enables us to determine that those elements are part of the star or galaxy we are observing. The Doppler effect does not change the pattern of lines from a given element—it only shifts the whole pattern slightly toward redder or bluer wavelengths. The shifted pattern is still quite easy to recognize. Best of all, when we do recognize a familiar element’s pattern, we get a bonus: the amount the pattern is shifted can enable us to determine the speed of the objects in our line of sight.</p> <p class=\"lt-phys-64681\">The training of astronomers includes much work on learning to decode light (and other electromagnetic radiation). A skillful “decoder” can learn the temperature of a star, what elements are in it, and even its speed in a direction toward us or away from us. That’s really an impressive amount of information for stars that are light-years away.</p>"
