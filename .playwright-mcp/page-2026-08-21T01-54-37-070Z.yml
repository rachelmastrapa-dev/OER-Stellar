            - application "Rich Text Editor, editarea" [ref=f163e319]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f163e333]: <h2>Figure 5.1.1&nbsp;Lens Focusing Light</h2> <p>Diagram illustrating the focal length of a converging lens.</p> <ul> <li>Parallel light rays enter the lens from the left.</li> <li>After passing through the lens, the rays bend inward and converge toward a single point on the right labeled <strong>“Focus.”</strong></li> <li>The distance between the center of the lens and the focal point is labeled <strong>“Focal length.”</strong></li> <li>A dashed vertical line passes through the focal point to mark its location.</li> <li>Beyond the focus, the light rays cross and begin to spread apart again.</li> </ul> <p>The diagram demonstrates that a converging lens brings parallel incoming light rays together at a focal point, and that the focal length is the distance from the lens to that point. &nbsp;</p> <h2>Figure 5.1.3 Refracting and Reflecting Telescopes&nbsp;</h2> <p>This diagram demonstrates the difference between refracting and reflecting telescopes.&nbsp;The path of light is represented by yellow lines with arrows showing direction of travel. For both types of telescopes the light enters the telescope through the opening at the top, or the aperture. Both telescopes are tube shaped, but the reflector is wider.</p> <h3>Refractor</h3> <ul> <li>Refracting telescopes use lenses to gather light and create an image.</li> <li>Light enters a refracting telescope through a lens at the upper end, which focuses the light near the bottom of the telescope.</li> <li>At the bottom of the telescope, an eyepiece magnifies the image so that it can be viewed.</li> </ul> <h3>Reflector</h3> <ul> <li>The upper end of a reflecting telescope is open, and the light passes through to the curved mirror located at the bottom of the telescope.</li> <li>The mirror focuses the light at a point called the prime focus near&nbsp;the top end of the telescope.</li> <li>At the prime focus, a second mirror reflects the light through the side of&nbsp;the telescope where an eyepiece is used for observation.</li> </ul> <h2>Figure 5.1.4&nbsp;Focus Arrangements for Reflecting Telescopes</h2> <p>The diagram includes three different examples of reflecting telescopes based on where the telescope focuses the image. The path of light is represented by yellow lines with arrows showing direction of travel. All three telescopes have the same tube shape, are open at the top, and have a curved mirror at the bottom. The light enters the telescopes through the aperture, is reflected by the mirror at the bottom and forms an image at the prime focus near the top.</p> <h3>Prime Focus</h3> <ul> <li>All reflecting telescopes have a prime focus located inside the telescope near the aperture.</li> <li>In a prime focus telescope, the image is collected at the prime focus.</li> <li>Since the prime focus is located inside of the telescope, the telescope would have to be large enough that the observer&nbsp;or detector could fit inside.</li> <li>The telescope would also have to be large enough that the observer&nbsp;or detector&nbsp;woudl not block light from entering the telescope.&nbsp;</li> </ul> <h3>Newtonian</h3> <ul> <li>In a Newtonian telescope, a small mirror is located at the prime focus.&nbsp;</li> <li>The mirror is positioned so that it will redirect the light through a hole in the side of the telescope, where it is observed by a person or collected by a detector.</li> </ul> <h3>Cassegrain</h3> <ul> <li>Similar to a Newtonian telescope, the Cassegrain&nbsp;telescope also has a small mirror at the prime focus.</li> <li>The light is reflected by the secondary mirror down through a hole in the primary mirror.</li> </ul> <h2>Figure 5.2.1&nbsp;ESO Very Large Telescope Mirror</h2> <p>The mirror from the&nbsp;European Southern Observatory’s Very Large Telescope was built at another facility and moved to the telescope for installation. There are two people in the image that are not quite as tall as the support structure for the mirror. The mirror is a circular, reflective surface that is as wide as about 4 times the size of the people in the image. There is a hole in the center of the mirror. In the telescope, the light collected by this mirror will be reflected off of a mirror at the prime focus and pass through the center of the mirror to a detector below.&nbsp;</p> <h2>Figure 5.2.3&nbsp; Vera Rubin Observatory</h2> <p>The Vera Rubin observatory is a large building at the center of the image. The build is so tall that a bus parked in its parking lot is very small in comparison.&nbsp;It is located on the top of a tall mountain, Cerro Pachon. The area around the observatory is very rocky and barren with little to no plants. There are some stars visible in the sky above the observatory. Although the observatory and surrounding land is brightly lit, this image was collected at night using a long exposure.</p> <h2>Figure 5.2.4&nbsp; The Heart of the ELT</h2> <p>In&nbsp;this image taken inside the dome of the&nbsp;Extremely Large Telescope (ELT), the support structure for the mirrors takes up the majority of the image. Because of the size and weight of the mirrors, the support structure needs to be large and complex. The image was collected from below and to the side of the structure, so it includes the bottom of the base where the mirrors will eventually be placed. Below the base there are many metal beams forming multiple layers of triangular support structure.&nbsp; A crane below the structure is positioned so that a person, barely seen among the beams, can work on the structure. The entire structure is surrounded by temporary metal scaffolds used during construction.&nbsp;</p> <h2>Figure 5.3.1&nbsp; Charge-Coupled Devices (CCDs)</h2> <p>This figure contains two examples of charge-coupled devices (CCDs).&nbsp; Image a includes a small CCD&nbsp;while image b is of a larger device made up of many CCDs assembled into one detector.</p> <h3>Image (a)</h3> <p>A hand uses a clip to hold a small, round CCD that could fit in the palm of an adult's hand. The surface of the CCD is covered in a rectangles of a range of sizes. The rectangles have a shiny, reflective appearance.&nbsp; Each rectangle consists of many tiny sensors that can collect and count photons.&nbsp;</p> <h3>Image (b)</h3> <p>The detector for Kepler consists of a grid of square shaped CCDs. The person next to the instrument is wearing&nbsp;clothing that covers their hands, face, and hair to protect the instrument from contamination.</p> <h2>Figure 5.3.4 Prism Spectrometer</h2> <p>This diagram depicts the components needed to build a prism spectrometer and how it should work. The description is from left to right.</p> <h3>Lens</h3> <ul> <li>The light from the telescope comes from the left side of the diagram, represented by a beam of light.</li> <li>The beam of light that arrives at the lens is roughly the same size as the lens. After passing through the lens, the beam reduces in size until it is focus at a single point.</li> </ul> <h3>Slit</h3> <ul> <li>At this focal point, the light passes through a tiny gap called a slit.</li> <li>The size of the slit controls how much the light is broken up by wavelength. <ul> <li>For a narrow slit, fewer photons of light pass through, but the photons are separated by very small changes in wavelength.</li> <li>A wider slit lets more photons through, but the photons are grouped together over larger changes in wavelength.</li> </ul> </li> </ul> <h3>Collimating Lens</h3> <ul> <li>After passing through the slit, the light spreads out in an arc, so it must be redirected using a collimating lens.&nbsp;</li> <li>This lens changes the path of the photons so that they are all going the same direction in a beam about the same size as the collimating lens and the beam of light at the far left of the diagram.&nbsp;</li> </ul> <h2>Prism</h2> <ul> <li>This beam of light then interacts with a prism, a triangular, transparent object.</li> <li>As the light passes through the prism, the path of each photon is changed.</li> <li>The degree of how much the path changed depends on wavelength.</li> <li>In this diagram, the light is in the visible range of the electromagnetic spectrum, so the light is broken down according to the colors of the rainbow simplified to red, green and blue.</li> </ul> <h3>Detector</h3> <ul> <li>Throughout this diagram, the light has been traveling from left to right.&nbsp;</li> <li>On the far right of the diagram, there is an outline of a lens and dashed lines represent the path of the light of the prism was not included in the diagram.&nbsp;</li> <li>If&nbsp;the light passed through the lens on the right instead of the prism, the lens would focus an image of the slit on the far right of the diagram.&nbsp;</li> <li>However, when the light leaves the prism it's path is bent toward the bottom right corner of the diagram.</li> <li>In the bottom right corner of the diagram, the light, represented by red, green, and blue lines interacts with the lens of a detector (or camera).</li> <li>That lens focuses the light onto a CCD (or photographic plate), demonstrating that the final image has separated the light into red, green, and blue.&nbsp;</li> </ul> <h2>Figure 5.4.1 First Radio Telescope</h2> <p>This rotating radio antenna was used by Jansky in his discovery of radio radiation from the Milky Way. Unlike the&nbsp;visible light telescopes which were metal tubes enclosed in domes, a radio telescope is a very different structure. There is no enclosure and the telescope is a collection of metal arches propped by wooden struts. The antenna is roughly the size of a semi truck and trailer.</p> <h2>Figure 5.4.2&nbsp; Radio Image of Cygnus A</h2> <p>This image has been constructed of radio observations at the Very Large Array of a galaxy called Cygnus A. Since humans can not see radio waves, colors have been added to help the eye sort out regions of different radio intensities. Red regions are the most intense, blue the least. The visible galaxy is a small dot in the center of the image. The radio image reveals jets of expelled material more than 160,000 light-years long on either side of the galaxy. The jets form large clouds far away and on either side of the galaxy. Each cloud is has layers of colors - the exterior is aqua, inside that is yellow region, and the center is a red core. The layers are imperfect, with ripples that reflect the turbulence within the cloud.&nbsp;</p> <h2>Figure 5.4.3&nbsp; Atacama Large Millimeter/Submillimeter Array (ALMA)</h2> <p>ALMA is made up of multiple radio&nbsp;dishes spread over a large area.&nbsp;Even though radio telescopes&nbsp;can function 24 hours a day, this is the observatory at night. In this image, over 14 dishes, each one the size of a small building, are located over a large area of open, flat desert. A couple of them are pointed in the same direction, but most of them are pointed in different directions. In the distance there are rocky mountains and city lights. The night sky includes the arm of the Milky Way behind the dishes.</p> <h2>Figure 5.5.1 Light and Earth's Atmosphere</h2> <p>This figure depicts radiation and the Earth’s atmosphere.</p> <h3>Earth's atmosphere</h3> <p>Labeled vertically from top to bottom:</p> <ul> <li>Thermosphere (auroras)</li> <li>Mesosphere (meteors burn up)</li> <li>Stratosphere (ozone layer at 20 – 30 km; jets fly at 10 km)</li> <li>Troposphere (weather)&nbsp;</li> </ul> <h3>Electromagnetic Spectrum</h3> <p>At the top of the figure, from shorter waves to longer wavelength, and from left to right, the different kinds of waves are labeled:</p> <ul> <li>Gamma</li> <li>X-ray</li> <li>Ultraviolet (UV)</li> <li>Visible</li> <li>Infrared (IR)</li> <li>Microwave</li> <li>Radar&nbsp;</li> </ul> <h3>Distance Light Travels in Atmosphere from Space</h3> <p>The distance that light can travel into Earth's atmosphere is graphed using bars that extend downward from the labeled Electromagnetic Spectrum.</p> <p>Above the thermosphere there are space telescopes under gamma, X-ray, visible, and infrared.</p> <ul> <li>The bars are violet on the left side of the figure and&nbsp;red on the right side of the figure.</li> <li>At the center of the figure, visible light is represented by a single bar each of blue, yellow, and red.</li> </ul> <p>Wavelengths of light:</p> <ul> <li>Gamma rays reach the stratosphere</li> <li>Shorter wavelength X-rays reach the mesosphere, while longer wavelength X-rays only reach the thermosphere.</li> <li>Most wavelengths of UV light only reach the thermosphere, but the longest wavelength UV, right near visible light, reaches the surface of Earth.</li> <li>Visible light reaches the surface of the Earth.&nbsp;Under visible light is an observatory, labeled “Optical window”.</li> <li>Infrared light <ul> <li>The shortest wavelengths reach the surface of the Earth.</li> <li>All other wavelengths of infrared light only reach the stratosphere.</li> <li>On top of the bars, there is an airplane where infrared light reaches the stratosphere and a space observatory</li> </ul> </li> <li>Most microwave light reaches the stratosphere, but the longest wavelength reaches the surface of the Earth.</li> <li>Radio <ul> <li>Most of the shorter wavelengths of radio reach the surface of Earth.</li> <li>Under radio is a radio telescope, labeled “Radio window”.</li> <li>The longer radio wavelengths, do not enter the thermosphere.&nbsp;</li> </ul> </li> </ul> <h2>Figure 5.5.3 Hubble Ultra-Deep Field</h2> <p>At first, this image may seem to be of a starry night. However, each of the bright spots in the dark background are not stars, but galaxies. They are a range of colors light blue, white, yellow, orange, and red. Most are simple points of light, while some are larger. The largest ones have elliptical shapes and some have spiral structures.</p> <h2>Figure 5.6.2 Maunakea Summit Area Sign</h2> <p>Maunakea Summit Area Sign which reads "Aloha,&nbsp;Maunakea is historically, culturally and environmentally significant. Help preserve our cultural and natural landscape and show your respect by not hiking beyond this point to the summit."</p>
