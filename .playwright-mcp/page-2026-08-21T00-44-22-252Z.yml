            - application "Rich Text Editor, editarea" [ref=f33e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f33e336]: "<p class=\"lt-phys-64647\">We can now take a brief introductory tour of the universe as astronomers understand it today to get acquainted with the types of objects and distances you will encounter throughout the text. We begin at home with Earth, a nearly spherical planet about 13,000 kilometers in diameter (Figure 1.6). A space traveler entering our planetary system would easily distinguish Earth from the other planets in our solar system by the large amount of liquid water that covers some two thirds of its crust. If the traveler had equipment to receive radio or television signals, or came close enough to see the lights of our cities at night, she would soon find signs that this watery planet has sentient life.</p> <figure><span data-alt=\"Composite Satellite Image of the Earth. North and South America are seen, as are the Atlantic and Pacific Oceans. Numerous cloud formations are scattered across the face of the globe.\" data-type=\"media\"><img alt=\"Composite Satellite Image of the Earth. North and South America are seen, as are the Atlantic and Pacific Oceans. Numerous cloud formations are scattered across the face of the globe.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45781/59be8672468d4d865edf064222d69a0e99f27af7\" /> </span> <figcaption>Figure 1.6 : Humanity’s Home Base. This image shows the Western hemisphere as viewed from space 35,400 kilometers (about 22,000 miles) above Earth. Data about the land surface from one satellite was combined with another satellite’s data about the clouds to create the image. (credit: modification of work by R. Stockli, A. Nelson, F. Hasler, NASA/ GSFC/ NOAA/ USGS)</figcaption> </figure> <p class=\"lt-phys-64647\">Our nearest astronomical neighbor is Earth’s satellite, commonly called the <em data-effect=\"italics\">Moon</em>. Figure 1.7 shows Earth and the Moon drawn to scale on the same diagram. Notice how small we have to make these bodies to fit them on the page with the right scale. The Moon’s distance from Earth is about 30 times Earth’s diameter, or approximately 384,000 kilometers, and it takes about a month for the Moon to revolve around Earth. The Moon’s diameter is 3476 kilometers, about one fourth the size of Earth.</p> <figure><span data-alt=\"Illustration of the Earth-Moon system, drawn to scale. Earth is at far left, the Moon at far right.\" data-type=\"media\"><img alt=\"Illustration of the Earth-Moon system, drawn to scale. Earth is at far left, the Moon at far right.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45780/558ce11b901259d185849237fe88b32586291c5c\" /> </span> <figcaption>Figure 1.7 : Earth and Moon, Drawn to Scale. This image shows <span class=\"no-emphasis\" data-type=\"term\" group-by=\"E\">Earth</span> and the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> shown to scale for both size and distance. (credit: modification of work by NASA)</figcaption> </figure> <p class=\"lt-phys-64647\">Light (or radio waves) takes 1.3 seconds to travel between Earth and the Moon. If you’ve seen videos of the Apollo flights to the Moon, you may recall that there was a delay of about 3 seconds between the time Mission Control asked a question and the time the astronauts responded. This was not because the astronauts were thinking slowly, but rather because it took the radio waves almost 3 seconds to make the round trip.</p> <p class=\"lt-phys-64647\">Earth revolves around our star, the Sun, which is about 150 million kilometers away—approximately 400 times as far away from us as the Moon. We call the average Earth–Sun distance an <em data-effect=\"italics\">astronomical unit</em> (AU) because, in the early days of astronomy, it was the most important measuring standard. Light takes slightly more than 8 minutes to travel 1 astronomical unit, which means the latest news we receive from the Sun is always 8 minutes old. The diameter of the Sun is about 1.5 million kilometers; Earth could fit comfortably inside one of the minor eruptions that occurs on the surface of our star. If the Sun were reduced to the size of a basketball, Earth would be a small apple seed about 30 meters from the ball.</p> <p class=\"lt-phys-64647\">It takes Earth 1 year ( <math display=\"inline\"><semantics><mrow><mrow><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow></annotation-xml></semantics></math> seconds) to go around the Sun at our distance; to make it around, we must travel at approximately 110,000 kilometers per hour. (If you, like many students, still prefer miles to kilometers, you might find the following trick helpful. To convert kilometers to miles, just multiply kilometers by 0.6. Thus, 110,000 kilometers per hour becomes 66,000 miles per hour.) Because gravity holds us firmly to Earth and there is no resistance to Earth’s motion in the vacuum of space, we participate in this extremely fast-moving trip without being aware of it day to day.</p> <p class=\"lt-phys-64647\">Earth is only one of eight planets that revolve around the Sun. These planets, along with their moons and swarms of smaller bodies such as dwarf planets, make up the solar system (Figure 1.8). A planet is defined as a body of significant size that orbits a star and does not produce its own light. (If a large body consistently produces its own light, it is then called a <em data-effect=\"italics\">star</em>.) Later in the book this definition will be modified a bit, but it is perfectly fine for now as you begin your voyage.</p> <figure><span data-alt=\"Diagram of the Solar System. In this image, the Sun, the planets, and some dwarf planets are shown with their sizes drawn to scale. At left a small portion of the immense disk of the Sun is shown. The planets and dwarf-planets are drawn in two rows in their relative positions from the Sun. The upper row shows the major planets from left to right: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. In the lower row are drawn a few selected dwarf-planets. From left to right: Ceres (in the asteroid belt, and drawn below Mars), then Pluto, Haumea, Makemake, and Eris below and to the right of Neptune.\" data-type=\"media\"><img alt=\"Diagram of the Solar System. In this image, the Sun, the planets, and some dwarf planets are shown with their sizes drawn to scale. At left a small portion of the immense disk of the Sun is shown. The planets and dwarf-planets are drawn in two rows in their relative positions from the Sun. The upper row shows the major planets from left to right: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. In the lower row are drawn a few selected dwarf-planets. From left to right: Ceres (in the asteroid belt, and drawn below Mars), then Pluto, Haumea, Makemake, and Eris below and to the right of Neptune.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45784/c2e03e2d37f6ae0a9a321059b5ae72c341347404\" /> </span> <figcaption>Figure 1.8 : Our Solar Family. The Sun, the planets, and some dwarf planets are shown with their sizes drawn to scale. The orbits of the planets are much more widely separated than shown in this drawing. Notice the size of Earth compared to the giant planets. (credit: modification of work by NASA)</figcaption> </figure> <p class=\"lt-phys-64647\">We are able to see the nearby planets in our skies only because they reflect the light of our local star, the Sun. If the planets were much farther away, the tiny amount of light they reflect would usually not be visible to us. The planets we have so far discovered orbiting other stars were found from the pull their gravity exerts on their parent stars, or from the light they block from their stars when they pass in front of them. We can’t see most of these planets directly, although a few are now being imaged directly.</p> <p class=\"lt-phys-64647\">The <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sun</span> is our local star, and all the other stars are also enormous balls of glowing gas that generate vast amounts of energy by nuclear reactions deep within. We will discuss the processes that cause stars to shine in more detail later in the book. The other stars look faint only because they are so very far away. If we continue our basketball analogy, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Proxima Centauri</span>, the nearest star beyond the Sun, which is 4.3 light-years away, would be almost 7000 kilometers from the basketball.</p> <p class=\"lt-phys-64647\">When you look up at a star-filled sky on a clear night, all the stars visible to the unaided eye are part of a single collection of stars we call the <em data-effect=\"italics\">Milky Way Galaxy</em>, or simply the <em data-effect=\"italics\">Galaxy</em>. (When referring to the Milky Way, we capitalize <em data-effect=\"italics\">Galaxy</em>; when talking about other galaxies of stars, we use lowercase <em data-effect=\"italics\">galaxy</em>.) The Sun is one of hundreds of billions of stars that make up the Galaxy; its extent, as we will see, staggers the human imagination. Within a sphere 10 light-years in radius centered on the Sun, we find roughly ten stars. Within a sphere 100 light-years in radius, there are roughly 10,000 <math display=\"inline\"><semantics><mrow><mrow><mo stretchy=\"false\">(</mo><msup><mn>10</mn><mn>4</mn></msup><mo stretchy=\"false\">)</mo></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mo stretchy=\"false\">(</mo><msup><mn>10</mn><mn>4</mn></msup><mo stretchy=\"false\">)</mo></mrow></annotation-xml></semantics></math> stars—far too many to count or name—but we have still traversed only a tiny part of the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Milky Way Galaxy</span>. Within a 1000-light-year sphere, we find some ten million <math display=\"inline\"><semantics><mrow><mrow><mo stretchy=\"false\">(</mo><msup><mn>10</mn><mn>7</mn></msup><mo stretchy=\"false\">)</mo></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mo stretchy=\"false\">(</mo><msup><mn>10</mn><mn>7</mn></msup><mo stretchy=\"false\">)</mo></mrow></annotation-xml></semantics></math> stars; within a sphere of 100,000 light-years, we finally encompass the entire Milky Way Galaxy.</p> <p class=\"lt-phys-64647\">Our Galaxy looks like a giant disk with a small ball in the middle. If we could move outside our Galaxy and look down on the disk of the Milky Way from above, it would probably resemble the galaxy in Figure 1.9, with its spiral structure outlined by the blue light of hot adolescent stars.</p> <figure><span data-alt=\"Image of a Barred-Spiral Galaxy. Just below center is the elongated central bar tilted about 45-degrees from the bottom of the frame. At each end of the bar begin the spiral arms, twisting clockwise around the central bar and encircling the whole galaxy.\" data-type=\"media\"><img alt=\"Image of a Barred-Spiral Galaxy. Just below center is the elongated central bar tilted about 45-degrees from the bottom of the frame. At each end of the bar begin the spiral arms, twisting clockwise around the central bar and encircling the whole galaxy.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45782/a7aa6fb05b7c8243e8b71213a87c2a379d562188\" /> </span> <figcaption>Figure 1.9 : Spiral Galaxy. This galaxy of billions of stars, called by its catalog number NGC 1073, is thought to be similar to our own Milky Way Galaxy. Here we see the giant wheel-shaped system with a bar of stars across its middle. (credit: NASA, ESA)</figcaption> </figure> <p class=\"lt-phys-64647\">The Sun is somewhat less than 30,000 light-years from the center of the Galaxy, in a location with nothing much to distinguish it. From our position inside the Milky Way Galaxy, we cannot see through to its far rim (at least not with ordinary light) because the space between the stars is not completely empty. It contains a sparse distribution of gas (mostly the simplest element, hydrogen) intermixed with tiny solid particles that we call <em data-effect=\"italics\">interstellar dust</em>. This gas and dust collect into enormous clouds in many places in the Galaxy, becoming the raw material for future generations of stars. Figure 1.10 shows an image of the disk of the Galaxy as seen from our vantage point.</p> <figure><span data-alt=\"Image of the night sky showing the Milky Way, a dense, vertical band of stars. Under the Milky Way is the silhouette of a person.\" data-type=\"media\"><img alt=\"Image of the night sky showing the Milky Way, a dense, vertical band of stars. Under the Milky Way is the silhouette of a person.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45786/e4669a675174ca5ab62f84f61398955c0f11bea8\" /> </span> <figcaption>Figure 1.10 : Milky Way Galaxy. Because we are inside the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Milky Way Galaxy</span>, we see its disk in cross-section flung across the sky like a great milky white avenue of stars with dark “rifts” of dust. In this dramatic image, part of it is seen above Trona Pinnacles in the California desert. (credit: Ian Norman)</figcaption> </figure> <p class=\"lt-phys-64647\">Typically, the interstellar material is so extremely sparse that the space between stars is a much better vacuum than anything we can produce in terrestrial laboratories. Yet, the dust in space, building up over thousands of light-years, can block the light of more distant stars. Like the distant buildings that disappear from our view on a smoggy day in Los Angeles, the more distant regions of the Milky Way cannot be seen behind the layers of interstellar smog. Luckily, astronomers have found that stars and raw material shine with various forms of light, some of which do penetrate the smog, and so we have been able to develop a pretty good map of the Galaxy.</p> <p class=\"lt-phys-64647\">Recent observations, however, have also revealed a rather surprising and disturbing fact. There appears to be more—much more—to the Galaxy than meets the eye (or the telescope). From various investigations, we have evidence that much of our Galaxy is made of material we cannot currently observe directly with our instruments. We therefore call this component of the Galaxy <em data-effect=\"italics\">dark matter</em>. We know the dark matter is there by the pull its gravity exerts on the stars and raw material we can observe, but what this dark matter is made of and how much of it exists remain a mystery. Furthermore, this dark matter is not confined to our Galaxy; it appears to be an important part of other star groupings as well.</p> <p class=\"lt-phys-64647\">By the way, not all stars live by themselves, as the Sun does. Many are born in double or triple systems with two, three, or more stars revolving about each other. Because the stars influence each other in such close systems, multiple stars allow us to measure characteristics that we cannot discern from observing single stars. In a number of places, enough stars have formed together that we recognized them as star clusters (Figure 1.11). Some of the largest of the star clusters that astronomers have cataloged contain hundreds of thousands of stars and take up volumes of space hundreds of light-years across.</p> <figure><span data-alt=\"Image of a Star Cluster. This Hubble Space Telescope image of M9 shows a dense circular-shaped grouping of stars. The number of stars drops off dramatically toward the edges of the image, away from the center of the cluster.\" data-type=\"media\"><img alt=\"Image of a Star Cluster. This Hubble Space Telescope image of M9 shows a dense circular-shaped grouping of stars. The number of stars drops off dramatically toward the edges of the image, away from the center of the cluster.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45788/f92c20252c65cd66367e5caa9ce1699f9564621d\" /> </span> <figcaption>Figure 1.11 : Star Cluster. This large star cluster is known by its catalog number, M9. It contains some 250,000 stars and is seen more clearly from space using the Hubble Space Telescope. It is located roughly 25,000 light-years away. (credit: NASA, ESA)</figcaption> </figure> <p class=\"lt-phys-64647\">You may hear stars referred to as “eternal,” but in fact no star can last forever. Since the “business” of stars is making energy, and energy production requires some sort of fuel to be used up, eventually all stars run out of fuel. This news should not cause you to panic, though, because our Sun still has at least 5 or 6 billion years to go. Ultimately, the Sun and all stars will die, and it is in their death throes that some of the most intriguing and important processes of the universe are revealed. For example, we now know that many of the atoms in our bodies were once inside stars. These stars exploded at the ends of their lives, recycling their material back into the reservoir of the Galaxy. In this sense, all of us are literally made of recycled “star dust.”</p>"
