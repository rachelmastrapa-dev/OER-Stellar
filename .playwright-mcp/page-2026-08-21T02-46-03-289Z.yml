            - application "Rich Text Editor, editarea" [ref=f466e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f466e336]: "<h2>Stellar Populations</h2> <p class=\"lt-phys-64247\">It is estimated that the Milky Way Galaxy has a population of 100 billion to 400 billion stars. In <a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.01:_Observing_Our_Galaxy#Structure_of_the_Milky_Way\" target=\"_blank\" title=\"15.1: Observing Our Galaxy\">Observing Our Galaxy</a>, we described the thin disk, thick disk, and stellar halo. Young stars lie in the thin disk, are rich in metals, and orbit the Galaxy's center at high speed. The stars in the halo are old, have low abundances of elements heavier than hydrogen and helium, and have highly elliptical orbits randomly oriented in direction. The diagram in Figure \\(\\PageIndex{1}\\) demonstrates that thin disk stars have orbits in the galactic plane, but halo stars have orbits with random orientations. Halo stars can plunge through the disk and central bulge, but they spend most of their time far above or below the plane of the Galaxy. The stars in the thick disk are intermediate between these two extremes. Let's first see why age and heavier-element abundance are correlated and then see what these correlations tell us about the origin of our Galaxy.</p> <figure><img alt=\"Thin disk galactic planar orbits vs. halo's randomly tilted orbits. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46207/da516d95177e4074a3cf5f219672f293d9d51147\" /> <figcaption>Figure \\(\\PageIndex{1}\\): Stars in the thin disk follow nearly circular orbits confined to the galactic plane, while stars in the halo move on randomly oriented, elliptical orbits that carry them far above and below it. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.5.1_Thin_Disk_vs._Halo_Orbits\" target=\"_blank\" title=\"15.9: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <h3 class=\"lt-phys-64820\">Two Kinds of Stars</h3> <p class=\"lt-phys-64820\">The discovery that there are two different kinds of stars was first made by Walter Baade when he observed the nearest galaxy that resembles our own, the Andromeda galaxy. Baade was impressed by the similarity of the mainly reddish stars in the Andromeda galaxy's nuclear bulge to those in our Galaxy's globular clusters and the halo. In Figure \\(\\PageIndex{2}\\) the young, bluer stars are found in the spiral arms and the older yellow stars are in the bulge. On this basis, he called the bright blue stars in the spiral arms <strong><a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.08:_Key_Terms#population I star\" target=\"_blank\" title=\"population I star\">population I star</a></strong> and all the stars in the halo and globular clusters <strong><a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.08:_Key_Terms#population II star\" target=\"_blank\" title=\"population II star\">population II star</a></strong>.</p> <figure><img alt=\"Andromeda Galaxy (M31), spiral arms and dust lanes. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46208/fe31e2fe13b68d0d758e3871696ab931af67f9d7\" /> <figcaption>Figure \\(\\PageIndex{2}\\): Andromeda (M31), the nearest large spiral galaxy to the Milky Way, shares our Galaxy's basic structure, with an older, yellowish central bulge, younger blue stars in the outer disk, and dust lanes that dim light from the bulge. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.5.2_Andromeda_Galaxy\" target=\"_blank\" title=\"15.9: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64820\">We now know that the populations differ not only in their locations in the Galaxy, but also in their chemical composition, age, and orbital motions around the center of the Galaxy. Population I stars are found only in the disk and follow nearly circular orbits around the galactic center. Examples are bright supergiant stars, main-sequence stars of high luminosity, spectral classes O and B, which are concentrated in the spiral arms, and members of young open star clusters. Interstellar matter and molecular clouds are found in the same places as population I stars.</p> <p class=\"lt-phys-64820\">Population II stars show no correlation with the location of the spiral arms. These objects are found throughout the Milky Way. Some are in the disk, but many others follow eccentric elliptical orbits that carry them high above the galactic disk into the halo. Examples include stars surrounded by planetary nebulae and RR Lyrae variable stars. The stars in globular clusters, found almost entirely in the Galaxy's halo, are also classified as population II.</p> <h3>Heavy Element Recycling</h3> <p class=\"lt-phys-64820\">Today, we know much more about stellar evolution than astronomers did in the 1940s, and we can determine the ages of stars. Population I includes stars with a wide range of ages. While some are as old as 10 billion years, others are still forming today. For example, the Sun, which is about 5 billion years old, is a population I star. But so are the massive young stars in the Orion Nebula that have formed in the last few million years. Population II, on the other hand, consists entirely of old stars that formed very early in the history of the Milky Way. Typical ages are 11 to 13 billion years.</p> <p class=\"lt-phys-64820\">We also now have good measurements of the compositions of stars. These are based on analyses of the stars' detailed spectra. Nearly all stars appear to be composed mostly of hydrogen and helium, but their abundances of the heavier elements differ. In the Sun and other population I stars, the heavy elements, those heavier than hydrogen and helium, account for 1–4% of the total stellar mass. Population II stars in the outer galactic halo and in globular clusters have much lower abundances of the heavy elements, often less than one-hundredth the concentrations found in the Sun and in rare cases even lower. The oldest population II star discovered to date has less than one ten-millionth as much iron as the Sun.</p> <p class=\"lt-phys-64820\">As we discussed in earlier chapters, heavy elements are created deep within the interiors of stars. They are added to the Galaxy's reserves of raw material when stars die, and their material is recycled into new generations of stars. Thus, as time goes on, stars are born with larger and larger supplies of heavy elements. Population II stars formed when the abundance of elements heavier than hydrogen and helium was low. Population I stars formed later, after mass lost by dying members of the first generations of stars had released into the interstellar medium elements heavier than hydrogen and helium. Some are still forming now, when further generations have added to the supply of heavier elements available to new stars.</p> <h3 class=\"lt-phys-64820\">Beyond Two Categories</h3> <p class=\"lt-phys-64820\">With rare exceptions, we should never trust any theory that divides the world into just two categories. While they can provide a starting point for hypotheses and experiments, they are often oversimplifications that need refinement as research continues. The idea of two populations helped organize our initial thoughts about the Galaxy, but we now know it cannot explain everything we observe. Even the different structures of the Galaxy, disk, halo, central bulge, are not so cleanly separated in terms of their locations, ages, and the heavy element content of the stars within them.</p> <p class=\"lt-phys-64820\">The exact definition of the Milky Way's disk depends on what objects we use to define it, and it has no sharp boundary. The hottest young stars and their associated gas and dust clouds are mostly in a region about 200 light-years thick. Older stars define a thicker disk that is about 2000 light-years thick. Halo stars spend most of their time high above or below the disk but pass through it on their highly elliptical orbits and so are sometimes found relatively near the Sun.</p> <p class=\"lt-phys-64820\">The highest density of stars is found in the central bulge, that bar-shaped inner region of the Galaxy. There are a few hot, young stars in the bulge, but most of the bulge stars are more than 10 billion years old. Yet unlike the halo stars of similar age, the abundance of heavy elements in the bulge stars is about the same as in the Sun. Why would that be?</p> <p class=\"lt-phys-64820\">Astronomers think that star formation in the crowded nuclear bulge occurred very rapidly just after the Milky Way Galaxy formed. After a few million years, the first generation of massive and short-lived stars then expelled heavy elements in supernova explosions and thereby enriched subsequent generations of stars. Thus, even stars that formed in the bulge more than 10 billion years ago started with a good supply of heavy elements.</p> <p class=\"lt-phys-64820\">Exactly the opposite occurred in the Small Magellanic Cloud, a small galaxy near the Milky Way, visible from Earth's Southern Hemisphere. Even the youngest stars in this galaxy are deficient in heavy elements. We think this is because the little galaxy is not especially crowded, and star formation has occurred quite slowly. As a result there have been, so far, relatively few supernova explosions. Smaller galaxies also have more trouble holding onto the gas expelled by supernova explosions in order to recycle it. Low-mass galaxies exert only a modest gravitational force, and the high-speed gas ejected by supernovae can easily escape from them. Which elements a star is made of depends not only on when the star formed in the history of its galaxy, but also on how many stars in its part of the galaxy had already completed their lives by the time the star is ready to form.</p>"
