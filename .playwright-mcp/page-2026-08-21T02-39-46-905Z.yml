            - application "Rich Text Editor, editarea" [ref=f430e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f430e336]: "<h2>Observing Black Holes</h2> <p class=\"lt-phys-64812\">Theory tells us what black holes are like. But do they actually exist? And how do we go about looking for something that is many light-years away, only a few dozen kilometers across, if a stellar black hole, and completely black? It turns out that the trick is not to look for the black hole itself but instead to look for what it does to a nearby companion star. As we saw, when very massive stars collapse, they leave behind their gravitational influence. What if a member of a double-star system becomes a black hole, and its companion manages to survive the death of the massive star? While the black hole disappears from our view, we may be able to deduce its presence from its effects on its&nbsp;companion.</p> <h3 class=\"lt-phys-64812\">How to Find a Black Hole</h3> <p class=\"lt-phys-64812\">To find a black hole, astronomers&nbsp;search for a star whose motion, determined from the Doppler shift of its spectral lines, shows that&nbsp;it is a member of a binary star system. If both stars are visible, neither can be a black hole. The next step is to examine systems where only one star of the pair is detectable. Being invisible is not enough, however, because a relatively faint star might be hard to observe next to the glare of a brilliant companion or if it is shrouded by dust. It could also be a neutron star. Therefore, we must find evidence that the unseen star has a mass too high to be a neutron star and that it is an extremely small stellar remnant.</p> <p class=\"lt-phys-64812\">We can use Kepler's law and our knowledge of the visible star to measure the mass of the invisible member of the pair. If the mass is greater than about 3 M<sub>Sun</sub>, then we have possibly found a black hole. To confirm the discovery, we need to prove that it is a collapsed star.</p> <p class=\"lt-phys-64812\">If matter falls toward a compact object of high gravity, the material is accelerated to high speed. Near the event horizon of a black hole, matter is moving at velocities that approach the speed of light. As the atoms speed toward the event horizon, they rub against each other. Internal friction can heat the atoms to temperatures of over 100 million K. Such hot matter emits radiation in the form of X-rays. Since X-rays do not penetrate Earth's atmosphere, such sources must be found using X-ray telescopes in space.</p> <p class=\"lt-phys-64812\">In our example, the infalling gas that produces the X-ray emission comes from the black hole's companion star. Stars in close binary systems can exchange mass, especially as one of the members expands into a red giant. Suppose that one star in a double-star system has evolved to a black hole and that the second star begins to expand. If the two stars are close enough, the black hole can exert enough gravitational force on the outer layers of the star, that some of the material moves toward the black hole. In Figure \\(\\PageIndex{1}\\), material in the star is flowing toward the black hole.</p> <p class=\"lt-phys-64812\">The mutual revolution of the giant star and the black hole causes the material falling toward the black hole to spiral around it rather than flow directly into it. The infalling gas whirls around the black hole and forms an accretion disk. It is within the inner part of this disk that matter is revolving about the black hole so fast that internal friction heats it up to X-ray–emitting temperatures.</p> <p class=\"lt-phys-64812\">Another way to form an accretion disk in a binary star system is to have a powerful stellar wind come from the black hole's companion. Such winds are a characteristic of several stages in a star's life. Some of the ejected gas in the wind will then flow close enough to the black hole to be captured by it into the disk.</p> <figure><img alt=\"Black hole with a disk and jets fed by companion star. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45894/4122524db2008c6ce58a0d7e83702c0d96b923ba\" /> <figcaption>Figure \\(\\PageIndex{1}\\) : Binary Black Hole. In this illustration, gravity from the black hole strips material from its companion star, funneling it into a disk. Near the black hole, some of the material is launched outward as narrow jets perpendicular to the disk. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>) <a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.2.1_Binary_Black_Hole\" target=\"_blank\" title=\"14.6: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64812\">The actual calculations astronomers make are a bit more complicated. Kepler's law allows us to calculate only the combined mass of the two stars in the binary system. We must learn more about the visible star of the pair and its history to ascertain the distance to the binary pair, the true size of the visible star's orbit, and how the orbit of the two stars are tilted toward Earth. Also, neutron stars can have accretion disks that produce X-rays, so astronomers must study the properties of these X-rays carefully when trying to determine what kind of object is at the center of the disk. Nevertheless, several black holes have been identified using this method.</p> <h3 class=\"lt-phys-64812\">Stellar-Mass Black Holes</h3> <p class=\"lt-phys-64812\">Because X-rays are such important tracers of black holes that are consuming their stellar companions, the search for black holes had to await the launch of sophisticated X-ray telescopes into space. These instruments must have the resolution to locate the X-ray sources accurately and thereby enable us to match them to the positions of binary star systems.</p> <p class=\"lt-phys-64812\">The first black hole binary system to be discovered is called Cygnus X-1. The visible star in this binary system is spectral type O. Measurements of the Doppler shifts of the O star's spectral lines show that it has an unseen companion. The X-rays from it strongly indicate that the companion is a small collapsed object. The mass of the invisible collapsed companion is about 15 times that of the Sun. The companion is therefore too massive to be either a white dwarf or a neutron star.</p> <p class=\"lt-phys-64812\">A number of other binary systems also meet all the conditions for containing a black hole. Table \\(\\PageIndex{1}\\) lists the characteristics of some of the best examples. In the chapter <a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.04:_Naming_the_Stars\" title=\"11.4: Naming the Stars\">Naming the Stars</a>, we reviewed how objects in space are named, including how the International Astronomical Union sets standards for naming conventions. At the moment, there is no standard way of naming black hole candidates. Many of these names reflect different types of information. The chain of numbers is the location of the source in right ascension and declination. Some of the letters preceding the numbers refer to objects such as LMC, and constellations like Cygnus. Other objects use letters to refer to the satellite that discovered the candidate: A for Ariel, G for Ginga, and so on. The notations in parentheses are those used by astronomers who study binary star system or novae.</p> <table class=\"mt-responsive-table\"> <caption>Table \\(\\PageIndex{1}\\): Black Hole Candidates</caption> <thead> <tr valign=\"top\"> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Name/Catalog Designation</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Companion Star Spectral Type</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Orbital Period (days)</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Black Hole Mass Estimates (M<sub>Sun</sub>)</th> </tr> </thead> <tbody> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">LMC X-1</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">O giant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">3.9</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">10.9</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">Cygnus X-1</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">O supergiant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">5.6</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">15</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">XTE J1819.3-254 (V4641 Sgr)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">B giant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">2.8</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">6–7</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">LMC X-3</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">B main sequence</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">1.7</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">7</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">4U1543-475 (IL Lup)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">A main sequence</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">1.1</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">9</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GRO J1655-40 (V1033 Sco)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">F subgiant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">2.6</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">7</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GRS 1915+105</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K giant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">33.5</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">14</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GS202+1338 (V404 Cyg)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K giant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">6.5</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">12</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">XTE J1550-564</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K giant</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">1.5</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">11</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">A0620-00 (V616 Mon)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K main sequence</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.33</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">9–13</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">H1705-250 (Nova Oph 1977)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K main sequence</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.52</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">5–7</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GRS1124-683 (Nova Mus 1991)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K main sequence</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.43</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">7</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GS2000+25 (QZ Vul)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K main sequence</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.35</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">5–10</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GRS1009-45 (Nova Vel 1993)</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K dwarf</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.29</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">8–9</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">XTE J1118+480</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K dwarf</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.17</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">7</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">XTE J1859+226</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">K dwarf</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.38</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">5.4</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Name/Catalog Designation\" data-valign=\"top\">GRO J0422+32</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Companion Star Spectral Type\" data-valign=\"top\">M dwarf</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Orbital Period (days)\" data-valign=\"top\">0.21</td> <td class=\"lt-phys-64812\" data-align=\"left\" data-th=\"Black Hole Mass Estimates (MSun)\" data-valign=\"top\">4</td> </tr> </tbody> </table> <h3 class=\"lt-phys-64812\">How Black Holes Grow</h3> <p class=\"lt-phys-64812\">After a star becomes a black hole, it probably won't be able to grow much larger. Out in the arms of the Milky Way Galaxy where we live, stars and star systems are much too far apart for other stars to provide material for a black hole. After all, material must approach very close to the event horizon before the gravity is any different from that of the star before it became the black hole.</p> <p class=\"lt-phys-64812\">In the central regions of galaxies, stars and raw material can be quite crowded together, and they can interact much more frequently with each other. Therefore, black holes in the centers of galaxies may have a much better opportunity to find mass close enough to their event horizons to pull in. Black holes are able to consume other stars, asteroids, gas, dust, and even other black holes. If two black holes merge, the result is a black hole with more mass and a larger event horizon.</p> <p class=\"lt-phys-64812\">As a result, black holes in crowded regions can grow, eventually swallowing thousands or even millions of times the mass of the Sun. Ground-based observations have provided compelling evidence that there is a black hole in the center of our own Galaxy with a mass of about 4 million times the mass of the Sun. Observations with the Hubble Space Telescope have shown dramatic evidence for the existence of black holes in the centers of many other galaxies. These black holes can have masses exceeding one billion solar masses. Evidence from more recent X-ray observations is also starting to indicate the existence of medium-sized black holes, whose masses are dozens to thousands of times the mass of the Sun. The crowded inner regions of globular clusters may be just the right location for intermediate-mass black holes.</p>"
