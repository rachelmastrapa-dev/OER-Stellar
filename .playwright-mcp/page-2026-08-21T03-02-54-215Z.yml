            - application "Rich Text Editor, editarea" [ref=f561e314]:
              - iframe [active] [ref=f561e315]:
                - generic [active] [ref=f563e1]:
                  - heading "Edward Emerson Barnard" [level=2] [ref=f563e2]
                  - paragraph [ref=f563e3]: Born in 1857 in Nashville, Tennessee, two months after his father died, Edward Barnard (Figure 20.10) grew up in such poor circumstances that he had to drop out of school at age nine to help support his ailing mother. He soon became an assistant to a local photographer, where he learned to love both photography and astronomy, destined to become the dual passions of his life. He worked as a photographer’s aide for 17 years, studying astronomy on his own. In 1883, he obtained a job as an assistant at the Vanderbilt University Observatory, which enabled him at last to take some astronomy courses.
                  - paragraph [ref=f563e4]: Married in 1881, Barnard built a house for his family that he could ill afford. But as it happened, a patent medicine manufacturer offered a $200 prize (a lot of money in those days) for the discovery of any new comet. With the determination that became characteristic of him, Barnard spent every clear night searching for comets. He discovered seven of them between 1881 and 1887, earning enough money to make the payments on his home; this “Comet House” later became a local attraction. (By the end of his life, Barnard had found 17 comets through diligent observation.)
                  - paragraph [ref=f563e5]: In 1887, Barnard got a position at the newly founded Lick Observatory, where he soon locked horns with the director, Edward Holden, a blustering administrator who made Barnard’s life miserable. (To be fair, Barnard soon tried to do the same for him.) Despite being denied the telescope time that he needed for his photographic work, in 1892, Barnard managed to discover the first new moon found around Jupiter since Galileo’s day, a stunning observational feat that earned him world renown. Now in a position to demand more telescope time, he perfected his photographic techniques and soon began to publish the best images of the Milky Way taken up to that time. It was during the course of this work that he began to examine the dark regions among the crowded star lanes of the Galaxy and to realize that they must be vast clouds of obscuring material (rather than “holes” in the distribution of stars).
                  - paragraph [ref=f563e6]:
                    - text: Astronomer-historian Donald
                    - generic [ref=f563e7]: Osterbrock
                    - text: "has called Barnard an “observaholic:” his daily mood seemed to depend entirely on how clear the sky promised to be for his night of observing. He was a driven, neurotic man, concerned about his lack of formal training, fearful of being scorned, and afraid that he might somehow slip back into the poverty of his younger days. He had difficulty taking vacations and lived for his work: only serious illness could deter him from making astronomical observations."
                  - paragraph [ref=f563e8]: In 1895, Barnard, having had enough of the political battles at Lick, accepted a job at the Yerkes Observatory near Chicago, where he remained until his death in 1923. He continued his photographic work, publishing compilations of his images that became classic photographic atlases, and investigating the varieties of nebulae revealed in his photographs. He also made measurements of the sizes and features of planets, participated in observations of solar eclipses, and carefully cataloged dark nebulae (see Figure 20.9). In 1916, he discovered the star with the largest proper motion, the second-closest star system to our own (see Analyzing Starlight). It is now called Barnard’s Star in his honor.
                  - 'figure "Figure 20.10 : Edward Emerson Barnard (1857–1923). Barnard’s observations provided information that furthered many astronomical explorations. (credit: The Lick Observatory)" [ref=f563e9]':
                    - img "Photograph of Edward Emerson Barnard leaning against a large telescope." [ref=f563e11]
                  - paragraph [ref=f563e13]
