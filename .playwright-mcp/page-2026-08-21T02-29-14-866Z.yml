            - application "Rich Text Editor, editarea" [ref=f370e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f370e336]: "<h2>The Age of Clusters</h2> <p class=\"lt-phys-64793\">In the previous section, we described how the oldest type of clusters are globular clusters. Open clusters are younger than globular clusters, and stellar associations are the youngest type of star grouping. In this section,&nbsp;we will describe where the stars in these different types of clusters are found in the H–R diagram. From that information and theoretical calculations,&nbsp;we estimate how long the stars in the clusters have lived.</p> <h3 class=\"lt-phys-64793\">Young Clusters</h3> <p class=\"lt-phys-64793\">What does theory predict for the H–R diagram of a cluster whose stars have recently condensed from an interstellar cloud? Remember that at every stage of evolution, massive stars evolve more quickly than their lower-mass counterparts. After a few million years, the most massive stars should have completed their contraction phase and be on the main sequence, while the less massive ones should be off to the right, still on their way to the main sequence. These ideas are demonstrated in Figure \\(\\PageIndex{1}\\), which shows the H–R diagram calculated by R. Kippenhahn and his associates at Munich University for a hypothetical cluster with an age of 3 million years. In the model, all of the stars form from the nebula at the same time.&nbsp;The high-mass, high-luminosity stars have already arrived at the main-sequence stage of their lives, while the lower-mass, lower-luminosity stars are still contracting in size and moving toward the zero-age main sequence, marked by a red line. The lower-mass stars are not yet hot enough to get all of their energy from the fusion of hydrogen.</p> <figure><img alt=\"H-R diagram of simulated 3 million year old star cluster. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46283/5cb929382bbfcb30d12c8137bb06400e89548462\" /> <figcaption>Figure \\(\\PageIndex{1}\\): Model Cluster H–R Diagram. Astronomers simulated the stars in a cluster that is 3 million years old, and plotted the results on an H-R diagram. The high-mass stars are on the main sequence, while low mass stars have not reached zero-age main sequence. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.3.1_Clusters_on_the_H-R_Diagram\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64793\">There are real star clusters that fit this description. In 1950, astronomers performed the first study of a cluster called NGC 2264. This cluster, located about 2,600 light-years from us, is still associated with the region of gas and dust from which it was born. For this cluster, and other clusters, the stars formed from the nebula at roughly the same time.&nbsp;Figure \\(\\PageIndex{2}\\) is an image of NGC 2264, also known as the Christmas Tree Cluster. It is a complex mixture of hydrogen gas, which is ionized by hot embedded stars. It also has dark obscuring dust lanes, and brilliant young stars. The image is about 30 light-years across.</p> <figure><img alt=\"NGC 2264, the Christmas Tree Cluster. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46281/b6b07d33fd0b25b1f27739c284839c618b5347eb\" /> <figcaption>Figure \\(\\PageIndex{2}\\): NGC 2264 is also known as the Christmas Tree Cluster, NGC 2264 is roughly 3 million years old, the same age as the model cluster plotted on the H-R diagram in Figure \\(\\PageIndex{1}\\). (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.3.2_NGC_2264\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64793\">The NGC 2264 cluster’s H–R diagram is in Figure \\(\\PageIndex{3}\\). Comparing this H–R diagram to that in Figure \\(\\PageIndex{1}\\) demonstrates the reality of data vs. tidy model results. Model results are produced by a program that uses a specific number of stars under the same conditions with a chosen distribution of masses, so the results will generally be evenly distributed. Reality is never quite as neat as a model, so astronomers are used to seeing individual data points form a more scattered structure than a model. This is partly because the real stars are not exactly like the stars in the model. More importantly, there are inherent errors in collecting data, also called noise. As long as observations are close to the model results, then there is agreement between the observation and model. In Figure \\(\\PageIndex{3}\\) the data has a similar pattern to the model results in Figure \\(\\PageIndex{1}\\). Most of the high-mass stars are near the zero-age main sequence line, indicating that they are fusing hydrogen. Most of the lower-mass stars are to the right of the main sequence indicating that they have not yet fully contracted or started fusing hydrogen. The data points that do not fit the pattern may be followed up on in future to determine why they are not where we think they should be. However, since most of the data fit the model, we can come to the conclusion that NGC 2264 is roughly 3 million years old.</p> <figure><img alt=\"H-R Diagram of NGC 2264. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46278/2faeedd421884ebfbdd16b180f308298c81b7f12\" /> <figcaption>Figure \\(\\PageIndex{3}\\): NGC 2264 H–R Diagram. When the stars of NGC 2264 are plotted on the HR Diagram the plot looks similar to the model results plotted in Figure \\(\\PageIndex{1}\\). (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.3.3_NGC_2264_H.E2.80.93R_Diagram\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{3}\\)</a>.</figcaption> </figure> <h3 class=\"lt-phys-64793\">Older Clusters</h3> <p class=\"lt-phys-64793\">As clusters get older, their H–R diagrams begin to change. Within a few million years of reaching the main sequence, the most massive stars begin exhausting the hydrogen in their cores and evolve into red giants or supergiants.&nbsp;As more time passes, stars of lower mass begin to leave the main sequence and make their way to the upper right of the H–R diagram.</p> <p class=\"lt-phys-64793\">Figure \\(\\PageIndex{4}\\) is a photograph of NGC 3293, a cluster that is about 10 million years old. The dense clouds of gas and dust that the stars formed from are gone. The bright orange star in NGC 3293 is the member of the cluster that has evolved most rapidly. An H-R diagram of this cluster would have most stars on the main sequence and one red giant to the right of the main sequence.</p> <figure><img alt=\"NGC 3293 star cluster. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46280/171a2fc603d18e9ef76a7ab77a023f884163fd78\" /> <figcaption>Figure \\(\\PageIndex{4}\\): NGC 3293. At 10 million years old, has one bright orange red giant, but most stars are still on the main sequence. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.3.4_NGC_3293\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{4}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64793\">Figure \\(\\PageIndex{5}\\) includes the H–R diagram of the open cluster M41, Chart (a) and an image of the cluster, Image (b). M41 is roughly 100 million years old and includes several red giants. By this time, a significant number of stars have moved off to the right of the zero-age main sequence, the red line, and become red giants. There is a gap that appears in this H–R diagram between the stars near the main sequence and the red giants. This gap does not necessarily imply that stars avoid a region of certain temperatures and luminosities. In this case, it simply represents a domain of temperature and luminosity through which stars evolve very quickly. We see a gap for M41 because at this particular moment, we have not caught a star in the process of moving across this part of the diagram.</p> <figure><img alt=\"The H-R diagram of Cluster M41. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46279/babf45738d5b4efa3373ccd9de535e00378bb4fb\" /> <figcaption>Figure \\(\\PageIndex{5}\\): Cluster M41. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>) Chart (a) When the stars of Cluster M41&nbsp;are plotted on the H-R diagram, the low mass stars are on the main sequence. As mass increases the stars are starting to move off of the main sequence, while a handful are already red giants Image (b) The image of Cluster M41 includes have a bright red stars, but are mostly white. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.3.5_Cluster_M41\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{5}\\)</a>.</figcaption> </figure> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: Interactive Activity</span></h5> <p>To see how astronomers use stellar populations to study the history of galaxies, watch the Hubble Space Telescope's <a href=\"https://www.youtube.com/watch?v=w_yT_Q-KX3g\" rel=\"noopener noreferrer\" target=\"_blank\"> Evolution of Stars in a Dwarf Galaxy </a> video, which illustrates how stars of different ages reveal a galaxy's evolutionary history.</p> </section>"
