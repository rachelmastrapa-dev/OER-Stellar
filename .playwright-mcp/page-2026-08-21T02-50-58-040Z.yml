                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.3.1_The_Pinwheel_Galaxy
                      - text: .
                  - paragraph [ref=f498e93]: These measurements of other galaxies support the conclusion already reached from studies of the rotation of our own galaxy that most of the material in the universe cannot at present be observed directly in any part of the electromagnetic spectrum. An understanding of the properties and distribution of this invisible matter is crucial to our understanding of galaxies. It's becoming clearer and clearer that, through the gravitational force it exerts, dark matter plays a dominant role in galaxy formation and early evolution.
