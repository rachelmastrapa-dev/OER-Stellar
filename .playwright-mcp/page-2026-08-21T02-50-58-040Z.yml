                  - heading "Mass-to-Light Ratio" [level=3] [ref=f498e79]
                  - paragraph [ref=f498e80]:
                    - text: A useful way of characterizing a galaxy is by noting the ratio of its mass, in units of the Sun's mass, to its light output, in units of the Sun's luminosity. This single number tells us roughly what kind of stars make up most of the luminous population of the galaxy, and it also tells us whether a lot of dark matter is present. For stars like the Sun, the
                    - strong [ref=f498e81]:
                      - link "mass-to-light ratio" [ref=f498e82]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#mass-to-light ratio
                    - text: ratio is 1 by our definition.
                  - paragraph [ref=f498e83]: Galaxies are not, of course, composed entirely of stars that are identical to the Sun. The overwhelming majority of stars are less massive and less luminous than the Sun, and usually these stars contribute most of the mass of a system without accounting for very much light. The mass-to-light ratio for low-mass stars is greater than 1. Therefore, a galaxy's mass-to-light ratio is also generally greater than 1, with the exact value depending on the ratio of high-mass stars to low-mass stars.
                  - paragraph [ref=f498e84]: Galaxies in which star formation is still occurring have many massive stars, and their mass-to-light ratios are usually in the range of 1 to 10. Spiral and irregular galaxies have mass-to-light ratios in this range, and also tend to have continuing star formation. Galaxies consisting mostly of an older stellar population, such as ellipticals, in which the massive stars have already completed their evolution and have ceased to shine, have mass-to-light ratios of 10 to 20.
                  - paragraph [ref=f498e85]: "But these figures refer only to the inner, conspicuous parts of galaxies. In The Milky Way Galaxy and above, we discussed the evidence for dark matter in the outer regions of our own Galaxy, extending much farther from the galactic center than do the bright stars and gas. Recent measurements of the rotation speeds of the outer parts of nearby galaxies, such as the Andromeda galaxy we discussed earlier, suggest that they too have extended distributions of dark matter around the visible disk of stars and dust. Figure \\(\\PageIndex{1}\\) is an image of the Pinwheel galaxy, and object used to measure the amount of dark matter. This largely invisible matter adds to the mass of the galaxy while contributing nothing to its luminosity, thus increasing the mass-to-light ratio. If dark invisible matter is present in a galaxy, its mass-to-light ratio can be as high as 100. The two different mass-to-light ratios measured for various types of galaxies are given in Table \\(\\PageIndex{1}\\)."
                  - figure [ref=f498e86]:
                    - img "Face-on spiral galaxy M101, the Pinwheel Galaxy. Details in caption." [ref=f498e87]
                    - generic [ref=f498e88]:
                      - text: "Figure \\(\\PageIndex{1}\\) : The Pinwheel Galaxy. This visible-light image from the Hubble Space Telescope includes the well-ordered spiral arms of a face-on galaxy, the kind of structure astronomers study to measure rotation curves and detect the presence of dark matter. ("
                      - link "CC BY 4.0" [ref=f498e89]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
