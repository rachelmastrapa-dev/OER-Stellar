                  - heading "Measuring Galaxies" [level=2] [ref=f498e2]
                  - paragraph [ref=f498e3]: The technique for deriving the masses of galaxies is basically the same as that used to estimate the mass of the Sun, the stars, and our own galaxy. We measure how fast objects in the outer regions of the galaxy are orbiting the center, and then we use this information along with Kepler's third law to calculate how much mass is inside that orbit.
                  - heading "Masses of Galaxies" [level=3] [ref=f498e4]
                  - paragraph [ref=f498e5]:
                    - text: Astronomers can measure the rotation speed in spiral galaxies by obtaining spectra of either stars or gas, and looking for wavelength shifts produced by the Doppler effect. Remember that the faster something is moving toward or away from us, the greater the shift of the lines in its spectrum. From this measurement, the Andromeda galaxy has a galactic mass of about 4 x 10
                    - superscript [ref=f498e6]: "11"
                    - generic [ref=f498e7]:
                      - text: M
                      - subscript [ref=f498e8]: Sun
                    - text: ", enough material to make 400 billion stars like the Sun."
                  - paragraph [ref=f498e9]:
                    - text: The total mass of the Andromeda galaxy is greater than this, however, because we have not included the mass of the material that lies beyond its visible edge. Fortunately, there is a handful of objects, such as isolated stars, star clusters, and satellite galaxies, beyond the visible edge that allows astronomers to estimate how much additional matter is hidden out there. Recent studies show that the amount of dark matter beyond the visible edge of Andromeda may be as large as the mass of the bright portion of the galaxy. Indeed, using the velocities of its satellite galaxies, the Andromeda galaxy is estimated to have a mass closer to 1.4 x 10
                    - superscript [ref=f498e10]: "12"
                    - generic [ref=f498e11]:
                      - text: M
                      - subscript [ref=f498e12]: Sun
                    - text: . The mass of the Milky Way Galaxy is estimated to be 8.5 x 10
                    - superscript [ref=f498e13]: "11"
                    - generic [ref=f498e14]:
                      - text: M
                      - subscript [ref=f498e15]: Sun
                    - text: ", and so our Milky Way is somewhat smaller than Andromeda."
                  - paragraph [ref=f498e16]: Elliptical galaxies do not rotate in a systematic way, so we cannot determine a rotational velocity. We must use a slightly different technique to measure their mass. Their stars are still orbiting the galactic center, but not in the organized way that characterizes spirals. Since elliptical galaxies contain stars that are billions of years old, we can assume that the galaxies themselves are not flying apart. Therefore, if we can measure the various speeds with which the stars are moving in their orbits around the center of the galaxy, we can calculate how much mass the galaxy must contain in order to hold the stars within it.
                  - paragraph [ref=f498e17]: In practice, the spectrum of a galaxy is a composite of the spectra of its many stars, whose different motions produce different Doppler shifts, some red, some blue. The result is that the lines we observe from the entire galaxy contain the combination of many Doppler shifts. When some stars provide blueshifts and others provide redshifts, they create a wider or broader absorption or emission feature than would the same lines in a hypothetical galaxy in which the stars had no orbital motion. Astronomers call this phenomenon line broadening. The amount by which each line broadens indicates the range of speeds at which the stars are moving with respect to the center of the galaxy. The range of speeds depends, in turn, on the force of gravity that holds the stars within the galaxies. With information about the speeds, it is possible to calculate the mass of an elliptical galaxy.
                  - paragraph [ref=f498e18]: "Table \\(\\PageIndex{1}\\) summarizes the range of masses (and other properties) of the various types of galaxies. Interestingly enough, the most and least massive galaxies are ellipticals. On average, irregular galaxies have less mass than spirals. Ellipticals can be amoung the largest and smallest galaxies. Most spiral galaxies are larger than irregular galaxies. All types of galaxies have similar ranges of luminosity, though ellipticals have some of the dimmest. Spirals have gas and dust, while ellipticals have a little gas and almost no dust. Meanwhile, all irregulars have a lot of gas, but they can either have a lot or very little dust. We will discuss the meaning of the mass to light ratio in the next section."
