                  - heading "Constellations" [level=3] [ref=f53e2]
                  - paragraph [ref=f53e3]: The backdrop for the motions of the “wanderers” in the sky is the canopy of stars. If there were no clouds in the sky and we were on a flat plain with nothing to obstruct our view, we could see about 3000 stars with the unaided eye. To find their way around such a multitude, the ancients found groupings of stars that made some familiar geometric pattern or (more rarely) resembled something they knew. Each civilization found its own patterns in the stars, much like a modern Rorschach test in which you are asked to discern patterns or pictures in a set of inkblots. The ancient Chinese, Egyptians, and Greeks, among others, found their own groupings—or constellations—of stars. These were helpful in navigating among the stars and in passing their star lore on to their children.
                  - paragraph [ref=f53e4]: You may be familiar with some of the old star patterns we still use today, such as the Big Dipper, Little Dipper, and Orion the hunter, with his distinctive belt of three stars (Figure 2.8). However, many of the stars we see are not part of a distinctive star pattern at all, and a telescope reveals millions of stars too faint for the eye to see. Therefore, during the early decades of the 20th century, astronomers from many countries decided to establish a more formal system for organizing the sky.
                  - 'figure "Figure 2.8 : Orion. (a) The winter constellation of Orion, the hunter, is surrounded by neighboring constellations, as illustrated in the seventeenth-century atlas by Hevelius. (b) A photograph shows the Orion region in the sky. Note the three blue stars that make up the belt of the hunter. The bright red star above the belt denotes his armpit and is called Betelgeuse (pronounced “Beetel-juice”). The bright blue star below the belt is his foot and is called Rigel. (credit a: modification of work by Johannes Hevelius; b: modification of work by Matthew Spinelli)" [ref=f53e5]':
                    - img "The Constellation of Orion. At left, figure (a) is an illustration from the 17th century by Hevelius showing the mythical hunter fully rendered with helmet, shield and sword. Superimposed on this detailed drawing are the stars that make up the constellation. (These early star maps were not only scientific in nature, but works of art.) The stars that comprise Orion’s belt are circled in red and an arrow points from the circle to the same stars in the belt in the center of the image shown at right in figure (b). Figure (b) is a photograph of the constellation as it appears in the night sky." [ref=f53e7]
                  - paragraph [ref=f53e9]:
                    - text: Today, we use the term
                    - emphasis [ref=f53e10]: constellation
                    - text: to mean one of 88 sectors into which we divide the sky, much as the United States is divided into 50 states. The modern boundaries between the constellations are imaginary lines in the sky running north–south and east–west, so that each point in the sky falls in a specific constellation, although, like the states, not all constellations are the same size. All the constellations are listed in Appendix L. Whenever possible, we have named each modern constellation after the Latin translations of one of the ancient Greek star patterns that lies within it. Thus, the modern constellation of Orion is a kind of box on the sky, which includes, among many other objects, the stars that made up the ancient picture of the hunter. Some people use the term
                    - emphasis [ref=f53e11]: asterism
                    - text: to denote an especially noticeable star pattern within a constellation (or sometimes spanning parts of several constellations). For example, the Big Dipper is an asterism within the constellation of Ursa Major, the Big Bear.
                  - paragraph [ref=f53e12]: Students are sometimes puzzled because the constellations seldom resemble the people or animals for which they were named. In all likelihood, the Greeks themselves did not name groupings of stars because they looked like actual people or subjects (any more than the outline of Washington state resembles George Washington). Rather, they named sections of the sky in honor of the characters in their mythology and then fit the star configurations to the animals and people as best they could.
                  - generic [ref=f53e13]:
                    - heading "Link to Learning" [level=5] [ref=f53e14]
                    - paragraph [ref=f53e16]:
                      - text: This
                      - link "website about objects in the sky" [ref=f53e17]:
                        - /url: https://openstax.org/l/30heavensabove
                      - text: allows users to construct a detailed sky map showing the location and information about the Sun, Moon, planets, stars, constellations, and even satellites orbiting Earth. Begin by setting your observing location using the option in the menu in the upper right corner of the screen. An excellent website called
                      - link "Figures in the Sky" [ref=f53e18]:
                        - /url: https://openstax.org/l/30constel
                      - text: shows the constellation figures imagined by cultures around the world.
