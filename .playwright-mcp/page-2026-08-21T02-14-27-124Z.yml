                  - paragraph [ref=f285e155]: Note that we’ve seen this 90% figure come up before. This is exactly what we found earlier when we examined the mass-luminosity relation (Figure 18.9). We observed that 90% of all stars seem to follow the relationship; these are the 90% of all stars that lie on the main sequence in our H–R diagram. Our models and our observations agree.
                  - paragraph [ref=f285e156]: "What about the other stars on the H–R diagram—the giants and supergiants, and the white dwarfs? As we will see in the next few chapters, these are what main-sequence stars turn into as they age: They are the later stages in a star’s life. As a star consumes its nuclear fuel, its source of energy changes, as do its chemical composition and interior structure. These changes cause the star to alter its luminosity and surface temperature so that it no longer lies on the main sequence on our diagram. Because stars spend much less time in these later stages of their lives, we see fewer stars in those regions of the H–R diagram."
                  - heading "Extremes of Stellar Luminosities, Diameters, and Densities" [level=3] [ref=f285e157]
                  - paragraph [ref=f285e158]:
                    - text: We can use the H–R diagram to explore the extremes in size, luminosity, and density found among the stars. Such extreme stars are not only interesting to fans of the
                    - emphasis [ref=f285e159]: Guinness Book of World Records
                    - text: ; they can teach us a lot about how stars work. For example, we saw that the most massive main-sequence stars are the most luminous ones. We know of a few extreme stars that are a million times more luminous than the Sun, with masses that exceed 100 times the Sun’s mass. These superluminous stars, which are at the upper left of the H–R diagram, are exceedingly hot, very blue stars of spectral type O. These are the stars that would be the most conspicuous at vast distances in space.
                  - paragraph [ref=f285e160]: The cool supergiants in the upper corner of the H–R diagram are as much as 10,000 times as luminous as the Sun. In addition, these stars have diameters very much larger than that of the Sun. As discussed above, some supergiants are so large that if the solar system could be centered in one, the star’s surface would lie beyond the orbit of Mars (see Figure 18.16). We will have to ask, in coming chapters, what process can make a star swell up to such an enormous size, and how long these “swollen” stars can last in their distended state.
                  - 'figure "Figure 18.16 : The Sun and a Supergiant. Here you see how small the Sun looks in comparison to one of the largest known stars: VY Canis Majoris, a supergiant." [ref=f285e161]':
                    - img "Illustration of the Sun and a Supergiant Star. At left, the supergiant star VY Canis Majoris is shown as a large yellow sphere. At the bottom left edge of the supergiant a small rectangle is drawn. This area is enlarged in the inset at right. The Sun is shown as a tiny dot surrounded by a dashed circle representing Earth’s orbit. The surface of the supergiant is drawn running diagonally across the upper right half of the enlargement. The Sun and the orbit of Earth would fit inside VY Canis Majoris many times over." [ref=f285e163]
                  - paragraph [ref=f285e165]: In contrast, the very common red, cool, low-luminosity stars at the lower end of the main sequence are much smaller and more compact than the Sun. An example of such a red dwarf is Ross 614B, with a surface temperature of 2700 K and only 1/2000 of the Sun’s luminosity. We call such a star a dwarf because its diameter is only 1/10 that of the Sun. A star with such a low luminosity also has a low mass (about 1/12 that of the Sun). This combination of mass and diameter means that it is so compressed that the star has an average density about 80 times that of the Sun. Its density must be higher, in fact, than that of any known solid found on the surface of Earth. (Despite this, the star is made of gas throughout because its center is so hot.)
                  - paragraph [ref=f285e166]: The faint, red, main-sequence stars are not the stars of the most extreme densities, however. The white dwarfs, at the lower-left corner of the H–R diagram, have densities many times greater still.
                  - heading "The White Dwarfs" [level=3] [ref=f285e167]
                  - paragraph [ref=f285e168]: The first white dwarf star was detected in 1862. Called Sirius B, it forms a binary system with Sirius A, the brightest-appearing star in the sky. It eluded discovery and analysis for a long time because its faint light tends to be lost in the glare of nearby Sirius A (Figure 18.17). (Since Sirius is often called the Dog Star—being the brightest star in the constellation of Canis Major, the big dog—Sirius B is sometimes nicknamed the Pup.)
                  - figure [ref=f285e169]:
                    - img "Two Views of Sirius and Its White Dwarf Companion. (a) A visible light image taken by the Hubble Space Telescope. Sirius B is the faint speck in the lower left had quadrant of the image, and nearly lost in the glare of bright Sirius A. (b) X-ray image from the Chandra X-ray telescope. Sirius B is much brighter in X-rays and is the bright object at the center of the image. Above and slightly to the right is Sirius A." [ref=f285e171]
                  - paragraph [ref=f285e173]:
                    - text: We have now found thousands of white dwarfs. Table 18.1 shows that about 7% of the true stars (spectral types O–M) in our local neighborhood are white dwarfs. A good example of a typical white dwarf is the nearby star 40 Eridani B. Its surface temperature is a relatively hot 12,000 K, but its luminosity is only 1/275
                    - emphasis [ref=f285e174]: L
                    - subscript [ref=f285e175]: Sun
                    - text: . Calculations show that its radius is only 1.4% of the Sun’s, or about the same as that of Earth, and its volume is 2.5 × 10
                    - superscript [ref=f285e176]: –6
                    - text: that of the Sun. Its mass, however, is 0.57 times the Sun’s mass, just a little more than half. To fit such a substantial mass into so tiny a volume, the star’s density must be about 210,000 times the density of the Sun, or more than 300,000 g/cm
                    - superscript [ref=f285e177]: "3"
                    - text: . A teaspoonful of this material would have a mass of some 1.6 tons! At such enormous densities, matter cannot exist in its usual state; we will examine the particular behavior of this type of matter in The Death of Stars. For now, we just note that white dwarfs are dying stars, reaching the end of their productive lives and ready for their stories to be over.
                  - paragraph [ref=f285e178]: "The British astrophysicist (and science popularizer) Arthur Eddington (1882–1944) described the first known white dwarf this way:"
                  - blockquote [ref=f285e179]:
                    - paragraph [ref=f285e180]: "The message of the companion of Sirius, when decoded, ran: “I am composed of material three thousand times denser than anything you’ve ever come across. A ton of my material would be a little nugget you could put in a matchbox.” What reply could one make to something like that? Well, the reply most of us made in 1914 was, “Shut up; don’t talk nonsense.”"
                  - paragraph [ref=f285e181]: Today, however, astronomers not only accept that stars as dense as white dwarfs exist but (as we will see) have found even denser and stranger objects in their quest to understand the evolution of different types of stars.
                  - heading "Hertzsprung- Russell Diagram" [level=2] [ref=f285e182]
                  - paragraph [ref=f285e183]:
                    - strong [ref=f285e184]: The Hertzsprung-Russell diagram
                    - text: ", also referred to as the H-R Diagram, is a graph of stellar absolute magnitude or luminosity versus their spectral type or photosphere temperature. The H-R Diagram was created circa 1910 by Danish astronomer"
                    - strong [ref=f285e185]: Ejnar Hertzsprung
                    - text: and American astronomer
                    - strong [ref=f285e186]: Henry Norris Russell
                    - text: . Plotting stellar luminosity versus color (temperature) allowed Hertzsprung Russell to see patterns in stars, from groupings of stars to how stars change over time, what is called stellar evolution. Looking at the H-R Diagram, you will first note that numerous stars are plotted. Imagine millions of stars, that is what makes up the diagram itself.
                  - paragraph [ref=f285e187]:
                    - text: The
                    - strong [ref=f285e188]: Hertzsprung- Russell diagram
                    - text: ", or the"
                    - strong [ref=f285e189]: H-R diagram
                    - text: ", is a graph which plots a star’s brightness versus its color. This very-useful graphic was developed around 1910 by Danish astronomer"
                    - strong [ref=f285e190]: Ejnar Hertzsprung
                    - text: and American astronomer
                    - strong [ref=f285e191]: Henry Norris Russell
                    - text: ". The H-R diagram groups stars into four major classes, and shows stellar evolution: how stars change as they fuse the elements in their stellar cores."
                  - paragraph [ref=f285e192]: The H-R diagram itself will appear different than most graphs. Yet, with one glance, you can see stellar groupings, brightness, and colors. The stellar colors are reflective of the star’s photosphere, or surface temperature. The hotter the star, the more bluish it will appear. And, the cooler the star, the more reddish in color.
                  - generic [ref=f285e194]:
                    - text: Hertzsprung-Russell diagram, or H-R diagram. Some 22,000 stars make up the data for this specific illustration. HRDiagram by Richard Powell is licensed under
                    - link "CC BY-SA 2.5" [ref=f285e195]:
                      - /url: https://creativecommons.org/licenses/by-sa/2.5
                  - paragraph [ref=f285e196]: Let’s first examine closely the above H-R diagram illustration.
                  - paragraph [ref=f285e197]:
                    - strong [ref=f285e198]: The Y-axis plots the star’s brightness.
                    - text: "This particular illustration uses a familiar unit: the Sun. So, with the Sun &equals; 1, stars are plotted when compared to the Sun. This is their absolute magnitude or brightness, not how they look in the sky, or apparent magnitude. (A topic discussed in Lab 3."
                    - emphasis [ref=f285e199]: Magnitude and Light Pollution
                    - text: ). For those so inclined, the Y-axis is plotted on a logarithm scale. The Y-axis can also be plotted in absolute magnitude. Most plots are based on the Sun = 1, though.
                  - paragraph [ref=f285e200]: If you also note on the right-hand side of the graph along the Y-axis, you will see numbers and Absolute Magnitude. This is the other way to represent stellar brightness’s.
                  - paragraph [ref=f285e201]:
                    - strong [ref=f285e202]: The X-axis plots the star’s temperature.
                    - text: "Look at the values of the X-axis along the top of the illustration (not the bottom – more on that later). You will note at the very top a line of letters; O B A F G K M. Right below that you will also note numbers; 30000K 10000K 7500K 6000K 5000K 4000K 3000K. These numbers will be our primary focus: they are the star’s photosphere temperature in the Kelvin temperature scale. You are familiar with the Fahrenheit and most likely the Celsius or Centigrade temperature scales. The Kelvin temperature scale is like the Celsius temperature scale, but starts at zero, called absolute zero. There are no negative temperatures on the Kelvin temperature scale; it always starts at zero. Astronomers prefer the Kelvin temperature scale because there are referrals to the coldest temperature in space — which is just above 0K or absolute zero."
                  - paragraph [ref=f285e203]: Some astronomers prefer to use what is known as the Color Index — Colour (B-V) — found along the bottom X-axis on the illustration. This is another way to classify a star’s temperature and color.
                  - figure "Image courtesy of Florida State College at Jacksonville." [ref=f285e204]:
                    - img "A graphic, which shows the location of different star groups on the Hertzsprung-Russell diagram. To the above left, this simplified H-R Diagram shows how stars group according to temperature (Spectral Class) and Luminosity (Absolute Magnitude). Upper stars are bright, whereas stars towards the bottom, or X-Axis, are dim stars. Stars on the left are hot stars; to the right are cool stars. Based on this, groupings of stars become noticeable.." [ref=f285e205]
                  - figure "CC BY-SA 2. 5 | Image courtesy of Richard Powell." [ref=f285e207]:
                    - img "Hertzsprung-Russell diagram. A plot of luminosity (absolute magnitude) against the colour of the stars ranging from the high-temperature blue-white stars on the left side of the diagram to the low temperature red stars on the right side. Converted to png and compressed with pngcrush." [ref=f285e208]
                  - paragraph [ref=f285e210]: The graph also shows the colors of the plotted stars — note the stars on the left of the graph are more blue-white, towards the center yellowish, and on the right red to almost a purple color. That indicates the stellar temperature.
                  - paragraph [ref=f285e211]:
                    - text: As you go higher on the graph, up the Y-axis, the stars are brighter — the stellar luminosity. This can be plotted as the L
                    - subscript [ref=f285e212]: sun
                    - text: with the L
                    - subscript [ref=f285e213]: sun
                    - text: = 1. It can also be plotted as Absolute Magnitude, M.
                  - heading "H-R Diagram for Milky Way Stars" [level=2] [ref=f285e214]
                  - paragraph [ref=f285e215]: "The H-R diagram shown in illustration above provides stellar data in a different way. The four main groups of stars are clearly identified:"
                  - list [ref=f285e216]:
                    - listitem [ref=f285e217]:
                      - strong [ref=f285e218]: "Main Sequence:"
                      - text: most stars, like our Sun; this is the area on the H-R diagram where most stars will spend their stellar lives.
                    - listitem [ref=f285e219]:
                      - strong [ref=f285e220]: "Supergiants:"
                      - text: cool stars which are very large and very bright. These stars generally end with a supernova event and many collapse to become neutron stars and even further collapse to a black hole.
                    - listitem [ref=f285e221]:
                      - strong [ref=f285e222]: "Giants:"
                      - text: cool stars which are a little smaller and dimmer than the Supergiants. The Giants have a different stellar ending than the Supergiants.
                    - listitem [ref=f285e223]:
                      - strong [ref=f285e224]: "White Dwarfs:"
                      - text: very, very hot stars which are very small in size.
                  - paragraph [ref=f285e225]: "This particular H-R diagram is very informative in that it graphically shows relative sizes, (though not to scale), colors (thus temperatures), and in some cases masses when compared to the Sun (for example in the upper left-hand corner: 60 MSUN, which means a star 60 times the mass of the Sun). There are also a number of representative stars shown; for example:"
                  - list [ref=f285e226]:
                    - listitem [ref=f285e227]:
                      - text: "Betelgeuse in the constellation Orion — X-axis: 3000K, Y-axis 10"
                      - superscript [ref=f285e228]: "5"
                      - text: M
                      - subscript [ref=f285e229]: SUN
                    - listitem [ref=f285e230]:
                      - text: "Polaris, the north pole star — X-axis: 6000K, Y-axis between 10"
                      - superscript [ref=f285e231]: "3"
                      - text: and 10
                      - superscript [ref=f285e232]: "4"
                      - text: M
                      - subscript [ref=f285e233]: SUN
                    - listitem [ref=f285e234]:
                      - text: "Sirius, the brightest star visible from Earth after the Sun — X-axis: 9000K, Y-axis 10 and 10"
                      - superscript [ref=f285e235]: "2"
                      - text: M
                      - subscript [ref=f285e236]: SUN
                    - listitem [ref=f285e237]:
                      - text: "Sirius B, the white dwarf companion of Sirius — o X-axis: ~25000K, Y-axis 0.1 and 10-"
                      - superscript [ref=f285e238]: "2"
                      - text: M
                      - subscript [ref=f285e239]: SUN
                    - listitem [ref=f285e240]:
                      - text: "The Sun — X-axis: 6000K, Y-axis 1 M"
                      - subscript [ref=f285e241]: SUN
                  - heading "Four Groups of Stars based on H-R Diagram" [level=3] [ref=f285e242]
                  - paragraph [ref=f285e243]: The H-R Diagram plots stars such that there are four major groups.
                  - paragraph [ref=f285e244]:
                    - text: The
                    - strong [ref=f285e245]: Supergiants
                    - text: are cool stars, which are very large and very bright. They are located towards the top right of the graph.
                  - paragraph [ref=f285e246]:
                    - text: The
                    - strong [ref=f285e247]: Giants
                    - text: are cool stars, which are a little smaller and dimmer than the Supergiants.
                  - paragraph [ref=f285e248]:
                    - text: The
                    - strong [ref=f285e249]: White Dwarfs
                    - text: are very hot stars, which are small in size and relatively dim. They are found in the lower left of the H-R Diagram.
                  - paragraph [ref=f285e250]:
                    - text: The
                    - strong [ref=f285e251]: Main Sequence
                    - text: is a band of stars, which includes most of the stars, like our Sun. These are usually smaller stars, often dwarf stars.
                  - paragraph [ref=f285e252]: The H-R Diagram can also show a star’s life, referred to as Stellar Evolution. During the 1930s, it was found for stars with uniform chemical composition, there is a relationship between stellar mass and the star’s luminosity and diameter.
                  - paragraph [ref=f285e253]: Other important derivations of the Hertzsprung-Russell diagram can be used to show different data, for example classes of stars, protostars, brown dwarf objects, or graphs known as color index and color magnitude diagram.
                  - figure "CC BY 4. 0 | Image courtesy of European Southern Observatory (ESO)." [ref=f285e254]:
                    - img "A Hertzsprung-Russell diagram showing the four major groupings of stars—Supergiants, giants, white dwarfs, and main sequence." [ref=f285e255]
                  - heading "Further Exploration" [level=2] [ref=f285e257]
                  - paragraph [ref=f285e258]:
                    - text: Use this
                    - link "interactive H-R diagram" [ref=f285e259]:
                      - /url: https://openstax.org/l/30interhr
                    - text: to explore the sizes of stars based on their placement. Overlay the closest stars and the brightest stars, and consider where they lie on the figure. How many stars are among both the closest and brightest stars?
