            - application "Rich Text Editor, editarea" [ref=f283e318]:
              - iframe [active] [ref=f283e319]:
                - generic [active] [ref=f285e1]:
                  - heading "Comparing the Properties of Stars" [level=2] [ref=f285e2]
                  - paragraph [ref=f285e3]: In this chapter and Analyzing Starlight, we described some of the characteristics by which we might classify stars and how those are measured. These ideas are summarized in Table 18.2. We have also given an example of a relationship between two of these characteristics in the mass-luminosity relation. When the characteristics of large numbers of stars were measured at the beginning of the twentieth century, astronomers were able to begin a deeper search for patterns and relationships in these data.
                  - table [ref=f285e4]:
                    - caption [ref=f285e5]: "Table 18.2: Measuring the Characteristics of Stars"
                    - rowgroup [ref=f285e6]:
                      - row [ref=f285e7]:
                        - columnheader "Characteristic" [ref=f285e8]
                        - columnheader "Technique" [ref=f285e9]
                    - rowgroup [ref=f285e10]:
                      - row [ref=f285e11]:
                        - cell "Surface temperature" [ref=f285e12]
                        - cell [ref=f285e13]:
                          - paragraph [ref=f285e14]: 1. Determine the color (very rough).
                          - paragraph [ref=f285e15]: 2. Measure the spectrum and get the spectral type.
                      - row [ref=f285e16]:
                        - cell "Chemical composition" [ref=f285e17]
                        - cell "Determine which lines are present in the spectrum." [ref=f285e18]
                      - row [ref=f285e19]:
                        - cell "Luminosity" [ref=f285e20]
                        - cell "Measure the apparent brightness and compensate for distance." [ref=f285e21]
                      - row [ref=f285e22]:
                        - cell "Radial velocity" [ref=f285e23]
                        - cell "Measure the Doppler shift in the spectrum." [ref=f285e24]
                      - row [ref=f285e25]:
                        - cell "Rotation" [ref=f285e26]
                        - cell "Measure the width of spectral lines." [ref=f285e27]
                      - row [ref=f285e28]:
                        - cell "Mass" [ref=f285e29]
                        - cell "Measure the period and radial velocity curves of spectroscopic binary stars." [ref=f285e30]
                      - row [ref=f285e31]:
                        - cell "Diameter" [ref=f285e32]
                        - cell [ref=f285e33]:
                          - paragraph [ref=f285e34]: 1. Measure the way a star’s light is blocked by the Moon.
                          - paragraph [ref=f285e35]: 2. Measure the light curves and Doppler shifts for eclipsing binary stars.
                  - paragraph [ref=f285e36]: To help understand what sorts of relationships might be found, let’s look briefly at a range of data about human beings. If you want to understand humans by comparing and contrasting their characteristics—without assuming any previous knowledge of these strange creatures—you could try to determine which characteristics lead you in a fruitful direction. For example, you might plot the heights of a large sample of humans against their weights (which is a measure of their mass). Such a plot is shown in Figure 18.12 and it has some interesting features. In the way we have chosen to present our data, height increases upward, whereas weight increases to the left. Notice that humans are not randomly distributed in the graph. Most points fall along a sequence that goes from the upper left to the lower right.
                  - 'figure "Figure 18.12 : Height versus Weight. The plot of the heights and weights of a representative group of human beings. Most points lie along a “main sequence” representing most people, but there are a few exceptions." [ref=f285e37]':
                    - img "Graph of Height Versus Weight. The vertical axis is labeled “Height” in arbitrary units. The horizontal axis is labeled “Weight” in arbitrary units. A plot of dots shows a general trend of weight increasing as height increases, with a few outliers above and below." [ref=f285e39]
                  - paragraph [ref=f285e41]: We can conclude from this graph that human height and weight are related. Generally speaking, taller human beings weigh more, whereas shorter ones weigh less. This makes sense if you are familiar with the structure of human beings. Typically, if we have bigger bones, we have more flesh to fill out our larger frame. It’s not mathematically exact—there is a wide range of variation—but it’s not a bad overall rule. And, of course, there are some dramatic exceptions. You occasionally see a short human who is very overweight and would thus be more to the bottom left of our diagram than the average sequence of people. Or you might have a very tall, skinny fashion model with great height but relatively small weight, who would be found near the upper right.
                  - paragraph [ref=f285e42]: A similar diagram has been found extremely useful for understanding the lives of stars. In 1913, American astronomer Henry Norris Russell plotted the luminosities of stars against their spectral classes (a way of denoting their surface temperatures). This investigation, and a similar independent study in 1911 by Danish astronomer Ejnar Hertzsprung, led to the extremely important discovery that the temperature and luminosity of stars are related (Figure 18.13).
                  - 'figure "Figure 18.13 : Hertzsprung (1873–1967) and Russell (1877–1957). (a) Ejnar Hertzsprung and (b) Henry Norris Russell independently discovered the relationship between the luminosity and surface temperature of stars that is summarized in what is now called the H–R diagram." [ref=f285e43]':
                    - img "Photographs of (a) Ejnar Hertzsprung and (b) Henry Norris Russell." [ref=f285e45]
                  - paragraph [ref=f285e47]
                  - heading "Features of the H–R Diagram" [level=3] [ref=f285e48]
                  - paragraph [ref=f285e49]:
                    - text: Following Hertzsprung and Russell, let us plot the temperature (or spectral class) of a selected group of nearby stars against their luminosity and see what we find (Figure 18.14). Such a plot is frequently called the
                    - emphasis [ref=f285e50]: Hertzsprung–Russell diagram
                    - text: ", abbreviated H–R diagram. It is one of the most important and widely used diagrams in astronomy, with applications that extend far beyond the purposes for which it was originally developed more than a century ago."
                  - 'figure "Figure 18.14 : H–R Diagram for a Selected Sample of Stars. In such diagrams, luminosity is plotted along the vertical axis. Along the horizontal axis, we can plot either temperature or spectral type (also sometimes called spectral class). Several of the brightest stars are identified by name. Most stars fall on the main sequence." [ref=f285e51]':
                    - img [ref=f285e53]
                  - paragraph [ref=f285e55]:
                    - text: It is customary to plot H–R diagrams in such a way that temperature increases toward the left and luminosity toward the top. Notice the similarity to our plot of height and weight for people (Figure 18.12). Stars, like people, are not distributed over the diagram at random, as they would be if they exhibited all combinations of luminosity and temperature. Instead, we see that the stars cluster into certain parts of the H–R diagram. The great majority are aligned along a narrow sequence running from the upper left (hot, highly luminous) to the lower right (cool, less luminous). This band of points is called the main sequence. It represents a relationship between
                    - emphasis [ref=f285e56]: temperature
                    - text: and
                    - emphasis [ref=f285e57]: luminosity
                    - text: that is followed by most stars. We can summarize this relationship by saying that hotter stars are more luminous than cooler ones.
                  - paragraph [ref=f285e58]:
                    - text: A number of stars, however, lie above the main sequence on the H–R diagram, in the upper-right region, where stars have low temperature and high luminosity. How can a star be at once cool, meaning each square meter on the star does not put out all that much energy, and yet very luminous? The only way is for the star to be enormous—to have so many square meters on its surface that the
                    - emphasis [ref=f285e59]: total
                    - text: energy output is still large. These stars must be
                    - emphasis [ref=f285e60]: giants
                    - text: or
                    - emphasis [ref=f285e61]: supergiants
                    - text: ", the stars of huge diameter we discussed earlier."
                  - paragraph [ref=f285e62]: There are also some stars in the lower-left corner of the diagram, which have high temperature and low luminosity. If they have high surface temperatures, each square meter on that star puts out a lot of energy. How then can the overall star be dim? It must be that it has a very small total surface area; such stars are known as white dwarfs (white because, at these high temperatures, the colors of the electromagnetic radiation that they emit blend together to make them look bluish-white). We will say more about these puzzling objects in a moment. Figure 18.15 is a schematic H–R diagram for a large sample of stars, drawn to make the different types more apparent.
                  - 'figure "Figure 18.15 : Schematic H–R Diagram for Many Stars. Ninety percent of all stars on such a diagram fall along a narrow band called the main sequence. A minority of stars are found in the upper right; they are both cool (and hence red) and bright, and must be giants. Some stars fall in the lower left of the diagram; they are both hot and dim, and must be white dwarfs." [ref=f285e63]':
                    - img [ref=f285e65]
                  - paragraph [ref=f285e67]: Now, think back to our discussion of star surveys. It is difficult to plot an H–R diagram that is truly representative of all stars because most stars are so faint that we cannot see those outside our immediate neighborhood. The stars plotted in Figure 18.14 were selected because their distances are known. This sample omits many intrinsically faint stars that are nearby but have not had their distances measured, so it shows fewer faint main-sequence stars than a “fair” diagram would. To be truly representative of the stellar population, an H–R diagram should be plotted for all stars within a certain distance. Unfortunately, our knowledge is reasonably complete only for stars within 10 to 20 light-years of the Sun, among which there are no giants or supergiants. Still, from many surveys (and more can now be done with new, more powerful telescopes), we estimate that about 90% of the true stars overall (excluding brown dwarfs) in our part of space are main-sequence stars, about 10% are white dwarfs, and fewer than 1% are giants or supergiants.
                  - paragraph [ref=f285e68]: These estimates can be used directly to understand the lives of stars. Permit us another quick analogy with people. Suppose we survey people just like astronomers survey stars, but we want to focus our attention on the location of young people, ages 6 to 18 years. Survey teams fan out and take data about where such youngsters are found at all times during a 24-hour day. Some are found in the local pizza parlor, others are asleep at home, some are at the movies, and many are in school. After surveying a very large number of young people, one of the things that the teams determine is that, averaged over the course of the 24 hours, one-third of all youngsters are found in school.
                  - paragraph [ref=f285e69]:
                    - text: How can they interpret this result? Does it mean that two-thirds of students are truants and the remaining one-third spend all their time in school? No, we must bear in mind that the survey teams counted youngsters throughout the full 24-hour day. Some survey teams worked at night, when most youngsters were at home asleep, and others worked in the late afternoon, when most youngsters were on their way home from school (and more likely to be enjoying a pizza). If the survey was truly representative, we
                    - emphasis [ref=f285e70]: can
                    - text: conclude, however, that if an average of one-third of all youngsters are found in school, then humans ages 6 to 18 years must spend about one-third of
                    - emphasis [ref=f285e71]: their time
                    - text: in school.
                  - paragraph [ref=f285e72]: We can do something similar for stars. We find that, on average, 90% of all stars are located on the main sequence of the H–R diagram. If we can identify some activity or life stage with the main sequence, then it follows that stars must spend 90% of their lives in that activity or life stage.
                  - heading "Understanding the Main Sequence" [level=3] [ref=f285e73]
                  - paragraph [ref=f285e74]: "In The Sun: A Nuclear Powerhouse, we discussed the Sun as a representative star. We saw that what stars such as the Sun “do for a living” is to convert protons into helium deep in their interiors via the process of nuclear fusion, thus producing energy. The fusion of protons to helium is an excellent, long-lasting source of energy for a star because the bulk of every star consists of hydrogen atoms, whose nuclei are protons."
                  - paragraph [ref=f285e75]: Our computer models of how stars evolve over time show us that a typical star will spend about 90% of its life fusing the abundant hydrogen in its core into helium. This then is a good explanation of why 90% of all stars are found on the main sequence in the H–R diagram. But if all the stars on the main sequence are doing the same thing (fusing hydrogen), why are they distributed along a sequence of points? That is, why do they differ in luminosity and surface temperature (which is what we are plotting on the H–R diagram)?
                  - paragraph [ref=f285e76]:
                    - text: "To help us understand how main-sequence stars differ, we can use one of the most important results from our studies of model stars. Astrophysicists have been able to show that the structure of stars that are in equilibrium and derive all their energy from nuclear fusion is completely and uniquely determined by just two quantities: the"
                    - emphasis [ref=f285e77]: total mass
                    - text: and the
                    - emphasis [ref=f285e78]: composition
                    - text: of the star. This fact provides an interpretation of many features of the H–R diagram.
                  - paragraph [ref=f285e79]: Imagine a cluster of stars forming from a cloud of interstellar “raw material” whose chemical composition is similar to the Sun’s. (We’ll describe this process in more detail in The Birth of Stars and Discovery of Planets outside the Solar System, but for now, the details will not concern us.) In such a cloud, all the clumps of gas and dust that become stars begin with the same chemical composition and differ from one another only in mass. Now suppose that we compute a model of each of these stars for the time at which it becomes stable and derives its energy from nuclear reactions, but before it has time to alter its composition appreciably as a result of these reactions.
                  - paragraph [ref=f285e80]: The models calculated for these stars allow us to determine their luminosities, temperatures, and sizes. If we plot the results from the models—one point for each model star—on the H–R diagram, we get something that looks just like the main sequence we saw for real stars.
                  - paragraph [ref=f285e81]: And here is what we find when we do this. The model stars with the largest masses are the hottest and most luminous, and they are located at the upper left of the diagram.
                  - paragraph [ref=f285e82]:
                    - text: The least-massive model stars are the coolest and least luminous, and they are placed at the lower right of the plot. The other model stars all lie along a line running diagonally across the diagram. In other words,
                    - emphasis [ref=f285e83]: the main sequence turns out to be a sequence of stellar masses
                    - text: .
                  - paragraph [ref=f285e84]: This makes sense if you think about it. The most massive stars have the most gravity and can thus compress their centers to the greatest degree. This means they are the hottest inside and the best at generating energy from nuclear reactions deep within. As a result, they shine with the greatest luminosity and have the hottest surface temperatures. The stars with lowest mass, in turn, are the coolest inside and least effective in generating energy. Thus, they are the least luminous and wind up being the coolest on the surface. Our Sun lies somewhere in the middle of these extremes (as you can see in Figure 18.14). The characteristics of representative main-sequence stars (excluding brown dwarfs, which are not true stars) are listed in Table 18.3.
                  - table [ref=f285e85]:
                    - caption [ref=f285e86]: "Table 18.3: Characteristics of Main-Sequence Stars"
