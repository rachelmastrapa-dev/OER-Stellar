        - generic [ref=f633e99]:
          - heading "Margaret Geller" [level=2] [ref=f633e100]
          - paragraph [ref=f633e101]: Born in 1947, Margaret Geller is the daughter of a chemist who encouraged her interest in science and helped her visualize the three-dimensional structure of molecules as a child. (It was a skill that would later come in very handy for visualizing the three-dimensional structure of the universe.) She remembers being bored in elementary school, but she was encouraged to read on her own by her parents. Her recollections also include subtle messages from teachers that mathematics (her strong early interest) was not a field for girls, but she did not allow herself to be deterred.
          - paragraph [ref=f633e102]: Geller obtained a BA in physics from the University of California at Berkeley and became the second woman to receive a PhD in physics from Princeton. There, while working with James Peebles, one of the world’s leading cosmologists, she became interested in problems relating to the large-scale structure of the universe. In 1980, she accepted a research position at the Harvard-Smithsonian Center for Astrophysics, one of the nation’s most dynamic institutions for astronomy research. She saw that to make progress in understanding how galaxies and clusters are organized, a far more intensive series of surveys was required. Although it would not bear fruit for many years, Geller and her collaborators began the long, arduous task of mapping the galaxies (Figure 28.20).
          - 'figure "Figure 28.20 : Margaret Geller. Geller’s work mapping and researching galaxies has helped us to better understand the structure of the universe. (credit: modification of work by Massimo Ramella)" [ref=f633e103]':
            - img "Photograph of Margaret Geller." [ref=f633e105]
          - paragraph [ref=f633e107]: Her team was fortunate to be given access to a telescope that could be dedicated to their project, the 60-inch reflector on Mount Hopkins, near Tucson, Arizona, where they and their assistants took spectra to determine galaxy distances. To get a slice of the universe, they pointed their telescope at a predetermined position in the sky and then let the rotation of Earth bring new galaxies into their field of view. In this way, they measured the positions and redshifts of over 18,000 galaxies and made a wide range of interesting maps to display their data. Their surveys now include “slices” in both the Northern and Southern Hemispheres.
          - paragraph [ref=f633e108]:
            - text: As news of her important work spread beyond the community of astronomers, Geller received a MacArthur Foundation Fellowship in 1990. These fellowships, popularly called “genius awards,” are designed to recognize truly creative work in a wide range of fields. Geller continues to have a strong interest in visualization and has (with filmmaker Boyd Estus) made several award-winning videos explaining her work to nonscientists (one is titled
            - emphasis [ref=f633e109]: So Many Galaxies
            - text: . . .
            - emphasis [ref=f633e110]: So Little Time
            - text: ). She has appeared on a variety of national news and documentary programs, including the
            - emphasis [ref=f633e111]: MacNeil
            - text: /
            - emphasis [ref=f633e112]: Lehrer NewsHour
            - text: ","
            - emphasis [ref=f633e113]: The Astronomers
            - text: ", and"
            - emphasis [ref=f633e114]: The Infinite Voyage
            - text: . Energetic and outspoken, she has given talks on her work to many audiences around the country, and works hard to find ways to explain the significance of her pioneering surveys to the public.
          - paragraph [ref=f633e115]:
            - emphasis [ref=f633e116]: “It’s exciting to discover something that nobody’s seen before. [To be] one of the first three people to ever see that slice of the universe [was] sort of being like Columbus. . . . Nobody expected such a striking pattern!”
            - text: —Margaret Geller
