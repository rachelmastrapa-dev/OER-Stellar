            - list [ref=f355e193]:
              - listitem [ref=f355e194]: On the far left, there is a group of red, blue, and yellow dots labelled "Old group" representing the oldest stars in the diagram.
              - listitem [ref=f355e195]: In the "Old group" most of the stars are red. Of the 26 stars, 6 are yellow and 4 are blue.
              - listitem [ref=f355e196]: To the right of the old group is another group of stars with some empty space between the two groups. The stars in this group are slightly smaller than the Old group. Of the 15 stars, 5 are red, 5 are yellow, 5 are blue.
              - listitem [ref=f355e197]: There is a double arrowed line indicating the space between the old group and the next group of stars, labeled 100 LY (light-years.)
              - listitem [ref=f355e198]: A third group of stars is to the right of the other two groups. It is labeled "Young group." These stars are smaller compared to the other two groups. Of the 16 stars, 3 are red, 4 are yellow, 9 are blue.
              - listitem [ref=f355e199]: To the right of the young groups is a light blue cloud labelled "Molecular cloud"
              - listitem [ref=f355e200]: On the left side of the cloud, there is a ring of brighter blue labeled "Compressed gas."
              - listitem [ref=f355e201]: Inside the ring there are 9 dots labeled "Protostars." Of the 9 protostars, 2 are red, 2 are yellow, and 5 are blue.
