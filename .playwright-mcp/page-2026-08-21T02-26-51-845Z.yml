          - generic [ref=f355e99]:
            - heading "Figure 11.1.1 Dust and Dense Globules in M16" [level=2] [ref=f355e100]
            - paragraph [ref=f355e101]: Two Images of the Eagle Nebula (M16).
            - generic [ref=f355e102]:
              - heading "Image (a)" [level=3] [ref=f355e103]
              - list [ref=f355e104]:
                - listitem [ref=f355e105]: The image on the left includes the central region of the nebula is mostly bright green gas, with two huge columns of gas and dust in the center
                - listitem [ref=f355e106]: The columns are orange-red and darker compared to the bright green nebula.
                - listitem [ref=f355e107]: Several bright, reddish star and dark space form the background.
            - generic [ref=f355e108]:
              - heading "Image (b)" [level=3] [ref=f355e109]
              - list [ref=f355e110]:
                - listitem [ref=f355e111]: The image on the right is a close-up of one of the leftmost column in Image (a) has the bright top of the column in the center.
                - listitem [ref=f355e112]: Along the bright portion of the top edge of the column, thin wisps of gas are radiating off and away from the pillar. This structure is known as an evaporating gas globule (EGG).
                - listitem [ref=f355e113]: The bright region at the top is yellow and has a complicated, cloud-like structure.
                - listitem [ref=f355e114]: The lower, darker part of the column is also cloud-like, but more uniform and less complex than the top.
          - generic [ref=f355e115]:
            - heading "Figure 11.1.2 Orion in Visible and Infrared" [level=2] [ref=f355e116]
            - paragraph [ref=f355e117]: Orion in visible and infrared light.
            - generic [ref=f355e118]:
              - heading "Image (a)" [level=3] [ref=f355e119]
              - list [ref=f355e120]:
                - listitem [ref=f355e121]: The image on the left includes the stars that make up Orion. They are brighter than most of the background stars in visible light.
                - listitem [ref=f355e122]:
                  - text: Blue lines have been drawn on the image to connect the stars of Orion.
                  - list [ref=f355e123]:
                    - listitem [ref=f355e124]: At the top of Orion, three stars form a triangle. The top stars is near Orion's head.
                    - listitem [ref=f355e125]: The bottom two stars of the triangle form a trapezoid with two stars below them. The top two stars, Orion's shoulders, are farther apart from each other than the two stars at the bottom of the trapezoid. There is another bright star in between the two stars at the bottom. The three stars together form Orion's belt.
                    - listitem [ref=f355e126]: From the belt, several bright stars extended downward to form Orion's sword.
                    - listitem [ref=f355e127]: Below the belt, two more stars form a rough trapezoid shape with the belt. The two bottom stars, Orion's feet are roughly the same distance apart as the shoulders.
                - listitem [ref=f355e128]: Many small, white stars and dark space form the background.
            - generic [ref=f355e129]:
              - heading "Image (b)" [level=3] [ref=f355e130]
              - list [ref=f355e131]:
                - listitem [ref=f355e132]: The infrared image, on the right, of the same part of the sky is mostly red with large yellow clumps and orange swirls. This complex structure that extends much farther than the constellation is the Orion molecular cloud.
                - listitem [ref=f355e133]: There are bright yellow clumps at Orion's head, the left side of the belt, and the bottom of the sword. There are several more clumps unrelated to the shape of the constellation.
                - listitem [ref=f355e134]: Most of the stars in Image (a) are absent from this image, except for Betelgeuse, Orion's left shoulder. Betelgeuse is cooler than the other stars, and therefore gives off more infrared light.
          - generic [ref=f355e135]:
            - heading "Figure 11.1.3 Orion Nebula" [level=2] [ref=f355e136]
            - paragraph [ref=f355e137]: Two images of the Orion Nebula in visible and infrared light.
            - generic [ref=f355e138]:
