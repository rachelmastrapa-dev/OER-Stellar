                - listitem [ref=f355e142]:
                  - text: The nebula has an overall butterfly shape that is rotated 45 degrees clockwise.
                  - list [ref=f355e143]:
                    - listitem [ref=f355e144]: The wings of the butterfly are red, surrounded by bright wisps of light pink and dark blue.
                    - listitem [ref=f355e145]: There are a few long dark clouds where the butterfly's antennae would be.
                - listitem [ref=f355e146]: Many white stars and dark space form the background, and surround the nebula at the center.
            - generic [ref=f355e147]:
