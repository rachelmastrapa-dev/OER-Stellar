                  - paragraph [ref=f375e103]: Planetary nebula shells usually expand at speeds of 20–30 km/s, and a typical planetary nebula has a diameter of about 1 light-year. If we assume that the gas shell has expanded at a constant speed, we can calculate that the shells of all the planetary nebulae visible to us were ejected within the past 50,000 years at most. After this amount of time, the shells have expanded so much that they are too thin and tenuous to be seen. That’s a pretty short time that each planetary nebula can be observed, when compared to the whole lifetime of the star. Given the number of such nebulae we nevertheless see, we must conclude that a large fraction of all stars evolve through the planetary nebula phase. Since we saw that low-mass stars are much more common than high-mass stars, this confirms our view of planetary nebulae as the end of low-mass star evolution.
                  - heading "Cosmic Recycling" [level=3] [ref=f375e104]
                  - paragraph [ref=f375e105]: The loss of mass by dying stars is a key step in a gigantic cosmic recycling scheme. Stars form from vast clouds of gas and dust. As they end their lives, stars return part of their gas to the galactic reservoirs of raw material. Eventually, some of the expelled material from aging stars will participate in the formation of new star systems. However, the atoms returned by an aging star are not necessarily the same ones it received initially. The star, after all, has fused hydrogen and helium to form new elements over the course of its life. During the red-giant stage, material from the star’s central regions is dredged up and mixed with its outer layers, which can cause further nuclear reactions and the creation of still more new elements. As a result, the winds that blow outward from such stars include atoms that were created inside the stars’ cores. In this way, the raw material of the Milky Way Galaxy is not only resupplied but also receives infusions of new elements.
                  - heading "The Fate of the Sun and Earth" [level=2] [ref=f375e106]
                  - paragraph [ref=f375e107]: How will the evolution of the Sun affect conditions on Earth in the future? Although the Sun has appeared reasonably steady in size and luminosity over recorded human history, that brief span means nothing compared with the timescales we have been discussing. Let’s examine the long-term prospects for our planet.
                  - paragraph [ref=f375e108]: The Sun took its place on the zero-age main sequence approximately 4.5 billion years ago. At that time, it emitted only about 70% of the energy that it radiates today. One might expect that Earth would have been a lot colder than it is now, with the oceans frozen solid. But if this were the case, it would be hard to explain why simple life forms existed when Earth was less than a billion years old. Scientists now think that the explanation may be that much more carbon dioxide was present in Earth’s atmosphere when it was young, and that a much stronger greenhouse effect kept Earth warm. The greenhouse effect is when gases like carbon dioxide or water vapor allow the Sun’s light to reach Earth's surface. However, they absorb the infrared radiation from the ground preventing its escape back into space, and increasing the temperature near Earth’s surface.
                  - paragraph [ref=f375e109]: Carbon dioxide in Earth’s atmosphere has steadily declined as the Sun has increased in luminosity. As the brighter Sun increases the temperature of Earth, the warmer ocean absorbs carbon dioxide and converts it to minerals that settle on the bottom of the ocean. Plant life also absorbs carbon dioxide and releases oxygen, which is not a greenhouse gas. The warmer Sun and the weaker greenhouse effect have kept Earth at a nearly constant temperature for most of its life. This remarkable coincidence, which has resulted in fairly stable climatic conditions, has been the key in the development of complex life-forms on our planet.
                  - paragraph [ref=f375e110]: As a result of changes caused by the buildup of helium in its core, the Sun will continue to increase in luminosity as it grows older, and more and more light will reach Earth. For a while, the amount of carbon dioxide will continue to decrease. This effect counteracts increases in carbon dioxide from human activities, but on a much slower timescale. It will be unable to undo the changes in climate that are likely to occur in the next 100 years.
                  - paragraph [ref=f375e111]: Eventually, the heating of Earth will melt the polar caps and increase the evaporation of the oceans. Water vapor is also an efficient greenhouse gas and will more than compensate for the decrease in carbon dioxide. Atmospheric models are not yet good enough to say exactly when, but estimates range from 500 million to 2 billion years, the increased water vapor will cause a runaway greenhouse effect.
                  - paragraph [ref=f375e112]: About 1 billion years from now, Earth will lose its water. The higher temperatures will bake the carbon dioxide out of the empty ocean beds, creating a thick, hot atmosphere. In the upper atmosphere, sunlight will break down water vapor into hydrogen, and the fast-moving hydrogen atoms will escape into outer space. Earth will start to resemble the Venus of today, and temperatures will become much too high for life as we know it.
                  - paragraph [ref=f375e113]: All of this will happen before the Sun even becomes a red giant. The Sun, as it expands, will swallow Mercury and Venus, and friction with our star’s outer atmosphere will make these planets spiral inward until they are completely destroyed. It is not completely clear whether Earth will escape a similar fate. As described in this chapter, the Sun will lose some of its mass as it becomes a red giant. The gravitational pull of the Sun decreases when it loses mass. The result would be that the diameter of Earth’s orbit would increase. However, recent calculations also show that forces due to the tides raised on the Sun by Earth will act in the opposite direction, causing Earth’s orbit to shrink. Thus, many astrophysicists conclude that Earth will be destroyed along with Mercury and Venus. Whether or not this dire prediction is true, there is little doubt that all life on Earth will surely be incinerated. But don’t worry about this since we are talking about events that will occur billions of years from now.
                  - paragraph [ref=f375e114]: What then are the prospects for preserving Earth life as we know it? The first strategy you might think of would be to move humanity to a more distant and cooler planet. However, calculations indicate that there are long periods of time, up to several hundred million years, when no planet is habitable. For example, Earth becomes far too warm for life long before Mars warms up enough.
                  - paragraph [ref=f375e115]: A better alternative may be to move the entire Earth progressively farther from the Sun. The idea is to use gravity in the same way NASA has used it to send spacecraft to distant planets. When a spacecraft flies near a planet, the planet’s motion can be used to speed up the spacecraft, slow it down, or redirect it. Calculations show that if we were to redirect an asteroid so that it follows just the right orbit between Earth and Jupiter, it could transfer orbital energy from Jupiter to Earth and move Earth slowly outward, pulling us away from the expanding Sun on each flyby. Since we have hundreds of millions of years to change Earth’s orbit, the effect of each flyby need not be large.
                  - paragraph [ref=f375e116]: It may seem crazy to think about projects to move an entire planet to a different orbit. But remember that we are talking about the distant future when our technology is likely to be far more sophisticated than it is today. It may also be that if humans survive for hundreds of millions of years, we may spread to planets or habitats around other stars. Indeed, Earth, by then, might be a museum world to which youngsters from other planets return to learn about the origin of our species. It is also possible that evolution will by then have changed us in ways that allow us to survive in very different environments. Wouldn’t it be exciting to see how the story of the human race turns out after all those billions of years?
