                  - heading "Older Stars" [level=2] [ref=f375e2]
                  - paragraph [ref=f375e3]:
                    - text: So far, the life story starts as a contracting protostar, then lives most of its life as a stable main-sequence star, and eventually moves off the main sequence toward the red-giant region. During this time, the star continues the process of
                    - strong [ref=f375e4]:
                      - link "nucleosynthesis" [ref=f375e5]:
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#nucleosynthesis
                    - text: ", building heavy elements out of lighter ones. The pace at which each star goes through these stages depends on its mass, with more massive stars evolving more quickly. But after this point, the life stories of stars of different masses diverge, with a wider range of possible behavior according to their masses, their compositions, and the presence of any nearby companion stars. Instead of reviewing all the possible ways aging stars can behave, we will focus only on the key stages in the evolution of single stars and show how the evolution of high-mass stars differs from that of low-mass stars."
                  - heading "Helium Fusion" [level=3] [ref=f375e6]
                  - paragraph [ref=f375e7]:
                    - text: This section will discuss the aging of stars with initial masses up to twice the mass of the Sun, or 0.8 to 2.0
                    - generic [ref=f375e8]:
                      - text: M
                      - subscript [ref=f375e9]: Sun
                    - text: . We consider the initial masses of stars because, as we will see, stars can lose a lot of mass in the process of aging and dying. Because there are many more low-mass stars than high-mass stars in the Milky Way, the vast majority of stars, including our Sun, follow the scenario we are about to relate.
                  - paragraph [ref=f375e10]:
                    - text: Remember that red giants start out with a helium core where no energy generation is taking place, surrounded by a shell where hydrogen is undergoing fusion. The core, having no source of energy to oppose the inward pull of gravity, is shrinking and growing hotter. As time goes on, the temperature in the core can rise to 100 million K. At this temperature, three helium atoms can begin to fuse to form a single carbon nucleus. This process is called the
                    - strong [ref=f375e11]:
                      - link "triple-alpha process" [ref=f375e12]:
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#triple-alpha process
                    - text: ", 3He→ C. It is named after the nucleus of the helium atom, also known as an alpha particle."
                  - paragraph [ref=f375e13]: You might wonder why the next major step in nuclear fusion in stars involves three helium nuclei and not just two. Although it is a lot easier to get two helium nuclei to collide, the product of this collision is not stable and falls apart very quickly. Each helium nucleus has two positive protons, and positive charges repel each other with a force that gets stronger with the number of particles. It takes a temperature of 100 million K to slam three helium nuclei, six protons, together and make them stick. When that happens, the star produces a carbon nucleus.
                  - paragraph [ref=f375e14]:
                    - text: When the triple-alpha process begins in low-mass stars, calculations show that the entire core is ignited in a quick burst of fusion called a
                    - strong [ref=f375e15]:
                      - link "helium flash" [ref=f375e16]:
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#helium flash
                    - text: . More massive stars also ignite helium but more gradually and not with a flash. As soon as the temperature at the center of the star becomes high enough to start the triple-alpha process, the extra energy released is transmitted quickly through the entire helium core, producing very rapid heating. The heating speeds up the nuclear reactions, which provide more heating, and which accelerates the nuclear reactions even more. We have runaway generation of energy, which reignites the entire helium core in a flash.
                  - paragraph [ref=f375e17]: Stop reading for a moment and look at your little finger. It’s full of carbon atoms because carbon is a fundamental chemical building block for life on Earth. Each of those carbon atoms was once inside a red giant star and was fused from helium nuclei in the triple-alpha process. All the carbon on Earth was fused together by previous generations of stars. Remember that our own atoms originated among the stars. We are all made of stardust.
                  - heading "Becoming a Giant Again" [level=3] [ref=f375e18]
                  - paragraph [ref=f375e19]: "To review, a low-mass star, like the Sun, spends most of its lifetime on the main sequence, fusing hydrogen. Figure \\(\\PageIndex{1}\\) is an H-R diagram with the evolutionary track, the black line with arrows, of a star with the same initial mass as the Sun. Each section of the track is labeled (a) through (d). The section of the track labeled (a) is when the star runs out of hydrogen in its core, it moves off of the Main sequence, which is represented by a red line, to the upper right of the chart. The star's surface temperature decreases and its luminosity increases as it becomes a red giant. When it is hot enough, it begins fusing helium into carbon. The section of the track labeled (b) represents the core helium flash in the upper right corner of the chart."
                  - paragraph [ref=f375e20]: After the helium flash, the star readjusts to the release of energy from the triple-alpha process in its core. Its surface temperature increases and its overall luminosity decreases. This is represented by a dashed line that moves down and to the left of section (b) and stops at a point halfway between section (b) and the main sequence. The dashed line represents a section of the star's evolution where the changes are so rapid that they are difficult to model. The star then continues to fuse the helium in its core for a while, returning to the kind of equilibrium between pressure and gravity that characterized the main-sequence stage. This is represented by the end of the dashed-line section, labeled (c). During this time, a newly formed carbon nucleus at the center of the star can sometimes be joined by another helium nucleus to produce a nucleus of oxygen, another building block of life.
                  - figure [ref=f375e21]:
                    - img "An H-R Diagram with model results of the Sun. Details in caption." [ref=f375e22]
                    - generic [ref=f375e23]:
                      - text: "Figure \\(\\PageIndex{1}\\): Evolutionary Path of the Sun. After leaving the main sequence, the Sun will go through several phases of increasing and decreasing luminosity and temperature. ("
                      - link "CC BY" [ref=f375e24]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f375e25]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f375e26]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f375e27]':
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.4.1_Evolutionary_Path_of_the_Sun
                      - text: .
                  - paragraph [ref=f375e28]: However, at a temperature of 100 million K, the inner core is converting its helium fuel to carbon, and a bit of oxygen, at a rapid rate. The new period of stability is much shorter than the main-sequence stage. Soon, all the helium hot enough for fusion will be used up, just like the hot hydrogen that was used up earlier in the star’s evolution. Once again, the inner core will not be able to generate energy via fusion. Once more, gravity will take over, and the core will start to shrink again. The shrinking of the core releases heat that makes the star decrease in temperature and grow in size and luminosity, becoming a giant again. The section of the track labeled (d) extends up and to the right from section (c) and ends close to section (b). Heat released by the shrinking of the carbon and oxygen core also flows into a shell of helium just above the core. This helium, which had not been hot enough for fusion into carbon earlier, is heated just enough for fusion to begin and to generate a new flow of energy. The end point of track section (d) is labeled Helium shell flashes.
                  - paragraph [ref=f375e29]: "Farther out in the star, there is also a shell where fresh hydrogen has been heated enough to fuse helium. The star now has a multi-layered structure like an onion. Figure \\(\\PageIndex{2}\\) is an illustration of a star at this stage, including a carbon-oxygen core, surrounded by a shell of helium fusion, a layer of helium, a shell of hydrogen fusion, and finally, the extended outer layers of the star. As energy flows outward from the two fusion shells, once again the outer regions of the star begin to expand. Its brief period of stability is over. The star moves back to the red-giant domain on the H–R diagram for a short time. But this is a brief and final burst of glory."
                  - figure [ref=f375e30]:
                    - img "Layers inside a low-mass star before death. Details in caption." [ref=f375e31]
                    - generic [ref=f375e32]:
                      - text: "Figure \\(\\PageIndex{2}\\): Layers in an Old Low-Mass Star. A low-mass star near the end of its life has a layered interior structure separated by composition. ("
                      - link "CC BY" [ref=f375e33]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f375e34]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f375e35]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f375e36]':
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.4.2_Layers_in_an_Old_Low-Mass_Star
                      - text: .
                  - paragraph [ref=f375e37]: Recall that the last time the star was in this predicament, helium fusion came to its rescue. The temperature at the star’s center eventually became hot enough for the product of the previous step of fusion, helium, to become the fuel for the next step, helium fusing into carbon. But the step after the fusion of helium nuclei requires a temperature so hot that lower-mass stars cannot compress their cores to reach it. No further types of fusion are possible for such a star.
                  - paragraph [ref=f375e38]: "In a star with a mass similar to that of the Sun, the formation of a carbon-oxygen core thus marks the end of the generation of nuclear energy at the center of the star. The star must now confront the fact that its death is near. Table \\(\\PageIndex{1}\\) summarizes the stages discussed so far in the life of a star with the same mass as that of the Sun. One thing that gives us confidence in our calculations of stellar evolution is that when we make H–R diagrams of older clusters, we actually see stars in each of the stages that we have been discussing."
                  - table [ref=f375e39]:
                    - caption [ref=f375e40]: "Table \\(\\PageIndex{1}\\): The Evolution of a Star with the Sun’s Mass"
