                      - text: .
                  - paragraph [ref=f375e94]: "Figure \\(\\PageIndex{3}\\) demonstrates that planetary nebulae can be many different shapes. Sometimes a planetary nebula appears to be a simple ring. Others have faint shells surrounding the bright ring, which is evidence that there were multiple episodes of mass loss when the star was a red giant, such as Image (d) in Figure \\(\\PageIndex{3}\\). In a few cases, we see two lobes of matter flowing in opposite directions. Many astronomers think that a considerable number of planetary nebulae basically consist of the same structure, but that the shape we see depends on the viewing angle. According to this idea, the dying star is surrounded by a very dense, doughnut-shaped disk of gas. Theorists do not yet have a definite explanation for why the dying star should produce this ring, but many think that the structure is caused by binary stars."
                  - paragraph [ref=f375e95]: "Figure \\(\\PageIndex{4}\\) is a schematic of a planetary nebula and examples of how it would appear when viewed from different locations. The basic shape is a hot central star surrounded by a thick torus, or doughnut-shaped disk of gas. The star’s wind cannot flow out into space very easily in the direction of the torus, but can escape more freely in the two directions perpendicular to it. If we view the nebula along the direction of the flow, as we may be observing the Helix Nebula, it will appear nearly circular. If we look along the equator of the torus, we see both outflows and a very elongated shape. Hubble 5 may be an example of this viewing geometry."
