                  - heading "Formation of Planetary Nebulae" [level=3] [ref=f375e76]
                  - paragraph [ref=f375e77]:
                    - text: When stars swell up to become red giants, they have very large radii and therefore a low escape velocity. The force of gravity depends not only on the mass doing the pulling, but also on the distance from the center of gravity. As a red giant star gets a lot bigger, a point on the surface of the star is now farther from the center, and thus has less gravity. That’s why the speed needed to escape the star goes down. Radiation pressure, stellar pulsations, and violent events like the helium flash can all drive atoms in the outer atmosphere away from the star, and cause it to lose a substantial fraction of its mass into space. Astronomers estimate that by the time a star like the Sun reaches the point of the helium flash, for example, it will have lost as much as 25% of its mass. And it can lose still more mass when it ascends the red-giant branch for the second time. As a result, aging stars are surrounded by one or more expanding shells of gas, each containing as much as 10–20% of the Sun’s mass, or 0.1–0.2 M
                    - subscript [ref=f375e78]: Sun
                    - text: .
                  - paragraph [ref=f375e79]: When nuclear energy generation in the carbon-oxygen core ceases, the star’s core begins to shrink again and to heat up as it gets more and more compressed. This compression will not be halted by another type of fusion in these low-mass stars. The whole star follows along, shrinking and also becoming very hot, reaching surface temperatures as high as 100,000 K. Such hot stars are very strong sources of stellar winds and ultraviolet radiation, which sweep outward into the shells of material ejected when the star was a red giant. The winds and the ultraviolet radiation heat the shells, ionize them, and set them aglow.
                  - paragraph [ref=f375e80]:
                    - text: The result is the creation of some of the most beautiful objects in the cosmos,
                    - strong [ref=f375e81]:
                      - link "planetary nebula" [ref=f375e82]:
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#planetary nebula
                    - text: ". The name is derived from the fact that a few planetary nebulae, when viewed through a small telescope, have a round shape bearing a superficial resemblance to planets. Actually, they have nothing to do with planets, but once names are put into regular use in astronomy, it is extremely difficult to change them. There are tens of thousands of planetary nebulae in our own Galaxy, although many are hidden from view because their light is absorbed by interstellar dust. Figure \\(\\PageIndex{3}\\) includes four Hubble Space Telescope images of example planetary nebulae, labeled (a) through (d)."
                  - paragraph [ref=f375e83]: Image (a) is the Ring Nebula (M57). It is located about 2000 light-years away in the constellation of Lyra. The ring is about 1 light-year in diameter, and the central star has a temperature of about 120,000 K. Careful study of this image has shown scientists that, instead of looking at a spherical shell around this dying star, we may be looking down the barrel of a tube or cone. The blue region shows emission from very hot helium, which is located very close to the star. The red region isolates emission from ionized nitrogen, which is radiated by the coolest gas farthest from the star. The green region represents oxygen emission, which is produced at intermediate temperatures and is at an intermediate distance from the star.
                  - paragraph [ref=f375e84]: Image (b) is M2-9, an example of a butterfly nebula. The central star, which is part of a binary system, has ejected mass preferentially in two opposite directions. In other images, a disk, perpendicular to the two long streams of gas, can be seen around the two stars in the middle. The stellar outburst that resulted in the expulsion of matter occurred about 1200 years ago. Neutral oxygen is shown in red, once-ionized nitrogen in green, and twice-ionized oxygen in blue. The planetary nebula is about 2100 light-years away in the constellation of Ophiuchus.
                  - paragraph [ref=f375e85]: Image (c) includes NGC 6751. The blue regions mark the hottest gas, which forms a ring around the central star. The orange and red regions show the locations of cooler gas. The origin of these cool streamers is not known, but their shapes indicate that they are affected by radiation and stellar winds from the hot star at the center. The temperature of the star is about 140,000 K. The diameter of the nebula is about 600 times larger than the diameter of the Solar System. The nebula is about 6500 light-years away in the constellation of Aquila.
                  - paragraph [ref=f375e86]: Image (d) is NGC 7027 and demonstrates several stages of mass loss. The faint blue concentric shells surrounding the central region identify the mass that was shed slowly from the surface of the star when it became a red giant. Somewhat later, the remaining outer layers were ejected but not in a spherically symmetric way. The dense clouds formed by this late ejection produce the bright inner regions. The hot central star can be seen faintly near the center of the object. NGC 7027 is about 3000 light-years away in the direction of the constellation of Cygnus.
