              - textbox "Rich Text Editor, editarea" [active] [ref=f75e333]: "<h2>Luminosity</h2> <p class=\"lt-phys-64185\">There are a number of other stellar characteristics astronomers and astrophysicists consider. <strong>Luminosity </strong>is a star’s total amount of power radiated into space, measured in watts. Think about a light bulb in your home. The output is measured in watts. Most of us use 60 watts tungsten light bulbs or the new LED bulbs with an output of around 60 watts, yet using about 10 watts of power.</p> <p class=\"lt-phys-64185\">How does a light bulb with a luminosity of 60 watts compare to the Sun’s output? The accepted luminosity of the Sun is 3. 846×10 <sup>26 </sup>watts. With such large numbers, the Sun’s luminosity is often stated as 1 L <sub>⊙ </sub>. The number 1 L <sub>⊙ </sub>is easier to work with than 3. 846×10 <sup>26 </sup>watts, yet they mean the same quantity.</p> <p class=\"lt-phys-64185\"><strong>Apparent Brightness </strong>is the amount of light reaching us per unit area, measured in flux. This incoming light varies by the <strong>Inverse Square Law</strong>. Mathematically this is given as:</p> <p class=\"lt-phys-64185\"><strong>Apparent Brightness is proportional to 1/d <sup>2</sup></strong></p> <p class=\"lt-phys-64185\">Let’s look at an example many have experienced. You see a light one mile away, and note its brightness. You move away from the light, and you again look at the light. You might think the light should be half as bright. Actually it is ¼ as bright, as given by the Inverse Square Law.</p> <p class=\"lt-phys-64185\"><strong>Apparent brightness at 1 mile: 1/1 <sup>2 </sup>= 1 Apparent brightness at 2 miles: 1/2 <sup>2 </sup>= ¼</strong></p> <p class=\"lt-phys-64185\">We all experience the Inverse Square Law in real life, from driving a car at night to looking at lights on and in buildings and streetlights as we approach a light or move away from the light.</p> <p>Perhaps the most important characteristic of a star is its <span data-type=\"term\" group-by=\"l\">luminosity</span>—the total amount of energy at all wavelengths that it emits per second. Earlier, we saw that the Sun puts out a tremendous amount of energy every second. (And there are stars far more luminous than the Sun out there.) To make the comparison among stars easy, astronomers express the luminosity of other stars in terms of the Sun’s luminosity. For example, the luminosity of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span> is about 25 times that of the Sun. We use the symbol <em data-effect=\"italics\">L</em><sub>Sun</sub> to denote the Sun’s luminosity; hence, that of Sirius can be written as 25 <em data-effect=\"italics\">L</em><sub>Sun</sub>. In a later chapter, we will see that if we can measure how much energy a star emits and we also know its mass, then we can calculate how long it can continue to shine before it exhausts its nuclear energy and begins to die.</p> <h3>Variable Stars</h3> <p class=\"lt-phys-64196\">Sometimes a star will change luminosity not due to an eclipse, but due to some sort of physical characteristic. These are called <strong>variable stars </strong>or <strong>variables</strong>. These changes in brightness can range from 1/1000 of a magnitude to 20 magnitudes over a period of a fraction of a second to many years. Over 150,000 variables are known, and many others are suspected to be variables.</p> <p class=\"lt-phys-64196\">There are two major classes of variable stars: <strong>Pulsating Variables </strong>and <strong>Cataclysmic Variables</strong>. <strong>Pulsating variable stars </strong>swell and shrink, which affects the star’s brightness. One important class of pulsating variable stars is the <strong>Cepheid Variables</strong>.</p> <figure><img alt=\"This Hubble image shows RS Puppis, a type of variable star known as a Cepheid variable. As variable stars go, Cepheids have comparatively long periods— RS Puppis, for example, varies in brightness by almost a factor of five every 40 or so days. RS Puppis is unusual; this variable star is shrouded by thick, dark clouds of dust enabling a phenomenon known as a light echo to be shown with stunning clarity. These Hubble observations show the ethereal object embedded in its dusty environment, set against a dark sky filled with background galaxies. \" src=\"/@api/deki/files/42849/figure-196b-variableStars. jpg\" /> <figcaption>Public Domain | Image courtesy of NASA.</figcaption> </figure> <p>&nbsp;</p> <h3>Apparent Brightness</h3> <p>Astronomers are careful to distinguish between the luminosity of the star (the total energy output) and the amount of energy that happens to reach our eyes or a telescope on Earth. Stars are democratic in how they produce radiation; they emit the same amount of energy in every direction in space. Consequently, only a minuscule fraction of the energy given off by a star actually reaches an observer on Earth. We call the amount of a star’s energy that reaches a given area (say, one square meter) each second here on Earth its <span data-type=\"term\" group-by=\"a\">apparent brightness</span>. If you look at the night sky, you see a wide range of apparent brightnesses among the stars. Most stars, in fact, are so dim that you need a telescope to detect them.</p> <p>If all stars were the same luminosity—if they were like standard bulbs with the same light output—we could use the difference in their apparent brightnesses to tell us something we very much want to know: how far away they are. Imagine you are in a big concert hall or ballroom that is dark except for a few dozen 25-watt bulbs placed in fixtures around the walls. Since they are all 25-watt bulbs, their luminosity (energy output) is the same. But from where you are standing in one corner, they do <em data-effect=\"italics\">not</em> have the same apparent brightness. Those close to you appear brighter (more of their light reaches your eye), whereas those far away appear dimmer (their light has spread out more before reaching you). In this way, you can tell which bulbs are closest to you. In the same way, if all the stars had the same luminosity, we could immediately infer that the brightest-appearing stars were close by and the dimmest-appearing ones were far away.</p> <p>To pin down this idea more precisely, recall from the Radiation and Spectra chapter that we know exactly how light fades with increasing distance. The energy we receive is inversely proportional to the square of the distance. If, for example, we have two stars of the same luminosity and one is twice as far away as the other, it will look four times dimmer than the closer one. If it is three times farther away, it will look nine (three squared) times dimmer, and so forth.</p> <p>Alas, the stars do not all have the same luminosity. (Actually, we are pretty glad about that because having many different types of stars makes the universe a much more interesting place.) But this means that if a star looks dim in the sky, we cannot tell whether it appears dim because it has a low luminosity but is relatively nearby, or because it has a high luminosity but is very far away. To measure the luminosities of stars, we must first compensate for the dimming effects of distance on light, and to do that, we must know how far away they are. Distance is among the most difficult of all astronomical measurements. We will return to how it is determined after we have learned more about the stars. For now, we will describe how astronomers specify the apparent brightness of stars.</p> <h3>The Magnitude Scale</h3> <p class=\"lt-phys-64186\">The <strong>magnitude system </strong>is a scale to show how bright stars appear. The initial magnitude system was developed by the Greek astronomer, geographer, and mathematician Hipparchus (190 BC to 120 BC). He ranked stars by their apparent brightness, with 1 being the brightest and 6 being barely visible, without the telescope or other optical aid.</p> <p class=\"lt-phys-64186\">He also designed his original magnitude scale, such that the star Polaris, the northern hemisphere’s pole star, would have a magnitude of 2. Hipparchus’ initial magnitude scale was revised by Norman Pogson in 1856. Pogson specified a 1st magnitude star is 100 times brighter than a 6th magnitude star. Based on Pogson’s system, a 1st magnitude star is 2. 512 times as bright as a 2nd magnitude star. With this revision also came inclusion of brighter objects, such as the Sun and Moon, and fainter objects then visible through the telescope. What we see in our sky is called an object’s <strong>Apparent Magnitude, M <sub>v </sub></strong>.</p> <p>&nbsp;</p> <h3 class=\"lt-phys-64186\">Example Apparent Magnitudes, M <sub>v</sub></h3> <p>&nbsp;</p> <h4 class=\"lt-phys-64186\">Object</h4> <ul> <li class=\"lt-phys-64186\">Sun</li> <li class=\"lt-phys-64186\">Moon</li> <li class=\"lt-phys-64186\">Sirius (brightest star in the sky beyond the Sun)</li> <li class=\"lt-phys-64186\">Polaris, the northern hemisphere’s pole star</li> <li class=\"lt-phys-64186\">Andromeda Galaxy, M31</li> <li class=\"lt-phys-64186\">Maximum brightness of dwarf planet Ceres</li> <li class=\"lt-phys-64186\">Faintest objects visible using 7×50 binocular</li> <li class=\"lt-phys-64186\">Pluto at maximum brightness</li> <li class=\"lt-phys-64186\">Faintest objects observable in visible light with 8m Earth telescopes</li> <li class=\"lt-phys-64186\">Faintest objects observable in visible light with the Hubble Space Telescope</li> </ul> <p>&nbsp;</p> <h4 class=\"lt-phys-64186\">Apparent Magnitude – as seen from Earth</h4> <ul> <li class=\"lt-phys-64186\">-26. 74</li> <li class=\"lt-phys-64186\">-12. 74</li> <li class=\"lt-phys-64186\">-1. 4</li> <li class=\"lt-phys-64186\">1. 98</li> <li class=\"lt-phys-64186\">3. 44</li> <li class=\"lt-phys-64186\">6. 64</li> <li class=\"lt-phys-64186\">9. 50</li> <li class=\"lt-phys-64186\">13. 65</li> <li class=\"lt-phys-64186\">27. 00</li> <li class=\"lt-phys-64186\">31. 50</li> </ul> <p>The process of measuring the apparent brightness of stars is called <em data-effect=\"italics\">photometry</em> (from the Greek <em data-effect=\"italics\">photo</em> meaning “light” and –<em data-effect=\"italics\">metry</em> meaning “to measure”). As we saw Observing the Sky: The Birth of Astronomy, astronomical photometry began with <span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">Hipparchus</span>. Around 150 B.C.E., he erected an observatory on the island of Rhodes in the Mediterranean. There he prepared a catalog of nearly 1000 stars that included not only their positions but also estimates of their apparent brightnesses.</p> <p>Hipparchus did not have a telescope or any instrument that could measure apparent brightness accurately, so he simply made estimates with his eyes. He sorted the stars into six brightness categories, each of which he called a <span data-type=\"term\" group-by=\"m\">magnitude</span>. He referred to the brightest stars in his catalog as first-magnitudes stars, whereas those so faint he could barely see them were sixth-magnitude stars. During the nineteenth century, astronomers attempted to make the scale more precise by establishing exactly how much the apparent brightness of a sixth-magnitude star differs from that of a first-magnitude star. Measurements showed that we receive about 100 times more light from a first-magnitude star than from a sixth-magnitude star. Based on this measurement, astronomers then defined an accurate magnitude system in which a difference of five magnitudes corresponds exactly to a brightness ratio of 100:1. In addition, the magnitudes of stars are decimalized; for example, a star isn’t just a “second-magnitude star,” it has a magnitude of 2.0 (or 2.1, 2.3, and so forth). So what number is it that, when multiplied together five times, gives you this factor of 100? Play on your calculator and see if you can get it. The answer turns out to be about 2.5, which is the fifth root of 100. This means that a magnitude 1.0 star and a magnitude 2.0 star differ in brightness by a factor of about 2.5. Likewise, we receive about 2.5 times as much light from a magnitude 2.0 star as from a magnitude 3.0 star. What about the difference between a magnitude 1.0 star and a magnitude 3.0 star? Since the difference is 2.5 times for each “step” of magnitude, the total difference in brightness is 2.5 × 2.5 = 6.25 times.</p> <p>Here are a few rules of thumb that might help those new to this system. If two stars differ by 0.75 magnitudes, they differ by a factor of about 2 in brightness. If they are 2.5 magnitudes apart, they differ in brightness by a factor of 10, and a 4-magnitude difference corresponds to a difference in brightness of a factor of 40.You might be saying to yourself at this point, “Why do astronomers continue to use this complicated system from more than 2000 years ago?” That’s an excellent question and, as we shall discuss, astronomers today can use other ways of expressing how bright a star looks. But because this system is still used in many books, star charts, and computer apps, we felt we had to introduce students to it (even though we were very tempted to leave it out.)</p> <p>The brightest stars, those that were traditionally referred to as first-magnitude stars, actually turned out (when measured accurately) not to be identical in brightness. For example, the brightest star in the sky, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, sends us about 10 times as much light as the average first-magnitude star. On the modern magnitude scale, Sirius, the star with the brightest apparent magnitude, has been assigned a magnitude of −1.5. Other objects in the sky can appear even brighter. <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Venus</span> at its brightest is of magnitude −4.4, while the Sun has a magnitude of −26.8. Figure 17.2 shows the range of observed magnitudes from the brightest to the faintest, along with the actual magnitudes of several well-known objects. The important fact to remember when using magnitude is that the system goes backward: the <em data-effect=\"italics\">larger</em> the magnitude, the <em data-effect=\"italics\">fainter</em> the object you are observing.</p> <h3 class=\"lt-phys-64757\">Luminosity</h3> <p class=\"lt-phys-64757\">Perhaps the most important characteristic of a star is its <span data-type=\"term\" group-by=\"l\">luminosity</span>—the total amount of energy at all wavelengths that it emits per second. Earlier, we saw that the Sun puts out a tremendous amount of energy every second. (And there are stars far more luminous than the Sun out there.) To make the comparison among stars easy, astronomers express the luminosity of other stars in terms of the Sun’s luminosity. For example, the luminosity of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span> is about 25 times that of the Sun. We use the symbol <em data-effect=\"italics\">L</em><sub>Sun</sub> to denote the Sun’s luminosity; hence, that of Sirius can be written as 25 <em data-effect=\"italics\">L</em><sub>Sun</sub>. In a later chapter, we will see that if we can measure how much energy a star emits and we also know its mass, then we can calculate how long it can continue to shine before it exhausts its nuclear energy and begins to die.</p> <h3 class=\"lt-phys-64757\">Apparent Brightness</h3> <p class=\"lt-phys-64757\">Astronomers are careful to distinguish between the luminosity of the star (the total energy output) and the amount of energy that happens to reach our eyes or a telescope on Earth. Stars are democratic in how they produce radiation; they emit the same amount of energy in every direction in space. Consequently, only a minuscule fraction of the energy given off by a star actually reaches an observer on Earth. We call the amount of a star’s energy that reaches a given area (say, one square meter) each second here on Earth its <span data-type=\"term\" group-by=\"a\">apparent brightness</span>. If you look at the night sky, you see a wide range of apparent brightnesses among the stars. Most stars, in fact, are so dim that you need a telescope to detect them.</p> <p class=\"lt-phys-64757\">If all stars were the same luminosity—if they were like standard bulbs with the same light output—we could use the difference in their apparent brightnesses to tell us something we very much want to know: how far away they are. Imagine you are in a big concert hall or ballroom that is dark except for a few dozen 25-watt bulbs placed in fixtures around the walls. Since they are all 25-watt bulbs, their luminosity (energy output) is the same. But from where you are standing in one corner, they do <em data-effect=\"italics\">not</em> have the same apparent brightness. Those close to you appear brighter (more of their light reaches your eye), whereas those far away appear dimmer (their light has spread out more before reaching you). In this way, you can tell which bulbs are closest to you. In the same way, if all the stars had the same luminosity, we could immediately infer that the brightest-appearing stars were close by and the dimmest-appearing ones were far away.</p> <p class=\"lt-phys-64757\">To pin down this idea more precisely, recall from the Radiation and Spectra chapter that we know exactly how light fades with increasing distance. The energy we receive is inversely proportional to the square of the distance. If, for example, we have two stars of the same luminosity and one is twice as far away as the other, it will look four times dimmer than the closer one. If it is three times farther away, it will look nine (three squared) times dimmer, and so forth.</p> <p class=\"lt-phys-64757\">Alas, the stars do not all have the same luminosity. (Actually, we are pretty glad about that because having many different types of stars makes the universe a much more interesting place.) But this means that if a star looks dim in the sky, we cannot tell whether it appears dim because it has a low luminosity but is relatively nearby, or because it has a high luminosity but is very far away. To measure the luminosities of stars, we must first compensate for the dimming effects of distance on light, and to do that, we must know how far away they are. Distance is among the most difficult of all astronomical measurements. We will return to how it is determined after we have learned more about the stars. For now, we will describe how astronomers specify the apparent brightness of stars.</p> <h3 class=\"lt-phys-64757\">The Magnitude Scale</h3> <p class=\"lt-phys-64757\">The process of measuring the apparent brightness of stars is called <em data-effect=\"italics\">photometry</em> (from the Greek <em data-effect=\"italics\">photo</em> meaning “light” and –<em data-effect=\"italics\">metry</em> meaning “to measure”). As we saw Observing the Sky: The Birth of Astronomy, astronomical photometry began with <span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">Hipparchus</span>. Around 150 B.C.E., he erected an observatory on the island of Rhodes in the Mediterranean. There he prepared a catalog of nearly 1000 stars that included not only their positions but also estimates of their apparent brightnesses.</p> <p class=\"lt-phys-64757\">Hipparchus did not have a telescope or any instrument that could measure apparent brightness accurately, so he simply made estimates with his eyes. He sorted the stars into six brightness categories, each of which he called a <span data-type=\"term\" group-by=\"m\">magnitude</span>. He referred to the brightest stars in his catalog as first-magnitudes stars, whereas those so faint he could barely see them were sixth-magnitude stars. During the nineteenth century, astronomers attempted to make the scale more precise by establishing exactly how much the apparent brightness of a sixth-magnitude star differs from that of a first-magnitude star. Measurements showed that we receive about 100 times more light from a first-magnitude star than from a sixth-magnitude star. Based on this measurement, astronomers then defined an accurate magnitude system in which a difference of five magnitudes corresponds exactly to a brightness ratio of 100:1. In addition, the magnitudes of stars are decimalized; for example, a star isn’t just a “second-magnitude star,” it has a magnitude of 2.0 (or 2.1, 2.3, and so forth). So what number is it that, when multiplied together five times, gives you this factor of 100? Play on your calculator and see if you can get it. The answer turns out to be about 2.5, which is the fifth root of 100. This means that a magnitude 1.0 star and a magnitude 2.0 star differ in brightness by a factor of about 2.5. Likewise, we receive about 2.5 times as much light from a magnitude 2.0 star as from a magnitude 3.0 star. What about the difference between a magnitude 1.0 star and a magnitude 3.0 star? Since the difference is 2.5 times for each “step” of magnitude, the total difference in brightness is 2.5 × 2.5 = 6.25 times.</p> <p class=\"lt-phys-64757\">Here are a few rules of thumb that might help those new to this system. If two stars differ by 0.75 magnitudes, they differ by a factor of about 2 in brightness. If they are 2.5 magnitudes apart, they differ in brightness by a factor of 10, and a 4-magnitude difference corresponds to a difference in brightness of a factor of 40.You might be saying to yourself at this point, “Why do astronomers continue to use this complicated system from more than 2000 years ago?” That’s an excellent question and, as we shall discuss, astronomers today can use other ways of expressing how bright a star looks. But because this system is still used in many books, star charts, and computer apps, we felt we had to introduce students to it (even though we were very tempted to leave it out.)</p> <p class=\"lt-phys-64757\">The brightest stars, those that were traditionally referred to as first-magnitude stars, actually turned out (when measured accurately) not to be identical in brightness. For example, the brightest star in the sky, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, sends us about 10 times as much light as the average first-magnitude star. On the modern magnitude scale, Sirius, the star with the brightest apparent magnitude, has been assigned a magnitude of −1.5. Other objects in the sky can appear even brighter. <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Venus</span> at its brightest is of magnitude −4.4, while the Sun has a magnitude of −26.8. Figure 17.2 shows the range of observed magnitudes from the brightest to the faintest, along with the actual magnitudes of several well-known objects. The important fact to remember when using magnitude is that the system goes backward: the <em data-effect=\"italics\">larger</em> the magnitude, the <em data-effect=\"italics\">fainter</em> the object you are observing.</p> <figure><span data-alt=\"Illustration of the apparent magnitudes of well-known objects, and the faintest magnitudes observable by the naked eye, binoculars, and telescopes. At bottom is a scale labeled “Apparent magnitude”. The scale goes from -30 on the left, to zero in the center to +35 on the right. Above the scale are listed astronomical objects and telescopes, with lines connecting each to the scale below at its appropriate (and approximate) magnitude. Starting from the left we find the Sun at -26, the Moon at -13, Venus (at brightest) at -4.5, Jupiter and Mars at -3, Sirius at -1.5, Alpha Centauri at zero, Betelgeuse at about +0.5, Polaris at +2, the faintest object visible to the unaided eye at +6, Barnard’s Star at about +9, the faintest object visible with binoculars at +10, 1-meter telescope limit at about +19, faintest object visible with 4-meter telescope at about +26, Hale telescope limit at about +27, and finally the limit of Hubble &amp; Keck at about +30.\" data-type=\"media\"><img alt=\"Illustration of the apparent magnitudes of well-known objects, and the faintest magnitudes observable by the naked eye, binoculars, and telescopes. At bottom is a scale labeled “Apparent magnitude”. The scale goes from -30 on the left, to zero in the center to +35 on the right. Above the scale are listed astronomical objects and telescopes, with lines connecting each to the scale below at its appropriate (and approximate) magnitude. Starting from the left we find the Sun at -26, the Moon at -13, Venus (at brightest) at -4.5, Jupiter and Mars at -3, Sirius at -1.5, Alpha Centauri at zero, Betelgeuse at about +0.5, Polaris at +2, the faintest object visible to the unaided eye at +6, Barnard’s Star at about +9, the faintest object visible with binoculars at +10, 1-meter telescope limit at about +19, faintest object visible with 4-meter telescope at about +26, Hale telescope limit at about +27, and finally the limit of Hubble &amp; Keck at about +30.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45945/c1cfa4d227c6704eaf5b072edeadd53956e73a81\" /> </span> <figcaption>Figure 17.2 : Apparent Magnitudes of Well-Known Objects. The faintest <span class=\"no-emphasis\" data-type=\"term\" group-by=\"m\">magnitude</span>s that can be detected by the unaided eye, binoculars, and large telescopes are also shown.</figcaption> </figure> <p>&nbsp;</p> <h3>Other Units of Brightness</h3> <p>Although the magnitude scale is still used for visual astronomy, it is not used at all in newer branches of the field. In radio astronomy, for example, no equivalent of the magnitude system has been defined. Rather, radio astronomers measure the amount of energy being collected each second by each square meter of a radio telescope and express the brightness of each source in terms of, for example, watts per square meter.</p> <p>Similarly, most researchers in the fields of infrared, X-ray, and gamma-ray astronomy use energy per area per second rather than magnitudes to express the results of their measurements. Nevertheless, astronomers in all fields are careful to distinguish between the <em data-effect=\"italics\">luminosity</em> of the source (even when that luminosity is all in X-rays) and the amount of energy that happens to reach us on Earth. After all, the luminosity is a really important characteristic that tells us a lot about the object in question, whereas the energy that reaches Earth is an accident of cosmic geography.</p> <p>To make the comparison among stars easy, in this text, we avoid the use of magnitudes as much as possible and will express the luminosity of other stars in terms of the Sun’s luminosity. For example, the luminosity of Sirius is 25 times that of the Sun. We use the symbol <em data-effect=\"italics\">L</em><sub>Sun</sub> to denote the Sun’s luminosity; hence, that of Sirius can be written as 25 <em data-effect=\"italics\">L</em><sub>Sun</sub>.</p> <h2>Examples and Exercises</h2> <p class=\"box-legend lt-phys-64757\">Example 17.1: The Magnitude Equation</p> <p class=\"lt-phys-64757\">Even scientists can’t calculate fifth roots in their heads, so astronomers have summarized the above discussion in an equation to help calculate the difference in brightness for stars with different magnitudes. If <em data-effect=\"italics\">m</em><sub>1</sub> and <em data-effect=\"italics\">m</em><sub>2</sub> are the magnitudes of two stars, then we can calculate the ratio of their brightness <math display=\"inline\"><semantics><mrow><mrow><mrow><mo>(</mo><mrow><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mrow><mo>)</mo></mrow></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mrow><mo>(</mo><mrow><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mrow><mo>)</mo></mrow></mrow></annotation-xml></semantics></math> using this equation:</p> <p class=\"lt-phys-64757\"><math display=\"block\"><semantics><mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>−</mo><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>2.5</mn><mspace width=\"0.2em\"></mspace><mtext>log</mtext><mrow><mo>(</mo><mrow><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mrow><mo>)</mo></mrow><mspace width=\"3em\"></mspace><mtext>or</mtext><mspace width=\"3em\"></mspace><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><msup><mrow><mn>2.5</mn></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>−</mo></mrow></msup></mrow></mrow><mrow><mrow><msup><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>−</mo><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>2.5</mn><mspace width=\"0.2em\"></mspace><mtext>log</mtext><mrow><mo>(</mo><mrow><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mrow><mo>)</mo></mrow><mspace width=\"3em\"></mspace><mtext>or</mtext><mspace width=\"3em\"></mspace><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><msup><mrow><mn>2.5</mn></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>−</mo><msub><mi>m</mi><mn>2</mn></msub></mrow></msup></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64757\">Here is another way to write this equation:</p> <p class=\"lt-phys-64757\"><math display=\"block\"><semantics><mrow><mrow><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><msup><mrow><mo>(</mo><msup><mrow><mn>100</mn></mrow><mrow><mn>0.2</mn></mrow></msup><mo>)</mo></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>−</mo></mrow></msup></mrow></mrow><mrow><mrow><msup><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><msup><mrow><mo>(</mo><msup><mrow><mn>100</mn></mrow><mrow><mn>0.2</mn></mrow></msup><mo>)</mo></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>−</mo><msub><mi>m</mi><mn>2</mn></msub></mrow></msup></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64757\">Let’s do a real example, just to show how this works. Imagine that an astronomer has discovered something special about a dim star (magnitude 8.5), and she wants to tell her students how much dimmer the star is than <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>. Star 1 in the equation will be our dim star and star 2 will be Sirius.</p> <p class=\"lt-phys-64757\">Solution</p> <p class=\"lt-phys-64757\">Remember, Sirius has a magnitude of <math display=\"inline\"><semantics><mrow><mrow><mo>-</mo><mn>1.5</mn></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mo>-</mo><mn>1.5</mn></mrow></annotation-xml></semantics></math>. In that case:</p> <p class=\"lt-phys-64757\"><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mtd><mtd columnalign=\"left\"><mo>=</mo><msup><mrow><mo>(</mo><msup><mn>100</mn><mn>0.2</mn></msup><mo>)</mo></mrow><mrow><mn>8.5</mn><mo>−</mo><mo>(</mo><mn>−1.5</mn><mo>)</mo></mrow></msup><mo>=</mo><msup><mrow><mo>(</mo><msup><mn>100</mn><mn>0.2</mn></msup><mo>)</mo></mrow><mrow><mn>10</mn></mrow></msup></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><msup><mrow><mo>(</mo><mn>100</mn><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>100</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>100</mn><mo>=</mo><mn>10,</mn></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mn>000</mn></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mi>b</mi><mn>2</mn></msub></mrow><mrow><msub><mi>b</mi><mn>1</mn></msub></mrow></mfrac></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mn></mn></msub></mrow></mfrac></mtd></mtr></mtable></annotation-xml></semantics></math></p> <p class=\"box-legend lt-phys-64757\">Exercise</p> <p class=\"lt-phys-64757\">It is a common misconception that <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Polaris</span> (magnitude 2.0) is the brightest star in the sky, but, as we saw, that distinction actually belongs to Sirius (magnitude −1.5). How does Sirius’ apparent brightness compare to that of Polaris?</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64757\"><math display=\"inline\"><semantics><mrow><mrow><mfrac><mrow><msub><mi>b</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>b</mi><mrow><mtext>Polaris</mtext></mrow></msub></mrow></mfrac><mo>=</mo><msup><mrow><mo>(</mo><msup><mn>100</mn><mn>0.2</mn></msup><mo>)</mo></mrow><mrow><mn>2.0</mn><mo>−</mo><mo stretchy=\"false\">(</mo><mn>−1.5</mn><mo stretchy=\"false\">)</mo></mrow></msup><mo>=</mo><msup><mrow><mo>(</mo><msup><mn>100</mn><mn>0.2</mn></msup><mo>)</mo></mrow><mrow><mn>3.5</mn></mrow></msup><mo>=</mo><msup><mn>100</mn><mn>0.7</mn></msup><mo>=</mo></mrow></mrow><mrow><mrow><mn>25</mn></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><msub><mi>b</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>b</mi><mrow><mtext>Polaris</mtext></mrow></msub></mrow></mfrac></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><msup><mrow><mo>(</mo><msup><mn>100</mn><mn>0.2</mn></msup><mo>)</mo></mrow><mrow><mn>2.0</mn><mo>−</mo><mo stretchy=\"false\">(</mo><mn>−1.5</mn><mo stretchy=\"false\">)</mo></mrow></msup><mo>=</mo><msup><mrow><mo>(</mo><msup><mn>100</mn><mn>0.2</mn></msup><mo>)</mo></mrow><mrow><mn>3.5</mn></mrow></msup><mo>=</mo><msup><mn>100</mn><mn>0.7</mn></msup><mo>=</mo><mn>25</mn></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64757\">(Hint: If you only have a basic calculator, you may wonder how to take 100 to the 0.7th power. But this is something you can ask Google to do. Google now accepts mathematical questions and will answer them. So try it for yourself. Ask Google, “What is 100 to the 0.7th power?”)</p> <p class=\"lt-phys-64757\">Our calculation shows that Sirius’ apparent brightness is 25 times greater than Polaris’ apparent brightness.</p> </dd> </dl>"
