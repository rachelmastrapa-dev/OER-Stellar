              - iframe [active] [ref=f247e323]:
                - generic [active] [ref=f249e1]:
                  - paragraph [ref=f249e2]: Variable stars are not the only way that we can estimate the luminosity of stars. Another way involves the H–R diagram, which shows that the intrinsic brightness of a star can be estimated if we know its spectral type.
                  - heading "Distances from Spectral Types" [level=3] [ref=f249e3]
                  - paragraph [ref=f249e4]: As satisfying and productive as variable stars have been for distance measurement, these stars are rare and are not found near all the objects to which we wish to measure distances. Suppose, for example, we need the distance to a star that is not varying, or to a group of stars, none of which is a variable. In this case, it turns out the H–R diagram can come to our rescue.
                  - paragraph [ref=f249e5]:
                    - text: If we can observe the spectrum of a star, we can estimate its distance from our understanding of the H–R diagram. As discussed in Analyzing Starlight, a detailed examination of a stellar spectrum allows astronomers to classify the star into one of the
                    - emphasis [ref=f249e6]: spectral types
                    - text: indicating surface temperature. (The types are O, B, A, F, G, K, M, L, T, and Y; each of these can be divided into numbered subgroups.) In general, however, the spectral type alone is not enough to allow us to estimate luminosity. Look again at Figure 18.15. A G2 star could be a main-sequence star with a luminosity of 1
                    - generic [ref=f249e7]:
                      - emphasis [ref=f249e8]: L
                      - subscript [ref=f249e9]: Sun
                    - text: ", or it could be a giant with a luminosity of 100"
                    - generic [ref=f249e10]:
                      - emphasis [ref=f249e11]: L
                      - subscript [ref=f249e12]: Sun
                    - text: ", or even a supergiant with a still higher luminosity."
                  - paragraph [ref=f249e13]: We can learn more from a star’s spectrum, however, than just its temperature. Remember, for example, that we can detect pressure differences in stars from the details of the spectrum. This knowledge is very useful because giant stars are larger (and have lower pressures) than main-sequence stars, and supergiants are still larger than giants. If we look in detail at the spectrum of a star, we can determine whether it is a main-sequence star, a giant, or a supergiant.
                  - paragraph [ref=f249e14]: Suppose, to start with the simplest example, that the spectrum, color, and other properties of a distant G2 star match those of the Sun exactly. It is then reasonable to conclude that this distant star is likely to be a main-sequence star just like the Sun and to have the same luminosity as the Sun. But if there are subtle differences between the solar spectrum and the spectrum of the distant star, then the distant star may be a giant or even a supergiant.
                  - paragraph [ref=f249e15]: "The most widely used system of star classification divides stars of a given spectral class into six categories called luminosity classes. These luminosity classes are denoted by Roman numbers as follows:"
                  - list [ref=f249e16]:
                    - listitem [ref=f249e17]: "Ia: Brightest supergiants"
                    - listitem [ref=f249e18]: "Ib: Less luminous supergiants"
                    - listitem [ref=f249e19]: "II: Bright giants"
                    - listitem [ref=f249e20]: "III: Giants"
                    - listitem [ref=f249e21]: "IV: Subgiants (intermediate between giants and main-sequence stars)"
                    - listitem [ref=f249e22]: "V: Main-sequence stars"
                  - paragraph [ref=f249e23]: The full spectral specification of a star includes its luminosity class. For example, a main-sequence star with spectral class F3 is written as F3 V. The specification for an M2 giant is M2 III. Figure 19.15 illustrates the approximate position of stars of various luminosity classes on the H–R diagram. The dashed portions of the lines represent regions with very few or no stars.
                  - 'figure "Figure 19.15 : Luminosity Classes. Stars of the same temperature (or spectral class) can fall into different luminosity classes on the Hertzsprung-Russell diagram. By studying details of the spectrum for each star, astronomers can determine which luminosity class they fall in (whether they are main-sequence stars, giant stars, or supergiant stars)." [ref=f249e24]':
                    - img [ref=f249e26]
                  - paragraph [ref=f249e28]:
                    - text: With both its spectral and luminosity classes known, a star’s position on the H–R diagram is uniquely determined. Since the diagram plots luminosity versus temperature, this means we can now read off the star’s luminosity (once its spectrum has helped us place it on the diagram). As before, if we know how luminous the star really is and see how dim it looks, the difference allows us to calculate its distance. (For historical reasons, astronomers sometimes call this method of distance determination
                    - emphasis [ref=f249e29]: spectroscopic parallax
                    - text: ", even though the method has nothing to do with parallax.)"
                  - paragraph [ref=f249e30]: "The H–R diagram method allows astronomers to estimate distances to nearby stars, as well as some of the most distant stars in our Galaxy, but it is anchored by measurements of parallax. The distances measured using parallax are the gold standard for distances: they rely on no assumptions, only geometry. Once astronomers take a spectrum of a nearby star for which we also know the parallax, we know the luminosity that corresponds to that spectral type. Nearby stars thus serve as benchmarks for more distant stars because we can assume that two stars with identical spectra have the same intrinsic luminosity."
                  - heading "A Few Words about the Real World" [level=3] [ref=f249e31]
                  - paragraph [ref=f249e32]: Introductory textbooks such as ours work hard to present the material in a straightforward and simplified way. In doing so, we sometimes do our students a disservice by making scientific techniques seem too clean and painless. In the real world, the techniques we have just described turn out to be messy and difficult, and often give astronomers headaches that last long into the day.
                  - paragraph [ref=f249e33]: For example, the relationships we have described such as the period-luminosity relation for certain variable stars aren’t exactly straight lines on a graph. The points representing many stars scatter widely when plotted, and thus, the distances derived from them also have a certain built-in scatter or uncertainty.
                  - paragraph [ref=f249e34]: The distances we measure with the methods we have discussed are therefore only accurate to within a certain percentage of error—sometimes 10%, sometimes 25%, sometimes as much as 50% or more. A 25% error for a star estimated to be 10,000 light-years away means it could be anywhere from 7500 to 12,500 light-years away. This would be an unacceptable uncertainty if you were loading fuel into a spaceship for a trip to the star, but it is not a bad first figure to work with if you are an astronomer stuck on planet Earth.
                  - paragraph [ref=f249e35]: Nor is the construction of H–R diagrams as easy as you might think at first. To make a good diagram, one needs to measure the characteristics and distances of many stars, which can be a time-consuming task. Since our own solar neighborhood is already well mapped, the stars astronomers most want to study to advance our knowledge are likely to be far away and faint. It may take hours of observing to obtain a single spectrum. Observers may have to spend many nights at the telescope (and many days back home working with their data) before they get their distance measurement. Fortunately, this is changing because surveys like Gaia will study billions of stars, producing public datasets that all astronomers can use.
                  - paragraph [ref=f249e36]: Despite these difficulties, the tools we have been discussing allow us to measure a remarkable range of distances—parallaxes for the nearest stars, RR Lyrae variable stars; the H–R diagram for clusters of stars in our own and nearby galaxies; and cepheids out to distances of 60 million light-years. Table 19.1 describes the distance limits and overlap of each method.
                  - paragraph [ref=f249e37]:
                    - text: Each technique described in this chapter builds on at least one other method, forming what many call the
                    - emphasis [ref=f249e38]: cosmic distance ladder
                    - text: . Parallaxes are the foundation of all stellar distance estimates, spectroscopic methods use nearby stars to calibrate their H–R diagrams, and RR Lyrae and cepheid distance estimates are grounded in H–R diagram distance estimates (and even in a parallax measurement to a nearby cepheid,
                    - generic [ref=f249e39]: Delta Cephei
                    - text: ).
                  - paragraph [ref=f249e40]: "This chain of methods allows astronomers to push the limits when looking for even more distant stars. Recent work, for example, has used RR Lyrae stars to identify dim companion galaxies to our own Milky Way out at distances of 300,000 light-years. The H–R diagram method was recently used to identify the two most distant stars in the Galaxy: red giant stars way out in the halo of the Milky Way with distances of almost 1 million light-years."
                  - paragraph [ref=f249e41]: "We can combine the distances we find for stars with measurements of their composition, luminosity, and temperature—made with the techniques described in Analyzing Starlight and The Stars: A Celestial Census. Together, these make up the arsenal of information we need to trace the evolution of stars from birth to death, the subject to which we turn in the chapters that follow."
                  - table [ref=f249e42]:
                    - caption [ref=f249e43]: "Table 19.1: Distance Range of Celestial Measurement Methods"
                    - rowgroup [ref=f249e44]:
                      - row [ref=f249e45]:
                        - columnheader "Method" [ref=f249e46]
                        - columnheader "Distance Range" [ref=f249e47]
                    - rowgroup [ref=f249e48]:
                      - row [ref=f249e49]:
                        - cell "Trigonometric parallax" [ref=f249e50]
                        - cell "4–30,000 light-years when the Gaia mission is complete" [ref=f249e51]
                      - row [ref=f249e52]:
                        - cell "RR Lyrae stars" [ref=f249e53]
                        - cell "Out to 300,000 light-years" [ref=f249e54]
                      - row [ref=f249e55]:
                        - cell "H–R diagram and spectroscopic distances" [ref=f249e56]
                        - cell "Out to 1,200,000 light-years" [ref=f249e57]
                      - row [ref=f249e58]:
