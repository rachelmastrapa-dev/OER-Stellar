            - application "Rich Text Editor, editarea" [ref=f359e255]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f359e269]: "<h2>Introduction</h2> <p>Astronomers define the birth of stars as the moment that they begin fusing hydrogen into helium and join the main sequence. They have learned how stars change over time by studying star clusters. Stars follow different pathways when they age. Which path they are on, depends on the stars initial mass. Some paths are similar, but massive stars progress along them at a much more rapid pace than lower mass stars.</p> <section class=\"box-objectives\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <ul> <li class=\"lt-phys-64791\">Define the term zero-age main sequence and identify its on the H-R diagram.&lt;&lt;/li&gt;</li> <li class=\"lt-phys-64791\">Describe what happens to main-sequence stars of various masses as they exhaust their hydrogen supply</li> <li class=\"lt-phys-64792\">Explain how star clusters help us understand the stages of stellar evolution</li> <li class=\"lt-phys-64792\">List the different types of star clusters and describe how they differ in number of stars, structure, and age</li> <li class=\"lt-phys-64793\">Explain how the H–R diagram of a star cluster can be related to the cluster’s age and the stages of evolution of its stellar members</li> <li class=\"lt-phys-64793\">Describe the different changes that occur as a star evolves and how those changes are reflected in the H-R diagram.</li> <li class=\"lt-phys-64794\">List the different elements that are fused in stars</li> <li class=\"lt-phys-64794\">Describe the layers in the interior of a low-mass star prior to its death.</li> <li class=\"lt-phys-64794\">Define planetary nebulae and describe how they form</li> </ul> </section> <p>{{template.ShowOrg()}}</p> <p><strong>Thumbnail</strong>: This artist's impression demonstrates how the binary star system of Sirius A and its diminutive blue companion, Sirius B, might appear to an interstellar visitor. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; <a href=\"https://www.nasa.gov/\" target=\"_blank\" title=\"NASA, ESA and G. Bacon (STScI)\">NASA, ESA and G. Bacon (STScI)</a> via <a href=\"https://commons.wikimedia.org/w/index.php?curid=477456\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p>"
