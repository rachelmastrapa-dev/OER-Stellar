            - list [ref=f357e102]:
              - listitem [ref=f357e103]: Define the term zero-age main sequence and identify its on the H-R diagram.<</li>
              - listitem [ref=f357e104]: Describe what happens to main-sequence stars of various masses as they exhaust their hydrogen supply
              - listitem [ref=f357e105]: Explain how star clusters help us understand the stages of stellar evolution
              - listitem [ref=f357e106]: List the different types of star clusters and describe how they differ in number of stars, structure, and age
              - listitem [ref=f357e107]: Explain how the H–R diagram of a star cluster can be related to the cluster’s age and the stages of evolution of its stellar members
              - listitem [ref=f357e108]: Describe the different changes that occur as a star evolves and how those changes are reflected in the H-R diagram.
              - listitem [ref=f357e109]: List the different elements that are fused in stars
              - listitem [ref=f357e110]: Describe the layers in the interior of a low-mass star prior to its death.
              - listitem [ref=f357e111]: Define planetary nebulae and describe how they form
