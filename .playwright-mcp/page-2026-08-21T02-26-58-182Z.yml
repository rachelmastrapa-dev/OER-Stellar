        - generic [ref=f357e95]:
          - heading "Introduction" [level=2] [ref=f357e96]
          - paragraph [ref=f357e97]: Astronomers define the birth of stars as the moment that they begin fusing hydrogen into helium and join the main sequence. They have learned how stars change over time by studying star clusters. Stars follow different pathways when they age. Which path they are on, depends on the stars initial mass. Some paths are similar, but massive stars progress along them at a much more rapid pace than lower mass stars.
          - generic [ref=f357e99]:
