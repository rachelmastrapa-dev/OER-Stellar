            - application "Rich Text Editor, editarea" [ref=f343e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f343e336]: "<h2>Planetary Systems in Formation</h2> <p class=\"lt-phys-64785\">Having developed on a planet and finding it essential to our existence, we have a special interest in how planets fit into the story of star formation. Yet <strong><a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.05:_Key_Terms#exoplanet\" target=\"_blank\" title=\"exoplanets\">exoplanet</a></strong> are extremely difficult to detect. Recall that we see planets in our own system only because they reflect sunlight and are close by. When we look to the other stars, we find that the amount of light a planet reflects is a tiny fraction of the light its star gives off. Furthermore, from a distance, planets are lost in the glare of their much-brighter parent stars.</p> <p class=\"lt-phys-64785\">It is a lot easier to detect the spread-out raw material from which planets might be assembled than to detect planets after they are fully formed. From our study of the&nbsp;Solar System, we understand that planets form by the gathering together of gas and dust particles in orbit around a newly created star. Each dust particle is heated by the young protostar and radiates in the infrared region of the spectrum. Before any planets form, we can detect such radiation from all of the spread-out individual dust particles that are destined to become parts of planets. We can also detect the silhouette of the disk if it blocks bright light coming from a source behind it. Figure \\(\\PageIndex{1}\\)&nbsp;includes four disks around young stars in the Orion Nebula. The dark, dusty disks are dark against the bright backdrop of the glowing gas in the nebula. The size of each image is about 30 times the diameter of the Solar System. The red glow at the center of each disk is a young star, no more than a million years old.</p> <figure><img alt=\"Four disks around protostars in the Orion Nebula. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45803/6626b80f949e1ccc651d4e958975400be23d4699\" /> <figcaption>Figure \\(\\PageIndex{1}\\): Planet Forming Disks. These Hubble Space Telescope images show four disks around young stars in the Orion Nebula. The dark, dusty disks are from two to eight times the orbit of Pluto in size. The red glow at the center of each disk is a young star. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.3.1_Planet_Forming_Disks\" title=\"11.6: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64785\">Once the dust particles gather together and form a few planets, the space between the planets is mostly dust-free. All we can now detect is the radiation from the outside surfaces of the planets, which cover a significantly smaller area than the huge, dusty disk from which they formed. The amount of infrared radiation is therefore greatest before the dust particles combine into planets. For this reason, our search for planets begins with a search for infrared radiation from the material required to make them.</p> <p class=\"lt-phys-64785\">A disk of gas and dust appears to be an essential part of star formation. Observations show that nearly all very young protostars have disks and that the disks range in size from 10 to 1000 AU. For comparison, the Solar System&nbsp;including&nbsp;the Kuiper&nbsp;Belt, is about 100 AU in diameter.&nbsp;The mass contained in these disks is typically 1–10% of the mass of the Sun, which is more than the mass of all the planets in the Solar System put together. Such observations already demonstrate that a large fraction of stars begin their lives with enough material in the right place to form a planetary system.</p> <h2 class=\"lt-phys-64785\">Planet Formation and Growth</h2> <p class=\"lt-phys-64785\">We can use observations of how the disks change with time to estimate how long it takes for planets to form. If we measure the temperature and luminosity of a protostar, then, as we saw, we can place it on&nbsp;an H–R diagram like the one shown in Figure 11.2.1. By comparing the real star with our models of how protostars should evolve with time, we can estimate its age. We can then look at how the disks we observe change with the ages of the stars that they surround.</p> <p class=\"lt-phys-64785\">What such observations show is that if a protostar is less than about 1 to 3 million years old, its disk extends all the way from very close to the surface of the star out to tens or hundreds of AU away. In older protostars, we find disks with outer parts that still contain large amounts of dust, but the inner regions have lost most of their dust. In these objects, the disk looks like a donut, with the protostar centered in its hole. The inner, dense parts of most disks have disappeared by the time the stars are 10 million years old. In&nbsp;Figure \\(\\PageIndex{2}\\), each star has an image of the observations on the left&nbsp;and a model simulation based on that observation on the right.&nbsp;The central star is much brighter than the surrounding disk, so the instrument includes a coronagraph, which has a small shield that blocks the light of the central star but allows the surrounding disk to be imaged. The star HD 141943 has an age of about 17 million years, while HD 191089 is about 12 million years old.&nbsp;</p> <figure><img alt=\"Protoplanetary Disks of HD 141943 and HD 191089. Details in text.\" class=\"internal default\" src=\"/@api/deki/files/45804/f873ffb4a22da2d1bff07339b68e2ac144045505\" /> <figcaption>Figure \\(\\PageIndex{2}\\):&nbsp;Observations of two stars with models based on the observations. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.3.2_Protoplanetary_Disks\" title=\"11.6: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64785\">Calculations show that the formation of one or more planets could produce such a donut-like distribution of dust. Suppose a planet forms a few AU away from the protostar, due to the gathering together of matter from the disk. As the planet grows in mass, the process clears out a dust-free region in its immediate neighborhood. Calculations also show that any small dust particles and gas that were initially located in the region between the protostar and the planet, and that are not swept up by the planet, will then fall onto the star very quickly in about 50,000 years.</p> <p class=\"lt-phys-64785\">Matter lying outside the planet’s orbit, in contrast, is prevented from moving into the hole by the gravitational forces exerted by the planet. If the formation of a planet is indeed what produces and sustains holes in the disks that surround very young stars, then planets must form in 3 to 30 million years. This is a short period compared with the lifetimes of most stars and shows that the formation of planets may be a quick byproduct of the birth of stars.</p> <p class=\"lt-phys-64785\">Dust-grain-size particles orbiting in the disk collide and stick together, with the larger collections growing more rapidly as they attract and capture smaller ones. Once these clumps grow to about 10 centimeters in size or so, they enter a perilous stage in their development. At that size, unless they can grow to larger than about 100 meters in diameter, they are subject to drag forces produced by friction with the gas in the disk—and their orbits can rapidly decay, plunging them into the host star. Therefore, these bodies must rapidly grow to nearly 1 kilometer in diameter to avoid a fiery fate. Ultimately, this process results in a few large planets.</p> <p class=\"lt-phys-64785\">If the growing planets reach a mass bigger than about 10 times the mass of Earth, their gravity is strong enough to capture and hold on to hydrogen gas that remains in the disk. At that point, they will grow in mass and radius rapidly, reaching giant planet dimensions. However, to do so requires that the rapidly evolving central star hasn’t yet driven away the gas in the disk with its stellar wind. From observations, we know that the disk can be blown away within 10 million years, so growth of a giant planet must also be a very fast process, astronomically speaking.</p> <h2 class=\"lt-phys-64785\">Debris Disks and Shepherd Planets</h2> <p class=\"lt-phys-64785\">The dust around newly formed stars is gradually either incorporated into the growing planets in the newly forming planetary system or ejected through gravitational interactions with the planets into space. The dust will disappear after about 30 million years unless the disk is continually supplied with new material. Local comets and asteroids are the most likely sources of new dust. As the planet-size bodies grow, they stir up the orbits of smaller objects in the area. These small bodies collide at high speeds, shatter, and produce tiny particles of silicate dust and ices that can keep the disk supplied with the debris from these collisions.</p> <p class=\"lt-phys-64785\">Over several hundred million years, the comets and asteroids will gradually be reduced in number, the frequency of collisions will go down, and the supply of fresh dust will diminish. Remember that the heavy bombardment in the early Solar System ended when the Sun was only about 500 million years old. Observations show that the dusty debris disks&nbsp;around stars also become mostly undetectable by the time the stars reach an age of 400 to 500 million years. It is likely, however, that some small amount of cometary material will remain in orbit, much like our Kuiper&nbsp;Belt, a flattened disk of comets outside the orbit of Neptune.</p> <p class=\"lt-phys-64785\">In a young planetary system, even if we cannot see the planets directly, the planets can concentrate the dust particles into clumps and arcs that are much larger than the planets themselves and therefore easier to image. This is similar to how the tiny moons of Saturn shepherd the particles in the rings and produce large arcs and structures in Saturn’s rings.</p> <p class=\"lt-phys-64785\">Protoplanetary and debris disks, many with such clumps and arcs, have now been found around numerous stars. One famous example is&nbsp;<span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">HL Tau</span>, located about 450 light-years from Earth in the constellation Taurus, Figure \\(\\PageIndex{3}\\). This image was made by ALMA (the Atacama Large Millimeter/Submillimeter Array) at a wavelength of 1.3 millimeters and shows the young star HL Tau and its protoplanetary disk with rings that indicate the presence of forming planets. In some stars, the brightness of the rings varies with position; around other stars, there are bright arcs and gaps in the rings. The brightness indicates the relative concentration of dust, since what we are seeing is infrared from the dust particles in the rings. More dust means more infrared light.&nbsp;</p> <figure><img alt=\"HL Tauri dust disk with gaps that may mark forming planets. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45802/f2219020f6b431e91a1b48b415b281107f534c1b\" /> <figcaption>Figure \\(\\PageIndex{3}\\): Dust Ring around a Young Star. This image of&nbsp;young star HL Tau and its protoplanetary disk reveals multiple rings and gaps that indicate the presence of emerging planets. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.3.3_Dust_Ring_around_a_Young_Star\" title=\"11.6: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{3}\\)</a>.</figcaption> </figure> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: Interactive Activity</span></h5> <p>To see a real example of a proto planetary disk and ongoing planet formation, watch the National Radio Astronomy Observatory (NRAO) <a href=\"https://www.youtube.com/watch?v=Z4xiQvge3TI\" rel=\"noopener noreferrer\" target=\"_blank\"> HL Tau Video Webcast</a>. The video discusses observations of HL Tau, a young star surrounded by a disk of gas and dust in which planets may be forming.</p> </section>"
