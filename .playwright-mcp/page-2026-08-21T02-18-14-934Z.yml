                  - paragraph [ref=f309e131]:
                    - text: The cold interstellar clouds also contain cyanoacetylene (HC
                    - subscript [ref=f309e132]: "3"
                    - text: N) and acetaldehyde (CH
                    - subscript [ref=f309e133]: "3"
                    - text: CHO), generally regarded as starting points for
                    - emphasis [ref=f309e134]: amino acid
                    - text: formation. These are building blocks of proteins, which are among the fundamental chemicals from which living organisms on Earth are constructed. The presence of these organic molecules does not imply that life exists in space, but it does show that the chemical building blocks of life can form under a wide range of conditions in the universe. As we learn more about how complex molecules are produced in interstellar clouds, we gain an increased understanding of the kinds of processes that preceded the beginnings of life on Earth billions of years ago.
                  - paragraph [ref=f309e135]:
                    - text: "Among the molecules astronomers have identified in interstellar clouds is alcohol, which comes in two varieties: methyl (or wood) alcohol and ethyl alcohol (the kind you find in cocktails). Ethyl alcohol is a pretty complex molecule, written by chemists as C"
                    - subscript [ref=f309e136]: "2"
                    - text: H
                    - subscript [ref=f309e137]: "5"
                    - text: OH. It is quite plentiful in space (relatively speaking). In clouds where it has been identified, we detect up to one molecule for every m
                    - superscript [ref=f309e138]: "3"
                    - text: . The largest of the clouds (which can be several hundred light-years across) have enough ethyl alcohol to make 10
                    - superscript [ref=f309e139]: "28"
                    - text: fifths of liquor.
                  - paragraph [ref=f309e140]: We need not fear, however, that future interstellar astronauts will become interstellar alcoholics. Even if a spaceship were equipped with a giant funnel 1 kilometer across and could scoop it through such a cloud at the speed of light, it would take about a thousand years to gather up enough alcohol for one standard martini.
                  - paragraph [ref=f309e141]:
                    - text: Furthermore, the very same clouds also contain water (H
                    - subscript [ref=f309e142]: "2"
                    - text: O) molecules. Your scoop would gather them up as well, and there are a lot more of them because they are simpler and thus easier to form. For the fun of it, one astronomical paper actually calculated the proof of a typical cloud.
                    - emphasis [ref=f309e143]: Proof
                    - text: is the ratio of alcohol to water in a drink, where 0 proof means all water, 100 proof means half alcohol and half water, and 200 proof means all alcohol. The proof of the interstellar cloud was only 0.2, not enough to qualify as a stiff drink
                  - heading "Interstellar Dust" [level=2] [ref=f309e144]
                  - paragraph [ref=f309e145]: "Figure 20.9 shows a striking example of what is actually a common sight through large telescopes: a dark region on the sky that appears to be nearly empty of stars. For a long time, astronomers debated whether these dark regions were empty “tunnels” through which we looked beyond the stars of the Milky Way Galaxy into intergalactic space, or clouds of some dark material that blocked the light of the stars beyond. The astronomer William Herschel (discoverer of the planet Uranus) thought it was the former, once remarking after seeing one, “Here truly is a hole in heaven!” However, American astronomer E. E. Barnard is generally credited with showing from his extensive series of nebula photographs that the latter interpretation is the correct one (see the feature box on Edward Emerson Barnard)."
                  - 'figure "Figure 20.9 : Barnard 68. This object, first catalogued by E. E. Barnard, is a dark interstellar cloud. Its striking appearance is due to the fact that, since it is relatively close to Earth, there are no bright stars between us and it, and its dust obscures the light from the stars behind it. (It looks a little bit like a sideways heart; one astronomers sent a photo of this object to his sweetheart as a valentine.) (credit: modification of work by ESO)" [ref=f309e146]':
                    - img "Photograph of Barnard 68. An absolutely black, comma-shaped cloud is centered in this image, with hundreds of stars seen in the background." [ref=f309e148]
                  - paragraph [ref=f309e150]: "Dusty clouds in space betray their presence in several ways: by blocking the light from distant stars, by emitting energy in the infrared part of the spectrum, by reflecting the light from nearby stars, and by making distant stars look redder than they really are."
                  - heading "Detecting Dust" [level=3] [ref=f309e151]
                  - paragraph [ref=f309e152]:
                    - text: The dark cloud seen in Figure 20.9 blocks the light of the many stars that lie behind it; note how the regions in other parts of the photograph are crowded with stars. Barnard 68 is an example of a relatively dense cloud or
                    - emphasis [ref=f309e153]: dark nebula
                    - text: containing tiny, solid dust grains. Such opaque clouds are conspicuous on any photograph of the Milky Way, the galaxy in which the Sun is located (see the figures in The Milky Way Galaxy). The “dark rift,” which runs lengthwise down a long part of the Milky Way in our sky and appears to split it in two, is produced by a collection of such obscuring clouds.
                  - paragraph [ref=f309e154]: While dust clouds are too cold to radiate a measurable amount of energy in the visible part of the spectrum, they glow brightly in the infrared (Figure 20.11). The reason is that small dust grains absorb visible light and ultraviolet radiation very efficiently. The grains are heated by the absorbed radiation, typically to temperatures from 10 to about 500 K, and re-radiate this heat at infrared wavelengths.
                  - figure [ref=f309e155]:
                    - img "Visible and Infrared Images of the Horsehead Nebula in Orion. At left, (a) is a visible light image of the “horsehead”, with the very bright star Zeta Orionis at upper left. The horsehead shape is seen silhouetted against the bright red nebulous background in the upper half of the image. Fainter swirls of gas and dark dust are seen in the lower half. At right, (b) is an infrared image of the same region. The infrared image is a near reversal of the visible image. The bright star is barely seen. The horsehead is now a bright shape against a dark background, and the lower half of the image is bright with wisps and swirls of gas and a bright star forming nebula near the center. The insets in the infrared image show the horsehead and the bright nebula in more detail." [ref=f309e157]
                  - paragraph [ref=f309e159]: Thanks to their small sizes and low temperatures, interstellar grains radiate most of their energy at infrared to microwave frequencies, with wavelengths of tens to hundreds of microns. Earth’s atmosphere is opaque to radiation at these wavelengths, so emission by interstellar dust is best measured from space. Observations from above Earth’s atmosphere show that dust clouds are present throughout the plane of the Milky Way (Figure 20.12).
                  - figure [ref=f309e160]:
                    - img "Infrared Emission from the Plane of the Milky Way. In this image the diffuse glow of interstellar dust at 3.6 and 8.0 microns fills the frame. Bright, circular patches of red nebulosity at 24 microns along with irregular patches and tendrils of dark dust are scattered across the entire field." [ref=f309e162]
                  - paragraph [ref=f309e164]:
                    - text: Some dense clouds of dust are close to luminous stars and scatter enough starlight to become visible. Such a cloud of dust, illuminated by starlight, is called a
                    - emphasis [ref=f309e165]: reflection nebula
                    - text: ", since the light we see is starlight reflected off the grains of dust. One of the best-known examples is the nebulosity around each of the brightest stars in the Pleiades cluster (see Figure 20.1). The dust grains are small, and such small particles turn out to scatter light with blue wavelengths more efficiently than light at red wavelengths. A reflection nebula, therefore, usually appears bluer than its illuminating star (Figure 20.13)."
                  - 'figure "Figure 20.13 : Pleiades Star Cluster. The bluish light surrounding the stars in this image is an example of a reflection nebula. Like fog around a street lamp, a reflection nebula shines only because the dust within it scatters light from a nearby bright source. The Pleiades cluster is currently passing through an interstellar cloud that contains dust grains, which scatter the light from the hot blue stars in the cluster. The Pleiades cluster is about 400 light-years from the Sun. (credit: NASA, ESA and AURA/Caltech)" [ref=f309e166]':
                    - img "The Pleiades. The light from the bright, blue stars of this cluster reflects off of the nearby dust clouds, giving the appearance of streetlamps on a foggy night." [ref=f309e168]
                  - paragraph [ref=f309e170]:
                    - text: Gas and dust are generally intermixed in space, although the proportions are not exactly the same everywhere. The presence of dust is apparent in many photographs of
                    - emphasis [ref=f309e171]: emission nebulae
                    - text: in the constellation of Sagittarius, where we see an H II region surrounded by a blue reflection nebula. Which type of nebula appears brighter depends on the kinds of stars that cause the gas and dust to glow. Stars cooler than about 25,000 K have so little ultraviolet radiation of wavelengths shorter than 91.2 nanometers—which is the wavelength required to ionize hydrogen—that the reflection nebulae around such stars outshine the emission nebulae. Stars hotter than 25,000 K emit enough ultraviolet energy that the emission nebulae produced around them generally outshine the reflection nebulae.
                  - heading "Interstellar Reddening" [level=3] [ref=f309e172]
                  - paragraph [ref=f309e173]: The tiny interstellar dust grains absorb some of the starlight they intercept. But at least half of the starlight that interacts with a grain is merely scattered, that is, it is redirected rather than absorbed. Since neither the absorbed nor the scattered starlight reaches us directly, both absorption and scattering make stars look dimmer. The effects of both processes are called interstellar extinction (Figure 20.14).
                  - paragraph [ref=f309e174]: Astronomers first came to understand interstellar extinction around the early 1930s, as the explanation of a puzzling observation. In the early part of the twentieth century, astronomers discovered that some stars look red even though their spectral lines indicate that they must be extremely hot (and thus should look blue). The solution to this seeming contradiction turned out to be that the light from these hot stars is not only dimmed but also reddened by interstellar dust, a phenomenon known as interstellar reddening.
                  - 'figure "Figure 20.14 : Barnard 68 in Infrared. In this image, we see Barnard 68, the same object shown in Figure 20.9. The difference is that, in the previous image, the blue, green, and red channels showed light in the visible (or very nearly visible) part of the spectrum. In this image, the red color shows radiation emitted in the infrared at a wavelength of 2.2 microns. Interstellar extinction is much smaller at infrared than at visible wavelengths, so the stars behind the cloud become visible in the infrared channel. (credit: ESO)" [ref=f309e175]':
                    - img "Barnard 68 in Infrared Light. The same comma-shaped region is shown here as in Figure 20_03_Cloud, but in this case stars are seen all across the nebula since long wavelength infrared light can penetrate the gas and dust of the nebula." [ref=f309e177]
                  - paragraph [ref=f309e179]:
                    - text: Dust does not interact with all the colors of light the same way. Much of the violet, blue, and green light from these stars has been scattered or absorbed by dust, so it does not reach Earth. Some of their orange and red light, with longer wavelengths, on the other hand, more easily penetrates the intervening dust and completes its long journey through space to enter Earth-based telescopes (Figure 20.15). Thus, the star looks redder from Earth than it would if you could see it from nearby. (Strictly speaking,
                    - emphasis [ref=f309e180]: reddening
                    - text: is not the most accurate term for this process, since no red color is added; instead, blues and related colors are subtracted, so it should more properly be called “deblueing.”) In the most extreme cases, stars can be so reddened that they are entirely undetectable at visible wavelengths and can be seen only at infrared or longer wavelengths (Figure 20.14).
                  - 'figure "Figure 20.15 : Scattering of Light by Dust. Interstellar dust scatters blue light more efficiently than red light, thereby making distant stars appear redder and giving clouds of dust near stars a bluish hue. Here, a red ray of light from a star comes straight through to the observer, whereas a blue ray is shown scattering. A similar scattering process makes Earth’s sky look blue." [ref=f309e181]':
                    - img "Illustration of the Scattering of Light by Dust. In this figure a star is drawn and labeled at far left. At far right an arrow is drawn pointing to the right and labeled “To observer”. Emerging from the star are two waves, one short wavelength and drawn in blue, and one long wavelength drawn in red, both moving to the right. At center is an interstellar dust cloud represented as a fuzzy disk with small dots scattered throughout. Inside the cloud, the blue waves coming from the star strike some of these dots and are scattered upward and downward away from the observer. The red waves move through the cloud unimpeded, and travel toward the observer." [ref=f309e183]
                  - paragraph [ref=f309e185]: We have all seen an example of reddening on Earth. The Sun appears much redder at sunset than it does at noon. The lower the Sun is in the sky, the longer the path its light must travel through the atmosphere. Over this greater distance, there is a greater chance that sunlight will be scattered. Since red light is less likely to be scattered than blue light, the Sun appears more and more red as it approaches the horizon.
                  - paragraph [ref=f309e186]: By the way, scattering of sunlight is also what causes our sky to look blue, even though the gases that make up Earth’s atmosphere are transparent. As sunlight comes in, it scatters from the molecules of air. The small size of the molecules means that the blue colors scatter much more efficiently than the greens, yellows, and reds. Thus, the blue in sunlight is scattered out of the beam and all over the sky. The light from the Sun that comes to your eye, on the other hand, is missing some of its blue, so the Sun looks a bit yellower, even when it is high in the sky, than it would from space.
                  - paragraph [ref=f309e187]: The fact that starlight is reddened by interstellar dust means that long-wavelength radiation is transmitted through the Galaxy more efficiently than short-wavelength radiation. Consequently, if we wish to see farther in a direction with considerable interstellar material, we should look at long wavelengths. This simple fact provides one of the motivations for the development of infrared astronomy. In the infrared region at 2 microns (2000 nanometers), for example, the obscuration is only one-sixth as great as in the visible region (500 nanometers), and we can therefore study stars that are more than twice as distant before their light is blocked by interstellar dust. This ability to see farther by observing in the infrared portion of the spectrum represents a major gain for astronomers trying to understand the structure of our Galaxy or probing its puzzling, but distant, center (see The Milky Way Galaxy).
                  - heading "Interstellar Grains" [level=3] [ref=f309e188]
                  - paragraph [ref=f309e189]:
                    - text: Before we get to the details about interstellar dust, we should perhaps get one concern out of the way. Why couldn’t it be the interstellar
                    - emphasis [ref=f309e190]: gas
                    - text: that reddens distant stars and not the dust? We already know from everyday experience that atomic or molecular gas is almost transparent. Consider Earth’s atmosphere. Despite its very high density compared with that of interstellar gas, it is so transparent as to be practically invisible. (Gas does have a few specific spectral lines, but they absorb only a tiny fraction of the light as it passes through.)The quantity of
                    - emphasis [ref=f309e191]: gas
                    - text: required to produce the observed absorption of light in interstellar space would have to be enormous. The gravitational attraction of so great a mass of gas would affect the motions of stars in ways that could easily be detected. Such motions are not observed, and thus, the interstellar absorption cannot be the result of gases.
                  - paragraph [ref=f309e192]:
                    - text: Although gas does not absorb much light, we know from everyday experience that tiny solid or liquid particles can be very efficient absorbers. Water vapor in the air is quite invisible. When some of that vapor condenses into tiny water droplets, however, the resulting cloud is opaque. Dust storms, smoke, and smog offer familiar examples of the efficiency with which solid particles absorb light. On the basis of arguments like these, astronomers have concluded that widely scattered
                    - emphasis [ref=f309e193]: solid
                    - text: particles in interstellar space must be responsible for the observed dimming of starlight. What are these particles made of? And how did they form?
                  - paragraph [ref=f309e194]: Observations like the pictures in this chapter show that a great deal of this dust exists; hence, it must be primarily composed of elements that are abundant in the universe (and in interstellar matter). After hydrogen and helium, the most abundant elements are oxygen, carbon, and nitrogen. These three elements, along with magnesium, silicon, iron—and perhaps hydrogen itself—turn out to be the most important components of interstellar dust.
                  - paragraph [ref=f309e195]: Many of the dust particles can be characterized as sootlike (rich in carbon) or sandlike (containing silicon and oxygen). Grains of interstellar dust are found in meteorites and can be identified because the abundances of certain isotopes are different from what we see in other solar system material. Several different interstellar dust substances have been identified in this way in the laboratory, including graphite and diamonds. (Don’t get excited; these diamonds are only a billionth of a meter in size and would hardly make an impressive engagement ring!)
                  - paragraph [ref=f309e196]:
                    - text: The most widely accepted model pictures the grains with rocky cores that are either like soot (rich in carbon) or like sand (rich in silicates). In the dark clouds where molecules can form, these cores are covered by icy mantles (Figure 20.16). The most common ices in the grains are water (H
                    - subscript [ref=f309e197]: "2"
                    - text: O), methane (CH
                    - subscript [ref=f309e198]: "4"
                    - text: ), and ammonia (NH
                    - subscript [ref=f309e199]: "3"
                    - text: )—all built out of atoms that are especially abundant in the realm of the stars. The ice mantles, in turn, are sites for some of the chemical reactions that produce complex organic molecules.
                  - figure [ref=f309e200]:
                    - img "Model of an Interstellar Dust Grain. At the center of this illustration the core of the dust grain is drawn as an irregular white blob and labeled “Core”. Surrounding the core is a semi-transparent region representing an icy layer and labeled “Mantle”. Within the mantle are labeled some typical constituent molecules, “H2O”, “CH4” and “NH3”." [ref=f309e202]
                    - generic [ref=f309e203]:
                      - text: "Figure 20.16 : Model of an Interstellar Dust Grain. A typical interstellar grain is thought to consist of a core of rocky material (silicates) or graphite, surrounded by a mantle of ices. Typical grain sizes are 10"
                      - superscript [ref=f309e204]: –8
                      - text: to 10
                      - superscript [ref=f309e205]: –7
                      - text: meters. (This is from 1/100 to 1/10 of a micron; by contrast, human hair is about 10–200 microns wide.)
                  - paragraph [ref=f309e206]: Typical individual grains must be just slightly smaller than the wavelength of visible light. If the grains were a lot smaller, they would not block the light efficiently, as Figure 20.13 and other images in this chapter show that it does.
                  - paragraph [ref=f309e207]:
                    - text: On the other hand, if the dust grains were much larger than the wavelength of light, then starlight would not be reddened. Things that are much larger than the wavelength of light would block both blue and red light with equal efficiency. In this way we can deduce that a characteristic interstellar dust grain contains 10
                    - superscript [ref=f309e208]: "6"
                    - text: to 10
                    - superscript [ref=f309e209]: "9"
                    - text: atoms and has a diameter of 10
                    - superscript [ref=f309e210]: –8
                    - text: to 10
                    - superscript [ref=f309e211]: –7
                    - text: meters (10 to 100 nanometers). This is actually more like the specks of solid matter in cigarette smoke than the larger grains of dust you might find under your desk when you are too busy studying astronomy to clean properly.
                  - heading "Further Exploration" [level=2] [ref=f309e212]
                  - paragraph [ref=f309e213]:
                    - text: Interested in learning more about fullerenes, buckyballs, or buckminsterfullerenes (as they’re called)? Watch a brief video from
                    - link "NASA’s Jet Propulsion Laboratory" [ref=f309e214]:
                      - /url: https://openstax.org/l/30NASAjetprop
                    - text: that explains what they are and illustrates how they were discovered in space.
                  - paragraph [ref=f309e215]
