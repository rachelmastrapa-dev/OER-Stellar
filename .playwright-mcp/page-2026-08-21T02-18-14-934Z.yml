            - application "Rich Text Editor, editarea" [ref=f307e322]:
              - iframe [active] [ref=f307e323]:
                - generic [active] [ref=f309e1]:
                  - heading "Interstellar Gases" [level=2] [ref=f309e2]
                  - paragraph [ref=f309e3]: Interstellar gas, depending on where it is located, can be as cold as a few degrees above absolute zero or as hot as a million degrees or more. We will begin our voyage through the interstellar medium by exploring the different conditions under which we find gas.
                  - heading "Ionized Hydrogen (H II) Regions—Gas Near Hot Stars" [level=3] [ref=f309e4]
                  - paragraph [ref=f309e5]: Some of the most spectacular astronomical photographs show interstellar gas located near hot stars (Figure 20.3). The strongest line in the visible region of the hydrogen spectrum is the red line in the Balmer series Scientists also call this red Balmer line the H-alpha line, with alpha meaning it is the first spectral line in the Balmer series.(as explained in the chapter on Radiation and Spectra); this emission line accounts for the characteristic red glow in images like Figure 20.3.
                  - 'figure "Figure 20.3 : Orion Nebula. The red glow that pervades the great Orion Nebula is produced by the first line in the Balmer series of hydrogen. Hydrogen emission indicates that there are hot young stars nearby that ionize these clouds of gas. When electrons then recombine with protons and move back down into lower energy orbits, emission lines are produced. The blue color seen at the edges of some of the clouds is produced by small particles of dust that scatter the light from the hot stars. Dust can also be seen silhouetted against the glowing gas. (credit: NASA,ESA, M. Robberto (Space Telescope Science Institute/ESA) and the Hubble Space Telescope Orion Treasury Project Team)" [ref=f309e6]':
                    - img "Photograph of the Orion Nebula. This image is dominated by large areas and bright swirls of glowing gas clouds, criss-crossed by dark bands of dust." [ref=f309e8]
                  - paragraph [ref=f309e10]: Hot stars are able to heat nearby gas to temperatures close to 10,000 K. The ultraviolet radiation from the stars also ionizes the hydrogen (remember that during ionization, the electron is stripped completely away from the proton). Such a detached proton won’t remain alone forever when attractive electrons are around; it will capture a free electron, becoming a neutral hydrogen once more. However, such a neutral atom can then absorb ultraviolet radiation again and start the cycle over. At a typical moment, most of the atoms near a hot star are in the ionized state.
                  - paragraph [ref=f309e11]: Since hydrogen is the main constituent of interstellar gas, we often characterize a region of space according to whether its hydrogen is neutral or ionized. A cloud of ionized hydrogen is called an H II region. (Scientists who work with spectra use the Roman numeral I to indicate that an atom is neutral; successively higher Roman numerals are used for each higher stage of ionization. H II thus refers to hydrogen that has lost its one electron; Fe III is iron with two electrons missing.)
                  - paragraph [ref=f309e12]:
                    - text: The electrons that are captured by the hydrogen nuclei cascade down through the various energy levels of the hydrogen atoms on their way to the lowest level, or ground state. During each transition downward, they give up energy in the form of light. The process of converting ultraviolet radiation into visible light is called
                    - emphasis [ref=f309e13]: fluorescence
                    - text: . Interstellar gas contains other elements besides hydrogen. Many of them are also ionized in the vicinity of hot stars; they then capture electrons and emit light, just as hydrogen does, allowing them to be observed by astronomers. But generally, the red hydrogen line is the strongest, and that is why H II regions look red.
                  - paragraph [ref=f309e14]: A fluorescent light on Earth works using the same principles as a fluorescent H II region. When you turn on the current, electrons collide with atoms of mercury vapor in the tube. The mercury is excited to a high-energy state because of these collisions. When the electrons in the mercury atoms return to lower-energy levels, some of the energy they emit is in the form of ultraviolet photons. These, in turn, strike a phosphor-coated screen on the inner wall of the light tube. The atoms in the screen absorb the ultraviolet photons and emit visible light as they cascade downward among the energy levels. (The difference is that these atoms give off a wider range of light colors, which mix to give the characteristic white glow of fluorescent lights, whereas the hydrogen atoms in an H II region give off a more limited set of colors.)
                  - heading "Neutral Hydrogen Clouds" [level=3] [ref=f309e15]
                  - paragraph [ref=f309e16]: The very hot stars required to produce H II regions are rare, and only a small fraction of interstellar matter is close enough to such hot stars to be ionized by them. Most of the volume of the interstellar medium is filled with neutral (nonionized) hydrogen. How do we go about looking for it?
                  - paragraph [ref=f309e17]:
                    - text: Unfortunately, neutral hydrogen atoms at temperatures typical of the gas in interstellar space neither emit nor absorb light in the visible part of the spectrum. Nor, for the most part, do the other trace elements that are mixed with the interstellar hydrogen. However, some of these other elements can
                    - emphasis [ref=f309e18]: absorb
                    - text: visible light even at typical interstellar temperatures. This means that when we observe a bright source such as a hot star or a galaxy, we can sometimes see additional lines in its spectrum produced when interstellar gas absorbs light at particular frequencies (see Figure 20.4). Some of the strongest interstellar absorption lines are produced by calcium and sodium, but many other elements can be detected as well in sufficiently sensitive observations (as discussed in Radiation and Spectra).
                  - 'figure "Figure 20.4 : Absorption Lines though an Interstellar Dust Cloud. When there is a significant amount of cool interstellar matter (gas with some dust) between us and a star, we can see the absorption lines of the gas in the star’s spectrum. We can distinguish the two kinds of lines because, whereas the star’s lines are broad, the lines from the gas are narrower." [ref=f309e19]':
                    - img [ref=f309e21]
                  - paragraph [ref=f309e23]: "The first evidence for absorption by interstellar clouds came from the analysis of a spectroscopic binary star (see The Stars: A Celestial Census), published in 1904. While most of the lines in the spectrum of this binary shifted alternately from longer to shorter wavelengths and back again, as we would expect from the Doppler effect for stars in orbit around each other, a few lines in the spectrum remained fixed in wavelength. Since both stars are moving in a binary system, lines that showed no motion puzzled astronomers. The lines were also peculiar in that they were much, much narrower than the rest of the lines, indicating that the gas producing them was at a very low pressure. Subsequent work demonstrated that these lines were not formed in the star’s atmosphere at all, but rather in a cold cloud of gas located between Earth and the binary star."
                  - paragraph [ref=f309e24]: While these and similar observations proved there was interstellar gas, they could not yet detect hydrogen, the most common element, due to its lack of spectral features in the visible part of the spectrum. (The Balmer line of hydrogen is in the visible range, but only excited hydrogen atoms produce it. In the cold interstellar medium, the hydrogen atoms are all in the ground state and no electrons are in the higher-energy levels required to produce either emission or absorption lines in the Balmer series.) Direct detection of hydrogen had to await the development of telescopes capable of seeing very-low-energy changes in hydrogen atoms in other parts of the spectrum. The first such observations were made using radio telescopes, and radio emission and absorption by interstellar hydrogen remains one of our main tools for studying the vast amounts of cold hydrogen in the universe to this day.
                  - paragraph [ref=f309e25]: In 1944, while he was still a student, the Dutch astronomer Hendrik van de Hulst predicted that hydrogen would produce a strong line at a wavelength of 21 centimeters. That’s quite a long wavelength, implying that the wave has such a low frequency and low energy that it cannot come from electrons jumping between energy levels (as we discussed in Radiation and Spectra). Instead, energy is emitted when the electron does a flip, something like an acrobat in a circus flipping upright after standing on his head.
                  - paragraph [ref=f309e26]:
                    - text: "The flip works like this: a hydrogen atom consists of a proton and an electron bound together. Both the proton and the electron act is if they were spinning like tops, and spin axes of the two tops can either be pointed in the same direction (aligned) or in opposite directions (anti-aligned). If the proton and electron were spinning in opposite directions, the atom as a whole would have a very slightly lower energy than if the two spins were aligned (Figure 20.5). If an atom in the lower-energy state (spins opposed) acquired a small amount of energy, then the spins of the proton and electron could be aligned, leaving the atom in a slightly"
                    - emphasis [ref=f309e27]: excited state
                    - text: . If the atom then lost that same amount of energy again, it would return to its ground state. The amount of energy involved corresponds to a wave with a wavelength of 21 centimeters; hence, it is known as the
                    - emphasis [ref=f309e28]: 21-centimeter line
                    - text: .
                  - 'figure "Figure 20.5 : Formation of the 21-Centimeter Line. When the electron in a hydrogen atom is in the orbit closest to the nucleus, the proton and the electron may be spinning either (a) in the same direction or (b) in opposite directions. When the electron flips over, the atom gains or loses a tiny bit of energy by either absorbing or emitting electromagnetic energy with a wavelength of 21 centimeters." [ref=f309e29]':
                    - img [ref=f309e31]
                  - paragraph [ref=f309e33]: Neutral hydrogen atoms can acquire small amounts of energy through collisions with other hydrogen atoms or with free electrons. Such collisions are extremely rare in the sparse gases of interstellar space. An individual atom may wait centuries before such an encounter aligns the spins of its proton and electron. Nevertheless, over many millions of years, a significant fraction of the hydrogen atoms are excited by a collision. (Out there in cold space, that’s about as much excitement as an atom typically experiences.)
                  - paragraph [ref=f309e34]: An excited atom can later lose its excess energy either by colliding with another particle or by giving off a radio wave with a wavelength of 21 centimeters. If there are no collisions, an excited hydrogen atom will wait an average of about 10 million years before emitting a photon and returning to its state of lowest energy. Even though the probability that any single atom will emit a photon is low, there are so many hydrogen atoms in a typical gas cloud that collectively they will produce an observable line at 21 centimeters.
                  - paragraph [ref=f309e35]:
                    - text: Equipment sensitive enough to detect the 21-cm line of neutral hydrogen became available in 1951. Dutch astronomers had built an instrument to detect the 21-cm waves that they had predicted, but a fire destroyed it. As a result, two Harvard physicists, Harold
                    - generic [ref=f309e36]: Ewen
                    - text: and Edward Purcell, made the first detection (Figure 20.6), soon followed by confirmations from the Dutch and a group in Australia. Since the detection of the 21-cm line, many other radio lines produced by both atoms and molecules have been discovered (as we will discuss in a moment), and these have allowed astronomers to map out the neutral gas throughout our home Galaxy. Astronomers have also detected neutral interstellar gas, including hydrogen, at many other wavelengths from the infrared to the ultraviolet.
                  - 'figure "Figure 20.6 : Harold Ewen (1922–2015) and Edward Purcell (1912–1997). We see Harold Ewen in 1952 working with the horn antenna (atop the physics laboratory at Harvard) that made the first detection of interstellar 21-cm radiation. The inset shows Edward Purcell, the winner of the 1952 Nobel Prize in physics, a few years later. (credit: modification of work by NRAO)" [ref=f309e37]':
                    - 'img "Photograph of Harold Ewen inspecting the horn antenna at Harvard. Inset: photograph of Edward Purcell." [ref=f309e39]'
                  - paragraph [ref=f309e41]:
                    - text: Modern radio observations show that most of the neutral hydrogen in our Galaxy is confined to an extremely flat layer, less than 300 light-years thick, that extends throughout the disk of the Milky Way Galaxy. This gas has densities ranging from about 0.1 to about 100 atoms per
                    - generic [ref=f309e42]:
                      - text: cm
                      - superscript [ref=f309e43]: "3"
                    - text: ", and it exists at a wide range of temperatures, from as low as about 100 K (–173 °C) to as high as about 8000 K. These regions of warm and cold gas are interspersed with each other, and the density and temperature at any particular point in space are constantly changing."
                  - heading "Ultra-Hot Interstellar Gas" [level=3] [ref=f309e44]
                  - paragraph [ref=f309e45]:
                    - text: While the temperatures of 10,000 K found in H II regions might seem warm, they are not the hottest phase of the interstellar medium. Some of the interstellar gas is at a temperature of a
                    - emphasis [ref=f309e46]: million
                    - text: degrees, even though there is no visible source of heat nearby. The discovery of this ultra-hot interstellar gas was a big surprise. Before the launch of astronomical observatories into space, which could see radiation in the ultraviolet and X-ray parts of the spectrum, astronomers assumed that most of the region between stars was filled with hydrogen at temperatures no warmer than those found in H II regions. But telescopes launched above Earth’s atmosphere obtained ultraviolet spectra that contained interstellar lines produced by oxygen atoms that have been ionized five times. To strip five electrons from their orbits around an oxygen nucleus requires a lot of energy. Subsequent observations with orbiting X-ray telescopes revealed that the Galaxy is filled with numerous bubbles of X-ray-emitting gas. To emit X-rays, and to contain oxygen atoms that have been ionized five times, gas must be heated to temperatures of a million degrees or more.
                  - paragraph [ref=f309e47]:
                    - text: Theorists have now shown that the source of energy producing these remarkable temperatures is the explosion of massive stars at the ends of their lives (Figure 20.7). Such explosions, called
                    - emphasis [ref=f309e48]: supernovae
                    - text: ", will be discussed in detail in the chapter on The Death of Stars. For now, we’ll just say that some stars, nearing the ends of their lives, become unstable and literally explode. These explosions launch gas into interstellar space at velocities of tens of thousands of kilometers per second (up to about 30% the speed of light). When this ejected gas collides with interstellar gas, it produces shocks that heat the gas to millions or tens of millions of degrees."
                  - 'figure "Figure 20.7 : Vela Supernova Remnant. About 11,000 years ago, a dying star in the constellation of Vela exploded, becoming as bright as the full moon in Earth’s skies. You can see the faint rounded filaments from that explosion in the center of this colorful image. The edges of the remnant are colliding with the interstellar medium, heating the gas they plow through to temperatures of millions of K. Telescopes in space also reveal a glowing sphere of X-ray radiation from the remnant. (credit: Digitized Sky Survey, ESA/ESO/NASA FITS Liberator, Davide De Martin)" [ref=f309e49]':
                    - img "The Vela Supernova Remnant. This ancient supernova remnant appears to us now as a thin circular shaped region, with delicate tendrils of light along the edges where the gas collides with the interstellar medium." [ref=f309e51]
                  - paragraph [ref=f309e53]: Astronomers estimate that one supernova explodes roughly every 100 years somewhere in the Galaxy. On average, shocks launched by supernovae sweep through any given point in the Galaxy about once every few million years. These shocks keep some interstellar space filled with gas at temperatures of millions of degrees, and they continually disturb the colder gas, keeping it in constant, turbulent motion.
                  - heading "Molecular Clouds" [level=3] [ref=f309e54]
                  - paragraph [ref=f309e55]: A few simple molecules out in space, such as CN and CH, were discovered decades ago because they produce absorption lines in the visible-light spectra of stars behind them. When more sophisticated equipment for obtaining spectra in radio and infrared wavelengths became available, astronomers—to their surprise—found much more complex molecules in interstellar clouds as well.
                  - paragraph [ref=f309e56]: Just as atoms leave their “fingerprints” in the spectrum of visible light, so the vibration and rotation of atoms within molecules can leave spectral fingerprints in radio and infrared waves. If we spread out the radiation at such longer wavelengths, we can detect emission or absorption lines in the spectra that are characteristic of specific molecules. Over the years, experiments in our laboratories have shown us the exact wavelengths associated with changes in the rotation and vibration of many common molecules, giving us a template of possible lines against which we can now compare our observations of interstellar matter.
                  - paragraph [ref=f309e57]:
                    - text: The discovery of complex molecules in space came as a surprise because most of interstellar space is filled with ultraviolet light from stars, and this light is capable of
                    - emphasis [ref=f309e58]: dissociating
                    - text: molecules (breaking them apart into individual atoms). In retrospect, however, the presence of molecules is not surprising. As we will discuss further in the next section, and have already seen above, interstellar space also contains significant amounts of dust capable of blocking out starlight. When this dust accumulates in a single location, the result is a dark cloud where ultraviolet starlight is blocked and molecules can survive. The largest of these structures are created where gravity pulls interstellar gas together to form giant molecular clouds, structures as massive as a million times the mass of the Sun. Within these, most of the interstellar hydrogen has formed the molecule H
                    - subscript [ref=f309e59]: "2"
                    - text: (molecular hydrogen). Other, more complex molecules are also present in much smaller quantities.
                  - paragraph [ref=f309e60]:
                    - text: Giant molecular clouds have densities of hundreds to thousands of atoms per
                    - generic [ref=f309e61]:
                      - text: cm
                      - superscript [ref=f309e62]: "3"
                    - text: ", much denser than interstellar space is on average. As a result, though they account for a very small fraction of the volume of interstellar space, they contain a significant fraction—20–30%—of the total mass of the Milky Way’s gas. Because of their high density, molecular clouds block ultraviolet starlight, the main agent for heating most interstellar gas. As a result, they tend to be extremely cold, with typical temperatures near 10 K (−263 °C). Giant molecular clouds are also the sites where new stars form, as we will discuss below."
                  - paragraph [ref=f309e63]:
                    - text: It is in these dark regions of space, protected from starlight, that molecules can form. Chemical reactions occurring both in the gas and on the surface of dust grains lead to much more complex compounds, hundreds of which have been identified in interstellar space. Among the simplest of these are water (
                    - generic [ref=f309e64]:
                      - text: H
                      - subscript [ref=f309e65]: "2"
                      - text: O
                    - text: ), carbon monoxide (CO), which is produced by fires on Earth, and ammonia (
                    - generic [ref=f309e66]:
                      - text: NH
                      - subscript [ref=f309e67]: "3"
                    - text: ), whose smell you recognize in strong home cleaning products. Carbon monoxide is particularly abundant in interstellar space and is the primary tool that astronomers use to study giant molecular clouds. Unfortunately, the most abundant molecule, H
                    - subscript [ref=f309e68]: "2"
                    - text: ", is particularly difficult to observe directly because in most giant molecular clouds, it is too cold to emit even at radio wavelengths. CO, which tends to be present wherever H"
                    - subscript [ref=f309e69]: "2"
                    - text: is found, is a much better emitter and is often used by astronomers to trace molecular hydrogen.
                  - paragraph [ref=f309e70]:
                    - text: The more complex molecules astronomers have found are mostly combinations of hydrogen, oxygen, carbon, nitrogen, and sulfur atoms. Many of these molecules are
                    - emphasis [ref=f309e71]: organic
                    - text: (those that contain carbon and are associated with the carbon chemistry of life on Earth.) They include formaldehyde (used to preserve living tissues), alcohol (see the feature box on Cocktails in Space), and antifreeze.
                  - paragraph [ref=f309e72]:
                    - text: In 1996, astronomers discovered acetic acid (the prime ingredient of vinegar) in a cloud lying in the direction of the constellation of Sagittarius. To balance the sour with the sweet, a simple sugar (glycolaldehyde) has also been found. The largest compounds yet discovered in interstellar space are
                    - emphasis [ref=f309e73]: fullerenes
                    - text: ", molecules in which 60 or 70 carbon atoms are arranged in a cage-like configuration (see Figure 20.8). See Table 20.1 for a list of a few of the more interesting interstellar molecules that have been found so far."
                  - 'figure "Figure 20.8 : Fullerene C60. This three-dimensional perspective shows the characteristic cage-like arrangement of the 60 carbon atoms in a molecule of fullerene C60. Fullerene C60 is also known as a “buckyball,” or as its full name, buckminsterfullerene, because of its similarity to the multisided architectural domes designed by American inventor R. Buckminster Fuller." [ref=f309e74]':
                    - img "Artist’s 3D Rendering of a Fullerene C60 Molecule. Carbon atoms are shown as black spheres, and the chemical bonds between them shown as black cylinders. The shape of the “buckyball” is similar to that of a soccer ball; alternating pentagons and hexagons arranged into a hollow sphere." [ref=f309e76]
