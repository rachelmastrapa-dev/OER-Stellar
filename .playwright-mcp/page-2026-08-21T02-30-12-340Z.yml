            - application "Rich Text Editor, editarea" [ref=f376e312]:
              - iframe [active] [ref=f376e313]:
                - generic [active] [ref=f378e1]:
                  - heading "Science and Society - Indigenous African Astronomy" [level=2] [ref=f378e2]
                  - paragraph [ref=f378e3]: This Science and Society is inspired by Dr. Jarita Holbrook's Astrobites article from 2020, which focuses on one of her publications about Indigenous African astronomy, exploring the relationship between women and the night sky in African cultures.
                  - paragraph [ref=f378e4]: "Dr. Jarita Holbrook is an astronomer. However, she studies more than just the sky in her research. After earning her PhD in Astronomy & Astrophysics from University of California, Santa Cruz, her interests shifted towards something more interdisciplinary: cultural astronomy, particularly indigenous African astronomy. Her work has centered on how humans relate to space, whether that’s in her award-winning movie Black Suns: An Astrophysics Adventure, the AAS Oral History project that serves to record generations of astronomers and their stories, or in her research on cultural astronomy."
                  - paragraph [ref=f378e5]: According to Dr. Holbrook, stories and beliefs surrounding the night sky are reflections of the culture that creates them and their ideals; accordingly, the goal of one of her projects, "Celestial Women in Africa," is to look at feminine celestial bodies to understand “how the idealized role of women gets projected onto the sky and how the behavior of celestial bodies gets projected onto women” in various cultures. It is important to note that Africa is a large continent, with no singular “African culture." In reality, it holds over 50 nations, and many more languages. Here, we focus on just one example from her research and it is by no means representative of the entirety of Africa and its many different cultures. You can explore more of Dr. Holbrook's work in the full Astrobites article or on her website, both linked at the end of this page.
                  - heading "“Girls of the Night”" [level=3] [ref=f378e6]
                  - paragraph [ref=f378e7]: "The Pleiades are a tight cluster of stars, brightly visible in the night sky. There are six main stars and they are often considered a group of sisters or sometimes a clutch of eggs. There are many myths across the world connected to this astronomical object, such as the Greek myth from which its commonly used name arises. The Tuareg of the Sahara have their own myth for the Pleiades, calling them the six “girls of the night” with individual names for each bright star (Mâteredjrê, Erredjeàot, Mâteseksek, Essekâot, Màtelarhlarh and Ellerhâot). The seventh “star” is considered to be the eye of a boy from a different legend, and is thought to correspond to Venus (Figure \\(\\PageIndex{1}\\)) includes five simulated images of Venus passing through the Pleiades during April 1 to April 5 in 2020."
                  - figure [ref=f378e8]:
                    - img "A simulation of the night sky showing the Pleiades and Venus. Details in caption." [ref=f378e9]
                    - paragraph [ref=f378e11]:
                      - text: "Figure \\(\\PageIndex{1}\\): The Pleiades and Venus. Simulations of the night sky around the Pleiades at various dates, showing the movement of the interloping “seventh star” of the group, often found in various cultural stories. The interloper is actually the planet Venus. ("
                      - link "CC BY-NC 4.0" [ref=f378e12]:
                        - /url: https://creativecommons.org/licenses/by-nc/4.0/
                      - text: ;
                      - link "Briley Lewis" [ref=f378e13]:
                        - /url: http://www.briley-lewis.com/
                      - text: via
                      - link "Astrobites" [ref=f378e14]:
                        - /url: https://astrobites.org/2020/08/28/african-cultural-astronomy/
                      - text: ).
                  - paragraph [ref=f378e15]: "Other groups had different names for this celestial object. The Arimi of Tanzania named the Pleiades “Kiimia” and considered her to be the supreme wife and mother, with her return in September marking the end of the dry season. Her characteristics signaled the ideals for women in their culture, such as caring for people and offering water to those in need. Many other cultures used the heliacal rise (that is, the first time a celestial object reappears in the sky in a given year) of the Pleiades to mark the start of cultivation or the new year. The KhoiKhoi people of Southern Africa also have a legend for the Pleiades: a group of women in a polygamous marriage sent their husband out to hunt, and told him not to return without meat. He was unsuccessful in his hunt, and thus unable to return home. This again is a reflection of societal gender roles, and the expectations of behavior for both men and women."
                  - heading "Other Celestial Bodies" [level=3] [ref=f378e16]
                  - paragraph [ref=f378e17]: Most of Africa considers the Sun male, such as the famous Egyptian Sun god Ra. However, a few cultures consider the Sun female, either permanently (such as with the G/Wikhwena San of Botswana) or as it changes position on the sky. The Sandawe of Tanzania consider the Sun less masculine when it is lower in the sky and less harsh, and it becomes more masculine as it reaches its zenith. In Hausa and a few other Berber languages, the word for the Moon is masculine (a young boy) and the Sun is its mother, chasing it around the sky.
                  - paragraph [ref=f378e18]: Venus is another celestial body that is almost universally considered female, possibly because its brightness and beauty are qualities that some cultures associate with femininity.. Its “evening star” and “morning star” phases (when Venus is visible at sunset or sunrise) are each 263 days, astoundingly close to the period for pregnancy/human gestation of 255-256 days, giving another coincidental link between the cycles of the sky and the cycles of the body. There are also many cultures where Venus is considered the wife of the Moon in some way, such as the Tabwe and Zande people of the Democratic Republic of Congo.
                  - paragraph [ref=f378e19]: There are many other celestial bodies that are somehow related to femininity. The Arimi of Tanzania consider the Small Magellanic Cloud female, and it helps to bring the heaviest rains of the season. Female animals appear in constellations, such as female giraffes in Crux and a female steenbok as the brightest star in Pavo in G/Wikhwena San culture. The Tuareg of the Sahara consider Polaris (the pole star, which appears stationary in the sky) to be a Black woman, who keeps still for fear that the other stars will kill or enslave her. For the |Xam people of South Africa, a girl creates the Milky Way by throwing ashes and roots into the sky. In Ancient Egypt, the sky goddess Nut “swallows the Sun (Re) every night and gives birth to him in the East every morning” and her daughter Isis (the star Sirius) follows her husband Osiris (the constellation Orion) across the sky to put him back together after he was killed. Isis (and earlier Hathor) were both associated with the star Sirius and served as mother/female goddesses. Lastly, among the Akan of Ghana, many important ancestral women are said to have come down from the sky, giving them authority as they are “of the land that they now occupy.”
                  - paragraph [ref=f378e20]: Although this is not a comprehensive study of all African sky lore, this gendered study provides an intriguing insight into the cultural importance of celestial bodies and how they align with expectations and ideals of women. Some results were expected and in alignment with other cultures around the world, but others (such as female suns and male moons) were unexpected and unique. Women of Africa’s sky are magical goddesses of creation, and also women who have suffered or been punished, showcasing the breadth of human experience.
                  - paragraph [ref=f378e21]: As astronomers, we too often neglect the history of the field of astronomy and the rich cultural heritage of the sky, especially from a non-Western perspective. All of this information preserves a snapshot of people and their cultures through connections to the sky. Studies such as this highlight the richness of humanity’s history of looking up, which is far more expansive than the modern research field.
