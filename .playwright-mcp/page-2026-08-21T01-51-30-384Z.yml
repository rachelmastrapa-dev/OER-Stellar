            - application "Rich Text Editor, editarea" [ref=f145e343]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f145e357]: "<h2>Modern Telescopes</h2> <p class=\"lt-phys-64685\">Since Newton’s time, when the sizes of&nbsp;mirrors in telescopes were measured in inches, reflecting telescopes have grown ever larger. In 1948, US astronomers built a telescope with a 5-meter (200-inch) diameter mirror on Palomar Mountain in Southern California. It remained the largest visible-light telescope in the world for several decades. The giants of today, however, have primary mirrors that are 8&nbsp;to 10 meters in diameter, Figure \\(\\PageIndex{1}\\).</p> <figure><img alt=\"8-meter primary mirror of the VLT. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46000/4af9e09f29e309a1d2af93cea27414b50e960d1d\" /> <figcaption>Figure \\(\\PageIndex{1}\\): ESO Very Large Telescope Mirror. Modern telescopes use very large primary mirrors. This mirror from the&nbsp;European Southern Observatory’s Very Large Telescope, named Yepun,&nbsp;is a little over 8 meters in diameter. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.2.1_ESO_Very_Large_Telescope_Mirror\" title=\"5.8: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64685\">Seventeen telescopes with mirrors 6.5 meters in diameter and larger have been constructed since 1990. The appendix of this textbook includes an incomplete list of <a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.02:_Tables#Visible+and+Infrared+Telescopes\" target=\"_blank\" title=\"18.5: Tables\">visible and infrared telescopes</a>&nbsp;for reference. Technological advancements had finally made it possible to build telescopes significantly larger than the 5-meter telescope at Palomar at a reasonable cost. New technologies have also been designed to work well in the infrared, and not just visible, wavelengths.</p> <p class=\"lt-phys-64685\">The differences between the Palomar telescope and the modern Gemini North telescope are in Figure \\(\\PageIndex{2}\\). At Palomar Observatory, the Hale telescope is a massive steel structure designed to hold the 14.5-ton primary mirror with a 5-meter diameter. Glass tends to sag under its own weight, so a steel structure is needed to hold the mirror. The main structure of the telescope is a long metal tube that contributes to the weight of the structure. The mirror is not visible because it is inside the tube. The Hale telescope also has a complex mounting system that enables the telescope to swing easily into any position. The overall structure is so large and complex that a person standing below it would appear tiny by comparison. This design would also be very expensive to scale up to a larger mirror.</p> <figure><img alt=\"Palomar 5-meter and Gemini North 8-meter telescopes. Details in text.\" class=\"internal default\" src=\"/@api/deki/files/46001/ec530a0ab58aa32d1dcd16ad7932cd945c6ab7ca\" /> <figcaption>Figure \\(\\PageIndex{2}\\): Comparing Telescopes. (a) The Palomar 5-meter reflector&nbsp;(b) The Gemini North 8-meter telescope. Description in text. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).</figcaption> </figure> <p class=\"lt-phys-64685\">The Gemini North telescope was completed about 50 years after the Palomar telescope. Engineers took advantage of new technologies to build a telescope that is much lighter in weight relative to the size of the primary mirror. The result is a significantly simpler and lighter telescope. The large tube design has been replaced, with an open structure of metal struts that support the secondary mirror at the prime focus. The primary mirror, visible through the open structure, is only about 8 inches thick and weighs 24.5 tons, less than twice as much as the Palomar mirror. The Gemini mirror corrects for gravitationally induced sag by a process called active control. Modern computers can measure mirror sag many times each second and apply forces at 120 different locations to the back of the mirror. A mirror 8 meters in diameter, the size of the Gemini North telescope, if it were built using the same technology as the Palomar telescope, would have to weigh at least eight times as much and would require an enormous steel structure to support it.</p> <h3>Observing Sites</h3> <p class=\"lt-phys-64685\">Since the end of the nineteenth century, astronomers have realized that the best observatory sites are on mountains, far from the lights and pollution of cities. Modern observatories are located on desert mountains or isolated peaks in the Atlantic and Pacific Oceans. These locations include the staff’s living quarters, computers, electronic and machine shops, and of course, the telescopes themselves. A large observatory today requires a supporting staff of 20 to 100 people.</p> <p class=\"lt-phys-64685\">The performance of a telescope is determined not only by the size of its mirror but also by its location. Earth’s atmosphere&nbsp;presents challenges for the observational astronomer. In at least four ways, our air imposes limitations on the usefulness of telescopes:</p> <ol> <li class=\"lt-phys-64685\">Weather conditions such as clouds, wind, and rain prevent observations. At the best sites, the weather is clear as much as 75% of the time.</li> <li class=\"lt-phys-64685\">Water vapor in the atmosphere absorbs some of the starlight, especially in the infrared. Astronomers therefore prefer dry sites, generally found at high altitudes.</li> <li class=\"lt-phys-64685\">Observatories are best located at least 100 miles from the nearest large city to avoid contamination by light pollution.</li> <li class=\"lt-phys-64685\">Turbulent air, also called bad seeing, results in distorted images. Observatories are located where the atmosphere is consistently calm.</li> </ol> <p class=\"lt-phys-64685\">The best observatory sites are therefore calm, high, dark, and dry. The world’s largest telescopes are found in such remote mountain locations as the Andes Mountains of Chile, the desert peaks of Arizona, the Canary Islands in the Atlantic Ocean, and Maunakea in Hawaii, a dormant volcano with an altitude of 13,700 feet (4200 meters). The <a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.06:_Ethics_of_Building_Telescopes\" target=\"_blank\" title=\"5.6: Ethics of Building Telescopes\">Science and Society</a> page at the end of this chapter discusses the ethical implications of building telescopes.</p> <h3>Observations</h3> <p class=\"lt-phys-64685\">In the past, an astronomer would spend most nights in a cold observatory peering through a telescope, but this is not accurate today. Most astronomers do not live at observatories, but near the universities or laboratories where they work. An astronomer might spend only a week or so each year observing at the telescope and the rest of the time measuring or analyzing the data acquired from large project collaborations and dedicated surveys. Like many people&nbsp;who&nbsp;work from home, astronomers can also observe remotely. Coordinating with the telescope operator at the observatory, the astronomer can collect their data without the expense of traveling to remote areas and the challenges of working at high altitude. Note that observatories operating&nbsp;telescopes that cost $100 million do not let anyone but their own staff operate their complex and delicate telescopes. Not all astronomers work nights. Some use radio telescopes, which work just as well during the daylight hours. Other astronomers&nbsp;analyze data from spacecraft, which also can collect data at any time. Still others work at purely theoretical problems using computers to model complex astrophysical processes and never observe at a telescope.</p> <p class=\"lt-phys-64685\">Observing time on major telescopes is at a premium, and an observatory director will typically receive many more requests for telescope time than can be accommodated during the year. Astronomers must therefore write a convincing proposal explaining how they would like to use the telescope and why their observations will be important to the progress of astronomy. A committee of astronomers is then asked to judge and rank the proposals, and time is assigned only to those with the greatest merit. Even if your proposal is among the highest-rated ones, you may have to wait many months for your turn. If the skies are cloudy on the nights you have been assigned, it may be more than a year before you get another chance.</p> <h2>New Telescopes</h2> <p>Astronomers and engineers are working on the technologies that will allow us to explore even more distant parts of the universe and to see them more clearly. The Vera Rubin Observatory produced its first images of the sky, also known as first light, in 2025. The observatory is named after the <a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.19:_Rubin_Vera\" target=\"_blank\" title=\"18.1.18: Rubin, Vera\">American astronomer</a> whose work led us to the understanding that much of the universe is made of a mysterious substance that scientists call dark matter. This 8.4-meter telescope has a significantly larger field of view than any existing telescopes. It has begun its 10-year program to rapidly scan the sky to find transients, phenomena that change quickly, such as exploding stars and chunks of rock that orbit near Earth.</p> <figure><img alt=\"Vera Rubin Observatory, Cerro Pachón ridge, Chile. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/66440/1024px-Vera_C._Rubin_Observatory%252C_iotw2229a_-_Night_Light.jpg\" /> <figcaption>Figure \\(\\PageIndex{3}\\):&nbsp;Located on Cerro Pachon in Chile, the Vera Rubin Observatory has an 8.4 meter primary mirror and has been operating since 2025. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://rubinobservatory.org/\" target=\"_blank\" title=\"Rubin Observatory/NOIRLab/NSF/AURA/B. Quint\">Rubin Observatory/NOIRLab/NSF/AURA/B. Quint</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Vera_C._Rubin_Observatory,_iotw2229a_-_Night_Light.jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.2.3__Vera_Rubin_Observatory\" title=\"5.8: Accessible Descriptions\">Alternative description of&nbsp;Figure \\(\\PageIndex{3}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64689\">Several groups of astronomers around the globe interested in studying visible and infrared light are exploring the feasibility of building ground-based telescopes with mirrors larger than 30 meters across, one-third the length of a football field. We do not have the technology to build and transport a single astronomical mirror that is 30 meters or larger in diameter. The primary mirror of these giant telescopes will consist of smaller mirrors, all aligned so that they act as a very large mirror in combination.</p> <p class=\"lt-phys-64689\">The most ambitious of these projects is the European Extremely Large Telescope&nbsp;(ELT). The design of the European ELT calls for a 39.3-meter primary mirror, which will follow the Keck Telescope design and be made up of 798 hexagonal mirrors, each 1.4 meters in diameter and all held precisely in position so that they form a continuous surface. Construction on the site in the Atacama Desert in Northern Chile started in 2014, and the telescope structure is nearing completion, Figure \\(\\PageIndex{4}\\). Scientific first light is planned for 2030.</p> <figure><img alt=\"Mid-construction Extrememly Large Telescope (ELT) structure.\" class=\"internal default\" height=\"599px\" src=\"/@api/deki/files/66442/HeartofELT.jpg\" style=\"width: 858px; height: 599px;\" width=\"858px\" /> <figcaption>Figure \\(\\PageIndex{4}\\): The Heart of the ELT. ESO's Picture of the Day for February 2, 2026, construction is ongoing on the mirror support system&nbsp;of the Extremely Large Telescope (ELT). (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://www.eso.org/public/\" target=\"_blank\" title=\"ESO/J. C. Muñoz-Mateos\">ESO/J. C. Muñoz-Mateos</a> via <a href=\"https://www.eso.org/public/images/potw2605a/\" target=\"_blank\" title=\"ESO\">ESO</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.2.4__The_Heart_of_the_ELT\" title=\"5.8: Accessible Descriptions\">Alternative description of&nbsp;Figure \\(\\PageIndex{4}\\)</a>.</figcaption> </figure> <p>International consortia with major contributions from U.S. astronomers have developed plans for the construction of two new large telescopes. One is a Thirty-Meter Telescope (TMT). The design of this telescope is similar to that of the European ELT and will make use of 492 hexagonal elements. Each segment is about 1.44 meters (56.6 inches) across corners. The segments are closely spaced, with gaps between the segments only 2.5 mm (0.1 inch) wide.</p> <p class=\"lt-phys-64689\">The Giant Magellan Telescope (GMT) is the second ELT project with major participation by U.S. astronomers. The GMT is also a segmented mirror telescope that employs seven stiff monolith 8.4-meter mirrors as segments. Construction has started at the selected site, which is near the Las Campanas Observatory on the southern edge of the Atacama Desert.</p> <p class=\"lt-phys-64689\">These giant telescopes will combine light-gathering power with high-resolution imaging. These powerful new instruments will enable astronomers to tackle many important astronomical problems. As just one example, they provide us images and spectra of planets around other stars and thus, perhaps, give us the first real evidence from the chemistry of these planets’ atmospheres that life exists elsewhere.</p> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: Interactive Activity</span></h5> <ul> <li>Explore the <a href=\"https://sites.astro.caltech.edu/palomar/homepage.html\" rel=\"noopener noreferrer\" target=\"_blank\">Palomar Observatory website</a> to learn about the historic Hale 5-meter telescope and its role in advancing twentieth-century astronomical research.</li> <li>Visit the <a href=\"https://www.eso.org/public/teles-instr/paranal-observatory/vlt/\" rel=\"noopener noreferrer\" target=\"_blank\">ESO Very Large Telescope website</a> to investigate how one of the world's premier observatories uses large mirrors and advanced instruments to study the universe.</li> <li>Explore the <a href=\"https://www.gemini.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">Gemini Observatory website</a> to learn how modern optical and infrared telescopes collect high-resolution observations of stars, planets, and galaxies.</li> <li>Watch the <a href=\"https://play.history.com/shows/modern-marvels/videos/keck-observatory\" rel=\"noopener noreferrer\" target=\"_blank\">Modern Marvels: Keck Observatory video</a> from The History Channel to discover how segmented mirrors and innovative engineering made some of the world's largest telescopes possible.</li> <li>Explore the&nbsp;<a href=\"https://rubinobservatory.org/\" title=\"https://rubinobservatory.org/\">Vera C. Rubin Observatory</a> website to learn about large-scale sky surveys and how astronomers search for transient phenomena, near-Earth objects, and evidence of dark matter.</li> <li>Visit the <a href=\"https://elt.eso.org/\" title=\"https://elt.eso.org/\">ESO Extremely Large Telescope</a> website to explore the design and scientific goals of one of the largest optical and infrared telescopes ever constructed.</li> <li>Explore the <a href=\"http://tmt.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Thirty Meter Telescope (TMT) website</a> to learn about the technologies and scientific objectives of next-generation ground-based astronomy.</li> <li>Visit the <a href=\"https://giantmagellan.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Giant Magellan Telescope website</a> to investigate how giant segmented-mirror telescopes will provide unprecedented views of distant planets, stars, and galaxies.</li> <li>Explore the&nbsp;<a href=\"https://darksky.org/\" title=\"https://darksky.org/\">International Dark-Sky Association</a> website to learn about light pollution and efforts to preserve dark skies for astronomy, wildlife, and human health. <ul> <li>Participate in the <a href=\"https://globeatnight.org/\" rel=\"noopener noreferrer\" target=\"_blank\">Globe at Night citizen-science project</a> to measure local light pollution and contribute observations to a global database.</li> <li>Read <a href=\"https://astrosociety.org/education-outreach/resource-guides/dark-skies-and-light-pollution.html\" title=\"https://astrosociety.org/education-outreach/resource-guides/dark-skies-and-light-pollution.html\">Dark Skies and Light Pollution</a> by Andrew Fraknoi to explore the causes and consequences of light pollution and ways to reduce its impact.</li> </ul> </li> </ul> </section>"
