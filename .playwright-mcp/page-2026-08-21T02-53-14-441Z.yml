                    - strong [ref=f510e5]: elliptical galaxy
                    - text: ": A galaxy whose shape is an ellipse and that contains no conspicuous interstellar material."
                  - listitem [ref=f510e6]:
                    - strong [ref=f510e8]: expanding universe
                    - text: ": The increase in distance between gravitationally unbound parts of the observable universe with time."
                  - listitem [ref=f510e9]:
                    - strong [ref=f510e11]: Hubble constant
                    - text: ": A constant of proportionality in the law relating the velocities of remote galaxies to their distances."
                  - listitem [ref=f510e12]:
                    - strong [ref=f510e14]: Hubble's law
                    - text: ": A rule that the radial velocities of remote galaxies are proportional to their distances from us."
                  - listitem [ref=f510e15]:
                    - strong [ref=f510e17]: irregular galaxy
                    - text: ": A galaxy without any clear symmetry or pattern; neither a spiral nor an elliptical galaxy."
                  - listitem [ref=f510e18]:
                    - strong [ref=f510e20]: mass-to-light ratio
                    - text: ": The ratio of the total mass of a galaxy to its total luminosity, usually expressed in units of solar mass and solar luminosity; the mass-to-light ratio gives a rough indication of the types of stars contained within a galaxy and whether or not substantial quantities of dark matter are present."
                  - listitem [ref=f510e21]:
                    - strong [ref=f510e23]: spiral galaxy
                    - text: ": A flattened, rotating galaxy with pinwheel-like arms of interstellar material and young stars, winding out from its central bulge."
                  - listitem [ref=f510e24]:
                    - strong [ref=f510e26]: standard bulb
                    - text: ": An astronomical object with a known intrinsic brightness, or absolute magnitude."
