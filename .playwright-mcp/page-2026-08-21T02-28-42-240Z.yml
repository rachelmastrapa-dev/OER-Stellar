              - textbox "Rich Text Editor, editarea" [active] [ref=f367e333]: "<h2>Stellar Evolution in&nbsp;Star Clusters</h2> <p class=\"lt-phys-64199\">The preceding description of stellar evolution is based on calculations. However, no star completes its main-sequence lifetime or its evolution to a red giant quickly enough for us to observe these structural changes as they happen. Fortunately, nature has provided us with an indirect way to test our calculations. Instead of observing the evolution of a single star, we can look at a group or cluster of stars. Star clusters are gravitationally bound groups of stars. In clusters, stars are usually very close together in space, held together by gravity, and often moving around a common center. It is reasonable to assume that the individual stars in the group all formed at nearly the same time, from the same cloud, and with the same composition. We expect that these stars will differ only in mass and that their masses determine how quickly they go through each stage of their lives.</p> <p class=\"lt-phys-64792\">Since stars with higher masses evolve more quickly, we can find clusters in which massive stars have already completed their main-sequence phase of evolution and become red giants, while stars of lower mass in the same cluster are still on the main sequence, or even undergoing pre-main-sequence gravitational contraction. We can see many stages of stellar evolution among the members of a single cluster, and we can see whether our models can explain why the H–R diagrams of clusters of different ages look the way they do.</p> <p class=\"lt-phys-64792\">The three basic types of clusters astronomers have discovered are <strong><a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#globular cluster\" target=\"_blank\" title=\"globular cluster\">globular clusters</a></strong>, <strong><a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#open cluster\" target=\"_blank\" title=\"open cluster\">open clusters</a></strong>, and <strong><a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#stellar association\" target=\"_blank\" title=\"stellar association\">stellar associations</a></strong>. Open clusters are groups of 50 to 1000 stars, many of which are&nbsp;young and hot. They are irregular&nbsp;in shape and the stars are relatively far apart. Stellar associations have 100-10,000, including many young, massive&nbsp;blue stars. Globular clusters have 10,000-1,000,000 tightly packed stars. They are symmetrical and spherical in shape. The properties of different types of stellar groupings are summarized in Table \\(\\PageIndex{1}\\).</p> <table class=\"mt-responsive-table\"> <caption>Table \\(\\PageIndex{1}\\): Characteristics of Star Clusters</caption> <thead> <tr valign=\"top\"> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Characteristic</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Globular Clusters</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Open Clusters</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Associations</th> </tr> </thead> <tbody> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Number in the Galaxy</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">150</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">Thousands</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">Thousands</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Location in the Galaxy</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">Halo and central bulge</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">Disk (and spiral arms)</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">Spiral arms</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Diameter (in light-years)</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">50–450</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">&lt;30</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">100–500</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Mass <em data-effect=\"italics\">M</em><sub>Sun</sub></td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">10<sup>4</sup>–10<sup>6</sup></td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">10<sup>2</sup>–10<sup>3</sup></td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">10<sup>2</sup>–10<sup>3</sup></td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Number of stars</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">10<sup>4</sup>–10<sup>6</sup></td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">50–1000</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">10<sup>2</sup>–10<sup>4</sup></td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Color of brightest stars</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">Red</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">Red or blue</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">Blue</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Luminosity of cluster (<em data-effect=\"italics\">L</em><sub>Sun</sub>)</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">10<sup>4</sup>–10<sup>6</sup></td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">10<sup>2</sup>–10<sup>6</sup></td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">10<sup>4</sup>–10<sup>7</sup></td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Characteristic\" data-valign=\"top\">Typical ages</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Globular Clusters\" data-valign=\"top\">Billions of years</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Open Clusters\" data-valign=\"top\">A few hundred million years to, in the case of unusually large clusters, more than a billion years</td> <td class=\"lt-phys-64792\" data-align=\"left\" data-th=\"Associations\" data-valign=\"top\">Up to about 10<sup>7</sup> years (10 million)</td> </tr> </tbody> </table> <h2 class=\"lt-phys-64792\">Globular Clusters</h2> <p class=\"lt-phys-64792\">The most massive globular cluster in our own Galaxy is Omega Centauri, which is about 16,000 light-years away and contains several million stars. Image (a) of Figure \\(\\PageIndex{1}\\), collected by the Hubble Space Telescope, includes the entire cluster, while Image (b) is a zoom in of the central region. Image (b) is about 6.3 light-years wide. Most of the stars in the image are yellow-white in color and are main-sequence stars similar to our Sun. The brightest stars are red giants that have already completed the main-sequence phase of their evolution and have expanded to about 100 times the diameter of our Sun. These stars have typical surface temperatures around 4000 K. The blue stars have started helium fusion. Globular clusters are some of the oldest parts of the Milky Way Galaxy.</p> <figure><img alt=\"Hubble image of Omega Centauri. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46282/bc9546ff46dcd5026b64fd063e7568775723286f\" /> <figcaption>Figure \\(\\PageIndex{1}\\):&nbsp;Image (a) This Hubble image of Omega Centauri contains millions of stars. Image (b) An enlargement of the center of Image (a) includes many bright red giant stars. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.2.1_Omega_Centauri\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64792\">What would it be like to live inside a globular cluster? In the dense central regions, the stars would be roughly a million times closer together than in our own neighborhood. If Earth orbited one of the inner stars in a globular cluster, the nearest stars would be light-months, not light-years, away. They would still appear as points of light, but would be brighter than any of the stars we see in our own sky. The Milky Way would probably be difficult to see through the bright haze of starlight produced by the cluster.</p> <p class=\"lt-phys-64792\">About 150 globular clusters are known in our Galaxy. Most of them are in a spherical halo, or cloud, surrounding the central part of the galaxy. All of the globular clusters are very far from the Sun, and some are found at distances of 60,000 light-years or more from the main disk of the Milky Way. The diameters of globular star clusters range from 50 light-years to more than 450 light-years.</p> <h2 class=\"lt-phys-64792\">Open Clusters</h2> <p class=\"lt-phys-64792\">Open clusters are found in the disk of the Galaxy. They have a range of ages, some as old as, or even older than, our Sun. The youngest open clusters are still associated with the interstellar matter from which they formed. Open clusters are smaller than globular clusters, usually having diameters of less than 30 light-years, and they typically contain only several dozen to several hundreds of stars. The stars in open clusters usually appear well separated from one another, even in the central regions, which explains why they are called “open.” Our Galaxy contains thousands of open clusters, but we can see only a small fraction of them. Interstellar dust, which is also concentrated in the disk of the Galaxy, dims the light of more distant clusters so much that they are undetectable. In Figure \\(\\PageIndex{2}\\), the open cluster NGC 4755, known as the Jewel Box, has young, bright stars and is about 6400 light-years away from the Sun. At the center of the cluster, there is one bright yellow supergiant while the other bright stars are hot blue main-sequence stars. The name comes from John Herschel’s nineteenth-century description of it as “a casket of variously colored precious stones.”</p> <figure><img alt=\"Open Cluster NGC 4755. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46277/3958572c5cad522892054628259c3a26c0848d27\" /> <figcaption>Figure \\(\\PageIndex{2}\\): Jewel Box (NGC 4755). Open clusters like the Jewel Box have fewer stars than a globular cluster and the stars are separated from each other. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.2.2_Jewel_Box_(NGC_4755)\" title=\"12.7: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64792\">Although the individual stars in an open cluster can survive for billions of years, they typically remain together as a cluster for only a few hundred million years. In small open clusters, the average speed of the member stars within the cluster may be higher than the cluster’s escape velocity, or the&nbsp;speed needed to overcome the gravity of an object or group of objects. The rockets we send up from Earth, for example, must travel faster than the escape velocity of our planet to be able to get to other worlds. Over time, the stars will gradually move away and leave the cluster. Close encounters of member stars may also increase the velocity of one of the members beyond the escape velocity. Every few hundred million years or so, the cluster may have a close encounter with a giant molecular cloud, and the gravitational force exerted by the cloud may tear the cluster apart.</p> <p class=\"lt-phys-64792\">Several open clusters are visible to the unaided eye. The most famous among them is the Pleiades, which appears as a tiny group of six stars. This cluster is arranged like a small dipping spoon and is seen in the constellation of Taurus, the bull. A good pair of binoculars shows dozens of stars in the cluster, and a telescope reveals hundreds. A car company, Subaru, takes its name from the Japanese term for this cluster and you can see the star group on the Subaru logo. The Hyades is another famous open cluster in the constellation of Taurus, the bull. To the naked eye, it appears as a V-shaped group of faint stars marking the face of the bull. Telescopes show that the Hyades actually contains more than 200 stars.</p> <h2 class=\"lt-phys-64792\">Stellar Associations</h2> <p class=\"lt-phys-64792\">A stellar association is a group of extremely young stars, typically containing 5 to 50 hot, bright O and B stars scattered over a region of space some 100–500 light-years in diameter. As an example, most of the stars in the constellation Orion form one of the nearest stellar associations. Associations also contain hundreds to thousands of low-mass stars, but these are much fainter and less conspicuous. The presence of really hot, luminous stars indicates that star formation in the association has occurred in the last million years or so. Since O stars go through their entire lives in only about a million years, they would not still be around unless star formation has occurred recently. It is therefore not surprising that associations are found in regions rich in the gas and dust required to form new stars. Since associations, like ordinary open clusters, lie in regions occupied by dusty interstellar matter, many are hidden from our view.</p>"
