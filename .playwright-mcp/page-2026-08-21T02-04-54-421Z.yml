            - listitem [ref=f225e135]:
              - generic [ref=f225e136]:
                - term [ref=f225e137]:
                  - 'link " 8.5: Variable Stars- One Key to Cosmic Distances" [ref=f225e138] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/08%3A_Stellar_Tracking/8.05%3A_Variable_Stars-_One_Key_to_Cosmic_Distances
                    - generic [ref=f225e139]: 
                    - text: "8.5: Variable Stars- One Key to Cosmic Distances"
                - definition [ref=f225e140]: Cepheids and RR Lyrae stars are two types of pulsating variable stars. Light curves of these stars show that their luminosities vary with a regularly repeating period. RR Lyrae stars can be used as standard bulbs, and cepheid variables obey a period-luminosity relation, so measuring their periods can tell us their luminosities. Then, we can calculate their distances by comparing their luminosities with their apparent brightnesses, and this can allow us to measure distances to these stars out to
            - listitem [ref=f225e141]:
              - generic [ref=f225e142]:
                - term [ref=f225e143]:
                  - 'link " 8.6: The H-R and Cosmic Distances" [ref=f225e144] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/08%3A_Stellar_Tracking/8.06%3A_The_H-R_and_Cosmic_Distances
                    - generic [ref=f225e145]: 
                    - text: "8.6: The H-R and Cosmic Distances"
                - definition [ref=f225e146]: Stars with identical temperatures but different pressures (and diameters) have somewhat different spectra. Spectral classification can therefore be used to estimate the luminosity class of a star as well as its temperature. As a result, a spectrum can allow us to pinpoint where the star is located on an H–R diagram and establish its luminosity. This, with the star’s apparent brightness, again yields its distance. The various distance methods can be used to check one against another.
