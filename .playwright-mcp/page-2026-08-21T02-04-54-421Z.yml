              - listitem [ref=f225e102]: Explain how right ascension and declination are used to map the sky
              - listitem [ref=f225e103]: Explain why the spectral lines of photons we observe from an object will change as a result of the object’s motion toward or away from us
              - listitem [ref=f225e104]: Describe how we can use the Doppler effect to deduce how fast astronomical objects are moving through space
              - listitem [ref=f225e105]: Understand the concept of triangulating distances to distant objects, including stars
              - listitem [ref=f225e106]: Explain why space-based satellites deliver more precise distances than ground-based methods
              - listitem [ref=f225e107]: Discuss astronomers’ efforts to determine the distance of the stars closest to the Sun
              - listitem [ref=f225e108]: Describe how some stars vary their light output and why such stars are important
              - listitem [ref=f225e109]: Explain the importance of pulsating variable stars, such as cepheids and RR Lyrae-type stars, to our study of the universe
              - listitem [ref=f225e110]: Understand how spectral types are used to estimate stellar luminosities
              - listitem [ref=f225e111]: Examine how these techniques are used by astronomers today
