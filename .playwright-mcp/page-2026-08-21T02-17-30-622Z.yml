          - generic [ref=f302e96]:
            - heading " Learning Objectives" [level=5] [ref=f302e97]
            - list [ref=f302e99]:
              - listitem [ref=f302e100]: Explain how much interstellar matter there is in the Milky Way, and what its typical density is
              - listitem [ref=f302e101]: Describe how the interstellar medium is divided into gaseous and solid components
              - listitem [ref=f302e102]: Name the major types of interstellar gas
              - listitem [ref=f302e103]: Discuss how we can observe each type
              - listitem [ref=f302e104]: Describe the temperature and other major properties of each type
              - listitem [ref=f302e105]: Describe how we can detect interstellar dust
              - listitem [ref=f302e106]: Understand the role and importance of infrared observations in studying dust
              - listitem [ref=f302e107]: Explain the terms extinction and interstellar reddening
              - listitem [ref=f302e108]: Define cosmic rays and describe their composition
              - listitem [ref=f302e109]: Explain why it is hard to study the origin of cosmic rays, and the current leading hypotheses about where they might come from
              - listitem [ref=f302e110]: Explain how interstellar matter flows into and out of our Galaxy and transforms from one phase to another, and understand how star formation and evolution affects the properties of the interstellar medium
              - listitem [ref=f302e111]: Explain how the heavy elements and dust grains found in interstellar space got there and describe how dust grains help produce molecules that eventually find their way into planetary systems
              - listitem [ref=f302e112]: Describe how interstellar matter is arranged around our solar system
              - listitem [ref=f302e113]: Explain why scientists think that the Sun is located in a hot bubble
          - paragraph
          - list [ref=f302e116]:
            - listitem [ref=f302e117]:
              - generic [ref=f302e118]:
                - term [ref=f302e119]:
                  - 'link " 10.1: The Interstellar Medium" [ref=f302e120] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/10%3A_Interstellar_Media/10.01%3A_The_Interstellar_Medium
                    - generic [ref=f302e121]: 
                    - text: "10.1: The Interstellar Medium"
                - definition [ref=f302e122]: About 15% of the visible matter in the Galaxy is in the form of gas and dust, serving as the raw material for new stars. About 99% of this interstellar matter is in the form of gas—individual atoms or molecules. The most abundant elements in the interstellar gas are hydrogen and helium. About 1% of the interstellar matter is in the form of solid interstellar dust grains.
            - listitem [ref=f302e123]:
              - generic [ref=f302e124]:
                - term [ref=f302e125]:
                  - 'link " 10.2: Interstellar Gas and Dust" [ref=f302e126] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/10%3A_Interstellar_Media/10.02%3A_Interstellar_Gas_and_Dust
                    - generic [ref=f302e127]: 
                    - text: "10.2: Interstellar Gas and Dust"
                - definition [ref=f302e128]: Interstellar gas may be hot or cold. Gas found near hot stars emits light by fluorescence, that is, light is emitted when an electron is captured by an ion and cascades down to lower-energy levels. Most hydrogen in interstellar space is not ionized and can best be studied by radio measurements of the 21-centimeter line. Some of the gas in interstellar space is at a temperature of a million degrees, even though it is far away in hot stars.
            - listitem [ref=f302e129]:
              - generic [ref=f302e130]:
                - term [ref=f302e131]:
                  - 'link " 10.3: Cosmic Materials" [ref=f302e132] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/10%3A_Interstellar_Media/10.03%3A_Cosmic_Materials
                    - generic [ref=f302e133]: 
                    - text: "10.3: Cosmic Materials"
                - definition [ref=f302e134]: Cosmic rays are particles that travel through interstellar space at a typical speed of 90% of the speed of light. The most abundant elements in cosmic rays are the nuclei of hydrogen and helium, but electrons and positrons are also found. It is likely that many cosmic rays are produced in supernova shocks.
            - listitem [ref=f302e135]:
              - generic [ref=f302e136]:
                - term [ref=f302e137]:
                  - 'link " 10.4: Delete" [ref=f302e138] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/10%3A_Interstellar_Media/10.04%3A_Delete
                    - generic [ref=f302e139]: 
                    - text: "10.4: Delete"
                - definition [ref=f302e140]: Interstellar matter is constantly flowing through the Galaxy and changing from one phase to another. At the same time, gas is constantly being added to the Galaxy by accretion from extragalactic space, while mass is removed from the interstellar medium by being locked in stars. Some of the mass in stars is, in turn, returned to the interstellar medium when those stars evolve and die.
            - listitem [ref=f302e141]:
              - generic [ref=f302e142]:
                - term [ref=f302e143]:
                  - 'link " 10.5: Interstellar Matter around the Sun" [ref=f302e144] [cursor=pointer]':
                    - /url: https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/10%3A_Interstellar_Media/10.05%3A_Interstellar_Matter_around_the_Sun
                    - generic [ref=f302e145]: 
                    - text: "10.5: Interstellar Matter around the Sun"
                - definition [ref=f302e146]: The Sun is located at the edge of a low-density cloud called the Local Fluff. The Sun and this cloud are located within the Local Bubble, a region extending to at least 300 light-years from the Sun, within which the density of interstellar material is extremely low. Astronomers think this bubble was blown by some nearby stars that experienced a strong wind and some supernova explosions.
