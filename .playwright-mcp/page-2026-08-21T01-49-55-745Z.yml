          - heading "Introduction" [level=2] [ref=f135e96]
          - paragraph [ref=f135e97]: To study the stars, astronomers need to be able collect data. The main tool that astronomers use is the telescope. This chapter will describe how telescopes work and the various instruments that astronomers use to collect data. It is understandable if the word instrument makes you think of a piano or a guitar. Scientific instruments are devices that are used by astronomers to collect data, including telescopes, detectors, and spectrometers.
          - generic [ref=f135e99]:
            - heading " Learning Objectives" [level=5] [ref=f135e100]
            - paragraph [ref=f135e102]: "By the end of this section, you will be able to:"
            - list [ref=f135e103]:
              - listitem [ref=f135e104]: Describe the main parts of a telescope and how it collects light.
              - listitem [ref=f135e105]: List the differences between refracting and reflecting telescopes.
              - listitem [ref=f135e106]: Describe the progression in telescope design.
              - listitem [ref=f135e107]: Review the factors relevant to choosing an appropriate telescope site.
              - listitem [ref=f135e108]: List the different types of detectors and describe why the charge-coupled device (CCD) is preferred.
              - listitem [ref=f135e109]: Review the difference between visible and infrared observations.
              - listitem [ref=f135e110]: Describe how radio waves from space are detected.
              - listitem [ref=f135e111]: Define radar and list how it has been used to explore space.
              - listitem [ref=f135e112]: List the advantages of making astronomical observations from space.
              - listitem [ref=f135e113]: Describe some of the space-based observatories astronomers use.
