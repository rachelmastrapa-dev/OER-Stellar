              - textbox "Rich Text Editor, editarea" [active] [ref=f442e333]: "<h2>Figure 14.1.1 Classical Collapse</h2> <p>An illustration of a collapsing star forming a black hole.</p> <h3>Left Panel</h3> <ul> <li>An astronaut floats near the surface of a large, blue sphere representing a massive star.</li> </ul> <h3>Center Panel</h3> <ul> <li>The star has contracted into a smaller, white sphere.</li> <li>The astronaut floats near the surface, appearing about the same size as before.</li> <li>Blue arrows point inward toward the sphere from all directions, representing the star's collapse and increasing surface gravity.</li> </ul> <h3>Right Panel</h3> <ul> <li>The star has collapsed into a tiny black dot surrounded by a white, diffuse ring, representing a black hole.</li> <li>The astronaut is stretched into a long, thin shape while hovering just above the dot, illustrating the extreme gravitational pull.</li> <li>The text No escape appears below the black dot.</li> </ul> <h2>Figure 14.1.2 Curved Spacetime</h2> <p>Two diagrams comparing light paths near a normal star and a collapsed star.</p> <h3>Diagram (a)</h3> <ul> <li>A person stands on the surface of a large blue sphere, representing star,&nbsp;holding a flashlight outward.</li> <li>Seven yellow arrows radiate outward from the flashlight in straight lines, spreading away from the flashlight in a fan shape.</li> </ul> <h3>Diagram (b)</h3> <ul> <li>The same person stands on a much smaller blue sphere, representing a collapsed star,&nbsp;holding the flashlight the same way.</li> <li>Seven yellow arrows again originate from the flashlight, but only the center arrow points straight up and away from the sphere.</li> <li>The remaining six arrows curve sharply back downward, looping around and returning to the sphere's surface.</li> </ul> <h2>Figure 14.2.1 Binary Black Hole</h2> <p>An illustration of a black hole pulling material from a companion star.</p> <ul> <li>A large, bright, orange star is at the upper right.</li> <li>A white stream of material flows from the lower left of the star, curving toward the black hole to the left.</li> <li>The stream joins a large, swirling white&nbsp;disk of material surrounding a black hole at the bottom&nbsp;left of the image.</li> <li>A small dark circle at the center of the disk marks the black hole itself.</li> <li>Two thin, narrow jets of material extend outward perpendicular to the disk, one angled up and to the right and one angled down and to the left.</li> <li>The background is dark space filled with scattered stars.</li> </ul> <p>Credit: ESO/L. Calçada</p> <h2>Figure 14.3.1 Gravitational Wave Observatory</h2> <p>Aerial image of the LIGO gravitational wave observatory facility.</p> <h3>Image Elements</h3> <ul> <li>A central complex of white and dark blue buildings sits at the intersection of two large, long, straight pipes.</li> <li>One pipe extends from the central building toward the upper left of the image, running through cleared land toward a distant tree-lined horizon.</li> <li>A second pipe extends from the central building toward the right side of the image, with only a short portion visible before it is cut off by the edge of the frame.</li> <li>Each pipe is 4 kilometers long.</li> <li>Dense green trees surrounds the facility on all sides.</li> <li>A paved road and parking area with several small vehicles are on the lower left side of the central building.</li> <li>Additional smaller structures are on the right side of the image near the visible portion of the second arm.</li> <li>The sky above the horizon is blue with a few scattered clouds.</li> <li>Credit: Caltech/MIT/LIGO Laboratory.</li> </ul> <h2>Figure 14.3.2 Gravitational Wave</h2> <p>Three charts of gravitational wave data and an illustration of merging black holes.</p> <h3>Chart (a)</h3> <ul> <li>Three stacked line charts compare gravitational wave signals measured at two observatories.</li> <li>The vertical axis for each chart is labeled Strain (10<sup>-21</sup>), ranging from -1.0 at the bottom to 1.0 at the top, in increments of 0.5.</li> <li>The horizontal axis is labeled Time (seconds), ranging from 0.25 on the left to 0.45 on the right, in increments of 0.05.</li> <li>Top chart: LIGO Hanford Data, shown in orange, with a thin yellow Predicted curve overlaid reasonably matching it.</li> <li>Middle chart: LIGO Livingston Data, shown in blue, with a thin light blue Predicted curve overlaid reasonably matching it.</li> <li>Bottom chart: LIGO Hanford Data, shifted in time, shown in orange, superimposed with LIGO Livingston Data, shown in blue, demonstrating reasonable similarity between the two signals.</li> <li>In all three charts, the signal begins as a small, irregular oscillation, or variation moving up and down, creating waves, between about -0.05 and 0.05.</li> <li>Around T = 0.35 seconds, the oscillations increase sharply in amplitude and frequency, the peaks are larger and closer together, reaching between -1.0 and 1.0.</li> <li>The oscillations reach their fastest, largest amplitude and frequency near T = 0.42 seconds.</li> <li>After about T = 0.425 seconds, the oscillations diminish back to their original small amplitude.</li> <li>Key Trend: The measured strain at both observatories closely matches the predicted waveform, and the two independent signals align closely with each other once shifted, confirming the detection of a gravitational wave from a black hole merger.</li> </ul> <h3>Illustration (b)</h3> <ul> <li>An illustration of two black holes orbiting each other shortly before merging.</li> <li>The black holes two dark circular regions near the center of the image, one slightly larger than the other, positioned close together.</li> <li>A faint ring of glowing gas and light surrounds the pair, swept into a swirling, lens-like pattern by their combined gravity.</li> <li>The background is filled with a dense field of stars in shades of white, blue, and orange, resembling a star cluster.</li> <li>Light from stars behind the black holes is bent into warped, arc-like streaks near the black holes, illustrating gravitational lensing.</li> </ul> <h2>Figure 14.3.3 Black Hole Mergers</h2> <p>A scatter chart comparing the masses of known black holes and neutron stars.</p> <h3>Chart Elements</h3> <ul> <li>The chart is titled Masses in the Stellar Graveyard.</li> <li>The vertical axis is labeled Solar Masses and is logarithmic, with gridlines at 1, 2, 5, 10, 20, 40, 80, and 160.</li> <li>The horizontal axis has no scale or label. Each position along it represents a separate observed black hole or neutron star, or merger event, rather than a measured quantity.</li> <li>Data points are grouped into four categories, from highest mass to lowest.</li> </ul> <h3>Data Categories</h3> <ul> <li>LIGO-Virgo Black Holes <ul> <li>Shown as light blue dots across the top of the chart, ranging from about 20 to over 80 solar masses.</li> <li>Most points are grouped in pairs connected by a curved arrow leading downward to a third dot, representing two individual black holes merging into a single, more massive black hole.</li> <li>Several of the merged black holes near the center and right of the chart have masses above 80 solar masses, approaching or exceeding 160.</li> </ul> </li> <li>EM Black Holes <ul> <li>Shown as purple dots scattered in the middle of the chart, mostly between about 5 and 20 solar masses.</li> <li>These masses are noticeably smaller than the LIGO-Virgo black holes above them.</li> </ul> </li> <li>LIGO-Virgo Neutron Stars <ul> <li>Shown as a small number of orange dots near the bottom of the chart, clustered around 1 to 2 solar masses.</li> </ul> </li> <li>EM Neutron Stars <ul> <li>Shown as numerous yellow dots along the bottom of the chart, also clustered between about 1 and 2 solar masses.</li> </ul> </li> </ul> <p>Key Trend: Black holes detected through gravitational waves by LIGO-Virgo have consistently higher masses than black holes detected through electromagnetic radiation, including some merged black holes massive enough to challenge existing models, while neutron star masses detected by both methods cluster tightly around 1 to 2 solar masses.</p> <h2>Figure 14.4.1 Black Hole M87</h2> <p>Composite image of the M87 black hole across wavelengths.</p> <h3>Overview</h3> <ul> <li>Thirteen images of the M87 galaxy's central black hole and jet, each taken by a different telescope or combination of telescopes, are arranged to show how the view changes decreasing wavelength, from radio waves to gamma rays.</li> <li>The images are grouped in three columns: radio and millimeter images on the left, ultraviolet and visible images in the middle, and X-ray and gamma-ray images on the right.</li> <li>Within each column, a white box on one image marks the region shown in the next, more zoomed-in image.</li> <li>A bright knot in the jet, labeled Knot A, is marked with an arrow in several of the images.</li> <li>A horizontal electromagnetic spectrum scale at the bottom of the figure shows where each telescope's wavelength falls, from radio waves to cosmic rays.</li> </ul> <h3>Radio and Millimeter Images</h3> <ul> <li>Six images, shown in orange and yellow, trace the jet from a wide view down to the black hole itself.</li> <li>The panel labeled ALMA 1.3 mm covers 5 arcseconds, or 1320 light-years, and shows a diffuse, elongated jet extending diagonally from a bright compact core at the lower left up toward the knot labeled Knot A at the upper right.</li> <li>The panel labeled EVN 170 mm covers 100 milliarcseconds, or 26.4 light-years, and zooms into the compact core seen in the ALMA image, appearing as a small bright orange patch.</li> <li>The panel labeled EAVN 13 mm covers 10 milliarcseconds, or 2.6 light-years, and shows the core as a larger, brighter patch with a short extension beginning to emerge toward the upper right.</li> <li>The panel labeled VLBA 7 mm covers 5 milliarcseconds, or 1.3 light-years, and shows the core as a bright, elongated oval with a faint extension of jet structure.</li> <li>The panel labeled GMVA 3.5 mm covers 1 milliarcsecond, or 0.26 light-years, and shows the core as a bright oval with faint striped structure suggesting the base of the jet.</li> <li>The panel labeled EHT 1.3 mm covers 50 microarcseconds, or 0.013 light-years, and shows the iconic ring-shaped image of the black hole: a bright orange ring, brighter along its lower edge, surrounding a dark central shadow cast by the event horizon.</li> </ul> <h3>Ultraviolet and Visible Images</h3> <ul> <li>Three images, shown in blue, cover progressively smaller fields of view of the galaxy's core and jet.</li> <li>The panel labeled Swift 251 nm covers 10 arcseconds, or 2640 light-years, and shows two separate glowing blue regions: the galaxy's core near the bottom and the knot labeled Knot A near the top.</li> <li>The panel labeled Swift 439 nm covers the same field of view and shows the same two glowing regions, with a box marking the area around the core shown in the next image.</li> <li>The panel labeled HST 588 nm covers 5 arcseconds, or 1320 light-years, and shows a large glowing blue sphere representing the galaxy's central bulge, dotted with faint white points representing individual stars, with a thin blue jet extending diagonally from the bright core toward the upper right.</li> </ul> <h3>X-ray and Gamma-ray Images</h3> <ul> <li>Four images show the jet and core at progressively lower resolution and higher photon energy, connected by thin white lines indicating their relative fields of view.</li> <li>The panel labeled Chandra 0.2-10 keV covers 5 arcseconds, or 1320 light-years, and shows the jet in blue, red, and yellow, with a bright yellow-white core at the left connected by a red and blue diffuse jet to a red knot at the upper right, labeled Knot A.</li> <li>The panel labeled NuSTAR 3-79 keV covers 10 arcminutes, or 160 light-years, and shows the source as a small, unresolved blob with concentric rings of purple, blue, green, and yellow.</li> <li>The panel labeled HESS+MAGIC+VERITAS 100 GeV-10 TeV covers 0.5 degrees, or 475 light-years, and shows the source as a small, unresolved green and yellow blob.</li> <li>The panel labeled Fermi-LAT 3-1000 GeV covers 2 degrees, or 1900 light-years, and shows the source as a small, unresolved, pixelated blob in pink, purple, and green.</li> </ul> <h3>Electromagnetic Spectrum Scale</h3> <ul> <li>A horizontal bar diagram across the bottom of the figure represents the electromagnetic spectrum.</li> <li>The top axis is labeled wavelength in meters and ranges from 10<sup>2</sup> on the left to 10<sup>-16</sup> on the right, decreasing logarithmically by factors of 10.</li> <li>The bottom axis is labeled frequency in hertz and ranges from 10<sup>6</sup> on the left to 10<sup>24</sup> on the right, increasing logarithmically by factors of 10.</li> <li>The bar is divided into labeled bands, from left to right: Radio Waves, Microwaves, Infra-red, Visible, Ultraviolet, X-rays, gamma-rays, and Cosmic rays.</li> <li>Small triangular markers above the bar show where each telescope's wavelength falls, in order from left to right: EAVN 13 mm, VLBA 7 mm, GMVA 3.5 mm, EVN 170 mm, EHT and ALMA 1.3 mm, HST 578 nm, Swift 430 nm, Swift 251 nm, Chandra X-rays, NuSTAR, Fermi-LAT, and HESS+MAGIC+VERITAS.</li> </ul> <p>Credit: The EHT Multi-wavelength Science Working Group; the EHT Collaboration; ALMA (ESO/NAOJ/NRAO); the EVN; the EAVN Collaboration; VLBA (NRAO); the GMVA; the Hubble Space Telescope; the Neil Gehrels Swift Observatory; the Chandra X-ray Observatory; the Nuclear Spectroscopic Telescope Array; the Fermi-LAT Collaboration; the H.E.S.S collaboration; the MAGIC collaboration; the VERITAS collaboration; NASA and ESA. Composition by J. C. Algaba.</p> <h2>Figure 14.4.2 Gravitational Microlensing</h2> <p>A diagram of a black hole causing gravitational microlensing of a background star's light.</p> <h3>Overview</h3> <ul> <li>Three side-by-side panels show the same star-black hole-Earth system at three points in time: before, during, and after a microlensing event.</li> <li>Each panel includes a star at the top, a black hole below it, an Earth icon below that, and a square inset showing what a ground-based observatory would see.</li> <li>A small illustration of a satellite and a ground-based observatory appear at the bottom of the figure, beneath the during panel.</li> </ul> <h3>Panel: Before</h3> <ul> <li>On the left</li> <li>A white star is labeled Star at the top of the panel.</li> <li>Five yellow arrows point outward and downward from the star, representing light traveling away from it in multiple directions.</li> <li>An orange ring labeled Black hole sits below the star, off to one side, with a small blue arrow indicating it is moving to the right.</li> <li>A small Earth icon labeled Earth [before] appears below the black hole.</li> <li>A square inset labeled Star shows a single steady point of orange light, representing the star as normally seen from Earth.</li> </ul> <h3>Panel: During</h3> <ul> <li>In the middle</li> <li>A star labeled Star sits at the top, with the label Light from star pointing to the rays traveling from it.</li> <li>The black hole, labeled Black hole with a blue arrow showing its motion to the right, has moved directly beneath the star.</li> <li>The light rays from the star bend around the black hole along curved yellow paths labeled Gravitational lensing before converging toward Earth.</li> <li>An Earth icon labeled Earth [during] sits below the black hole, directly in line with the bent light paths.</li> <li>A square inset labeled Microlensed image shows a bright, radiating point of white and orange light, much brighter than the point shown in the before panel, representing the brightened and distorted appearance of the star during the lensing event.</li> </ul> <h3>Panel: After</h3> <ul> <li>On the right</li> <li>The layout matches the before panel: a star labeled Star at the top, five yellow arrows showing light traveling outward, a black hole labeled Black hole that has now moved past and beyond the star's light path, with a blue arrow showing continued motion to the right.</li> <li>An Earth icon labeled Earth [after] sits below the black hole.</li> <li>A square inset labeled Star shows a single steady point of orange light, the same as in the before panel, indicating the star has returned to its normal brightness.</li> </ul> <h3>Observatory Illustration</h3> <ul> <li>Below the during panel, a small satellite illustration is shown to the left and a ground-based telescope dome is shown to the right, both labeled together as Ground-based observatory.</li> </ul> <p>Credit: NASA/ESA via ESAHubble.</p>"
