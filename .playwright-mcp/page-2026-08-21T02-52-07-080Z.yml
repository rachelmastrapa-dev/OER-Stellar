                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{3}\\)" [ref=f504e55]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.5.3_Expanding_Raisin_Bread
                      - text: .
                  - paragraph [ref=f504e56]
                  - paragraph [ref=f504e57]: Our two analogies are useful for clarifying our thinking, but you must not take them literally. On both the ruler and the raisin bread, there are points that are at the end or edge. You can use these to pinpoint the middle of the ruler and the loaf. While our models of the universe have some resemblance to the properties of the ruler and the loaf, the universe has no boundaries, no edges, and no center.
                  - paragraph [ref=f504e58]: What is useful to notice about both the ants and the raisins is that they themselves did not cause their motion. It was the stretching of the medium, the ruler or the bread, that moved the ants or the raisins farther apart. Galaxies are also passive participants in the expansion of space. As space stretches, the galaxies are carried farther and farther apart much as the ants and the raisins were.
                  - paragraph [ref=f504e59]: The expansion of the universe, by the way, does not imply that the individual galaxies and clusters of galaxies themselves are expanding. Neither raisins nor the ants in our analogy grow in size as the loaf expands. Similarly, gravity holds galaxies and clusters of galaxies together, and they get farther away from each other, without themselves changing in size, as the universe expands.
                  - paragraph [ref=f504e60]: If the universe is expanding, what is it expanding into? There is nothing whatsoever that we have measured, or can measure, that will show us anything about this larger space. Everything that we measure is within the Universe, and we see no edge or boundary or center of expansion. Thus the Universe is not expanding into anything that we can see, and therefore scientists can't study it.
                  - heading "Examples and Exercises" [level=2] [ref=f504e61]
                  - generic [ref=f504e62]:
                    - 'heading "Example: Hubble''s Law" [level=5] [ref=f504e63]'
                    - paragraph [ref=f504e65]: Hubble's law (v = H × d) allows us to calculate the distance to any galaxy. Here is how we use it in practice.
                    - paragraph [ref=f504e66]: We have measured Hubble's constant to be 22 km/s per million light-years. This means that if a galaxy is 1 million light-years farther away, it will move away 22 km/s faster. So, if we find a galaxy that is moving away at 18,000 km/s, what does Hubble's law tell us about the distance to the galaxy?
                    - paragraph [ref=f504e67]: Solution
                    - text: "\\[d = \\frac{v}{H} = \\frac{18{,}000 \\text{ km/s}}{22 \\text{ km/s per million light-years}} = \\frac{18{,}000}{22} \\times 1 \\text{ million light-years} = 818 \\text{ million light-years} \\nonumber\\]"
                    - paragraph [ref=f504e68]: "Note how we handled the units here: the km/s in the numerator and denominator cancel, and the factor of million light-years in the denominator of the constant must be divided correctly before we get our distance of 818 million light-years."
                  - generic [ref=f504e69]:
                    - 'heading "Exercise: Hubble''s Law" [level=5] [ref=f504e70]'
                    - paragraph [ref=f504e72]: Using 22 km/s/million light-years for Hubble's constant, what recessional velocity do we expect to find if we observe a galaxy at 500 million light-years?
                    - generic [ref=f504e73]:
