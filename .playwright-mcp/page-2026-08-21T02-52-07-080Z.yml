            - application "Rich Text Editor, editarea" [ref=f502e321]:
              - iframe [active] [ref=f502e322]:
                - generic [active] [ref=f504e1]:
                  - heading "A Changing Universe" [level=2] [ref=f504e2]
                  - paragraph [ref=f504e3]: Astronomers now know that the universe is expanding. Before we describe how the discovery was made, we should point out that the first steps in the study of galaxies came at a time when the techniques of spectroscopy were also making great strides. Astronomers using large telescopes could record the spectrum of a faint star or galaxy on photographic plates, guiding their telescopes so they remained pointed to the same object for many hours and collected more light. The resulting spectra of galaxies contained a wealth of information about the composition of the galaxy and the velocities of these great star systems.
                  - heading "Slipher's Pioneering Observations" [level=3] [ref=f504e4]
                  - paragraph [ref=f504e5]: Curiously, the discovery of the expansion of the universe began with the search for Martians and other planetary systems. In 1894, the controversial and wealthy astronomer Percival Lowell established an observatory in Flagstaff, Arizona, to study the planets and search for life in the universe. Lowell thought that the spiral nebulae might be planetary systems in the process of formation. He therefore asked one of the observatory's young astronomers, Vesto M. Slipher, to photograph the spectra of some of the spiral nebulae to see if their spectral lines might show chemical compositions like those expected for newly forming planets.
                  - paragraph [ref=f504e6]: The Lowell Observatory's major instrument was a 24-inch refracting telescope, which was not at all well suited to observations of faint spiral nebulae. With the technology available in those days, photographic plates had to be exposed for 20 to 40 hours to produce a good spectrum to reveal a galaxy's motion. This often meant continuing to expose the same photograph over several nights. Beginning in 1912, working for over 20 years, Slipher managed to photograph the spectra of more than 40 of the spiral nebulae which would all turn out to be galaxies.
                  - paragraph [ref=f504e7]: To his surprise, the spectral lines of most galaxies showed an astounding redshift. A redshift, a type of Doppler shift, is when the lines in the spectra are displaced toward longer wavelengths or the red end of the visible spectrum. A redshift is seen when the source of light is moving away from us. Slipher's observations showed that most spirals are moving away at high speeds. The highest velocity he measured was 1800 kilometers per second. Only a few spirals, such as our close neighbors, the Andromeda and Triangulum Galaxies and M81, turned out to be approaching us. All the other galaxies were moving away. Slipher first announced this discovery in 1914, no one at the time quite knew what to make of this discovery.
                  - heading "Hubble's Law" [level=3] [ref=f504e8]
                  - paragraph [ref=f504e9]:
                    - text: In 1927, the astronomer Georges Lemaître published a paper in which he suggested that we live in an
                    - strong [ref=f504e10]:
                      - link "expanding universe" [ref=f504e11]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#expanding universe
                    - text: . The title of the paper, translated from French, is "A Homogenous Universe of Constant Mass and Growing Radius Accounting for the Radial Velocity of Extragalactic Nebulae." Lemaître had discovered that Einstein's equations of relativity were consistent with an expanding universe, as had the Russian scientist Alexander Friedmann independently in 1922. Lemaître then went on to use Slipher's data to support the hypothesis that the universe actually is expanding and to estimate the rate of expansion.
                  - paragraph [ref=f504e12]: "In the meantime, Edwin Hubble was making observations of galaxies with the 2.5-meter telescope on Mt. Wilson, which was then the world's largest. Hubble carried out the key observations in collaboration with Milton Humason. They photographed the spectra of faint galaxies with the 2.5-meter telescope. Hubble had found ways to improve the accuracy of the estimates of distances to spiral galaxies, and he was able to measure much fainter and more distant galaxies than Slipher could observe with his much-smaller telescope. When Hubble laid his own distance estimates next to measurements of the recession velocities, the speed with which the galaxies were moving away, he found something stunning: there was a relationship between distance and velocity for galaxies. The more distant the galaxy, the faster it was receding from us. In 1931, Hubble and Humason jointly published the paper where they compared distances and velocities of remote galaxies moving away from us at speeds as high as 20,000 kilometers per second and were able to show that the recession velocities of galaxies are directly proportional to their distances from us , just as Lemaître had suggested."
                  - paragraph [ref=f504e13]: "Figure \\(\\PageIndex{1}\\) includes the two charts of recession velocities of galaxies with distance. Chart (a) is from earlier work published in 1929 and includes galaxies up to 6 light years away travelling at speeds of between 500 and 1000 km/s. The data roughly agree with a linear relationship between distance and recession speed with a lot of variability in galaxies at similar distanes. Chart (b) includes the data from Chart (a) but adds data of galaxies out to 100 light years away. The additional data confirms the linear relationship between distance and recession speed. We now know that this relationship holds for every galaxy except a few of the nearest ones. Nearly all of the galaxies that are approaching us turn out to be part of the Milky Way's own group of galaxies, which have their own individual motions."
                  - figure [ref=f504e14]:
                    - img "Two charts of galaxy velocity vs. distance from 1929 and 1931. Details in caption." [ref=f504e15]
                    - generic [ref=f504e16]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Hubble's Law. Comparing Hubble's 1929 data to Hubble and Humason's 1931 data shows how quickly astronomers extended the known range of galaxy distances and velocities, strengthening the case for a linear velocity-distance relation. ("
                      - link "CC BY 4.0" [ref=f504e17]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f504e18]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f504e19]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f504e20]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.5.1_Hubbles_Law
                      - text: .
                  - paragraph [ref=f504e21]: Written as a formula, the relationship between velocity and distance is
                  - paragraph [ref=f504e22]: \[v = H \times d \nonumber\]
                  - paragraph [ref=f504e23]:
                    - text: where v is the velocity, d is the distance, and H is a number called the
                    - strong [ref=f504e24]:
                      - link "Hubble constant" [ref=f504e25]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#Hubble constant
                    - text: . This equation is now known as
                    - strong [ref=f504e26]:
                      - link "Hubble's law" [ref=f504e27]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#Hubble's law
                    - text: . In 2020, the International Astronomical Union suggested that it would be more fair to call it the Hubble-Lemaître law. In telling the history in this textbook, we have acknowledged the role Lemaître played, and we urge our readers to keep his contributions in mind as they read on.
                  - paragraph [ref=f504e28]: Astronomers express the value of Hubble's constant in units that relate to how they measure speed and distance for galaxies. In this book, we will use kilometers per second per million light-years as that unit. For many years, estimates of the value of the Hubble constant have been in the range of 15 to 30 kilometers per second per million light-years. The most recent work appears to be converging on a value near 22 kilometers per second per million light-years. If H is 22 kilometers per second per million light-years, a galaxy moves away from us at a speed of 22 kilometers per second for every million light-years of its distance. As an example, a galaxy 100 million light-years away is moving away from us at a speed of 2200 kilometers per second. This behavior confirms Lemaître's theory that we live in an expanding unvierse.
                  - heading "Measuring Distance" [level=3] [ref=f504e29]
                  - paragraph [ref=f504e30]:
                    - text: The regularity expressed in Hubble's law has a built-in bonus, it gives us a new way to determine the distances to remote galaxies. First, we must reliably establish Hubble's constant by measuring both the distance and the velocity of many galaxies in many directions to be sure Hubble's law is truly a universal property of galaxies. But once we have calculated the value of this constant and are satisfied that it applies everywhere, much more of the universe opens up for distance determination. Basically, if we can obtain a spectrum of a galaxy, we can immediately tell how far away it is. The procedure works like this. We use the spectrum to measure the speed with which the galaxy is moving away from us. If we then put this speed and the Hubble constant into Hubble's law equation, we can solve for the distance, demonstrated in
                    - link "Examples and Exercises" [ref=f504e31]:
                      - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.05:_The_Expanding_Universe#Example:_Hubble's_Law
                    - text: .
                  - heading "Variation of Hubble's Constant" [level=3] [ref=f504e32]
                  - paragraph [ref=f504e33]: The use of redshift is potentially a very important technique for determining distances because as we have seen, most of our methods for determining galaxy distances are limited to approximately the nearest few hundred million light-years, and they have large uncertainties at these distances. The use of Hubble's law as a distance indicator requires only a spectrum of a galaxy and a measurement of the Doppler shift, and with large telescopes and modern spectrometers, spectra can be taken of extremely faint galaxies.
                  - paragraph [ref=f504e34]: But, as is often the case in science, things are not so simple. This technique works if, and only if, the Hubble constant has been truly constant throughout the entire life of the universe. When we observe galaxies billions of light-years away, we are seeing them as they were billions of years ago. What if the Hubble constant was different billions of years ago? Before 1998, astronomers thought that, although the universe is expanding, the expansion should be slowing down, or decelerating, because the overall gravitational pull of all matter in the universe would have a dominant, measurable effect. If the expansion is decelerating, then the Hubble constant should be decreasing over time.
                  - paragraph [ref=f504e35]: The discovery that type Ia supernovae are standard bulbs gave astronomers the tool they needed to observe extremely distant galaxies and measure the rate of expansion billions of years ago. It turns out that the expansion of the universe is accelerating over time! While a decelerating universe could easily be explained by gravity, there was no force or property in the universe known to astronomers that could account for the acceleration. Astronomers proposed that the source of energy for this expansion was dark energy
                  - paragraph [ref=f504e36]: In any case, if the Hubble constant is not really a constant when we look over large spans of space and time, then the calculation of galaxy distances using the Hubble constant won't be accurate. The accurate calculation of distances requires a model for how the Hubble constant has changed over time. The farther away a galaxy is, and the longer ago we are seeing it, the more important it is to include the effects of the change in the Hubble constant. For galaxies within a few billion light-years, however, the assumption that the Hubble constant is indeed constant gives good estimates of distance.
                  - heading "Models for an Expanding Universe" [level=3] [ref=f504e37]
                  - paragraph [ref=f504e38]: A uniformly expanding universe is one that is expanding at the same rate everywhere. In such a universe, we and all other observers, no matter where they are located, must observe a proportionality between the velocities and distances of equivalently remote galaxies. Here, we are ignoring the fact that the Hubble constant is not constant over all time, but if at any given time in the evolution of the universe the Hubble constant has the same value everywhere, this argument still works.
                  - paragraph [ref=f504e39]: "To see why, first imagine a ruler made of stretchable rubber, with the usual lines marked off at each centimeter. Now suppose someone with strong arms grabs each end of the ruler and slowly stretches it so that, say, it doubles in length in 1 minute. In Figure \\(\\PageIndex{2}\\ the ruler has ants sitting at various positions. Consider an ant sitting on the mark at 2 centimeters, which we will name Ant, a point that is not at either end nor in the middle of the ruler. Ant measures how fast other ants, sitting at the 4-, 7-, and 12-centimeter marks, move away from Ant as the ruler stretches."
                  - paragraph [ref=f504e40]: The ant at 4 centimeters, originally 2 centimeters away from Ant, has doubled its distance in 1 minute. It therefore moved away at a speed of 2 centimeters per minute. The ant at the 7-centimeters mark, which was originally 5 centimeters away from Ant, is now 10 centimeters away. It had to move at 5 centimeters per minute. The one that started at the 12-centimeters mark, which was 10 centimeters away from Ant, is now 20 centimeters away, meaning it must have raced away at a speed of 10 centimeters per minute. Just like the galaxies moving away from us in space, the recession speed of the other ants away from Ant increases with distance. Notice in our example that all the ruler was doing was stretching uniformly. Also, notice that none of the ants were actually moving of their own accord, it was the stretching of the ruler that moved them apart.
                  - figure [ref=f504e41]:
                    - img "Diagram of ants on a stretching ruler, recession speed increasing with distance. Details in caption." [ref=f504e42]
                    - generic [ref=f504e43]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Stretching a Ruler. As the ruler stretches uniformly, ants farther apart move away from each other faster than ants close together, an analogy for how the expansion of space causes more distant galaxies to recede at greater speeds. ("
                      - link "CC BY 4.0" [ref=f504e44]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f504e45]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f504e46]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f504e47]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.5.2_Stretching_a_Ruler
                      - text: .
                  - paragraph [ref=f504e48]: "For a three-dimensional analogy, let's look at the loaf of raisin bread in Figure \\(\\PageIndex{3}\\). The yeast in the bread dough causes the dough to expand in all directions. It doubles in size during the next hour, causing all the raisins to move farther apart. On the figure, we again pick a representative raisin that is not at the edge or the center of the loaf and include the distances from it to several others in the figure before and after the loaf expand"
                  - figure [ref=f504e49]:
                    - img "Diagram of expanding raisin bread as analogy for expanding universe. Details in caption." [ref=f504e50]
                    - generic [ref=f504e51]:
                      - text: "Figure \\(\\PageIndex{3}\\) : Expanding Raisin Bread. As the loaf rises uniformly, every raisin's distance from a reference raisin doubles, showing why more distant raisins, like more distant galaxies, appear to recede faster during uniform expansion. ("
                      - link "CC BY 4.0" [ref=f504e52]:
