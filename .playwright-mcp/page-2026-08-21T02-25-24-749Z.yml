            - application "Rich Text Editor, editarea" [ref=f346e342]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f346e356]: "<h2>Science and Society - Naming the Stars</h2> <p>We've spent most of this chapter focusing on the formation and evolution of stars themselves. However, have you ever considered how we humans have actually named the stars and other objects in the sky? This discussion of naming objects is most definitely an incomplete one, as many&nbsp;names have been lost to history. However, naming objects is an age old practice that continues to this day, as we humans yearn for common understanding and organization of knowledge in our shared universe.&nbsp;</p> <h3>Historical Names and Catalogs of the Night Sky</h3> <p>Chinese astronomy catalogs date back nearly 2400 years, following a well-defined set of constellations and coordinates for each star, making these records the oldest of their kind. Creating such a catalog also required ancient astronomers to name the stars and regions of sky to which they were referring. However, due to Earth's precession cycle, the coordinates of the stars have since shifted, so the stars' current positions on the celestial sphere no longer match the original coordinates. Even so, these catalogs laid the foundation for the 283 total asterisms, separating the sky into four main groups as a \"kingdom in the sky\".</p> <p>The Greeks and Babylonians also kept a well documented set of constellation and star names, dating back to around&nbsp;2000&nbsp;years ago. Claudius Ptolemy’s Almagest star catalog used many names from the Greeks and Babylonians, which further solidified their influence on our current use of these names into the present day. Almagest was the first widely recognized star catalog, published around 150 CE, and was used by astronomers as the main reference catalog for more than 1200 years.</p> <h3>Current Star Names and Naming Conventions</h3> <p>If viewing from a dark location, the unaided human eye can see over 5000 stars in the night sky. However, only a few hundred stars in the night sky currently have designated names assigned by the International Astronomical Union (IAU). Founded in 1919, the IAU identifies itself as a non-governmental, international collaboration and is considered a global authority on the naming and designation of celestial bodies.</p> <p>The IAU has a detailed set of procedures and working groups that name or designate various types of astronomical objects. According to the IAU, \"name\" refers to the alphabetical name used for a star in everyday speech (e.g. “Vega”), while the term \"designation\" is always alphanumerical and almost exclusively found in the official catalogues used by professional astronomers (e.g. HD 172167). Most newly discovered objects only receive a designation, unless the object gains particular attention. If a particular object does gain enough attention, there are a wide range of ways the actual name can come about, not always governed by the IAU itself.</p> <p>One example is the A Hua He Inoa collaborative program, hosted by the 'Imiloa organization at the University of Hawai'i at Hilo. The internship program for Hawaiian speaking students has produced several new and some officially recognized names of astronomical objects, all in the Hawaiian language. Working as a collaboration between students, cultural leaders, and astronomy professionals, the program has named several objects that gained worldwide attention in previous years. The most famous among them is 'Oumuamua, the first interstellar object ever observed to enter our solar system.</p> <p>Pictured as an artist's rendering below, 'Oumuamua was discovered in 2017 by the Pan-STARRS 1 telescope on Mauna Kea, and was first assigned the designation 1I/2017 U1. However, the object quickly gained attention among the general public for its unique shape and being the first object we've ever discovered to come from outside the Solar System, thus creating a need for an official name.</p> <figure><img alt=\"'Oumuamua with a background of stars.\" class=\"internal default\" src=\"/@api/deki/files/66652/Eso1737a-shorter.jpg\" /> <figcaption> <p>Figure \\(\\PageIndex{1}\\):&nbsp; Interstellar Visitor. In this artist's depiction, 'Oumuamua, the first object from outside the Solar System, has a long, cylindrical shape and dark color based on the observations made as it passed by in 2017. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"http://www.eso.org/public/images/eso1737a/\" target=\"_blank\" title=\"Original ESO/M. Kornmesser (+ background position from original change by Nagualdesign)\">Original ESO/M. Kornmesser (+ background position from original change by Nagualdesign)</a> via <a href=\"https://commons.wikimedia.org/w/index.php?curid=64265376\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>).</p> </figcaption> </figure> <p>Coming back to the topic of stars, in 2025, the International Astronomical Union Working Group on Star Names (WGSN) put forward a new effort to rename 59 stars. The newly (re)named stars are shown in the map below, which also shows the plane of the Milky Way for reference. According to the IAU website, the new name designations by WGSN \"will help preserve astronomical heritage while providing new unique names for the international astronomical community.\" According to the working group, the new star names cover a number of cultural geographies and languages, including \\Xam (dialect of Khoe/San), Ancient Greek, Arabic, Chinese, Dayak, Dutch, Egyptian, English, French, Greco-Roman, Greek, Sanskrit, Latin, Malayan, Marshallese, Sami, and Sumerian. The group specifically highlights Asian culture as a central reference point for their work, citing the strong astronomical research base of the region, which they were able to draw on for this project.</p> <figure><img alt=\"Map of new star projected onto an image of the Milky Way Galaxy. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/66642/IAU_star_names_map_WGSN_2025.jpg\" /> <figcaption> <p>Figure \\(\\PageIndex{2}\\): New Star Names. This map was&nbsp;adopted by the International Astronomical Union based on the recommendations of the Working Group on Star Names in 2025.&nbsp;(<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://www.instagram.com/m.s.faghanpour.a/\" target=\"_blank\" title=\"M. Sadegh Faghanpour\">M. Sadegh Faghanpour</a> via <a href=\"https://ase.exopla.net/index.php/File:Map_of_New_Names_2025_s.jpg\" target=\"_blank\" title=\"All Skies Encyclopedia\">All Skies Encyclopedia</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.4.2_New_Star_Names\" title=\"11.6: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{2}\\)</a>.</p> </figcaption> </figure> <h3>Unofficial Names and \"Purchasing\" of Star Names</h3> <p>As we have discussed in this section, names of celestial objects have a certain timelessness and power to them. If you could, would you be interested in having a star or other celestial object?</p> <p>It is understandable why a person may be interested to have their own name \"written in the stars\", as it were. As a testament to this fact, there are a host of websites and commercial businesses that claim the ability to buy naming rights for certain celestial objects, in which a person can pay a small fee to have a star named after them or a loved one. However, to be clear, the IAU does not associate itself or approve of any such practices. Their website has an entire page devoted to debunking any such promotion of purchasing star names. They say, \"As an international scientific organisation, the IAU dissociates itself entirely from the commercial practice of \"selling\" fictitious star names, surface feature names, or real estate on other planets or moons in the Solar System...Like many of the best things in life, the beauty of the night sky is not for sale — it is free for all to enjoy\". This policy aligns with similar topics, such as our discussion in Ethics of Building Telescopes and the question of who, if anyone, can own anything in outer space. It also aligns with The Outer Space Treaty which states that \"outer space is not subject to national appropriation by claim of sovereignty.\"&nbsp;We ask you to consider your own stance on this idea, as humanity continues to chart and explore the universe.</p> <h3>References</h3> <ul> <li><em>Buying Stars and Star Names</em>. International Astronomical Union Archive. <a href=\"https://iauarchive.eso.org/public/themes/buying_star_names/\" rel=\"freelink\" title=\"https://iauarchive.eso.org/public/themes/buying_star_names/\">https://iauarchive.eso.org/public/th...ng_star_names/</a></li> <li>Hamacher, D. (2018, Jan 14). <em>The stories behind Aboriginal star names now recognized by the world's astronomical body</em>. The Conversation. <a href=\"https://theconversation.com/the-stories-behind-aboriginal-star-names-now-recognised-by-the-worlds-astronomical-body-87617\" rel=\"freelink\" title=\"https://theconversation.com/the-stories-behind-aboriginal-star-names-now-recognised-by-the-worlds-astronomical-body-87617\">https://theconversation.com/the-stor...cal-body-87617</a></li> <li>Kimura, K., et al. (2019, Sept 30). <em>A Hua He Inoa: Hawaiian Culture-Based Celestial Naming</em>. Bulletin of the AAS. <a href=\"https://baas.aas.org/pub/2020n7i135/release/1\" rel=\"freelink\" title=\"https://baas.aas.org/pub/2020n7i135/release/1\">https://baas.aas.org/pub/2020n7i135/release/1</a></li> <li><em>Outer Space Treaty</em>. (1966, Dec 19). United Nations Office for Outer Space Affairs. <a href=\"https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/introouterspacetreaty.html\" rel=\"freelink\" title=\"https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/introouterspacetreaty.html\">https://www.unoosa.org/oosa/en/ourwo...acetreaty.html</a></li> <li>Sadegh Faghanpour, M. (2026, Feb 12). <em>IAU Selects New Star Names to Reflect Global Astronomical Culture</em>. International Astronomical Union. <a href=\"https://www.iau.org/IAU/IAU/News/Ann2026/New-Star-Names-2026.aspx\" rel=\"freelink\" title=\"https://www.iau.org/IAU/IAU/News/Ann2026/New-Star-Names-2026.aspx\">https://www.iau.org/IAU/IAU/News/Ann...ames-2026.aspx</a></li> <li>Shi, Y. (2014, July 7). <em>Ancient Chinese Astronomy - An Overview</em>. Handbook of Archaeoastronomy and Ethnoastronomy. <a href=\"https://link.springer.com/rwe/10.1007/978-1-4614-6141-8_210\" rel=\"freelink\" title=\"https://link.springer.com/rwe/10.1007/978-1-4614-6141-8_210#citeas\">https://link.springer.com/rwe/10.100...1-8_210</a></li> <li>Sokol, J. (2025, April 18). <em>Chinese star catalog is the world's oldest, astronomers claim</em>. Science. <a href=\"https://www.science.org/content/article/china-lays-claim-world-s-oldest-surviving-star-catalog\" rel=\"freelink\" title=\"https://www.science.org/content/article/china-lays-claim-world-s-oldest-surviving-star-catalog\">https://www.science.org/content/arti...g-star-catalog</a></li> <li><em>Star Names</em>. International Astronomical Union. <a href=\"https://iauarchive.eso.org/public/themes/naming_stars/\" rel=\"freelink\" title=\"https://iauarchive.eso.org/public/themes/naming_stars/\">https://iauarchive.eso.org/public/th.../naming_stars/</a></li> </ul>"
