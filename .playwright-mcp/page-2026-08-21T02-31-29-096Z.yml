            - application "Rich Text Editor, editarea" [ref=f382e311]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f382e345]: "<h2>Figure 12.1.1 H-R Diagram with ZAMS</h2> <p>An H-R diagram with the zero age main sequence line in blue.</p> <h3>Chart Elements</h3> <ul> <li>In this graph the vertical axis is labeled Luminosity (LSun),&nbsp;from 10<sup>-4</sup> to 10<sup>6</sup> in increments of 10<sup>2</sup>.</li> <li>The horizontal axis is labeled Spectral class, and is divided into seven equal length units. From left to right they are labeled O, B, A, F, G, K&nbsp;and M.</li> <li>The horizontal axis is also labeled Temperature (K), running from 25,000 on the left to 3,000 on the right.</li> </ul> <h3>Locations of Star Types</h3> <ul> <li>Beginning at lower left is an isolated group of stars labeled White Dwarfs.</li> <li>The majority of stars lie on the Main Sequence, which runs diagonally from upper left to lower right.</li> <li>The left side of the group of stars making up the main sequence has a blue line, running along its entire length, labeled ZAMS for zero-age main sequence.</li> <li>The lower right part of the main sequence is labeled Red dwarfs.</li> <li>Running horizontally from the center of the graph to the right is the narrow band of Red giants.</li> <li>A small number of stars running horizontally across the entire top of the graph are the Supergiants.</li> </ul> <h2>Figure 12.1.2 Hydrogen Shell</h2> <p>Two diagrams of a star's interior before and agter it leaves the main sequience.</p> <h3>Diagram (a)</h3> <ul> <li>On the left&nbsp;</li> <li>The Hydrogen burning core&nbsp;is shown as a small disk within a larger, yellow disk depicting the non-fusion Stellar envelope.&nbsp;</li> </ul> <h3>Diagram&nbsp;(b)</h3> <ul> <li>On the right&nbsp;</li> <li>The Helium core&nbsp;is drawn as a smaller disk within a larger disk labeled, Hydrogen burning shell.&nbsp;</li> <li>These are within a larger Stellar envelope&nbsp;which is drawn in yellow.</li> </ul> <h2>Figure 12.1.3 The Size of Red Giants</h2> <p>An illustration of the Sun, Delta Delta Boötis, an Xi Cygni.</p> <ul> <li>The Sun is represented at center-left with a yellow disk labeled Sun.&nbsp;</li> <li>The giant star labeled Delta Boötis&nbsp;is drawn at right with an orange disk about 10 times the size of the Sun’s disk.</li> <li>At the top of this image, covering the entire upper portion of the figure, a small part of the supergiant labeled Xi Cygni&nbsp;is shown in red.</li> </ul> <h2>Figure 12.1.4 Betelgeuse</h2> <p>An image of the constellation and an image of Betelgeuse with scale bars.</p> <ul> <li>The Hubble Space Telescope image of Betelgeuse is presented in the inset in the upper left of this image where the reddish, extended atmosphere surrounds the brighter, yellow core.</li> <li>Below the inset is a list of relative scales based on the image. <ul> <li>At the top the Size of Star&nbsp;is indicated with a bar the width of Betelgeuse in the image.</li> <li>At the center the Size of Earth’s Orbit&nbsp;is shown with a much smaller bar.</li> <li>At the bottom, the Size of Jupiter’s Orbit&nbsp;is also shown with a bar. Jupiter's orbit is a over little half the size of Betelgeuse.</li> </ul> </li> <li>The right hand panel includes the full constellation of Orion, with Betelgeuse marked with a large X at the upper left of the image.</li> <li>Credit:&nbsp;Andrea Dupree (Harvard-Smithsonian CfA), Ronald Gilliland (STScI), NASA and ESA)</li> </ul> <h2>Figure 12.1.5 Stellar Mass and Evolution</h2> <p>AN H-R Diagram with model evolutionary tracks of stars with a range of masses.</p> <h3>Chart Elements</h3> <ul> <li>The vertical axis is labeled Luminosity (L<sub>Sun</sub>)&nbsp;and goes from 10<sup>-2</sup> at the bottom to over 10<sup>4</sup> at the top with increments of 10<sup>2</sup>.</li> <li>The horizontal axis is labeled Surface Temperature (K)&nbsp;and goes from 25,000 on the left to 4,000 on the right.</li> <li>The horizontal axis is non-linear. There are two increments of equal size, the first is from 25,000 to 10,000 and the second is from 10,000 to 4000.</li> <li>The Zero-age main sequence&nbsp;is drawn as a diagonal red line beginning above L = 10<sup>4</sup> at the upper left of the image down to T ~ 4000 at the lower right.</li> </ul> <h3>Evolutionary Tracks</h3> <ul> <li>Six total</li> <li>Beginning at the top</li> <li>All tracks have points marking the age of the star.</li> <li>15 solar masses <ul> <li>It leaves the main sequence above L ~ 3 x 10<sup>4</sup> and T ~ 25,000.</li> <li>The track moves mostly rightward across the top of the plot.</li> <li>Overall, the star maintains a relatively constant luminosity, but its surface temperature decreases with time.</li> <li>At 1.01 × 10<sup>7</sup>&nbsp;years its temperature is about 20,000 K.</li> <li>As the track leaves the last point, it increases in temperature to just about 23,000 K and then makes a sharp turn to the right to meet the next point.&nbsp;</li> <li>At 1.11 × 10<sup>7</sup>&nbsp;years it has decreased in temperature and moved right on the chart to about 15,000 K.</li> <li>At 1.19 × 10<sup>7</sup>&nbsp;years T is about 9000 K&nbsp;</li> <li>The track ends at 1.2 × 10<sup>7</sup>&nbsp;years near 4000 K.</li> </ul> </li> <li>5 solar masses <ul> <li>Begins near L ~ 10<sup>3</sup>, where it leaves the main sequence.</li> <li>Overall, the star maintains a relatively constant luminosity, and its surface temperature decreases with time.</li> <li>At 6.55 × 10<sup>7</sup>&nbsp;years its temperature is about 15,000 K. The star's luminosity has increased to roughly 3 x 10<sup>3</sup>.</li> <li>There is a very small increase in temperature after the last time point.</li> <li>At 6.98 x 10<sup>7</sup>&nbsp;years the surface temperature is about 5000 K.</li> <li>The track ends at 7.02 x 10<sup>7</sup> years at a temperature of about 4500 K. The luminosity has increased to roughly 4 x 10<sup>3</sup>.</li> </ul> </li> <li>3 solar masses <ul> <li>Leaves the main sequence near L&nbsp;~ 10<sup>2</sup>&nbsp;</li> <li>Overall, the star is&nbsp;relatively constant luminosity until the end of last time point.&nbsp;The surface decreases the most during the first two sections of the track and then decreases a small amount at the end of the track. During the same section, the luminosity increases.</li> <li>At 2.21&nbsp;× 10<sup>8</sup>&nbsp;years its temperature is about 12,000 K. The star's luminosity has increased to roughly 2&nbsp;x 10<sup>2</sup>.</li> <li>There is a very small increase in temperature after the last time point.</li> <li>At 2.46&nbsp;x 10<sup>8</sup> years the surface temperature is about 5500 K. The luminosity has decreased back to 10<sup>2</sup>.</li> <li>The track ends at 2.51 x 10<sup>8</sup> years at a temperature of about 4500 K. The luminosity has increased to roughly 6&nbsp;x 10<sup>2</sup>.</li> </ul> </li> <li>1.5 solar masses <ul> <li>Leaves the main sequence near L&nbsp;~ 10.</li> <li>Overall, the star decreases in temperature with time.&nbsp; At first the luminosity is mostly constant, but it increases by a large amount in the last section of the track.</li> <li>At 1.55&nbsp;× 10<sup>9</sup>&nbsp;years its temperature is about 7000 K. The star's luminosity has increased to roughly 30.</li> <li>There is a very small increase in temperature after the last time point.</li> <li>At 2.09 × 10<sup>9</sup>&nbsp;years its temperature is about 6000 K. The star's luminosity stays near&nbsp;30.</li> <li>At 2.39 × 10<sup>9</sup>&nbsp;years it's temperatures&nbsp;has decreased to about 5000 K. Its luminosity increases to 3&nbsp;x 10<sup>2</sup>.</li> </ul> </li> <li>1 solar mass <ul> <li>&nbsp;Leaves the main sequence at L = 1 and 5700 K.</li> <li>After 7 × 10<sup>9</sup>&nbsp;years its temperature is nearly the same, but its luminosity has increased slightly.</li> <li>After 10.4 × 10<sup>9</sup>&nbsp;years, its temperature has dropped to near 5000 K, and its luminosity has increased to 10.</li> <li>Its luminosity steadily increases to where the&nbsp;curve ends at 11.4 × 10<sup>9</sup>&nbsp;years, L ~ 10<sup>3</sup> and T ~ 4000 K.</li> </ul> </li> <li>0.5 solar mass <ul> <li>Begins at L ~ 10-1 near T ~ 5000.</li> <li>Its curve is a short arrow pointing upward as its evolutionary timescale is too large for this diagram.</li> </ul> </li> </ul> <h2>Figure 12.2.1 Omega Centauri</h2> <p>Two Images of the Globular Cluster Omega Centauri.</p> <h3>Image (a)</h3> <ul> <li>On the left</li> <li>Ground-based image of Omega Centauri as a large sphere of thousands of stars that is so dense that the central region appears as an indistinct patch of light.</li> <li>Credit: NASA, ESA and the Hubble Heritage Team (STScI/AURA)</li> </ul> <h3>Image (b)</h3> <ul> <li>On the right</li> <li>A high-resolution Hubble Space Telescope image of the central region, showing dozens of bright red and blue stars amidst a background of thousands of fainter yellow stars.</li> <li>Credit: NASA, ESA, and the Hubble SM4 ERO Team</li> </ul> <h2>Figure 12.2.2 Jewel Box (NGC 4755)</h2> <ul> <li>Image of Open Cluster NGC 4755.</li> <li>This open cluster, known as the “Jewel Box,” contains many bright white and blue stars as well as a bright yellow supergiant near the center.</li> <li>Credit: ESO/Y. Beletsky</li> </ul> <h2>Figure 12.3.1 Clusters on the H-R Diagram</h2> <p>H-R Diagram of a model young Cluster.</p> <h3>Chart Elements</h3> <ul> <li>The title is&nbsp;M 2001 Age: 3 million years&nbsp;</li> <li>The vertical axis is labeled Luminosity (L<sub>Sun</sub>), and goes from 0.1 at the bottom to 100,000 at the top. The scale is logarithmic. This means that each increment is the same length on the axis, but the value increases by a factor of 10.&nbsp;</li> <li>The horizontal axis is labeled Surface Temperature (K), and goes from 40,000 on the left to 3,000 on the right.</li> <li>The zero-age main sequence is drawn as a red diagonal line starting just above 100,000 L<sub>Sun</sub> at the top of the graph down to about 4000 K at the bottom. The “Present position of Sun” is indicated at 5500 K and 1 L<sub>Sun</sub>.</li> </ul> <h3>Stars</h3> <ul> <li>There are&nbsp;black dots representing the individual stars in the cluster.</li> <li>About half of the dots lie along the red line until about 10000 K and 100 L<sub>Sun</sub>. These dots represent the higher temperature, higher luminosity, and higher mass stars.</li> <li>The remainder of the dots lie above the red line, meaning these stars have yet to reach the main sequence.&nbsp;These dots represent the lower temperature, lower luminosity, and lower mass stars.</li> </ul> <h2>Figure 12.3.2 NGC 2264</h2> <p>Image of the&nbsp;NGC 2264.</p> <ul> <li>This youthful cluster derives its name from the shape outlined by its brightest stars.</li> <li>The “Christmas Tree” is upside down in this image.</li> <li>The brightest star at the top of the frame is the base of the tree. T</li> <li>The top of the tree is the star above the dark v-shaped lane in the nebula just left of the center at the bottom of the image.</li> <li>Credit: ESO</li> </ul> <h2>Figure 12.3.3 NGC 2264 H–R Diagram</h2> <p>An H-R diagram of the young star cluster NGC 2264, plotting observed stars against the zero-age main sequence.</p> <h3>Chart Elements</h3> <ul> <li>The vertical axis is labeled Luminosity (L<sub>Sun</sub>) and goes from 0.1 at the bottom to 100,000 at the top.</li> <li>The scale on the vertical axis is logarithmic. In this case, each increment is the same length on the axis, but the value increases by a factor of 10.</li> <li>The horizontal axis is labeled Surface Temperature (K) and are labeled, from left to right, 40,000, 20,000, 10,000, 5000 and 3000. The size of the increments are the same, indicating that this axis is non-linear.</li> <li>The zero-age main sequence is drawn as a red diagonal line, starting just above 100,000 L<sub>Sun</sub> at the top of the graph and extending down to about 4,000 K at the bottom.</li> </ul> <h3>Stars</h3> <ul> <li>Numerous black dots are scattered across the chart, representing the observed values of stars in NGC 2264, in a pattern similar to the model predictions for a star cluster of similar age.</li> <li>The high-luminosity stars lie along the red line down to about 10,000 K and 10 L<sub>Sun</sub>.</li> <li>Below that point, the stars are positioned to the right of the main sequence line, rather than along it, indicating that they have not yet started fusing hydrogen.</li> </ul> <h3>Key trend:</h3> <p>The diagram shows that in the young cluster NGC 2264, the most massive stars have already reached the main sequence, while many lower-mass stars are still in the pre-main-sequence stage of evolution</p> <h2>Figure 12.3.4 NGC 3293</h2> <p>Image of NGC 3293.</p> <ul> <li>This compact cluster of bright, blue stars is located near the center of this image surrounded by the red wisps of ionized hydrogen left over after the cluster’s formation.</li> <li>Credit: ESO/G. Beccari</li> </ul> <h2>Figure 12.3.5 Cluster M41</h2> <p>HR Diagram and image of Cluster M41</p> <h3>Chart&nbsp;(a)&nbsp;</h3> <ul> <li>On the left&nbsp;</li> <li>The vertical axis is labeled Luminosity (L<sup>Sun</sup>)&nbsp;and goes from 0.1 at the bottom to 100,000 at the top. The scale is logarithmic, increase by a factor of 10 for each increment.</li> <li>The horizontal axis is labeled Surface Temperature (K)&nbsp;and goes from 40,000 on the left to 3000 on the right.</li> <li>The zero-age main sequence is drawn as a red diagonal line starting just above 100,000 L<sub>Sun</sub> at the top of the graph down to about 4000 K at the bottom.</li> <li>The black dots are&nbsp;the observed values of the stars in M 41.</li> <li>Approximately half of the stars lie to the right of the main sequence until around 9000 K and 50 L<sub>Sun</sub>, below which the stars all lie on the main sequence.</li> <li>On the right side of the diagram, a small grouping of giant stars are centered around 4000 K and 50 L<sub>Sun</sub>.</li> </ul> <h3>Image (b)&nbsp;</h3> <ul> <li>On the right</li> <li>A photograph of the open cluster M 41.</li> <li>Credit b: NOAO/AURA/NSF</li> </ul> <h2>Figure 12.4.1 Evolutionary Path of the Sun</h2> <p>Evolutionary track of the Sun on an H–R Diagram.</p> <h3>Chart Elements</h3> <ul> <li>The vertical axis is labeled Luminosity ( L<sub>Sun</sub>),&nbsp;and goes from 1.0 near the bottom to 10,000 near the top. The scale is logarithmic, each increment increases by a factor of 10.</li> <li>The horizontal axis is labeled Surface Temperature (K),&nbsp;and goes from 9000 on the left to 3000 on the right.</li> <li>The main sequence is drawn as a diagonal red line beginning at L ~ 40 on the left down to T ~ 4000 at the bottom.</li> <li>The evolutionary path of the star is drawn as a black line.</li> </ul> <h3>Evolutionary Track</h3> <ul> <li>In the section of the track labelled (a), it begins at L = 1 and T = 5500.&nbsp;&nbsp;</li> <li>The line moves upward away from the main sequence.</li> <li>The line continues upward to L ~ 1000 and T ~ 3000 to point (b)&nbsp;labeled “Core helium flash.”</li> <li>From point (b), the line is dashed. This section of the track is labeled (c)&nbsp;and moves downward to L ~ 100 and T ~ 5000.</li> <li>From (c), the line moves upward again. This portion of the line is labeled (d).&nbsp;</li> <li>The line ends in a series of waves near L = 5000 and T ~ 3500 and is labeled “Helium shell flashes.”&nbsp;</li> </ul> <h2>Figure 12.4.2 Layers in an Old Low-Mass Star</h2> <p>Diagram of layers inside a low-mass star before death.</p> <ul> <li>The layers within the core are shown as concentric circles of various colors.</li> <li>Starting at the center they are labeled: <ul> <li>Carbon-oxygen core&nbsp;in purple</li> <li>Helium fusion&nbsp;in green</li> <li>Helium core&nbsp;in yellow</li> <li>Hydrogen shell fusion&nbsp;layer in teal.</li> <li>The cooler Hydrogen envelope&nbsp;is&nbsp;orange.&nbsp;</li> </ul> </li> </ul> <h2>Figure 12.4.3 Planetary Nebulae</h2> <p>Four images of planetary nebulae.</p> <h3>Image (a)</h3> <ul> <li>At the upper left corner of the figure.</li> <li>M57 is&nbsp;a mostly symmetrical ring of glowing gas surrounding the faint central star.</li> <li>Credit: NASA, ESA, and the Hubble Heritage (STScI/AURA)-ESA/Hubble Collaboration</li> </ul> <h3>Image (b)&nbsp;</h3> <ul> <li>At the upper right corner of the figure</li> <li>M2-9&nbsp; appears like an elongated butterfly.</li> <li>The central star being the body and the gaseous “wings” to the left and right of the star.</li> <li>Credit:&nbsp;Bruce Balick (University of Washington), Vincent Icke (Leiden University, The Netherlands), Garrelt Mellema (Stockholm University), and NASA</li> </ul> <h3>Image (c)</h3> <ul> <li>At the lower left corner of the figure.</li> <li>NGC 6751 has streams and clumps of bright gas superimposed over a symmetric ring structure surrounding the central star.</li> <li>Credit:&nbsp;NASA, The Hubble Heritage Team (STScI/AURA)</li> </ul> <h3>Image (d)</h3> <ul> <li>At the lower right corner of the figure.</li> <li>NGC 7027&nbsp;&nbsp;appears as an indistinct, mottled blob of gas surrounded by multiple faint shells of material.&nbsp;</li> <li>Credit: H. Bond (STScI) and NASA)</li> </ul> <h2>Figure 12.4.4 Observation of Planetary Nebulae</h2> <p>Diagram to explain the different shapes of planetary nebulae.</p> <ul> <li>In the lower left-hand portion of this figure there is a schematic representation of a planetary nebula.</li> <li>A yellow ellipse, labeled Torus&nbsp;is drawn with a white dot labeled Star&nbsp;at its center.</li> <li>The long axis of the ellipse is oriented vertically.</li> <li>Several yellow arrows are drawn horizontally pointing away from the star. These are labeled Stellar wind.&nbsp;</li> <li>A faint figure-eight encloses the stellar wind on each side of the star and torus.&nbsp;</li> <li>A large, faint Outer halo&nbsp;surrounds the figure-eight and torus, centered on the star.</li> <li>At top left, directly above the star, the profile of a human eye is shown looking in the direction of the star.</li> <li>The line of sight is marked with a double-headed dashed arrow.</li> <li>What a planetary nebula would look like along this line of sight is illustrated with an image of Hubble 5 to the right of the eye.</li> <li>Another eye is drawn at lower right looking through the figure-eight toward the star.</li> <li>The line of sight is marked with a double-headed dashed arrow.</li> <li>What a planetary nebula would look like along this line of sight is illustrated with an image of the Helix Nebula above the eye.</li> <li>Hubble 5 credit: Bruce Balick (University of Washington), Vincent Icke (Leiden University, The Netherlands), Garrelt Mellema (Stockholm University), and NASA/ESA&nbsp;</li> <li>Helix credit: NASA, ESA, C.R. O’Dell (Vanderbilt University), and M. Meixner, P. McCullough) &nbsp;</li> </ul>"
