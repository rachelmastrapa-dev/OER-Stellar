            - application "Rich Text Editor, editarea" [ref=f499e322]:
              - iframe [active] [ref=f499e323]:
                - generic [active] [ref=f501e1]:
                  - heading "Measuring Galactic Distance" [level=2] [ref=f501e2]
                  - paragraph [ref=f501e3]: To determine many of the properties of a galaxy, such as its luminosity or size, we must first know how far away it is. If we know the distance to a galaxy, we can convert how bright the galaxy appears to us in the sky into its true luminosity because we know the precise way light is dimmed by distance. The same galaxy 10 times farther away would look 100 times dimmer. But the measurement of galaxy distances is very challenging. All galaxies are far away, and most are so distant that we cannot even make out individual stars in them.
                  - paragraph [ref=f501e4]: For decades, the techniques used to measure galaxy distances were relatively inaccurate, and different astronomers derived distances that differed by as much as a factor of two. In the past few decades, however, astronomers have devised new techniques for measuring distances to galaxies. Most importantly, all of them give the same answer to within an accuracy of about 10%. As we will see, this means we may finally be able to make reliable estimates of the size of the universe.
                  - heading "Variable Stars" [level=3] [ref=f501e5]
                  - paragraph [ref=f501e6]: "Before astronomers could measure distances to other galaxies, they first had to establish the scale of cosmic distances using objects in our own Galaxy. Astronomers were especially delighted when they discovered that they could measure distances using certain kinds of intrinsically luminous variable stars, such as cepheids. Henrietta Leavitt used cepheids as awy to measure distance. Figure \\(\\PageIndex{1}\\) demonstrates how the presence of a cepheid in the galaxy M100 can be used to measure its distance. Over several days, the Hubble Space Telescope was able to measure changes in the star's brightness."
                  - paragraph [ref=f501e7]: After the variables in nearby galaxies had been used to make distance measurements for a few decades, Walter Baade showed that there were actually two kinds of cepheids and that astronomers had been unwittingly mixing them up. As a result, in the early 1950s, the distances to all of the galaxies had to be increased by about a factor of two. We mention this because we want you to bear in mind, as you read on, that science is always a study in progress. Our first tentative steps in such difficult investigations are always subject to future revision as our techniques become more reliable.
                  - paragraph [ref=f501e8]: The amount of work involved in finding cepheids and measuring their periods can be enormous. Even though cepheids are fairly luminous stars, they can be detected in only about 30 of the nearest galaxies with the world's largest ground-based telescopes. One of the main projects carried out during the first years of operation of the Hubble Space Telescope was the measurement of cepheids in more distant galaxies to improve the accuracy of the extragalactic distance scale. Recently, astronomers working with the Hubble Space Telescope have extended such measurements out to 108 million light-years.
                  - figure [ref=f501e9]:
                    - img "Cepheid variable star in galaxy M100. Details in caption." [ref=f501e10]
                    - generic [ref=f501e11]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Cepheid Variable Star. Hubble Space Telescope images taken on three separate nights track the changing brightness of a single Cepheid variable star in M100, a method astronomers used to measure the galaxy's distance at 56 million light-years. ("
                      - link "CC BY 4.0" [ref=f501e12]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f501e13]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f501e14]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f501e15]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.4.1_Cepheid_Variable_Star
                      - text: .
                  - paragraph [ref=f501e16]: Nevertheless, we can only use cepheids to measure distances within a small fraction of the universe of galaxies. After all, to use this method, we must be able to resolve single stars and follow their subtle variations. Beyond a certain distance, even our finest space telescopes cannot help us do this. Fortunately, there are other ways to measure the distances to galaxies.
                  - heading "Standard Bulbs" [level=3] [ref=f501e17]
                  - paragraph [ref=f501e18]:
                    - text: If every light bulb in a huge auditorium is a standard 100-watt bulb, then bulbs that look brighter to us must be closer, whereas those that look dimmer must be farther away. If every star were a standard luminosity, then we could similarly calculate their distances based on how bright they appear to us. Unfortunately, neither stars nor galaxies come in one standard luminosity. Nonetheless, astronomers have been searching for objects out there that do act in some way like a
                    - strong [ref=f501e19]:
                      - link "standard bulb" [ref=f501e20]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#standard bulb
                    - text: ". These type of objects are also called standard candles. With the replacement of light bulbs with LED lights, the term will most likely change again, but the concept remains the same: an object that has a consistent luminosity."
                  - paragraph [ref=f501e21]:
                    - text: "A number of suggestions have been made for what sorts of objects might be effective standard bulbs, including the brightest supergiant stars, planetary nebulae, and the average globular cluster in a galaxy. One object turns out to be particularly useful: the type Ia supernova. These supernovae involve the explosion of a white dwarf in a binary system. Observations show that supernovae of this type all reach nearly the same luminosity, about 4.5 × 10"
                    - superscript [ref=f501e22]: "9"
                    - generic [ref=f501e23]:
                      - text: L
                      - subscript [ref=f501e24]: Sun
                    - text: "at maximum light. With such tremendous luminosities, these supernovae have been detected out to a distance of more than 8 billion light-years and are therefore especially attractive to astronomers as a way of determining distances on a large scale. Figure \\(\\PageIndex{2}\\) includes a Type Ia supernova that can be easily detected because it is brighter than its host galaxy. Type Ia supernovae, however, have proved to be the most accurate standard bulbs, and they can be seen in more distant galaxies than the other types of calibrators."
                  - figure [ref=f501e25]:
                    - img "Type Ia supernova and spiral galaxy. Details in caption." [ref=f501e26]
                    - generic [ref=f501e27]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Type Ia Supernova. Near its peak brightness, this type Ia supernova outshines its entire host galaxy, a predictable peak luminosity that lets astronomers use these events as standard bulbs to measure cosmic distances. ("
                      - link "CC BY 4.0" [ref=f501e28]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f501e29]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f501e30]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f501e31]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.4.2_Type_Ia_Supernova
                      - text: .
                  - heading "The Tully-Fisher Relation" [level=3] [ref=f501e32]
                  - paragraph [ref=f501e33]: Another technique for measuring galactic distances makes use of an interesting relationship noticed in the late 1970s by Brent Tully of the University of Hawaii and Richard Fisher of the National Radio Astronomy Observatory. They discovered that the luminosity of a spiral galaxy is related to its rotational velocity. The more mass a galaxy has, the faster the objects in its outer regions must orbit. A more massive galaxy has more stars in it and is thus more luminous, ignoring dark matter for a moment. We can say that if the mass-to-light ratios for various spiral galaxies are pretty similar, then we can estimate the luminosity of a spiral galaxy by measuring its mass, and we can estimate its mass by measuring its rotational velocity.
                  - paragraph [ref=f501e34]: Tully and Fisher used the 21-cm line of cold hydrogen gas to determine how rapidly material in spiral galaxies is orbiting their centers. Since 21-cm radiation from stationary atoms comes in a nice narrow line, the width of the 21-cm line produced by a whole rotating galaxy tells us the range of orbital velocities of the galaxy's hydrogen gas. The broader the line, the faster the gas is orbiting in the galaxy, and the more massive and luminous the galaxy turns out to be.
                  - paragraph [ref=f501e35]: It is somewhat surprising that this technique works, since much of the mass associated with galaxies is dark matter, which does not contribute at all to the luminosity but does affect the rotation speed. There is also no obvious reason why the mass-to-light ratio should be similar for all spiral galaxies. Nevertheless, observations of nearer galaxies, where we have other ways of measuring distance, show that measuring the rotational velocity of a galaxy provides an accurate estimate of its intrinsic luminosity. Once we know how luminous the galaxy really is, we can compare the luminosity to the apparent brightness and use the difference to calculate its distance. A drawback for this system is that it only applies to spiral galaxies.
                  - paragraph [ref=f501e36]:
                    - text: "Table \\(\\PageIndex{1}\\) lists the type of galaxy for which each of the distance techniques is useful, and the range of distances over which the technique can be applied. In order of increasing distance, astronomers use planetary nebulae, cepheid variables, the Tully-Fisher relation, Type Ia supernovae, and redshifts. The majority of them apply to all types of galaxies, but cepheids are not in elliptical galaxies and the Tully Fisher method, only works for spiral galaxies. We will discuss measuring distances with redshifts in"
                    - link "The Expanding Universe" [ref=f501e37]:
                      - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.05:_The_Expanding_Universe
                    - text: .
                  - table [ref=f501e38]:
                    - caption [ref=f501e39]: "Table \\(\\PageIndex{1}\\): Some Methods for Estimating Distance to Galaxies"
