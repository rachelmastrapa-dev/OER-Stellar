                  - list [ref=f441e3]:
                    - listitem [ref=f441e4]:
                      - strong [ref=f441e6]: escape velocity
                      - text: ": The minimum speed that must be achieved for a free, non-propelled object to escape from the gravitational influence of a massive body, i.e. to achieve an infinite distance from it."
                    - listitem [ref=f441e7]:
                      - strong [ref=f441e9]: event horizon
                      - text: ": The distance from a black hole where the escape velocity equals the speed of light, the fastest possible speed known, and within which nothing can escape. In this sense, the event horizon is a \"point of no return.\" See also: Schwarzschild radius."
                    - listitem [ref=f441e10]:
                      - strong [ref=f441e12]: gravitational wave
                      - text: ": A disturbance in the curvature of spacetime caused by changes in how matter is distributed; gravitational waves propagate at (or near) the speed of light."
                    - listitem [ref=f441e13]:
                      - strong [ref=f441e15]: singularity
                      - text: ": The point of zero volume and infinite density to which any object that becomes a black hole must collapse, according to the theory of general relativity."
