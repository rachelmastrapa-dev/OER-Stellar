                  - heading "The Periodic Table" [level=3] [ref=f109e117]
                  - paragraph [ref=f109e118]: As early chemists worked to purify ores and discovered more elements, they realized that various elements could be grouped together by their similar chemical behaviors. Many elements differ dramatically in their chemical and physical properties, but some elements are similar in their behaviors. For example, many elements appear shiny, are malleable, ductile, and conduct heat and electricity well. Other elements are not shiny, malleable, or ductile, and are poor conductors of heat and electricity. Chemists studied materials and attempted to organize them in a chart to group them by their chemical properties.
                  - paragraph [ref=f109e119]:
                    - text: A modern
