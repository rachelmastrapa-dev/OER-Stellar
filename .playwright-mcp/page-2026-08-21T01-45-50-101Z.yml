                  - heading "Cosmic Abundances" [level=3] [ref=f109e130]
                  - paragraph [ref=f109e131]: Hydrogen, helium, and a few other very light elements were formed within about three minutes of the Big Bang. The next 23 elements, through iron, are formed mostly by nuclear fusion processes within stars, in which lighter nuclei combine into successively heavier elements. Elements heavier than iron cannot be formed in this way, and are produced only during the catastrophic collapse of massive stars called supernova explosions. Most of the atoms in the universe still consist of hydrogen, with helium being a distant second. On Earth, oxygen, silicon, and aluminum are most abundant. These profiles serve as useful guides for constructing models for the formation of Earth and other planetary bodies.
                  - paragraph [ref=f109e132]: "Nearly 100 different kinds of elements exist in nature. Most of them are rare, and only a handful account for more than 99% of everything with which we come in contact. The most abundant elements in the cosmos today are listed in Table Table \\(\\PageIndex{2}\\). The list includes the four elements most common in life on Earth: hydrogen, carbon, nitrogen, and oxygen. To represent the abundance of elements, this table lists the number of elements present in the universe compared to 1 million hydrogen atoms. In the table, there are 80,000 helium atoms for every 1,000,000 hydrogen atoms, or for every 8 helium atoms, there are 100 hydrogen atoms. In this table, the least abundant element is sulfur with just 19 atoms per 1,000,000 hydrogen atoms, but all of the elements are rare compared to hydrogen and helium."
