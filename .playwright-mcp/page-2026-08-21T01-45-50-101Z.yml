                    - text: "arranges the elements in increasing order of their atomic numbers and groups atoms with similar properties in the same vertical column, Figure \\(\\PageIndex{5}\\). Each box represents an element and contains its atomic number, symbol, average atomic mass, and name. The elements are arranged in seven horizontal rows, called periods or series, and 18 vertical columns, called groups. Groups are labeled at the top of each column. For the table to fit on a single page, parts of two of the rows, a total of 14 columns, are usually written below the main body of the table. (This figure doesn't seem to be showing up for me either. -from Caitlin)"
