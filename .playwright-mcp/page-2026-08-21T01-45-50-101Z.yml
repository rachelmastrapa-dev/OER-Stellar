                  - paragraph [ref=f109e69]: A proton has a mass of 1.00727 amu and a charge of +1. A neutron is a slightly heavier particle with a mass of 1.00866 amu and a charge of zero because it is neutral. The electron has a charge of -1 and is a much lighter particle with a mass of about 0.00055 amu. It would take about 1800 electrons to equal the mass of one proton. The protons and neutrons are in the nucleus, while the electrons are outside of the nucleus.
                  - heading "Ionization" [level=3] [ref=f109e70]
                  - paragraph [ref=f109e71]:
                    - text: Atoms are electrically neutral if they contain the same number of positively charged protons and negatively charged electrons. Because the electrons of an atom are in contact with the outside world, it is possible for one or more electrons to be lost, or some new ones to be added in a process called
                    - strong [ref=f109e72]:
                      - link "ionization" [ref=f109e73]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#ionization
                    - text: . The resulting electrically-charged atom is called an
                    - strong [ref=f109e74]:
                      - link "ion" [ref=f109e75]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#ion
                    - text: . The charge of an atom is calculated by subtracting the number of electrons from the number of protons. An atom can become completely ionized, losing all of its electrons. A hydrogen atom, having only one electron to lose, can be ionized only once while a helium atom can be ionized twice, and an oxygen atom can be ionized up to eight times.
                  - paragraph [ref=f109e76]: An atom that has become positively ionized has lost a negative charge—the missing electron—and thus is left with a net positive charge. It therefore exerts a strong attraction on any free electron. Eventually, one or more electrons will be captured and the atom will become neutral (or ionized to one less degree) again. During the electron-capture process, the atom emits one or more photons. Which photons are emitted depends on whether the electron is captured at once to the lowest energy level of the atom or stops at one or more intermediate levels on its way to the lowest available level.
                  - heading "Elements" [level=2] [ref=f109e77]
                  - paragraph [ref=f109e78]:
                    - text: The
                    - strong [ref=f109e79]:
                      - link "element" [ref=f109e80]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#element
                    - text: is the fundamental unit of chemical identity. What single parameter uniquely characterizes the atom of a given element? It is not the atom's relative mass, as we will see in the section on isotopes below. It is the number of protons in the nucleus, which is called the
                    - strong [ref=f109e81]:
                      - link "atomic number" [ref=f109e82]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#atomic number
                    - text: (Z). Each proton carries an electric charge of +1, so the atomic number also specifies the electric charge of the nucleus. In the neutral atom, the Z protons within the nucleus are balanced by Z electrons outside it. The total number of protons and neutrons in an atom is called its
                    - strong [ref=f109e83]:
                      - link "mass number" [ref=f109e84]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#mass number
                    - text: "(A). The number of neutrons is therefore the difference between the mass number and the atomic number: A – Z = number of neutrons."
                  - paragraph [ref=f109e85]: "You can think of the atomic number as a kind of serial number of an element, commencing at 1 for hydrogen and increasing by one for each successive element. For example, any atom that contains six protons is the element carbon and has the atomic number 6, regardless of how many neutrons or electrons it may have. Ninety-two elements have been found in nature. Around 25 more have been made artificially, but all of these decay into lighter elements, with some of them disappearing in minutes or even seconds. Helium, Z = 2, has two protons in its nucleus instead of the single proton that characterizes hydrogen, Figure \\(\\PageIndex{3}\\). In addition, the helium nucleus contains two neutrons. Moving around this nucleus are two electrons, so the total net charge of the helium atom is also zero."
                  - figure [ref=f109e86]:
                    - img "Helium atom. Details in caption." [ref=f109e87]
                    - generic [ref=f109e88]:
                      - text: "Figure \\(\\PageIndex{3}\\): Two protons are present in the nucleus of all helium atoms. In the most common variety of helium, the nucleus also contains two neutrons. Two electrons orbit the nucleus. Particle size and distance not to scale. ("
