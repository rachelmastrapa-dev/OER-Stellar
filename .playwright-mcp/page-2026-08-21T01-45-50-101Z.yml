                      - text: via
                      - link "Chemistry 2e (Openstax)" [ref=f109e22]:
                        - /url: https://openstax.org/details/books/chemistry-2e
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f109e23]':
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.09:_Accessible_Descriptions#Figure_4.2.1_The_Scale_of_the_Atom
                      - text: .
                  - paragraph [ref=f109e24]: "The simplest possible atom is hydrogen. The nucleus of ordinary hydrogen contains a single proton. Moving around this proton is a single electron. The mass of an electron is nearly 2000 times smaller than the mass of a proton. The electron carries an amount of charge exactly equal to that of the proton but opposite in sign, Figure \\(\\PageIndex{2}\\). Opposite charges attract each other, so it is an electromagnetic force that holds the proton and electron together, just as gravity is the force that keeps planets in orbit around the Sun."
                  - figure [ref=f109e25]:
                    - img "Hydrogen atom. Details in caption." [ref=f109e26]
                    - generic [ref=f109e27]:
                      - text: "Figure \\(\\PageIndex{2}\\): This illustration represents a hydrogen atom as a circle with the proton at the center and the electron is at the radius, or outer part of the circle. The distances are not to scale. ("
                      - link "CC BY 4.0" [ref=f109e28]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f109e29]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f109e30]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: "). Alternative description of Figure \\(\\PageIndex{2}\\)."
                  - heading "Particles" [level=3] [ref=f109e31]
                  - paragraph [ref=f109e32]:
                    - text: "Due to the extremely small size of protons and neutrons, scientists created a new unit of measurement, the atomic mass unit (amu). One atomic mass unit is defined as 1/12 of the mass of one atom of carbon. Table \\(\\PageIndex{1}\\) lists the properties of these particles including their mass in amu and grams. The mass of any of these particles in grams is a very small number, about 10"
                    - superscript [ref=f109e33]: "-24"
                    - text: .
                  - table [ref=f109e34]:
                    - caption [ref=f109e35]: "Table \\(\\PageIndex{1}\\): Properties of Subatomic Particles"
