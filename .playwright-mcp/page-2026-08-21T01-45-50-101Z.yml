                  - paragraph [ref=f109e106]:
                    - text: The symbol for a specific isotope of any element is written by placing the mass number as a superscript to the left of the element symbol. The element symbol of magnesium is Mg. The atomic number is sometimes written as a subscript preceding the symbol, but since this number defines the element’s identity, as does its symbol, it is often omitted. For example, magnesium exists as a mixture of three isotopes, each with an atomic number of 12 and with mass numbers of 24, 25, and 26, respectively. These isotopes can be symbolized as
