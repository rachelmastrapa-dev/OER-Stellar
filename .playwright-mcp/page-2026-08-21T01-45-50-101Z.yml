                  - heading "The Nuclear Atom" [level=2] [ref=f109e2]
                  - paragraph [ref=f109e3]:
                    - text: The development of modern atomic theory revealed much about the inner structure of atoms. The atom contains a very small
                    - strong [ref=f109e4]:
                      - link "nucleus" [ref=f109e5]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#nucleus
                    - text: composed of positively charged
                    - strong [ref=f109e6]:
                      - link "protons" [ref=f109e7]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#proton
                    - text: and uncharged
                    - strong [ref=f109e8]:
                      - link "neutrons" [ref=f109e9]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#neutron
                    - text: ", surrounded by a much larger volume of space containing negatively charged"
                    - strong [ref=f109e10]:
                      - link "electrons" [ref=f109e11]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#electron
                    - text: . The nucleus contains the majority of an atom’s mass because protons and neutrons are much heavier than electrons, while electrons occupy almost all of an atom’s volume. The diameter of an atom is on the order of 10
                    - superscript [ref=f109e12]: −10
                    - text: m, while the diameter of the nucleus is roughly 10
                    - superscript [ref=f109e13]: −15
                    - text: "m, about 100,000 times smaller. If the nucleus were the size of a blueberry, the atom would be about the size of a football stadium, Figure \\(\\PageIndex{1}\\). (Figure isn't showing up for me (Caitlin). Also, should the figure come directly after this paragraph, as it's not mentioned at tall in the next one?)"
                  - paragraph [ref=f109e14]:
                    - text: Almost all of the volume of an atom consists of empty space in which electrons, the fundamental carriers of negative electric charge, reside. The extremely small mass of the electron causes it to behave as a quantum particle, which means that its location at any moment cannot be specified. The best scientists can do is describe its behavior in terms of the probability of its manifesting itself at any point in space. The volume of space in which the electrons of an atom have a significant probability of being found can be called the electron cloud. The latter has no definite outer boundary, so neither does the atom. The radius of an atom must be defined arbitrarily, such as the boundary in which the electron can be found with 95% probability. Atomic radii are typically 30-300 pm, or picometers. Note that 1 meter is equal to 10
                    - superscript [ref=f109e15]: "12"
                    - text: picometers.
                  - figure [ref=f109e16]:
                    - img "Scale of the atom. Details in caption." [ref=f109e17]
                    - generic [ref=f109e18]:
                      - text: "Figure \\(\\PageIndex{1}\\): If an atom could be expanded to the size of a football stadium, the nucleus would be the size of a single blueberry. ("
                      - link "CC" [ref=f109e19]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - link "BY 4.0" [ref=f109e20]:
