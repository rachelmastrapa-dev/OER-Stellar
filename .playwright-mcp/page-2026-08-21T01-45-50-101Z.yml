                  - heading "Isotopes" [level=3] [ref=f109e93]
                  - paragraph [ref=f109e94]:
                    - text: The number of neutrons is not necessarily the same for all atoms of a given element. For example, most hydrogen atoms contain no neutrons at all. There are, however, hydrogen atoms that contain one proton and one neutron, and others that contain one proton and two neutrons. The various types of hydrogen nuclei with different numbers of neutrons are called
                    - strong [ref=f109e95]:
                      - link "isotopes" [ref=f109e96]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#isotope
                    - text: "of hydrogen, Figure \\(\\PageIndex{4}\\). All other elements have isotopes as well. The isotopes of hydrogen are often referred to using common names and accompanying symbols. Hydrogen-2, symbolized"
                    - superscript [ref=f109e97]: "2"
                    - text: H, is also called deuterium and sometimes symbolized D. Hydrogen-3, symbolized
                    - superscript [ref=f109e98]: "3"
                    - text: H, is also called tritium and sometimes symbolized T.
