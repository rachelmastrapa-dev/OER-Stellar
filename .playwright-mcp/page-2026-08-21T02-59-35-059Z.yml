            - application "Rich Text Editor, editarea" [ref=f541e312]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f541e326]: "<ul> <li><a id=\"cold_dark_matter\" name=\"cold_dark_matter\"><strong>cold dark matter</strong></a>: slow-moving massive particles, not yet identified, that don't absorb, emit, or reflect light or other electromagnetic radiation</li> <li><a id=\"cosmological_principle\" name=\"cosmological_principle\"><strong>cosmological principle</strong></a>: the assumption that, on the large scale, the universe at any given time is the same everywhere—isotropic and homogeneous</li> <li><a id=\"dark_energy\" name=\"dark_energy\"><strong>dark energy</strong></a>: an energy that is causing the expansion of the universe to accelerate; the source of this energy is not yet understood</li> <li><a id=\"evolution_of_galaxies\" name=\"evolution_of_galaxies\"><strong>evolution (of galaxies)</strong></a>: changes in individual galaxies over cosmic time, inferred by observing snapshots of many different galaxies at different times in their lives</li> <li><a id=\"galactic_cannibalism\" name=\"galactic_cannibalism\"><strong>galactic cannibalism</strong></a>: a process by which a larger galaxy strips material from or completely swallows a smaller one</li> <li><a id=\"homogeneous\" name=\"homogeneous\"><strong>homogeneous</strong></a>: having a consistent and even distribution of matter that is the same everywhere</li> <li><a id=\"hot_dark_matter\" name=\"hot_dark_matter\"><strong>hot dark matter</strong></a>: massive particles, not yet identified, that don't absorb, emit, or reflect light or other electromagnetic radiation; hot dark matter is faster-moving material than cold dark matter</li> <li><a id=\"isotropic\" name=\"isotropic\"><strong>isotropic</strong></a>: the same in all directions</li> <li><a id=\"local_group\" name=\"local_group\"><strong>Local Group</strong></a>: a small cluster of galaxies to which our Galaxy belongs</li> <li><a id=\"merger\" name=\"merger\"><strong>merger</strong></a>: a collision between galaxies (of roughly comparable size) that combine to form a single new structure</li> <li><a id=\"quasar\" name=\"quasar\"><strong>quasar</strong></a>: a distant, point-like energy source originating from a powerful active galactic nucleus. Its luminosity is generated by the accretion of gas onto a supermassive black hole</li> <li><a id=\"starburst\" name=\"starburst\"><strong>starburst</strong></a>: a galaxy or merger of multiple galaxies that turns gas into stars much faster than usual</li> <li><a id=\"supercluster\" name=\"supercluster\"><strong>supercluster</strong></a>: a large region of space (more than 100 million light-years across) where groups and clusters of galaxies are more concentrated; a cluster of clusters of galaxies</li> <li><a id=\"void\" name=\"void\"><strong>void</strong></a>: a region between clusters and superclusters of galaxies that appears relatively empty of galaxies</li> </ul>"
