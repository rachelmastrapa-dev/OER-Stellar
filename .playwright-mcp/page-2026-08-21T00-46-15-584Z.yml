              - textbox "Rich Text Editor, editarea" [active] [ref=f45e344]: "<h2>Phases of the Moon</h2> <section class=\"box-objectives\"> <h5 class=\"box-legend lt-phys-64671\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <p class=\"lt-phys-64671\">By the end of this section, you will be able to:</p> <ul> <li class=\"lt-phys-64671\">Explain the cause of the lunar phases</li> <li class=\"lt-phys-64671\">Understand how the Moon rotates and revolves around Earth</li> </ul> </section> <p class=\"lt-phys-64671\">After the Sun, the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> is the brightest and most obvious object in the sky. Unlike the Sun, it does not shine under its own power, but merely glows with reflected sunlight. If you were to follow its progress in the sky for a month, you would observe a cycle of <span data-type=\"term\" group-by=\"p\">phases</span> (different appearances), with the Moon starting dark and getting more and more illuminated by sunlight over the course of about two weeks. After the Moon’s disk becomes fully bright, it begins to fade, returning to dark about two weeks later.</p> <p class=\"lt-phys-64671\">These changes fascinated and mystified many early cultures, which came up with marvelous stories and legends to explain the cycle of the Moon. Even in the modern world, many people don’t understand what causes the phases, thinking that they are somehow related to the shadow of Earth. Let us see how the phases can be explained by the motion of the Moon relative to the bright light source in the solar system, the Sun.</p> <h3 class=\"lt-phys-64671\">Lunar Phases</h3> <p class=\"lt-phys-64671\">Although we know that the Sun moves 1/12 of its path around the sky each month, for purposes of explaining the phases, we can assume that the Sun’s light comes from roughly the same direction during the course of a four-week lunar cycle. The Moon, on the other hand, moves completely around Earth in that time. As we watch the Moon from our vantage point on Earth, how much of its face we see illuminated by sunlight depends on the angle the Sun makes with the Moon.</p> <p class=\"lt-phys-64671\">Here is a simple experiment to show you what we mean: stand about 6 feet in front of a bright electric light in a completely dark room (or outdoors at night) and hold in your hand a small round object such as a tennis ball or an orange. Your head can then represent Earth, the light represents the Sun, and the ball the Moon. Move the ball around your head (making sure you don’t cause an eclipse by blocking the light with your head). You will see phases just like those of the Moon on the ball. (Another good way to get acquainted with the phases and motions of the Moon is to follow our satellite in the sky for a month or two, recording its shape, its direction from the Sun, and when it rises and sets.)</p> <p class=\"lt-phys-64671\">Let’s examine the Moon’s cycle of phases using Figure 4.14, which depicts the Moon’s behavior for the entire month. The trick to this figure is that you must imagine yourself standing on Earth, facing the Moon in each of its phases. So, for the position labeled “New,” you are on the right side of Earth and it’s the middle of the day; for the position “Full,” you are on the left side of Earth in the middle of the night. Note that in every position on Figure 4.14, the Moon is half illuminated and half dark (as a ball in sunlight should be). The difference at each position has to do with what part of the Moon faces Earth.</p> <figure><span data-alt=\"Phases of the Moon. The Earth is drawn as the center of a blue ellipse representing the Moon’s orbit. At right, yellow arrows labeled “Sunlight” point toward the Earth and Moon. The Moon is drawn in eight positions along its orbit, along with an illustration of the Moon as it would appear to an observer on Earth. At position “A” at far right, the Moon is between the Earth and Sun. At that point the Moon is “New”. At position “B” at upper right, the observer would see a “Waxing crescent”. At position “C” at top center, the observer would see “First quarter”. At position “D” at upper left, the observer would see the “Waxing gibbous” phase. At position “E”, the Earth is now between the Sun and Moon, and an observer would see a “Full” Moon. At position “F” at lower left, the observer would see the “Waning gibbous” phase. At position “G” at bottom center, an observer would see the “Third quarter” Moon. Finally, at position “H” at lower right, the observer would see the “Waning crescent” Moon.\" data-type=\"media\"><img alt=\"Phases of the Moon. The Earth is drawn as the center of a blue ellipse representing the Moon’s orbit. At right, yellow arrows labeled “Sunlight” point toward the Earth and Moon. The Moon is drawn in eight positions along its orbit, along with an illustration of the Moon as it would appear to an observer on Earth. At position “A” at far right, the Moon is between the Earth and Sun. At that point the Moon is “New”. At position “B” at upper right, the observer would see a “Waxing crescent”. At position “C” at top center, the observer would see “First quarter”. At position “D” at upper left, the observer would see the “Waxing gibbous” phase. At position “E”, the Earth is now between the Sun and Moon, and an observer would see a “Full” Moon. At position “F” at lower left, the observer would see the “Waning gibbous” phase. At position “G” at bottom center, an observer would see the “Third quarter” Moon. Finally, at position “H” at lower right, the observer would see the “Waning crescent” Moon.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45829/596a0dfb26c897eae61d64b0fdbac4db7326ed6c\" /> </span> <figcaption>Figure 4.14 : Phases of the Moon. The appearance of the Moon changes over the course of a complete monthly cycle. The pictures of the Moon on the white circle show the perspective from space, with the Sun off to the right in a fixed position. The outer images show how the Moon appears to you in the sky from each point in the orbit. Imagine yourself standing on Earth, facing the Moon at each stage. In the position “New,” for example, you are facing the Moon from the right side of Earth in the middle of the day. (Note that the distance of the Moon from Earth is not to scale in this diagram: the Moon is roughly 30 Earth-diameters away from us.) (credit: modification of work by NASA)</figcaption> </figure> <p class=\"lt-phys-64671\">The Moon is said to be <em data-effect=\"italics\">new</em> when it is in the same general direction in the sky as the Sun (position A). Here, its illuminated (bright) side is turned away from us and its dark side is turned toward us. You might say that the Sun is shining on the “wrong ” side of the Moon from our perspective. In this phase the Moon is invisible to us; its dark, rocky surface does not give off any light of its own. Because the new moon is in the same part of the sky as the Sun, it rises at sunrise and sets at sunset.</p> <p class=\"lt-phys-64671\">But the Moon does not remain in this phase long because it moves eastward each day in its monthly path around us. Since it takes about 30 days to orbit Earth and there are 360° in a circle, the Moon will move about 12° in the sky each day (or about 24 times its own diameter). A day or two after the new phase, the thin <em data-effect=\"italics\">crescent</em> first appears, as we begin to see a small part of the Moon’s illuminated hemisphere. It has moved into a position where it now reflects a little sunlight toward us along one side. The bright crescent increases in size on successive days as the Moon moves farther and farther around the sky away from the direction of the Sun (position B). Because the Moon is moving eastward away from the Sun, it rises later and later each day (like a student during summer vacation).</p> <p class=\"lt-phys-64671\">After about one week, the Moon is one-quarter of the way around its orbit (position C) and so we say it is at the <em data-effect=\"italics\">first quarter</em> phase. Half of the Moon’s illuminated side is visible to Earth observers. Because of its eastward motion, the Moon now lags about one-quarter of the day behind the Sun, rising around noon and setting around midnight.</p> <p class=\"lt-phys-64671\">During the week after the first quarter phase, we see more and more of the Moon’s illuminated hemisphere (position D), a phase that is called <em data-effect=\"italics\">waxing</em> (or growing) gibbous (from the Latin <em data-effect=\"italics\">gibbus</em>, meaning hump). Eventually, the Moon arrives at position E in our figure, where it and the Sun are opposite each other in the sky. The side of the Moon turned toward the Sun is also turned toward Earth, and we have the <em data-effect=\"italics\">full</em> phase.</p> <p class=\"lt-phys-64671\">When the Moon is full, it is opposite the Sun in the sky. The Moon does the opposite of what the Sun does, rising at sunset and setting at sunrise. Note what that means in practice: the completely illuminated (and thus very noticeable) Moon rises just as it gets dark, remains in the sky all night long, and sets as the Sun’s first rays are seen at dawn. Its illumination throughout the night helps lovers on a romantic stroll and students finding their way back to their dorms after a long night in the library or an off-campus party.</p> <p class=\"lt-phys-64671\">And when is the full moon highest in the sky and most noticeable? At midnight, a time made famous in generations of horror novels and films. (Note how the behavior of a vampire like Dracula parallels the behavior of the full Moon: Dracula rises at sunset, does his worst mischief at midnight, and must be back down in his coffin by sunrise. The old legends were a way of personifying the behavior of the Moon, which was a much more dramatic part of people’s lives in the days before electric lights and television.)</p> <p class=\"lt-phys-64671\">Folklore has it that more crazy behavior is seen during the time of the full moon (the Moon even gives a name to crazy behavior—“lunacy”). But, in fact, statistical tests of this “hypothesis” involving thousands of records from hospital emergency rooms and police files do not reveal any correlation of human behavior with the phases of the Moon. For example, homicides occur at the same rate during the new moon or the crescent moon as during the full moon. Most investigators believe that the real story is not that more crazy behavior happens on nights with a full moon, but rather that we are more likely to notice or remember such behavior with the aid of a bright celestial light that is up all night long.</p> <p class=\"lt-phys-64671\">During the two weeks following the full moon, the Moon goes through the same phases again in reverse order (points F, G, and H in Figure 4.14), returning to new phase after about 29.5 days. About a week after the full moon, for example, the Moon is at <em data-effect=\"italics\">third quarter</em>, meaning that it is three-quarters of the way around (not that it is three-quarters illuminated—in fact, half of the visible side of the Moon is again dark). At this phase, the Moon is now rising around midnight and setting around noon.</p> <p class=\"lt-phys-64671\">Note that there is one thing quite misleading about Figure 4.14. If you look at the Moon in position E, although it is full in theory, it appears as if its illumination would in fact be blocked by a big fat Earth, and hence we would not see anything on the Moon except Earth’s shadow. In reality, the Moon is nowhere near as close to Earth (nor is its path so identical with the Sun’s in the sky) as this diagram (and the diagrams in most textbooks) might lead you to believe.</p> <p class=\"lt-phys-64671\">The Moon is actually 30 <em data-effect=\"italics\">Earth-diameters</em> away from us; Science and the Universe: A Brief Tour contains a diagram that shows the two objects to scale. And, since the Moon’s orbit is tilted relative to the path of the Sun in the sky, Earth’s shadow misses the Moon most months. That’s why we regularly get treated to a full moon. The times when Earth’s shadow does fall on the Moon are called lunar eclipses and are discussed in Eclipses of the Sun and Moon.</p> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64671\"><span class=\"lt-icon-default\">Making Connections: Astronomy and the Days of the Week</span></h5> <p class=\"lt-phys-64671\">The week seems independent of celestial motions, although its length may have been based on the time between quarter phases of the Moon. In Western culture, the seven days of the week are named after the seven “wanderers” that the ancients saw in the sky: the Sun, the Moon, and the five planets visible to the unaided eye (Mercury, Venus, Mars, Jupiter, and Saturn).</p> <p class=\"lt-phys-64671\">In English, we can easily recognize the names Sun-day (Sunday), Moon-day (Monday), and Saturn-day (Saturday), but the other days are named after the Norse equivalents of the Roman gods that gave their names to the planets. In languages more directly related to Latin, the correspondences are clearer. Wednesday, Mercury’s day, for example, is <em data-effect=\"italics\">mercoledi</em> in Italian, <em data-effect=\"italics\">mercredi</em> in French, and <em data-effect=\"italics\">miércoles</em> in Spanish. Mars gives its name to Tuesday (<em data-effect=\"italics\">martes</em> in Spanish), Jupiter or Jove to Thursday (<em data-effect=\"italics\">giovedi</em> in Italian), and Venus to Friday (<em data-effect=\"italics\">vendredi</em> in French).</p> <p class=\"lt-phys-64671\">There is no reason that the week has to have seven days rather than five or eight. It is interesting to speculate that if we had lived in a planetary system where more planets were visible without a telescope, the Beatles could have been right and we might well have had “Eight Days a Week.”</p> </div> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64671\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p class=\"lt-phys-64671\">This <a href=\"https://openstax.org/l/30moonorbit\" rel=\"noopener nofollow\" target=\"_blank\">simulation of the Moon orbiting the Earth</a> shows both a “top-down” view and the view from Earth’s surface.</p> </div> <h3 class=\"lt-phys-64671\">The Moon’s Revolution and Rotation</h3> <p class=\"lt-phys-64671\">The Moon’s sidereal period—that is, the period of its revolution about Earth measured with respect to the stars—is a little over 27 days: the <span data-type=\"term\" group-by=\"s\">sidereal month</span> is 27.3217 days to be exact. The time interval in which the phases repeat—say, from full to full—is the <span data-type=\"term\" group-by=\"s\">solar month</span>, 29.5306 days. The difference results from Earth’s motion around the Sun. The <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> must make more than a complete turn around the moving Earth to get back to the same phase with respect to the Sun. As we saw, the Moon changes its position on the celestial sphere rather rapidly: even during a single evening, the Moon creeps visibly eastward among the stars, traveling its own width in a little less than 1 hour. The delay in moonrise from one day to the next caused by this eastward motion averages about 50 minutes.</p> <p class=\"lt-phys-64671\">The Moon <em data-effect=\"italics\">rotates</em> on its axis in exactly the same time that it takes to <em data-effect=\"italics\">revolve</em> about Earth. As a consequence, the Moon always keeps the same face turned toward Earth (Figure 4.15). You can simulate this yourself by “orbiting” your roommate or another volunteer. Start by facing your roommate. If you make one rotation (spin) with your shoulders in the exact same time that you revolve around him or her, you will continue to face your roommate during the whole “orbit.” As we will see in coming chapters, our Moon is not the only world that exhibits this behavior, which scientists call <span data-type=\"term\" group-by=\"s\">synchronous rotation</span>.</p> <figure><span data-alt=\"The Moon without and with Rotation. In panel (a), at top, the Earth is drawn at the center of a blue ellipse representing the orbit of the Moon. The Moon is shown at four positions along its orbit far right, top center, far left and bottom center. Each image of the Moon has a white arrow pointing upward. In (b), at bottom, the Earth is drawn at the center of a blue ellipse representing the orbit of the Moon. The Moon is shown at four positions along its orbit far right, top center, far left and bottom center. A short counter-clockwise arrow is drawn ¼ away around each Moon image indicating its rotation. In contrast to panel (a), the white arrows on the Moon each now point toward the Earth.\" data-type=\"media\"><img alt=\"The Moon without and with Rotation. In panel (a), at top, the Earth is drawn at the center of a blue ellipse representing the orbit of the Moon. The Moon is shown at four positions along its orbit far right, top center, far left and bottom center. Each image of the Moon has a white arrow pointing upward. In (b), at bottom, the Earth is drawn at the center of a blue ellipse representing the orbit of the Moon. The Moon is shown at four positions along its orbit far right, top center, far left and bottom center. A short counter-clockwise arrow is drawn ¼ away around each Moon image indicating its rotation. In contrast to panel (a), the white arrows on the Moon each now point toward the Earth.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45828/60d9478613a73a82ec29bf161954234c75f1a850\" /> </span> <figcaption>Figure 4.15 : The Moon without and with Rotation. In this figure, we stuck a white arrow into a fixed point on the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> to keep track of its sides. (a) If the Moon did not rotate as it orbited Earth, it would present all of its sides to our view; hence the white arrow would point directly toward Earth only in the bottom position on the diagram. (b) Actually, the Moon rotates in the same period that it revolves, so we always see the same side (the white arrow keeps pointing to Earth).</figcaption> </figure> <p class=\"lt-phys-64671\">The differences in the Moon’s appearance from one night to the next are due to changing illumination by the Sun, not to its own rotation. You sometimes hear the back side of the Moon (the side we never see) called the “dark side.” This is a misunderstanding of the real situation: which side is light and which is dark changes as the Moon moves around Earth. The back side is dark no more frequently than the front side. Since the Moon rotates, the Sun rises and sets on all sides of the Moon. With apologies to Pink Floyd, there is simply no regular “Dark Side of the Moon.”</p> <h2>Eclipses and Tides</h2> <section class=\"box-objectives\"> <h5 class=\"box-legend lt-phys-64673\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <p class=\"lt-phys-64673\">By the end of this section, you will be able to:</p> <ul> <li class=\"lt-phys-64673\">Describe what causes lunar and solar eclipses</li> <li class=\"lt-phys-64673\">Differentiate between a total and partial solar eclipse</li> <li class=\"lt-phys-64673\">Explain why lunar eclipses are much more common than solar eclipses</li> </ul> </section> <p class=\"lt-phys-64673\">One of the coincidences of living on <span class=\"no-emphasis\" data-type=\"term\" group-by=\"E\">Earth</span> at the present time is that the two most prominent astronomical objects, the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sun</span> and the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span>, have nearly the same apparent size in the sky. Although the Sun is about 400 times larger in diameter than the Moon, it is also about 400 times farther away, so both the Sun and the Moon have the same angular size—about 1/2°. As a result, the Moon, as seen from Earth, can appear to cover the Sun, producing one of the most impressive events in nature.</p> <p class=\"lt-phys-64673\">Any solid object in the solar system casts a shadow by blocking the light of the Sun from a region behind it. This shadow in space becomes apparent whenever another object moves into it. In general, an <em data-effect=\"italics\">eclipse</em> occurs whenever any part of either Earth or the Moon enters the shadow of the other. When the Moon’s shadow strikes Earth, people within that shadow see the Sun at least partially covered by the Moon; that is, they witness a <span data-type=\"term\" group-by=\"s\">solar eclipse</span>. When the Moon passes into the shadow of Earth, people on the night side of Earth see the Moon darken in what is called a <span data-type=\"term\" group-by=\"l\">lunar eclipse</span>. Let’s look at how these happen in more detail.</p> <p class=\"lt-phys-64673\">The shadows of Earth and the Moon consist of two parts: a cone where the shadow is darkest, called the <em data-effect=\"italics\">umbra</em>, and a lighter, more diffuse region of darkness called the <em data-effect=\"italics\">penumbra</em>. As you can imagine, the most spectacular eclipses occur when an object enters the umbra. Figure 4.21 illustrates the appearance of the Moon’s shadow and what the Sun and Moon would look like from different points within the shadow.</p> <figure><span data-alt=\"Solar Eclipse. In panel (a), at top, the geometry of a solar eclipse is drawn as seen from above. At left the Sun is drawn as a large yellow disc. At center, a hypothetical spherical body is drawn as a blue disc. The shadow cast by this body is indicated by two yellow arrows which are drawn from the top of the Sun’s disk to the blue body; one touches the top of the body and continues to the right and one touches the bottom and continues to the right. To complete the shadow, two yellow arrows are drawn from the bottom of the Sun’s disk to the blue body; one touches the bottom of the blue disc and continues to the right and one touches the top and continues to the right. Beyond the blue disc on the right side of the diagram, four areas within the shadow are indicated with numbers corresponding to the images in panel (b). At position 1, closest to the blue disc, the eclipse is total. At positions 2 and 3 the eclipses are partial. At position 4, furthest from the blue disc, the eclipse is annular.\" data-type=\"media\"><img alt=\"Solar Eclipse. In panel (a), at top, the geometry of a solar eclipse is drawn as seen from above. At left the Sun is drawn as a large yellow disc. At center, a hypothetical spherical body is drawn as a blue disc. The shadow cast by this body is indicated by two yellow arrows which are drawn from the top of the Sun’s disk to the blue body; one touches the top of the body and continues to the right and one touches the bottom and continues to the right. To complete the shadow, two yellow arrows are drawn from the bottom of the Sun’s disk to the blue body; one touches the bottom of the blue disc and continues to the right and one touches the top and continues to the right. Beyond the blue disc on the right side of the diagram, four areas within the shadow are indicated with numbers corresponding to the images in panel (b). At position 1, closest to the blue disc, the eclipse is total. At positions 2 and 3 the eclipses are partial. At position 4, furthest from the blue disc, the eclipse is annular.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45838/f4e5fdde8d7cad1baa309e40ffc6969e19abeb16\" /> </span> <figcaption>Figure 4.21 : Solar Eclipse. (a) The shadow cast by a spherical body (the Moon, for example) is shown. Notice the dark umbra and the lighter penumbra. Four points in the shadow are labeled with numbers. In (b) you see what the Sun and Moon would look like in the sky at the four labeled points. At position 1, you see a total eclipse. At positions 2 and 3, the eclipse is partial. At position 4, the Moon is farther away and thus cannot cover the Sun completely; a ring of light thus shows around the Sun, creating what is called an “annular” eclipse.</figcaption> </figure> <p class=\"lt-phys-64673\">If the path of the Moon in the sky were identical to the path of the Sun (the ecliptic), we might expect to see an eclipse of the Sun and the Moon each month—whenever the Moon got in front of the Sun or into the shadow of Earth. However, as we mentioned, the Moon’s orbit is tilted relative to the plane of Earth’s orbit about the Sun by about 5° (imagine two hula hoops with a common center, but tilted a bit). As a result, during most months, the Moon is sufficiently above or below the ecliptic plane to avoid an eclipse. But when the two paths cross (twice a year), it is then “eclipse season” and eclipses are possible.</p> <h3 class=\"lt-phys-64673\">Eclipses of the Sun</h3> <p class=\"lt-phys-64673\">The apparent or angular sizes of both the Sun and Moon vary slightly from time to time as their distances from Earth vary. (Figure 4.21 shows the distance of the observer varying at points 1–4, but the idea is the same.) Much of the time, the Moon looks slightly smaller than the Sun and cannot cover it completely, even if the two are perfectly aligned. In this type of “annular eclipse,” there is a ring of light around the dark sphere of the Moon.</p> <p class=\"lt-phys-64673\">However, if an eclipse of the Sun occurs when the Moon is somewhat nearer than its average distance, the Moon can completely hide the Sun, producing a <em data-effect=\"italics\">total</em> solar eclipse. Another way to say it is that a <span class=\"no-emphasis\" data-type=\"term\" group-by=\"t\">total eclipse</span> of the Sun occurs at those times when the umbra of the Moon’s shadow reaches the surface of Earth.</p> <p class=\"lt-phys-64673\">The geometry of a total solar eclipse is illustrated in Figure 4.22. If the Sun and Moon are properly aligned, then the Moon’s darkest shadow intersects the ground at a small point on Earth’s surface. Anyone on Earth within the small area covered by the tip of the Moon’s shadow will, for a few minutes, be unable to see the Sun and will witness a total eclipse. At the same time, observers on a larger area of Earth’s surface who are in the penumbra will see only a part of the Sun eclipsed by the Moon: we call this a <em data-effect=\"italics\">partial</em> solar eclipse.</p> <p class=\"lt-phys-64673\">Between Earth’s rotation and the motion of the Moon in its orbit, the tip of the Moon’s shadow sweeps eastward at about 1500 kilometers per hour along a thin band across the surface of Earth. The thin zone across Earth within which a total solar eclipse is visible (weather permitting) is called the eclipse path. Within a region about 3000 kilometers on either side of the eclipse path, a partial solar eclipse is visible. It does not take long for the Moon’s shadow to sweep past a given point on Earth. The duration of totality may be only a brief instant; it can never exceed about 7 minutes.</p> <figure><span data-alt=\"Geometry of a Total Solar Eclipse. The Sun is drawn at lower left and the Earth at upper right. Surrounding the Earth is a blue circle for the Moon’s orbit, with the Moon drawn at a point directly between the Sun and Earth. The Earth’s shadow is a dark grey cone extending from the night side of Earth toward the upper right, away from the Sun. The Moon’s shadow is a dark grey cone extending from the night side of the Moon away from the Sun to a point on Earth’s surface labeled “Eclipse path”.\" data-type=\"media\"><img alt=\"Geometry of a Total Solar Eclipse. The Sun is drawn at lower left and the Earth at upper right. Surrounding the Earth is a blue circle for the Moon’s orbit, with the Moon drawn at a point directly between the Sun and Earth. The Earth’s shadow is a dark grey cone extending from the night side of Earth toward the upper right, away from the Sun. The Moon’s shadow is a dark grey cone extending from the night side of the Moon away from the Sun to a point on Earth’s surface labeled “Eclipse path”.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45836/69d48542b0b5d9899e5902cb27812ffe31270b6a\" /> </span> <figcaption>Figure 4.22 : Geometry of a Total Solar Eclipse. Note that our diagram is not to scale. The Moon blocks the Sun during new moon phase as seen from some parts of Earth and casts a shadow on our planet.</figcaption> </figure> <p class=\"lt-phys-64673\">Because a total eclipse of the Sun is so spectacular, it is well worth trying to see one if you can. There are some people whose hobby is “eclipse chasing” and who brag about how many they have seen in their lifetimes. Because much of Earth’s surface is water, eclipse chasing can involve lengthy boat trips (and often requires air travel as well). As a result, eclipse chasing is rarely within the budget of a typical college student. Nevertheless, a list of future eclipses is given for your reference in Appendix H, just in case you strike it rich early. (And, as you can see in the Appendix, there was a total eclipse visible in the United States in 2017, and there will be another in 2024, to which college students may be able to afford travel.)</p> <h3 class=\"lt-phys-64673\">Appearance of a Total Eclipse</h3> <p class=\"lt-phys-64673\">What can you see if you are lucky enough to catch a total eclipse? A solar eclipse starts when the Moon just begins to silhouette itself against the edge of the Sun’s disk. A partial phase follows, during which more and more of the Sun is covered by the Moon. About an hour after the eclipse begins, the Sun becomes completely hidden behind the Moon. In the few minutes immediately before this period of totality begins, the sky noticeably darkens, some flowers close up, and chickens may go to roost. As an eerie twilight suddenly descends during the day, other animals (and people) may get disoriented. During totality, the sky is dark enough that planets become visible in the sky, and usually the brighter stars do as well.</p> <p class=\"lt-phys-64673\">As the bright disk of the Sun becomes entirely hidden behind the Moon, the Sun’s remarkable corona flashes into view (Figure 4.23). The <em data-effect=\"italics\">corona</em> is the Sun’s outer atmosphere, consisting of sparse gases that extend for millions of miles in all directions from the apparent surface of the Sun. It is ordinarily not visible because the light of the corona is feeble compared with the light from the underlying layers of the Sun. Only when the brilliant glare from the Sun’s visible disk is blotted out by the Moon during a total eclipse is the pearly white corona visible. (We’ll talk more about the corona in the chapter on The Sun: A Garden-Variety Star.)</p> <figure><span data-alt=\"The Sun’s Corona. The black disk of the Moon covers the Sun allowing the faint streamers and delicate tendrils of the corona to be seen.\" data-type=\"media\"><img alt=\"The Sun’s Corona. The black disk of the Moon covers the Sun allowing the faint streamers and delicate tendrils of the corona to be seen.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45837/2da97d94c1696f7bbe0aeaf657bb582963172b55\" /> </span> <figcaption>Figure 4.23 : The Sun’s Corona. The corona (thin outer atmosphere) of the Sun is visible during a total solar eclipse. (It looks more extensive in photographs than it would to the unaided eye.) (credit: modification of work by Lutfar Rahman Nirjhar)</figcaption> </figure> <p class=\"has-noteref lt-phys-64673\">The total phase of the eclipse ends, as abruptly as it began, when the Moon begins to uncover the Sun. Gradually, the partial phases of the eclipse repeat themselves, in reverse order, until the Moon has completely uncovered the Sun. We should make one important safety point here: while the few minutes of the <em data-effect=\"italics\">total</em> eclipse are safe to look at, if any part of the Sun is uncovered, you must protect your eyes with safe eclipse glasses<sup data-type=\"footnote-number\">2</sup> or by projecting an image of the Sun (instead of looking at it directly). For more, read the How to Observe Solar Eclipses box in this chapter.</p> <h3 class=\"lt-phys-64673\">Eclipses of the Moon</h3> <p class=\"lt-phys-64673\">A lunar eclipse occurs when the Moon enters the shadow of Earth. The geometry of a lunar eclipse is shown in Figure 4.24. Earth’s dark shadow is about 1.4 million kilometers long, so at the Moon’s distance (an average of 384,000 kilometers), it could cover about four full moons. Unlike a solar eclipse, which is visible only in certain local areas on Earth, a lunar eclipse is visible to everyone who can see the Moon. Because a lunar eclipse can be seen (weather permitting) from the entire night side of Earth, lunar eclipses are observed far more frequently from a given place on Earth than are solar eclipses.</p> <figure><span data-alt=\"Geometry of a Lunar Eclipse. The Sun is drawn at lower left and the Earth at upper right. Surrounding the Earth is a blue circle for the Moon’s orbit, with the Moon drawn at three positions along the circle. The Earth’s shadow is a dark grey cone extending from the night side of Earth toward the upper right, away from the Sun. At position “A”, to the right of Earth, the Moon has yet to enter Earth’s shadow and is seen as “Full moon (as seen from Earth)”. At position “B”, above and to the left of “A”, the Moon begins to enter Earth’s shadow – the eclipse has begun. At point “C”, above and to the left of “B”, the Moon has begun to leave Earth’s shadow.\" data-type=\"media\"><img alt=\"Geometry of a Lunar Eclipse. The Sun is drawn at lower left and the Earth at upper right. Surrounding the Earth is a blue circle for the Moon’s orbit, with the Moon drawn at three positions along the circle. The Earth’s shadow is a dark grey cone extending from the night side of Earth toward the upper right, away from the Sun. At position “A”, to the right of Earth, the Moon has yet to enter Earth’s shadow and is seen as “Full moon (as seen from Earth)”. At position “B”, above and to the left of “A”, the Moon begins to enter Earth’s shadow – the eclipse has begun. At point “C”, above and to the left of “B”, the Moon has begun to leave Earth’s shadow.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45840/5201b731746ea4112e3287cc7cb2d46f1b40e087\" /> </span> <figcaption>Figure 4.24 : Geometry of a Lunar Eclipse. The Moon is shown moving through the different parts of Earth’s shadow during a total lunar eclipse. Note that the distance the Moon moves in its orbit during the eclipse has been exaggerated here for clarity.</figcaption> </figure> <p class=\"lt-phys-64673\">An eclipse of the Moon is total only if the Moon’s path carries it though Earth’s umbra. If the Moon does not enter the umbra completely, we have a <span class=\"no-emphasis\" data-type=\"term\" group-by=\"p\">partial eclipse</span> of the Moon. But because Earth is larger than the Moon, its umbra is larger, so that lunar eclipses last longer than solar eclipses, as we will discuss below.</p> <p class=\"lt-phys-64673\">A lunar eclipse can take place only when the Sun, Earth, and Moon are in a line. The Moon is opposite the Sun, which means the Moon will be in full phase before the eclipse, making the darkening even more dramatic. About 20 minutes before the Moon reaches the dark shadow, it dims somewhat as Earth partly blocks the sunlight. As the Moon begins to dip into the shadow, the curved shape of Earth’s shadow upon it soon becomes apparent.</p> <p class=\"lt-phys-64673\">Even when totally eclipsed, the Moon is still faintly visible, usually appearing a dull coppery red. The illumination on the eclipsed Moon is sunlight that has been bent into Earth’s shadow by passing through Earth’s atmosphere.</p> <p class=\"lt-phys-64673\">After totality, the Moon moves out of the shadow and the sequence of events is reversed. The total duration of the eclipse depends on how closely the Moon’s path approaches the axis of the shadow. For an eclipse where the Moon goes through the center of Earth’s shadow, each partial phase consumes at least 1 hour, and totality can last as long as 1 hour and 40 minutes. Eclipses of the Moon are much more “democratic” than solar eclipses. Since the full moon is visible on the entire night side of Earth, the lunar eclipse is visible for all those who live in that hemisphere. (Recall that a total eclipse of the Sun is visible only in a narrow path where the shadow of the umbra falls.) Total eclipses of the Moon occur, on average, about once every two or three years. A list of future total eclipses of the Moon is in Appendix H. In addition, since the lunar eclipse happens to a full moon, and a full moon is not dangerous to look at, everyone can look at the Moon during all the parts of the eclipse without worrying about safety.</p> <p class=\"lt-phys-64673\">Thanks to our understanding of gravity and motion (see Orbits and Gravity), eclipses can now be predicted centuries in advance. We’ve come a long way since humanity stood frightened by the darkening of the Sun or the Moon, fearing the displeasure of the gods. Today, we enjoy the sky show with a healthy appreciation of the majestic forces that keep our solar system running.</p> <div class=\"box-note\"> <header>&nbsp;</header> <p class=\"lt-phys-64673\">Use the <a href=\"https://openstax.org/l/30solueclips\" rel=\"noopener nofollow\" target=\"_blank\">Solar and Lunar Eclipse simulation</a> to explore the conditions of solar and lunar eclipses yourself.</p> </div> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64673\"><span class=\"lt-icon-default\">Seeing for Yourself: How to Observe Solar Eclipses</span></h5> <p class=\"lt-phys-64673\">A total eclipse of the Sun is a spectacular sight and should not be missed. However, it is extremely dangerous to look directly at the Sun: even a brief exposure can damage your eyes. Normally, few rational people are tempted to do this because it is painful (and something your mother told you never to do!). But during the partial phases of a solar eclipse, the temptation to take a look is strong. Think before you give in. The fact that the Moon is covering part of the Sun doesn’t make the uncovered part any less dangerous to look at. Still, there are perfectly safe ways to follow the course of a solar eclipse, if you are lucky enough to be in the path of the shadow.</p> <p class=\"lt-phys-64673\">The easiest technique is to make a pinhole projector. Take a piece of cardboard with a small (1 millimeter) hole punched in it, and hold it several feet above a light surface, such as a concrete sidewalk or a white sheet of paper, so that the hole is “aimed” at the Sun. The hole produces a fuzzy but adequate image of the eclipsed Sun. Alternatively, if it’s the right time of year, you can let the tiny spaces between a tree’s leaves form multiple pinhole images against a wall or sidewalk. Watching hundreds of little crescent Suns dancing in the breeze can be captivating. A kitchen colander also makes an excellent pinhole projector.</p> <p class=\"lt-phys-64673\">Although there are safe filters for looking at the Sun directly, people have suffered eye damage by looking through improper filters, or no filter at all. For example, neutral density photographic filters are not safe because they transmit infrared radiation that can cause severe damage to the retina. Also unsafe are smoked glass, completely exposed color film, sunglasses, and many other homemade filters. Safe filters include welders’ goggles and specially designed eclipse glasses.</p> <p class=\"lt-phys-64673\">You should certainly look at the Sun directly when it is totally eclipsed, even through binoculars or telescopes. Unfortunately, the total phase, as we discussed, is all too brief. But if you know when it is coming and going, be sure you look, for it’s an unforgettably beautiful sight. And, despite the ancient folklore that presents eclipses as dangerous times to be outdoors, the partial phases of eclipses—as long as you are not looking directly at the Sun—are not any more dangerous than being out in sunlight.</p> <p class=\"lt-phys-64673\">During past eclipses, unnecessary panic has been created by uninformed public officials acting with the best intentions. There were two marvelous total eclipses in Australia in the twentieth century during which townspeople held newspapers over their heads for protection and schoolchildren cowered indoors with their heads under their desks. What a pity that all those people missed what would have been one of the most memorable experiences of their lifetimes.</p> <p class=\"lt-phys-64673\">On August 21, 2017, a total eclipse of the Sun was visible across a large swath of the continental United States, and was seen by millions of people from around the country and the world (a).</p> <figure><span data-alt=\"2017 Total Solar Eclipse. The path of the eclipse across the United States is drawn on this map. Beginning in OR, the path moves southeastward through ID, WY, NE, KS, MO, TN and SC.\" data-type=\"media\"><img alt=\"2017 Total Solar Eclipse. The path of the eclipse across the United States is drawn on this map. Beginning in OR, the path moves southeastward through ID, WY, NE, KS, MO, TN and SC.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45841/9244f3c42ba2d64951fcb8d8596956973847c706\" /> </span> <figcaption>Figure 4.25 : 2017 Total Solar and Lunar Eclipse (a) The eclipsed Sun August 21, 2017, showing remarkable detail in the Sun’s outer atmosphere. This is a composite of short, medium, and long exposures, as no single exposure can capture the huge range of brightness the Sun exhibits. (b) A total eclipse of the Moon seen over California on January 31, 2018. The Moon moves slowly into the Earth’s shadow, looks red when the eclipse is total and red sunlight refracts through the Earth’s atmosphere, and then slowly moves out of the shadow. (credit a: modification of work by Rick Fienberg, American Astronomical Socity/TravelQuest International; credit b: modification of work by Brian Day.)</figcaption> </figure> </div> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64673\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p class=\"lt-phys-64673\">For the August 2017 eclipse, the United States postal service issued a special commemorative stamp — the first ever with “thermochromic ink” which changes when you touch it.</p> </div> <h3 class=\"lt-phys-64673\" data-type=\"footnote-refs-title\">Footnotes</h3> <ul data-bullet-style=\"none\" data-list-type=\"bulleted\"> <li class=\"lt-phys-64673\" data-type=\"footnote-ref\"><a href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/04:_Earth_Moon_and_Sky/4.08:_Eclipses_of_the_Sun_and_Moon#footnote-ref1\" role=\"doc-backlink\">2</a><span data-type=\"footnote-ref-content\">Eclipse</span><span data-type=\"footnote-ref-content\"> glasses are available in many planetarium and observatory gift stores, and also from the two main U.S. manufacturers: American Paper Optics and Rainbow Symphony.</span></li> </ul>"
