                    - text: ", the radius of Sirius is 91 times larger than the radius of its faint companion."
                  - paragraph [ref=f282e136]: The method for determining the radius shown here requires both stars be visible, which is not always the case.
                  - heading "Stellar Diameters" [level=3] [ref=f282e137]
                  - paragraph [ref=f282e138]: The results of many stellar size measurements over the years have shown that most nearby stars are roughly the size of the Sun, with typical diameters of a million kilometers or so. Faint stars, as we might have expected, are generally smaller than more luminous stars. However, there are some dramatic exceptions to this simple generalization.
                  - paragraph [ref=f282e139]:
                    - text: A few of the very luminous stars, those that are also red (indicating relatively low surface temperatures), turn out to be truly enormous. These stars are called, appropriately enough, giant stars or supergiant stars. An example is Betelgeuse, the second brightest star in the constellation of Orion and one of the dozen brightest stars in our sky. Its diameter, remarkably, is greater than 10 AU (1.5
                    - emphasis [ref=f282e140]: billion
                    - text: kilometers!), large enough to fill the entire inner solar system almost as far out as Jupiter. In Stars from Adolescence to Old Age, we will look in detail at the evolutionary process that leads to the formation of such giant and supergiant stars.
                  - heading "Further Exploration" [level=3] [ref=f282e141]
