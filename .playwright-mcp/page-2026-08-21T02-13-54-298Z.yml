                  - paragraph [ref=f282e126]:
                    - text: Therefore, the relative sizes of the two stars can be found by taking the square root of the relative luminosity. Since
                    - math [ref=f282e127]:
                      - generic [ref=f282e130]:
                        - generic [ref=f282e131]: "8200"
