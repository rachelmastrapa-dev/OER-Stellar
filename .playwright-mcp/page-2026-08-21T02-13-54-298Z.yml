                  - heading "Measuring the Size of a Star" [level=2] [ref=f282e2]
                  - paragraph [ref=f282e3]: It is easy to measure the diameter of the Sun. Its angular diameter—that is, its apparent size on the sky—is about 1/2°. If we know the angle the Sun takes up in the sky and how far away it is, we can calculate its true (linear) diameter, which is 1.39 million kilometers, or about 109 times the diameter of Earth.
                  - paragraph [ref=f282e4]: Unfortunately, the Sun is the only star whose angular diameter is easily measured. All the other stars are so far away that they look like pinpoints of light through even the largest ground-based telescopes. (They often seem to be bigger, but that is merely distortion introduced by turbulence in Earth’s atmosphere.) Luckily, there are several techniques that astronomers can use to estimate the sizes of stars.
                  - heading "Stars Blocked by the Moon" [level=3] [ref=f282e5]
                  - paragraph [ref=f282e6]: One technique, which gives very precise diameters but can be used for only a few stars, is to observe the dimming of light that occurs when the Moon passes in front of a star. What astronomers measure (with great precision) is the time required for the star’s brightness to drop to zero as the edge of the Moon moves across the star’s disk. Since we know how rapidly the Moon moves in its orbit around Earth, it is possible to calculate the angular diameter of the star. If the distance to the star is also known, we can calculate its diameter in kilometers. This method works only for fairly bright stars that happen to lie along the zodiac, where the Moon (or, much more rarely, a planet) can pass in front of them as seen from Earth.
                  - heading "Eclipsing Binary Stars" [level=3] [ref=f282e7]
                  - paragraph [ref=f282e8]: Accurate sizes for a large number of stars come from measurements of eclipsing binary star systems, and so we must make a brief detour from our main story to examine this type of star system. Some binary stars are lined up in such a way that, when viewed from Earth, each star passes in front of the other during every revolution (Figure 18.10). When one star blocks the light of the other, preventing it from reaching Earth, the brightness of the system decreases, and astronomers say that an eclipse has occurred.
                  - figure [ref=f282e9]:
                    - img [ref=f282e11]
                  - paragraph [ref=f282e13]: The discovery of the first eclipsing binary helped solve a long-standing puzzle in astronomy. The star Algol, in the constellation of Perseus, changes its brightness in an odd but regular way. Normally, Algol is a fairly bright star, but at intervals of 2 days, 20 hours, 49 minutes, it fades to one-third of its regular brightness. After a few hours, it brightens to normal again. This effect is easily seen, even without a telescope, if you know what to look for.
                  - paragraph [ref=f282e14]:
                    - text: In 1783, a young English astronomer named John
                    - generic [ref=f282e15]: Goodricke
                    - text: (1764–1786) made a careful study of Algol (see the feature on John Goodricke for a discussion of his life and work). Even though Goodricke could neither hear nor speak, he made a number of major discoveries in the 21 years of his brief life. He suggested that Algol’s unusual brightness variations might be due to an invisible companion that regularly passes in front of the brighter star and blocks its light. Unfortunately, Goodricke had no way to test this idea, since it was not until about a century later that equipment became good enough to measure Algol’s spectrum.
                  - paragraph [ref=f282e16]: In 1889, the German astronomer Hermann Vogel (1841–1907) demonstrated that, like Mizar, Algol is a spectroscopic binary. The spectral lines of Algol were not observed to be double because the fainter star of the pair gives off too-little light compared with the brighter star for its lines to be conspicuous in the composite spectrum. Nevertheless, the periodic shifting back and forth of the brighter star’s lines gave evidence that it was revolving about an unseen companion. (The lines of both components need not be visible for a star to be recognized as a spectroscopic binary.)
                  - paragraph [ref=f282e17]: The discovery that Algol is a spectroscopic binary verified Goodricke’s hypothesis. The plane in which the stars revolve is turned nearly edgewise to our line of sight, and each star passes in front of the other during every revolution. (The eclipse of the fainter star in the Algol system is not very noticeable because the part of it that is covered contributes little to the total light of the system. This second eclipse can, however, be detected by careful measurements.)
                  - paragraph [ref=f282e18]: Any binary star produces eclipses if viewed from the proper direction, near the plane of its orbit, so that one star passes in front of the other (see Figure 18.10). But from our vantage point on Earth, only a few binary star systems are oriented in this way.
                  - heading "Diameters of Eclipsing Binary Stars" [level=3] [ref=f282e19]
                  - paragraph [ref=f282e20]: We now turn back to the main thread of our story to discuss how all this can be used to measure the sizes of stars. The technique involves making a light curve of an eclipsing binary, a graph that plots how the brightness changes with time. Let us consider a hypothetical binary system in which the stars are very different in size, like those illustrated in Figure 18.11. To make life easy, we will assume that the orbit is viewed exactly edge-on.
                  - paragraph [ref=f282e21]:
                    - text: Even though we cannot see the two stars separately in such a system, the light curve can tell us what is happening. When the smaller star just starts to pass behind the larger star (a point we call
                    - emphasis [ref=f282e22]: first contact
                    - text: ), the brightness begins to drop. The eclipse becomes total (the smaller star is completely hidden) at the point called
                    - emphasis [ref=f282e23]: second contact
                    - text: . At the end of the total eclipse (
                    - emphasis [ref=f282e24]: third
                    - emphasis [ref=f282e25]: contact
                    - text: )
                    - emphasis [ref=f282e26]: ","
                    - text: the smaller star begins to emerge. When the smaller star has reached
                    - emphasis [ref=f282e27]: last contact
                    - text: ", the eclipse is completely over."
                  - paragraph [ref=f282e28]: To see how this allows us to measure diameters, look carefully at Figure 18.11. During the time interval between the first and second contacts, the smaller star has moved a distance equal to its own diameter. During the time interval from the first to third contacts, the smaller star has moved a distance equal to the diameter of the larger star. If the spectral lines of both stars are visible in the spectrum of the binary, then the speed of the smaller star with respect to the larger one can be measured from the Doppler shift. But knowing the speed with which the smaller star is moving and how long it took to cover some distance can tell the span of that distance—in this case, the diameters of the stars. The speed multiplied by the time interval from the first to second contact gives the diameter of the smaller star. We multiply the speed by the time between the first and third contacts to get the diameter of the larger star.
                  - 'figure "Figure 18.11 : Light Curve of an Edge-On Eclipsing Binary. Here we see the light curve of a hypothetical eclipsing binary star whose orbit we view exactly edge-on, in which the two stars fully eclipse each other. From the time intervals between contacts, it is possible to estimate the diameters of the two stars." [ref=f282e29]':
                    - img [ref=f282e31]
                  - paragraph [ref=f282e33]: "In actuality, the situation with eclipsing binaries is often a bit more complicated: orbits are generally not seen exactly edge-on, and the light from each star may be only partially blocked by the other. Furthermore, binary star orbits, just like the orbits of the planets, are ellipses, not circles. However, all these effects can be sorted out from very careful measurements of the light curve."
                  - heading "Using the Radiation Law to Get the Diameter" [level=3] [ref=f282e34]
                  - paragraph [ref=f282e35]:
                    - text: Another method for measuring star diameters makes use of the Stefan-Boltzmann law for the relationship between energy radiated and temperature (see Radiation and Spectra). In this method, the
