                    - strong [ref=f414e5]: cataclysmic variable
                    - text: ": a binary star system consisting of a white dwarf and a secondary star that is transferring mass, resulting in irregular increases in brightness"
                  - listitem [ref=f414e6]:
                    - strong [ref=f414e8]: degenerate gas
                    - text: ": a gas that resists further compression because no two electrons can be in the same place at the same time doing the same thing (Pauli exclusion principle)"
                  - listitem [ref=f414e9]:
                    - strong [ref=f414e11]: neutron star
                    - text: ": a type of compact star that is composed almost entirely of neutrons, which are a type of subatomic particle with no electrical charge"
                  - listitem [ref=f414e12]:
                    - strong [ref=f414e14]: nova
                    - text: ": the sudden, temporary appearance of what appears to be a new star that fades over time"
                  - listitem [ref=f414e15]:
                    - strong [ref=f414e17]: pulsar
                    - text: ": a variable radio source of small physical size that emits very rapid radio pulses in very regular periods that range from fractions of a second to several seconds; now understood to be a rotating, magnetic neutron star that is energetic enough to produce a detectable beam of radiation and particles"
                  - listitem [ref=f414e18]:
                    - strong [ref=f414e20]: supernova
                    - text: ": the explosion of a massive star, resulting in a sharp increase in its brightness followed by gradual fading over weeks or months"
                  - listitem [ref=f414e21]:
                    - strong [ref=f414e23]: type Ia supernova
                    - text: ": an explosion that occurs in a binary star system when the material from the other star overwhelms a white dwarf"
                  - listitem [ref=f414e24]:
                    - strong [ref=f414e26]: type II supernova
                    - text: ": a stellar explosion produced at the endpoint of the evolution of stars whose mass exceeds roughly 10 times the mass of the Sun"
                  - listitem [ref=f414e27]:
                    - strong [ref=f414e29]: white dwarf
                    - text: ": a low-mass star that has exhausted most or all of its nuclear fuel and has collapsed to a very small size; such a star is near its final state of life"
