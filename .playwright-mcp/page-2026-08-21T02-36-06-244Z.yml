            - application "Rich Text Editor, editarea" [ref=f409e342]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f409e356]: "<h2>Science and Society - Radium Girls</h2> <p>Thus far, this chapter has focused on the many ways in which the universe churns out heavy elements after the violent explosions of massive stars. We find many of these elements on Earth and, as humans, have found many uses for them throughout&nbsp;history.</p> <p>Despite their utility, humanity has not always been so aware of the harmful effects these elements can have on the body. Therefore, this Science and Society will&nbsp;discuss one of the unfortunate results of such lack of understanding as a cautionary tale for&nbsp;interacting with radioactive elements.&nbsp;</p> <p>In the early 1920s, World War I brought on a host of new technologies in which the general public became very interested. One such technology was glow-in-the-dark paint that could be applied to watches, clocks, and other devices in which it’s useful to see in the dark. The chemical element that produces such a glow effect is called radium.</p> <h3>The Power and Utility of Radium</h3> <p>During this time, companies employed mostly young women to paint watches and other dials, as the public learned about the technology after soldiers returned from the war with their new “glowing” watches. Factories such as General Electric, Waterbury Manufacturing, and Arrow Electric quickly jumped on the trend, hiring workers to produce watches with the special paint.</p> <p>At first, radium was seen as a miracle substance, giving any surface the power to glow. Women working at the factories “pressed their brushes between their lips before dipping them in radium-laced paint to give their small brushes a nice, fine point”. In addition, painters would apply the substance to their dresses, fingernails, even teeth, to show off at parties and other social gatherings after work.</p> <figure><img alt=\"Women working at two rows of tables.\" class=\"internal default\" src=\"/@api/deki/files/67096/All_women_or_girls_using_radium_paint_with_no_protection_or_warnings_in_1922%252C_from-_USRadiumGirls-Argonne1%252Cca1922-23-150dpi_(cropped).jpg\" /> <figcaption> <p>Figure \\(\\PageIndex{1}\\): Radium Girls at Work. An all-female workforce used radium paint without protection at the United States Radium Corporation in 1922. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; Author Unknown via <a href=\"https://commons.wikimedia.org/w/index.php?curid=82821901\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p> </figcaption> </figure> <p>Just a few months after the “Radium Girls” were employed, workers began showing symptoms of severe tooth and jaw problems, spontaneous bone fractures, and other intense illnesses.</p> <p>Frances Splettstocher worked at the Waterbury Clock Company, and was one of the first to develop a severe toothache, extending throughout her jaw. A visit to the dentist resulted in extracting a tooth, except that a large chunk of the rest of her jaw detached with it. Soon after, the rest of her mouth began to rot until she had a hole in her cheek. At the age of 21, Frances was one of the first painters to die, within just one month of her first symptoms.</p> <p>For several years, companies like the Waterbury Clock Comply denied any connection of the working conditions to the fast-growing number of women falling ill. Some even produced in-house “studies”, denouncing any connection between the workers’ illnesses with their working conditions. It wasn’t until 1938 that a woman named Catherine Wolfe Donohue successfully sued the Radium Dial Company over her illness, though she herself was dying during the legal proceedings.</p> <figure><img alt=\"Advertisement with a man working article promoting Undark.\" class=\"internal default\" src=\"/@api/deki/files/67097/960px-Undark_(Radium_Girls)_advertisement%252C_1921.jpg\" /> <figcaption> <p>Figure \\(\\PageIndex{2}\\): Undark Advertisement. A magazine advertisement by Radium Luminous Material Corporation for Undark, a type of paint made with radium. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; Author Unknown via <a href=\"https://commons.wikimedia.org/wiki/File:Undark_(Radium_Girls)_advertisement,_1921.jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p> </figcaption> </figure> <h3>A Cautionary Tale</h3> <p>The section <a href=\"/Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.03:_Supernovae#Radioactive_Elements_and_Light\" target=\"_blank\" title=\"13.3: Supernovae\">Radioactive Elements and Light</a>&nbsp;discussed how some elements produced during a supernova explosion produce energetic gamma rays as they undergo radioactive decay. Modern research has shown that radioactive elements give off alpha and beta particles, along with these gamma rays. Alpha and beta particles are not harmful outside of the human body. However, if ingested (such as through the mouth), these particles can wreak havoc on human organs, causing a host of radiation damage over time.</p> <p>According to an article published by the Waterbury Observer Newspaper, “Now we understand what happened when the women swallowed radium: since it’s chemically similar to calcium, radium masqueraded as calcium in the bones. But instead of strengthening bones as calcium does, radium slowly kills bone tissue. The women suffered from dental problems because in the jaw, it’s easy for dead bone to be contaminated with bacteria. By swallowing radium, the women were giving alpha particles easy access to their bodies’ soft interior.”</p> <p>At the time of the post-war radium fad, the chemical element itself had only been discovered 20 years earlier by Marie and Pierre Curie, who did not know the full details on the element’s properties. Marie Curie herself suffered from radiation burns and radiation poisoning, though she was a strong advocate for recognition of workplace harm to the Radium Girls.&nbsp;</p> <p>You can read more of the aftermath involving the legal fallout, changes to workers rights and working conditions in the reference articles below.&nbsp;</p> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: The Book, Play, and Movie</span></h5> <p>These events have been adapted into <a href=\"https://www.theradiumgirls.com/\" target=\"_blank\" title=\"https://www.theradiumgirls.com/\">a book: Radium Girls by Kate Moore</a>, <a href=\"https://www.dramaticpublishing.com/browse/bestsellers/radium-girls\" target=\"_blank\" title=\"https://www.dramaticpublishing.com/browse/bestsellers/radium-girls\">a play: Radium Girls by D. W. Gregory</a>, and <a href=\"https://radiumgirlsmovie.com/\" target=\"_blank\" title=\"https://radiumgirlsmovie.com/\">a movie: Radium Girls</a>.</p> </section> <h3>References</h3> <p>Dancis, D. (2018, January 4). The Radium Girls at the National Archives. <em>The Text Message</em>. <a href=\"https://text-message.blogs.archives.gov/2018/01/04/the-radium-girls-at-the-national-archives/\" target=\"_blank\" title=\"The Radium Girls at the National Archives\">https://text-message.blogs.archives.gov/2018/01/04/the-radium-girls-at-the-national-archives/</a></p> <p>Murray, J. (2011, October 30). <em>After glow – 90 years ago workers at the Waterbury Clock Company began dying after painting radium on clock dials</em>. The Waterbury Observer. <a href=\"https://www.waterburyobserver.org/2011/10/30/2723/\" target=\"_blank\" title=\"After Glow – 90 Years Ago Workers At The Waterbury Clock Company Began Dying After Painting Radium On Clock Dials\">https://www.waterburyobserver.org/2011/10/30/2723/</a></p> <p>Coursey, B. M. (2021). The National Bureau of Standards and the radium dial painters. <em>Journal of Research of the National Institute of Standards and Technology</em>, <em>126</em>, Article 126051. <a href=\"https://nvlpubs.nist.gov/nistpubs/jres/126/jres.126.051.pdf\" target=\"_blank\" title=\"The National Bureau of Standards and the Radium Dial Painters\">https://nvlpubs.nist.gov/nistpubs/jres/126/jres.126.051.pdf</a></p>"
