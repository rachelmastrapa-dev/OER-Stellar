            - application "Rich Text Editor, editarea" [ref=f427e320]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f427e334]: "<h2>Origin and Impact of Black Holes</h2> <p>In this section we will discuss how black holes form from collapsing stellar cores, examine their physical properties, and investigate the remarkable effects they have on space, time, light, and matter.</p> <h3>What Is a Black Hole?</h3> <p class=\"lt-phys-64811\">Black holes are the remnants of supernova. Although we can't see them directly, we know by their gravity that they contain a very large amount of mass in a small amount of space. A black hole has a boundary called the event horizon. If something crosses that boundary, it can never escape. The <strong><a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.05:_Key_Terms#event horizon\" target=\"_blank\" title=\"event horizon\">event horizon</a></strong> is a one way boundary for both matter and light. To understand why light and matter can't escape from a black hole, let's review how one object escapes from the gravitational pull of another object. A rocket must be launched from the surface of Earth at a very high speed if it is to escape the pull of Earth's gravity. In fact, any object that is thrown into the air with a velocity less than 11 kilometers per second will soon fall back to Earth's surface. Only those objects launched with a speed greater than this <strong><a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.05:_Key_Terms#escape velocity\" target=\"_blank\" title=\"escape velocity\">escape velocity</a></strong> can get away from Earth. The escape velocity from the surface of the Sun is higher, 618 kilometers per second. For black holes to trap light, their escape velocity must be larger than the speed of light, 300,000 kilometers per second.</p> <h3>Formation of Black Holes</h3> <p class=\"lt-phys-64213\">As we learned in <a href=\"/Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.02:_Evolution_of_Massive_Stars\" title=\"13.2: Evolution of Massive Stars\">Evolution of Massive Stars</a>, if a star has a mass of over 40 times the mass of the Sun, or 40 M<sub>Sun</sub>, it will eventually become a black hole. A black hole forms as the result of a catastrophic collapse of the star's core. To understand this process, let's consider the collapsing core in a very massive star. If the core's mass is greater than about 3 M<sub>Sun</sub>, theory says that nothing can stop the core from collapsing forever. We will examine this situation from two perspectives: first from a pre-relativity point of view, and then with the aid of general relativity.</p> <h4 class=\"lt-phys-64811\">Classical Collapse</h4> <p class=\"lt-phys-64811\">Imagine that an astronaut is floating above a 3 M<sub>Sun</sub> core right before it collapses, depicted on the left side of Figure \\(\\PageIndex{1}\\). Recall that the pull of gravity depends on both the mass that is pulling you and your distance from the center of gravity of that mass. If the star is compressed, its mass will remain the same, but the distance between a point on the star's surface and the center will get smaller and smaller. Thus, as we compress the star, the pull of gravity for an object on the surface will get stronger and stronger.</p> <p class=\"lt-phys-64811\">In the center panel of Figure \\(\\PageIndex{1}\\) the shrinking star is the diameter of a neutron star, about 20 kilometers. Now, the velocity required to escape its gravitational pull will be about half the speed of light. The star continues to shrink to a smaller and smaller diameter. This can't happen in the real world because of electron degeneracy, the mutual repulsion between tightly packed electrons. For now, let's ignore physics and continue the star's collapse. As the star shrinks, the escape velocity near the surface would exceed the speed of light. An object with such a large escape velocity emits no light, and anything that falls into it can never return. Near the surface of the object, the change in gravity with distance from the star is so large that the pull on the astronauts feet is stronger than the pull on their head. This means that the astronaut in the right panel of \\(\\PageIndex{1}\\) starts stretching, putting them in serious danger.</p> <figure><img alt=\"Astronaut above a collapsing star that becomes a black hole. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45891/721c585dbbff7dae3f6c6a3b59037e8f4c613be0\" /> <figcaption>Figure \\(\\PageIndex{1}\\) : Classical Collapse. As a massive star's core collapses into an ever-smaller volume, its surface gravity increases until the escape velocity exceeds the speed of light, forming the event horizon of a black hole. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>) <a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.1.1_Classical_Collapse\" target=\"_blank\" title=\"14.6: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64811\">In modern terminology, we call an object from which light cannot escape a <a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.05:_Key_Terms#black+hole\" target=\"_blank\" title=\"14.5: Key Terms\">black hole</a>, a name popularized by John Wheeler starting in the late 1960s. The black in black hole comes from the fact that light can't escape, so these objects appear dark. The idea that such objects might exist is, however, not a new one. Amateur astronomer John Michell wrote a paper in 1783 about the possibility that stars with escape velocities exceeding that of light might exist. In 1796, the French mathematician Pierre-Simon Laplace made similar calculations using Newton's theory of gravity and called the resulting objects dark bodies.</p> <p class=\"lt-phys-64811\">The assumption for these theories to work is that gravity can affect light in the same way that it affects matter. After many years of trying and failing to measure the effect of gravity on light, astronomers were able to use general relativity to give an adequate description of how black holes trap light.</p> <h4 class=\"lt-phys-64811\">Collapse with Relativity</h4> <p class=\"lt-phys-64811\">General relativity tells us that gravity is really a curvature of spacetime. As gravity increases, the curvature gets larger and larger. Light always travels in a straight line, except when it passes through a material that bends its path. If light travels through curved spacetime, then it follows the curved path. From far away, it appears that the path of the light is curving, but from the perspective of the light it is traveling in a straight line.</p> <p class=\"lt-phys-64811\">Let's imagine that a person could safely stand on the surface of a star. In Diagram (a) of Figure \\(\\PageIndex{2}\\), that person holds a flashlight pointing straight up. The light leaving the flashlight travels in straight lines away from the flashlight. Now, compress the mass of the star down to a diameter of about 6 kilometers. In Diagram (b) of Figure \\(\\PageIndex{2}\\), only light beams sent out perpendicular to the surface can escape, and all other light is bent back towards the star. If the star could then shrink just a little more, even that one remaining light beam would no longer be able to escape.</p> <figure><img alt=\"Light paths near a normal star versus a collapsed star. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45890/b8576069c5560e2dfcccf28b187a7a0817c7e289\" /> <figcaption>Figure \\(\\PageIndex{2}\\) : Curved Spacetime. Near an object with extreme density, such as a collapsed star only a few kilometers across, Diagram (b), spacetime curves so strongly that most light paths bend back toward the surface instead of escaping, Diagram (a). (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>) <a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.1.2_Curved_Spacetime\" target=\"_blank\" title=\"14.6: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64811\">Keep in mind that gravity is not pulling on the light. The concentration of matter in the star has curved spacetime, and light is traveling in a straight line, yet is now confronted with a world in which straight lines that used to go outward have become curved paths that lead back in. The collapsing star is a black hole, trapped in its own little pocket of spacetime, from which there is no escape.</p> <p class=\"lt-phys-64811\">The diameter of a collapsing star core is very important in defining a black hole. The event horizon is the exact size that the collapsing star reaches when no light can escape. Just as objects that sink below our horizon cannot be seen on Earth, so anything happening inside the event horizon can no longer interact with the rest of the universe.</p> <p class=\"lt-phys-64811\">The event horizon is the boundary of the black hole. Calculations show that it does not get smaller once the whole star has collapsed inside it. It is the region that separates the things trapped inside it from the rest of the universe. Anything entering from the outside is also trapped once it comes inside the event horizon. The characteristics of an event horizon were first worked out by astronomer and mathematician Karl Schwarzschild. The radius of the event horizon is called the Schwarzschild radius. The horizon's size turns out to depend only on the mass inside it. If the Sun, with its mass of 1 M<sub>Sun</sub>, were to become a black hole, the Schwarzschild radius would be about 3 kilometers. Feed the black hole some mass, and the horizon will grow by a small amount. Doubling the mass will make the black hole 6 kilometers in radius, still very tiny on the cosmic scale.</p> <p class=\"lt-phys-64811\">The event horizons of more massive black holes have larger radii. For example, if a globular cluster of 100,000 stars could collapse to a black hole, it would be 300,000 kilometers in radius, a little less than half the radius of the Sun. If the entire Galaxy could collapse to a black hole, it would be only about 10<sup>12</sup> kilometers in radius, about a tenth of a light year. Smaller masses have correspondingly smaller horizons: for Earth to become a black hole, it would have to be compressed to a radius of only 1 centimeter. A typical asteroid, if crushed to a small enough size to be a black hole, would have the dimensions of an atomic nucleus.</p> <h3 class=\"lt-phys-64811\">Black Hole Effects on Neighbors</h3> <p class=\"lt-phys-64811\">Much of the modern folklore about black holes is misleading. One idea you may have heard is that black holes go about sucking things up with their gravity. Actually, it is only very close to a black hole that the strange effects we have been discussing come into play. The gravitational attraction far away from a black hole is the same as a normal star.</p> <p class=\"lt-phys-64811\">Remember that the gravity of any star some distance away acts as if all its mass were concentrated at a point in the center, which we call the center of gravity. For real stars, we merely imagine that all mass is concentrated there. For black holes, all the mass really is concentrated at a point in the center.</p> <p class=\"lt-phys-64811\">So, if you are a star or distant planet orbiting around a star that becomes a black hole, your orbit may not be significantly affected by the collapse of the star. If, on the other hand, you venture close to the event horizon, it would be very hard for you to resist the pull of the warped spacetime near the black hole. You have to get very close to the black hole to experience any significant effect. If another star or a spaceship were to pass one or two solar radii from a black hole, Newton's laws would be adequate to describe what would happen to it. Only very near the event horizon of a black hole is the gravitation so strong that Newton's laws break down.</p> <h3>Effects on Time and Space</h3> <p>In the description of core collapse with general relativity, we discussed how light follows the bent path of space to loop back toward a collapsing star. Remember that in relativity, time and space are not separate things, they are combined into one concept called spacetime. Therefore if, high concentrations of matter bend space, they are also affecting time.</p> <h3 class=\"lt-phys-64811\">Time Dilation</h3> <p class=\"lt-phys-64811\">General relativity suggests that time travel may be possible, in theory. Specifically, we could use gravity to travel into the future. First, imagine a place where gravity is very strong, such as near a black hole. General relativity predicts that the stronger the gravity, the slower the pace of time will pass as seen by a distant observer. So, imagine a future astronaut, with a fast and strongly built spaceship, who volunteers to go on a mission to such a high-gravity environment. The astronaut leaves in the year 2222, just after graduating from college at age 22. She takes exactly 10 years to get to the black hole. Once there, at age 32, she orbits some distance from it, taking care not to get pulled in.</p> <p class=\"lt-phys-64811\">She is now in a high-gravity realm where time passes much more slowly than it does on Earth. This isn't an effect on the mechanism of her clocks. Time itself is running slowly. That means that every way she has of measuring time will give the same slowed-down reading when compared to time passing on Earth. Her heart will beat more slowly, her hair will grow more slowly, compared to the passage of time on Earth. She is not aware of this slowing down because all her readings of time, are measuring the same, slower, time. She perceives time passing normally. Meanwhile, back on Earth, time passes as it always does.</p> <p class=\"lt-phys-64811\">Our astronaut now emerges from the region of the black hole, her mission of exploration finished, and returns to Earth. Before leaving, she carefully notes that, according to her timepieces, she spent about 2 weeks around the black hole. She then takes exactly 10 years to return to Earth. Her calculations tell her that since she was 22 when she left the Earth, she is now 42 plus 2 weeks when she returns. Because time slowed down near the black hole, much less time passed for her than for the people on Earth. While her clocks measured 2 weeks spent near the black hole, more than 2000 weeks passed on Earth. That's equal to 40 years, so when she arrives at Earth, the year is actually 2282. To her, she will have arrived in the future, where everyone she knew when she left will have aged 40 more years than she has.</p> <p class=\"lt-phys-64811\">In reality, this scenario has several practical challenges. With our current technology, we do not have a spaceship that can travel to a black hole within 10 years. Also, we don't think any spaceship or human can survive close enough to a black hole to make time expand to that degree. The key point is that time passes more slowly near massive objects.</p> <h3 class=\"lt-phys-64811\">A Trip into a Black Hole</h3> <p class=\"lt-phys-64811\">The fact that scientists cannot see inside black holes has not kept them from trying to calculate what they are like. One of the first things these calculations showed was that the formation of a black hole destroys nearly all information about the star that collapsed to form it, because all of the information about the object is trapped inside the event horizon. The only information a black hole can reveal about itself is its mass, its spin, and whether it has any electrical charge.</p> <p class=\"lt-phys-64811\">What happens to the collapsing star core that made the black hole? Our best calculations predict that the material will continue to collapse under its own weight, forming an infinitely compressed point, a place of zero volume and infinite density, which we call a <strong><a href=\"/Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.05:_Key_Terms#singularity\" target=\"_blank\" title=\"singularity\">singularity</a></strong>. At the singularity, spacetime ceases to exist. The laws of physics as we know them break down. We do not yet have the physical understanding or the mathematical tools to describe the singularity itself, or even if singularities actually occur. From the outside, however, the entire structure of a black hole that is not rotating can be described as a singularity surrounded by an event horizon.</p> <p class=\"lt-phys-64811\">Scientists have also calculated what would happen if an astronaut were to fall into a black hole. Observing from a distance, we would see the astronaut fall away from us, moving faster and faster, just as though he were approaching any massive star. However, as he nears the event horizon of the black hole, things change. The strong gravitational field around the black hole will make his clocks run more slowly, when seen from our outside perspective.</p> <p class=\"lt-phys-64811\">If, as he approaches the event horizon, he sends out a signal once per second according to his clock, we will see the spacing between his signals grow longer and longer until it becomes infinitely long when he reaches the event horizon. As the spacing between clock ticks approaches infinity, it will appear to us that the astronaut is slowly coming to a stop, frozen in time at the event horizon.</p> <p class=\"lt-phys-64811\">In the same way, all matter falling into a black hole will also appear to an outside observer to stop at the event horizon, frozen in place and taking an infinite time to fall through it. But don't think that matter falling into a black hole will therefore be easily visible at the event horizon. The tremendous redshift will make it very difficult to observe any light from the material near the black hole. To the astronaut, his time goes at its normal rate and he falls right on through the event horizon into the black hole. Remember, this horizon is not a physical barrier, but only a region in space where the curvature of spacetime makes escape impossible.</p> <p class=\"lt-phys-64811\">The theory of relativity, was given that name because it described how time can pass differently based on the relative locations of observers. The observer in strong gravity measures time and space differently from the one sitting in weaker gravity. This is why we and the astronaut would see him fall into a black hole very differently.</p> <p class=\"lt-phys-64811\">Once inside the event horizon, the astronaut, along with any signals from his radio transmitter, will remain hidden forever from the universe outside. Suppose he is falling feet first. The force of gravity that the singularity exerts on his feet is greater than on his head, so he will be stretched slightly. Because the singularity is a point, the left side of his body will be pulled slightly toward the right, and the right slightly toward the left, bringing each side closer to the singularity. The astronaut will therefore be slightly squeezed in one direction and stretched in the other. Some scientists call this process of stretching and narrowing spaghettification. The point at which the astronaut becomes so stretched that he perishes depends on the size of the black hole. For black holes with masses billions of times the mass of the Sun, such as those found at the centers of galaxies, the spaghettification becomes significant only after the astronaut passes through the event horizon. For black holes with masses of a few solar masses, the astronaut will be stretched and ripped apart even before he reaches the event horizon.</p> <h2 class=\"lt-phys-64811\">Examples and Exercises</h2> <div class=\"box-example\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Example: The Milky Way's Black Hole</span></h5> <p class=\"lt-phys-64811\">The size of the event horizon of a black hole depends on the mass of the black hole. The greater the mass, the larger the radius of the event horizon. General relativity calculations show that the formula for the Schwarzschild radius R<sub>S</sub> of the event horizon is</p> \\[ R_S = \\frac{2GM}{c^2} \\nonumber\\] <p class=\"lt-phys-64811\">where c is the speed of light, G is the gravitational constant, and M is the mass of the black hole. Note that in this formula, 2, G, and c are all constant; only the mass changes from black hole to black hole.</p> <p class=\"lt-phys-64811\">Astronomers have traced the paths of several stars near the center of our Galaxy and found that they seem to be orbiting an unseen object, called Sagittarius A-star, with a mass of about 4 million solar masses. What is the size of its Schwarzschild radius?</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64811\">We can substitute data for G, M, and c directly into the equation:</p> <p class=\"lt-phys-64811\">\\[R_S = \\frac{2GM}{c^2} = \\frac{2(6.67 \\times 10^{-11} \\text{ N·m}^2/\\text{kg}^2)(4 \\times 10^6)(1.99 \\times 10^{30} \\text{ kg})}{(3.00 \\times 10^8 \\text{ m/s})^2} = 1.18 \\times 10^{10} \\text{ m} \\nonumber\\]</p> <p class=\"lt-phys-64811\">This distance is about one-fifth of the radius of Mercury's orbit around the Sun, yet the object contains 4 million solar masses and cannot be seen with our largest telescopes. It is a likely candidate for a black hole.</p> </dd> </dl> </div> <section class=\"box-exercise\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Exercise: Pickup Truck Black Hole</span></h5> <p class=\"lt-phys-64811\">What would be the size of a black hole that contained only as much mass as a typical pickup truck,about 3000 kg? Note that something with so little mass could never actually form a black hole, but it's interesting to think about the result.</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64811\">Substituting the data into our equation gives</p> <p>\\[R_S = \\frac{2GM}{c^2} = \\frac{2(6.67 \\times 10^{-11} \\text{ N·m}^2/\\text{kg}^2)(3000 \\text{ kg})}{(3.00 \\times 10^8 \\text{ m/s})^2} = 4.4 \\times 10^{-24} \\text{ m} \\nonumber\\]</p> <p class=\"lt-phys-64811\">For comparison, the size of a proton is usually considered to be about 8 × 10<sup>−16</sup> m, which would be about ten million times larger.</p> </dd> </dl> </section> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration</span></h5> <ul> <li>Watch <a href=\"https://www.youtube.com/watch?v=dlCRSl3vmHw\" title=\"https://www.youtube.com/watch?v=dlCRSl3vmHw\">What is Spaghettification?</a> with <strong>Neil deGrasse Tyson</strong> for a brief explanation of how extreme gravity near a black hole can stretch matter into a long, thin shape. This video provides a helpful introduction to the concept before moving into more detailed discussion.</li> <li class=\"lt-phys-64811\"><a href=\"https://youtu.be/kOEDG3j1bjs?si=uiUlf9vxe55JytLh\" target=\"_blank\" title=\"Black Holes 101\">Black Holes 101</a> by <strong>National Geographic</strong> introduces the basic science of black holes, including how they form and why their gravity is so strong. This short video works well as an introductory overview before reading more detailed course content. Watch the video here: Black Holes 101 by National Geographic.</li> </ul> </section>"
