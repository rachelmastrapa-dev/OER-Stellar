            - application "Rich Text Editor, editarea" [ref=f6e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f6e336]: "<h2 class=\"lt-phys-64654\">Astronomy around the World</h2> <p class=\"lt-phys-64654\">Ancient Babylonian, Assyrian, and Egyptian astronomers knew the approximate length of the year. The Egyptians of 3000 years ago, for example, adopted a calendar based on a 365-day year. They kept careful track of the rising time of the bright star Sirius in the predawn sky, which has a yearly cycle that corresponded with the flooding of the Nile River. The Chinese also had a working calendar; they determined the length of the year at about the same time as the Egyptians. The Chinese also recorded comets, bright meteors, and dark spots on the Sun. (Many types of astronomical objects were introduced in Science and the Universe: A Brief Tour. If you are not familiar with terms like <em data-effect=\"italics\">comets</em> and <em data-effect=\"italics\">meteors</em>, you may want to review that chapter.) Later, Chinese astronomers kept careful records of “guest stars”—those that are normally too faint to see but suddenly flare up to become visible to the unaided eye for a few weeks or months. We still use some of these records in studying stars that exploded a long time ago.</p> <p class=\"lt-phys-64654\">The Mayan culture in Mexico and Central America developed a sophisticated calendar based on the planet Venus, and they made astronomical observations from sites dedicated to this purpose a thousand years ago. The Polynesians learned to navigate by the stars over hundreds of kilometers of open ocean—a skill that enabled them to colonize new islands far away from where they began.</p> <p class=\"has-noteref lt-phys-64654\">In Britain, before the widespread use of writing, ancient people used stones to keep track of the motions of the Sun and Moon. We still find some of the great stone circles they built for this purpose, dating from as far back as 2800 BCE. The best known of these is Stonehenge, which is discussed in Earth, Moon, and Sky.</p> <h3>Australian Aboriginal Astronomy</h3> <p>Australian Aboriginal astronomy has been passed down orally, through ceremonies, and in their artwork of many kinds. The astronomical systems passed down thus show a depth of understanding of the movement of celestial objects which allowed them to use them as a practical means for creating calendars and for navigating across the continent and waters of Australia. There is a diversity of astronomical traditions in Australia, each with its own particular expression of cosmology. However, there appear to be common themes and systems between the groups. Due to the long history of Australian Aboriginal astronomy, the Aboriginal peoples have been described as \"world's first astronomers\" on several occasions.</p> <p>Many of the constellations were given names based on their shapes, just as traditional western astronomy does, such as the Pleiades, Orion and the Milky Way, with others, such as Emu in the Sky, describes the dark patches rather than the points lit by the stars. Contemporary Indigenous Australian art often references astronomical subjects and their related lore, such as the Seven Sisters.<br /> &nbsp;</p> <h3 class=\"lt-phys-64670\">Early Calendars</h3> <p class=\"lt-phys-64670\">Even the earliest cultures were concerned with the keeping of time and the calendar. Some interesting examples include monuments left by Bronze Age people in northwestern Europe, especially the British Isles. The best preserved of the monuments is Stonehenge, about 13 kilometers from Salisbury in southwest England (Figure 4.12). It is a complex array of stones, ditches, and holes arranged in concentric circles. Carbon dating and other studies show that Stonehenge was built during three periods ranging from about 2800 to 1500 BCE. Some of the stones are aligned with the directions of the Sun and Moon during their risings and settings at critical times of the year (such as the summer and winter solstices), and it is generally believed that at least one function of the monument was connected with the keeping of a calendar.</p> <figure><span data-alt=\"Photograph of the circular stone structure in southwest England known as Stonehenge.\" data-type=\"media\"><img alt=\"Photograph of the circular stone structure in southwest England known as Stonehenge.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45831/45256b1e02626c559d0448d453c9c26529f52edd\" /> </span> <figcaption>Figure 4.12 : Stonehenge. The ancient monument known as Stonehenge was used to keep track of the motions of the Sun and Moon. (credit: modification of work by Adriano Aurelio Araujo)</figcaption> </figure> <p class=\"lt-phys-64670\">The Maya in Central America, who thrived more than a thousand years ago, were also concerned with the keeping of time. Their calendar was as sophisticated as, and perhaps more complex than, contemporary calendars in Europe. The Maya did not attempt to correlate their calendar accurately with the length of the year or lunar month. Rather, their calendar was a system for keeping track of the passage of days and for counting time far into the past or future. Among other purposes, it was useful for predicting astronomical events, such as the position of Venus in the sky (Figure 4.13).</p> <figure><span data-alt=\"Photograph of the Mayan observatory at Chichen Itza in Mexico, one of the few circular structures erected by the Maya.\" data-type=\"media\"><img alt=\"Photograph of the Mayan observatory at Chichen Itza in Mexico, one of the few circular structures erected by the Maya.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45830/560ff89e871f1393be369def54831a0121727be2\" /> </span> <figcaption>Figure 4.13 : El Caracol. This Mayan observatory at Chichen Itza in the Yucatan, Mexico, dates from around the year 1000. (credit: “wiredtourist.com”/Flickr)</figcaption> </figure> <p class=\"lt-phys-64670\">The ancient Chinese developed an especially complex calendar, largely limited to a few privileged hereditary court astronomer-astrologers. In addition to the motions of Earth and the Moon, they were able to fit in the approximately 12-year cycle of Jupiter, which was central to their system of astrology. The Chinese still preserve some aspects of this system in their cycle of 12 “years”—the Year of the Dragon, the Year of the Pig, and so on—that are defined by the position of Jupiter in the zodiac.</p> <p class=\"lt-phys-64670\">Our Western calendar derives from a long history of timekeeping beginning with the Sumerians, dating back to at least the second millennium BCE, and continuing with the Egyptians and the Greeks around the eighth century BCE. These calendars led, eventually, to the <em data-effect=\"italics\">Julian calendar</em>, introduced by Julius Caesar, which approximated the year at 365.25 days, fairly close to the actual value of 365.2422. The Romans achieved this approximation by declaring years to have 365 days each, with the exception of every fourth year. The <em data-effect=\"italics\">leap year</em> was to have one extra day, bringing its length to 366 days, and thus making the average length of the year in the Julian calendar 365.25 days.</p> <p class=\"lt-phys-64670\">In this calendar, the Romans had dropped the almost impossible task of trying to base their calendar on the Moon as well as the Sun, although a vestige of older lunar systems can be seen in the fact that our months have an average length of about 30 days. However, lunar calendars remained in use in other cultures, and Islamic calendars, for example, are still primarily lunar rather than solar.</p> <h3>Chinese Astronomy</h3> <p>Astronomy in China has a long history stretching from the Shang dynasty, being refined over a period of more than 3,000 years. The ancient Chinese people have identified stars from 1300 BCE, as Chinese star names later categorized in the twenty-eight mansions have been found on oracle bones unearthed at Anyang, dating back to the mid-Shang dynasty. The core of the \"mansion\" (宿 xiù) system also took shape around this period, by the time of King Wu Ding (1250–1192 BCE).</p> <p>Detailed records of astronomical observations began during the Warring States period (fourth century BCE). They flourished during the Han period (202 BCE – 220 CE) and subsequent dynasties with the publication of star catalogues. Chinese astronomy was equatorial, centered on close observation of circumpolar stars, and was based on different principles from those in traditional Western astronomy, where heliacal risings and settings of zodiac constellations formed the basic ecliptic framework. Joseph Needham has described the ancient Chinese as the most persistent and accurate observers of celestial phenomena anywhere in the world before the Islamic astronomers.</p> <p>Some elements of Indian astronomy reached China with the expansion of Buddhism after the Eastern Han dynasty (25–220 CE), but most incorporation of Indian astronomical thought occurred during the Tang dynasty (618–907 CE), when numerous Indian astronomers took up residence in the Chinese capital Chang'an, and Chinese scholars, such as the Tantric Buddhist monk and mathematician Yi Xing, mastered the Indian system. Islamic astronomers collaborated closely with their Chinese colleagues during the Yuan dynasty, and, after a period of relative decline during the Ming dynasty, astronomy was revitalized under the stimulus of Western cosmology and technology after the Jesuits established their missions. The telescope was introduced from Europe in the seventeenth century. In 1669, the Peking observatory was completely redesigned and refitted under the direction of Ferdinand Verbiest. Today, China continues to be active in the field of astronomy, with many observatories and its own space program.<br /> &nbsp;</p> <h3 class=\"lt-phys-64654\">Early Greek and Roman Cosmology</h3> <p class=\"lt-phys-64654\">Our concept of the cosmos—its basic structure and origin—is called <span data-type=\"term\" group-by=\"c\">cosmology</span>, a word with Greek roots. Before the invention of telescopes, humans had to depend on the simple evidence of their senses for a picture of the universe. The ancients developed cosmologies that combined their direct view of the heavens with a rich variety of philosophical and religious symbolism.</p> <p class=\"lt-phys-64654\">At least 2000 years before Columbus, educated people in the eastern Mediterranean region knew Earth was round. Belief in a spherical Earth may have stemmed from the time of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Pythagoras</span>, a philosopher and mathematician who lived 2500 years ago. He believed circles and spheres to be “perfect forms” and suggested that Earth should therefore be a sphere. As evidence that the gods liked spheres, the Greeks cited the fact that the Moon is a sphere, using evidence we describe later.</p> <p class=\"lt-phys-64654\">The writings of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Aristotle</span> (384–322 BCE), the tutor of Alexander the Great, summarize many of the ideas of his day. They describe how the progression of the Moon’s phases—its apparent changing shape—results from our seeing different portions of the Moon’s sunlit hemisphere as the month goes by (see Earth, Moon, and Sky). Aristotle also knew that the Sun has to be farther away from Earth than is the Moon because occasionally the Moon passed exactly between Earth and the Sun and hid the Sun temporarily from view. We call this a <em data-effect=\"italics\">solar eclipse</em>.</p> <p class=\"lt-phys-64654\">Aristotle cited convincing arguments that Earth must be round. First is the fact that as the Moon enters or emerges from Earth’s shadow during an eclipse of the Moon, the shape of the shadow seen on the Moon is always round (Figure 2.9). Only a spherical object always produces a round shadow. If Earth were a disk, for example, there would be some occasions when the sunlight would strike it edge-on and its shadow on the Moon would be a line.</p> <figure><span data-alt=\"The Shadow of the Earth During a Lunar Eclipse. In this multiple exposure image of a full Lunar eclipse, the Earth’s shadow begins to cover the full Moon starting at left. Moving to the right, the circular shadow of the Earth gradually covers the Moon. At center, the mid-point of the eclipse is seen. The Moon appears dull red due to sunlight refracting through Earth’s thin atmosphere toward the Moon. In the final stages of the eclipse, the Earth’s shadow gradually leaves the Moon toward the right.\" data-type=\"media\"><img alt=\"The Shadow of the Earth During a Lunar Eclipse. In this multiple exposure image of a full Lunar eclipse, the Earth’s shadow begins to cover the full Moon starting at left. Moving to the right, the circular shadow of the Earth gradually covers the Moon. At center, the mid-point of the eclipse is seen. The Moon appears dull red due to sunlight refracting through Earth’s thin atmosphere toward the Moon. In the final stages of the eclipse, the Earth’s shadow gradually leaves the Moon toward the right.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46177/e0d5230d8494610faebbd4a6fe3cbef017c1ac3b\" /> </span> <figcaption>Figure 2.9 : Earth’s Round Shadow. A lunar eclipse occurs when the Moon moves into and out of Earth’s shadow. Note the curved shape of the shadow—evidence for a spherical Earth that has been recognized since antiquity. (credit: modification of work by Brian Paczkowski)</figcaption> </figure> <p class=\"lt-phys-64654\">As a second argument, Aristotle explained that travelers who go south a significant distance are able to observe stars that are not visible farther north. And the height of the North Star—the star nearest the north celestial pole—decreases as a traveler moves south. On a flat Earth, everyone would see the same stars overhead. The only possible explanation is that the traveler must have moved over a curved surface on Earth, showing stars from a different angle. (See the How Do We Know Earth Is Round? feature for more ideas on proving Earth is round.)</p> <p class=\"lt-phys-64654\">One Greek thinker, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Aristarchus</span> of Samos (310–230 BCE), even suggested that Earth was moving around the Sun, but Aristotle and most of the ancient Greek scholars rejected this idea. One of the reasons for their conclusion was the thought that if Earth moved about the Sun, they would be observing the stars from different places along Earth’s orbit. As Earth moved along, nearby stars should shift their positions in the sky relative to more distant stars. In a similar way, we see foreground objects appear to move against a more distant background whenever we are in motion. When we ride on a train, the trees in the foreground appear to shift their position relative to distant hills as the train rolls by. Unconsciously, we use this phenomenon all of the time to estimate distances around us.</p> <p class=\"lt-phys-64654\">The apparent shift in the direction of an object as a result of the motion of the observer is called <span data-type=\"term\" group-by=\"p\">parallax</span>. We call the shift in the apparent direction of a star due to Earth’s orbital motion <em data-effect=\"italics\">stellar parallax</em>. The Greeks made dedicated efforts to observe stellar parallax, even enlisting the aid of Greek soldiers with the clearest vision, but to no avail. The brighter (and presumably nearer) stars just did not seem to shift as the Greeks observed them in the spring and then again in the fall (when Earth is on the opposite side of the Sun).</p> <p class=\"lt-phys-64654\">This meant either that Earth was not moving or that the stars had to be so tremendously far away that the parallax shift was immeasurably small. A cosmos of such enormous extent required a leap of imagination that most ancient philosophers were not prepared to make, so they retreated to the safety of the Earth-centered view, which would dominate Western thinking for nearly two millennia.</p> <h3 class=\"lt-phys-64654\">Ptolemy’s Model of the Solar System</h3> <p class=\"lt-phys-64654\">The last great astronomer of the Roman era was Claudius <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Ptolemy</span> (or Ptolemaeus), who flourished in Alexandria in about the year 140. He wrote a mammoth compilation of astronomical knowledge, which today is called by its Arabic name, <em data-effect=\"italics\">Almagest</em> (meaning “The Greatest”). <em data-effect=\"italics\">Almagest</em> does not deal exclusively with Ptolemy’s own work; it includes a discussion of the astronomical achievements of the past, principally those of Hipparchus. Today, it is our main source of information about the work of Hipparchus and other Greek astronomers.</p> <p class=\"lt-phys-64654\">Ptolemy’s most important contribution was a geometric representation of the solar system that predicted the positions of the planets for any desired date and time. Hipparchus, not having enough data on hand to solve the problem himself, had instead amassed observational material for posterity to use. Ptolemy supplemented this material with new observations of his own and produced a cosmological model that endured more than a thousand years, until the time of Copernicus.</p> <p class=\"lt-phys-64654\">The complicating factor in explaining the motions of the planets is that their apparent wandering in the sky results from the combination of their own motions with Earth’s orbital revolution. As we watch the planets from our vantage point on the moving Earth, it is a little like watching a car race while you are competing in it. Sometimes opponents’ cars pass you, but at other times you pass them, making them appear to move backward for a while with respect to you.</p> <p class=\"lt-phys-64654\">Figure 2.13 shows the motion of Earth and a planet farther from the Sun—in this case, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Mars</span>. Earth travels around the Sun in the same direction as the other planet and in nearly the same plane, but its orbital speed is faster. As a result, it overtakes the planet periodically, like a faster race car on the inside track. The figure shows where we see the planet in the sky at different times. The path of the planet among the stars is illustrated in the star field on the right side of the figure.</p> <figure><span data-alt=\"Retrograde Motion of an Outer Planet. This diagram has two parts. The portion at right illustrates the apparent motion of Mars projected against the fixed background stars. The portion at left shows the Sun surrounded by two blue circles. The innermost circle represents the orbit of the Earth, the outermost the orbit of Mars. The Earth is shown as a blue dot in 5 positions, labeled A through E, along its orbit. Likewise, Mars is shown as a yellow dot in 5 positions, labeled A through E, along its orbit. Since the Earth travels faster than Mars, the 5 points for Earth are spread evenly around the circle of its orbit. As Mars moves more slowly, its 5 dots are all plotted close together on the right-hand side of its orbit. Beginning with Earth at point A on the lower left side of Earth’s orbit, an arrow connects with Mars at its point A at the lower right side of its orbit. This arrow continues and connects with Mars at point A near the bottom of its projected path of motion in the illustration at right. As Earth moves counter-clockwise along its orbit, it travels to point B at lower right, and Mars moves slightly upward on its orbit to its point B. An arrow points from Earth through Mars and continues on to connect with Mars at the third point B, which is above center on the projected path of motion. Thus, Mars has moved upward as seen from Earth in this figure. Earth then moves to point C at center-right on its orbit as does Mars. An arrow connects Earth through Mars to point C at the center of the projected path of motion. Mars has moved slightly downward as seen from Earth. Earth moves to point D at the upper right of its orbit and Mars moves upward to its point D. An arrow connects Earth through Mars and on to point D, which is below center on the projected path of motion. Mars has moved downward as seen from Earth. Finally, Earth moves to point E at the upper left of its orbit and Mars moves upward to its point E. An arrow connects Earth through Mars and on to point E near the top of its projected path of motion. Mars has moved upward as seen from Earth. In total, Mars has made a sideways “Z” shape in the sky as seen from Earth in this illustration.\" data-type=\"media\"><img alt=\"Retrograde Motion of an Outer Planet. This diagram has two parts. The portion at right illustrates the apparent motion of Mars projected against the fixed background stars. The portion at left shows the Sun surrounded by two blue circles. The innermost circle represents the orbit of the Earth, the outermost the orbit of Mars. The Earth is shown as a blue dot in 5 positions, labeled A through E, along its orbit. Likewise, Mars is shown as a yellow dot in 5 positions, labeled A through E, along its orbit. Since the Earth travels faster than Mars, the 5 points for Earth are spread evenly around the circle of its orbit. As Mars moves more slowly, its 5 dots are all plotted close together on the right-hand side of its orbit. Beginning with Earth at point A on the lower left side of Earth’s orbit, an arrow connects with Mars at its point A at the lower right side of its orbit. This arrow continues and connects with Mars at point A near the bottom of its projected path of motion in the illustration at right. As Earth moves counter-clockwise along its orbit, it travels to point B at lower right, and Mars moves slightly upward on its orbit to its point B. An arrow points from Earth through Mars and continues on to connect with Mars at the third point B, which is above center on the projected path of motion. Thus, Mars has moved upward as seen from Earth in this figure. Earth then moves to point C at center-right on its orbit as does Mars. An arrow connects Earth through Mars to point C at the center of the projected path of motion. Mars has moved slightly downward as seen from Earth. Earth moves to point D at the upper right of its orbit and Mars moves upward to its point D. An arrow connects Earth through Mars and on to point D, which is below center on the projected path of motion. Mars has moved downward as seen from Earth. Finally, Earth moves to point E at the upper left of its orbit and Mars moves upward to its point E. An arrow connects Earth through Mars and on to point E near the top of its projected path of motion. Mars has moved upward as seen from Earth. In total, Mars has made a sideways “Z” shape in the sky as seen from Earth in this illustration.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46179/b2ca3196684529dfa89e62e5f5955ebcc90970f0\" /> </span> <figcaption>Figure 2.13 : Retrograde Motion of a Planet beyond Earth’s Orbit. The letters on the diagram show where Earth and Mars are at different times. By following the lines from each Earth position through each corresponding Mars position, you can see how the retrograde path of Mars looks against the background stars.</figcaption> </figure> <p class=\"lt-phys-64654\">Normally, planets move eastward in the sky over the weeks and months as they orbit the Sun, but from positions B to D in Figure 2.13, as Earth passes the planets in our example, it appears to drift backward, moving west in the sky. Even though it is actually moving to the east, the faster-moving Earth has overtaken it and seems, from our perspective, to be leaving it behind. As Earth rounds its orbit toward position E, the planet again takes up its apparent eastward motion in the sky. The temporary apparent westward motion of a planet as Earth swings between it and the Sun is called <span data-type=\"term\" group-by=\"r\">retrograde motion</span>. Such backward motion is much easier for us to understand today, now that we know Earth is one of the moving planets and not the unmoving center of all creation. But Ptolemy was faced with the far more complex problem of explaining such motion while assuming a stationary Earth.</p> <p class=\"lt-phys-64654\">Furthermore, because the Greeks believed that celestial motions had to be circles, Ptolemy had to construct his model using circles alone. To do it, he needed dozens of circles, some moving around other circles, in a complex structure that makes a modern viewer dizzy. But we must not let our modern judgment cloud our admiration for Ptolemy’s achievement. In his day, a complex universe centered on Earth was perfectly reasonable and, in its own way, quite beautiful. However, as Alfonso X, the King of Castile, was reported to have said after having the Ptolemaic system of planet motions explained to him, “If the Lord Almighty had consulted me before embarking upon Creation, I should have recommended something simpler.”</p> <p class=\"lt-phys-64654\">Ptolemy solved the problem of explaining the observed motions of planets by having each planet revolve in a small orbit called an <span data-type=\"term\" group-by=\"e\">epicycle</span>. The center of the epicycle then revolved about Earth on a circle called a <em data-effect=\"italics\">deferent</em> (Figure 2.14). When the planet is at position <em data-effect=\"italics\">x</em> in Figure 2.14 on the epicycle orbit, it is moving in the same direction as the center of the epicycle; from Earth, the planet appears to be moving eastward. When the planet is at <em data-effect=\"italics\">y</em>, however, its motion is in the direction opposite to the motion of the epicycle’s center around Earth. By choosing the right combination of speeds and distances, Ptolemy succeeded in having the planet moving westward at the correct speed and for the correct interval of time, thus replicating retrograde motion with his model.</p> <figure><span data-alt=\"Ptolemy’s epicycles. A yellow dot labeled “Center” lies at the center of a blue circle which represents the orbit of a planet as seen from Earth. The large blue circle is labeled “Deferent” and has an arrowhead pointing counterclockwise. The Earth is drawn as a blue dot just to the left of center. To the right of center is a yellow dot labeled “Equant point”. An arrow labeled “y” is drawn from the equant to a point on the deferent, where a small arrow is then drawn pointing to another yellow dot. This yellow dot is the planet being observed. Centered on the point where the arrow from the equant meets the deferent, a circular arrow is drawn counterclockwise and is labeled “Epicycle”. The yellow dot of the planet lies on the epicycle.\" data-type=\"media\"><img alt=\"Ptolemy’s epicycles. A yellow dot labeled “Center” lies at the center of a blue circle which represents the orbit of a planet as seen from Earth. The large blue circle is labeled “Deferent” and has an arrowhead pointing counterclockwise. The Earth is drawn as a blue dot just to the left of center. To the right of center is a yellow dot labeled “Equant point”. An arrow labeled “y” is drawn from the equant to a point on the deferent, where a small arrow is then drawn pointing to another yellow dot. This yellow dot is the planet being observed. Centered on the point where the arrow from the equant meets the deferent, a circular arrow is drawn counterclockwise and is labeled “Epicycle”. The yellow dot of the planet lies on the epicycle.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46182/de529f804ba7c4d127c6d2cb1dbc5a8d4732b610\" /> </span> <figcaption>Figure 2.14 : Ptolemy’s Complicated Cosmological System. Each planet orbits around a small circle called an <em data-effect=\"italics\">epicycle</em>. Each epicycle orbits on a larger circle called the <em data-effect=\"italics\">deferent</em>. This system is not centered exactly on Earth but on an offset point called the <em data-effect=\"italics\">equant</em>. The Greeks needed all this complexity to explain the actual motions in the sky because they believed that Earth was stationary and that all sky motions had to be circular.</figcaption> </figure> <p class=\"lt-phys-64654\">However, we shall see in Orbits and Gravity that the planets, like Earth, travel about the Sun in orbits that are ellipses, not circles. Their actual behavior cannot be represented accurately by a scheme of uniform circular motions. In order to match the observed motions of the planets, Ptolemy had to center the deferent circles, not on Earth, but at points some distance from Earth. In addition, he introduced uniform circular motion around yet another axis, called the <em data-effect=\"italics\">equant point</em>. All of these considerably complicated his scheme.</p> <p class=\"lt-phys-64654\">It is a tribute to the genius of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Ptolemy</span> as a mathematician that he was able to develop such a complex system to account successfully for the observations of planets. It may be that Ptolemy did not intend for his cosmological model to describe reality, but merely to serve as a mathematical representation that allowed him to predict the positions of the planets at any time. Whatever his thinking, his model, with some modifications, was eventually accepted as authoritative in the Muslim world and (later) in Christian Europe.</p> <h3>Medieval Astronomy in the Middle East</h3> <p>Medieval Islamic astronomy comprises the astronomical developments made in the Islamic world, particularly during the Islamic Golden Age (9th–13th centuries), and mostly written in the Arabic language. These developments mostly took place in the Middle East, Central Asia, Al-Andalus, and North Africa, and later in the Far East and India. It closely parallels the genesis of other Islamic sciences in its assimilation of foreign material and the amalgamation of the disparate elements of that material to create a science with Islamic characteristics. These included Greek, Sassanid, and Indian works in particular, which were translated and built upon.</p> <p>Islamic astronomy played a significant role in the revival of ancient astronomy following the loss of knowledge during the early medieval period, notably with the production of Latin translations of Arabic works during the 12th century.</p> <p>A significant number of stars in the sky, such as Aldebaran, Altair and Deneb, and astronomical terms such as alidade, azimuth, and nadir, are still referred to by their Arabic names. A large corpus of literature from Islamic astronomy remains today, numbering approximately 10,000 manuscripts scattered throughout the world, many of which have not been read or catalogued. Even so, a reasonably accurate picture of Islamic activity in the field of astronomy can be reconstructed.</p> <p>&nbsp;</p> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64654\"><span class=\"lt-icon-default\">Further Exploration</span></h5> <ul> <li class=\"lt-phys-64654\">The <a href=\"https://openstax.org/l/30planetconfig\" rel=\"noopener nofollow\" target=\"_blank\">planetary configurations simulator from Foothill AstroSims</a> allows you to see the usual prograde and occasional retrograde motion of other planets. You can switch back and forth between viewing motion from Earth and Mars (as well as other planets).</li> <li class=\"lt-phys-64654\">Use the <a href=\"https://openstax.org/l/30ptolemaic\" rel=\"noopener nofollow\" target=\"_blank\">Ptolemaic System simulator from Foothill AstroSims</a> to explore how Ptolemy's system of deferents and epicycles explained the apparent motion of the planets.</li> <li>resources providing more <a href=\"https://astrosociety.org/file_download/inline/eb3601be-8e70-4f11-8e12-3c8c5b52e66a\" title=\"https://astrosociety.org/file_download/inline/eb3601be-8e70-4f11-8e12-3c8c5b52e66a\">information about the astronomy of diverse cultures</a> around the world</li> </ul> </div> <h2>Attributions&nbsp;</h2> <p><a href=\"https://en.wikipedia.org/wiki/Australian_Aboriginal_astronomy\" title=\"https://en.wikipedia.org/wiki/Australian_Aboriginal_astronomy\">Australian Aboriginal Astronomy</a></p> <p><a href=\"https://en.wikipedia.org/wiki/Chinese_astronomy\" title=\"https://en.wikipedia.org/wiki/Chinese_astronomy\">Chinese Astronomy</a>&nbsp;</p> <p><a href=\"https://en.wikipedia.org/wiki/Astronomy_in_the_medieval_Islamic_world\" title=\"https://en.wikipedia.org/wiki/Astronomy_in_the_medieval_Islamic_world\">Medieval Middle Eastern Astronomy</a></p>"
