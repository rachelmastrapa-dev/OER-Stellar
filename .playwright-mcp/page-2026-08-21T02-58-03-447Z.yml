            - application "Rich Text Editor, editarea" [ref=f535e329]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f535e343]: "<h2 class=\"lt-phys-66857\">How to Make a Universe</h2> <p class=\"lt-phys-66857\">The existence of such large filaments of galaxies and voids is an interesting puzzle because we have evidence that the universe was extremely smooth even a few hundred thousand years after forming. The challenge for theoreticians is to understand how a nearly featureless universe changed into the complex and lumpy one that we see today. Armed with our observations and current understanding of galaxy evolution over cosmic time, dark matter, and large-scale structure, we are now prepared to try to answer that question on some of the largest possible scales in the universe. As we will see, the short answer to how the universe got this way is dark matter + gravity + time.</p> <h3 class=\"lt-phys-66857\">How Galaxies Form and Grow</h3> <p class=\"lt-phys-66857\">Galaxies were more numerous, but smaller, bluer, and clumpier, in the distant past than they are today. Also, galaxy mergers play a significant role in their evolution. At the same time, we have observed quasars and galaxies that emitted their light when the universe was less than a billion years old, so we know that large structure made of matter had begun to form at least that early. We also saw that many quasars are found in the centers of elliptical galaxies. This means that some of the first large concentrations of matter must have evolved into the elliptical galaxies that we see in today's universe. It seems likely that the supermassive black holes in the centers of galaxies and the spherical distribution of ordinary matter around them formed at the same time and through related physical processes. Another discovery is that the more massive a galaxy is, the more massive its central black hole is. Somehow, the black hole and the galaxy match their growth rates.</p> <p class=\"lt-phys-66857\">For all of these observations, astronomers must create a model that explains all of them at the same time. The two main types of galaxy formation models: top-down and bottom-up. In the top-down model, massive elliptical galaxies formed in a single, rapid collapse of gas and dark matter, during which virtually all the gas was turned quickly into stars. Afterward the galaxies changed only slowly as the stars evolved. In the bottom-up model, modern giant ellipticals were formed mostly through mergers of smaller galaxies that had already converted at least some of their gas into stars. In other words, astronomers have debated whether giant ellipticals formed most of their stars in the large galaxy that we see today or in separate small galaxies that subsequently merged.</p> <p class=\"lt-phys-66857\">Since we see some luminous quasars from when the universe was less than a billion years old, it is likely that at least some giant ellipticals began their evolution very early through the collapse of a single cloud. However, the best evidence also seems to show that mature giant elliptical galaxies like the ones we see nearby were rare before the universe was about 6 billion years old and that they are much more common today than they were when the universe was young. Observations also indicate that most of the gas in elliptical galaxies was converted to stars by the time the universe was about 3 billion years old, so it appears that elliptical galaxies have not formed many new stars since then. They mostly contain old, cool, red stars, and there is little or no new star formation going on. These observations suggest that the giant elliptical galaxies that we see nearby formed from a combination of both top-down and bottom-up mechanisms, with the most massive galaxies forming in the densest clusters where both processes happened very early and quickly in the history of the universe.</p> <p class=\"lt-phys-66857\">Spiral galaxy formation is a two step process starting with the formation of the bulge, and then the formation of the disk. Figure \\(\\PageIndex{1}\\) is a diagram of two possible formation models for the nuclear bulge. spiral galaxies. In the top row, the nuclear bulge of the spiral galaxy formed through the collapse of a single protogalactic cloud. That cloud collapses under gravity and eventually forms a spiral structure with a large nuclear bulge. In the bottom row, a spiral galaxies grows over time through mergers with other, smaller galaxies. The spiral galaxy has already formed its spiral structure. Over time, smaller galaxies are absorbed into its nuclear bulge, making it larger. The disks of spiral galaxies formed later than the bulge and still contain gas and dust. For example, the stars in the disk of the Milky Way are younger than the stars in the bulge and the halo. However, the rate of star formation in spirals today is about ten times lower than it was 8 billion years ago. The number of stars being formed drops as the gas is used up. So spirals seem to form mostly bottom up but over a longer time than ellipticals and in a more complex way, with at least two distinct phases.</p> <figure><img alt=\"Diagram of two ways spiral galaxy bulges form: cloud collapse or galaxy mergers. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45988/3806ffdaa1f227c498e75a21132a039787820262\" /> <figcaption>Figure \\(\\PageIndex{1}\\) : Growth of Spiral Bulges. This diagram shows two pathways for the growth of spiral galaxy bulges: rapid collapse of a single primordial gas cloud, and gradual growth through mergers with smaller companion galaxies. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>) <a href=\"/Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.08:_Accessible_Descriptions#Figure_17.5.1_Growth_of_Spiral_Bulges\" target=\"_blank\" title=\"17.8: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-66857\">Despite these advances in our understanding of how galaxies form and evolve, many questions remain. For example, it's possible that spiral galaxies could lose their spiral arms and disks in a merger event, making them look more like an elliptical or irregular galaxy, and then regain the disk and arms again later if enough gas remains available. The story of how galaxies assume their final shapes is still being written as we learn more about galaxies and their environment.</p> <h3 class=\"lt-phys-66857\">Forming Galactic Structures</h3> <p class=\"lt-phys-66857\">If individual galaxies seem to grow mostly by assembling smaller pieces together gravitationally over cosmic time, what about the clusters of galaxies? How do we explain the large-scale maps that show galaxies distributed on the walls of huge sponge- or bubble-like structures spanning hundreds of millions of light-years? Observations have found increasing evidence for concentrations, filaments, clusters, and superclusters of galaxies when the universe was less than 3 billion years old. This means that large concentrations of galaxies had already come together when the universe was less than a quarter as old as it is now.</p> <p class=\"lt-phys-66857\">Almost all the currently favored models of how large-scale structure formed in the universe tell a story similar to that for individual galaxies: tiny dark matter seeds in the hot cosmic soup after the Big Bang grew by gravity into larger and larger structures as cosmic time ticked on. Figure \\(\\PageIndex{2}\\) is a diagram of the formation of large galactic structures. It starts with a relatively smooth distribution of dark matter and gas, with few galaxies formed in the first 2 billion years after the Big Bang. Over time, small concentrations of matter appear and begin to grow along a filamentary structure, leaving empty spaces between them. Eventually, it forms into the very clumpy strings of galaxies with large voids that are present today. As astronomer collect more data, the model will be refined. The final models we construct will need to be able to explain the size, shape, age, number, and spatial distribution of galaxies, clusters, and filaments over the age of the universe. Astronomers are working hard to measure and then to model those features of large-scale structure as accurately as possible. So far, a mixture of 5% normal atoms, 27% cold dark matter, and 68% dark energy seems to be the best way to explain all the evidence currently available.</p> <figure><img alt=\"Simulation sequence showing large-scale cosmic structure evolving from the Big Bang to today. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45990/8e663fd7ed7f4f8ae88f78e630505eeccdc64dfe\" /> <figcaption>Figure \\(\\PageIndex{2}\\) : Formation of Large-Scale Structure. This sequence of simulated cubes traces the growth of large-scale cosmic structure, from a smooth distribution of dark matter and gas shortly after the Big Bang to the clumpy, filamentary network of galaxies seen in the universe today. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>) <a href=\"/Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.08:_Accessible_Descriptions#Figure_17.5.2_Formation_of_Large-Scale_Structure\" target=\"_blank\" title=\"17.8: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-66857\">Scientists have a model to explain how a nearly uniform, hot soup of particles and energy at the beginning of time acquired the filament and void structure that we now see on the largest scales. When the universe was only a few hundred thousand years old, everything was at a temperature of a few thousand degrees. Theorists suggest that at that early time, all the hot gas was vibrating, much as sound waves vibrate the air in a large concert hall. This vibrating could have concentrated matter into high-density peaks and created emptier spaces between them. When the universe cooled, the concentrations of matter were frozen in, and galaxies ultimately formed from the matter in these high-density regions.</p> <h3 class=\"lt-phys-66857\">The Story of the Universe</h3> <p class=\"lt-phys-66857\">To finish this chapter, let's put all these ideas together to tell a coherent story of how the universe came to look the way it does. Initially, as we said, the distribution of matter, both luminous and dark, was nearly, but not quite exactly, smooth and uniform. Here and there were lumps where the density of matter was ever so slightly higher than average. Initially, each individual lump expanded because the whole universe was expanding. However, as the universe continued to expand, the regions of higher density acquired still more mass because they exerted a slightly larger than average gravitational force on surrounding material. If the inward pull of gravity was high enough, the denser individual regions ultimately stopped expanding. They then began to collapse into irregularly shaped blobs. In many regions the collapse was more rapid in one direction, so the concentrations of matter were not spherical but came to resemble giant clumps, pancakes, and rope-like filaments, each much larger than individual galaxies. These elongated clumps existed throughout the early universe, oriented in different directions and collapsing at different rates. The clumps provided the framework for the large-scale filamentary and void structures that we see preserved in the universe today.</p> <p class=\"lt-phys-66857\">The universe then proceeded to build itself from the bottom up. Within the clumps, smaller structures formed first, then merged to build larger ones. The first dense concentrations of matter that collapsed were the size of small dwarf galaxies or globular clusters. This explains why globular clusters are the oldest things in the Milky Way and most other galaxies. These fragments then gradually assembled to build galaxies, galaxy clusters, and, ultimately, superclusters of galaxies. According to this picture, small galaxies and large star clusters first formed in the filaments and nodes where the pancakes intersect when the universe was about two percent of its current age. Some stars may have formed even before the first star clusters and galaxies came into existence. Some galaxy-galaxy collisions triggered massive bursts of star formation, and some of these led to the formation of black holes. In that rich, crowded environment, black holes had plenty of material to absorb and grew in mass. The development of massive black holes then triggered quasars and other active galactic nuclei whose powerful outflows of energy and matter shut off the star formation in their host galaxies.</p> <p class=\"lt-phys-66857\">Clusters of galaxies then formed as individual galaxies congregated, drawn together by their mutual gravitational attraction. Small clouds formed first when separate regions of gas collapsed under gravity. Each of these clouds formed a galaxy. The gravities are then drawn together to form groups, much like our own Local Group. Then the groups began combining to form clusters and, eventually, superclusters. This model predicts that clusters and superclusters should still be in the process of gathering together, and observations suggest that clusters are still gathering up more galaxies and collecting more gas as it flows in along filaments. In some instances we even see entire clusters of galaxies merging together.</p> <p class=\"lt-phys-66857\">Most giant elliptical galaxies formed through the collision and merger of many smaller fragments. Some spiral galaxies may have formed in relatively isolated regions from a single cloud of gas that collapsed to make a flattened disk, but others acquired additional stars, gas, and dark matter through collisions, and the stars acquired through these collisions now populate their halos and bulges. As we have seen, our Milky Way is still capturing small galaxies and adding them to its halo, and probably also pulling fresh gas from these galaxies into its disk.</p>"
