            - application "Rich Text Editor, editarea" [ref=f564e316]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f564e330]: "<h3 class=\"lt-phys-64679\">The Bohr Atom</h3> <p class=\"lt-phys-64679\">Rutherford’s model for atoms has one serious problem. Maxwell’s theory of electromagnetic radiation says that when electrons change either speed or the direction of motion, they must emit energy. Orbiting electrons constantly change their direction of motion, so they should emit a constant stream of energy. Applying Maxwell’s theory to Rutherford’s model, all electrons should spiral into the nucleus of the atom as they lose energy, and this collapse should happen very quickly—in about 10<sup>–16</sup> seconds.</p> <p class=\"lt-phys-64679\">It was Danish physicist Niels <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bohr</span> (1885–1962) who solved the mystery of how electrons remain in orbit. He was trying to develop a model of the atom that would also explain certain regularities observed in the spectrum of hydrogen. He suggested that the spectrum of hydrogen can be understood if we assume that orbits of only certain sizes are possible for the electron. Bohr further assumed that as long as the electron moves in only one of these allowed orbits, it radiates no energy: its energy would change only if it moved from one orbit to another.</p> <figure><span data-alt=\"Image A is of Niels Bohr. Image B is of Max Planck.\" data-type=\"media\"><img alt=\"Image A is of Niels Bohr. Image B is of Max Planck.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46130/1f461dab89a84652254bebfbfa792ef5d5e56c05\" /> </span> <figcaption>Figure <span class=\"mt-bgcolor-e74c3c\">XX</span> : Niels Bohr (1885–1962) and Max Planck (1858–1947). (a) Bohr, shown at his desk in this 1935 photograph, and (b) Planck helped us understand the energy behavior of photons. (<span class=\"mt-bgcolor-e74c3c\">Openstax</span>)</figcaption> </figure> <p>&nbsp;</p> <p>&nbsp;</p>"
