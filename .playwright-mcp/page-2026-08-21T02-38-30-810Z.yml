            - list [ref=f425e102]:
              - listitem [ref=f425e103]: Describe the event horizon surrounding a black hole
              - listitem [ref=f425e104]: Explain how a black hole warps spacetime and give examples of how the effect can be observed
              - listitem [ref=f425e105]: Describe how the concept of a singularity disagrees with our current understanding of the behavior of matter
              - listitem [ref=f425e106]: Describe what to look for when seeking and confirming the presence of a stellar black hole
              - listitem [ref=f425e107]: Differentiate between stellar black holes and the black holes in the centers of galaxies
              - listitem [ref=f425e108]: Describe what a gravitational wave is, what can produce it, and how fast it propagates
              - listitem [ref=f425e109]: Describe the basic mechanisms used to detect gravitational waves
