          - heading "Introduction" [level=2] [ref=f425e96]
          - paragraph [ref=f425e97]: In this chapter, we will discuss the origin and properties of black holes and how they affect spacetime. We will also review how astronomers can observe an object that does not allow light to escape. Finally, we will introduce a new type of observatory that searches for gravitational waves.
