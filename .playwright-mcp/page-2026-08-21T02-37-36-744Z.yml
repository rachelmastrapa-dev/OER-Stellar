            - heading "Figure 13.1.1 White Dwarfs in M4" [level=2] [ref=f418e100]
            - paragraph [ref=f418e101]: Two-panel image showing a ground-based optical image (left) and a portion of a Hubble Space Telescope WFPC2 image (right) of the globular cluster M4.
            - generic [ref=f418e102]:
              - heading "Image (Ground)" [level=3] [ref=f418e103]
              - list [ref=f418e104]:
                - listitem [ref=f418e105]: On the left, labeled "Ground."
                - listitem [ref=f418e106]:
                  - text: A ground-based, visible image of the globular cluster M4.
                  - list [ref=f418e107]:
                    - listitem [ref=f418e108]: The image is based on visible light, but is grayscale, also called black and white.
                    - listitem [ref=f418e109]: The brightness of the stars is indicated by the size of the white dot of a star.
                - listitem [ref=f418e110]:
                  - text: Thousands of stars are on a black background with very little space between the stars.
                  - list [ref=f418e111]:
                    - listitem [ref=f418e112]: The stars are dimmer and more spaced apart on the boundaries of the image.
                    - listitem [ref=f418e113]: They become brighter and more crowded toward the center of the image.
                    - listitem [ref=f418e114]: The center of the image, also the center of the cluster, has the brightest and most densely packed stars.
                - listitem [ref=f418e115]: Two diagonal white lines extend from a small region near the cluster's center outward to the right, forming a triangle that indicates the area magnified in the HST panel.
            - generic [ref=f418e116]:
              - heading "Image (HST)" [level=3] [ref=f418e117]
              - list [ref=f418e118]:
                - listitem [ref=f418e119]: On the right, labeled "HST."
                - listitem [ref=f418e120]: A zoomed-in, higher-resolution, visible, color image of the region outlined in the ground-based panel, taken with the Hubble Space Telescope's WFPC2 camera.
                - listitem [ref=f418e121]: Dozens of red, orange, and yellow-white stars are scattered against a black background.
                - listitem [ref=f418e122]: Many of the brighter stars display diagonal, cross-shaped structures.
                - listitem [ref=f418e123]:
                  - text: Seven faint, small stars are individually marked with white circles, distinguishing them from the surrounding brighter stars.
                  - list [ref=f418e124]:
                    - listitem [ref=f418e125]: These circled stars are the white dwarfs identified in the cluster.
                    - listitem [ref=f418e126]: They are noticeably dimmer and smaller than the yellow, orange, and red stars around them.
