              - textbox "Rich Text Editor, editarea" [active] [ref=f422e269]: "<h2>Introduction</h2> <p>In this chapter, we will discuss the origin and properties of black holes and how they affect spacetime. We will also review how astronomers can observe an object that does not allow light to escape. Finally, we will introduce a new type of observatory that searches for gravitational waves.</p> <section class=\"box-objectives\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <ul> <li class=\"lt-phys-64811\">Describe the event horizon surrounding a black hole</li> <li class=\"lt-phys-64811\">Explain how a black hole warps spacetime and give examples of how the effect can be observed</li> <li class=\"lt-phys-64811\">Describe how the concept of a singularity disagrees with our current understanding of the behavior of matter</li> <li class=\"lt-phys-64812\">Describe what to look for when seeking and confirming the presence of a stellar black hole</li> <li class=\"lt-phys-64812\">Differentiate between stellar black holes and the black holes in the centers of galaxies</li> <li class=\"lt-phys-64813\">Describe what a gravitational wave is, what can produce it, and how fast it propagates</li> <li class=\"lt-phys-64813\">Describe the basic mechanisms used to detect gravitational waves</li> </ul> </section> <p>{{template.ShowOrg()}}</p> <p><strong>Thumbnail</strong>: In this illustration, the black hole named Cygnus X-1, which formed when a large star collapsed, is pulling matter from the blue star beside it. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; <a href=\"https://www.nasa.gov/\" target=\"_blank\" title=\"NASA\">IMAGE: NASA, CXC, Melissa Weiss (CXC)</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Black_hole_Cygnus_X-1.jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p>"
