            - application "Rich Text Editor, editarea" [ref=f241e311]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f241e345]: "<p class=\"has-noteref lt-phys-64770\">It is an enormous step to go from the planets to the stars. For example, our Voyager 1 probe, which was launched in 1977, has now traveled farther from Earth than any other spacecraft. As of 2021, Voyager 1 is 152 AU from the Sun.<sup data-type=\"footnote-number\">1</sup> The nearest star, however, is hundreds of thousands of AU from Earth. Even so, we can, in principle, survey distances to the stars using the same technique that a civil engineer employs to survey the distance to an inaccessible mountain or tree—the method of <em data-effect=\"italics\">triangulation</em>.</p> <h3 class=\"lt-phys-64770\">Triangulation in Space</h3> <p class=\"lt-phys-64770\">A practical example of triangulation is your own depth perception. As you are pleased to discover every morning when you look in the mirror, your two eyes are located some distance apart. You therefore view the world from two different vantage points, and it is this dual perspective that allows you to get a general sense of how far away objects are.</p> <p class=\"lt-phys-64770\">To see what we mean, take a pen and hold it a few inches in front of your face. Look at it first with one eye (closing the other) and then switch eyes. Note how the pen seems to shift relative to objects across the room. Now hold the pen at arm’s length: the shift is less. If you play with moving the pen for a while, you will notice that the farther away you hold it, the less it seems to shift. Your brain automatically performs such comparisons and gives you a pretty good sense of how far away things in your immediate neighborhood are.</p> <p class=\"lt-phys-64770\">If your arms were made of rubber, you could stretch the pen far enough away from your eyes that the shift would become imperceptible. This is because our depth perception fails for objects more than a few tens of meters away. In order to see the shift of an object a city block or more from you, your eyes would need to be spread apart a lot farther.</p> <p class=\"lt-phys-64770\">Let’s see how surveyors take advantage of the same idea. Suppose you are trying to measure the distance to a tree across a deep river (Figure 19.4). You set up two observing stations some distance apart. That distance (line AB in Figure 19.4) is called the <em data-effect=\"italics\">baseline</em>. Now the direction to the tree (C in the figure) in relation to the baseline is observed from each station. Note that C appears in different directions from the two stations. This apparent change in direction of the remote object due to a change in vantage point of the observer is called <span data-type=\"term\" group-by=\"p\">parallax</span>.</p> <figure><span data-alt=\"Illustration of the Triangulation Method. In this illustration a surveyor’s transit is shown at two positions along a stream of water. Position “A” is at the center left of this image, and position “B” is just below the center of the illustration. They are separated by a distance labeled “Baseline,” with a black line drawn connecting the two. Both instruments are being used to measure the distance to a tree on the far side of the stream which is located at the upper right corner in the illustration. The tree is labeled “C.” Black lines are drawn from positions “A” and “B” to the tree at “C” to create the triangle ABC. A dashed line is drawn from the center of the baseline to point “C.” A curved arrow is drawn from the baseline to the line AC to represent the angle between the baseline and line AC.\" data-type=\"media\"><img alt=\"Illustration of the Triangulation Method. In this illustration a surveyor’s transit is shown at two positions along a stream of water. Position “A” is at the center left of this image, and position “B” is just below the center of the illustration. They are separated by a distance labeled “Baseline,” with a black line drawn connecting the two. Both instruments are being used to measure the distance to a tree on the far side of the stream which is located at the upper right corner in the illustration. The tree is labeled “C.” Black lines are drawn from positions “A” and “B” to the tree at “C” to create the triangle ABC. A dashed line is drawn from the center of the baseline to point “C.” A curved arrow is drawn from the baseline to the line AC to represent the angle between the baseline and line AC.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45902/8e3b72d151fd64f3dc8d43cdecb0c8851dd19ab7\" /> </span> <figcaption>Figure 19.4 : Triangulation. Triangulation allows us to measure distances to inaccessible objects. By getting the angle to a tree from two different vantage points, we can calculate the properties of the triangle they make and thus the distance to the tree.</figcaption> </figure> <p class=\"lt-phys-64770\">The parallax is also the angle that lines AC and BC make—in mathematical terms, the angle subtended by the baseline. A knowledge of the angles at A and B and the length of the baseline, AB, allows the triangle ABC to be solved for any of its dimensions—say, the distance AC or BC. The solution could be reached by constructing a scale drawing or by using trigonometry to make a numerical calculation. If the tree were farther away, the whole triangle would be longer and skinnier, and the parallax angle would be smaller. Thus, we have the general rule that the smaller the parallax, the more distant the object we are measuring must be.</p> <p class=\"lt-phys-64770\">In practice, the kinds of baselines surveyors use for measuring distances on Earth are completely useless when we try to gauge distances in space. The farther away an astronomical object lies, the longer the baseline has to be to give us a reasonable chance of making a measurement. Unfortunately, nearly all astronomical objects are very far away. To measure their distances requires a very large baseline and highly precise angular measurements. The <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> is the only object near enough that its distance can be found fairly accurately with measurements made without a telescope. Ptolemy determined the distance to the Moon correctly to within a few percent. He used the turning Earth itself as a baseline, measuring the position of the Moon relative to the stars at two different times of night.</p> <p class=\"lt-phys-64770\">With the aid of telescopes, later astronomers were able to measure the distances to the nearer planets and asteroids using Earth’s diameter as a baseline. This is how the AU was first established. To reach for the stars, however, requires a much longer baseline for triangulation and extremely sensitive measurements. Such a baseline is provided by Earth’s annual trip around the Sun.</p> <h3 class=\"lt-phys-64770\">Distances to Stars</h3> <p class=\"lt-phys-64770\">As Earth travels from one side of its orbit to the other, it graciously provides us with a baseline of 2 AU, or about 300 million kilometers. Although this is a much bigger baseline than the diameter of Earth, the stars are <em data-effect=\"italics\">so far away</em> that the resulting parallax shift is <em data-effect=\"italics\">still</em> not visible to the naked eye—not even for the closest stars.</p> <p class=\"lt-phys-64770\">In the chapter on Observing the Sky: The Birth of Astronomy, we discussed how this dilemma perplexed the ancient Greeks, some of whom had actually suggested that the Sun might be the center of the solar system, with Earth in motion around it. Aristotle and others argued, however, that Earth could not be revolving about the Sun. If it were, they said, we would surely observe the parallax of the nearer stars against the background of more distant objects as we viewed the sky from different parts of Earth’s orbit (Figure 19.6). Tycho Brahe (1546–1601) advanced the same faulty argument nearly 2000 years later, when his careful measurements of stellar positions with the unaided eye revealed no such shift.</p> <p class=\"lt-phys-64770\">These early observers did not realize how truly distant the stars were and how small the change in their positions therefore was, even with the entire orbit of Earth as a baseline. The problem was that they did not have tools to measure parallax shifts too small to be seen with the human eye. By the eighteenth century, when there was no longer serious doubt about Earth’s revolution, it became clear that the stars must be extremely distant. Astronomers equipped with telescopes began to devise instruments capable of measuring the tiny shifts of nearby stars relative to the background of more distant (and thus unshifting) celestial objects.</p> <p class=\"lt-phys-64770\">This was a significant technical challenge, since, even for the nearest stars, parallax angles are usually only a fraction of a second of arc. Recall that one second of arc (arcsec) is an angle of only 1/3600 of a degree. A coin the size of a US quarter would appear to have a diameter of 1 arcsecond if you were viewing it from a distance of about 5 kilometers (3 miles). Think about how small an angle that is. No wonder it took astronomers a long time before they could measure such tiny shifts.</p> <p class=\"lt-phys-64770\">The first successful detections of stellar parallax were in the year 1838, when Friedrich <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bessel</span> in Germany (Figure 19.5), Thomas <span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">Henderson</span>, a Scottish astronomer working at the Cape of Good Hope, and Friedrich <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Struve</span> in Russia independently measured the parallaxes of the stars 61 Cygni, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span>, and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vega</span>, respectively. Even the closest star, Alpha Centauri, showed a total displacement of only about 1.5 arcseconds during the course of a year.</p> <figure><span data-alt=\"Portraits of (a) Friedrich Wilhelm Bessel, (b) Thomas Henderson, and (c) Friedrich Struve.\" data-type=\"media\"><img alt=\"Portraits of (a) Friedrich Wilhelm Bessel, (b) Thomas Henderson, and (c) Friedrich Struve.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45907/76787656cd204cae89f99aa4b2bd81bcff63dde5\" /> </span> <figcaption>Figure 19.5 : Friedrich Wilhelm Bessel (1784–1846), Thomas J. Henderson (1798–1844), and Friedrich Struve (1793–1864). (a) Bessel made the first authenticated measurement of the distance to a star (61 Cygni) in 1838, a feat that had eluded many dedicated astronomers for almost a century. But two others, (b) Scottish astronomer Thomas J. Henderson and (c) Friedrich Struve, in Russia, were close on his heels.</figcaption> </figure> <p class=\"lt-phys-64770\">Figure 19.6 shows how such measurements work. Seen from opposite sides of Earth’s orbit, a nearby star shifts position when compared to a pattern of more distant stars. Astronomers actually define parallax to be <em data-effect=\"italics\">one-half</em> the angle that a star shifts when seen from opposite sides of Earth’s orbit (the angle labeled <em data-effect=\"italics\">P</em> in Figure 19.6). The reason for this definition is just that they prefer to deal with a baseline of 1 AU instead of 2 AU.</p> <figure><span data-alt=\"Illustration of Parallax. The Sun is drawn as a yellow disk in the left hand portion of the diagram and is labeled “Sun.” A blue circle surrounds the Sun and is labeled “Earth’s orbit.” The Earth is shown at two positions on the blue circle. Position “A” at the bottom of the circle and “B” at the top. Above and to the right of the center, a nearby star is drawn as an unlabeled red dot. In the upper right is an unlabeled group of five stars that are more distant than the red star. A white line is drawn from position A through the red dot to the uppermost stars in the group. A white line is drawn from position B through the red dot to the middle star in the group. A dashed line is drawn from the Sun to the red dot. The parallax angle, “p,” is drawn between the dashed line and line B. To illustrate the effect of parallax, two insets are included near points A and B. The inset at point B is labeled “Sky as seen from B,” and shows the red dot near the middle star of the group of five stars that are illustrated in the upper right side of the figure. The inset at point A is labeled “Sky as seen from A,” and shows the red dot near the uppermost stars of the group of five stars that are illustrated in the upper right side of the figure.\" data-type=\"media\"><img alt=\"Illustration of Parallax. The Sun is drawn as a yellow disk in the left hand portion of the diagram and is labeled “Sun.” A blue circle surrounds the Sun and is labeled “Earth’s orbit.” The Earth is shown at two positions on the blue circle. Position “A” at the bottom of the circle and “B” at the top. Above and to the right of the center, a nearby star is drawn as an unlabeled red dot. In the upper right is an unlabeled group of five stars that are more distant than the red star. A white line is drawn from position A through the red dot to the uppermost stars in the group. A white line is drawn from position B through the red dot to the middle star in the group. A dashed line is drawn from the Sun to the red dot. The parallax angle, “p,” is drawn between the dashed line and line B. To illustrate the effect of parallax, two insets are included near points A and B. The inset at point B is labeled “Sky as seen from B,” and shows the red dot near the middle star of the group of five stars that are illustrated in the upper right side of the figure. The inset at point A is labeled “Sky as seen from A,” and shows the red dot near the uppermost stars of the group of five stars that are illustrated in the upper right side of the figure.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45901/43673e1b873dee8c9117033e00f64c35664f5207\" /> </span> <figcaption>Figure 19.6 : Parallax. As Earth revolves around the Sun, the direction in which we see a nearby star varies with respect to distant stars. We define the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"p\">parallax</span> of the nearby star to be one half of the total change in direction, and we usually measure it in arcseconds.</figcaption> </figure> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p class=\"lt-phys-64770\">Use the <a href=\"https://openstax.org/l/30parallaxmod\" rel=\"noopener nofollow\" target=\"_blank\">Astronomical Parallax model</a> to explore how the Earth’s motion around the Sun causes nearby stars to appear to “wobble” back and forth compared to background stars. Click on the Orbit box, and use the view along the bottom to see the apparent motion of the nearby object.</p> </div> <h3 class=\"lt-phys-64770\">Units of Stellar Distance</h3> <p class=\"lt-phys-64770\">With a baseline of one AU, how far away would a star have to be to have a parallax of 1 arcsecond? The answer turns out to be 206,265 AU, or 3.26 light-years. This is equal to <math display=\"inline\"><semantics><mrow><mrow><mn>3.1</mn><mo>×</mo><msup><mn>10</mn><mn>13</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>3.1</mn><mo>×</mo><msup><mn>10</mn><mn>13</mn></msup></mrow></annotation-xml></semantics></math> kilometers (in other words, 31 trillion kilometers). We give this unit a special name, the <span data-type=\"term\" group-by=\"p\">parsec</span> (pc)—derived from “the distance at which we have a <em data-effect=\"italics\">par</em>allax of one <em data-effect=\"italics\">sec</em>ond.” The distance (<em data-effect=\"italics\">D</em>) of a star in parsecs is just the reciprocal of its parallax (<em data-effect=\"italics\">p</em>) in arcseconds; that is,</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mrow><mi>D</mi><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mn>1</mn><mi>p</mi></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>D</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mn>1</mn><mi>p</mi></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">Thus, a star with a parallax of 0.1 arcsecond would be found at a distance of 10 parsecs, and one with a parallax of 0.05 arcsecond would be 20 parsecs away.</p> <p class=\"lt-phys-64770\">Back in the days when most of our distances came from parallax measurements, a parsec was a useful unit of distance, but it is not as intuitive as the light-year. One advantage of the light-year as a unit is that it emphasizes the fact that, as we look out into space, we are also looking back into time. The light that we see from a star 100 light-years away left that star 100 years ago. What we study is not the star as it is now, but rather as it was in the past. The light that reaches our telescopes today from distant galaxies left them before Earth even existed.</p> <p class=\"lt-phys-64770\">In this text, we will use light-years as our unit of distance, but many astronomers still use parsecs when they write technical papers or talk with each other at meetings. To convert between the two distance units, just bear in mind: 1 parsec = 3.26 light-year, and 1 light-year = 0.31 parsec.</p> <div class=\"box-example\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Example 19.1: How Far Is a Light-Year?</span></h5> <p class=\"lt-phys-64770\">A <span class=\"no-emphasis\" data-type=\"term\" group-by=\"l\">light-year</span> is the distance light travels in 1 year. Given that light travels at a speed of 300,000 km/s, how many kilometers are there in a light-year?</p> <h6 class=\"lt-phys-64770\">Solution</h6> <p class=\"lt-phys-64770\">We learned earlier that speed = distance/time. We can rearrange this equation so that distance = velocity × time. Now, we need to determine the number of seconds in a year.</p> <p class=\"lt-phys-64770\">There are approximately 365 days in 1 year. To determine the number of seconds, we must estimate the number of seconds in 1 day.</p> <p class=\"lt-phys-64770\">We can change units as follows (notice how the units of time cancel out):</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>24</mn><mspace width=\"0.2em\"></mspace><mtext>hr</mtext><mtext>/</mtext><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>min</mtext><mtext>/</mtext><mtext>hr</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/min</mtext><mo>=</mo><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/</mtext></mrow></mrow><mrow><mrow><mtext>day</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>24</mn><mspace width=\"0.2em\"></mspace><mtext>hr</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>/</mtext><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>min</mtext><mtext>/</mtext><mtext>hr</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/min</mtext><mo>=</mo><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/day</mtext></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">Next, to get the number of seconds per year:</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mrow><mn>365</mn><mspace width=\"0.2em\"></mspace><mtext>days</mtext><mtext>/year</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/day</mtext><mo>=</mo><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/</mtext></mrow></mrow><mrow><mrow><mtext>year</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>365</mn><mspace width=\"0.2em\"></mspace><mtext>days</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>/year</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/day</mtext><mo>=</mo><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/year</mtext></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">Now we can multiply the speed of light by the number of seconds per year to get the distance traveled by light in 1 year:</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mtext>distance</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mtext>velocity</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mtext>time</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>300,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mtext>/s</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext>distance</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mtext>velocity</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mtext>time</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>300,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mtext>/s</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr></mtable></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">That’s almost 10,000,000,000,000 km that light covers in a year. To help you imagine how long this distance is, we’ll mention that a string 1 light-year long could fit around the circumference of Earth 236 million times.</p> </div> <section class=\"box-exercise\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Exercise \\(\\PageIndex{1}\\)</span></h5> <p class=\"lt-phys-64770\">The number above is really large. What happens if we put it in terms that might be a little more understandable, like the diameter of Earth? Earth’s diameter is about 12,700 km.</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64770\">&nbsp;</p> <p class=\"lt-phys-64770\"><math display=\"inline\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>light</mtext><mtext>-year</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>Earth </mtext></mrow><mrow><mtext>diameter</mtext></mrow><mrow><mn>12</mn></mrow><mrow><mn>,</mn><mn>700</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mrow></mfrac></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>7.45</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>Earth </mtext></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mtext>diameters</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>light</mtext></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext>-year</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>Earth </mtext></mrow><mrow><mtext>diameter</mtext></mrow><mrow><mn>12</mn></mrow><mrow><mn>,</mn><mn>700</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mrow></mfrac></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>7.45</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>Earth diameters</mtext></mtd></mtr></mtable></annotation-xml></semantics></math><br /> That means that 1 light-year is about 745 million times the diameter of Earth.</p> </dd> </dl> </section> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Astronomy Basics: Naming Stars</span></h5> <p class=\"lt-phys-64770\">You may be wondering why stars have such a confusing assortment of names. Just look at the first three stars to have their parallaxes measured: 61 Cygni, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span>, and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vega</span>. Each of these names comes from a different tradition of designating stars.</p> <p class=\"lt-phys-64770\">The brightest stars have names that derive from the ancients. Some are from the Greek, such as <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, which means “the scorched one”—a reference to its brilliance. A few are from Latin, but many of the best-known names are from Arabic because, as discussed in Observing the Sky: The Birth of Astronomy, much of Greek and Roman astronomy was “rediscovered” in Europe after the Dark Ages by means of Arabic translations. Vega, for example, means “swooping Eagle,” and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Betelgeuse</span> (pronounced “Beetle-juice”) means “right hand of the central one.”</p> <p class=\"lt-phys-64770\">In 1603, German astronomer Johann <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bayer</span> (1572–1625) introduced a more systematic approach to naming stars. For each constellation, he assigned a Greek letter to the brightest stars, roughly in order of brightness. In the constellation of Orion, for example, Betelgeuse is the brightest star, so it got the first letter in the Greek alphabet—alpha—and is known as Alpha Orionis. (“Orionis” is the possessive form of Orion, so Alpha Orionis means “the first of Orion.”) A star called Rigel, being the second brightest in that constellation, is called Beta Orionis (Figure 19.7). Since there are 24 letters in the Greek alphabet, this system allows the labeling of 24 stars in each constellation, but constellations have many more stars than that.</p> <figure><span data-alt=\"Orion. Panel (a) is a photograph of the constellation Orion. Yellow Betelgeuse is at the upper left of this image, and blue Rigel is at the lower right. The three stars of Orion’s belt are just below center. Panel (b) is a contemporary star-chart of Orion. The brightest stars are shown with their proper names and Greek letter designations. From top to bottom are, “Meissa (lambda),” “Betelgeuse (alpha),” “Bellatrix (gamma),” “Mintaka (delta),” “Alnilam (epsilon),” “Alnitak (zeta),” “Rigel (beta),” and “Saiph (kappa).” Also shown, circled in red, are the nebulae “M 78,” “M 42” and “M 43.”\" data-type=\"media\"><img alt=\"Orion. Panel (a) is a photograph of the constellation Orion. Yellow Betelgeuse is at the upper left of this image, and blue Rigel is at the lower right. The three stars of Orion’s belt are just below center. Panel (b) is a contemporary star-chart of Orion. The brightest stars are shown with their proper names and Greek letter designations. From top to bottom are, “Meissa (lambda),” “Betelgeuse (alpha),” “Bellatrix (gamma),” “Mintaka (delta),” “Alnilam (epsilon),” “Alnitak (zeta),” “Rigel (beta),” and “Saiph (kappa).” Also shown, circled in red, are the nebulae “M 78,” “M 42” and “M 43.”\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45904/4065f747a3a8dc03b963f85ad51ff409575cf260\" /> </span> <figcaption>Figure 19.7 : Objects in Orion. (a) This image shows the brightest objects in or near the star pattern of Orion, the hunter (of Greek mythology), in the constellation of Orion. (b) Note the Greek letters of Bayer’s system in this diagram of the Orion constellation. The objects denoted M42, M43, and M78 are not stars but nebulae—clouds of gas and dust; these numbers come from a list of “fuzzy objects” made by Charles Messier in 1781. (credit a: modification of work by Matthew Spinelli; credit b: modification of work by ESO, IAU and <em data-effect=\"italics\">Sky &amp; Telescope</em>)</figcaption> </figure> <p class=\"lt-phys-64770\">In 1725, the English Astronomer Royal John <span class=\"no-emphasis\" data-type=\"term\" group-by=\"F\">Flamsteed</span> introduced yet another system, in which the brighter stars eventually got a number in each constellation in order of their location in the sky or, more precisely, their right ascension. (The system of sky coordinates that includes right ascension was discussed in Earth, Moon, and Sky.) In this system, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Betelgeuse</span> is called 58 Orionis and 61 Cygni is the 61st star in the constellation of Cygnus, the swan.</p> <p class=\"lt-phys-64770\">It gets worse. As astronomers began to understand more and more about stars, they drew up a series of specialized star catalogs, and fans of those catalogs began calling stars by their catalog numbers. If you look at Appendix I—our list of the nearest stars (many of which are much too faint to get an ancient name, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bayer letter</span>, or <span class=\"no-emphasis\" data-type=\"term\" group-by=\"F\">Flamsteed number</span>)—you will see references to some of these catalogs. An example is a set of stars labeled with a BD number, for “Bonner Durchmusterung.” This was a mammoth catalog of over 324,000 stars in a series of zones in the sky, organized at the Bonn Observatory in the 1850s and 1860s. Keep in mind that this catalog was made before photography or computers came into use, so the position of each star had to be measured (at least twice) by eye, a daunting undertaking.</p> <p class=\"lt-phys-64770\">There is also a completely different system for keeping track of stars whose luminosity varies, and another for stars that brighten explosively at unpredictable times. Astronomers have gotten used to the many different star-naming systems, but students often find them bewildering and wish astronomers would settle on one. Don’t hold your breath: in astronomy, as in many fields of human thought, tradition holds a powerful attraction. Still, with high-speed computer databases to aid human memory, names may become less and less necessary. Today’s astronomers often refer to stars by their precise locations in the sky rather than by their names or various catalog numbers.</p> </div> <h3 class=\"lt-phys-64770\">The Nearest Stars</h3> <p class=\"lt-phys-64770\">No known star (other than the Sun) is within 1 light-year or even 1 parsec of Earth. The stellar neighbors nearest the Sun are three stars in the constellation of Centaurus. To the unaided eye, the brightest of these three stars is <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span>, which is only 30<sup>○</sup> from the south celestial pole and hence not visible from the mainland United States. Alpha Centauri itself is a binary star—two stars in mutual revolution—too close together to be distinguished without a telescope. These two stars are 4.4 light-years from us. Nearby is a third faint star, known as <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Proxima Centauri</span>. Proxima, with a distance of 4.3 light-years, is slightly closer to us than the other two stars. If Proxima Centauri is part of a triple star system with the binary Alpha Centauri, as seems likely, then its orbital period may be longer than 500,000 years.</p> <p class=\"lt-phys-64770\">Proxima Centauri is an example of the most common type of star, and our most common type of stellar neighbor (as we saw in Stars: A Celestial Census.) Low-mass red M dwarfs make up about 70% of all stars and dominate the census of stars within 10 parsecs (33 light-years) of the Sun. For example, a recent survey of the solar neighborhood counted 357 stars and brown dwarfs within 10 parsecs, and 248 of these are red dwarfs. Yet, if you wanted to see an M dwarf with your naked eye, you would be out of luck. These stars only produce a fraction of the Sun’s light, and nearly all of them require a telescope to be detected.</p> <p class=\"lt-phys-64770\">The nearest star visible without a telescope from most of the United States is the brightest appearing of all the stars, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, which has a distance of a little more than 8 light-years. It too is a binary system, composed of a faint white dwarf orbiting a bluish-white, main-sequence star. It is an interesting coincidence of numbers that light reaches us from the Sun in about 8 minutes and from the next brightest star in the sky in about 8 years.</p> <div class=\"box-example\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Example 19.2: Calculating the Diameter of the Sun</span></h5> <p class=\"lt-phys-64770\">For nearby stars, we can measure the apparent shift in their positions as Earth orbits the Sun. We wrote earlier that an object must be 206,265 AU distant to have a parallax of one second of arc. This must seem like a very strange number, but you can figure out why this is the right value. We will start by estimating the diameter of the Sun and then apply the same idea to a star with a parallax of 1 arcsecond. Make a sketch that has a round circle to represent the Sun, place Earth some distance away, and put an observer on it. Draw two lines from the point where the observer is standing, one to each side of the Sun. Sketch a circle centered at Earth with its circumference passing through the center of the Sun. Now think about proportions. The Sun spans about half a degree on the sky. A full circle has 360<sup>○</sup>. The circumference of the circle centered on Earth and passing through the Sun is given by:</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mrow><mtext>circumference</mtext><mo>=</mo><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn></mrow></mrow><mrow><mrow><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>circumference</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">Then, the following two ratios are equal:</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mrow><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>diameter of </mtext></mrow><mrow><mtext>Sun</mtext></mrow><mrow><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn></mrow><mrow><mn>,000,000</mn></mrow></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>diameter of </mtext></mrow><mrow><mtext>Sun</mtext></mrow><mrow><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn></mrow><mrow><mn>,000,000</mn></mrow></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">Calculate the diameter of the Sun. How does your answer compare to the actual diameter?</p> <h6 class=\"lt-phys-64770\">Solution</h6> <p class=\"lt-phys-64770\">To solve for the diameter of the Sun, we can evaluate the expression above.</p> <p class=\"lt-phys-64770\"><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mtext>diameter of the sun</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>811,</mn></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mn>577</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext>diameter</mtext></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext> of the sun</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>811,</mn><mn>577</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr></mtable></annotation-xml></semantics></math></p> <p class=\"lt-phys-64770\">This is very close to the true value of about 848,000 miles.</p> </div> <section class=\"box-exercise\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Exercise \\(\\PageIndex{1}\\)</span></h5> <p class=\"lt-phys-64770\">Now apply this idea to calculating the distance to a star that has a parallax of 1 arcsec. Draw a picture similar to the one we suggested above and calculate the distance in AU. (Hint: Remember that the parallax angle is defined by 1 AU, not 2 AU, and that 3600 arcseconds = 1 degree.)</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64770\">&nbsp;</p> <p class=\"lt-phys-64770\">206,265 AU</p> </dd> </dl> </section> <h3 class=\"lt-phys-64770\">Measuring Parallaxes in Space</h3> <p class=\"lt-phys-64770\">The measurements of stellar parallax were revolutionized by the launch of the spacecraft Hipparcos in 1989, which measured distances for thousands of stars out to about 300 light-years with an accuracy of 10 to 20% (see Figure 19.8 and the feature on Parallax and Space Astronomy). However, even 300 light-years are less than 1% the size of our Galaxy’s main disk.</p> <p class=\"has-noteref lt-phys-64770\">In December 2013, the successor to Hipparcos, named <em data-effect=\"italics\">Gaia</em>, was launched by the European Space Agency. <em data-effect=\"italics\">Gaia</em> is measuring the position and distances to almost one billion stars with an accuracy of a few millionths of an arcsecond. <em data-effect=\"italics\">Gaia’s</em> distance limit extends well beyond Hipparcos, studying stars out to 30,000 light-years (100 times farther than Hipparcos, covering nearly 1/3 of the galactic disk). <em data-effect=\"italics\">Gaia</em> is also able to measure proper motions<sup data-type=\"footnote-number\">2</sup> for thousands of stars in the halo of the Milky Way—something that can only be done for the brightest stars right now. At the end of <em data-effect=\"italics\">Gaia’s</em> mission, we will not only have a three-dimensional map of a large fraction of our own <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Milky Way Galaxy</span>, but we will also have a strong link in the chain of cosmic distances that we are discussing in this chapter. Yet, to extend this chain beyond <em data-effect=\"italics\">Gaia’s</em> reach and explore distances to nearby galaxies, we need some completely new techniques.</p> <figure><span data-alt=\"H–R Diagram of Stars Measured by Gaia and Hipparcos. The x-axis of this graph is labeled “Spectral Type” and lists “O”, “B”, “A”, “F”, “G”, “K”, and “M” from left to right. The y-axis is labeled “Luminosity (L_Sun)” and ranges from 1/100 to 10,000. The plot includes 16,631 stars which form a Y shape, with the tail at “M” on the x-axis and the two arms splitting roughly at “G” on the x-axis and “1” on the y-axis, with the left arm extending leftward up toward “10,000” on the y-axis and the right arm extending rightward up toward “10,000”.\" data-type=\"media\"><img alt=\"H–R Diagram of Stars Measured by Gaia and Hipparcos. The x-axis of this graph is labeled “Spectral Type” and lists “O”, “B”, “A”, “F”, “G”, “K”, and “M” from left to right. The y-axis is labeled “Luminosity (L_Sun)” and ranges from 1/100 to 10,000. The plot includes 16,631 stars which form a Y shape, with the tail at “M” on the x-axis and the two arms splitting roughly at “G” on the x-axis and “1” on the y-axis, with the left arm extending leftward up toward “10,000” on the y-axis and the right arm extending rightward up toward “10,000”.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45910/63b9edc49ab27d3cac9aec3341e73d13e8542a4d\" /> </span> <figcaption>Figure 19.8 : H–R Diagram of Stars Measured by <em data-effect=\"italics\">Gaia</em> and Hipparcos. This plot includes 16,631 stars for which the parallaxes have an accuracy of 10% or better. The colors indicate the numbers of stars at each point of the diagram, with red corresponding to the largest number and blue to the lowest. Luminosity is plotted along the vertical axis, with luminosity increasing upward. An infrared color is plotted as a proxy for temperature, with temperature decreasing to the right. Most of the data points are distributed along the diagonal running from the top left corner (high luminosity, high temperature) to the bottom right (low temperature, low luminosity). These are main sequence stars. The large clump of data points above the main sequence on the right side of the diagram is composed of red giant stars. (credit: modification of work by the European Space Agency)</figcaption> </figure> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Making Connections: Parallax and Space Astronomy</span></h5> <p class=\"lt-phys-64770\">One of the most difficult things about precisely measuring the tiny angles of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"p\">parallax</span> shifts from Earth is that you have to observe the stars through our planet’s atmosphere. As we saw in Astronomical Instruments, the effect of the atmosphere is to spread out the points of starlight into fuzzy disks, making exact measurements of their positions more difficult. Astronomers had long dreamed of being able to measure parallaxes from space, and two orbiting observatories have now turned this dream into reality.</p> <p class=\"lt-phys-64770\">The name of the Hipparcos satellite, launched in 1989 by the European Space Agency, is both an abbreviation for High Precision Parallax Collecting Satellite and a tribute to Hipparchus, the pioneering Greek astronomer whose work we discussed in the Observing the Sky: The Birth of Astronomy. The satellite was designed to make the most accurate parallax measurements in history, from 36,000 kilometers above Earth. However, its onboard rocket motor failed to fire, which meant it did not get the needed boost to reach the desired altitude. Hipparcos ended up spending its 4-year life in an elliptical orbit that varied from 500 to 36,000 kilometers high. In this orbit, the satellite plunged into Earth’s radiation belts every 5 hours or so, which finally took its toll on the solar panels that provided energy to power the instruments.</p> <p class=\"lt-phys-64770\">Nevertheless, the mission was successful, resulting in two catalogs. One gives positions of 120,000 stars to an accuracy of one-thousandth of an arcsecond—about the diameter of a golf ball in New York as viewed from Europe. The second catalog contains information for more than a million stars, whose positions have been measured to thirty-thousandths of an arcsecond. We now have accurate parallax measurements of stars out to distances of about 300 light-years. (With ground-based telescopes, accurate measurements were feasible out to only about 60 light-years.)</p> <p class=\"lt-phys-64770\">In order to build on the success of Hipparcos, in 2013, the European Space Agency launched a new satellite called <em data-effect=\"italics\">Gaia</em>. Because <em data-effect=\"italics\">Gaia</em> carries larger telescopes than Hipparcos, it can observe fainter stars and measure their positions 200 times more accurately. The main goal of the Gaia mission is to make an accurate three-dimensional map of that portion of the Galaxy within about 30,000 light-years by observing 1 billion stars 70 times each, measuring their positions and hence their parallaxes as well as their brightnesses.</p> <p class=\"lt-phys-64770\">For a long time, the measurement of parallaxes and accurate stellar positions was a backwater of astronomical research—mainly because the accuracy of measurements did not improve much for about 100 years. However, the ability to make measurements from space has revolutionized this field of astronomy and will continue to provide a critical link in our chain of cosmic distances.</p> </div> <div class=\"box-note\"> <h5 class=\"box-legend lt-phys-64770\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p class=\"lt-phys-64770\">The European Space Agency (ESA) maintains a <a href=\"https://openstax.org/l/30GaiaMission\" rel=\"noopener nofollow\" target=\"_blank\">Gaia mission website</a> where you can learn more about the Gaia mission and to get the latest news on <em data-effect=\"italics\">Gaia</em> observations.</p> <p class=\"lt-phys-64770\">To learn more about Hipparcos, explore this <a href=\"https://openstax.org/l/30Hipparcos\" rel=\"noopener nofollow\" target=\"_blank\">European Space Agency webpage</a> with an ESA vodcast <em data-effect=\"italics\">Charting the Galaxy—from Hipparcos to Gaia</em>.</p> </div> <h3 class=\"lt-phys-64770\" data-type=\"footnote-refs-title\">Footnotes</h3> <ul data-bullet-style=\"none\" data-list-type=\"bulleted\"> <li class=\"lt-phys-64770\" data-type=\"footnote-ref\"><a href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/19:_Celestial_Distances/19.03:_Surveying_the_Stars#footnote-ref1\" role=\"doc-backlink\">1</a><span data-type=\"footnote-ref-content\">To</span><span data-type=\"footnote-ref-content\"> have some basis for comparison, the dwarf planet Pluto orbits at an average distance of 40 AU from the Sun, and the dwarf planet Eris is currently roughly 96 AU from the Sun.</span></li> <li class=\"lt-phys-64770\" data-type=\"footnote-ref\"><a href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/19:_Celestial_Distances/19.03:_Surveying_the_Stars#footnote-ref2\" role=\"doc-backlink\">2</a><span data-type=\"footnote-ref-content\">Proper</span><span data-type=\"footnote-ref-content\"> motion (as discussed in Analyzing Starlight<em data-effect=\"italics\">,</em> is the motion of a star across the sky (perpendicular to our line of sight.)</span></li> </ul> <p>&nbsp;</p> <section class=\"box-objectives\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <p>By the end of this section, you will be able to:</p> <ul> <li>Understand the concept of triangulating distances to distant objects, including stars</li> <li>Explain why space-based satellites deliver more precise distances than ground-based methods</li> <li>Discuss astronomers’ efforts to determine the distance of the stars closest to the Sun</li> </ul> </section> <p class=\"has-noteref\">It is an enormous step to go from the planets to the stars. For example, our Voyager 1 probe, which was launched in 1977, has now traveled farther from Earth than any other spacecraft. As of 2021, Voyager 1 is 152 AU from the Sun.<sup data-type=\"footnote-number\">1</sup> The nearest star, however, is hundreds of thousands of AU from Earth. Even so, we can, in principle, survey distances to the stars using the same technique that a civil engineer employs to survey the distance to an inaccessible mountain or tree—the method of <em data-effect=\"italics\">triangulation</em>.</p> <h3>Triangulation in Space</h3> <p>A practical example of triangulation is your own depth perception. As you are pleased to discover every morning when you look in the mirror, your two eyes are located some distance apart. You therefore view the world from two different vantage points, and it is this dual perspective that allows you to get a general sense of how far away objects are.</p> <p>To see what we mean, take a pen and hold it a few inches in front of your face. Look at it first with one eye (closing the other) and then switch eyes. Note how the pen seems to shift relative to objects across the room. Now hold the pen at arm’s length: the shift is less. If you play with moving the pen for a while, you will notice that the farther away you hold it, the less it seems to shift. Your brain automatically performs such comparisons and gives you a pretty good sense of how far away things in your immediate neighborhood are.</p> <p>If your arms were made of rubber, you could stretch the pen far enough away from your eyes that the shift would become imperceptible. This is because our depth perception fails for objects more than a few tens of meters away. In order to see the shift of an object a city block or more from you, your eyes would need to be spread apart a lot farther.</p> <p>Let’s see how surveyors take advantage of the same idea. Suppose you are trying to measure the distance to a tree across a deep river (Figure 19.4). You set up two observing stations some distance apart. That distance (line AB in Figure 19.4) is called the <em data-effect=\"italics\">baseline</em>. Now the direction to the tree (C in the figure) in relation to the baseline is observed from each station. Note that C appears in different directions from the two stations. This apparent change in direction of the remote object due to a change in vantage point of the observer is called <span data-type=\"term\" group-by=\"p\">parallax</span>.</p> <figure><span data-alt=\"Illustration of the Triangulation Method. In this illustration a surveyor’s transit is shown at two positions along a stream of water. Position “A” is at the center left of this image, and position “B” is just below the center of the illustration. They are separated by a distance labeled “Baseline,” with a black line drawn connecting the two. Both instruments are being used to measure the distance to a tree on the far side of the stream which is located at the upper right corner in the illustration. The tree is labeled “C.” Black lines are drawn from positions “A” and “B” to the tree at “C” to create the triangle ABC. A dashed line is drawn from the center of the baseline to point “C.” A curved arrow is drawn from the baseline to the line AC to represent the angle between the baseline and line AC.\" data-type=\"media\"><img alt=\"Illustration of the Triangulation Method. In this illustration a surveyor’s transit is shown at two positions along a stream of water. Position “A” is at the center left of this image, and position “B” is just below the center of the illustration. They are separated by a distance labeled “Baseline,” with a black line drawn connecting the two. Both instruments are being used to measure the distance to a tree on the far side of the stream which is located at the upper right corner in the illustration. The tree is labeled “C.” Black lines are drawn from positions “A” and “B” to the tree at “C” to create the triangle ABC. A dashed line is drawn from the center of the baseline to point “C.” A curved arrow is drawn from the baseline to the line AC to represent the angle between the baseline and line AC.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45902/8e3b72d151fd64f3dc8d43cdecb0c8851dd19ab7\" /> </span> <figcaption>Figure 19.4 : Triangulation. Triangulation allows us to measure distances to inaccessible objects. By getting the angle to a tree from two different vantage points, we can calculate the properties of the triangle they make and thus the distance to the tree.</figcaption> </figure> <p>The parallax is also the angle that lines AC and BC make—in mathematical terms, the angle subtended by the baseline. A knowledge of the angles at A and B and the length of the baseline, AB, allows the triangle ABC to be solved for any of its dimensions—say, the distance AC or BC. The solution could be reached by constructing a scale drawing or by using trigonometry to make a numerical calculation. If the tree were farther away, the whole triangle would be longer and skinnier, and the parallax angle would be smaller. Thus, we have the general rule that the smaller the parallax, the more distant the object we are measuring must be.</p> <p>In practice, the kinds of baselines surveyors use for measuring distances on Earth are completely useless when we try to gauge distances in space. The farther away an astronomical object lies, the longer the baseline has to be to give us a reasonable chance of making a measurement. Unfortunately, nearly all astronomical objects are very far away. To measure their distances requires a very large baseline and highly precise angular measurements. The <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> is the only object near enough that its distance can be found fairly accurately with measurements made without a telescope. Ptolemy determined the distance to the Moon correctly to within a few percent. He used the turning Earth itself as a baseline, measuring the position of the Moon relative to the stars at two different times of night.</p> <p>With the aid of telescopes, later astronomers were able to measure the distances to the nearer planets and asteroids using Earth’s diameter as a baseline. This is how the AU was first established. To reach for the stars, however, requires a much longer baseline for triangulation and extremely sensitive measurements. Such a baseline is provided by Earth’s annual trip around the Sun.</p> <h3>Distances to Stars</h3> <p class=\"lt-phys-64203\">When discussing stars, astronomers consider other factors, such as the <strong>star’s distance </strong>and <strong>brightness</strong>. These quantities might seem easy to determine at first, yet they are challenging. And to fully understand each star’s physical characteristics, we need to determine these most basic of quantities.</p> <p class=\"lt-phys-64203\">The distance to a specific star – beyond our Sun – is not an easy thing to determine. There is no way to use a measuring tape; the tool we are used to using in our own personal universes. As with measuring distances from object to object here on Earth, radar works well for many Solar System objects, but not beyond. The radar beam spreads out too much and loses energy. And it would take over eight years for that beam to travel to the closest star beyond the Sun – Proxima Centauri – and back. By the time the radar beam returned, there would be nothing to receive here on Earth because the beam would have lost all of its energy.</p> <p class=\"lt-phys-64203\">So to measure the distance to nearby stars, astronomers observe an object’s <strong>stellar parallax</strong>. This is the apparent shift of an object relative to some distant background as the observer’s point of view changes. As Earth and observer orbits the Sun, the specific star being observed will appear to move relative to the background stars. <strong>Parallax is the only method for directly measuring stellar distances. </strong>You may try this by holding a finger up at arm’s length. Open one eye and close the other. Now blink; reverse the open-closed eyes. Notice the objects in the distance appear to shift back and forth compared to your closer finger.</p> <p>As Earth travels from one side of its orbit to the other, it graciously provides us with a baseline of 2 AU, or about 300 million kilometers. Although this is a much bigger baseline than the diameter of Earth, the stars are <em data-effect=\"italics\">so far away</em> that the resulting parallax shift is <em data-effect=\"italics\">still</em> not visible to the naked eye—not even for the closest stars.</p> <p>In the chapter on Observing the Sky: The Birth of Astronomy, we discussed how this dilemma perplexed the ancient Greeks, some of whom had actually suggested that the Sun might be the center of the solar system, with Earth in motion around it. Aristotle and others argued, however, that Earth could not be revolving about the Sun. If it were, they said, we would surely observe the parallax of the nearer stars against the background of more distant objects as we viewed the sky from different parts of Earth’s orbit (Figure 19.6). Tycho Brahe (1546–1601) advanced the same faulty argument nearly 2000 years later, when his careful measurements of stellar positions with the unaided eye revealed no such shift.</p> <p>These early observers did not realize how truly distant the stars were and how small the change in their positions therefore was, even with the entire orbit of Earth as a baseline. The problem was that they did not have tools to measure parallax shifts too small to be seen with the human eye. By the eighteenth century, when there was no longer serious doubt about Earth’s revolution, it became clear that the stars must be extremely distant. Astronomers equipped with telescopes began to devise instruments capable of measuring the tiny shifts of nearby stars relative to the background of more distant (and thus unshifting) celestial objects.</p> <p>This was a significant technical challenge, since, even for the nearest stars, parallax angles are usually only a fraction of a second of arc. Recall that one second of arc (arcsec) is an angle of only 1/3600 of a degree. A coin the size of a US quarter would appear to have a diameter of 1 arcsecond if you were viewing it from a distance of about 5 kilometers (3 miles). Think about how small an angle that is. No wonder it took astronomers a long time before they could measure such tiny shifts.</p> <p>The first successful detections of stellar parallax were in the year 1838, when Friedrich <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bessel</span> in Germany (Figure 19.5), Thomas <span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">Henderson</span>, a Scottish astronomer working at the Cape of Good Hope, and Friedrich <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Struve</span> in Russia independently measured the parallaxes of the stars 61 Cygni, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span>, and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vega</span>, respectively. Even the closest star, Alpha Centauri, showed a total displacement of only about 1.5 arcseconds during the course of a year.</p> <figure><span data-alt=\"Portraits of (a) Friedrich Wilhelm Bessel, (b) Thomas Henderson, and (c) Friedrich Struve.\" data-type=\"media\"><img alt=\"Portraits of (a) Friedrich Wilhelm Bessel, (b) Thomas Henderson, and (c) Friedrich Struve.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45907/76787656cd204cae89f99aa4b2bd81bcff63dde5\" /> </span> <figcaption>Figure 19.5 : Friedrich Wilhelm Bessel (1784–1846), Thomas J. Henderson (1798–1844), and Friedrich Struve (1793–1864). (a) Bessel made the first authenticated measurement of the distance to a star (61 Cygni) in 1838, a feat that had eluded many dedicated astronomers for almost a century. But two others, (b) Scottish astronomer Thomas J. Henderson and (c) Friedrich Struve, in Russia, were close on his heels.</figcaption> </figure> <p>Figure 19.6 shows how such measurements work. Seen from opposite sides of Earth’s orbit, a nearby star shifts position when compared to a pattern of more distant stars. Astronomers actually define parallax to be <em data-effect=\"italics\">one-half</em> the angle that a star shifts when seen from opposite sides of Earth’s orbit (the angle labeled <em data-effect=\"italics\">P</em> in Figure 19.6). The reason for this definition is just that they prefer to deal with a baseline of 1 AU instead of 2 AU.</p> <figure><span data-alt=\"Illustration of Parallax. The Sun is drawn as a yellow disk in the left hand portion of the diagram and is labeled “Sun.” A blue circle surrounds the Sun and is labeled “Earth’s orbit.” The Earth is shown at two positions on the blue circle. Position “A” at the bottom of the circle and “B” at the top. Above and to the right of the center, a nearby star is drawn as an unlabeled red dot. In the upper right is an unlabeled group of five stars that are more distant than the red star. A white line is drawn from position A through the red dot to the uppermost stars in the group. A white line is drawn from position B through the red dot to the middle star in the group. A dashed line is drawn from the Sun to the red dot. The parallax angle, “p,” is drawn between the dashed line and line B. To illustrate the effect of parallax, two insets are included near points A and B. The inset at point B is labeled “Sky as seen from B,” and shows the red dot near the middle star of the group of five stars that are illustrated in the upper right side of the figure. The inset at point A is labeled “Sky as seen from A,” and shows the red dot near the uppermost stars of the group of five stars that are illustrated in the upper right side of the figure.\" data-type=\"media\"><img alt=\"Illustration of Parallax. The Sun is drawn as a yellow disk in the left hand portion of the diagram and is labeled “Sun.” A blue circle surrounds the Sun and is labeled “Earth’s orbit.” The Earth is shown at two positions on the blue circle. Position “A” at the bottom of the circle and “B” at the top. Above and to the right of the center, a nearby star is drawn as an unlabeled red dot. In the upper right is an unlabeled group of five stars that are more distant than the red star. A white line is drawn from position A through the red dot to the uppermost stars in the group. A white line is drawn from position B through the red dot to the middle star in the group. A dashed line is drawn from the Sun to the red dot. The parallax angle, “p,” is drawn between the dashed line and line B. To illustrate the effect of parallax, two insets are included near points A and B. The inset at point B is labeled “Sky as seen from B,” and shows the red dot near the middle star of the group of five stars that are illustrated in the upper right side of the figure. The inset at point A is labeled “Sky as seen from A,” and shows the red dot near the uppermost stars of the group of five stars that are illustrated in the upper right side of the figure.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45901/43673e1b873dee8c9117033e00f64c35664f5207\" /> </span> <figcaption>Figure 19.6 : Parallax. As Earth revolves around the Sun, the direction in which we see a nearby star varies with respect to distant stars. We define the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"p\">parallax</span> of the nearby star to be one half of the total change in direction, and we usually measure it in arcseconds.</figcaption> </figure> <div class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p>Use the <a href=\"https://openstax.org/l/30parallaxmod\" rel=\"noopener nofollow\" target=\"_blank\">Astronomical Parallax model</a> to explore how the Earth’s motion around the Sun causes nearby stars to appear to “wobble” back and forth compared to background stars. Click on the Orbit box, and use the view along the bottom to see the apparent motion of the nearby object.</p> </div> <p class=\"lt-phys-64205\">Another challenge is the fact that the star’s position you are measuring, the Sun and Solar System, and these background stars are also moving. The way to overcome this issue is to make more than two measurements and to take into account all of the motions – the Solar System and background reference stars.</p> <figure><img alt=\"Image of theStellar Parallax diagram. The apparent motion of a near by star is a small ellipse in the sky relative to background stars over the period of a year. The angle representing major axis radius of the elliptical path is the parallax angle. The minor axis radius angle is simply related to the direction of the star relative to the earth's orbital axis. Stars near the north and south poles will make perfect circles, while stars near the ecliptic will make flat ellipses. \" src=\"/@api/deki/files/42855/figure-188-parallaxDiagram. jpg\" /> <figcaption>Public Domain | Image courtesy of Wikimedia Author: Booyabazooka</figcaption> </figure> <p>&nbsp;</p> <h3>Units of Stellar Distance</h3> <p>With a baseline of one AU, how far away would a star have to be to have a parallax of 1 arcsecond? The answer turns out to be 206,265 AU, or 3.26 light-years. This is equal to <math display=\"inline\"><semantics><mrow><mrow><mn>3.1</mn><mo>×</mo><msup><mn>10</mn><mn>13</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>3.1</mn><mo>×</mo><msup><mn>10</mn><mn>13</mn></msup></mrow></annotation-xml></semantics></math> kilometers (in other words, 31 trillion kilometers). We give this unit a special name, the <span data-type=\"term\" group-by=\"p\">parsec</span> (pc)—derived from “the distance at which we have a <em data-effect=\"italics\">par</em>allax of one <em data-effect=\"italics\">sec</em>ond.” The distance (<em data-effect=\"italics\">D</em>) of a star in parsecs is just the reciprocal of its parallax (<em data-effect=\"italics\">p</em>) in arcseconds; that is,</p> <p><math display=\"block\"><semantics><mrow><mrow><mi>D</mi><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mn>1</mn><mi>p</mi></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>D</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mn>1</mn><mi>p</mi></mfrac></mrow></annotation-xml></semantics></math></p> <p>Thus, a star with a parallax of 0.1 arcsecond would be found at a distance of 10 parsecs, and one with a parallax of 0.05 arcsecond would be 20 parsecs away.</p> <p>Back in the days when most of our distances came from parallax measurements, a parsec was a useful unit of distance, but it is not as intuitive as the light-year. One advantage of the light-year as a unit is that it emphasizes the fact that, as we look out into space, we are also looking back into time. The light that we see from a star 100 light-years away left that star 100 years ago. What we study is not the star as it is now, but rather as it was in the past. The light that reaches our telescopes today from distant galaxies left them before Earth even existed.</p> <p class=\"lt-phys-64208\">Astronomers also employ other types of measurements, specifically the <strong>parsec (pc)</strong>. The parsec is defined as the distance to an object with a parallax angle of 1 arcsecond. This takes us back to our measurements using parallax. When determining the relationship between the <em>pc </em>and <em>ly </em>, one finds that:<strong>1 pc = 3. 261 light years (ly) = 1. 9174 x 1012 mi = 3. 0857 x 1013 km. M</strong></p> <p class=\"lt-phys-64208\">The parsec was named from the abbreviations of a <strong>par </strong>allax of one arc <strong>sec </strong>ond. The idea of the parsec was to provide astronomers a method to calculate stellar and other astronomical distances quickly and with ease from their data. The parsec is preferred by astronomers, whereas the light-year is more popular in science texts and everyday use.</p> <p>In this text, we will use light-years as our unit of distance, but many astronomers still use parsecs when they write technical papers or talk with each other at meetings. To convert between the two distance units, just bear in mind: 1 parsec = 3.26 light-year, and 1 light-year = 0.31 parsec.</p> <div class=\"box-example\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Example 19.1: How Far Is a Light-Year?</span></h5> <p>A <span class=\"no-emphasis\" data-type=\"term\" group-by=\"l\">light-year</span> is the distance light travels in 1 year. Given that light travels at a speed of 300,000 km/s, how many kilometers are there in a light-year?</p> <h6>Solution</h6> <p>We learned earlier that speed = distance/time. We can rearrange this equation so that distance = velocity × time. Now, we need to determine the number of seconds in a year.</p> <p>There are approximately 365 days in 1 year. To determine the number of seconds, we must estimate the number of seconds in 1 day.</p> <p>We can change units as follows (notice how the units of time cancel out):</p> <p><math display=\"block\"><semantics><mrow><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>24</mn><mspace width=\"0.2em\"></mspace><mtext>hr</mtext><mtext>/</mtext><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>min</mtext><mtext>/</mtext><mtext>hr</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/min</mtext><mo>=</mo><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/</mtext></mrow></mrow><mrow><mrow><mtext>day</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>24</mn><mspace width=\"0.2em\"></mspace><mtext>hr</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>/</mtext><mtext>day</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>min</mtext><mtext>/</mtext><mtext>hr</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>60</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/min</mtext><mo>=</mo><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/day</mtext></mrow></annotation-xml></semantics></math></p> <p>Next, to get the number of seconds per year:</p> <p><math display=\"block\"><semantics><mrow><mrow><mn>365</mn><mspace width=\"0.2em\"></mspace><mtext>days</mtext><mtext>/year</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/day</mtext><mo>=</mo><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/</mtext></mrow></mrow><mrow><mrow><mtext>year</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>365</mn><mspace width=\"0.2em\"></mspace><mtext>days</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>/year</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>86,</mn><mn>400</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/day</mtext><mo>=</mo><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext><mtext>/year</mtext></mrow></annotation-xml></semantics></math></p> <p>Now we can multiply the speed of light by the number of seconds per year to get the distance traveled by light in 1 year:</p> <p><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mtext>distance</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mtext>velocity</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mtext>time</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>300,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mtext>/s</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext>distance</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mtext>velocity</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mtext>time</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>300,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mtext>/s</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>31,536,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>s</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr></mtable></annotation-xml></semantics></math></p> <p>That’s almost 10,000,000,000,000 km that light covers in a year. To help you imagine how long this distance is, we’ll mention that a string 1 light-year long could fit around the circumference of Earth 236 million times.</p> </div> <section class=\"box-exercise\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Exercise \\(\\PageIndex{1}\\)</span></h5> <p>The number above is really large. What happens if we put it in terms that might be a little more understandable, like the diameter of Earth? Earth’s diameter is about 12,700 km.</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p>&nbsp;</p> <p><math display=\"inline\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>light</mtext><mtext>-year</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>Earth </mtext></mrow><mrow><mtext>diameter</mtext></mrow><mrow><mn>12</mn></mrow><mrow><mn>,</mn><mn>700</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mrow></mfrac></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>7.45</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>Earth </mtext></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mtext>diameters</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>light</mtext></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext>-year</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>9.46</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mrow><mn>12</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>km</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mfrac><mrow><mn>1</mn><mspace width=\"0.2em\"></mspace><mtext>Earth </mtext></mrow><mrow><mtext>diameter</mtext></mrow><mrow><mn>12</mn></mrow><mrow><mn>,</mn><mn>700</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mrow></mfrac></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>7.45</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mn>10</mn><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>Earth diameters</mtext></mtd></mtr></mtable></annotation-xml></semantics></math><br /> That means that 1 light-year is about 745 million times the diameter of Earth.</p> </dd> </dl> </section> <div class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Astronomy Basics: Naming Stars</span></h5> <p>You may be wondering why stars have such a confusing assortment of names. Just look at the first three stars to have their parallaxes measured: 61 Cygni, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span>, and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vega</span>. Each of these names comes from a different tradition of designating stars.</p> <p>The brightest stars have names that derive from the ancients. Some are from the Greek, such as <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, which means “the scorched one”—a reference to its brilliance. A few are from Latin, but many of the best-known names are from Arabic because, as discussed in Observing the Sky: The Birth of Astronomy, much of Greek and Roman astronomy was “rediscovered” in Europe after the Dark Ages by means of Arabic translations. Vega, for example, means “swooping Eagle,” and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Betelgeuse</span> (pronounced “Beetle-juice”) means “right hand of the central one.”</p> <p>In 1603, German astronomer Johann <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bayer</span> (1572–1625) introduced a more systematic approach to naming stars. For each constellation, he assigned a Greek letter to the brightest stars, roughly in order of brightness. In the constellation of Orion, for example, Betelgeuse is the brightest star, so it got the first letter in the Greek alphabet—alpha—and is known as Alpha Orionis. (“Orionis” is the possessive form of Orion, so Alpha Orionis means “the first of Orion.”) A star called Rigel, being the second brightest in that constellation, is called Beta Orionis (Figure 19.7). Since there are 24 letters in the Greek alphabet, this system allows the labeling of 24 stars in each constellation, but constellations have many more stars than that.</p> <figure><span data-alt=\"Orion. Panel (a) is a photograph of the constellation Orion. Yellow Betelgeuse is at the upper left of this image, and blue Rigel is at the lower right. The three stars of Orion’s belt are just below center. Panel (b) is a contemporary star-chart of Orion. The brightest stars are shown with their proper names and Greek letter designations. From top to bottom are, “Meissa (lambda),” “Betelgeuse (alpha),” “Bellatrix (gamma),” “Mintaka (delta),” “Alnilam (epsilon),” “Alnitak (zeta),” “Rigel (beta),” and “Saiph (kappa).” Also shown, circled in red, are the nebulae “M 78,” “M 42” and “M 43.”\" data-type=\"media\"><img alt=\"Orion. Panel (a) is a photograph of the constellation Orion. Yellow Betelgeuse is at the upper left of this image, and blue Rigel is at the lower right. The three stars of Orion’s belt are just below center. Panel (b) is a contemporary star-chart of Orion. The brightest stars are shown with their proper names and Greek letter designations. From top to bottom are, “Meissa (lambda),” “Betelgeuse (alpha),” “Bellatrix (gamma),” “Mintaka (delta),” “Alnilam (epsilon),” “Alnitak (zeta),” “Rigel (beta),” and “Saiph (kappa).” Also shown, circled in red, are the nebulae “M 78,” “M 42” and “M 43.”\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45904/4065f747a3a8dc03b963f85ad51ff409575cf260\" /> </span> <figcaption>Figure 19.7 : Objects in Orion. (a) This image shows the brightest objects in or near the star pattern of Orion, the hunter (of Greek mythology), in the constellation of Orion. (b) Note the Greek letters of Bayer’s system in this diagram of the Orion constellation. The objects denoted M42, M43, and M78 are not stars but nebulae—clouds of gas and dust; these numbers come from a list of “fuzzy objects” made by Charles Messier in 1781. (credit a: modification of work by Matthew Spinelli; credit b: modification of work by ESO, IAU and <em data-effect=\"italics\">Sky &amp; Telescope</em>)</figcaption> </figure> <p>In 1725, the English Astronomer Royal John <span class=\"no-emphasis\" data-type=\"term\" group-by=\"F\">Flamsteed</span> introduced yet another system, in which the brighter stars eventually got a number in each constellation in order of their location in the sky or, more precisely, their right ascension. (The system of sky coordinates that includes right ascension was discussed in Earth, Moon, and Sky.) In this system, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Betelgeuse</span> is called 58 Orionis and 61 Cygni is the 61st star in the constellation of Cygnus, the swan.</p> <p>It gets worse. As astronomers began to understand more and more about stars, they drew up a series of specialized star catalogs, and fans of those catalogs began calling stars by their catalog numbers. If you look at Appendix I—our list of the nearest stars (many of which are much too faint to get an ancient name, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Bayer letter</span>, or <span class=\"no-emphasis\" data-type=\"term\" group-by=\"F\">Flamsteed number</span>)—you will see references to some of these catalogs. An example is a set of stars labeled with a BD number, for “Bonner Durchmusterung.” This was a mammoth catalog of over 324,000 stars in a series of zones in the sky, organized at the Bonn Observatory in the 1850s and 1860s. Keep in mind that this catalog was made before photography or computers came into use, so the position of each star had to be measured (at least twice) by eye, a daunting undertaking.</p> <p>There is also a completely different system for keeping track of stars whose luminosity varies, and another for stars that brighten explosively at unpredictable times. Astronomers have gotten used to the many different star-naming systems, but students often find them bewildering and wish astronomers would settle on one. Don’t hold your breath: in astronomy, as in many fields of human thought, tradition holds a powerful attraction. Still, with high-speed computer databases to aid human memory, names may become less and less necessary. Today’s astronomers often refer to stars by their precise locations in the sky rather than by their names or various catalog numbers.</p> </div> <h3>The Nearest Stars</h3> <p>The closest star? <strong>The Sun</strong>. After the Sun is <strong>Proxima Centauri</strong>, part of the three-star Alpha Centauri (α Cen) star system. Proxima Centauri is about 25,219,301,250,000 miles or 40,586,533,727,000 kilometers away. So let’s look at this in other ways. <em>A 50-mile high stack of toilet paper stretched out on 1 sheet = 1 million miles scale. </em><strong>Alpha Centauri </strong>is often listed as the second closest star to Earth, <em>this is incorrect </em>. Proxima Centauri is the second-closest star and orbits Alpha Centauri.</p> <p>No known star (other than the Sun) is within 1 light-year or even 1 parsec of Earth. The stellar neighbors nearest the Sun are three stars in the constellation of Centaurus. To the unaided eye, the brightest of these three stars is <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span>, which is only 30<sup>○</sup> from the south celestial pole and hence not visible from the mainland United States. Alpha Centauri itself is a binary star—two stars in mutual revolution—too close together to be distinguished without a telescope. These two stars are 4.4 light-years from us. Nearby is a third faint star, known as <span class=\"no-emphasis\" data-type=\"term\" group-by=\"P\">Proxima Centauri</span>. Proxima, with a distance of 4.3 light-years, is slightly closer to us than the other two stars. If Proxima Centauri is part of a triple star system with the binary Alpha Centauri, as seems likely, then its orbital period may be longer than 500,000 years.</p> <p>Proxima Centauri is an example of the most common type of star, and our most common type of stellar neighbor (as we saw in Stars: A Celestial Census.) Low-mass red M dwarfs make up about 70% of all stars and dominate the census of stars within 10 parsecs (33 light-years) of the Sun. For example, a recent survey of the solar neighborhood counted 357 stars and brown dwarfs within 10 parsecs, and 248 of these are red dwarfs. Yet, if you wanted to see an M dwarf with your naked eye, you would be out of luck. These stars only produce a fraction of the Sun’s light, and nearly all of them require a telescope to be detected.</p> <p>The nearest star visible without a telescope from most of the United States is the brightest appearing of all the stars, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, which has a distance of a little more than 8 light-years. It too is a binary system, composed of a faint white dwarf orbiting a bluish-white, main-sequence star. It is an interesting coincidence of numbers that light reaches us from the Sun in about 8 minutes and from the next brightest star in the sky in about 8 years.</p> <div class=\"box-example\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Example 19.2: Calculating the Diameter of the Sun</span></h5> <p>For nearby stars, we can measure the apparent shift in their positions as Earth orbits the Sun. We wrote earlier that an object must be 206,265 AU distant to have a parallax of one second of arc. This must seem like a very strange number, but you can figure out why this is the right value. We will start by estimating the diameter of the Sun and then apply the same idea to a star with a parallax of 1 arcsecond. Make a sketch that has a round circle to represent the Sun, place Earth some distance away, and put an observer on it. Draw two lines from the point where the observer is standing, one to each side of the Sun. Sketch a circle centered at Earth with its circumference passing through the center of the Sun. Now think about proportions. The Sun spans about half a degree on the sky. A full circle has 360<sup>○</sup>. The circumference of the circle centered on Earth and passing through the Sun is given by:</p> <p><math display=\"block\"><semantics><mrow><mrow><mtext>circumference</mtext><mo>=</mo><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn></mrow></mrow><mrow><mrow><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>circumference</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mrow></annotation-xml></semantics></math></p> <p>Then, the following two ratios are equal:</p> <p><math display=\"block\"><semantics><mrow><mrow><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>diameter of </mtext></mrow><mrow><mtext>Sun</mtext></mrow><mrow><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn></mrow><mrow><mn>,000,000</mn></mrow></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>diameter of </mtext></mrow><mrow><mtext>Sun</mtext></mrow><mrow><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn></mrow><mrow><mn>,000,000</mn></mrow></mfrac></mrow></annotation-xml></semantics></math></p> <p>Calculate the diameter of the Sun. How does your answer compare to the actual diameter?</p> <h6>Solution</h6> <p>To solve for the diameter of the Sun, we can evaluate the expression above.</p> <p><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"right\"><mtext>diameter of the sun</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>811,</mn></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mn>577</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext>diameter</mtext></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"right\"><mtext> of the sun</mtext></mtd><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><mn>0.5</mn><mtext>°</mtext></mrow><mrow><mn>360</mn><mtext>°</mtext></mrow></mfrac><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>2</mn><mtext>π</mtext><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mn>93</mn><mn>,000,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr><mtr><mtd></mtd><mtd columnalign=\"left\"><mo>=</mo><mn>811,</mn><mn>577</mn><mspace width=\"0.2em\"></mspace><mtext>miles</mtext></mtd></mtr></mtable></annotation-xml></semantics></math></p> <p>This is very close to the true value of about 848,000 miles.</p> </div> <section class=\"box-exercise\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Exercise \\(\\PageIndex{1}\\)</span></h5> <p>Now apply this idea to calculating the distance to a star that has a parallax of 1 arcsec. Draw a picture similar to the one we suggested above and calculate the distance in AU. (Hint: Remember that the parallax angle is defined by 1 AU, not 2 AU, and that 3600 arcseconds = 1 degree.)</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p>&nbsp;</p> <p>206,265 AU</p> </dd> </dl> </section> <h3>Measuring Parallaxes in Space</h3> <p>The measurements of stellar parallax were revolutionized by the launch of the spacecraft Hipparcos in 1989, which measured distances for thousands of stars out to about 300 light-years with an accuracy of 10 to 20% (see Figure 19.8 and the feature on Parallax and Space Astronomy). However, even 300 light-years are less than 1% the size of our Galaxy’s main disk.</p> <p class=\"has-noteref\">In December 2013, the successor to Hipparcos, named <em data-effect=\"italics\">Gaia</em>, was launched by the European Space Agency. <em data-effect=\"italics\">Gaia</em> is measuring the position and distances to almost one billion stars with an accuracy of a few millionths of an arcsecond. <em data-effect=\"italics\">Gaia’s</em> distance limit extends well beyond Hipparcos, studying stars out to 30,000 light-years (100 times farther than Hipparcos, covering nearly 1/3 of the galactic disk). <em data-effect=\"italics\">Gaia</em> is also able to measure proper motions<sup data-type=\"footnote-number\">2</sup> for thousands of stars in the halo of the Milky Way—something that can only be done for the brightest stars right now. At the end of <em data-effect=\"italics\">Gaia’s</em> mission, we will not only have a three-dimensional map of a large fraction of our own <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Milky Way Galaxy</span>, but we will also have a strong link in the chain of cosmic distances that we are discussing in this chapter. Yet, to extend this chain beyond <em data-effect=\"italics\">Gaia’s</em> reach and explore distances to nearby galaxies, we need some completely new techniques.</p> <figure><span data-alt=\"H–R Diagram of Stars Measured by Gaia and Hipparcos. The x-axis of this graph is labeled “Spectral Type” and lists “O”, “B”, “A”, “F”, “G”, “K”, and “M” from left to right. The y-axis is labeled “Luminosity (L_Sun)” and ranges from 1/100 to 10,000. The plot includes 16,631 stars which form a Y shape, with the tail at “M” on the x-axis and the two arms splitting roughly at “G” on the x-axis and “1” on the y-axis, with the left arm extending leftward up toward “10,000” on the y-axis and the right arm extending rightward up toward “10,000”.\" data-type=\"media\"><img alt=\"H–R Diagram of Stars Measured by Gaia and Hipparcos. The x-axis of this graph is labeled “Spectral Type” and lists “O”, “B”, “A”, “F”, “G”, “K”, and “M” from left to right. The y-axis is labeled “Luminosity (L_Sun)” and ranges from 1/100 to 10,000. The plot includes 16,631 stars which form a Y shape, with the tail at “M” on the x-axis and the two arms splitting roughly at “G” on the x-axis and “1” on the y-axis, with the left arm extending leftward up toward “10,000” on the y-axis and the right arm extending rightward up toward “10,000”.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45910/63b9edc49ab27d3cac9aec3341e73d13e8542a4d\" /> </span> <figcaption>Figure 19.8 : H–R Diagram of Stars Measured by <em data-effect=\"italics\">Gaia</em> and Hipparcos. This plot includes 16,631 stars for which the parallaxes have an accuracy of 10% or better. The colors indicate the numbers of stars at each point of the diagram, with red corresponding to the largest number and blue to the lowest. Luminosity is plotted along the vertical axis, with luminosity increasing upward. An infrared color is plotted as a proxy for temperature, with temperature decreasing to the right. Most of the data points are distributed along the diagonal running from the top left corner (high luminosity, high temperature) to the bottom right (low temperature, low luminosity). These are main sequence stars. The large clump of data points above the main sequence on the right side of the diagram is composed of red giant stars. (credit: modification of work by the European Space Agency)</figcaption> </figure> <div class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Making Connections: Parallax and Space Astronomy</span></h5> <p>One of the most difficult things about precisely measuring the tiny angles of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"p\">parallax</span> shifts from Earth is that you have to observe the stars through our planet’s atmosphere. As we saw in Astronomical Instruments, the effect of the atmosphere is to spread out the points of starlight into fuzzy disks, making exact measurements of their positions more difficult. Astronomers had long dreamed of being able to measure parallaxes from space, and two orbiting observatories have now turned this dream into reality.</p> <p>The name of the Hipparcos satellite, launched in 1989 by the European Space Agency, is both an abbreviation for High Precision Parallax Collecting Satellite and a tribute to Hipparchus, the pioneering Greek astronomer whose work we discussed in the Observing the Sky: The Birth of Astronomy. The satellite was designed to make the most accurate parallax measurements in history, from 36,000 kilometers above Earth. However, its onboard rocket motor failed to fire, which meant it did not get the needed boost to reach the desired altitude. Hipparcos ended up spending its 4-year life in an elliptical orbit that varied from 500 to 36,000 kilometers high. In this orbit, the satellite plunged into Earth’s radiation belts every 5 hours or so, which finally took its toll on the solar panels that provided energy to power the instruments.</p> <p>Nevertheless, the mission was successful, resulting in two catalogs. One gives positions of 120,000 stars to an accuracy of one-thousandth of an arcsecond—about the diameter of a golf ball in New York as viewed from Europe. The second catalog contains information for more than a million stars, whose positions have been measured to thirty-thousandths of an arcsecond. We now have accurate parallax measurements of stars out to distances of about 300 light-years. (With ground-based telescopes, accurate measurements were feasible out to only about 60 light-years.)</p> <p>In order to build on the success of Hipparcos, in 2013, the European Space Agency launched a new satellite called <em data-effect=\"italics\">Gaia</em>. Because <em data-effect=\"italics\">Gaia</em> carries larger telescopes than Hipparcos, it can observe fainter stars and measure their positions 200 times more accurately. The main goal of the Gaia mission is to make an accurate three-dimensional map of that portion of the Galaxy within about 30,000 light-years by observing 1 billion stars 70 times each, measuring their positions and hence their parallaxes as well as their brightnesses.</p> <p>For a long time, the measurement of parallaxes and accurate stellar positions was a backwater of astronomical research—mainly because the accuracy of measurements did not improve much for about 100 years. However, the ability to make measurements from space has revolutionized this field of astronomy and will continue to provide a critical link in our chain of cosmic distances.</p> </div> <div class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Link to Learning</span></h5> <p>The European Space Agency (ESA) maintains a <a href=\"https://openstax.org/l/30GaiaMission\" rel=\"noopener nofollow\" target=\"_blank\">Gaia mission website</a> where you can learn more about the Gaia mission and to get the latest news on <em data-effect=\"italics\">Gaia</em> observations.</p> <p>To learn more about Hipparcos, explore this <a href=\"https://openstax.org/l/30Hipparcos\" rel=\"noopener nofollow\" target=\"_blank\">European Space Agency webpage</a> with an ESA vodcast <em data-effect=\"italics\">Charting the Galaxy—from Hipparcos to Gaia</em>.</p> </div> <h3 data-type=\"footnote-refs-title\">Footnotes</h3> <ul data-bullet-style=\"none\" data-list-type=\"bulleted\"> <li data-type=\"footnote-ref\"><a href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/19:_Celestial_Distances/19.03:_Surveying_the_Stars#footnote-ref1\" role=\"doc-backlink\">1</a><span data-type=\"footnote-ref-content\">To</span><span data-type=\"footnote-ref-content\"> have some basis for comparison, the dwarf planet Pluto orbits at an average distance of 40 AU from the Sun, and the dwarf planet Eris is currently roughly 96 AU from the Sun.</span></li> <li data-type=\"footnote-ref\"><a href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/19:_Celestial_Distances/19.03:_Surveying_the_Stars#footnote-ref2\" role=\"doc-backlink\">2</a><span data-type=\"footnote-ref-content\">Proper</span><span data-type=\"footnote-ref-content\"> motion (as discussed in Analyzing Starlight<em data-effect=\"italics\">,</em> is the motion of a star across the sky (perpendicular to our line of sight.)</span></li> </ul>"
