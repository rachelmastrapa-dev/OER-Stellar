            - application "Rich Text Editor, editarea" [ref=f518e266]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f518e280]: "<h2>Introduction</h2> <p class=\"lt-phys-3819 lt-phys-64835\">How and when did galaxies like our Milky Way form? Which formed first: stars or galaxies? Can we see direct evidence of the changes galaxies undergo over their lifetimes? If so, what determines whether a galaxy will be spiral or elliptical? How much of a galaxy’s development is determined by what it looks like when it forms and how much is influenced by its environment?</p> <p class=\"lt-phys-3819 lt-phys-64835\">Astronomers today have the tools needed to explore the universe almost back to the time it began. The huge telescopes and sensitive detectors built in the last decades make it possible to obtain both images and spectra of galaxies so distant that their light has traveled to reach us for more than 13 billion years, more than 90% of the way back to the Big Bang. We can use the finite speed of light and the vast size of the universe as a cosmic time machine to peer back and observe how galaxies formed and evolved over time. Studying galaxies so far away in any detail is always a major challenge, largely because their distance makes them appear very faint.</p> <section class=\"box-objectives\"> <h5 class=\"box-legend lt-phys-66857\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <p class=\"lt-phys-66857\">By the end of this section, you will be able to:</p> <ul> <li class=\"lt-phys-64836\">Describe the major differences observed between galaxies seen in the distant, early universe and galaxies seen in the nearby universe today</li> <li class=\"lt-phys-64837\">Explain how galaxies grow by merging with other galaxies and by absorbing smaller galaxies</li> <li class=\"lt-phys-66855\">Explain the cosmological principle and summarize the evidence that it applies on the largest scales of the known universe</li> <li class=\"lt-phys-66855\">Describe the contents of the Local Group of galaxies</li> <li class=\"lt-phys-66855\">Distinguish among groups, clusters, and superclusters of galaxies</li> <li class=\"lt-phys-66855\">Define the largest structures seen in the universe, such as filaments and voids</li> <li class=\"lt-phys-66856\">Summarize the evidence for dark matter in most galaxies</li> <li class=\"lt-phys-66856\">Explain how we know that galaxy clusters are dominated by dark matter</li> <li class=\"lt-phys-66857\">Summarize the main theories attempting to explain how individual galaxies formed</li> <li class=\"lt-phys-66857\">Describe the formation of large galactic structures after the Big Bang.</li> </ul> </section> <p class=\"lt-phys-3819 lt-phys-64835\">{{template.ShowOrg()}}</p> <p><strong>Thumbnail</strong>:“This NASA Hubble Space Telescope image of the Antennae galaxies (NGC 4038 &amp; 4039) is the sharpest yet of this merging pair of galaxies. During the course of the collision, billions of stars will be formed. The brightest and most compact of these star birth regions are called super star clusters. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; <a href=\"https://www.nasa.gov/\" target=\"_blank\" title=\"NASA\">NASA, ESA, and the Hubble Heritage Team (STScI/AURA)-ESA/Hubble Collaboration</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Antennae_galaxies_xl.jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p>"
