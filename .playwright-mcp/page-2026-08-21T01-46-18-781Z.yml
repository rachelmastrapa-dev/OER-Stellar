                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{3}\\)" [ref=f112e56]':
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.09:_Accessible_Descriptions#Figure_4.3.3_Spectra_of_Elements
                      - text: .
                  - paragraph [ref=f112e57]: Spectra are extremely useful for identifying small quantities of different elements in a mixture. Several elements (Rb, Cs, Tl) were discovered by observing spectral lines that did not correspond to any of the then-known elements. Helium, which is present only in traces on Earth, was first discovered by observing the spectrum of the Sun. This discovery inspired astronomers to collect spectra of the stars to identify their compositions.
                  - heading "Types of Spectra" [level=2] [ref=f112e58]
                  - paragraph [ref=f112e59]: "A continuous spectrum is an array of all wavelengths or colors of the rainbow. A continuous spectrum can serve as a backdrop from which the atoms of much less dense gas can absorb light. An absorption spectrum consists of a series or pattern of dark lines superimposed upon the continuous spectrum of a source. An emission spectrum appears as a pattern or series of bright lines. Figure \\(\\PageIndex{4}\\) includes examples of all three types of spectra. The next sections describe how each of these spectra is produced."
                  - figure [ref=f112e60]:
                    - 'img "Types of spectra: continuous, emission, and absorption. Details in caption." [ref=f112e61]'
                    - generic [ref=f112e62]:
                      - text: "Figure \\(\\PageIndex{4}\\): A continuous spectrum includes the full range of light and is produced by a light source. An emissions spectrum is mostly dark with a few bright lines. An absorption spectrum is similar to a continuous spectrum, but has a few small, dark gaps where there are fewer photons. ("
                      - link "CC BY 3.0" [ref=f112e63]:
                        - /url: https://creativecommons.org/licenses/by/3.0/
                      - text: ;
                      - link "Stephen Lower" [ref=f112e64]:
                        - /url: http://www.chem1.com/SKL/SKLchem/
                      - text: via
                      - link "Chem 1 (Lower)" [ref=f112e65]:
                        - /url: http://www.chem1.com/acad/webtext/virtualtextbook.html
                      - text: "). Alternate description of Figure \\(\\PageIndex{4}\\)."
                  - heading "Continuous Spectrum" [level=3] [ref=f112e66]
                  - paragraph [ref=f112e67]: "When sunlight is refracted by rain droplets into a rainbow or by a prism onto a viewing screen, we see the visible part of the spectrum. When you look at the spectrum of sunlight, you will see a blend of colors. This is called a continuous spectrum because there is light at every wavelength, without any dark gaps, Figure \\(\\PageIndex{5}\\). This is like a rainbow, produced when sunlight passes through raindrops, which act as prisms."
                  - figure [ref=f112e68]:
                    - img "Visible continuous spectrum. Details in caption." [ref=f112e69]
                    - generic [ref=f112e70]:
                      - text: "Figure \\(\\PageIndex{5}\\): The spectrum of light that includes all of the colors of the rainbow. ("
                      - link "CC0" [ref=f112e71]:
                        - /url: https://creativecommons.org/publicdomain/zero/1.0/
                      - text: ;
                      - link "SiriusB" [ref=f112e72]:
                        - /url: https://commons.wikimedia.org/wiki/User:SiriusB
                      - text: via
                      - link "Wikimedia Commons" [ref=f112e73]:
                        - /url: https://commons.wikimedia.org/wiki/File:Linear_visible_spectrum_ciecam02.png
                      - text: ).
                  - paragraph [ref=f112e74]:
                    - text: "The continuous spectrum in Figure \\(\\PageIndex{5}\\), covers the wavelength range from 360 to 770 nanometers (nm). These wavelengths are very small considering that one nanometer is 10"
                    - superscript [ref=f112e75]: "-9"
                    - text: meters. Near 360 nm, the spectrum appears very dark, not because the light is a dark color, but because the light is not detectable by the human eye. In fact, the wavelengths on this spectrum that are less than 400 nm are not visible, but ultraviolet. When scientists create images that represent colors that can't be seen by humans, they often replace the invisible color with a color that humans can see. In this case, the ultraviolet light is represented by the color black. Since a visible light source does not emit the same amount of light at each wavelength, this end of the spectrum is also darker because there are fewer photons emitted at these wavelengths.
                  - paragraph [ref=f112e76]: "The boundary between ultraviolet and visible light is not very sharp, but by 440 nm, the spectrum is bright violet. As the wavelength increases, the light passes through blue (450-485 nm), cyan (485-500 nm), green (500-565 nm), yellow (565-590 nm), orange (590-625 nm), and red (625-740 nm). The red region becomes very dark by 700 nm, in this case solely because there are fewer visible light photons. The infrared range begins at 780 nm, beyond the scale of this graph. Note that this chart measures wavelength in nanometers (nm), while Figure \\(\\PageIndex{3}\\) measures wavelengths in Angstroms. They still represent the same wavelength, but the numbers are smaller in nanometers because 1 nm = 10 Angstroms."
                  - heading "Emission Spectra" [level=3] [ref=f112e77]
                  - paragraph [ref=f112e78]: Heat a piece of iron up to near its melting point and it will emit a broad continuous spectrum that the eye perceives as orange-yellow. But if you zap the iron with an electric spark, some of the iron atoms will vaporize and have one or more of their electrons temporarily knocked out of them. As they cool down, the electrons will recombine with the iron ions, losing energy as they move in toward the nucleus and giving up this excess energy as light. The spectrum of this light is a series of discrete wavelengths which we call an emission spectrum.
                  - paragraph [ref=f112e79]:
                    - text: An
                    - strong [ref=f112e80]:
                      - link "emission spectrum" [ref=f112e81]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#emission spectrum
                    - text: is produced when electrons that had previously been excited to values of n greater than 1 fall back to the ground state (n = 1), either directly, or by way of intermediate n states. This can also happen when a gas is heated. The heat speeds up the individual atoms in the gas, which can lead to collisions. Those collisions may knock an electron off of an atom. Eventually the electron is captured by an ion, an atom missing one or more electrons. Then the process continues as described above and the hot gas releases emission lines related to the chemical composition of the gas.
                  - figure [ref=f112e82]:
                    - img "Emission spectrum of hydrogen. Details in caption." [ref=f112e83]
                    - generic [ref=f112e84]:
                      - text: "Figure \\(\\PageIndex{6}\\): Hydrogen emits 4 bright lines in the visible which are part of the Balmer series. ("
                      - link "CC0" [ref=f112e85]:
                        - /url: https://creativecommons.org/publicdomain/zero/1.0/
                      - text: ;
                      - link "Nucleus hydro elemon" [ref=f112e86]:
                        - /url: https://commons.wikimedia.org/wiki/User:Nucleus_hydro_elemon
                      - text: via
                      - link "Wikimedia Commons" [ref=f112e87]:
                        - /url: https://commons.wikimedia.org/wiki/File:Atomic_spectrum_of_hydrogen.svg
                      - text: ).
                  - paragraph [ref=f112e88]: "Figure \\(\\PageIndex{6}\\) includes 6 emission lines of hydrogen in the visible range from 360 to 600 nm. The red line at 656 nm represents the electron transition n = 3→2. The rest of the Balmer series includes a cyan line at 486 nm representing n = 4→2, a blue line at 434 nm representing n = 5→2, and a violet line at 410 nm representing n = 6→2. The next transition, n = 7→2, is in the ultraviolet."
                  - paragraph [ref=f112e89]: "If you live in a city, you probably see atomic line light sources every night! Neon signs are the most colorful and spectacular, but high-intensity street lighting is the most widespread source. These streetlights use heated sodium gas (maybe somewhat outdated example? most streetlights are an awful LED light nowadays), since the emissions spectrum of sodium has several bright yellow lines, Figure (\\PageIndex{3}\\)."
                  - heading "Absorption Spectra" [level=3] [ref=f112e90]
                  - paragraph [ref=f112e91]:
                    - text: If light from a continuous source, such as a star, passes through an atmosphere of hydrogen, such as the star's outer atmosphere, those wavelengths that correspond to the allowed transitions are absorbed, and appear as dark lines superimposed on the continuous spectrum. An
                    - strong [ref=f112e92]:
                      - link "absorption spectrum" [ref=f112e93]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#absorption spectrum
                    - text: will also form if light behind a cloud of gas absorbs photons at the cloud’s energy level while the rest of the photons pass through the cloud.
                  - paragraph [ref=f112e94]: "These dark absorption lines were first observed by William Wollaston in his study of the solar spectrum. In 1814, Joseph von Fraunhofer (1787-1826) re-discovered them and made accurate measurements of 814 lines, including the four most prominent of the Balmer lines, Figure \\(\\PageIndex{7}\\). While this hand-drawn spectrum covers the entire visible range, it is presented in order of decreasing wavelength, from red to violet, unlike the other spectra in this section. It also has no numbered wavelength scale, but instead the names of the colors are noted at the bottom. Above the spectrum, some of the stronger lines are labeled with letters. There is also a chart representing the brightness, or number of photons of each wavelength of the spectrum. The peak brightness is near the yellow area of the spectrum. The brightness steadily decreases in both directions, toward red and violet. It is impossible to tell from the figure, but there are 514 individual absorption lines."
                  - figure [ref=f112e95]:
                    - img "Absorption spectrum of the Sun by Josef Fraunhofer. Details in caption." [ref=f112e96]
                    - generic [ref=f112e97]:
                      - text: "Figure \\(\\PageIndex{7}\\): Fraunhofer Solar Spectrum. This absorption spectrum of the Sun was collected an illustrated by Joseph von Fraunhofer in 1814. ("
                      - link "CC BY 3.0" [ref=f112e98]:
                        - /url: https://creativecommons.org/licenses/by/3.0/
                      - text: ;
                      - link "Stephen Lower" [ref=f112e99]:
                        - /url: http://www.chem1.com/SKL/SKLchem/
                      - text: via
                      - link "Chem 1 (Lower)" [ref=f112e100]:
                        - /url: http://www.chem1.com/acad/webtext/virtualtextbook.html
                      - text: "). Alternate description of Figure \\(\\PageIndex{7}\\)."
                  - paragraph [ref=f112e101]: Atoms that have absorbed specific photons from a passing beam of white light and become excited generally de-excite themselves and emit that light again in a very short time. If the light is re-emitted, how are dark spectral lines ever produced? Why doesn’t this reemitted light quickly fill in the darker absorption lines? Imagine a beam of white light coming toward you through some cooler gas. Some of the reemitted light is actually returned to the beam of white light you see, but this fills in the absorption lines only to a slight extent. The reason is that the atoms in the gas reemit light in all directions, and only a small fraction of the reemitted light is in the direction of the original beam. There are still some photons collected in the position of the dark lines, but the amount is far fewer than the rest of the spectrum. It is more accurate to say that absorption lines are darker than the rest of the spectrum.
                  - heading "Analysis of the Solar Spectrum" [level=2] [ref=f112e102]
                  - paragraph [ref=f112e103]: The dark lines in the solar spectrum thus give evidence of certain chemical elements between us and the Sun absorbing those wavelengths of sunlight. Because the space between us and the Sun is pretty empty, astronomers realized that the atoms doing the absorbing must be in a thin atmosphere of cooler gas around the Sun. This outer atmosphere is not all that different from the rest of the Sun, just thinner and cooler. Thus, we can use what we learn about its composition as an indicator of what the whole Sun is made of.
                  - paragraph [ref=f112e104]: In 1860, German physicist Gustav Kirchhoff became the first person to use spectroscopy to identify an element in the Sun when he found the spectral signature of sodium gas. In the years that followed, astronomers found many other chemical elements in the Sun and stars. In fact, the element helium was found first in the Sun from its spectrum and only later identified on Earth. The word helium comes from Helios, the Greek name for the Sun.
                  - paragraph [ref=f112e105]: "For comparison, Figure \\(\\PageIndex{8}\\) is a spectrum collected by a modern telescope and spectrometer at Kitt Peak National Observatory in Arizona. The spectrum covers the same wavelength range as Figure \\(\\PageIndex{7}\\), from 400 to 700 nm. However, this spectrum is significantly larger. There are 50 individual slices of the spectrum stacked on top of each other. Roughly 10 slices are red, 5 are orange, and so on to violet. Each slice only covers 6 nm of the 300 nm range of the spectrum. The reason this figure is so much larger is because the spectrometer used to collect it has significantly higher resolution than von Fraunhofer's spectroscope. The modern spectrometer can split the spectrum into much smaller pieces representing tiny differences in wavelength. Each 6 nm slice contains dozens of individual spectral lines that would be impossible to detect in a lower resolution spectrometer. The entire spectrum has thousands of lines. Each of those lines carries information about the composition of the Sun. This spectrum is a powerful demonstration of the advances in astronomical technology in the last 200 years."
                  - figure [ref=f112e106]:
                    - img "A high-resolution spectrum of the Sun. Details in caption." [ref=f112e107]
                    - generic [ref=f112e108]:
                      - text: "Figure \\(\\PageIndex{8}\\): Solar Absorption Spectrum. This spectrum was collected at the National Solar Observatory at Kitt Peak. See text for details. ("
                      - link "CC BY 4.0" [ref=f112e109]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "N.A. Sharp/KPNO/NOIRLab/NSO/NSF/AURA" [ref=f112e110]:
                        - /url: https://kpno.noirlab.edu/
                      - text: via
                      - link "Wikimedia Commons" [ref=f112e111]:
                        - /url: https://commons.wikimedia.org/wiki/File:High_resolution_solar_spectrum_(noao-sun).jpg
                      - text: ).
                  - paragraph [ref=f112e112]: Now that we understand that the dark lines that Wollaston and von Fraunhofer saw over 200 years ago are caused by atoms in the Sun's atmosphere absorbing the photons at those wavelengths. We also know that those lines can be used to identify which elements, such as hydrogen or helium, are in the atmosphere of the Sun. As scientists were collecting measurements in the lab, astronomers were busy collecting spectra of the stars. Eventually, astronomers began using the presence of absorption and emission lines to analyze the composition of other stars and clouds of gas in space.
