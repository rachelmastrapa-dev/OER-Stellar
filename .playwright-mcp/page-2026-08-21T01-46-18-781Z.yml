                  - heading "Atomic Transitions" [level=2] [ref=f112e2]
                  - paragraph [ref=f112e3]: The electrons in an atom can absorb or release energy, changing how they orbit the nucleus. These transitions from different energy states in the atom occur at specific energies that can be observed by astronomers in the form of light.
                  - heading "Electron Energy Levels" [level=3] [ref=f112e4]
                  - paragraph [ref=f112e5]: Let's review the properties of atomic matter. Atoms are made of protons, electrons, and neutrons. The nucleus of an atom contains the protons and neutrons and most of the mass of the atom and has a positive charge. Electrons have a negative charge. The opposite charges attract each other holding the atom together. Scientists say that the electron orbits the proton, but this orbit is not at all like the way the Earth orbits the Sun. The Earth could technically orbit the Sun at any distance by increasing or decreasing its speed, moving closer or farther from the Sun. Changing speed requires a change in energy. If there was a large enough source of energy, the Earth could move any distance, small or large, away from the Sun.
                  - paragraph [ref=f112e6]:
                    - text: Unlike planets, the electrons in atoms can't be at any distance from the nucleus. In fact, electrons can only orbit at specific distances from the nucleus, corresponding to specific energies that scientists call
                    - strong [ref=f112e7]:
                      - link "energy levels" [ref=f112e8]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#energy levels
                    - text: . Electrons can move, or transition, from one energy level to another by absorbing or releasing energy. The energy of these transitions is also fixed. Think of transitions as stair steps. When using steps, the height of the step is fixed, so you can only move upwards or downwards by a fixed amount. If, instead, you were walking on a ramp, you could move up or down any amount because movement on a ramp is not fixed to specific amounts.
                  - paragraph [ref=f112e9]:
                    - text: "A hydrogen atom consists of only one electron orbiting one proton, so it is the simplest example of energy levels. Figure \\(\\PageIndex{1}\\) depicts the energy levels of hydrogen as black concentric circles within the light blue area that represents the atom of hydrogen. The proton is not shown, but would be in the center of the circles. The"
                    - strong [ref=f112e10]:
                      - link "quantum number" [ref=f112e11]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#quantum number
                    - text: ", n, represents the possible energy levels. The lowest allowed value of n is 1, because the electron is as close to the proton as it can get and has the lowest amount of energy. This is the most stable state of the hydrogen atom and is called the"
                    - strong [ref=f112e12]:
                      - link "ground state" [ref=f112e13]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#ground state
                    - text: ". The ground state, n = 1, is the central circle in Figure \\(\\PageIndex{1}\\). The next energy level is n = 2, which represents a higher energy level and is represented by a circle larger than the circle for n = 1. The next larger circle represents n = 3. The levels for n = 4 and n = 5 are represented by partial circles on the left side of the atom that are cut short because they represent circles that are larger than the figure."
                  - paragraph [ref=f112e14]:
                    - text: When an electron moves to a higher energy level, it is called
                    - strong [ref=f112e15]:
                      - link "excitation" [ref=f112e16]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#excitation
                    - text: ". If a hydrogen atom absorbs an amount of energy that corresponds to the difference between that of n=1 and some higher value of n, the electron moves to the higher orbit and the atom is said to be in an excited state. Excited states are unstable and quickly drop to the ground state, but not always in a single step. For example, the electron, represented by a light blue dot in Figure \\(\\PageIndex{1}\\) is initially located in the n= 3 state. This electron can move either directly to the ground state or to the n = 2 state, and then move to n=1. As an analogy, when walking down the stairs, you can choose to take one step at a time, or take two, or jump all the way to the bottom. Unlike a staircase where the change in height is always equal, the difference between each energy level is a unique amount. That means that the change in energy from n=3→2 is not the same as the change in energy from n=2→1. Using the staircase analogy, this would mean that every step would be a different height compared to another."
                  - figure [ref=f112e17]:
                    - img "Electron energy levels of hydrogen. Details in Caption." [ref=f112e18]
                    - generic [ref=f112e19]:
                      - text: "Figure \\(\\PageIndex{1}\\): In this simplified model of a hydrogen atom, the concentric circles represent permitted orbits or energy levels. ("
                      - link "CC BY 4.0" [ref=f112e20]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f112e21]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f112e22]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: "). Accessible description of Figure \\(\\PageIndex{1}\\)."
                  - paragraph [ref=f112e23]:
                    - text: "All of these electronic transitions require the absorption or loss of energy. Where does the energy to excite electrons come from, and what type of energy is released when an electron drops to a lower energy state? The answer is electromagnetic radiation, or light. All electromagnetic waves contain an amount of energy directly related to its frequency. The energy of an individual photon can be calculated using the equation: \\[E=hf \\nonumber\\] where E is the amount of energy, h is the Planck constant, 6.626 x 10"
                    - superscript [ref=f112e24]: "-34"
                    - text: J s, and f is the frequency of the photon. In astronomy, we refer to different types of electromagnetic radiation by wavelength. The wavelength of a photon, (include lambda
                    - generic [ref=f112e25]: sybmol
                    - text: "here? I can't figure out the right parentheses combo -Caitlin), is equal to photon's frequency divided by the speed of light, c. We can rewrite the equation for the energy of a photon to: (I think students may get confused between the text description and the rearranged equation without steps for rearranging shown. Maybe just show one step, or include a short rearrange \"by dividing...\"?) \\[E=\\dfrac{hc}{\\lambda} \\nonumber\\] Photons can have almost any energy, and some of them can be exactly equal to the energy of electronic transitions."
                  - paragraph [ref=f112e26]:
                    - text: Suppose a beam of white light, which consists of photons of all visible wavelengths, shines through a gas of atomic hydrogen. A photon of wavelength 656 nanometers has just the right energy to raise an electron in a hydrogen atom from the second to the third orbit. Thus, as all the photons of different energies stream by the hydrogen atoms, photons with this particular wavelength can be absorbed by those atoms whose electrons are orbiting on the second level. When they are absorbed, the electrons on the second level will move to the third level, and a number of the photons of this wavelength and energy will be missing from the general stream of white light. The lack of photons at the specific wavelength will produce a dark gap in the spectrum, called a
                    - strong [ref=f112e27]:
                      - link "spectral line" [ref=f112e28]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#spectral line
                    - text: . Other photons will have the right energies to raise electrons from the second to the fourth orbit, or from the first to the fifth orbit, and so on. Only photons with these exact energies can be absorbed. All of the other photons will stream past the atoms untouched. Thus, hydrogen atoms absorb light at only certain wavelengths and produce dark spectral lines at those wavelengths in the spectrum we see.
                  - paragraph [ref=f112e29]: "When we turn off the light source, the excited electrons drop back down from higher to lower energy levels and emit photons of light. These photons will have energies or wavelengths that correspond to the energy difference between permissible orbits. Figure \\(\\PageIndex{1}\\) includes a violet arrow extending from the n = 5 circle to the n = 2 circle representing the transition n = 5→2 which produces the violet spectral line. The blue-green arrow represents the n = 4→2 transition that produces the blue-green spectral line, and the red arrow is the n = 3→2 transition that produces the red spectral line. Since the light source is off, the spectrum will appear mostly dark, with individual bright lines from the photons released by the electronic transitions."
                  - paragraph [ref=f112e30]: We have described how certain discrete amounts of energy can be absorbed by an atom, raising it to an excited state and moving one of its electrons farther from its nucleus. If enough energy is absorbed, the electron can be completely removed from the atom—this is called ionization. The atom is then called an ion. Even greater amounts of energy must be absorbed by the ion, to remove an additional electron deeper in the structure of the atom. If enough energy is available, an atom can become completely ionized, losing all of its electrons. A hydrogen atom, having only one electron to lose, can be ionized only once. A helium atom can be ionized twice, and an oxygen atom up to eight times. (this exact sentence was in the previous section, maybe reword if wanting to include here too)
                  - paragraph [ref=f112e31]: Note that this model of specific energy levels is a simplification of reality. The energy levels are not truly an exact value, but a range of values. More complicated and accurate models of the atom belong in a higher level course. For the purposes of this textbook, this model is good enough.
                  - heading "Hydrogen's Energy Levels" [level=3] [ref=f112e32]
                  - paragraph [ref=f112e33]: The hydrogen spectrum was the first to be observed by Ånders Ångström in the 1860's. Johann Balmer, a German high school teacher, discovered a simple mathematical formula that related the wavelengths of the various lines that are observable in the visible and near-UV parts of the spectrum. This set of lines is now known as the Balmer Series.
                  - 'figure "Figure \\(\\PageIndex{2}\\): Each series is defined by the energy level that an electron is excited from or where it ends its downward movement. To provide a compact display, the vertical energy scale has been distorted and only the longest-wavelength transitions for each series are depicted as arrows. (CC BY 3.0; Stephen Lower via Chem 1 (Lower)). Alternate description of Figure \\(\\PageIndex{2}\\)." [ref=f112e34]':
                    - img "Energy level diagram of hydrogen. Details in caption." [ref=f112e35]
                    - generic [ref=f112e36]:
                      - text: "Figure \\(\\PageIndex{2}\\): Each series is defined by the energy level that an electron is excited from or where it ends its downward movement. To provide a compact display, the vertical energy scale has been distorted and only the longest-wavelength transitions for each series are depicted as arrows. ("
                      - link "CC BY 3.0" [ref=f112e37]:
                        - /url: https://creativecommons.org/licenses/by/3.0/
                      - text: ;
                      - link "Stephen Lower" [ref=f112e38]:
                        - /url: http://www.chem1.com/SKL/SKLchem/
                      - text: via
                      - link "Chem 1 (Lower)" [ref=f112e39]:
                        - /url: http://www.chem1.com/acad/webtext/virtualtextbook.html
                      - text: ). Alternate description of Figure \(\
                      - generic [ref=f112e40]: PageIndex
                      - text: "{2}\\)."
                  - paragraph [ref=f112e41]: "The lines of the hydrogen spectrum can be organized into different series according to the value of n at which the emission terminates, or at which absorption originates. In Figure \\(\\PageIndex{2}\\), energy levels are represented by horizontal black lines, with n = 1 at the bottom and increasing upwards. As the energy levels increase the lines are closer to each other until after n = 8 the top of the figure is labeled continuum, representing where an electron is removed from an atom. Each energy level is labeled with the name of the series and the transitions are represented by red arrows. The first few series are named after their discoverers. The most well-known and first-observed of these is the Balmer series (n = 2), which lies mostly in the visible region of the spectrum. The Lyman lines (n = 1) are in the ultraviolet. Paschen (n = 3), Brackett (n = 4), and Pfund (n = 5) series are in the infrared."
                  - heading "Ionization and Spectral Lines" [level=3] [ref=f112e42]
                  - paragraph [ref=f112e43]: An atom that has become positively ionized has lost a negative charge and is left with a net positive charge. The positively charged ion exerts a strong attraction on any free electron. Eventually, one or more electrons will be captured and the atom will become neutral. During the electron-capture process, the atom emits one or more photons. Which photons are emitted depends on whether the electron is captured at once to the lowest energy level of the atom or stops at one or more intermediate levels on its way to the lowest available level. Along with absorbing photons, atoms can also be ionized by collisions with other particles. The rate at which such collisional ionizations occur depends on the speeds of the atoms and therefore on the temperature of the gas. The hotter the gas, the more of its atoms will be ionized.
                  - paragraph [ref=f112e44]: "The rate at which ions and electrons recombine also depends on their relative speeds, or the temperature. In addition, it depends on the density of the gas: the higher the density, the greater the chance for recapture, because the different kinds of particles are crowded more closely together. Knowing the temperature and density of a gas means it is possible to calculate the fraction of atoms that have been ionized once, twice, and so on. In the Sun, for example, we find that most of the hydrogen and helium atoms in its atmosphere are neutral, whereas most of the calcium atoms, as well as many other heavier atoms, are ionized once."
                  - paragraph [ref=f112e45]: The energy levels of an ionized atom are entirely different from those of the same atom when it is neutral. Each time an electron is removed from the atom, the energy levels of the ion, and thus the wavelengths of the spectral lines it can produce, change. This helps astronomers differentiate the ions of a given element. Ionized hydrogen, having no electron, can produce no absorption lines.
                  - heading "Identifying Elements" [level=3] [ref=f112e46]
                  - paragraph [ref=f112e47]: The science of spectroscopy starts in the lab, where scientists observe the spectra of different elements with the spectrometer. What scientists noted is that each element or compound has their own signature spectrum. This agreed with the models predicting that electrons orbit at specific energy levels. Some elements may share the energy of a few transitions, but each element has a unique set of possible energy levels. Therefore, the spectrum of each element is unique. In other words, each particular gas can absorb or emit only certain wavelengths of the light peculiar to that gas. It is the precise pattern of wavelengths that makes the signature of each element unique.
                  - paragraph [ref=f112e48]: How did they make these measurements? Researchers did this by passing light through various elements, using containers with a small amount of a gas in them. This produced a continuum spectrum with gaps. When, they heated the gas they observed an overall dark spectrum with individual bright lines. In both types of experiments on the same type of gas, for example hydrogen, the dark gaps or bright lines were at the same position. They concluded that each element has its own characteristic spectrum which can be used to identify the element, like a fingerprint. The different types of spectra are discussed in the next section.
                  - paragraph [ref=f112e49]: "In these experiments, if the gas was pure hydrogen, it would emit one pattern of lines. When it was pure sodium, it would emit a different pattern. A mixture of hydrogen and sodium emitted both sets of spectral lines. From such experiments, scientists began to see that different substances showed distinctive spectral signatures by which their presence could be detected, Figure \\(\\PageIndex{3}\\). Note that the wavelength range in this figure is from 3800 to 7500 Angstroms. Later in this section the wavelength range of the spectra will be in nanometers instead of Angstroms. One nanometer is equal to 10 angstroms, so just remove a zero from the Angstrom to get the value in nanometers (nm). For example, hydrogen has a single red line at 656 nm or 6560 Angstroms."
                  - figure [ref=f112e50]:
                    - img "A continuous spectrum and spectra of several elements. Details in caption." [ref=f112e51]
                    - generic [ref=f112e52]:
                      - text: "Figure \\(\\PageIndex{3}\\): The spectra of sodium, hydrogen, calcium, and mercury gases have different patterns of lines. ("
