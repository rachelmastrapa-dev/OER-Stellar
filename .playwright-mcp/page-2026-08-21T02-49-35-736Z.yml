              - listitem [ref=f488e113]: Describe the properties and features of elliptical, spiral, and irregular galaxies
              - listitem [ref=f488e114]: Describe the methods through which astronomers can estimate the mass of a galaxy
              - listitem [ref=f488e115]: Characterize each type of galaxy by its mass-to-light ratio
              - listitem [ref=f488e116]: Describe the use of variable stars to estimate distances to galaxies
              - listitem [ref=f488e117]: Explain how standard bulbs and the Tully-Fisher relation can be used to estimate distances to galaxies
              - listitem [ref=f488e118]: Explain how to use Hubble’s law to determine distances to remote galaxies
              - listitem [ref=f488e119]: Describe models for the nature of an expanding universe
