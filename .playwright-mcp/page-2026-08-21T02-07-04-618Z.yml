            - application "Rich Text Editor, editarea" [ref=f238e318]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f238e332]: "<h3 class=\"lt-phys-64760\">Proper Motion</h3> <p class=\"lt-phys-64760\">There is another type of motion stars can have that cannot be detected with stellar spectra. Unlike radial motion, which is along our line of sight (i.e., toward or away from Earth), this motion, called <span data-type=\"term\" group-by=\"p\">proper motion</span>, is <em data-effect=\"italics\">transverse</em>: that is, across our line of sight. We see it as a change in the relative positions of the stars on the celestial sphere (Figure 17.11). These changes are very slow. Even the star with the largest proper motion takes 200 years to change its position in the sky by an amount equal to the width of the full Moon, and the motions of other stars are smaller yet.</p> <figure><span data-alt=\"Photographs of Barnard’s Star demonstrating its large proper motion. At left (a) the star is seen in the center of an image taken in 1985, along with several background stars. At center (b) is the same field as photographed in 1995. The background stars have not moved, but Barnard’s Star has moved downward from the center of the image (where is was seen in 1985). At right (c) is the same field in 2005. The background stars have again not moved, and Barnard’s Star is now near the bottom of the image.\" data-type=\"media\"><img alt=\"Photographs of Barnard’s Star demonstrating its large proper motion. At left (a) the star is seen in the center of an image taken in 1985, along with several background stars. At center (b) is the same field as photographed in 1995. The background stars have not moved, but Barnard’s Star has moved downward from the center of the image (where is was seen in 1985). At right (c) is the same field in 2005. The background stars have again not moved, and Barnard’s Star is now near the bottom of the image.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45956/892f6922b6c8da21d9c18a2e10694436cc37823e\" /> </span> <figcaption>Figure 17.11 : Large Proper Motion. Three photographs of Barnard’s star, the star with the largest known proper motion, show how this faint star has moved over a period of 20 years. (modification of work by Steve Quirk)</figcaption> </figure> <p class=\"lt-phys-64760\">For this reason, with our naked eyes, we do not notice any change in the positions of the bright stars during the course of a human lifetime. If we could live long enough, however, the changes would become obvious. For example, some 50,000 years from now, terrestrial observers will find the handle of the Big Dipper unmistakably more bent than it is now (Figure 17.12).</p> <figure><span data-alt=\"Illustrations of changes in the Big Dipper as a result of proper motion. The upper panel shows the seven stars of the Big Dipper as they appeared 50,000 years ago. The central panel shows how the asterism appears today, with an arrow attached to each star pointing in the direction of its proper motion across the sky. The bottom panel shows how the Big Dipper will appear in 50,000 years.\" data-type=\"media\"><img alt=\"Illustrations of changes in the Big Dipper as a result of proper motion. The upper panel shows the seven stars of the Big Dipper as they appeared 50,000 years ago. The central panel shows how the asterism appears today, with an arrow attached to each star pointing in the direction of its proper motion across the sky. The bottom panel shows how the Big Dipper will appear in 50,000 years.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45953/1cb88d3a39f541bf37e131eba399663a9252bb7f\" /> </span> <figcaption>Figure 17.12 : Changes in the Big Dipper. This figure shows changes in the appearance of the Big Dipper due to proper motion of the stars over 100,000 years.</figcaption> </figure> <p class=\"lt-phys-64760\">We measure the proper motion of a star in arcseconds (1/3600 of a degree) per year. That is, the measurement of proper motion tells us only by how much of an angle a star has changed its position on the celestial sphere. If two stars at different distances are moving at the same velocity perpendicular to our line of sight, the closer one will show a larger shift in its position on the celestial sphere in a year’s time. As an analogy, imagine you are standing at the side of a freeway. Cars will appear to whiz past you. If you then watch the traffic from a vantage point half a mile away, the cars will move much more slowly across your field of vision. In order to convert this angular motion to a velocity, we need to know how far away the star is.</p> <p class=\"lt-phys-64760\">To know the true <span data-type=\"term\" group-by=\"s\">space velocity</span> of a star—that is, its total speed and the direction in which it is moving through space relative to the Sun—we must know its radial velocity, proper motion, and distance (Figure 17.13). A star’s space velocity can also, over time, cause its distance from the Sun to change significantly. Over several hundred thousand years, these changes can be large enough to affect the apparent brightnesses of nearby stars. Today, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, in the constellation Canis Major (the Big Dog) is the brightest star in the sky, but 100,000 years ago, the star Canopus in the constellation Carina (the Keel) was the brightest one. A little over 200,000 years from now, Sirius will have moved away and faded somewhat, and <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vega</span>, the bright blue star in Lyra, will take over its place of honor as the brightest star in Earth’s skies.</p> <figure><span data-alt=\"Diagram illustrating the radial velocity, proper motion, and space velocity of a star. At bottom left is a yellow disk representing the Sun. On the upper right is a smaller orange disk representing a distant star. A dashed, straight line connects the centers of the Sun and the star. (Above, to the left and parallel to this dashed line is a solid line with arrows at each end terminating at what would be the centers of both stars. This line is the total distance, d, separating the Sun and this hypothetical star.) Another dashed, straight line is drawn from the Sun, below and at an angle (shown as the Greek letter mu), from the dashed line that connects the Sun and star. The angle, mu, between these dashed lines is the measured proper motion of the star as seen from the Sun. In this case the star is moving to the upper left in the diagram. Three arrows are drawn from the center of the distant star. Each arrow represents the components of the star’s motion through space that contributes to its measured proper motion. The first arrow points directly away from the Sun toward the right, along the projected path of the dashed line connecting the Sun and star. This represents the radial velocity, i.e. the velocity along our line of sight. At a right angle to this arrow, and pointing up and to the left from the star, is the arrow for the transverse velocity. The transverse velocity is perpendicular to our line of sight, and is what we see as proper motion. Between the two arrows is a third, in this case pointing straight up in the diagram, that represents the total space velocity of the star. It is the combination of the transverse and radial velocities.\" data-type=\"media\"><img alt=\"Diagram illustrating the radial velocity, proper motion, and space velocity of a star. At bottom left is a yellow disk representing the Sun. On the upper right is a smaller orange disk representing a distant star. A dashed, straight line connects the centers of the Sun and the star. (Above, to the left and parallel to this dashed line is a solid line with arrows at each end terminating at what would be the centers of both stars. This line is the total distance, d, separating the Sun and this hypothetical star.) Another dashed, straight line is drawn from the Sun, below and at an angle (shown as the Greek letter mu), from the dashed line that connects the Sun and star. The angle, mu, between these dashed lines is the measured proper motion of the star as seen from the Sun. In this case the star is moving to the upper left in the diagram. Three arrows are drawn from the center of the distant star. Each arrow represents the components of the star’s motion through space that contributes to its measured proper motion. The first arrow points directly away from the Sun toward the right, along the projected path of the dashed line connecting the Sun and star. This represents the radial velocity, i.e. the velocity along our line of sight. At a right angle to this arrow, and pointing up and to the left from the star, is the arrow for the transverse velocity. The transverse velocity is perpendicular to our line of sight, and is what we see as proper motion. Between the two arrows is a third, in this case pointing straight up in the diagram, that represents the total space velocity of the star. It is the combination of the transverse and radial velocities.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45957/4503a7d55b856608df97d64bc0f7c017b5b7d5c9\" /> </span> <figcaption>Figure 17.13 : Space Velocity and Proper Motion. This figure shows the true space velocity of a star. The radial velocity is the component of the space velocity projected along the line of sight from the Sun to a star. The transverse velocity is a component of the space velocity projected on the sky. What astronomers measure is proper motion (μ), which is the change in the apparent direction on the sky measured in fractions of a degree. To convert this change in direction to a speed in, say, kilometers per second, it is necessary to also know the distance (<em data-effect=\"italics\">d</em>) from the Sun to the star.</figcaption> </figure> <p>&nbsp;</p>"
