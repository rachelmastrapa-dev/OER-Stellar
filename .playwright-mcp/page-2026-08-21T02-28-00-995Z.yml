                  - paragraph [ref=f366e96]: Human beings developed on a planet around a G-type star. This means that the Sun’s stable main-sequence lifetime is so long that it afforded life on Earth plenty of time to evolve. When searching for intelligent life like our own on planets around other stars, it would be a pretty big waste of time to search around O- or B-type stars. These stars remain stable for such a short time that the development of creatures complicated enough to take astronomy courses is very unlikely.
                  - heading "Helium Core" [level=2] [ref=f366e97]
                  - paragraph [ref=f366e98]: Over time, a low-mass star consumes all of the hydrogen in its core. The core then contains only helium, along with a small percentage of heavier elements the star had to begin with. Think about a car that runs out of gas. Unless you put more gas in the tank, the car will not run. The same is true with stars; no more fuel in the stellar core will end the stellar fusion process. What happens next?
                  - paragraph [ref=f366e99]: When a star runs out of hydrogen in its core, it can no longer generate energy. The current core temperature is too low for helium to fuse. The long period of stability now ends, gravity again takes over, and the core begins to contract. Once more, the star’s energy is partially supplied by gravitational energy. As the star’s core shrinks, the energy of the inward-falling material is converted to heat. The heat flows outward to where it is a bit cooler. In the process, the heat raises the temperature of a layer of hydrogen that spent the whole long main-sequence time just outside the core. The additional heat produced by the shrinking core makes this layer hot enough for a shell of hydrogen nuclei just outside the core to begin fusing into helium in a process called hydrogen shell burning.
                  - paragraph [ref=f366e100]: "New energy produced by fusion of this hydrogen now pours outward from this shell and begins to heat up layers of the star farther out, causing them to expand. For a star like the Sun, the red giant star is now larger than the orbit of Mars. Meanwhile, the helium core continues to contract, producing more heat right around it. This leads to more fusion in the shell of fresh hydrogen outside the core. In Figure \\(\\PageIndex{2}\\), Illustration (a) includes the internal structure of a star on the main sequence, including the hydrogen core, and the rest of the star labeled Stellar envelope. Fusion can only take place in the core where it is hot enough for the proton-proton reaction. Illustration (b) includes a star with a small helium core with a donut-shaped hydrogen-burning shell around it. The energy for the star is no longer being produced in its core, but in the shell. This energy also flows out into the upper layer of the star."
                  - figure [ref=f366e101]:
                    - img "Layers of a main sequence, and hydrogen shell star. Details in caption." [ref=f366e102]
                    - generic [ref=f366e103]:
                      - text: "Figure \\(\\PageIndex{2}\\): Hydrogen Shell. During the main sequence, in Diagram (a), a star has a core where hydrogen is fusing and a much larger envelope that is too cold for fusion. In Diagram (b), The hydrogen in the core is replaced with helium and hydrogen begins fusing in a shell around the helium. Core not drawn to scale. ("
