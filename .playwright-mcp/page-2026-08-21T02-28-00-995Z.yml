                    - text: represents the mass of the Sun, so the Sun is a low-mass star. Each of these star groups has different lives and deaths. You might think that a more massive star, having more fuel, would last longer, but it’s not that simple. The lifetime of a star in a particular stage of evolution depends on how much nuclear fuel it has and on how quickly it uses up that fuel. In the case of stars, more massive ones use up their fuel much more quickly than stars of low mass.
                  - paragraph [ref=f366e50]: The reason massive stars burn through their hydrogen faster is that the rate of fusion depends very strongly on the star’s core temperature. In a star, the weight of the overlying layers creates pressure in the core. Increasing the mass of a star increases the pressure in the core. Higher pressure leads to higher temperature. The higher the temperature in the core, the faster the star races through its storehouse of central hydrogen. Although massive stars have more fuel, they burn it so quickly that their lifetimes are much shorter than those of their low-mass counterparts. The high rate of fusion also produces more energy, making high-mass stars also the most luminous.
                  - paragraph [ref=f366e51]: "The main-sequence lifetimes of stars of different masses are listed in Table \\(\\PageIndex{1}\\). This table shows that the most massive stars spend only a few million years on the main sequence. A star of 1 solar mass remains there for roughly 10 billion years, while a star of about 0.4 solar mass has a main-sequence lifetime of some 200 billion years, which is longer than the current age of the universe. Remember that every star spends most of its total lifetime on the main sequence, fusing hydrogen into helium. That means that the total lifetimes of the stars in Table \\(\\PageIndex{1}\\) are only a little longer than the ages listed for time on the main sequence."
