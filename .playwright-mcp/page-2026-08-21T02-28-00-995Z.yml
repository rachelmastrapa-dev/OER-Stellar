                  - heading "Stellar Evolution" [level=2] [ref=f366e2]
                  - paragraph [ref=f366e3]: Stellar evolution is the process by which a star experiences a sequence of drastic variations during its stellar life. Depending on the initial stellar mass, a star's lifetime ranges from a few million years for the most massive to trillions of years for the least massive, which is considerably longer than the age of the Universe at 13.8 billion years. For now, let's consider what happens to a low-mass star after it reaches the main sequence.
                  - heading "The Main Sequence" [level=2] [ref=f366e4]
                  - paragraph [ref=f366e5]: Once a star has reached the main-sequence stage of its life, it derives its energy almost entirely from the conversion of hydrogen to helium via the process of nuclear fusion in its core. Since hydrogen is the most abundant element in stars, this process can maintain the star’s equilibrium for a long time. Thus, all stars remain on the main sequence for most of their lives. Some astronomers like to call the main-sequence phase the star’s prolonged adolescence or adulthood.
                  - paragraph [ref=f366e6]:
                    - text: The stars on the left-hand edge of the main sequence in the H–R diagram are classified as
                    - strong [ref=f366e7]:
                      - link "zero-age main sequence" [ref=f366e8]:
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.06:_Key_Terms#zero-age main sequence
                    - text: "(ZAMS). The term zero-age refers to the moment when a star stops contracting, settles onto the main sequence, and begins to fuse hydrogen in its core. Figure \\(\\PageIndex{1}\\) depicts the zero-age main sequence as a continuous blue line in the H–R diagram that shows where stars of different masses can be found when they begin to fuse hydrogen."
                  - figure [ref=f366e9]:
                    - img "Schematic H–R Diagram with ZAMS region. Details in caption." [ref=f366e10]
                    - generic [ref=f366e11]:
                      - text: "Figure \\(\\PageIndex{1}\\): Zero-age main sequence (ZAMS) stars are on the higher temperature, or left, side of the main sequence on the H-R Diagram. ("
