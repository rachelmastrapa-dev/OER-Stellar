                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.1.5_Stellar_Mass_and_Evolution
                      - text: .
                  - paragraph [ref=f366e209]:
                    - text: The most massive star in this diagram has a mass similar to that of Betelgeuse, and so its evolutionary track shows approximately the history of Betelgeuse. The track of a star like Betelgeuse initially increases a little in luminosity, then cools from roughly 20,000 to 4000 K. The end of the track, where Betelgeuse is a supergiant is labeled 1.20x10
                    - superscript [ref=f366e210]: "7"
                    - text: ", or 70 million years. While theorists debate the exact number of years shown in Figure \\(\\PageIndex{5}\\), the main thing to take from the model results is that the more massive the star, the shorter time it takes for each stage in its life."
