                  - heading "Modeling the Giant Stage" [level=2] [ref=f366e198]
                  - paragraph [ref=f366e199]: "As we discussed earlier, astronomers can construct computer models of stars with different masses and compositions to see how stars change throughout their lives. Figure \\(\\PageIndex{5}\\), which is based on theoretical calculations by University of Illinois astronomer Icko Iben, shows an H–R diagram with several tracks of evolution from the main sequence to the giant stage of model stars with chemical compositions similar to that of the Sun. The solid black lines show the predicted evolution from the main sequence through the red giant or supergiant stage on the H–R diagram. Each track is labeled with the mass of the star with masses from 0.5 to 15 times the mass of our Sun. The tracks have several dots along the track marking different points in the star's evolution along with a number that indicates the time, in years, required for each star to reach that point."
                  - paragraph [ref=f366e200]:
                    - text: Tracing the track of the Sun, it moves directly up from the main sequence, increasing in luminosity but remaining at the same surface temperature, until it reaches a point marked 7x10
                    - superscript [ref=f366e201]: "9"
                    - text: years, or 7 billion years. The track then curves up and to the right, first increasing in luminosity, then decreasing in surface temperature, to a point labeled 10.4 billion years. The track moves a large distance up and a little to the right, indicating a large increase in luminosity and a medium decrease in temperature. This is where the track ends with the Sun as a giant star at 11.4 billion years. Over this track, the Sun becomes roughly 1,000 times brighter and its surface temperature has cooled from 5800 K to a little less than 4000 K.
                  - figure [ref=f366e202]:
                    - img "Model evolutionary tracks of stars of different masses. Details in caption." [ref=f366e203]
                    - generic [ref=f366e204]:
                      - text: "Figure \\(\\PageIndex{5}\\): Stellar Mass and Evolution. The path that stars take from the main sequence varies depending on their mass. ("
