                      - text: .
                  - paragraph [ref=f366e116]: When you take the lid off a pot of boiling water, the steam can expand and it cools down. In the same way, the expansion of a star’s outer layers causes the temperature at the surface to decrease. As it cools, the star’s overall color becomes redder. So the star becomes simultaneously more luminous and cooler. On the H–R diagram, the star therefore leaves the main-sequence band and moves upward, increasing in luminosity, and to the right, decreasing in surface temperature. Over time, massive stars become red supergiants, and lower-mass stars like the Sun become red giants. Note that red giant stars do not actually look deep red. Their colors are more like orange or orange-red.
                  - paragraph [ref=f366e117]: "Just how different are these red giants and supergiants from a main-sequence star? Table \\(\\PageIndex{2}\\) compares the Sun with the red supergiant Betelgeuse, which is visible above Orion’s belt as the bright red star that marks the hunter’s armpit, as demonstrated in Figure \\(\\PageIndex{4}\\). Relative to the Sun, this supergiant has a much larger radius, a much lower average density, a cooler surface, and a much hotter core."
