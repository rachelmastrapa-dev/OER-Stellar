                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f366e107]':
                        - /url: /Workbench/De_Anza_-_ASTR10/12:_Aging_Stars/12.07:_Accessible_Descriptions#Figure_12.1.2_Hydrogen_Shell
                      - text: .
                  - paragraph [ref=f366e108]: "Most stars generate more energy each second when they are fusing hydrogen in the shell surrounding the helium core than they did when hydrogen fusion was confined to the central part of the star. More energy means more light, so the star increases in luminosity, or gets brighter. The energy from the shrinking core and hydrogen-burning shells also causes the outer layers of the star begin to expand. The star eventually grows and grows until it reaches enormous proportions. Figure \\(\\PageIndex{3}\\) demonstrates the very large difference in size between the Sun, Delta Boötis and Xi Cygni. Delta Bootis is a giant star with a diameter that is roughly 11 times the diameter of the Sun. Xi Cygni is too large to be included in the image, but the supergiant has a diameter over 200 times larger than that of the Sun."
                  - figure [ref=f366e109]:
                    - img "Scale comparison of the Sun and two giants stars. Details in caption." [ref=f366e110]
