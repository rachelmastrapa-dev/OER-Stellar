                  - paragraph [ref=f366e190]: "Red giants can become so large that if we were to replace the Sun with one of them, its outer atmosphere would extend to the orbit of Mars or even beyond. Figure \\(\\PageIndex{4}\\) includes an image of the constellation Orion with Betelgeuse is marked with a yellow “X” near the top left. In the left image, we see Betelgeuse in ultraviolet with the Hubble Space Telescope, in the first direct image ever made of the surface of another star. As shown by the scale at the bottom, Betelgeuse has an extended atmosphere so large that, if it were at the center of the Solar System, it would stretch past the orbit of Jupiter. This is the next stage in the life of a star as it moves from its long period of youth and adulthood to old age. By considering the relative ages of the Sun and Betelgeuse, we can also see that the idea that bigger stars die faster is indeed true here. Betelgeuse is a mere 10 million years old, which is relatively young compared with our Sun’s 4.5 billion years, but it is already nearing its death throes as a red supergiant."
                  - figure [ref=f366e191]:
                    - img "Size and location of Betelgeuse. Details in caption." [ref=f366e192]
