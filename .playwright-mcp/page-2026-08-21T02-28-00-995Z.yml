                      - text: .
                  - paragraph [ref=f366e16]: Since only 0.7% of the hydrogen used in fusion reactions is converted into energy, fusion does not change the total mass of the star by a significant amount during this long period. It does, however, change the chemical composition in its core where nuclear reactions occur. Hydrogen is gradually depleted, and helium accumulates at the center of the star. This change of composition changes the luminosity, temperature, size, and interior structure of the star. When a star’s luminosity and temperature begin to change, the point that represents the star on the H–R diagram moves away from the zero-age main sequence.
                  - paragraph [ref=f366e17]: Calculations show that the temperature and density in the inner region slowly increase as helium accumulates in the center of a star. As the core temperature increases, each proton acquires more energy of motion on average. This means it is more likely to interact with other protons, and the rate of fusion also increases. The rate of fusion in the proton-proton cycle goes up roughly proportional to the temperature to the fourth power. If the rate of fusion goes up, the rate at which energy is being generated also increases, and the luminosity of the star gradually rises. Initially, these changes are small, and stars remain within the main-sequence band on the H–R diagram for most of their lifetimes.
                  - generic [ref=f366e18]:
