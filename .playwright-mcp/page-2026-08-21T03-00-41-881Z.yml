              - heading "Panel 1" [level=3] [ref=f547e215]
              - list [ref=f547e216]:
                - listitem [ref=f547e217]: Two spiral galaxies at the start of the interaction, one large face-on spiral with tightly wound arms (A) is above a smaller, more elongated companion below it (B).
                - listitem [ref=f547e218]: The model of each galaxy includes millions of individual dots that have the color of the star they represent.
                - listitem [ref=f547e219]: Galaxy B is made of mostly red stars, while Galaxy A is a mix of red and blue.
            - generic [ref=f547e220]:
              - heading "Panel 2" [level=3] [ref=f547e221]
              - list [ref=f547e222]:
