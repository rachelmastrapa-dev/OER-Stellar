          - generic [ref=f547e251]:
            - heading "Figure 17.2.3 Galactic Cannibalism" [level=2] [ref=f547e252]
            - paragraph [ref=f547e253]: Two images showing evidence of galaxy mergers.
            - generic [ref=f547e254]:
              - heading "Image (a)" [level=3] [ref=f547e255]
              - list [ref=f547e256]:
                - listitem [ref=f547e257]: A Hubble Space Telescope image of the elliptical galaxy NGC 1316, appearing as a large, diffuse, glowing golden-white sphere.
                - listitem [ref=f547e258]: Dark, wispy filaments of dust form an irregular silhouette across the bright nucleus, unusual for an elliptical galaxy, which typically contains little dust.
