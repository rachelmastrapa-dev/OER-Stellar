                - listitem [ref=f547e263]: A composite image of the irregular galaxy NGC 6240, combining a Hubble Space Telescope background image with two Chandra X-ray Telescope insets.
                - listitem [ref=f547e264]: The background Hubble image shows a butterfly-shaped galaxy with dark, dusty lanes crossing pale, diffuse light, alongside two bright foreground stars.
                - listitem [ref=f547e265]: A white box on the galaxy's center marks the region enlarged in the first inset.
                - listitem [ref=f547e266]: The first inset shows a false-color X-ray view with red, orange, and yellow diffuse gas surrounding a smaller bright region, marked by another white box.
                - listitem [ref=f547e267]: The second, most enlarged inset reveals two separate bright blue-white points, representing two distinct galactic nuclei separated by only 4000 light-years.
