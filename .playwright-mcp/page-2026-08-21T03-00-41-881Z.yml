                - listitem [ref=f547e224]: Galaxy B has two long red tails.
                - listitem [ref=f547e225]: Galaxy A has lost most of its spirals.
                - listitem [ref=f547e226]: A long string of blue stars loops around Galaxy A and Galaxy B. The concentration of blue stars indicates star formation.
            - generic [ref=f547e227]:
              - heading "Panel 3" [level=3] [ref=f547e228]
              - list [ref=f547e229]:
                - listitem [ref=f547e230]: The galaxies pass through each other, producing long, sweeping blue tidal arms and a bridge of material connecting them.
                - listitem [ref=f547e231]: Galaxy B has moved to the left, and Galaxy A has moved to the right.
                - listitem [ref=f547e232]: Both galaxies have a blue ring of star formation. Galaxy A's rings is significantly large and has several blue tails.
                - listitem [ref=f547e233]: The line of stars collecting the galaxies is red, indicating older stars.
                - listitem [ref=f547e234]
            - generic [ref=f547e235]:
              - heading "Panel 4" [level=3] [ref=f547e236]
              - list [ref=f547e237]:
                - listitem [ref=f547e238]: Galaxy A has a bright, ring-like structure with a yellow center and extended blue tails as the galaxies come back together.
                - listitem [ref=f547e239]: Galaxy B is a smaller blue ring with a red center.
                - listitem [ref=f547e240]
