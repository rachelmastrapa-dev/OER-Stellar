      - generic [ref=f547e97]:
        - generic [ref=f547e98]:
          - generic [ref=f547e99]:
            - heading "Figure 17.1.1 Astronomical Time Travel" [level=2] [ref=f547e100]
            - paragraph [ref=f547e101]: Visible-light Hubble Space Telescope image of galaxy cluster Abell 2744.
            - generic [ref=f547e102]:
              - heading "Foreground Cluster" [level=3] [ref=f547e103]
              - list [ref=f547e104]:
                - listitem [ref=f547e105]: Several large, bright elliptical galaxies are in the cluster, named Abell 2744, located mostly near the center and scattered throughout the image.
                - listitem [ref=f547e106]: The cluster contains several hundred galaxies, appearing as they looked 3.5 billion years ago.
                - listitem [ref=f547e107]: The immense gravity of Abell 2744 acts as a gravitational lens, warping space to brighten and magnify the images of nearly 3000 more distant background galaxies.
            - generic [ref=f547e108]:
              - heading "Background Galaxies" [level=3] [ref=f547e109]
              - list [ref=f547e110]:
                - listitem [ref=f547e111]: Numerous smaller, more distant galaxies are scattered throughout the image, with some appearing as thin, curved arcs distorted by the lensing effect.
                - listitem [ref=f547e112]: Many of the background galaxies appear blue, as they are seen as they looked more than 12 billion years ago, not long after the Big Bang.
                - listitem [ref=f547e113]: The blue color indicates active star formation producing hot, bright blue stars, which was much more common in that earlier time than it is today.
              - paragraph [ref=f547e114]: "Credit: NASA, ESA, STScI"
          - generic [ref=f547e115]:
            - heading "Figure 17.1.2 Very Distant Galaxy" [level=2] [ref=f547e116]
            - paragraph [ref=f547e117]: Hubble and Spitzer images of a distant galaxy field.
            - generic [ref=f547e118]:
              - heading "Main Image" [level=3] [ref=f547e119]
              - list [ref=f547e120]:
                - listitem [ref=f547e121]: A Hubble Space Telescope image showing many faint, distant galaxies scattered across a dark background.
                - listitem [ref=f547e122]: The galaxies are a variety of colors, including red, orange, yellow, and blue.
                - listitem [ref=f547e123]: The galaxies are small with no discernable shape. They are tiny blobs that range from roundish to thin lines.
                - listitem [ref=f547e124]: A white arrow points to a faint orange dot below center, marking the luminous galaxy at a redshift of z = 8.68, corresponding to a distance of about 13.2 billion light years.
                - listitem [ref=f547e125]: Two square insets appear at the upper right, enlarging the region around the galaxy.
            - generic [ref=f547e126]:
              - heading "Hubble Inset" [level=3] [ref=f547e127]
              - list [ref=f547e128]:
                - listitem [ref=f547e129]: Labeled Hubble, at the top right.
                - listitem [ref=f547e130]: An enlarged, higher-resolution view of the region around the galaxy, showing a bright orange point of light near the center along with several fainter red and blue points.
            - generic [ref=f547e131]:
              - heading "Spitzer Inset" [level=3] [ref=f547e132]
              - list [ref=f547e133]:
                - listitem [ref=f547e134]: Labeled Spitzer, below the Hubble inset.
                - listitem [ref=f547e135]: A lower-resolution infrared image of the same region, showing soft, blurred patches of orange, pink, and yellow light rather than distinct points.
                - listitem [ref=f547e136]: The galaxies in the Spitzer image are significantly brighter in the infrared, compared to the visible Hubble image.
              - paragraph [ref=f547e137]: "Credit: I. Labbé (Leiden University), NASA/ESA/JPL-Caltech"
          - generic [ref=f547e138]:
            - heading "Figure 17.1.3 Hubble Ultra-Deep Field" [level=2] [ref=f547e139]
            - paragraph [ref=f547e140]: Hubble Space Telescope image of thousands of distant galaxies.
            - generic [ref=f547e141]:
              - heading "Image Elements" [level=3] [ref=f547e142]
              - list [ref=f547e143]:
                - listitem [ref=f547e144]: A Hubble Space Telescope image of a small patch of sky, densely filled with thousands of galaxies of varying colors, shapes, and sizes.
                - listitem [ref=f547e145]: Several pinwheel-shaped spiral galaxies are scattered throughout, resembling the structure of the Milky Way.
                - listitem [ref=f547e146]: Many galaxies show irregular or distorted shapes, resulting from collisions with companion galaxies.
                - listitem [ref=f547e147]: Reddish, blob-shaped elliptical galaxies, which contain mostly old stars, appear throughout the image.
                - listitem [ref=f547e148]: A small number of bright, sharp-pointed objects are foreground stars from the Milky Way, distinguishable from the more numerous faint, extended galaxies.
              - paragraph [ref=f547e149]: "Credit: modification of work by NASA, ESA, H. Teplitz and M. Rafelski (IPAC/Caltech), A. Koekemoer (STScI), R. Windhorst (Arizona State University), and Z. Levay (STScI)"
          - generic [ref=f547e150]:
            - heading "Figure 17.1.4 Protogalaxies" [level=2] [ref=f547e151]
            - paragraph [ref=f547e152]: Hubble Space Telescope image of small, early galaxy fragments, or protogalaxies with enlarged insets.
            - generic [ref=f547e153]:
              - heading "Main Image" [level=3] [ref=f547e154]
              - list [ref=f547e155]:
                - listitem [ref=f547e156]: A wide-field Hubble image showing numerous small, distant galaxies scattered across the frame, most too faint to distinguish detail directly.
                - listitem [ref=f547e157]: "Eighteen protogalaxies are labeled with numbers marking their positions: 1, 5, 6, 8, 10, 11, 12, 13, 18, 19, 29, 34, 37, 40, 60, 61, 94, and 113."
                - listitem [ref=f547e158]: Two bright stars, each surrounded by sharp, star-shaped points of light, appear near the upper left and center left of the image.
            - generic [ref=f547e159]:
              - heading "Inset Enlargements" [level=3] [ref=f547e160]
              - list [ref=f547e161]:
                - listitem [ref=f547e162]: Located at the upper right, a grid of small panels shows enlarged close-up views of each numbered object.
                - listitem [ref=f547e163]: These objects are compact groups of stars that will eventually become galaxies, using the term protogalaxy.
                - listitem [ref=f547e164]: Each panel is labeled with the number corresponding to its position in the main image.
                - listitem [ref=f547e165]: "Five of the panels include a redshift label: galaxy 6 at z = 2.390, protogalaxy 8 at z = 2.386, protogalaxy 12 at z = 2.388, protogalaxy 18 at z = 2.393, and protogalaxy 19 at z = 2.397."
                - listitem [ref=f547e166]: Below the grid, two larger panels labeled 5 and 6(53W002) show wider views providing more context around those two objects.
                - listitem [ref=f547e167]: Almost all of the protogalaxies are blue, with exception of 13 which is orange-red.
                - listitem [ref=f547e168]: The protogalaxies are very small with shapes ranging from round to a stretched line.
              - paragraph [ref=f547e169]: "Credit: modification of work by Rogier Windhorst (Arizona State University) and NASA"
          - generic [ref=f547e170]:
            - heading "Figure 17.2.1 Interacting Galaxies" [level=2] [ref=f547e171]
            - paragraph [ref=f547e172]: Six images showing galaxies in different stages of interaction.
            - generic [ref=f547e173]:
              - heading "Image (a)" [level=3] [ref=f547e174]
              - list [ref=f547e175]:
                - listitem [ref=f547e176]: A black-and-white visible-light image of the galaxies M82 and M83.
                - listitem [ref=f547e177]: The smaller galaxy, M82, appears near the top as an elongated dark shape.
                - listitem [ref=f547e178]: The larger spiral galaxy, M83, appears below as a rounded dark shape.
            - generic [ref=f547e179]:
              - heading "Image (b)" [level=3] [ref=f547e180]
              - list [ref=f547e181]:
                - listitem [ref=f547e182]: A false-color radio image of the same pair of galaxies in Image (a), showing radio waves given off by cold hydrogen gas.
                - listitem [ref=f547e183]: The background is dark blue, with the gas shown in colors ranging from light blue to green, yellow, orange, and red at indicating the highest concentration of cold hydrogen gas.
                - listitem [ref=f547e184]: The two galaxies are wrapped in a common shroud of gas that is stretched and pulled between them by their mutual gravity.
            - generic [ref=f547e185]:
              - heading "Image (c)" [level=3] [ref=f547e186]
              - list [ref=f547e187]:
                - listitem [ref=f547e188]: A Hubble Space Telescope image of galaxy M82, shown at edge-on with a bright, elongated central disk.
                - listitem [ref=f547e189]: Red, filament-like tendrils of gas stream outward above and below the disk, powered by supernova explosions from a burst of star formation triggered by the interaction with M83.
            - generic [ref=f547e190]:
              - heading "Image (d)" [level=3] [ref=f547e191]
              - list [ref=f547e192]:
                - listitem [ref=f547e193]: The barred spiral galaxy UGC 10214, nicknamed the Tadpole, is in the upper left corner of the image.
                - listitem [ref=f547e194]: A long, curving tidal tail of stars and gas, about 280,000 light-years long, extends away from the main galaxy toward the lower right corner, pulled out by the gravity of the passing companion.
                - listitem [ref=f547e195]: Bright blue clumps along the tail mark bursts of star formation triggered by the interaction.
            - generic [ref=f547e196]:
              - heading "Image (e)" [level=3] [ref=f547e197]
              - list [ref=f547e198]:
                - listitem [ref=f547e199]: Galaxies NGC 4676 A and B, nicknamed The Mice, shown as two spiral galaxies connected by long, narrow tails of stars.
                - listitem [ref=f547e200]: The tails were pulled away from each galaxy by their mutual gravitational interaction.
            - generic [ref=f547e201]:
              - heading "Image (f)" [level=3] [ref=f547e202]
              - list [ref=f547e203]:
                - listitem [ref=f547e204]: Arp 148, a pair of galaxies caught in the process of merging into one new galaxy.
                - listitem [ref=f547e205]: One galaxy, on the right, has been reshaped into a bright blue ring of active star formation, the result of a shockwave from the two galaxies passing through each other.
                - listitem [ref=f547e206]: The second, elongated galaxy extends outward from the ring toward the left of the image.
              - paragraph [ref=f547e207]: "Credit a, b: modification of work by NRAO/AUI"
              - paragraph [ref=f547e208]: "Credit c: modification of work by NASA, ESA, and The Hubble Heritage Team (STScI/AURA)"
              - paragraph [ref=f547e209]: "Credit d, e: modification of work by NASA, H. Ford (JHU), G. Illingworth (UCSC/LO), M. Clampin (STScI), G. Hartig (STScI), the ACS Science Team, and ESA"
              - paragraph [ref=f547e210]: "Credit f: modification of work by NASA, ESA, the Hubble Heritage (STScI/AURA)-ESA/Hubble Collaboration, and A. Evans (University of Virginia, Charlottesville/NRAO/Stony Brook University)"
          - generic [ref=f547e211]:
            - heading "Figure 17.2.2 Simulated Collision" [level=2] [ref=f547e212]
            - paragraph [ref=f547e213]: Computer simulation of two spiral galaxies merging into one elliptical galaxy. The figure is broken into 2 rows of three panels. Panels are unnumbered but this description starts in the upper left panel (Panel 1), moves across the row (Panel2) to the upper right (Panel 3), moves to the bottom left (Panel 4), across that row (Panel 5), to the bottom right (Panel 6). Galaxies are unlabeled, but A and B are assigned until they can no longer be separated.
