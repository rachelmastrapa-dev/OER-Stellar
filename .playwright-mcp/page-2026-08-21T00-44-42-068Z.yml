                  - generic [ref=f38e2]:
                    - heading "Learning Objectives" [level=5] [ref=f38e3]
                    - paragraph [ref=f38e5]: "By the end of this section, you will be able to:"
                    - list [ref=f38e6]:
                      - listitem [ref=f38e7]: Define the main features of the celestial sphere
                      - listitem [ref=f38e8]: Explain the system astronomers use to describe the sky
                      - listitem [ref=f38e9]: Describe how motions of the stars appear to us on Earth
                      - listitem [ref=f38e10]: Describe how motions of the Sun, Moon, and planets appear to us on Earth
                      - listitem [ref=f38e11]:
                        - text: Understand the modern meaning of the term
                        - emphasis [ref=f38e12]: constellation
                  - paragraph [ref=f38e13]: Our senses suggest to us that Earth is the center of the universe—the hub around which the heavens turn. This geocentric (Earth-centered) view was what almost everyone believed until the European Renaissance. After all, it is simple, logical, and seemingly self-evident. Furthermore, the geocentric perspective reinforced those philosophical and religious systems that taught the unique role of human beings as the central focus of the cosmos. However, the geocentric view happens to be wrong. One of the great themes of our intellectual history is the overthrow of the geocentric perspective. Let us, therefore, take a look at the steps by which we reevaluated the place of our world in the cosmic order.
                  - heading "The Celestial Sphere" [level=3] [ref=f38e14]
                  - paragraph [ref=f38e15]: If you go on a camping trip or live far from city lights, your view of the sky on a clear night is pretty much identical to that seen by people all over the world before the invention of the telescope. Gazing up, you get the impression that the sky is a great hollow dome with you at the center (Figure 2.2), and all the stars are an equal distance from you on the surface of the dome. The top of that dome, the point directly above your head, is called the zenith, and where the dome meets Earth is called the horizon. From the sea or a flat prairie, it is easy to see the horizon as a circle around you, but from most places where people live today, the horizon is at least partially hidden by mountains, trees, buildings, or smog.
                  - 'figure "Figure 2.2 : The Sky around Us. The horizon is where the sky meets the ground; an observer’s zenith is the point directly overhead." [ref=f38e16]':
                    - img "Diagram of the Horizon and the Zenith. In the center of this illustration a human figure stands looking upward. She is standing at the center of a series of concentric circles representing the ground, the outermost circle is labeled the “Horizon”. The sky is represented as a dome enclosing the figure and the ground the figure stands on. Thus, the dome meets the ground at the horizon. A line is drawn vertically upward from the figure to the top of the dome directly over the figure’s head, and is labeled the “Zenith”." [ref=f38e18]
                  - paragraph [ref=f38e20]: If you lie back in an open field and observe the night sky for hours, as ancient shepherds and travelers regularly did, you will see stars rising on the eastern horizon (just as the Sun and Moon do), moving across the dome of the sky in the course of the night, and setting on the western horizon. Watching the sky turn like this night after night, you might eventually get the idea that the dome of the sky is really part of a great sphere that is turning around you, bringing different stars into view as it turns. The early Greeks regarded the sky as just such a celestial sphere (Figure 2.3). Some thought of it as an actual sphere of transparent crystalline material, with the stars embedded in it like tiny jewels.
                  - 'figure "Figure 2.3 : Circles on the Celestial Sphere. Here we show the (imaginary) celestial sphere around Earth, on which objects are fixed, and which rotates around Earth on an axis. In reality, it is Earth that turns around this axis, creating the illusion that the sky revolves around us. Note that Earth in this picture has been tilted so that your location is at the top and the North Pole is where the N is. The apparent motion of celestial objects in the sky around the pole is shown by the circular arrow." [ref=f38e21]':
                    - img [ref=f38e23]
                  - paragraph [ref=f38e25]:
                    - text: Today, we know that it is not the celestial sphere that turns as night and day proceed, but rather the planet on which we live. We can put an imaginary stick through Earth’s North and South Poles, representing our planet’s axis. It is because Earth turns on this axis every 24 hours that we see the Sun, Moon, and stars rise and set with clockwork regularity. Today, we know that these celestial objects are not really on a dome, but at greatly varying distances from us in space. Nevertheless, it is sometimes still convenient to talk about the celestial dome or sphere to help us keep track of objects in the sky. There is even a special theater, called a
                    - emphasis [ref=f38e26]: planetarium
                    - text: ", in which we project a simulation of the stars and planets onto a white dome."
                  - paragraph [ref=f38e27]: As the celestial sphere rotates, the objects on it maintain their positions with respect to one another. A grouping of stars such as the Big Dipper has the same shape during the course of the night, although it turns with the sky. During a single night, even objects we know to have significant motions of their own, such as the nearby planets, seem fixed relative to the stars. Only meteors—brief “shooting stars” that flash into view for just a few seconds—move appreciably with respect to other objects on the celestial sphere. (This is because they are not stars at all. Rather, they are small pieces of cosmic dust, burning up as they hit Earth’s atmosphere.) We can use the fact that the entire celestial sphere seems to turn together to help us set up systems for keeping track of what things are visible in the sky and where they happen to be at a given time.
                  - heading "Celestial Poles and Celestial Equator" [level=3] [ref=f38e28]
                  - paragraph [ref=f38e29]:
                    - text: To help orient us in the turning sky, astronomers use a system that extends Earth’s axis points into the sky. Imagine a line going through Earth, connecting the North and South Poles. This is Earth’s axis, and Earth rotates about this line. If we extend this imaginary line outward from Earth, the points where this line intersects the celestial sphere are called the
                    - emphasis [ref=f38e30]: north celestial pole
                    - text: and the
                    - emphasis [ref=f38e31]: south celestial pole
                    - text: . As Earth rotates about its axis, the sky appears to turn in the opposite direction around those celestial poles (Figure 2.4). We also (in our imagination) throw Earth’s equator onto the sky and call this the celestial equator. It lies halfway between the celestial poles, just as Earth’s equator lies halfway between our planet’s poles.
                  - 'figure "Figure 2.4 : Circling the South Celestial Pole. This long-exposure photo shows trails left by stars as a result of the apparent rotation of the celestial sphere around the south celestial pole. (In reality, it is Earth that rotates.) (Credit: ESO/Iztok Bončina)" [ref=f38e32]':
                    - img "Photograph of Stars Circling the South Celestial Pole. In this time-exposure photograph the stars are not seen as points of light, but as semi-circular arcs due to the rotation of the Earth during the exposure. The domes of several telescopes are silhouetted against the sky." [ref=f38e34]
                  - paragraph [ref=f38e36]: Now let’s imagine how riding on different parts of our spinning Earth affects our view of the sky. The apparent motion of the celestial sphere depends on your latitude (position north or south of the equator). First of all, notice that Earth’s axis is pointing at the celestial poles, so these two points in the sky do not appear to turn.
                  - paragraph [ref=f38e37]: If you stood at the North Pole of Earth, for example, you would see the north celestial pole overhead, at your zenith. The celestial equator, 90° from the celestial poles, would lie along your horizon. As you watched the stars during the course of the night, they would all circle around the celestial pole, with none rising or setting. Only that half of the sky north of the celestial equator is ever visible to an observer at the North Pole. Similarly, an observer at the South Pole would see only the southern half of the sky.
                  - paragraph [ref=f38e38]: If you were at Earth’s equator, on the other hand, you see the celestial equator (which, after all, is just an “extension” of Earth’s equator) pass overhead through your zenith. The celestial poles, being 90° from the celestial equator, must then be at the north and south points on your horizon. As the sky turns, all stars rise and set; they move straight up from the east side of the horizon and set straight down on the west side. During a 24-hour period, all stars are above the horizon exactly half the time. (Of course, during some of those hours, the Sun is too bright for us to see them.)
                  - paragraph [ref=f38e39]: What would an observer in the latitudes of the United States or Europe see? Remember, we are neither at Earth’s pole nor at the equator, but in between them. For those in the continental United States and Europe, the north celestial pole is neither overhead nor on the horizon, but in between. It appears above the northern horizon at an angular height, or altitude, equal to the observer’s latitude. In San Francisco, for example, where the latitude is 38° N, the north celestial pole is 38° above the northern horizon.
                  - paragraph [ref=f38e40]: For an observer at 38° N latitude, the south celestial pole is 38° below the southern horizon and, thus, never visible. As Earth turns, the whole sky seems to pivot about the north celestial pole. For this observer, stars within 38° of the North Pole can never set. They are always above the horizon, day and night. This part of the sky is called the north circumpolar zone. For observers in the continental United States, the Big Dipper, Little Dipper, and Cassiopeia are examples of star groups in the north circumpolar zone. On the other hand, stars within 38° of the south celestial pole never rise. That part of the sky is the south circumpolar zone. To most U.S. observers, the Southern Cross is in that zone. (Don’t worry if you are not familiar with the star groups just mentioned; we will introduce them more formally later on.)
                  - paragraph [ref=f38e41]: At this particular time in Earth’s history, there happens to be a star very close to the north celestial pole. It is called Polaris, the pole star, and has the distinction of being the star that moves the least amount as the northern sky turns each day. Because it moved so little while the other stars moved much more, it played a special role in the mythology of several Native American tribes, for example (some called it the “fastener of the sky”).
                  - generic [ref=f38e42]:
                    - 'heading "Astronomy Basics: What’s Your Angle?" [level=5] [ref=f38e43]'
                    - paragraph [ref=f38e45]: Astronomers measure how far apart objects appear in the sky by using angles. By definition, there are 360° in a circle, so a circle stretching completely around the celestial sphere contains 360°. The half-sphere or dome of the sky then contains 180° from horizon to opposite horizon. Thus, if two stars are 18° apart, their separation spans about 1/10 of the dome of the sky. To give you a sense of how big a degree is, the full Moon is about half a degree across. This is about the width of your smallest finger (pinkie) seen at arm’s length.
