                    - img "Image of an artist's rendition of Danish Astronomer Tychos Brahe." [ref=f599e4]
                  - paragraph [ref=f599e6]: Tycho Brahe made numerous measurements of the positions of astronomical objects until his death in 1601. His measurements were accurate to better than 1/100 of a degree.
                  - paragraph [ref=f599e7]: Johannes Kepler was Tycho’s assistant. Kepler tried to obtain Tycho’s data to fit the Copernican Heliocentric Solar System Model. (Kepler’s and Tycho did not get along. ) But Tycho’s data did not exactly work for a Heliocentric Solar System! So Kepler looked for a new model, and from that he developed Kepler’s Laws.
