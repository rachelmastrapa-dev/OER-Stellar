                  - paragraph [ref=f525e55]:
                    - text: It's not just the shapes that are different. Nearly all the galaxies with redshifts that correspond to 11 billion light-years or more, galaxies that we are seeing when they were less than 3 billion years old, are extremely blue, indicating that they contain a lot of young stars and that star formation in them is occurring at a higher rate than in nearby galaxies. Observations also show that very distant galaxies are systematically smaller on average than nearby galaxies. Relatively few galaxies present before the universe was about 8 billion years old have masses greater than 10
                    - superscript [ref=f525e56]: "11"
                    - text: M
                    - subscript [ref=f525e57]: Sun
                    - text: . That's 1/20 the mass of the Milky Way if we include its dark matter halo. Eleven billion years ago, there were only a few galaxies with masses greater than 10
                    - superscript [ref=f525e58]: "10"
                    - text: M
                    - subscript [ref=f525e59]: Sun
                    - text: . What we see instead seem to be small pieces or fragments of galactic material. When we look at galaxies that emitted their light 11 to 12 billion years ago, we now believe we are seeing the seeds of elliptical galaxies and of the central bulges of spirals. Over time, these smaller galaxies collided and merged to build up today's large galaxies.
                  - paragraph [ref=f525e60]: Bear in mind that stars that formed more than 11 billion years ago will be very old stars today. When we look nearby at galaxies we see closer to our time, we find mostly old stars in the nuclear bulges of nearby spirals and in elliptical galaxies. What such observations are showing us is that galaxies have grown in size as the universe has aged. Not only were galaxies smaller several billion years ago, but there were more of them. Gas-rich galaxies, particularly the less luminous ones, were much more numerous then than they are today.
