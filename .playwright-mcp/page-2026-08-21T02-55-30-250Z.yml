                      - text: .
                  - paragraph [ref=f525e31]:
                    - text: Observations of
                    - strong [ref=f525e32]:
                      - link "quasar" [ref=f525e33]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#quasar
                    - text: ", galaxies whose centers contain an active supermassive black hole, support this conclusion. We can measure the abundances of heavy elements in the gas near quasar black holes. The composition of this gas in quasars that emitted their light 12.5 billion light-years ago is very similar to that of the Sun. This means that a large portion of the gas surrounding the black holes must have already been cycled through stars during the first 1.3 billion years after the expansion of the universe began. If we allow time for this cycling, then their first stars must have formed when the universe was only a few hundred million years old."
                  - heading "A Changing Universe" [level=3] [ref=f525e34]
                  - paragraph [ref=f525e35]: Back in the middle decades of the twentieth century, the observation that all galaxies contain some old stars led astronomers to the hypothesis that galaxies were born fully formed near the time when the universe began its expansion. If this hypothesis were correct, the most distant galaxies should have shapes and sizes very much like the galaxies we see nearby. According to this view, galaxies, after they formed, should then change only slowly, as successive generations of stars within them formed, evolved, and died. As the interstellar matter was slowly used up and fewer new stars formed, the galaxies would gradually become dominated by fainter, older stars and look dimmer and dimmer.
                  - paragraph [ref=f525e36]: Thanks to the new generation of large ground- and space-based telescopes, we now know that this picture of galaxies evolving peacefully and in isolation from one another is completely wrong. As we will see later in this chapter, galaxies in the distant universe do not look like the Milky Way and nearby galaxies such as Andromeda, and the story of their development is more complex and involves far more interaction with their neighbors.
                  - paragraph [ref=f525e37]: Why were astronomers so wrong? Up until the early 1990s, the most distant normal galaxy that had been observed emitted its light 8 billion years ago. Since that time, many galaxies—and particularly the giant ellipticals, which are the most luminous and therefore the easiest to see at large distances—did evolve peacefully and slowly. But the Hubble, Spitzer, Herschel, Keck, and other powerful new telescopes that have come on line since the 1990s make it possible to pierce the 8-billion-light-year barrier. We now have detailed views of many thousands of galaxies that emitted their light much earlier.
                  - paragraph [ref=f525e38]: "In Figure \\(\\PageIndex{3}\\), the image is the result of an 11-day-long observation with the Hubble Space Telescope of a tiny region of sky, located toward the constellation Fornax near the south celestial pole. This is an area that has only a handful of Milky Way stars. There are about 10,000 objects in this single image, nearly all of them galaxies, each with tens or hundreds of billions of stars. We can see some pinwheel-shaped spiral galaxies, which are like the Milky Way. But we also find a large variety of peculiar-shaped galaxies that are in collision with companion galaxies. Elliptical galaxies, which contain mostly old stars, appear as reddish blobs."
                  - figure [ref=f525e39]:
                    - img "Hubble Ultra-Deep Field showing thousands of galaxies of varied shapes and ages. Details in caption." [ref=f525e40]
                    - generic [ref=f525e41]:
                      - text: "Figure \\(\\PageIndex{3}\\) : Hubble Ultra-Deep Field. This 11-day Hubble Space Telescope exposure of a small patch of sky reveals roughly 10,000 galaxies of varying shapes and ages. The oldest galaxies have very different shapes compared to modern galaxies. ("
