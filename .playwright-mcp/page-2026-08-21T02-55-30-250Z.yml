                      - text: .
                  - paragraph [ref=f525e46]: "Much of the work on the evolution of galaxies has progressed by studying a few specific small regions of the sky where the Hubble, Spitzer, and ground-based telescopes have taken extremely long exposure images. This allowed astronomers to detect very faint, very distant, and therefore very young galaxies. Figure \\(\\PageIndex{4}\\) is a Hubble Space Telescope image that includes what are probably galaxies under construction in the early universe. The boxes in this color image show enlargements of 18 groups of stars smaller than galaxies as we know them. All these objects emitted their light about 11 billion years ago. They are typically only about 2,000 light-years across, which is much smaller than the Milky Way, with its diameter of 100,000 light-years. These 18 objects are found in a region only 2 million light-years across and are close enough together that they will probably collide and merge to build one or more normal galaxies."
                  - paragraph [ref=f525e47]: "Although we do not have spectra for most of the faint galaxies, the Hubble Space Telescope is especially well suited to studying their shapes because the images taken in space are not blurred by Earth's atmosphere. To the surprise of astronomers, the distant galaxies did not fit Hubble's classification scheme at all. Remember that galaxies are usually ellipticals or spirals, with some irregulars. The distant galaxies observed by the Hubble Space Telescope look very different from present-day galaxies, without identifiable spiral arms, disks, and bulges Figure \\(\\PageIndex{1}\\). They also tend to be much clumpier than most galaxies today. In other words, it's becoming clear that the shapes of galaxies have changed significantly over time. In fact, the old classification system works well for only the last half of the age of the universe. Before then, galaxies were much more chaotic."
                  - figure [ref=f525e48]:
                    - img "Hubble image of 18 small early galaxy fragments with enlarged insets. Details in caption." [ref=f525e49]
                    - generic [ref=f525e50]:
                      - text: "Figure \\(\\PageIndex{4}\\) : Protogalaxies. This Hubble Space Telescope image reveals 18 small, compact groups of stars from about 11 billion years ago, each far smaller than the Milky Way and packed within a region only 2 million light-years across, likely destined to eventually become a galaxy. ("
