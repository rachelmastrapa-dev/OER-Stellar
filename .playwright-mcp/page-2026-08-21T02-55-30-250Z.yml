                  - heading "Galactic Evolution" [level=2] [ref=f525e2]
                  - paragraph [ref=f525e3]: Let's begin by exploring some techniques astronomers use to study how galaxies are born and change over cosmic time. Unfortunately, we are unable to watch a galaxies grow and change over time. In a human lifetime, or even over the entire history of human civilization, individual galaxies change hardly at all. We need other tools than just patiently observing single galaxies in order to study and understand those long, slow changes. Fortunately, the universe itself is a kind of time machine that permits us to observe remote galaxies as they were long ago. For the closest galaxies, like the Andromeda galaxy, the time the light takes to reach us is on the order of a few hundred thousand to a few million years, a short amount of time in astronomy. When we have observe galaxies that are very far away we are seeing them as they were when the light left them billions of years ago.
                  - paragraph [ref=f525e4]: "By observing more distant objects, we look further back toward a time when both galaxies and the universe were young. Figure \\(\\PageIndex{1}\\) is a Hubble Space Telescope image of the galactic cluster Abell 2744, also known as Pandora's cluster. t contains several hundred galaxies, and we are seeing them as they looked 3.5 billion years ago. The immense gravity in Abell 2744 acts as a gravitational lens to warp space and brighten and magnify images of nearly 3000 distant background galaxies. The more distant galaxies (many of them quite blue) appear as they did more than 12 billion years ago, not long after the Big Bang. Blue galaxies were much more common in that earlier time than they are today. These galaxies appear blue because they are undergoing active star formation and making hot, bright blue stars."
                  - figure [ref=f525e5]:
                    - img "Hubble image of Abell 2744 gravitationally lensing ancient background galaxies. Details in caption." [ref=f525e6]
                    - generic [ref=f525e7]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Astronomical Time Travel. This Hubble Space Telescope image captures the massive galaxy cluster Abell 2744, whose gravity bends and magnifies light from thousands of much more distant background galaxies through gravitational lensing. The magnified galaxies appear as they did 12 billion years ago, giving astronomers the ability to see the distant past. ("
                      - link "CC BY 4.0" [ref=f525e8]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f525e9]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f525e10]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f525e11]':
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.08:_Accessible_Descriptions#Figure_17.1.1_Astronomical_Time_Travel
                      - text: .
                  - paragraph [ref=f525e12]: A galaxy's look-back time is how far back in time we are seeing the galaxy. To learn how galaxies change over time, astronomers observe many galaxies at many different cosmic distances. Galaxies at different distances have different look-back times. If we can study a thousand very distant baby galaxies when the universe was 1 billion years old, and another thousand slightly closer toddler galaxies when it was 2 billion years old, and so on until the present 13.8-billion-year-old universe of mature adult galaxies near us today, then maybe we can piece together a coherent picture of how the all galaxies evolve over time. This allows us to reconstruct the life story of galaxies since the universe began, even though we can't follow a single galaxy from infancy to old age.
                  - paragraph [ref=f525e13]: "Fortunately, there is no shortage of galaxies to study. Hold up your pinky at arm's length: the part of the sky blocked by your fingernail contains about one million galaxies. The sky is filled with galaxies, all of them, except for Andromeda and the Magellanic Clouds, too faint to see with the naked eye. There are more than 2 trillion galaxies in the observable universe, each one with about 100 billion stars."
                  - heading "Spectra, Colors, and Shapes" [level=3] [ref=f525e14]
                  - paragraph [ref=f525e15]: Astronomers have many methods to measure the properties of galaxies. The distance to a galaxy is derived from its redshift. The amount of redshift depends on how much the lines in its spectrum are shifted to the red because of the expansion of the universe. The conversion of redshift to a distance depends on certain properties of the universe, including the value of the Hubble constant and how much mass the galaxy contains. For the purposes of this chapter, it is enough to know that the current best estimate for the age of the universe is 13.8 billion years. In that case, if we see an object that emitted its light 6 billion light-years ago, we are seeing it as it was when the universe was almost 8 billion years old. If we see something that emitted its light 13 billion years ago, we are seeing it as it was when the universe was less than a billion years old. So astronomers measure a galaxy's redshift from its spectrum, use the Hubble constant plus a model of the universe to turn the redshift into a distance, and use the distance and the constant speed of light to infer how far back in time they are seeing the galaxy, the look-back time. In addition to distance and look-back time, studies of the Doppler shifts of a galaxy's spectral lines can tell us how fast the galaxy is rotating and hence how massive it is. Detailed analysis of such lines can also indicate the types of stars that inhabit a galaxy and whether it contains large amounts of interstellar matter.
                  - paragraph [ref=f525e16]: "Unfortunately, many galaxies are so faint that collecting enough light to produce a detailed spectrum is currently impossible. Astronomers thus have to use their overall colors to estimate what kinds of stars inhabit the faintest galaxies. In Figure \\(\\PageIndex{1}\\), some of the galaxies are very blue and others are reddish-orange. Now remember that hot, luminous blue stars are very massive and have lifetimes of only a few million years. If we see a galaxy where blue colors dominate, we know that it must have many hot, luminous blue stars, and that star formation must have taken place in the few million years before the light left the galaxy. Blue galaxies have young stars. In a yellow or red galaxy, on the other hand, the young, luminous blue stars that surely were made in the galaxy's early bursts of star formation must have died already. The galaxy must contain mostly old yellow and red stars that last a long time in their main-sequence stages and thus typically formed billions of years before the light that we now see was emitted. Red or orange galaxies have old stars."
                  - paragraph [ref=f525e17]: Another important clue to the nature of a galaxy is its shape. With enough spatial resolution, the shape of spiral galaxies can be distinguished from elliptical galaxies even for very distant galaxies. Observations show that spiral galaxies contain young stars and large amounts of interstellar matter, while elliptical galaxies have mostly old stars and very little or no star formation. Elliptical galaxies turned most of their interstellar matter into stars many billions of years ago, while star formation has continued until the present day in spiral galaxies. If we can count the number of galaxies of each type over the age of the universe, it will help us understand how the pace of star formation changes with time. As we will see later in this chapter, galaxies in the distant universet, young galaxies, look very different from the older galaxies that we see nearby in the present-day universe.
                  - heading "The First Generation of Stars" [level=3] [ref=f525e18]
                  - paragraph [ref=f525e19]:
                    - text: In addition to looking at the most distant galaxies we can find, astronomers look at the oldest stars of our own Galaxy to probe what happened in the early universe. Since stars are the source of nearly all the light emitted by galaxies, we can learn a lot about the
                    - strong [ref=f525e20]:
                      - link "evolution (of galaxies)" [ref=f525e21]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#evolution_of_galaxies
                    - text: by studying the stars within them. What we find is that nearly all galaxies contain at least some very old stars. For example, our own Galaxy contains globular clusters with stars that are at least 13 billion years old, and some may be even older than that. Therefore, if we count the age of the Milky Way as the age of its oldest constituents, the Milky Way must have been born at least 13 billion years ago. It appears that at least some of the globular-cluster stars in the Milky Way must have formed less than a billion years after the expansion of the universe began.
                  - paragraph [ref=f525e22]: Several other observations also establish that star formation in the cosmos began very early. Astronomers have used spectra to determine the composition of some elliptical galaxies that are so far away that the light we see left them when the universe was about 6.5 billion years old. These ellipticals contain old red stars, which must have formed billions of years earlier still. When we make computer models of how such galaxies evolve with time, they tell us that star formation in elliptical galaxies began less than a billion years or so after the universe started its expansion, and new stars continued to form for a few billion years. But then star formation apparently stopped. When we compare distant elliptical galaxies with ones nearby, we find that ellipticals have not changed very much since the universe in the last 6.5 billion years, about half the age of the universe.
                  - paragraph [ref=f525e23]: "Observations of the most luminous galaxies take us even further back in time. Recently, as we have already noted, astronomers have discovered a few galaxies that are so far away that the light we see now left them less than a billion years or so after the beginning of the universe. Figure \\(\\PageIndex{2}\\) is a Hubble Space Telescope image of a luminous galaxy at a redshift z = 8.68, which corresponds to 13.2 billion light years so we are observing this galaxy as it appeared about 13.2 billion years ago. This galaxy was detected because it has a strong emission line of hydrogen. This line is produced in regions where the formation of hot, young stars is taking place. The spectra of some of these distant galaxies already contain lines of heavy elements, including carbon, silicon, aluminum, and sulfur. These elements were not present when the universe began but had to be manufactured in the interiors of stars. This means that when the light from these galaxies was emitted, an entire generation of stars had already been born, lived out their lives, and died. The new elements made in their interiors were released through supernova explosions and recycled into new stars before the universe was a billion years old. And it wasn't just a few stars in each galaxy that got started this way. Enough had to live and die to affect the overall composition of the galaxy, in a way that we can still measure in the spectrum from far away."
                  - figure [ref=f525e24]:
                    - img "Hubble image of a distant, 13.2 billion year old galaxy, with Spitzer infrared inset. Details in caption." [ref=f525e25]
                    - generic [ref=f525e26]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Very Distant Galaxy. This Hubble Space Telescope image, with a lower-resolution Spitzer Space Telescope infrared inset, includes a distant galaxy at redshift z = 8.68, seen as it appeared roughly 13.2 billion years ago. The galaxy was identified by a strong hydrogen emission line that marks regions of active star formation. ("
