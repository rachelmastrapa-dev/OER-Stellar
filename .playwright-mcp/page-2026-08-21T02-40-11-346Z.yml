                  - heading "Gravitational Waves" [level=2] [ref=f435e2]
                  - paragraph [ref=f435e3]:
                    - text: According to general relativity, the geometry of spacetime depends on where matter is located. Any rearrangement of matter, such as an object changing shape, creates a disturbance in spacetime. This disturbance is called a
                    - strong [ref=f435e4]:
                      - link "gravitational wave" [ref=f435e5]:
                        - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.05:_Key_Terms#gravitational wave
                    - text: ", and relativity predicts that it should spread outward at the speed of light. The big problem with trying to study such waves is that they are significantly weaker than electromagnetic waves, or light. Astronomers had to design an entirely new type of observatory just to detect them."
                  - heading "Proof from a Pulsar" [level=3] [ref=f435e6]
                  - paragraph [ref=f435e7]: We've had indirect evidence for some time that gravitational waves exist. In 1974, astronomers Joseph Taylor and Russell Hulse discovered a pulsar, called PSR1913+16, orbiting another neutron star. Pulled by the powerful gravity of its companion, the pulsar is moving at about one-tenth the speed of light in its orbit.
                  - paragraph [ref=f435e8]: According to general relativity, this system should be radiating energy in the form of gravitational waves at a high enough rate to cause the pulsar and its companion to spiral closer together. According to Kepler's third law, if the distance between them decreases, then the orbital period should decrease, in this case by one ten-millionth of a second per orbit. Continuing observations showed that their orbital period is decreasing by precisely this amount. Such a loss of energy in the system can be due only to the radiation of gravitational waves, confirming their existence. Taylor and Hulse shared the 1993 Nobel Prize in physics for this work.
                  - heading "Gravitational Wave Observatories" [level=3] [ref=f435e9]
                  - paragraph [ref=f435e10]: "After indirect proof convinced physicists that gravitational waves exist, the next thing to do was to detect the waves directly. What type of phenomena are powerful enough to produce gravitational waves with amplitudes large enough that we can measure them? Theoretical calculations suggest some of the most likely events that would give a burst of gravitational waves strong enough that our equipment on Earth could measure it are:"
                  - list [ref=f435e11]:
                    - listitem [ref=f435e12]: two neutron stars in a binary system that spiral together until they merge
                    - listitem [ref=f435e13]: the swallowing of a neutron star by a black hole
                    - listitem [ref=f435e14]: the merger of two black holes
                    - listitem [ref=f435e15]: the implosion of a massive star to form a neutron star or a black hole
                    - listitem [ref=f435e16]: the tremendous movement of matter at the beginning of the universe
                  - paragraph [ref=f435e17]: Since the 1970s, scientists have been developing an experiment to try to detect gravitational waves from a source on this list. The US experiment, which was built with collaborators from the UK, Germany, Australia and other countries, is named Laser Interferometer Gravitational-Wave Observatory (LIGO). LIGO currently has two observing stations, one in Louisiana and the other in the state of Washington. The effects of gravitational waves are so small that confirmation of their detection will require simultaneous measurements by two widely separated facilities. Local events that might cause small motions within the observing stations and mimic gravitational waves, such as small earthquakes, ocean tides, and even traffic, should affect the two sites differently.
                  - paragraph [ref=f435e18]: "Each of the LIGO stations consists of two 4-kilometer-long, 1.2-meter-diameter vacuum pipes arranged in an L-shape. A mirror is suspended by wire at each of the four ends of the pipes. Ultra-stable laser light is reflected from the mirrors and travels back and forth along the vacuum pipes Figure \\(\\PageIndex{1}\\). If gravitational waves pass through the LIGO instrument, then, according to general relativity, the waves will affect local spacetime. The length of the pipes will alternately stretch and shrink, by a very small amount. The lasers are designed to detect this tiny change. When one pipe gets longer, the other will get shorter, and vice versa. The challenge of this experiment how very small the change in length is. In fact, to detect a gravitational wave, the change in the distance to the mirror must be measured with an accuracy of one ten-thousandth the diameter of a proton. In 1972, Rainer Weiss of MIT wrote a paper suggesting how this seemingly impossible task might be accomplished."
                  - figure [ref=f435e19]:
                    - img "LIGO gravitational wave observatory. Details in caption." [ref=f435e20]
                    - generic [ref=f435e21]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Gravitational Wave Observatory. The LIGO detectors use laser interferometry along two perpendicular 4-kilometer pipes to detect the tiny distortions in spacetime caused by passing gravitational waves. ("
                      - link "CC BY 4.0" [ref=f435e22]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f435e23]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
