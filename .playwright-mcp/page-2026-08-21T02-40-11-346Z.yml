                      - 'link "Accessible description of Figure \\(\\PageIndex{2}\\)" [ref=f435e38]':
                        - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.3.2_Gravitational_Wave
                      - text: .
                  - paragraph [ref=f435e39]:
                    - text: LIGO has also collaborated Virgo, a gravitational wave detector operated by the European Gravitational Observatory in Italy to build a catalog of over 90 events. Most were mergers of two black holes. In the most extreme merger, black holes with masses of 86 and 65 times the mass of the Sun merged to form a black hole with a mass of about 142 times the mass the Sun, and released energy equivalent to 9 times the mass of our Sun. Astronomers are not yet sure how black holes in this unexpected mass range form. Bear in mind that the kind of black holes in binary star systems that we discussed in
                    - link "Evidence for Black Holes" [ref=f435e40]:
                      - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.02:_Evidence_for_Black_Holes
                    - text: have masses ranging from 4 to 15 times the mass of the Sun.
                  - paragraph [ref=f435e41]: While astronomers can learn about the masses of objects involved in gravitational wave events, the challenge is to locate the event in the sky precisely. A single gravitational wave detector cannot determine accurately the direction to a gravitational wave source. Four comparable detectors operating simultaneously are required to localize a source of gravitational waves to a specific location in the sky. The fourth observing run with four detectors, including the two LIGO detectors, Virgo, and KAGRA in Japan, was completed in 2025. LIGO India will be a fifth, thereby enhancing the probability that at least four detectors will be operational simultaneously. Experience has shown that the LIGO and Virgo detectors are down about 25 percent of the time because these complex systems are difficult to run.
                  - heading "Neutron Star Mergers" [level=3] [ref=f435e42]
                  - paragraph [ref=f435e43]: In late 2017, data from the LIGO and Virgo detectors provided an accurate position for what analysis showed was the spiraling together of two neutron stars with masses of 1.1 to 1.6 times the mass of the Sun. With an accurate location known, follow up observations with ground-based telescopes detected light, or electromagnetic waves, from a gravitational wave event for the first time. The observations showed that this source was located in NGC 4993, a galaxy at a distance of about 130 million light-years in the direction of the constellation Hydra. The Fermi satellite detected a flash of gamma rays at the same time and in the same direction, which confirms the long-standing hypothesis that mergers of neutron stars are progenitors of short gamma-ray bursts. Spectra showed that the merger ejected material with a mass of about 6 percent of the mass of the Sun at a speed of one-tenth the speed of light.
                  - paragraph [ref=f435e44]: This material is rich in heavy elements. First estimates suggest that the merger produced about 200 Earth masses of gold, and around 500 Earth masses of platinum. This makes clear that neutron star mergers are a significant source of heavy elements. More such mergers are being found and they will improve estimates of the frequency at which neutron star mergers occur.
                  - paragraph [ref=f435e45]: In June 2021, scientists from LIGO and Virgo announced the first detection of mergers between black holes and neutron stars, another of the really energetic events that we listed as possible sources for a detectable burst of gravitational waves. Again, no electromagnetic waves from the two events were observed or expected, demonstrating the importance of multi-messenger astronomy. This is the practice of observing the same event using different detection methods, such as detecting binary neutron star mergers with both electromagnetic and gravitational waves. Since theory predicts that only one type of merger will release electromagnetic waves, but all will produce gravitational way, it is an excellent confirmation that astronomers are using the correct models.
                  - paragraph [ref=f435e46]: "Figure \\(\\PageIndex{3}\\) is a collection of black hole observations detected by either gravitational or electromagnetic waves. The light blue dots represent black hole mergers seen with LIGO-Virgo, with the individual black holes and the resulting merged black hole connected with an arrow. The purple dots represent black holes seen with electro-magnetic radiation. These have significantly smaller masses. The orange dots represent neutron star mergers seen through the gravitational waves they emit. The yellow dots are neutron stars seen with electro-magnetic radiation. This demonstrates how gravitational wave observations have allowed astronomers to detect very large black holes, that are undetectable with electromagnetic waves. Because of the scientific significance of the observations of gravitational waves, three of the LIGO project leaders, Rainer Weiss of MIT, and Kip Thorne and Barry Barish of Caltech, were awarded the Nobel Prize in 2017."
                  - paragraph [ref=f435e47]: Ground-based gravitational-wave detectors can detect mergers of black holes with masses up to about 100 times the mass of the Sun. Astronomers would now like to look for the merger of distant supermassive black holes with masses of thousands to millions of times larger, which might have occurred when the first generation of stars formed, only a few hundred million years after the Big Bang. The gravitational waves emitted by mergers of supermassive black holes are so long that it is necessary to go to space to build an observatory large enough to detect them.
                  - paragraph [ref=f435e48]: The European Space Agency (ESA), with contributions from NASA, is planning to launch a facility named Laser Interferometer Space Antenna (LISA) in 2035 to search for mergers of black holes with masses thousands to millions of times larger than the mass of the Sun. The experiment will consist of three spacecraft arranged in an equilateral triangle with sides 2.5 million km long, flying along an Earth-like heliocentric orbit. The detector is a simple object called a test mass. It floats free inside each spacecraft, effectively in free-fall, while the spacecraft around it absorbs the effects of light pressure, solar wind particles, and anything that might perturb its orbit. Lasers will be used to measure very accurately the distances between the spacecraft. Changes in distance will then signal the passing of gravitational waves.
                  - figure [ref=f435e49]:
                    - img "Masses of black holes and neutron stars from LIGO-Virgo and other observations. Details in caption." [ref=f435e50]
                    - generic [ref=f435e51]:
