                        - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.3.1_Gravitational_Wave_Observatory
                      - text: .
                  - paragraph [ref=f435e26]: A great deal of new technology had to be developed, and work on the laboratory, with funding from the National Science Foundation, began in 1979. Rainer's graduate student Nergis Mavalvala developed a prototype laser interferometer. A full-scale version was built and operated from 2002 to 2010. The prototype was not expected to have the sensitivity required to actually detect gravitational waves from an astronomical source. Advanced LIGO, built to be more precise with the technology developed in the prototype, went into operation in 2015 and almost immediately detected gravitational waves.
                  - heading "Black Hole Mergers" [level=3] [ref=f435e27]
                  - paragraph [ref=f435e28]: What LIGO found was gravitational waves produced in the final fraction of a second of the merger of two black holes. The black holes had masses of 20 and 36 times the mass of the Sun, and the merger took place 1.3 billion years ago. The gravitational waves occurred so far away that it has taken that long for them, traveling at the speed of light, to reach us.
                  - paragraph [ref=f435e29]:
                    - text: In the cataclysm of the merger, about three times the mass of the Sun was converted to energy. Using E =
                    - generic [ref=f435e30]:
                      - text: mc
                      - superscript [ref=f435e31]: "2"
                    - text: ", this event produced power about 10 times the power produced by all the stars in the entire visible universe, all in the form of gravitational waves. The event was recorded in Louisiana about 7 milliseconds before the detection in Washington. This indicates that the source was located somewhere in the southern hemisphere sky. Chart (a) in Figure in the top panel of the chart in Figure \\(\\PageIndex{2}\\), includes the signal from Washington on the top, the signal from Louisiana in the middle, and a comparison of both signals on the bottom. Shifting the signal by the small delay between both stations results in a good match between the two signals. Model results are plotted over the signals that also agree with the data. Unfortunately, the merger of two black holes is not expected to produce any light, so this is the only observation we have of the event. For now we can only imagine that the event was similar to Illustration (b) in Figure \\(\\PageIndex{2}\\), with two black holes moving closer to each other."
                  - figure [ref=f435e32]:
                    - img "3 charts of gravitational wave data and an illustration of merging black holes. Details in caption." [ref=f435e33]
                    - generic [ref=f435e34]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Gravitational Wave. The close agreement between the measured strain at Hanford and Livingston and the theoretical prediction in Chart (a) confirmed the detection of gravitational waves, produced by the merging black holes illustrated in (b). ("
                      - link "CC BY 4.0" [ref=f435e35]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
