            - application "Rich Text Editor, editarea" [ref=f340e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f340e336]: "<h2>The H-R Diagram</h2> <p class=\"lt-phys-64784\">One of the best ways to summarize all of these details about how a star or protostar changes with time is to use a Hertzsprung-Russell (H–R) diagram. When looking at an H–R diagram, the x-axis measures temperature and is plotted increasing toward the left. As a star goes through the stages of its life, its luminosity and temperature change. Thus, its position on the H–R diagram, in which luminosity is plotted against temperature, also changes. As a star ages, we must replot it in different places on the diagram. Therefore, astronomers often speak of a star moving on the H–R diagram, or of its evolution tracing out a path on the diagram. In this context, “tracing out a path” has nothing to do with the star’s motion through space; this is just a shorthand way of saying that its temperature and luminosity change as it evolves.</p> <p class=\"lt-phys-64784\">To estimate just how much the luminosity and temperature of a star change as it ages, we must resort to calculations. Theorists compute a series of models for a star, with each successive model representing a later point in time. Stars may change for a variety of reasons. Protostars, for example, change in size because they are contracting, and their temperature and luminosity change as they do so. After nuclear fusion begins in the star’s core, main-sequence stars change because they are using up their nuclear fuel.</p> <p class=\"lt-phys-64784\">Given a model that represents a star at one stage of its evolution, we can calculate what it will be like at a slightly later time. At each step, the model predicts the luminosity and size of the star, and from these values, we can figure out its surface temperature. A series of points on an H–R diagram, calculated in this way, allows us to follow the life changes of a star and hence is called its evolutionary track.</p> <h2 class=\"lt-phys-64784\">Evolutionary Tracks</h2> <p class=\"lt-phys-64784\">Let’s now use these ideas to follow the evolution of protostars that are on their way to becoming main-sequence stars. Note that, in astronomy,&nbsp;the term evolution means the change over time of an individual star, unlike the biological term for how species change over generations. The evolutionary tracks of newly forming stars with a range of stellar masses are shown in Figure \\(\\PageIndex{1}\\). These young stellar objects are not yet producing energy by nuclear reactions, but they derive energy from gravitational contraction.&nbsp;Remember that the surface temperature on the horizontal axis increases toward the left. Tracks are plotted on the H–R diagram to show how stars of different masses change during the early parts of their lives. The number next to each dark point on a track is the rough number of years, predicted by computer models,&nbsp;it takes an embryo star to reach that stage. The more mass a star has, the shorter time it takes to go through each stage. Stars above the dashed line are typically still surrounded by infalling material and are hidden by it.</p> <figure><img alt=\"Hertzsprung-Russell diagram with protostars of different mass. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45796/3f0a2ec9e1177cafc917261830736d061621cf51\" /> <figcaption>Figure \\(\\PageIndex{1}\\): Evolutionary Tracks of Protostars. The tracks traced&nbsp;on the H–R diagram by developing protostars demonstrate how the length of time they take to form decreases with mass. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY\">CC BY</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.2.1_Evolutionary_Tracks_of_Protostars\" title=\"11.6: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64784\">Initially, a protostar remains fairly cool with a very large radius and a very low density. It is transparent to infrared radiation, and the heat generated by gravitational contraction can be radiated away freely into space. Because heat builds up slowly inside the protostar, the gas pressure remains low, and the outer layers fall almost unhindered toward the center. Thus, the protostar undergoes very rapid collapse, a stage that corresponds to the roughly vertical lines at the right of Figure \\(\\PageIndex{1}\\). As the star shrinks, its surface area gets smaller, and so its total luminosity decreases. The rapid contraction stops only when the protostar becomes dense and opaque enough to trap the heat released by gravitational contraction.</p> <p class=\"lt-phys-64784\">When the star begins to retain its heat, the contraction becomes much slower, and changes inside the contracting star keep the luminosity of stars like our Sun roughly constant. The surface temperatures start to build up, and the star “moves” to the left in the H–R diagram. Stars first become visible only after the stellar wind described earlier clears away the surrounding dust and gas. This can happen during the rapid-contraction phase for low-mass stars, but high-mass stars remain shrouded in dust until they end their early phase of gravitational contraction, depicted by&nbsp;the dashed line in Figure \\(\\PageIndex{1}\\).</p> <p class=\"lt-phys-64784\">When the star’s central temperature reaches about 12 million K, it is able&nbsp;to fuse hydrogen into helium.&nbsp;&nbsp;At this point, the star has reached the main sequence. It is now a full-fledged star, more or less in equilibrium, and its rate of change slows dramatically. Only the gradual depletion of hydrogen as it is transformed into helium in the core slowly changes the star’s properties. The mass of a star determines exactly where it falls on the main sequence. In Figure \\(\\PageIndex{1}\\), massive stars on the main sequence have high temperatures and high luminosities. Low-mass stars have low temperatures and low luminosities.</p> <p class=\"lt-phys-64784\">Objects of extremely low mass never achieve high-enough central temperatures to ignite nuclear reactions. The lower end of the main sequence stops where stars have a mass just barely great enough to sustain nuclear reactions at a sufficient rate to stop gravitational contraction. This critical mass is calculated to be about 0.075 times the mass of the Sun. Objects below this critical mass are called either brown dwarfs or planets. At the other extreme, the upper end of the main sequence terminates at the point where the energy radiated by the newly forming massive star becomes so great that it halts the accretion of additional matter. The upper limit of stellar mass is between 100 and 200 solar masses.</p> <h2 class=\"lt-phys-64784\">Evolutionary Timescales</h2> <p class=\"lt-phys-64784\">How long it takes a star to form depends on its mass. The numbers that label the points on each track in Figure \\(\\PageIndex{1}\\) are the times, in years, required for the embryo stars to reach the stages we have been discussing. Stars of masses much higher than the Sun’s reach the main sequence in a few thousand to a million years. The Sun required millions of years before it was born. Tens of millions of years are required for stars of lower mass to evolve to the lower main sequence. Massive stars go through all stages of evolution faster than low-mass stars do.</p> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploratoin: Interactive Activity</span></h5> <p>Watch this short animation from the European Space Agency (ESA) for a visual explanation of how stars are organized on the Hertzsprung-Russell diagram and how stellar properties such as temperature, luminosity, and size are related: <a href=\"https://www.youtube.com/watch?v=mY2edzGYWyU\" rel=\"noopener noreferrer\" target=\"_blank\"> Hertzsprung-Russell Diagram Animation (ESA) </a>.</p> </section>"
