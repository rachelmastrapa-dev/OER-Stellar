                        - cell "Tenths of a second" [ref=f402e217]
                  - paragraph [ref=f402e218]: In the meantime, as the core was experiencing its last catastrophe, the outer shells of neon, oxygen, carbon, helium, and hydrogen in the star did not yet know about the collapse. Information about the physical movement of different layers travels through a star at the speed of sound and cannot reach the surface in the few tenths of a second required for the core collapse to occur. The collapse of the core continued until the densities rose to several times that of an atomic nucleus. The resistance to further collapse then became so great that the core rebounded. Infalling material ran into the rebounding core and was thrown outward with a great shock wave. Neutrinos poured out of the core, helping the shock wave blow the star apart. The shock reached the surface of the star a few hours later, and the star began to brighten into a supernova.
                  - paragraph [ref=f402e219]: "Astronomers continue and learn from SN1987A. The James Webb Space Telescope collected the image in Figure \\(\\PageIndex{6}\\) nearly 40 years since its discovery in February of 1987. SN 1987A has a central structure like a keyhole. This center is packed with clumpy gas and dust ejected by the supernova explosion. The dust is so dense that even near-infrared light that Webb detects can’t penetrate it. A bright, equatorial ring surrounds the inner keyhole, forming a bandthat connects two faint arms of hourglass-shaped outer rings. The equatorial ring is the same ring shown in Figure \\(\\PageIndex{5}\\). Now spots are found on the exterior to the ring, with diffuse light surrounding it. These are the locations of supernova shocks hitting more exterior material."
                  - figure [ref=f402e220]:
                    - img "SN 1987 by James Webb Space Telescope. Details in text." [ref=f402e221]
                    - generic [ref=f402e222]:
                      - text: "Figure \\(\\PageIndex{6}\\): JWST Observes SN 1987. James Webb Space Telescope (JWST) observed 1987A almost 40 years after it was first detected, identifying new structures. ("
                      - link "Public Domain" [ref=f402e223]:
                        - /url: https://en.wikipedia.org/wiki/Public_domain
                      - text: ;
                      - link "NASA, ESA, CSA, M. Matsuura (Cardiff University), R. Arendt (NASA's Goddard Spaceflight Center & University of Maryland, Baltimore County), C. Fransson (Stockholm University), J. Larsson (KTH Royal Institute of Technology), A. Pagan (STScI)" [ref=f402e224]:
                        - /url: https://www.nasa.gov/
                      - text: via
                      - link "Wikimedia Commons" [ref=f402e225]:
                        - /url: https://commons.wikimedia.org/wiki/File:SN_1987A_(NIRCam_image)_(SN1987a-1).jpg
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{6}\\)." [ref=f402e226]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.6_JWST_Observes_SN_1987A
                  - heading "Radioactive Elements" [level=3] [ref=f402e227]
                  - paragraph [ref=f402e228]: "The variations in the brightness of SN 1987A in the days and months after its discovery, which are depicted in Figure \\(\\PageIndex{7}\\). Remember that magnitudes are a backward measure of brightness: the larger the magnitude, the dimmer the object looks. In a single day, the star soared in brightness by a factor of about 1000 and became just visible without a telescope. The star then continued to increase slowly in brightness until it was about the same apparent brightness as the stars in the Little Dipper. Up until about day 40 after the outburst, the energy being radiated away was produced by the explosion itself. But then SN 1987A did not continue to fade away, as we might have expected the light from the explosion to do. Instead, SN 1987A remained bright as energy from newly created radioactive elements came into play."
                  - figure [ref=f402e229]:
                    - img "Changes in brightness of 1987A over time. Details in text." [ref=f402e230]
                    - generic [ref=f402e231]:
                      - text: "Figure \\(\\PageIndex{7}\\) : SN 1987A Brightness vs. Time. SN 1987 briefly increased in brightness a few months after it was first detected, likely due to the radioactive decay of Nickel-56. ("
                      - link "CC BY" [ref=f402e232]:
