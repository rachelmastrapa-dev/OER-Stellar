                      - 'link "Alternative description of Figure \\(\\PageIndex{7}\\)" [ref=f402e235]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.7_SN_1987A_Brightness_vs._Time
                      - text: .
                  - paragraph [ref=f402e236]: One of the elements formed in a supernova explosion is radioactive nickel, with an atomic mass of 56. Nickel-56 is unstable and changes spontaneously, with a half-life of about 6 days, to cobalt-56. A half-life is the time it takes for half the nuclei in a sample to undergo radioactive decay. Cobalt-56 in turn decays with a half-life of about 77 days to iron-56, which is stable. Energetic gamma rays are emitted when these radioactive nuclei decay. Those gamma rays then serve as a new source of energy for the expanding layers of the supernova. The gamma rays are absorbed in the overlying gas and re-emitted at visible wavelengths, keeping the remains of the star bright.
                  - paragraph [ref=f402e237]: Astronomers did observe brightening due to radioactive nuclei in the first few months following the supernova’s outburst and then saw the extra light die away as more and more of the radioactive nuclei decayed to stable iron. The gamma-ray heating was responsible for virtually all of the radiation detected from SN 1987A after day 40. Some gamma rays also escaped directly without being absorbed. These were detected by Earth-orbiting telescopes at the wavelengths expected for the decay of radioactive nickel and cobalt, confirming our understanding that new elements were formed in the supernova.
                  - heading "Neutrinos from SN 1987A" [level=3] [ref=f402e238]
                  - paragraph [ref=f402e239]: If there had been any human observers in the Large Magellanic Cloud about 160,000 years ago, the explosion we call SN 1987A would have been a brilliant spectacle in their skies. Yet we know that less than 1/10 of 1% of the energy of the explosion appeared as visible light. About 1% of the energy was required to destroy the star, and the rest was carried away by neutrinos. In the initial second of the event, their total luminosity exceeded the luminosity of all the stars in over a billion galaxies. The supernova generated this energy in a volume less than 50 kilometers in diameter. Since the neutrinos come directly from the heart of the supernova, their energies provided a measure of the temperature of the core as the star was exploding. The central temperature was about 200 billion K.
                  - paragraph [ref=f402e240]:
                    - text: In 1987, the neutrinos from SN 1987A were detected by two instruments almost a full day before Shelton’s observations. This is because the neutrinos get out of the exploding star more easily than light does, and also because you don’t need to wait until nightfall to detect of them. Both neutrino telescopes, one in a deep mine in Japan and the other under Lake Erie, consist of several thousand tons of purified water surrounded by several hundred light-sensitive detectors. Incoming neutrinos interact with the water to produce positrons and electrons, which move rapidly through the water and emit deep blue light. Altogether, 19 neutrinos were detected. Since the neutrino telescopes were in the Northern Hemisphere and the supernova occurred in the Southern Hemisphere, the detected neutrinos had already passed through Earth and were on their way back out into space when they were captured. Only a few neutrinos were detected because the probability that they will interact with ordinary matter is very, very low. It is estimated that the supernova actually released 10
                    - superscript [ref=f402e241]: "58"
                    - text: neutrinos.
