                  - heading "Supernovae" [level=2] [ref=f402e2]
                  - paragraph [ref=f402e3]:
                    - text: Supernovae were discovered long before astronomers realized that these spectacular cataclysms mark the death of stars. The word
                    - strong [ref=f402e4]:
                      - link "nova" [ref=f402e5]:
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.07:_Key_Terms#nova
                    - text: means “new” in Latin. Before telescopes, when a star too dim to be seen with the unaided eye suddenly flared up in a brilliant explosion, observers concluded it must be a brand-new star. Twentieth-century astronomers reclassified the explosions with the greatest luminosity as supernovae.
                  - paragraph [ref=f402e6]: From historical records of such explosions, studies of the remnants of supernovae in our Galaxy, and analyses of supernovae in other galaxies, we estimate that, on average, one supernova explosion occurs somewhere in the Milky Way Galaxy every 25 to 100 years. Unfortunately, however, no supernova explosion has been observable in our Galaxy since the invention of the telescope. Either we have been exceptionally unlucky or, more likely, recent explosions have taken place in parts of the Galaxy where interstellar dust blocks light from reaching us.
                  - heading "Supernovae in History" [level=3] [ref=f402e7]
                  - paragraph [ref=f402e8]: Although many supernova explosions in our own Galaxy have gone unnoticed, a few were so spectacular that they were clearly seen and recorded by sky watchers and historians at the time. We can use these records, going back two millennia, to help us pinpoint where the exploding stars were and thus where to look for their remnants today.
                  - paragraph [ref=f402e9]: The most dramatic supernova was observed in the year 1006. It appeared in May as a brilliant point of light visible during the daytime, perhaps 100 times brighter than the planet Venus. It was bright enough to cast shadows on the ground during the night and was recorded by observers all over Europe and Asia. Chinese astronomers, noting that it was a temporary spectacle, called it a guest star.
                  - paragraph [ref=f402e10]: "Astronomers David Clark and Richard Stephenson have scoured records from around the world to find more than 20 reports of this supernova. They found its faint remnant in the modern constellation of Lupus. Figure \\(\\PageIndex{1}\\) includes a composite view of the remnant, called SN 1006, from the Chandra X-Ray Observatory. The X-rays coming from the remnant are blue, the visible light is white-yellow, and the radio signal is red. From the way its filaments are expanding, it appears to be about 1000 years old."
                  - figure [ref=f402e11]:
                    - img "SN 1006 in X-ray, infrared, and visible light. Details in caption." [ref=f402e12]
                    - generic [ref=f402e13]:
                      - text: "Figure \\(\\PageIndex{1}\\) : SN 1006. A 1000 years later, the remnant of SN 1006 can be detected with X-ray and radio observations. ("
                      - link "CC BY" [ref=f402e14]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f402e15]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f402e16]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f402e17]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.1_SN_1006
                      - text: .
                  - paragraph [ref=f402e18]: "Another guest star, now known as SN 1054, was recorded in Chinese records in July 1054. The remnant of that star is one of the most famous and best-studied objects in the sky, called the Crab Nebula. When its explosion was first seen, we estimate that it was about as bright as the planet Jupiter. It was nowhere near as dazzling as the 1006 event but still quite dramatic to anyone who kept track of objects in the sky. SN 1054 is currently six-light-years wide. In Figure \\(\\PageIndex{2}\\), the orange filaments are mostly made of hydrogen. The rapidly spinning neutron star embedded in the center of the nebula is the dynamo powering the nebula's eerie interior bluish glow. The colors in the image indicate the different elements that were expelled during the explosion. Blue in the filaments in the outer part of the nebula represents neutral oxygen, green is singly-ionized sulfur, and red indicates doubly-ionized oxygen."
                  - figure [ref=f402e19]:
                    - img "SN 1054, known as the Crab Nebula. Details in text." [ref=f402e20]
                    - generic [ref=f402e21]:
                      - text: "Figure \\(\\PageIndex{2}\\): SN 1054. This Hubble Space Telescope image includes the remnant of SN 1054, known as the crab nebula, including hydrogen gas and light from the neutron star at its center. ("
                      - link "Public Domain" [ref=f402e22]:
                        - /url: https://en.wikipedia.org/wiki/Public_domain
                      - text: ;
                      - link "NASA, ESA, J. Hester and A. Loll (Arizona State University)" [ref=f402e23]:
                        - /url: https://www.nasa.gov/
                      - text: via
                      - link "Wikimedia Commons" [ref=f402e24]:
                        - /url: https://commons.wikimedia.org/wiki/File:Crab_Nebula.jpg
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f402e25]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.2_SN_1054
                      - text: .
                  - paragraph [ref=f402e26]:
                    - text: Another fainter supernova was seen in 1181. The next supernova became visible in November 1572 and, being brighter than the planet Venus, was quickly spotted by a number of observers, including
                    - link "Tycho Brahe" [ref=f402e27]:
                      - /url: /Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.03:_Brahe_Tycho
                    - text: . His careful measurements of the star over a year and a half showed that it was not a comet or something in Earth’s atmosphere since it did not move relative to the stars. Johannes Kepler, found his own supernova in 1604, now known as Kepler’s Supernova. Fainter than Tycho’s, it nevertheless remained visible for about a year.
                  - paragraph [ref=f402e28]: "No supernova has been spotted in our Galaxy for the past 300 years. Since the explosion of a visible supernova is a chance event, there is no way to say when the next one might occur. At their maximum brightness, the most luminous supernovae have about 10 billion times the luminosity of the Sun. For a brief time, a supernova may outshine the entire galaxy in which it appears. Figure \\(\\PageIndex{3}\\)) includes supernova 2014J, located in Messier 82 (M82), also known as the Cigar galaxy, roughly 11.5 million light-years from Earth. The supernova event is indicated by the box and the inset."
                  - figure [ref=f402e29]:
                    - img "SN 2014J located in M82. Details in text." [ref=f402e30]
                    - generic [ref=f402e31]:
                      - text: "Figure \\(\\PageIndex{3}\\) : SN 2014J. SN 2014J is a bright spot in this Hubble Space telescope image of M82, the Cigar Galaxy. ("
                      - link "CC BY" [ref=f402e32]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f402e33]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f402e34]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{3}\\)" [ref=f402e35]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.3_SN_2014J
                      - text: .
                  - heading "Supernova 1987A" [level=2] [ref=f402e36]
                  - paragraph [ref=f402e37]: "In February of 1987, Ian Shelton, a Canadian astronomer working at an observatory in Chile, saw a large bright spot in photograph of the Large Magellanic Cloud, a galaxy about 168,000 light-years away. Concerned that his photograph was flawed, Shelton went outside and saw that a new object had appeared in the sky. Now known as SN 1987A, since it was the first supernova discovered in 1987. It was the first time astronomers had observed a star before it became a supernova, since the star, a blue supergiant called Sanduleak, had been included in earlier surveys of the Large Magellanic Cloud. Later Hubble would collect an image of the supernova remnant with its inner and outer red rings of material in Figure \\(\\PageIndex{4}\\)."
                  - figure [ref=f402e38]:
                    - img "SN 1987A from Hubble Space Telescope. Details in caption." [ref=f402e39]
                    - generic [ref=f402e40]:
                      - text: "Figure \\(\\PageIndex{4}\\) : SN 1987A. This image is a composite of several images taken in 1994, 1996, and 1997—about a decade after supernova 1987A was first observed. ("
                      - link "CC BY" [ref=f402e41]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f402e42]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f402e43]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{4}\\)" [ref=f402e44]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.4_SN_1987A
                      - text: .
                  - heading "History of Sanduleak" [level=3] [ref=f402e45]
                  - paragraph [ref=f402e46]:
                    - text: By combining theory and observations at many different wavelengths, astronomers have reconstructed the life story of the star that became SN 1987A. Sanduleak formed about 10 million years ago, with an initial mass of about 20
                    - generic [ref=f402e47]:
                      - text: M
                      - subscript [ref=f402e48]: Sun
                    - text: . For 90% of its life, it was a main sequence star, converting hydrogen into helium. At this time, its luminosity was about 60,000 times that of the Sun, or 60,000
                    - generic [ref=f402e49]:
                      - text: L
                      - subscript [ref=f402e50]: Sun
                    - text: ", and its spectral type was O. When the hydrogen in the center of the star was exhausted, the core contracted and ultimately became hot enough to fuse helium. By this time, the star was a red supergiant, emitting about 100,000 times more energy than the Sun. While in this stage, the star lost some of its mass."
                  - paragraph [ref=f402e51]: "This lost material has actually been detected by observations with the Hubble Space Telescope. Figure \\(\\PageIndex{5}\\) includes two images of a ring of gas expelled by Sanduleak about 30,000 years before it exploded and was observed as Supernova 1987A. The supernova, which has been artificially dimmed, is located at the center of the ring. The left-hand image was taken in 1997 and the right-hand image in 2003. The number of bright spots on the ring has increased from 1 to more than 15 over this time interval. These spots occur where high-speed gas ejected by the supernova and moving at millions of miles per hour has reached the ring and blasted into it. The collision has heated the gas in the ring and caused it to glow more brightly. By studying these bright spots, astronomers can determine the composition of the ring and learn about the nuclear processes that build heavy elements inside massive stars."
                  - figure [ref=f402e52]:
                    - img "Ring around SN 1987A. Details in caption." [ref=f402e53]
                    - generic [ref=f402e54]:
                      - text: "Figure \\(\\PageIndex{5}\\) : Ring around SN 1987A. Before the star's supernova it released material during its red giant phase, forming a ring. The supernova released more material that has impacted the ring and observations show the number of impacts have increased with time. Since then, new material ejected from the ("
                      - link "CC BY" [ref=f402e55]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f402e56]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f402e57]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{5}\\)" [ref=f402e58]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.3.5_Ring_Around_SN_1987A
                      - text: .
                  - paragraph [ref=f402e59]:
                    - text: Helium fusion lasted only about 1 million years. When the helium was exhausted at the center of the star, the core contracted again, the radius of the surface also decreased, and the star became a blue supergiant with a luminosity still about equal to 100,000
                    - generic [ref=f402e60]:
                      - text: L
                      - subscript [ref=f402e61]: Sun
                    - text: . This is what it still looked like on the outside when, after brief periods of further fusion, it reached the end of iron fusion and exploded.
                  - paragraph [ref=f402e62]: "Some key stages of evolution of the star that became SN 1987A, including the ones following helium exhaustion, are listed in \\(\\PageIndex{1}\\). Each stage of evolution happens more quickly than the preceding one, the temperature and pressure in the core increase, and progressively heavier elements are the source of fusion energy. Once iron was created, the collapsed within a few tenths of a second. The speed of infall in the outer portion of the iron core reached 70,000 kilometers per second, about one-fourth the speed of light."
