            - application "Rich Text Editor, editarea" [ref=f151e311]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f151e345]: "<h2>Radio Astronomy</h2> <p class=\"lt-phys-64108\">Some objects in the universe give off light in the form of radio waves.&nbsp;In the early 1930s, Karl G. Jansky&nbsp;was experimenting with antennas for long-range radio communication when he encountered some mysterious static,&nbsp;Figure \\(\\PageIndex{1}\\). He discovered that this radiation came in strongest about four minutes earlier on each successive day. He correctly concluded that since Earth’s rotation relative to the stars is four minutes shorter than a solar day, the radiation source must originate from outside our solar system, tracking with the stars rather than the Sun.&nbsp;He concluded that the radio waves&nbsp;must be originating from a specific location in space. Subsequent investigation showed that the source of this radiation was part of the Milky Way Galaxy. Jansky had discovered the first source of cosmic radio waves.</p> <figure><img alt=\"Karl Jansky and radio antenna. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46007/663864e1ee25af84ec8ad874f7143e20019fa795\" /> <figcaption>Figure \\(\\PageIndex{1}\\): First Radio Telescope. This rotating radio antenna was used by Jansky in his discovery of radio radiation from the Milky Way. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.4.1_First_Radio_Telescope\" title=\"5.8: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64687\">In 1936, Grote Reber, who was an amateur astronomer interested in radio communications, used galvanized iron and wood to build the first antenna specifically designed to receive cosmic radio waves. Over the years, Reber built several such antennas and used them to carry out pioneering surveys of the sky for celestial radio sources. He remained active in radio astronomy for more than 30 years. During the first decade, he worked practically alone because professional astronomers had not yet recognized the vast potential of radio astronomy.</p> <h2 class=\"lt-phys-64687\">Radio Receivers</h2> <p class=\"lt-phys-64687\">Like visible light, radio waves are a form of electromagnetic radiation, but&nbsp;we cannot detect radio waves with our senses. Instead,&nbsp;we must rely on electronic equipment to receive the radio waves. In commercial radio broadcasting, we encode sound information into radio waves. These must be decoded at the other end and then turned back into sound by speakers or headphones.&nbsp;If cosmic radio signals were translated into sound, they would sound like static. Nevertheless, there is information in the radio waves&nbsp; that can tell us about the chemistry and physical conditions of the sources of the waves.</p> <p class=\"lt-phys-64687\">Just as vibrating charged particles can produce electromagnetic waves, electromagnetic waves can make charged particles move back and forth. Radio waves can produce a current in conductors of electricity such as metals. An antenna is such a conductor: it intercepts radio waves, which create a feeble current in it. The current is then amplified in a radio receiver until it is strong enough to measure or record. Like your television or radio, receivers can be tuned to select a single frequency. In astronomy, however, it is more common to use sophisticated data-processing techniques that allow thousands of separate frequency bands to be detected simultaneously. Thus, the astronomical radio receiver operates much like a spectrometer on a visible-light or infrared telescope, providing information about how much radiation we receive at each wavelength or frequency. After computer processing, the radio signals are recorded&nbsp;for future analysis.</p> <p class=\"lt-phys-64687\">Radio waves are reflected by conducting surfaces, just as light is reflected from a shiny metallic surface. A radio-reflecting telescope consists of a concave metal reflector, or dish, similar to a telescope mirror. The radio waves collected by the dish are reflected to a focus, where they can then be directed to a receiver and analyzed. Radio astronomers construct a pictorial representation of the radio sources they observe.&nbsp; In a radio image of a distant galaxy, the radio telescopes reveal vast jets and complicated regions of radio emissions that are completely invisible in photographs taken with visible light, Figure \\(\\PageIndex{2}\\).</p> <figure><img alt=\"Radio image of Galaxy Cygnus A. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46009/bbc286625c5f3f4424aeb0a840e7ba170d961b82\" /> <figcaption>Figure \\(\\PageIndex{2}\\): This image has been constructed of radio observations at the Very Large Array of a galaxy called Cygnus A. The galaxy would be a small dot in the center of the image.&nbsp;(<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.4.2__Radio_Image_of_Cygnus_A\" title=\"5.8: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64687\">Radio astronomy is a young field compared with visible-light astronomy, but it has experienced tremendous growth in recent decades, represented in this <a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.02:_Tables#Radio+Telescopes\" target=\"_blank\" title=\"18.5: Tables\">list of radio observatories</a>.&nbsp; The world’s largest radio reflectors that can be pointed to any direction in the sky have apertures of 100 meters. One of these has been built at the National Radio Astronomy Observatory in West Virginia.</p> <h2 class=\"lt-phys-64687\">Radio Interferometry</h2> <p class=\"lt-phys-64687\">A telescope’s resolution depends upon its aperture, but it also depends upon the wavelength of the light that the telescope is gathering. The longer the waves, the harder it is to resolve fine detail in images. Because radio waves have such long wavelengths, they present challenges for astronomers who need good resolution. In fact, even the largest radio dishes on Earth, cannot make out as much detail as the typical small telescope used in a college astronomy lab. To overcome this difficulty, radio astronomers have learned to sharpen their images by linking two or more radio telescopes together electronically. Two or more telescopes linked together in this way are called an <a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#interferometer\" target=\"_blank\" title=\"5.7: Key Terms\"><strong>interferometer</strong></a>.</p> <p class=\"lt-phys-64687\"><a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#interference\" target=\"_blank\" title=\"5.7: Key Terms\"><strong>Interference</strong></a> is the way that multiple waves interact with each other when they arrive in an instrument. This interaction allows astronomers to find more detail in the observations. The resolution of an interferometer depends upon the separation of the telescopes, not upon their individual apertures. Two telescopes separated by 1 kilometer provide the same resolution as would a single dish 1 kilometer across.</p> <p class=\"lt-phys-64687\">To get even better resolution, astronomers combine a large number of radio dishes into an <a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#interferometer+array\" target=\"_blank\" title=\"5.7: Key Terms\"><strong>interferometer array</strong></a>. Computer processing of the results permits the reconstruction of a high-resolution radio image. The largest interferometer in the United States is the National Radio Astronomy Observatory’s Jansky Very Large Array (VLA) near Socorro, New Mexico. It consists of 27 movable radio telescopes, each having an aperture of 25 meters, spread over a total span of about 36 kilometers, achieving&nbsp;a resolution of about 1 arcsecond.</p> <p class=\"lt-phys-64687\">The Atacama Large Millimeter/submillimeter array (ALMA) in the Atacama Desert of Northern Chile, Figure&nbsp;\\(\\PageIndex{3}\\), at an altitude of 16,400 feet, consists of 12 7-meter and 54 12-meter telescopes, and can achieve baselines up to 16 kilometers. Since it became operational in 2013, it has made observations at resolutions down to 6 milliarcseconds (0.006 arcseconds), a remarkable achievement for radio astronomy.</p> <figure><img alt=\"Atacama Large Millimeter/Submillimeter Array (ALMA). Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46011/308ebdb2ba0e82d692308e5b5ac5244fe70dbd3f\" /> <figcaption>Figure&nbsp;\\(\\PageIndex{3}\\): Located in the Atacama Desert of Northern Chile, ALMA is made up of multiple radio&nbsp;dishes spread over a large area and currently provides the highest resolution for radio observations. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.4.3__Atacama_Large_Millimeter.2FSubmillimeter_Array_(ALMA)\" title=\"5.8: Accessible Descriptions\">Alternative description of Figure&nbsp;\\(\\PageIndex{3}\\)</a>.</figcaption> </figure> <p>Initially, the size of interferometer arrays was limited by the requirement that all of the dishes be physically wired together. Astronomers, with the use of current technology and computing power, have learned to time the arrival of electromagnetic waves coming from space very precisely at each telescope and combine the data later.&nbsp;The United States operates the Very Long Baseline Array (VLBA), made up of 10 individual telescopes stretching from the Virgin Islands to Hawaii, Figure \\(\\PageIndex{3}\\). The VLBA, completed in 1993, can form astronomical images with a resolution of 0.0001 arcseconds, permitting features as small as 10 astronomical units to be distinguished at the center of our Galaxy.</p> <figure><img alt=\"VLBA dishes on Earth. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46010/ddfe3142ef49a098fb87c3af2b8e089198d2568e\" /> <figcaption>Figure \\(\\PageIndex{4}\\): Very Long Baseline Array. This map shows the distribution of 10 antennas that constitute an array of radio telescopes. There are 8 dishes in the continental United States along with one in Hawaii and one in Puerto Rico. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).</figcaption> </figure> <p class=\"lt-phys-64687\">Recent advances in technology have also made it possible to do interferometry at visible and infrared wavelengths, represented in this <a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.02:_Tables#Visible+Interferometers\" target=\"_blank\" title=\"18.5: Tables\">list of visible interferometers</a>. At the beginning of the twenty-first century, three observatories with multiple telescopes each began using their dishes as interferometers, combining their light to obtain a much greater resolution. In addition, a dedicated interferometric array was built on Mt. Wilson in California. Just as in radio arrays, these observations allow astronomers to make out more detail than a single telescope could provide.</p> <h2 class=\"lt-phys-64687\">Radar Astronomy</h2> <p class=\"lt-phys-64687\"><a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#radar\" target=\"_blank\" title=\"5.7: Key Terms\">Radar</a> is the technique of transmitting radio waves to an object in our Solar System and then detecting the light that the object reflects back. The time required for the round trip can be measured electronically with great precision. Because we know that radio waves travel at the speed of light, we can determine the distance to the object or a particular feature on its surface.&nbsp;Radar observations have been used to determine the distances to planets and how fast things are moving in the Solar System. Radar waves have played important roles in navigating spacecraft throughout the solar system. In addition, radar observations have determined the rotation periods of Venus and Mercury, probed tiny Earth-approaching asteroids, and allowed us to investigate the mountains and valleys on the surfaces of Mercury, Venus, Mars, and the large moons of Jupiter.</p> <p class=\"lt-phys-64687\">Any radio dish can be used as a radar telescope if it is equipped with a powerful transmitter as well as a receiver. For many years, the most spectacular facility in the world for radar astronomy was the 1000-foot (305-meter) telescope at Arecibo in Puerto Rico,&nbsp;Figure \\(\\PageIndex{5}\\). The Arecibo telescope was too large to be pointed directly at different parts of the sky. Instead, it was constructed in a huge natural bowl formed by several hills, and it was lined with reflecting metal panels. A limited ability to track astronomical sources was achieved by moving the receiver system, which was suspended on cables 100 meters above the surface of the bowl. Unfortunately, the telescope was seriously damaged in the powerful storms of 2020 and had to be decommissioned. An even larger (500-meter) radar telescope has recently gone into operation in China and is called the&nbsp;Five-hundred-meter Aperture Spherical Telescope (FAST).</p> <figure><img alt=\"Arecibo Radar Observatory and Dish. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46016/c8f2441e059a0c82da95263d5db11629d7fb82d2\" /> <figcaption>Figure \\(\\PageIndex{5}\\): The Arecibo Observatory in Puerto Rico was the largest and most powerful astronomical radar facility&nbsp;in the world and was often featured in films. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).</figcaption> </figure> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: Interactive Activity</span></h5> <ul> <li>Explore the <a href=\"https://public.nrao.edu/\" title=\"https://public.nrao.edu/\">National Radio Astronomy</a> Observatory website to learn how radio telescopes detect radio waves from space and support astronomical research across the electromagnetic spectrum.</li> <li>Learn about the history and scientific discoveries of the <a href=\"/Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions\" title=\"5.8: Accessible Descriptions\">Arecibo Observatory</a>, once the world's largest single-dish radio telescope and a leading center for radar astronomy.</li> <li>Explore the <a href=\"https://public.nrao.edu/telescopes/vlba/\" title=\"https://public.nrao.edu/telescopes/vlba/\">Very Long Baseline Array</a> to discover how widely separated radio telescopes work together as an interferometer to produce extremely high-resolution images.</li> <li>Watch <em>ALMA: <a href=\"https://www.almaobservatory.org/en/videos/alma-in-search-of-our-cosmic-origins/\" title=\"https://www.almaobservatory.org/en/videos/alma-in-search-of-our-cosmic-origins/\">In Search of Our Cosmic Origins</a></em> to learn how ALMA studies cold gas and dust to investigate the formation of stars, planets, and galaxies.</li> <li>Explore the <a href=\"https://english.nao.cas.cn/research/researchdivisions/radioastronomy/202103/t20210323_266393.html\" title=\"https://english.nao.cas.cn/research/researchdivisions/radioastronomy/202103/t20210323_266393.html\">Five-hundred-meter Aperture Spherical Telescope (FAST)</a> to learn how the world's largest filled-aperture radio telescope is used to study pulsars, galaxies, and the radio universe.</li> </ul> </section>"
