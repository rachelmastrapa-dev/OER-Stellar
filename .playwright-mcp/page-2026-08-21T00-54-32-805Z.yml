                  - figure "Andromeda Galaxy in Visible LightPublic Domain | Image courtesy of NASA / Hubble Space Telescope." [ref=f80e135]:
                    - img "Image of Andromeda Galaxy in Visible Light. The wisps of blue making up the galaxy's spiral arms are neighborhoods that harbor hot, young, massive stars. Meanwhile, the central orange-white ball reveals a congregation of cooler, old stars that formed long ago." [ref=f80e136]
                  - figure "Andromeda Galaxy in IRPublic Domain | Image courtesy of NASA / Spitzer Space Telescope." [ref=f80e138]:
                    - img "Infrared image from NASA's Spitzer Space Telescope shows the Andromeda galaxy, a neighbor to our Milky Way galaxy." [ref=f80e139]
