                - generic [active] [ref=f80e1]:
                  - paragraph [ref=f80e2]: Objects in the universe send out an enormous range of electromagnetic radiation. Scientists call this range the electromagnetic spectrum, which they have divided into a number of categories. The spectrum is shown in Figure 5.6, with some information about the waves in each part or band.
                  - 'figure "Figure 5.6 : Radiation and Earth’s Atmosphere. This figure shows the bands of the electromagnetic spectrum and how well Earth’s atmosphere transmits them. Note that high-frequency waves from space do not make it to the surface and must therefore be observed from space. Some infrared and microwaves are absorbed by water and thus are best observed from high altitudes. Low-frequency radio waves are blocked by Earth’s ionosphere. (credit: modification of work by STScI/JHU/NASA)" [ref=f80e3]':
                    - 'img "This figure depicts radiation and the Earth’s atmosphere. Vertically from bottom to top, the Troposphere (weather), Stratosphere (ozone layer at 20 – 30 km; jets fly at 10 km), Mesosphere (meteors burn up), and Thermosphere (auroras)” are labeled. At the top of the figure, from shorter waves to longer waves, the different kinds of waves are labeled: “Gamma”, “X-ray”, “Ultraviolet (UV)”, “Visible”, “Infrared (IR)”, “Microwave”, and “Radio”. Under visible light is an observatory, labeled “Optical window”. Under radio is a radio telescope, labeled “Radio window”." [ref=f80e5]'
                  - heading "Types of Electromagnetic Radiation" [level=3] [ref=f80e7]
                  - paragraph [ref=f80e8]:
                    - text: Electromagnetic radiation with the shortest wavelengths, no longer than 0.01 nanometer, is categorized as gamma rays (1 nanometer = 10
                    - superscript [ref=f80e9]: –9
                    - text: meters; see Appendix D). The name
                    - emphasis [ref=f80e10]: gamma
                    - text: "comes from the third letter of the Greek alphabet: gamma rays were the third kind of radiation discovered coming from radioactive atoms when physicists first investigated their behavior. Because gamma rays carry a lot of energy, they can be dangerous for living tissues. Gamma radiation is generated deep in the interior of stars, as well as by some of the most violent phenomena in the universe, such as the deaths of stars and the merging of stellar corpses. Gamma rays coming to Earth are absorbed by our atmosphere before they reach the ground (which is a good thing for our health); thus, they can only be studied using instruments in space."
                  - figure [ref=f80e11]:
                    - img "Three images of the constellation of Orion in different wavelengths of light. On the left (a) is a visible light image, with straight lines connecting the bright stars to form the outline of the constellation, which is that of a man. Below the three stars that form Orion’s belt in the center of the image is the famous Orion nebula. Image (b) shows the same area in X-rays. As only a few of the stars seen in visible light are seen in X-rays, the outline of the constellation has been omitted. Numerous very bright stars and other distant sources are prominent. Lastly, on the right (c), is an infrared image. Some of the stars are visible, so the outline is again presented. The image is nearly covered with delicate wisps of nebulosity which get quite bright and dense in the vicinity of the Orion nebula." [ref=f80e13]
                  - paragraph [ref=f80e15]: Electromagnetic radiation with wavelengths between 0.01 nanometer and 20 nanometers is referred to as X-rays. Being more energetic than visible light, X-rays are able to penetrate soft tissues but not bones, and so allow us to make images of the shadows of the bones inside us. While X-rays can penetrate a short length of human flesh, they are stopped by the large numbers of atoms in Earth’s atmosphere with which they interact. Thus, X-ray astronomy (like gamma-ray astronomy) could not develop until we invented ways of sending instruments above our atmosphere (Figure 5.7).
                  - 'figure "Figure 5.7 : X-Ray Sky. This is a map of the sky tuned to certain types of X-rays (seen from above Earth’s atmosphere). The map tilts the sky so that the disk of our Milky Way Galaxy runs across its center. It was constructed and artificially colored from data gathered by the European ROSAT satellite. Each color (red, yellow, and blue) shows X-rays of different frequencies or energies. For example, red outlines the glow from a hot local bubble of gas all around us, blown by one or more exploding stars in our cosmic vicinity. Yellow and blue show more distant sources of X-rays, such as remnants of other exploded stars or the active center of our Galaxy (in the middle of the picture). (credit: modification of work by NASA)" [ref=f80e16]':
                    - img "A false color image of the entire sky seen in x-rays, with different colors representing different x-ray energies. The image shows the disk of the Milky Way galaxy in blue running horizontally through the center of the image, with a few point sources scattered along its length. A diffuse, cloudy shape of blue and yellow emanates from the center of the galaxy and extends above and below the disk. This represents distant x-ray sources near the center of the Milky Way. And finally, a red diffuse glow covers most of the image and depicts the hot gas in our local vicinity of the galaxy." [ref=f80e18]
                  - paragraph [ref=f80e20]: Radiation intermediate between X-rays and visible light is ultraviolet (meaning higher energy than violet). Outside the world of science, ultraviolet light is sometimes called “black light” because our eyes cannot see it. Ultraviolet radiation is mostly blocked by the ozone layer of Earth’s atmosphere, but a small fraction of ultraviolet rays from our Sun do penetrate to cause sunburn or, in extreme cases of overexposure, skin cancer in human beings. Ultraviolet astronomy is also best done from space.
                  - paragraph [ref=f80e21]: "Electromagnetic radiation with wavelengths between roughly 400 and 700 nm is called visible light because these are the waves that human vision can perceive. This is also the band of the electromagnetic spectrum that most readily reaches Earth’s surface. These two observations are not coincidental: human eyes evolved to see the kinds of waves that arrive from the Sun most effectively. Visible light penetrates Earth’s atmosphere effectively, except when it is temporarily blocked by clouds."
                  - paragraph [ref=f80e22]: Between visible light and radio waves are the wavelengths of infrared or heat radiation. Astronomer William Herschel first discovered infrared in 1800 while trying to measure the temperatures of different colors of sunlight spread out into a spectrum. He noticed that when he accidently positioned his thermometer beyond the reddest color, it still registered heating due to some invisible energy coming from the Sun. This was the first hint about the existence of the other (invisible) bands of the electromagnetic spectrum, although it would take many decades for our full understanding to develop.
                  - paragraph [ref=f80e23]: A heat lamp radiates mostly infrared radiation, and the nerve endings in our skin are sensitive to this band of the electromagnetic spectrum. Infrared waves are absorbed by water and carbon dioxide molecules, which are more concentrated low in Earth’s atmosphere. For this reason, infrared astronomy is best done from high mountaintops, high-flying airplanes, and spacecraft.
                  - paragraph [ref=f80e24]: After infrared comes the familiar microwave, used in short-wave communication and microwave ovens. (Wavelengths vary from 1 millimeter to 1 meter and are absorbed by water vapor, which makes them effective in heating foods.) The “micro-” prefix refers to the fact that microwaves are small in comparison to radio waves, the next on the spectrum. You may remember that tea—which is full of water—heats up quickly in your microwave oven, while a ceramic cup—from which water has been removed by baking—stays cool in comparison.
                  - paragraph [ref=f80e25]: All electromagnetic waves longer than microwaves are called radio waves, but this is so broad a category that we generally divide it into several subsections. Among the most familiar of these are radar waves, which are used in radar guns by traffic officers to determine vehicle speeds, and AM radio waves, which were the first to be developed for broadcasting. The wavelengths of these different categories range from over a meter to hundreds of meters, and other radio radiation can have wavelengths as long as several kilometers.
                  - paragraph [ref=f80e26]: With such a wide range of wavelengths, not all radio waves interact with Earth’s atmosphere in the same way. FM and TV waves are not absorbed and can travel easily through our atmosphere. AM radio waves are absorbed or reflected by a layer in Earth’s atmosphere called the ionosphere (the ionosphere is a layer of charged particles at the top of our atmosphere, produced by interactions with sunlight and charged particles that are ejected from the Sun).
                  - paragraph [ref=f80e27]: "We hope this brief survey has left you with one strong impression: although visible light is what most people associate with astronomy, the light that our eyes can see is only a tiny fraction of the broad range of waves generated in the universe. Today, we understand that judging some astronomical phenomenon by using only the light we can see is like hiding under the table at a big dinner party and judging all the guests by nothing but their shoes. There’s a lot more to each person than meets our eye under the table. It is very important for those who study astronomy today to avoid being “visible light chauvinists”—to respect only the information seen by their eyes while ignoring the information gathered by instruments sensitive to other bands of the electromagnetic spectrum."
                  - paragraph [ref=f80e28]: Table 5.1 summarizes the bands of the electromagnetic spectrum and indicates the temperatures and typical astronomical objects that emit each kind of electromagnetic radiation. While at first, some of the types of radiation listed in the table may seem unfamiliar, you will get to know them better as your astronomy course continues. You can return to this table as you learn more about the types of objects astronomers study.
