                  - heading "Radiation and Temperature" [level=3] [ref=f80e86]
                  - paragraph [ref=f80e87]:
                    - text: Some astronomical objects emit mostly infrared radiation, others mostly visible light, and still others mostly ultraviolet radiation. What determines the type of electromagnetic radiation emitted by the Sun, stars, and other dense astronomical objects? The answer often turns out to be their
                    - emphasis [ref=f80e88]: temperature
                    - text: .
                  - paragraph [ref=f80e89]: "At the microscopic level, everything in nature is in motion. A solid is composed of molecules and atoms in continuous vibration: they move back and forth in place, but their motion is much too small for our eyes to make out. A gas consists of atoms and/or molecules that are flying about freely at high speed, continually bumping into one another and bombarding the surrounding matter. The hotter the solid or gas, the more rapid the motion of its molecules or atoms. The temperature of something is thus a measure of the average motion energy of the particles that make it up."
                  - paragraph [ref=f80e90]: This motion at the microscopic level is responsible for much of the electromagnetic radiation on Earth and in the universe. As atoms and molecules move about and collide, or vibrate in place, their electrons give off electromagnetic radiation. The characteristics of this radiation are determined by the temperature of those atoms and molecules. In a hot material, for example, the individual particles vibrate in place or move rapidly from collisions, so the emitted waves are, on average, more energetic. And recall that higher energy waves have a higher frequency. In very cool material, the particles have low-energy atomic and molecular motions and thus generate lower-energy waves.
                  - paragraph [ref=f80e91]: The rainbow – with all of its myths and legends – is an indicator of the data astronomers examine.
                  - figure "Public Domain | Image courtesy of U. S. National Oceanic and Atmospheric Administration." [ref=f80e92]:
                    - img "Image of a Rainbow over Niagara Falls." [ref=f80e93]
                  - heading "Light" [level=2] [ref=f80e95]
                  - paragraph [ref=f80e96]:
                    - strong [ref=f80e97]: Light
                    - text: is
                    - strong [ref=f80e98]: Radiative energy
                    - text: ", which can be split into a"
                    - strong [ref=f80e99]: spectrum
                    - text: . A spectrum is the light’s component colors or wavelengths. Light can be split into its component colors or wavelengths by using a prism or diffraction grating.
                  - paragraph [ref=f80e100]:
                    - text: Light comes in particle bundles, called photons. These photons travel at
                    - strong [ref=f80e101]: 186,000 mi/s
                    - text: or
                    - strong [ref=f80e102]: 300,000 km/s (3 X 108 m/s)
                    - text: . The Speed of Light, c, is an absolute; you cannot go faster than c. (the speed of light).
                  - paragraph [ref=f80e103]:
                    - text: Light also moves in
                    - strong [ref=f80e104]: waves
                    - text: . Particles moving in waves are referred to as an
                    - strong [ref=f80e105]: Electromagnetic wave
                    - text: ; a wave in which both electric and magnetic waves “interact” or vibrate. The
                    - strong [ref=f80e106]: Wavelength
                    - text: is the distance between adjacent peaks on the wave, and the wave’s
                    - strong [ref=f80e107]: Frequency
                    - text: is the number of peaks that pass a specific point in a second.
                  - paragraph [ref=f80e108]
                  - figure "Image courtesy of Florida State College at Jacksonville." [ref=f80e109]:
                    - img "Image of wavelength over time. Explanation is on the page text." [ref=f80e110]
                  - heading "History of Light" [level=2] [ref=f80e112]
                  - paragraph [ref=f80e113]: For most of history, visible light was the single most recognized portion of the electromagnetic spectrum, EMS. The ancient Greeks noted that light traveled in straight lines and studied its properties. Over the years the study of light continued. During the 16th and 17th centuries there were conflicting theories which regarded light as either a wave or a particle. In 1800, astronomer Frederick William Herschel discovered infrared radiation while using a thermometer to measure temperatures of visible light frequencies. A year later Johann Ritter discovered ultraviolet radiation.
                  - paragraph [ref=f80e114]: Objects in the universe send out an enormous range of electromagnetic radiation. Scientists call this range the electromagnetic spectrum, which they have divided into a number of categories. The spectrum is shown in Figure 5.6, with some information about the waves in each part or band.
                  - paragraph [ref=f80e115]:
                    - text: The
                    - strong [ref=f80e116]: Electromagnetic Spectrum
                    - text: ", or"
                    - strong [ref=f80e117]: EMS
                    - text: ", is the range of frequencies of electromagnetic radiation. Electromagnetic Radiation is a fundamental phenomenon of electromagnetism, acting as waves and as particles – photons, which move through space carrying radiant energy."
                  - figure "Public Domain | Image courtesy of NASA." [ref=f80e118]:
                    - 'img "Image of the electromagnetic spectrum. The entire range of energies of light, including both light we can see and light we cannot see, is called the electromagnetic spectrum. It includes, from highest energy to lowest: gamma-rays, X-rays, ultraviolet, optical, infrared, microwaves, and radio waves. Because we can only see visible light, we are put at a disadvantage when we study the Universe because, because it is actively emitting light at all these different energies." [ref=f80e119]'
                  - paragraph [ref=f80e121]:
                    - text: We see the
                    - strong [ref=f80e122]: Visible light
                    - text: portion of the EMS, wavelengths of 400 nm to 700 nm. The
                    - strong [ref=f80e123]: wavelengths
                    - text: longer than visible light include Radio, Microwave, and Infrared (IR) waves.
                    - strong [ref=f80e124]: Visible Light
                    - text: ; sometimes called
                    - strong [ref=f80e125]: ROYGBIV
                    - text: ", includes Red, Orange, Yellow, Green, Blue, Indigo, and Violet. Visible light is a very small part of the EMS."
                    - strong [ref=f80e126]: Shorter Wavelengths
                    - text: than visible light include Ultraviolet (UV), X-rays, and Gamma Rays. Only radio, some IR, and visible light gets through Earth’s atmosphere.
                  - paragraph [ref=f80e127]:
