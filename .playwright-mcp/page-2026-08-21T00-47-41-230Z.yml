            - application "Rich Text Editor, editarea" [ref=f54e311]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f54e325]: "<p>This first section of the chapter is devoted to exploring and understanding how ancient astronomers used the sky for navigation and&nbsp;everyday life.&nbsp;</p> <p>Many learners of Astronomy think of the first astronomers as the Greeks or Babylonians. This section is devoted to shifting that narrative to consider the long, long history of humanity and astronomy practices that expand far beyond these widely shared historical perspectives. The paragraphs that follow are by no means a complete account of the astronomy knowledge that has been developed around the world. Instead, the examples below are meant to explore a more global perspective on historical astronomy knowledge, and how this knowledge has been preserved to today.&nbsp;</p> <p>References: <a href=\"https://www.teachastronomy.com/textbook/Early-Astronomy/Arab-Astronomy/\" title=\"https://www.teachastronomy.com/textbook/Early-Astronomy/Arab-Astronomy/\">Teach Astronomy Chapter 2</a> (paraphrase only from this source), Includes info on ancient Arab, Indian, Chinese Astronomy Knowledge</p> <p><a href=\"https://www.iau.org/IAU/Iau/Science/What-we-do/The-Constellations.aspx\" title=\"https://www.iau.org/IAU/Iau/Science/What-we-do/The-Constellations.aspx\">IAU,&nbsp;The Constellations</a>&nbsp;(IAU is generally under CC-BY 4.0)</p> <figure><img alt=\"Observatory domes on a mountain ridge above a blanket of clouds under a clear sky.\" class=\"internal default\" src=\"/@api/deki/files/66356/Subaru%252C_Keck_and_NASA_Telescopes._Mauna_Kea_Summit_(503910)_(21665383948).jpg\" /> <figcaption>Figure \\(\\PageIndex{1}\\): From left to right the, <a href=\"https://subarutelescope.org/en/\" title=\"https://subarutelescope.org/en/\">Subaru Telescope</a>, the two&nbsp;<a href=\"https://keckobservatory.org/\" title=\"https://keckobservatory.org/\">Keck</a> telescopes, NASA's <a href=\"https://irtfweb.ifa.hawaii.edu/\" title=\"https://irtfweb.ifa.hawaii.edu/\">Infrared Telescope </a><a href=\"https://irtfweb.ifa.hawaii.edu/\" title=\"https://irtfweb.ifa.hawaii.edu/\">Facility</a>&nbsp;were all built on the summit of Maunakea. The two Keck telescopes&nbsp;had planned extensions that were highly opposed by Native Hawaiians. (<a href=\"https://creativecommons.org/licenses/by/2.0/\" target=\"_blank\" title=\"CC BY 2.0\">CC BY 2.0</a>; <a href=\"https://www.flickr.com/people/92487715@N03\" target=\"_blank\" title=\"Robert Linsdell\">Robert Linsdell</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Subaru,_Keck_and_NASA_Telescopes._Mauna_Kea_Summit_(503910)_(21665383948).jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>).</figcaption> </figure> <p>Possible Content:</p> <p>Mayan and Inca Peoples</p> <p>Calendars using Earth, Moon and Sun system&nbsp;</p> <p class=\"mt-indent-1\">Mayand and Inca Peoples</p> <p class=\"mt-indent-1\"><a href=\"https://astrobites.org/2024/04/19/how-ancient-chinese-solar-eclipse-records-helped-to-determine-the-earths-rotation-rate/\" title=\"https://astrobites.org/2024/04/19/how-ancient-chinese-solar-eclipse-records-helped-to-determine-the-earths-rotation-rate/\">Chinese Solar Eclipse Records</a>&nbsp;(Astrobites article)</p> <p>Mapping the Galaxy</p> <p class=\"mt-indent-1\"><a href=\"https://www.mdpi.com/2073-445X/12/4/805\" title=\"https://www.mdpi.com/2073-445X/12/4/805\">First Archaeoastronomical Analyses of Orientations at Mounds in Uruguay</a></p> <p class=\"mt-indent-1\"><a href=\"https://rsaa.anu.edu.au/public/aboriginal-history\" title=\"https://rsaa.anu.edu.au/public/aboriginal-history\">Emu in the Sky</a> from Australian Aboriginal Peoples</p> <p>Stellar Oservations</p> <p class=\"mt-indent-1\">Supernova Spotting from Chinese Astronomers&nbsp;</p> <p>Astrobites article:&nbsp;<a href=\"https://astrobites.org/2025/04/22/light-pollution-and-indigenous-cultures/\" rel=\"freelink\" title=\"https://astrobites.org/2025/04/22/light-pollution-and-indigenous-cultures/\">https://astrobites.org/2025/04/22/li...nous-cultures/</a>&nbsp; &nbsp;</p> <p>&nbsp;</p> <p>&nbsp;</p>"
