              - listitem [ref=e105]: Explain how Copernicus developed the heliocentric model of the solar system
              - listitem [ref=e106]: Explain the Copernican model of planetary motion and describe evidence or arguments in favor of it
              - listitem [ref=e107]: Describe Galileo’s discoveries concerning the study of motion and forces
              - listitem [ref=e108]: Explain how Galileo’s discoveries tilted the balance of evidence in favor of the Copernican model
