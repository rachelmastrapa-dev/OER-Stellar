            - application "Rich Text Editor, editarea" [ref=f493e321]:
              - iframe [active] [ref=f493e322]:
                - generic [active] [ref=f495e1]:
                  - heading "Types of Galaxies" [level=2] [ref=f495e2]
                  - paragraph [ref=f495e3]: Having established the existence of other galaxies, astronomers began to observe them more closely, noting their shapes, their contents, and as many other properties as they could measure. This was a daunting task in the 1920s when obtaining a single photograph or spectrum of a galaxy could take a full night of tireless observing. Today, larger telescopes and electronic detectors have made this task less difficult, although observing the most distant galaxies, those that show us the universe in its earliest phases, still requires enormous effort.
                  - heading "Classifying Galaxies" [level=3] [ref=f495e4]
                  - paragraph [ref=f495e5]:
                    - text: "The first step in trying to understand a new type of object is to describe it. As it turns out, the biggest and most luminous galaxies come in one of two basic shapes: either they are flatter and have spiral arms, known as"
                    - strong [ref=f495e6]:
                      - link "spiral galaxies" [ref=f495e7]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#spiral galaxy
                    - text: ", or they appear to be"
                    - strong [ref=f495e8]:
                      - link "elliptical galaxies" [ref=f495e9]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#elliptical galaxy
                    - text: ", similar to a squashed circle. Many smaller galaxies, in contrast, have an irregular shape, and are called"
                    - strong [ref=f495e10]:
                      - link "irregular galaxy" [ref=f495e11]:
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.07:_Key_Terms#irregular galaxy
                    - text: .
                  - paragraph [ref=f495e12]: "Figure \\(\\PageIndex{1}\\) is a diagram of Hubble's classification system for galaxies also known as the Hubble Galactic Tuning Fork. From left to right are the ellipticals, is the spherical E0, slightly oval E3, flatter oval E5 to the very elongated oval E7. At center is the more circular S0, connecting the ellipticals to the spiral galaxies. The top fork is the regular, or unbarred, spirals. From left to right beginning with the short armed Sa, longer armed Sb and the open, multiple armed Sc. The bottom fork is the barred spirals. From left to right id the short bar SBa, longer bar SBb and the open, long bar SBc. Modern astronomers use quantitative models of a galaxy's shape and brightness to classify galaxies."
                  - figure [ref=f495e13]:
                    - 'img "Classification of galaxies: elliptical, spiral, and barred spiral galaxies. Details in caption." [ref=f495e14]'
                    - generic [ref=f495e15]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Classification of Galaxies. The tuning fork diagram organizes galaxies by shape, branching from elliptical galaxies into two sequences of spiral and barred spiral galaxies with increasingly open arms. ("
                      - link "CC BY 4.0" [ref=f495e16]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f495e17]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f495e18]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{1}\\)" [ref=f495e19]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.2.1_Classification_of_Galaxies
                      - text: .
                  - heading "Spiral Galaxies" [level=3] [ref=f495e20]
                  - paragraph [ref=f495e21]: Spiral galaxies appear like flattened disks with a central bulge, usually with arms. Our own Galaxy and the Andromeda galaxy are typical, large spiral galaxies. Interstellar material is usually spread throughout the disks of spiral galaxies. Bright emission nebulae and hot, young stars are present, especially in the spiral arms, showing that new star formation is still occurring. The disks are often dusty, which is especially noticeable in those systems that we view almost edge-on.
                  - paragraph [ref=f495e22]: "Figure \\(\\PageIndex{2}\\) includes two images of spiral galaxies. Image (a) is a face-on view of spiral M100. The major features are labeled, including the bulge, spiral arms, disk, and halo. The spiral arms of M100 are bluer than the rest of the galaxy, indicating young, high-mass stars and star-forming regions. Image (b) is the spiral galaxy NGC4565 from an edge-on perspective. It appears as a thin sliver of light, with a dark dust lane through the entire length and a central bulge thicker and brighter than the rest of the disk. The dust appears dark because it absorbs the light from the stars in the galaxy. From the edge-on view, we looking through a larger amount of dust compared to the face-on view. For example, the nuclear bulge of NGC 4565 is behind the dust of all of the arms of the galaxy between us and the bulge. Meanwhile, from the face-on view of M100, there is a small amount of dust between us and the bright bulge."
                  - figure [ref=f495e23]:
                    - img "Face-on and edge-on views of spiral galaxies M100 and NGC 4565. Details in caption." [ref=f495e24]
                    - generic [ref=f495e25]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Spiral Galaxies. Image (a) is the face-on spiral galaxy M100, where bluer spiral arms indicate young, high-mass stars and active star formation. Image (b) is the edge-on spiral galaxy NGC 4565, where a dark dust lane traces the galactic plane by absorbing starlight. ("
                      - link "CC BY 4.0" [ref=f495e26]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f495e27]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f495e28]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{2}\\)" [ref=f495e29]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.2.2_Spiral_Galaxies
                      - text: .
                  - paragraph [ref=f495e30]: In galaxies that we see face on, the bright stars and emission nebulae make the arms of spirals stand out, again because of the lack of dust between us and the arms, making them easier to analyze. Open star clusters are detected in the arms of nearer spirals, and globular clusters are often found in their halos. Spiral galaxies contain a mixture of young and old stars, just as the Milky Way does. All spirals rotate, and the direction of their spin is such that the arms appear to trail behind them, meaning the ends of the arms are pointing opposite to direction of rotation.
                  - paragraph [ref=f495e31]: "About two-thirds of the nearby spiral galaxies have boxy or peanut-shaped bars of stars running through their centers and are called barred spirals. In the image of NGC 1300 in Figure \\(\\PageIndex{3}\\), the spiral arms originate at the ends of the bar, instead of from the nucleus as the arms do in an unbarred spiral like M100 in Figure \\(\\PageIndex{2}\\). The unbarred spiral is also more symmetrical than the barred spiral, which has an overall shape like the letter S. The fact that bars are so common suggests that they are long lived. It may be that most spiral galaxies form a bar at some point during their evolution."
                  - figure [ref=f495e32]:
                    - img "Barred spiral galaxy NGC 1300, with arms unwinding from a central bar. Details in caption." [ref=f495e33]
                    - generic [ref=f495e34]:
                      - text: "Figure \\(\\PageIndex{3}\\) : Barred Spiral Galaxy. NGC 1300 is a barred spiral galaxy, where a straight bar of stars and gas crosses the nucleus and the spiral arms unwind from its ends rather than from the center of the galaxy. ("
                      - link "CC BY 4.0" [ref=f495e35]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f495e36]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f495e37]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{3}\\)" [ref=f495e38]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.2.3_Barred_Spiral_Galaxy
                      - text: .
                  - paragraph [ref=f495e39]: "Let's review the classification types of spiral galaxies from Figure \\(\\PageIndex{1}\\). In the Sa type, the central bulge is large and luminous, the arms are faint and tightly coiled, and bright emission nebulae and supergiant stars are inconspicuous. Galaxies like this may have no clear spiral arm structure, resulting in a lens-like appearance and are sometimes referred to as lenticular galaxies. These galaxies seem to share as many properties with elliptical galaxies as they do with spiral galaxies. In the Sc type, the central bulge is small and the arms are loosely wound. In these galaxies, luminous stars and emission nebulae are very prominent. Our Galaxy and the Andromeda galaxy are both Sb types, intermediate between the two end members."
                  - paragraph [ref=f495e40]:
                    - text: The luminous parts of spiral galaxies appear to range in diameter from about 20,000 to more than 100,000 light-years. Recent studies have found that there is probably a large amount of galactic material that extends well beyond the apparent edge of galaxies. This material appears to be thin, cold gas that is difficult to detect in most observations. From the observational data available, the masses of the luminous portions of spiral galaxies are estimated to range from 1 billion to 1 trillion Suns (10
                    - superscript [ref=f495e41]: "9"
                    - text: to 10
                    - superscript [ref=f495e42]: "12"
                    - generic [ref=f495e43]:
                      - text: M
                      - subscript [ref=f495e44]: Sun
                    - text: ). The total luminosities of most spirals fall in the range of 100 million to 100 billion times the luminosity of our Sun (10
                    - superscript [ref=f495e45]: "8"
                    - text: to 10
                    - superscript [ref=f495e46]: "11"
                    - generic [ref=f495e47]:
                      - text: L
                      - subscript [ref=f495e48]: Sun
                    - text: ). Our Galaxy and M31 are relatively large and massive, as spirals go. There is also considerable dark matter in and around the galaxies, just as there is in the Milky Way. We deduce its presence from how fast stars in the outer parts of the galaxy are moving in their orbits.
                  - heading "Elliptical Galaxies" [level=3] [ref=f495e49]
                  - paragraph [ref=f495e50]: Elliptical galaxies are those galaxies classified according to their shape and size. The shapes go from E0 which is spherical, like a ball to a E5 type which is a squashed ball with points on the ends, similar to a lemon. Elliptical galaxies have very little dust and gas, and appear to be the oldest class of galaxies. Some estimates place elliptical populations at around 10% to 15% of all galaxies, significantly less common than spiral galaxies.
                  - paragraph [ref=f495e51]: Elliptical galaxies consist almost entirely of old stars and have shapes that are spheres or ellipsoids, or squashed spheres. They contain no trace of spiral arms. Their light is dominated by older, reddish population II stars. In the larger ellipticals, many globular clusters can be identified. Dust and emission nebulae are not conspicuous in elliptical galaxies, but many do contain a small amount of interstellar matter.
                  - paragraph [ref=f495e52]: "Figure \\(\\PageIndex{4}\\) includes two examples of elliptical galaxies. In Image (a), ESO 325-G004, a giant elliptical galaxy is a large and nearly featureless oval of light with a bright nucleus. There is little to know structure in this galaxy, except that it is brightest in its center. Meanwhile, the unnamed elliptical in Image(b) has more structure within the otherwise featureless oval, suggesting a relatively recent formation from the collision of two spiral galaxies."
                  - figure [ref=f495e53]:
                    - 'img "Two elliptical galaxies: ESO 325-G004 and a recently merged elliptical. Details in caption." [ref=f495e54]'
                    - generic [ref=f495e55]:
                      - text: "Figure \\(\\PageIndex{4}\\) : Elliptical Galaxies. Image (a) is the giant elliptical galaxy ESO 325-G004, a smooth, featureless system typical of old elliptical galaxies. Image (b) is an elliptical galaxy with more internal structure. ("
                      - link "CC BY 4.0" [ref=f495e56]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f495e57]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f495e58]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{4}\\)" [ref=f495e59]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.2.4_Elliptical_Galaxies
                      - text: .
                  - paragraph [ref=f495e60]:
                    - text: "Elliptical galaxies show various degrees of flattening, ranging from systems that are approximately spherical to those that approach the flatness of spirals. The rare giant ellipticals, such as ESO 325-G004 in Figure \\(\\PageIndex{4}\\) reach luminosities of 10"
                    - superscript [ref=f495e61]: "11"
                    - generic [ref=f495e62]:
                      - text: L
                      - subscript [ref=f495e63]: Sun
                    - text: . The mass in a giant elliptical can be as large as 10
                    - superscript [ref=f495e64]: "13"
                    - generic [ref=f495e65]:
                      - text: M
                      - subscript [ref=f495e66]: Sun
                    - text: . The diameters of these large galaxies extend over several hundred thousand light-years and are considerably larger than the largest spirals. Although individual stars orbit the center of an elliptical galaxy, the orbits are not all in the same direction, as occurs in spirals. Therefore, ellipticals don't appear to rotate in a systematic way, making it difficult to estimate how much dark matter they contain.
                  - paragraph [ref=f495e67]: We find that elliptical galaxies range all the way from the giants, just described, to dwarfs, which may be the most common kind of galaxy. Dwarf ellipticals escaped our notice for a long time because they are very faint and difficult to see. An example of a dwarf elliptical is the Leo I Dwarf Spheroidal galaxy. Like most ellipticals, it is a featureless and uniform oval of light. The luminosity of this typical dwarf is about equal to that of the brightest globular clusters.
                  - paragraph [ref=f495e68]: Intermediate between the giant and dwarf elliptical galaxies are systems such as M32 and M110, the two companions of the Andromeda galaxy. While they are often referred to as dwarf ellipticals, at 2400 light-years across, these galaxies are significantly larger than galaxies such as Leo I. Note that individual stars can be seen at the edges where the density of stars declines.
                  - figure [ref=f495e69]:
                    - img "Dwarf elliptical galaxy M32. Details in caption." [ref=f495e70]
                    - generic [ref=f495e71]:
                      - text: "Figure \\(\\PageIndex{5}\\) : Dwarf Elliptical Galaxy. M32 is a dwarf elliptical galaxy and companion to the much larger Andromeda galaxy, spanning only about 2,400 light-years across. ("
