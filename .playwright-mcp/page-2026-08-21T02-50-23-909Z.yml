                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{6}\\)" [ref=f495e85]':
                        - /url: /Workbench/De_Anza_-_ASTR10/16:_Galaxies/16.08:_Accessible_Descriptions#Figure_16.2.6_Large_Magellanic_Cloud
                      - text: .
                  - paragraph [ref=f495e86]: The Small Magellanic Cloud is considerably less massive than the Large Magellanic Cloud, and it is six times longer than it is wide. This narrow wisp of material points directly toward our Galaxy like an arrow. The Small Magellanic Cloud was most likely contorted into its current shape through gravitational interactions with the Milky Way. A large trail of debris from this interaction between the Milky Way and the Small Magellanic Cloud has been strewn across the sky and is seen as a series of gas clouds moving at abnormally high velocity, known as the Magellanic Stream. We will see that this kind of interaction between galaxies will help explain the irregular shapes of this whole category of small galaxies.
                  - heading "Active Galaxies" [level=3] [ref=f495e87]
                  - paragraph [ref=f495e88]: Active galaxies are not part of the original set of galaxies, but we will discuss them here briefly. Active galaxies have extreme energy output and approximately 10% of all known galaxies fall into this group. There are a number of types and classifications of Active galaxies. The Seyfert galaxies look like Spirals but produce extreme energy output. Radio galaxies emit large amounts of radio electromagnetic radiation. There are other galaxy related objects, such as starburst galaxies, quasars and blazars.
                  - heading "Galaxy Evolution" [level=3] [ref=f495e89]
                  - paragraph [ref=f495e90]: Encouraged by the success of the H-R diagram for stars, astronomers studying galaxies hoped to find some sort of comparable scheme, where differences in appearance could be tied to different evolutionary stages in the life of galaxies. Wouldn't it be nice if every elliptical galaxy evolved into a spiral, for example, just as every main-sequence star evolves into a red giant? Several simple ideas of this kind were tried, but none stood the test of time and observation.
                  - paragraph [ref=f495e91]: Because no simple scheme for evolving one type of galaxy into another could be found, astronomers then tended to the opposite point of view. For a while, most astronomers thought that all galaxies formed very early in the history of the universe and that the differences between them had to do with the rate of star formation. Ellipticals were those galaxies in which all the interstellar matter was converted rapidly into stars. Spirals were galaxies in which star formation occurred slowly over the entire lifetime of the galaxy. This idea turned out to be too simple as well.
                  - paragraph [ref=f495e92]: "Today, we understand that at least some galaxies have changed types over the billions of years since the universe began. Collisions and mergers between galaxies may dramatically change spiral galaxies into elliptical galaxies. Even isolated spirals can change their appearance over time. As they consume their gas, the rate of star formation will slow down, and the spiral arms will gradually become less conspicuous. Over long periods, spirals therefore begin to look more like the galaxies at the middle of Figure \\(\\PageIndex{1}\\), which astronomers refer to as S0 types."
