                  - heading "Irregular Galaxies" [level=3] [ref=f495e76]
                  - paragraph [ref=f495e77]: Irregular galaxies do not have the regular shapes associated with the categories we just described and are therefore their own group, and we continue to use his term. Typically, irregular galaxies have lower masses and luminosities than spiral galaxies. Irregular galaxies often appear disorganized, and many are undergoing relatively intense star formation activity. They contain both young population I stars and old population II stars.
                  - paragraph [ref=f495e78]: "The two best-known irregular galaxies are the Large Magellanic Cloud and Small Magellanic Cloud , which are at a distance of a little more than 160,000 light-years away and are among our nearest extragalactic neighbors. Although not visible from the Northern Hemisphere, these two systems are prominent from the Southern Hemisphere, where they look like wispy clouds in the night sky. Since they are only about one-tenth as distant as the Andromeda galaxy, they present an excellent opportunity for astronomers to study nebulae, star clusters, variable stars, and other key objects in the setting of another galaxy. For example, the Large Magellanic Cloud, in Figure \\(\\PageIndex{6}\\), contains the 30 Doradus complex, also known as the Tarantula Nebula, one of the largest and most luminous groups of supergiant stars known in any galaxy. Note that this galaxy does not have any defined shape or organization."
                  - figure [ref=f495e79]:
                    - img "The Large Magellanic Cloud, an irregular dwarf galaxy near the Milky Way. Details in caption." [ref=f495e80]
                    - generic [ref=f495e81]:
                      - text: "Figure \\(\\PageIndex{6}\\) : Large Magellanic Cloud. The Large Magellanic Cloud, one of the Milky Way's nearest galactic neighbors, is an irregular dwarf galaxy whose bright star-forming regions, including the Tarantula Nebula, make it a valuable target for studying stellar evolution and galactic dynamics. ("
