              - listitem [ref=f335e104]: Describe how advancing waves of star formation cause a molecular cloud to change
              - listitem [ref=f335e105]: Describe a Herbig-Haro object, identifying the jets, disk, and protostar
              - listitem [ref=f335e106]: Determine the age of a protostar using an H–R diagram and the protostar’s luminosity and temperature
              - listitem [ref=f335e107]: Explain how astronomers interpreted observations of disks around young stars to create a model of planet formation
