          - heading "Introduction" [level=2] [ref=f335e96]
          - paragraph [ref=f335e97]: Where do stars come from? We know that they are made of mostly hydrogen, and there is plenty of gas and dust in space. What brings hydrogen together? If it is gravity, there needs to be a large amount of material because hydrogen is the lightest element and able to easily escape gravity's pull. This chapter will explore the starting conditions and events that trigger star formation.
