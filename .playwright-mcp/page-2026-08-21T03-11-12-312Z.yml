                  - paragraph [ref=f605e2]:
                    - text: The Scotsman James Clerk Maxwell (1831–1879) is regarded as the greatest theoretical physicist of the 19th century. (See
                    - link "Figure" [ref=f605e3]:
                      - /url: /Bookshelves/Conceptual_Physics/Introduction_to_Physics_(Park)/04:_Unit_3-_Classical_Physics_-_Thermodynamics_Electricity_and_Magnetism_and_Light/11:_Light/11.02:_Maxwells_Equations-_Electromagnetic_Waves_Predicted_and_Observed#Fig1
                    - text: "\\(\\PageIndex{1}\\)). Although he died young, Maxwell not only formulated a complete electromagnetic theory, represented by"
                    - strong [ref=f605e4]: Maxwell’s equations
                    - text: ", he also developed the kinetic theory of gases and made significant contributions to the understanding of color vision and the nature of Saturn’s rings."
                  - figure [ref=f605e5]:
                    - img "fig-ch01_patchfile_01.jpg" [ref=f605e7]
                    - generic [ref=f605e8]:
                      - strong [ref=f605e9]: Figure
                      - text: "\\(\\PageIndex{1}\\): James Clerk Maxwell, a 19th-century physicist, developed a theory that explained the relationship between electricity and magnetism and correctly predicted that visible light is caused by electromagnetic waves. (credit: G. J. Stodart)"
                  - paragraph [ref=f605e10]: Maxwell brought together all the work that had been done by brilliant physicists such as Oersted, Coulomb, Gauss, and Faraday, and added his own insights to develop the overarching theory of electromagnetism. The results of Maxwell’s equations are paraphrased here in words because their mathematical statement is beyond the level of this text. However, the equations illustrate how apparently simple mathematical statements can elegantly unite and express a multitude of concepts—why mathematics is the language of science.
                  - heading "Attributions" [level=2] [ref=f605e11]
