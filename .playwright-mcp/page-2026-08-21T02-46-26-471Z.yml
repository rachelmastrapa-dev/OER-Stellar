                  - heading "Building Our Galaxy" [level=2] [ref=f471e2]
                  - paragraph [ref=f471e3]: Information about stellar populations holds vital clues to how our galaxy was built up over time. The flattened disk shape of the Milky Way suggests that it formed through a process similar to the one that leads to the formation of a protostar. Building on this idea, astronomers first developed models that assumed the galaxy formed from a single rotating cloud. But, as we shall see, this turns out to be only part of the story.
                  - heading "The Protogalactic Cloud" [level=3] [ref=f471e4]
                  - paragraph [ref=f471e5]: Because the oldest stars, those in the halo and in globular clusters, are distributed in a sphere centered on the nucleus of the Galaxy, it makes sense to assume that the protogalactic cloud that gave birth to our Galaxy was roughly spherical. The oldest stars in the halo have ages of 12 to 13 billion years, so we estimate that the formation of the Galaxy began about that long ago. Then, just as in the case of star formation, the proto galactic cloud collapsed and formed a thin rotating disk. Stars born before the cloud collapsed did not participate in the collapse, but have continued to orbit in the halo to the present day.
                  - paragraph [ref=f471e6]: "Figure \\(\\PageIndex{1}\\) is a diagram of The Monolithic Collapse Model. Panel 1 at upper left shows the gas cloud, rotating counter-clockwise, at the beginning of its collapse. Panel 2 at upper right shows the gas cloud flattened a bit at the edges and thicker nearer the axis of rotation. Globular clusters are indicated as white dots outside the cloud. Panel 3 at lower left shows the cloud further flattened and continuing to collapse into a disk. Finally, panel 4 at lower right shows the galaxy much thinner, and now drawn in white to indicate that stars have formed in the disk. Globular clusters are evenly distributed around the galactic bulge."
                  - figure [ref=f471e7]:
                    - img "Four-panel monolithic collapse model of Milky Way formation. Details in caption." [ref=f471e8]
                    - generic [ref=f471e9]:
                      - text: "Figure \\(\\PageIndex{1}\\): In the monolithic collapse model, the Milky Way formed from a single rotating gas cloud that collapsed into a disk. Halo stars and globular clusters formed early, before or during the collapse, while disk stars formed later from gas already enriched with heavy elements from earlier stellar generations. ("
                      - link "CC BY 4.0" [ref=f471e10]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f471e11]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f471e12]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{1}\\)" [ref=f471e13]':
                        - /url: /Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.6.1_Monolithic_Collapse_Model
                      - text: .
                  - paragraph [ref=f471e14]: Gravitational forces caused the gas in the thin disk to fragment into clouds or clumps with masses like those of star clusters. These individual clouds then fragmented further to form stars. Since the oldest stars in the disk are nearly as old as the youngest stars in the halo, the collapse must have been rapid, requiring perhaps no more than a few hundred million years.
                  - heading "Galactic Mergers" [level=3] [ref=f471e15]
                  - paragraph [ref=f471e16]: "In past decades, astronomers have learned that the evolution of the Galaxy has not been quite as peaceful as this monolithic collapse model suggests. In 1994, astronomers discovered a small new galaxy in the direction of the constellation of Sagittarius. The Sagittarius dwarf galaxy is currently about 70,000 light-years away from Earth and 50,000 light-years from the center of the Galaxy. It is the closest galaxy known. In Figure \\(\\PageIndex{2}\\) the Sagittarius dwarf galaxy is very elongated, and its shape indicates that it is being torn apart by our galaxy's gravitational tides. Superimposed on this greyscale image of the galactic center a contour map of the dwarf galaxy is drawn in red above and slightly to the right of center. The white stars in the contour map mark the locations of several globular clusters contained within the dwarf galaxy. The cross marks the center of the Milky Way. The horizontal line corresponds to the galactic plane. The blue outline on either side of the galactic plane corresponds to Herschel's diagram of the Milky Way. The boxes mark regions where detailed studies of individual stars led to the discovery of this galaxy. The Sagittarius galaxy is much smaller than the Milky Way and is about 10,000 times less massive than our Galaxy. All of the stars in the Sagittarius dwarf galaxy survive joining the bulge and halo of the Milky Way in the next 100 million years or so."
                  - figure [ref=f471e17]:
                    - img "Sagittarius Dwarf galaxy contour map over Milky Way disk. Details in caption." [ref=f471e18]
                    - generic [ref=f471e19]:
                      - text: "Figure \\(\\PageIndex{2}\\): Discovered in 1994, the Sagittarius Dwarf galaxy lies about 50,000 light-years from the Milky Way's center on the far side of the Galaxy and is gradually falling into it, as shown by this composite image combining a visible-light view of the disk with a contour map of the dwarf galaxy's brightness. ("
                      - link "CC BY 4.0" [ref=f471e20]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f471e21]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f471e22]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{2}\\)" [ref=f471e23]':
                        - /url: /Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.6.2_Sagittarius_Dwarf
                      - text: .
                  - paragraph [ref=f471e24]: Since that discovery, evidence has been found for many more close encounters between our galaxy and other neighbor galaxies. When a small galaxy ventures too close, the force of gravity exerted by our galaxy tugs harder on the near side than on the far side. The net effect is that the stars that originally belonged to the small galaxy are spread out into a long stream that orbits through the halo of the Milky Way .
                  - paragraph [ref=f471e25]: "Figure \\(\\PageIndex{3}\\) is an illustration with the Milky Way at bottom, and three streams of stars tracing elliptical orbits around the galactic center. Two of the streams are close enough to the center to have their stars pass through the plane of the galaxy. One stream is so distant it orbits the entire galaxy and does not touch the disk at all. This illustration is based on calculations of what some of these tidal streams might look like if the Milky Way swallowed 50 dwarf galaxies over the past 10 billion years."
                  - figure [ref=f471e26]:
                    - img "Tidal stellar streams orbiting the Milky Way's halo. Details in caption." [ref=f471e27]
                    - generic [ref=f471e28]:
                      - text: "Figure \\(\\PageIndex{3}\\): Streams in the Galactic Halo. When a small galaxy is captured and torn apart by the Milky Way's gravity, its stars are stretched into long tidal streams in the halo, as illustrated here based on models of the Milky Way absorbing 50 dwarf galaxies over the past 10 billion years. ("
                      - link "CC BY 4.0" [ref=f471e29]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f471e30]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f471e31]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{3}\\)" [ref=f471e32]':
                        - /url: /Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.6.3_Streams_in_the_Galactic_Halo
                      - text: .
                  - paragraph [ref=f471e33]: "Such a tidal stream can maintain its identity for billions of years. To date, astronomers have now identified streams originating from 12 small galaxies that ventured too close to the much larger Milky Way. Six more streams are associated with globular clusters. It has been suggested that large globular clusters, like Omega Centauri, are actually dense nuclei of cannibalized dwarf galaxies. The globular cluster M54, in Figure \\(\\PageIndex{4}\\), is now thought to be the nucleus of the Sagittarius dwarf we discussed earlier, which is currently merging with the Milky Way . The stars in the outer regions of such galaxies are stripped off by the gravitational pull of the Milky Way, but the central dense regions may survive."
                  - figure [ref=f471e34]:
                    - img "Globular Cluster M54, dense spherical stars. Details in caption." [ref=f471e35]
                    - generic [ref=f471e36]:
                      - text: "Figure \\(\\PageIndex{4}\\): M54 is a densely packed globular cluster now believed to be the surviving nucleus of the Sagittarius Dwarf Galaxy, imaged in visible light by the Hubble Space Telescope. ("
                      - link "CC BY 4.0" [ref=f471e37]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f471e38]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f471e39]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{4}\\)" [ref=f471e40]':
                        - /url: /Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.6.4_Globular_Cluster_M54
                      - text: .
                  - paragraph [ref=f471e41]: Calculations indicate that the galaxy's thick disk may be a product of one or more such collisions with other galaxies. Accretion of a satellite galaxy would stir up the orbits of the stars and gas clouds originally in the thin disk and cause them to move higher above and below the mid-plane of the Galaxy. Meanwhile, the Galaxy's stars would add to the fluffed-up mix. If such a collision happened about 10 billion years ago, then any gas in the two galaxies that had not yet formed into stars would have had plenty of time to settle back down into the thin disk. The gas could then have begun forming subsequent generations of population I stars. This timing is also consistent with the typical ages of stars in the thick disk.
                  - paragraph [ref=f471e42]: The Milky Way has more collisions in store. An example is the Canis Major dwarf galaxy, which has a mass of about 1% of the mass of the Milky Way. Already long tidal tails have been stripped from this galaxy, which have wrapped themselves around the Milky Way three times. Several of the globular clusters found in the Milky Way may also have come from the Canis Major dwarf, which is expected to merge gradually with the Milky Way over about the next billion years.
                  - paragraph [ref=f471e43]: "In about 4 billion years, the Milky Way itself will collide with the Andromeda Galaxy. Figure \\(\\PageIndex{5}\\) is a series of illustrations based on models that show the stages of the crash. They show events from a vantage point 25,000 light-years from the center of the Milky Way, similar to the present location of the the Sun although it may not be at that distance throughout the sequence of events, as the collision readjusts the orbits of many stars within each galaxy. The whole interaction will take 3 to 4 billion years. In 3.75 billion years, Panel 1, Andromeda has approached the Milky Way. New star formation fills the sky 3.85 billion years from now, in Panel 2. In Panel 3 star formation continues at 3.9 billion years. In Panel 4 the galaxy shapes change as they interact, with Andromeda being stretched and our galaxy becoming warped, about 4 billion years from now. In 5.1 billion years, Panel 5, the cores of the two galaxies are bright lobes. In 7 billion years, Panel 6, the merged galaxies form a huge elliptical galaxy whose brightness fills the night sky."
                  - figure [ref=f471e44]:
                    - img "Six-panel sequence of the Milky Way–Andromeda collision. Details in caption." [ref=f471e45]
                    - generic [ref=f471e46]:
                      - text: "Figure \\(\\PageIndex{5}\\): Over roughly 3 to 4 billion years, the Milky Way and Andromeda will collide, separate, and merge again, eventually forming a single elliptical galaxy. The collision will reshuffle the orbits of many stars within each galaxy. ("
                      - link "CC BY 4.0" [ref=f471e47]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f471e48]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f471e49]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
