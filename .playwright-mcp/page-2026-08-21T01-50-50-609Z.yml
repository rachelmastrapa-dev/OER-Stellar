                        - paragraph [ref=f144e97]: "$$ A = \\frac{\\pi d^2}{4} \\nonumber$$"
                        - paragraph [ref=f144e98]: the area of a 1-m telescope is
                        - paragraph [ref=f144e99]: "$$ \\frac{\\pi d^2}{4} = \\frac{\\pi (1\\text{ m})^2}{4} = 0.79\\text{ m}^2 \\nonumber$$"
                        - paragraph [ref=f144e100]: and the area of a 4-m telescope is
