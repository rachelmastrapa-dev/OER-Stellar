                  - heading "Resolution" [level=3] [ref=f144e75]
                  - paragraph [ref=f144e76]:
                    - text: In addition to gathering as much light as they can, astronomers also want to have the sharpest images possible.
                    - strong [ref=f144e77]:
                      - link "Resolution" [ref=f144e78]:
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#resolution
                    - text: refers to the precision of detail present in an image, or the smallest features that can be distinguished. One factor that determines how good the resolution will be is the size of the telescope. Larger apertures produce sharper images. As astronomers built larger telescopes, they realized that the new challenge in improving image resolution was Earth's atmosphere.
                  - paragraph [ref=f144e79]: Earth's atmosphere is in constant motion. It contains many small-scale blobs of gas that range in size from inches to several feet. Each cell has a slightly different temperature from its neighbor, and each cell acts like a lens, refracting the path of the light by a small amount. This bending slightly changes the position where each light ray finally reaches the detector in a telescope. The blobs of air are in motion, often in different directions at different altitudes. As a result, the path followed by the light is constantly changing. The result is a blurred image, and because the cells are being blown by the wind, the nature of the blur will change many times each second. You have probably noticed this effect as the twinkling of stars seen from Earth. The light beams are bent enough that part of the time they reach your eye, and part of the time some of them miss, thereby making the star seem to vary in brightness or even color. In space, the light of the stars is steady.
                  - paragraph [ref=f144e80]: The resolution of an image is measured in units of angle on the sky, typically in units of arcseconds. One arcsecond is 1/3600 degree, and there are 360 degrees in a full circle. So we are talking about tiny angles on the sky. The best images obtained from the ground with traditional techniques reveal details as small as several tenths of an arcsecond across. One of the main reasons for launching the Hubble Space Telescope was to escape Earth’s atmosphere and obtain even sharper images.
                  - paragraph [ref=f144e81]: "Since we can’t put every telescope into space, astronomers have devised a technique called adaptive optics that can reduce the blurring effect of Earth's atmosphere. This technique makes use of a small flexible mirror placed in the beam of a telescope. A sensor measures how much the atmosphere has distorted the image, and as often as 500 times per second, it sends instructions to the flexible mirror on how to change shape in order to compensate for distortions produced by the atmosphere. The light is thus brought back to an almost perfectly sharp focus at the detector. With adaptive optics, ground-based telescopes can achieve resolutions of 0.1 arcsecond or a little better in infrared wavelengths, Figure \\(\\PageIndex{5}\\). This impressive image is the equivalent of the resolution that the Hubble Space Telescope achieves in the visible light."
                  - figure [ref=f144e82]:
                    - img "Jupiter in infrared from ground-based adaptive optics. Details in caption." [ref=f144e83]
                    - generic [ref=f144e84]:
                      - text: "Figure \\(\\PageIndex{5}\\): One of the clearest pictures of Jupiter ever taken from the surface of Earth, this image was produced with adaptive optics using an 8-meter-diameter telescope at the Very Large Telescope in Chile. Adaptive optics uses infrared wavelengths to remove atmospheric blurring, resulting in a much clearer image. ("
