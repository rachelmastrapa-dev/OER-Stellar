                    - 'heading "Exercise \\(\\PageIndex{1}\\) Calculating the Light-Collecting Area of a Telescope" [level=5] [ref=f144e89]'
                    - paragraph [ref=f144e91]: Calculate the area of a 1-m diameter telescope, then calculate the area of a 4-m diameter telescope.
                    - generic [ref=f144e92]:
                      - term [ref=f144e93]:
