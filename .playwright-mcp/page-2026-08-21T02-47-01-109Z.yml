                  - paragraph [ref=f474e26]: Most are animals that figure prominently in Andean cosmology and traditions. Urton relates that the Spanish chronicler, Polo de Ondegardo, found the Incas to believe that "… the animal constellations were responsible for the procreation and augmentation of their animal counterparts on the earth." Serpents figure prominently in Inca cosmology and are the creatures representing Uchu Pacha, the underworld and lowest of the three worlds of Inca existence. Machacuay leads a dark celestial procession as the constellations move diurnally across the night sky. Van de Guchte says that the amaru (serpents) emerge from their underworld environs via rivers and are thought to be related to rainbows and to foretell of rain. Machacuay can be seen at the beginning of the rainy season. The serpent's dark figure is long, like a snake, and travels head before the tail across the sky. Hanp'atu (the toad) follows closely behind Machacuay. Toads were thought of as bad omens as they were created by the devil.
                  - paragraph [ref=f474e27]: Hanp'atu is a much smaller dark section of the Milky Way to the left of the snake. Tinamou are birds indigenous to the Andes and are of very ancient lineage. Yutu, the Tinamou (the Coalsack) follows Hanpatu in the Milky Way and likewise is much smaller than Machacuay.
                  - paragraph [ref=f474e28]: Yacana, the llama, figures prominently in many aspects of Inca traditions. This celestial figure was thought to animate the llamas on the Earth. The cosmic Yacana is much larger than Hanpatu or Yutu and dominates the Incas' dark section of the Milky Way. Yacana is situated between Centaurus and Scorpius, and the prominent stars Alpha and Beta Centauri are known as llamacñawin, the "… eyes of the llama."
                  - paragraph [ref=f474e29]: Below Yacana is a smaller dark constellation called Uñallamacha. It is said to be a baby llama suckling its mother. Following Yacana and Uñallamacha in the sky from the left is the somewhat smaller constellation of Atoq, the fox. Atoq lies on the ecliptic between the constellations of Scorpius and Sagittarius. The Sun enters it during the December solstice. Urton explains that the Milky Way and Atoq catch up and rise with the summer solstice Sun in the southeast during the same period of time that terrestrial baby foxes typically are born, around 15‒23 December. Urton then lists a second constellation called Yutu. This additional tinamou follows Atoq and completes the celestial precession.
                  - paragraph [ref=f474e30]: Unlike stellar constellations, dark constellations are unchanging features of our Milky Way and have been similarly viewed by humans since time immemorial. In case you find yourself curious to look for dark constellations, all you need is a dark sky and patience to let your eyes adjust. First try looking for the fuzzy, almost cloudlike features of the Milky Way itself. If you look long enough, you'll start to notice subtle shapes of bright and dark regions that make up these constellations, stretching across the entire sky.
