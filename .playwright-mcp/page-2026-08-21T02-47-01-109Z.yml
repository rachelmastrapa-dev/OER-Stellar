            - application "Rich Text Editor, editarea" [ref=f472e331]:
              - iframe [active] [ref=f472e332]:
                - generic [active] [ref=f474e1]:
                  - 'heading "Science and Society: Dark Constellations" [level=2] [ref=f474e2]'
                  - paragraph [ref=f474e3]: Cultures throughout the world have observed and used many phenomena of the night sky. This often included the grouping of stars into constellations or asterisms. Certain cultures also observed and identified features within the dark areas of the Milky Way where dust and gas block the light of the stars that they obscure. As with stellar constellations, dark constellations typically represent animals of significance within local traditions and cosmologies.
                  - paragraph [ref=f474e4]: "The attributed journal article for this section discusses seven case studies of cultures across various geographical regions that feature dark constellations in their knowledge and traditions: the Maya (Mesoamerica), Inca (South American Andes), Moqoit (Argentina), Tupi (Brasil), Aboriginal and Torres Strait Islanders (Australia), Bugis (Indonesia), Xhosa, Sotho, Zulu, and Tswana (southern Africa), and Polynesians (Pacific). Here, we'll focus on just one of these cultures--the Inca. We encourage you to peruse the rest of the attributed article for more details on the other six knowledge traditions."
                  - heading "Inca Astronomy and Dark Constellations" [level=3] [ref=f474e5]
                  - paragraph [ref=f474e6]: Inca cosmology viewed the Milky Way as a river flowing across the night sky in a very literal sense. They saw 'earthly' waters as being drawn into the heavens and then later returned to Earth after a celestial rejuvenation. The Earth was thought to float in a cosmic sea. When the celestial river's orientation was such that it dipped into the ocean, the water was drawn into the sky. Urton described the Milky Way as "… an integral part of the continuing recycling of water throughout the Quechua universe." The plane of the Milky Way is inclined between 26° and 30° with the axis of the Earth's rotation. This orientation is 26° toward the South Celestial Pole, and 30° toward the north.
                  - paragraph [ref=f474e7]: The Milky Way at times will be viewed as rising in the southeast, passing through the zenith, and setting in the northwest. Twelve hours later the horizon positions have shifted, and the band of stars rises instead from the northeast, traveling again through the zenith, but now setting in the southwest. This 24-hour rotation cycle creates two zenith-intersecting inter-cardinal axes that divide the celestial sphere into four observable quarters.
                  - paragraph [ref=f474e8]: The rising of the Milky Way figures prominently in Inca astronomy because of correlations with their inter-cardinal axes and the four points of solstice horizon events. At the time of the December solstice, when the Sun rises at an azimuth of 114° on the Cusco horizon, the evening position of the band of the Milky Way lies similarly to the southeast. During the June solstice sunrise at an azimuth of 64°, the Milky Way is situated in the northeast. The solstices are the only occasions when the Sun rises and travels with the Milky Way. Inca cosmology recognizes that the celestial river and the Sun rise together at the start of the dry season in June and the rainy season in December. This correlation explains the seasonal intensity of the Sun in Inca traditions, which feeds upon the powerful waters.
                  - paragraph [ref=f474e9]: "The Inca ordered their sky by this celestial quadri-partition. This contrasts with common use of the general path ecliptic travel as a reference marker. Urton (1981) argues that this gave the Incas a nearly 90° difference in their perspective of the heavens, and cosmological constructs were developed accordingly. He asserts that the primary axis for celestial references was east/west, rather than north/south, as was common in cultural systems in the Northern Hemisphere. The quadri-partition also appears to have influenced orientations on Earth. The pantheon of Inca dark constellations stretches nearly 150° across the Milky Way, shown in Figure \\(\\PageIndex{1}\\)."
                  - 'figure "Figure \\(\\PageIndex{1}\\): The Incan Dark Constellations – right to left: (1) Machacuay, (2) Hanp''atu, (3) Yutu, (4) Yacana, (5) Uñallamacha, (6) Atoq, and (7) Yutu, constellations from Urton (1981). (CC BY 4.0; Jessica Gullberg via SciEngine). need to confirm license or delete figure" [ref=f474e10]':
