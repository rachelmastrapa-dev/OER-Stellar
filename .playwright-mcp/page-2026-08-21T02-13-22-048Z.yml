                  - paragraph [ref=f279e357]:
                    - text: We can estimate the masses of binary star systems using Newton’s reformulation of Kepler’s third law (discussed in Newton’s Universal Law of Gravitation). Kepler found that the time a planet takes to go around the Sun is related by a specific mathematical formula to its distance from the Sun. In our binary star situation, if two objects are in mutual revolution, then the period (
