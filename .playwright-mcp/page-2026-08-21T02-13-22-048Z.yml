                  - paragraph [ref=f279e469]: Therefore, the sum of masses of the two stars in the Sirius binary system is 3.2 times the Sun’s mass. In order to determine the individual mass of each star, we would need the velocities of the two stars and the orientation of the orbit relative to our line of sight.
                  - heading "The Range of Stellar Masses" [level=3] [ref=f279e470]
                  - paragraph [ref=f279e471]: How large can the mass of a star be? Stars more massive than the Sun are rare. None of the stars within 30 light-years of the Sun has a mass greater than four times that of the Sun. Searches at large distances from the Sun have led to the discovery of a few stars with masses up to about 100 times that of the Sun, and a handful of stars (a few out of several billion) may have masses as large as 250 solar masses. However, most stars have less mass than the Sun.
                  - paragraph [ref=f279e472]:
                    - text: "According to theoretical calculations, the smallest mass that a true star can have is about 1/12 that of the Sun. By a “true” star, astronomers mean one that becomes hot enough to fuse protons to form helium (as discussed in The Sun: A Nuclear Powerhouse). Objects with masses between roughly 1/100 and 1/12 that of the Sun may produce energy for a brief time by means of nuclear reactions involving deuterium, but they do not become hot enough to fuse protons. Such objects are intermediate in mass between stars and planets and have been given the name brown dwarfs (Figure 18.8). Brown dwarfs are similar to Jupiter in radius but have masses from approximately 13 to 80 times larger than the mass of Jupiter."
                    - superscript [ref=f279e473]: "2"
                  - 'figure "Figure 18.8 : Brown Dwarfs in Orion. These images, taken with the Hubble Space Telescope, show the region surrounding the Trapezium star cluster inside the star-forming region called the Orion Nebula. (a) No brown dwarfs are seen in the visible light image, both because they put out very little light in the visible and because they are hidden within the clouds of dust in this region. (b) This image was taken in infrared light, which can make its way to us through the dust. The faintest objects in this image are brown dwarfs with masses between 13 and 80 times the mass of Jupiter. (credit a: NASA, C.R. O’Dell and S.K. Wong (Rice University); credit b: NASA; K.L. Luhman (Harvard-Smithsonian Center for Astrophysics) and G. Schneider, E. Young, G. Rieke, A. Cotera, H. Chen, M. Rieke, R. Thompson (Steward Observatory))" [ref=f279e474]':
                    - img "Brown Dwarfs in the Orion Nebula. In image (a), taken in visible light, bright clouds of gas dominate the image. Just a few bright stars around the Trapezium are visible below center. In image (b), taken in infrared light, much less nebulosity is seen and many more stars cover the entire field." [ref=f279e476]
                  - paragraph [ref=f279e478]: Still-smaller objects with masses less than about 1/100 the mass of the Sun (or 10 Jupiter masses) are called planets. They may radiate energy produced by the radioactive elements that they contain, and they may also radiate heat generated by slowly compressing under their own weight (a process called gravitational contraction). However, their interiors will never reach temperatures high enough for any nuclear reactions, to take place. Jupiter, whose mass is about 1/1000 the mass of the Sun, is unquestionably a planet, for example. Until the 1990s, we could only detect planets in our own solar system, but now we have thousands of them elsewhere as well. (We will discuss these exciting observations in The Birth of Stars and the Discovery of Planets outside the Solar System.)
                  - heading "The Mass-Luminosity Relation" [level=3] [ref=f279e479]
                  - paragraph [ref=f279e480]: "Now that we have measurements of the characteristics of many different types of stars, we can search for relationships among the characteristics. For example, we can ask whether the mass and luminosity of a star are related. It turns out that for most stars, they are: The more massive stars are generally also the more luminous. This relationship, known as the mass-luminosity relation, is shown graphically in Figure 18.9. Each point represents a star whose mass and luminosity are both known. The horizontal position on the graph shows the star’s mass, given in units of the Sun’s mass, and the vertical position shows its luminosity in units of the Sun’s luminosity."
                  - 'figure "Figure 18.9 : Mass-Luminosity Relation. The plotted points show the masses and luminosities of stars. The three points lying below the sequence of points are all white dwarf stars." [ref=f279e481]':
                    - img "Plot of the Mass-Luminosity Relation. In this graph the vertical axis is labeled “Luminosity (LSun)”. It is a logarithmic scale, ranging from 0 to 1,000,000. The horizontal axis is labeled “Mass (solar masses)”. It is a non-logarithmic scale ranging from zero to 20. About 100 stars are plotted on the graph, with nearly all lying on a straight line running from the lower left corner to the upper right corner. A few points lie below the lower left part of the main line and are white dwarf stars." [ref=f279e483]
                  - paragraph [ref=f279e485]: We can also say this in mathematical terms.
