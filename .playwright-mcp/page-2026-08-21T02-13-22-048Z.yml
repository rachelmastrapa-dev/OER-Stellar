                  - heading "How to Weigh a Star" [level=2] [ref=f279e2]
                  - paragraph [ref=f279e3]: The mass of a star—how much material it contains—is one of its most important characteristics. If we know a star’s mass, as we shall see, we can estimate how long it will shine and what its ultimate fate will be. Yet the mass of a star is very difficult to measure directly. Somehow, we need to put a star on the cosmic equivalent of a scale.
                  - paragraph [ref=f279e4]: Luckily, not all stars live like the Sun, in isolation from other stars. About half the stars are binary stars—two stars that orbit each other, bound together by gravity. Masses of binary stars can be calculated from measurements of their orbits, just as the mass of the Sun can be derived by measuring the orbits of the planets around it (see Orbits and Gravity).
                  - heading "Binary Stars" [level=3] [ref=f279e5]
                  - paragraph [ref=f279e6]:
                    - text: Before we discuss in more detail how mass can be measured, we will take a closer look at stars that come in pairs. The first binary star was discovered in 1650, less than half a century after Galileo began to observe the sky with a telescope. John Baptiste Riccioli (1598–1671), an Italian astronomer, noted that the star Mizar, in the middle of the Big Dipper’s handle, appeared through his telescope as two stars. Since that discovery, thousands of binary stars have been cataloged. (Astronomers call any pair of stars that appear to be close to each other in the sky
                    - emphasis [ref=f279e7]: double
                    - emphasis [ref=f279e8]: stars
                    - text: ", but not all of these form a true binary, that is, not all of them are physically associated. Some are just chance alignments of stars that are actually at different distances from us.) Although stars most commonly come in pairs, there are also triple and quadruple systems."
                  - paragraph [ref=f279e9]: One well-known binary star is Castor, located in the constellation of Gemini. By 1804, astronomer William Herschel, who also discovered the planet Uranus, had noted that the fainter component of Castor had slightly changed its position relative to the brighter component. (We use the term “component” to mean a member of a star system.) Here was evidence that one star was moving around another. It was actually the first evidence that gravitational influences exist outside the solar system. The orbital motion of a binary star is shown in Figure 18.4. A binary star system in which both of the stars can be seen with a telescope is called a visual binary.
                  - figure [ref=f279e10]:
                    - img "Revolution of a Binary Star. This figure shows seven observations of the mutual revolution of two stars, one a brown dwarf and one an ultra-cool L dwarf. At center one of the stars is drawn as a red dot surrounded by a blue ellipse. The positions of the companion star at seven different dates are shown as red dots along the blue ellipse. A white arrow points from each red dot on the ellipse to an actual image of the system. Moving clockwise from lower left around the ellipse the observation dates for the individual images are, “April 2000”, “February 2002”, “October 2002”, “February 2003”, “March 2003”, “December 2003” and “January 2004”." [ref=f279e12]
                  - paragraph [ref=f279e14]: Edward C. Pickering (1846–1919), at Harvard, discovered a second class of binary stars in 1889—a class in which only one of the stars is actually seen directly. He was examining the spectrum of Mizar and found that the dark absorption lines in the brighter star’s spectrum were usually double. Not only were there two lines where astronomers normally saw only one, but the spacing of the lines was constantly changing. At times, the lines even became single. Pickering correctly deduced that the brighter component of Mizar, called Mizar A, is itself really two stars that revolve about each other in a period of 104 days. A star like Mizar A, which appears as a single star when photographed or observed visually through the telescope, but which spectroscopy shows really to be a double star, is called a spectroscopic binary.
                  - paragraph [ref=f279e15]:
                    - text: Mizar, by the way, is a good example of just how complex such star systems can be. Mizar has been known for centuries to have a faint companion called Alcor, which can be seen without a telescope. Mizar and Alcor form an
                    - emphasis [ref=f279e16]: optical double
                    - text: —a pair of stars that appear close together in the sky but do not orbit each other. Through a telescope, as Riccioli discovered in 1650, Mizar can be seen to have another, closer companion that does orbit it; Mizar is thus a visual binary. The two components that make up this visual binary, known as Mizar A and Mizar B, are both spectroscopic binaries. So, Mizar is really a quadruple system of stars.
                  - paragraph [ref=f279e17]:
                    - text: Strictly speaking, it is not correct to describe the motion of a binary star system by saying that one star orbits the other. Gravity is a
                    - emphasis [ref=f279e18]: mutual
                    - text: attraction. Each star exerts a gravitational force on the other, with the result that both stars orbit a point between them called the
                    - emphasis [ref=f279e19]: center of mass
                    - text: . Imagine that the two stars are seated at either end of a seesaw. The point at which the fulcrum would have to be located in order for the seesaw to balance is the center of mass, and it is always closer to the more massive star (Figure 18.5).
                  - 'figure "Figure 18.5 : Binary Star System. In a binary star system, both stars orbit their center of mass. The image shows the relative positions of two, different-mass stars from their center of mass, similar to how two masses would have to be located on a seesaw in order to keep it level. The star with the higher mass will be found closer to the center of mass, while the star with the lower mass will be farther from it." [ref=f279e20]':
                    - img "Diagram illustrating the concept of center of mass in a binary star system. A seesaw is shown in profile, with the plank horizontal indicating that the system is in balance. Sitting on the left side of the plank is a red sphere labeled “High-mass star”, and on the right side is a small blue sphere labeled “Low-mass star”. In this case the fulcrum (or pivot) is not located below the center of the seesaw, but placed to the left of center near the high mass star. The point where the fulcrum touches the plank is labeled “Center of mass”." [ref=f279e22]
                  - paragraph [ref=f279e24]: Figure 18.6 shows two stars (A and B) moving around their center of mass, along with one line in the spectrum of each star that we observe from the system at different times. When one star is approaching us relative to the center of mass, the other star is receding from us. In the top left illustration, star A is moving toward us, so the line in its spectrum is Doppler-shifted toward the blue end of the spectrum. Star B is moving away from us, so its line shows a redshift. When we observe the composite spectrum of the two stars, the line appears double. When the two stars are both moving across our line of sight (neither away from nor toward us), they both have the same radial velocity (that of the pair’s center of mass); hence, the spectral lines of the two stars come together. This is shown in the two bottom illustrations in Figure 18.6.
                  - figure [ref=f279e25]:
                    - img [ref=f279e27]
                  - paragraph [ref=f279e29]:
                    - text: A plot showing how the velocities of the stars change with time is called a
                    - emphasis [ref=f279e30]: radial velocity curve
                    - text: ; the curve for the binary system in Figure 18.6 is shown in Figure 18.7.
                  - 'figure "Figure 18.7 : Radial Velocities in a Spectroscopic Binary System. These curves plot the radial velocities of two stars in a spectroscopic binary system, showing how the stars alternately approach and recede from Earth. Note that positive velocity means the star is moving away from us, and negative velocity means the star is moving toward us. The center of mass of the system itself is also moving away from us, indicated by the positive velocity of 40 kilometers per second. The positions on the curve corresponding to the illustrations in Figure 18.6 are marked with the diagram number (1–4)." [ref=f279e31]':
                    - img [ref=f279e33]
                  - generic [ref=f279e35]:
