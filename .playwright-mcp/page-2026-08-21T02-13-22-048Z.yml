                    - paragraph [ref=f279e301]: "By the end of this section, you will be able to:"
                    - list [ref=f279e302]:
                      - listitem [ref=f279e303]: Distinguish the different types of binary star systems
                      - listitem [ref=f279e304]: Understand how we can apply Newton’s version of Kepler’s third law to derive the sum of star masses in a binary star system
