            - application "Rich Text Editor, editarea" [ref=f449e266]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f449e280]: "<h2>Introduction</h2> <p class=\"lt-phys-3798 lt-phys-64815\">One of the most striking features you can see in a truly dark sky—one without light pollution—is the band of faint white light called the Milky Way, which stretches from one horizon to the other. This chapter will discuss early observations of the Milky Way, our galaxy's structure, formation, and many other things that we have learned while observing the Milky Way.</p> <section class=\"box-objectives\"> <h5 class=\"box-legend lt-phys-64816\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <p class=\"lt-phys-64816\">By the end of this section, you will be able to:</p> <ul> <li class=\"lt-phys-64816\">List the main components of the Galaxy</li> <li class=\"lt-phys-64818\">Describe how astronomers determine the mass of the galaxy</li> <li class=\"lt-phys-64818\">Describe how the observed rotation curve of our galaxy suggest the presence of dark matter</li> <li class=\"lt-phys-64819\">Describe the radio and X-ray observations that indicate energetic phenomena are occurring at the galactic center</li> <li class=\"lt-phys-64819\">Explain what has been revealed by high-resolution near-infrared imaging of the galactic center</li> <li class=\"lt-phys-64820\">Distinguish between population I and population II stars according to their locations, motions, heavy-element abundances, and ages</li> <li class=\"lt-phys-64821\">Describe the roles played by the collapse of a single cloud and mergers with other galaxies in building the Milky Way Galaxy we see today</li> </ul> </section> <p class=\"lt-phys-3798 lt-phys-64815\">{{template.ShowOrg()}}</p> <p><strong>Thumbnail</strong>: Milky Way over dunes in Great Sand Dunes National Park, Colorado, United States. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; <a href=\"https://www.flickr.com/photos/greatsanddunesnpp/33949708268/\" target=\"_blank\" title=\"Patrick Myers\">NPS/Patrick Myers</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Milky_Way_over_dunes_in_Great_Sand_Dunes_National_Park,_Colorado,_United_States.jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p>"
