            - application "Rich Text Editor, editarea" [ref=f573e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f573e336]: "<h2>Nicolaus Copernicus</h2> <p class=\"lt-phys-64656\">One of the most important events of the Renaissance was the displacement of Earth from the center of the universe, an intellectual revolution initiated by a Polish cleric in the sixteenth century. Nicolaus <span class=\"no-emphasis\" data-type=\"term\" group-by=\"C\">Copernicus</span> was born in Torun, a mercantile town along the Vistula River. His training was in law and medicine, but his main interests were astronomy and mathematics. His great contribution to science was a critical reappraisal of the existing theories of planetary motion and the development of a new Sun-centered, or <span data-type=\"term\" group-by=\"h\">heliocentric</span>, model of the solar system. Copernicus concluded that Earth is a planet and that all the planets circle the Sun. Only the Moon orbits Earth (Figure 2.17).</p> <figure><span data-alt=\"Painting of Nicolaus Copernicus.\" data-type=\"media\"><img alt=\"Painting of Nicolaus Copernicus.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46185/77e0f6a43766ceab132d2358b87746b6e6ed8f46\" /> </span> <figcaption>Figure 2.16 : Nicolaus Copernicus (1473–1543). Copernicus was a cleric and scientist who played a leading role in the emergence of modern science. Although he could not prove that Earth revolves about the Sun, he presented such compelling arguments for this idea that he turned the tide of cosmological thought and laid the foundations upon which Galileo and Kepler so effectively built in the following century.</figcaption> </figure> <figure><img alt=\"Image of a statue of Astronomer Nicolaus Copernicus holding model of Heliocentric Solar System. \" src=\"/@api/deki/files/42775/figure-14-nicolasCopernicus. jpg\" /> <figcaption>Public Domain | Image courtesy of Pixabay. com.</figcaption> </figure> <p class=\"lt-phys-64088\">The <strong>Copernican Revolution </strong>was based on the works of four men — Copernicus, Brahe, Kepler, and Galileo.</p> <p class=\"lt-phys-64088\">Nicolaus (or Nicolas) Copernicus was a Polish astronomer who believed there were too many errors in the Ptolemaic Geocentric Universe. Copernicus noted, as did some others, that Ptolemy’s “retrograde” was too complicated. So Copernicus developed a Sun-Centered Solar System, that is, a <strong>Heliocentric Solar System</strong>.</p> <p class=\"lt-phys-64088\"><a class=\"link-https\" href=\"/Workbench/De_Anza_-_ASTR10/03:_Night_Sky_Navigation/3.08:_Extra_Unused_Pages/3.8.09:_The_Birth_of_Modern_Astronomy\" rel=\"freelink\" title=\"https://phys.libretexts.org/Workbench/De_Anza_-_ASTR10/03%3A_Night_Sky_Navigation/3.08%3A_Extra_Unused_Pages/3.8.09%3A_The_Birth_of_Modern_Astronomy\">https://phys.libretexts.org/Workbenc...dern_Astronomy</a></p>"
