            - application "Rich Text Editor, editarea" [ref=f594e308]:
              - iframe [active] [ref=f594e309]:
                - generic [active] [ref=f596e1]:
                  - 'heading "Edwin Hubble: Expanding the Universe" [level=2] [ref=f596e2]'
                  - paragraph [ref=f596e3]: The son of a Missouri insurance agent, Edwin Hubble (Figure 26.3) graduated from high school at age 16. He excelled in sports, winning letters in track and basketball at the University of Chicago, where he studied both science and languages. Both his father and grandfather wanted him to study law, however, and he gave in to family pressure. He received a prestigious Rhodes scholarship to Oxford University in England, where he studied law with only middling enthusiasm. Returning to be the United States, he spent a year teaching high school physics and Spanish as well as coaching basketball, while trying to determine his life’s direction.
                  - 'figure "Figure 26.3 : Edwin Hubble (1889–1953). Edwin Hubble established some of the most important ideas in the study of galaxies." [ref=f596e4]':
                    - img "Photograph of Edwin Hubble." [ref=f596e6]
                  - paragraph [ref=f596e8]: The pull of astronomy eventually proved too strong to resist, and so Hubble went back to the University of Chicago for graduate work. Just as he was about to finish his degree and accept an offer to work at the soon-to-be-completed 2.5-meter telescope, the United States entered World War I, and Hubble enlisted as an officer. Although the war had ended by the time he arrived in Europe, he received more officer’s training abroad and enjoyed a brief time of further astronomical study at Cambridge before being sent home.
                  - paragraph [ref=f596e9]: In 1919, at age 30, he joined the staff at Mount Wilson and began working with the world’s largest telescope. Ripened by experience, energetic, disciplined, and a skillful observer, Hubble soon established some of the most important ideas in modern astronomy. He showed that other galaxies existed, classified them on the basis of their shapes, found a pattern to their motion (and thus put the notion of an expanding universe on a firm observational footing), and began a lifelong program to study the distribution of galaxies in the universe. Although a few others had glimpsed pieces of the puzzle, it was Hubble who put it all together and showed that an understanding of the large-scale structure of the universe was feasible.
                  - paragraph [ref=f596e10]:
                    - text: His work brought Hubble much renown and many medals, awards, and honorary degrees. As he became better known (he was the first astronomer to appear on the cover of
                    - emphasis [ref=f596e11]: Time
                    - text: magazine), he and his wife enjoyed and cultivated friendships with movie stars and writers in Southern California. Hubble was instrumental (if you’ll pardon the pun) in the planning and building of the 5-meter telescope on Palomar Mountain, and he had begun to use it for studying galaxies when he passed away from a stroke in 1953.
                  - paragraph [ref=f596e12]: When astronomers built a space telescope that would allow them to extend Hubble’s work to distances he could only dream about, it seemed natural to name it in his honor. It was fitting that observations with the Hubble Space Telescope (and his foundational work on expansion of the universe) contributed to the 2011 Nobel Prize in Physics, given for the discovery that the expansion of the universe is accelerating (a topic we will expand upon in the chapter on The Big Bang).
