            - application "Rich Text Editor, editarea" [ref=f529e329]:
              - iframe [active] [ref=f529e330]:
                - generic [active] [ref=f531e1]:
                  - heading "Building the Universe" [level=2] [ref=f531e2]
                  - paragraph [ref=f531e3]: In the preceding section, we emphasized the role of mergers in shaping the evolution of galaxies. In order to collide, galaxies must be fairly close together. To estimate how often collisions occur and how they affect galaxy evolution, astronomers need to know how galaxies are distributed in space and over cosmic time. Are most of them isolated from one another or do they congregate in groups? If they congregate, how large are the groups and how and when did they form? And how, in general, are galaxies and their groups arranged in the cosmos? Are there as many in one direction of the sky as in any other, for example? How did galaxies get to be arranged the way we find them today? Edwin Hubble found answers to some of these questions only a few years after he first showed that the spiral nebulae were galaxies and not part of our Milky Way. As he examined galaxies all over the sky, Hubble made two discoveries that turned out to be crucial for studies of the evolution of the universe.
                  - heading "The Cosmological Principle" [level=3] [ref=f531e4]
                  - paragraph [ref=f531e5]: Hubble made his observations with what were then the world's largest telescopes, the 100-inch and 60-inch reflectors on Mount Wilson. These telescopes have small fields of view, which means that they can see only a small part of the sky at a time. To photograph the entire sky with the 100-inch telescope, would have taken longer than a human lifetime. So instead, Hubble sampled the sky in many regions. He photographed 1283 sample areas, and on each print, he carefully counted the numbers of galaxies. The first discovery Hubble made from his survey was that the number of galaxies visible in each area of the sky is about the same. He also found that the numbers of galaxies increase with faintness, as we would expect if the density of galaxies is about the same at all distances from us.
                  - paragraph [ref=f531e6]: To understand what we mean, imagine you are taking snapshots in a crowded stadium during a sold-out concert. The people sitting near you look big, so only a few of them will fit into a photo. But if you focus on the people sitting in seats way on the other side of the stadium, they look so small that many more will fit into your picture. If all parts of the stadium have the same seat arrangements, then as you look farther and farther away, your photo will get more and more crowded with people. In the same way, as Hubble looked at fainter and fainter galaxies, he saw more and more of them.
                  - paragraph [ref=f531e7]:
                    - text: Hubble's findings are enormously important, for they indicate that the universe is both
                    - strong [ref=f531e8]:
                      - link "isotropic" [ref=f531e9]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#isotropic
                    - text: and
                    - strong [ref=f531e10]:
                      - link "homogeneous" [ref=f531e11]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#homogeneous
                    - text: . The universe looks the same in all directions. Also, a large volume of space at any given redshift or distance is much like any other volume at that redshift. If that is so, any section of the universe will look the same as any other.
                  - paragraph [ref=f531e12]:
                    - text: The research in the last almost 100 years since then generally agree with a homogenous and isotropic universe. Any difference we observe are small-scale, local differences. The idea that the universe is the same everywhere is called the
                    - strong [ref=f531e13]:
                      - link "cosmological principle" [ref=f531e14]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#cosmological_principle
                    - text: . Without this principle, it would be challenging to study the universe. Astronomers similarly assume that the speed of light is constant everywhere in the universe, and that gravity behaves in the same way. If this were not a reasonable assumption, we would not be able to create models to simulate distant parts of the universe to understand our observations. With modern instruments, astronomers have measured the velocities and distances of hundreds of thousands of galaxies, and so built up a meaningful picture of the large-scale structure of the universe. In the rest of this section, we describe what we know about the distribution of galaxies, beginning with those that are nearby.
                  - heading "The Local Group" [level=3] [ref=f531e15]
                  - paragraph [ref=f531e16]:
                    - text: The region of the universe for which we have the most detailed information is, as you would expect, our own local neighborhood. The Milky Way Galaxy is a member of a small group of galaxies called the
                    - strong [ref=f531e17]:
                      - link "Local Group" [ref=f531e18]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#local_group
                    - text: . It is spread over about 3 million light-years and contains about 60 members. There are three large spiral galaxies, our own, the Andromeda galaxy, and M33, two intermediate ellipticals, and many dwarf ellipticals and irregular galaxies. New members of the Local Group are still being discovered. A dwarf galaxy only about 80,000 light-years from Earth and about 50,000 light-years from the center of the galaxy was discovered in 1994 in the constellation of Sagittarius. This dwarf is actually venturing too close to the much larger Milky Way and will eventually be consumed by it.
                  - paragraph [ref=f531e19]: Many of the recent discoveries have been made possible by the new generation of automated, sensitive, wide-field surveys that map the positions of millions of stars across most of the visible sky. By digging into the data with sophisticated software, astronomers have turned up numerous tiny, faint dwarf galaxies that are all but invisible to the eye even in those deep telescopic images. Prevailing theories of how galaxies form predict that there should be more dwarf galaxies around big galaxies like the Milky Way than have been observed. Now we have the tools to find these faint and tiny galaxies and begin to compare the numbers of them with theoretical predictions.
                  - paragraph [ref=f531e20]:
                    - text: Several new dwarf galaxies have also been found near the Andromeda galaxy. Such dwarf galaxies are difficult to find because they typically contain relatively few stars, and it is hard to distinguish them from the foreground stars in our own Milky Way. The average of the motions of all the galaxies in the Local Group indicates that its total mass is about 4 × 10
                    - superscript [ref=f531e21]: "12"
                    - generic [ref=f531e22]:
                      - text: M
                      - subscript [ref=f531e23]: Sun
                    - text: ", and at least half of this mass is contained in the two giant spirals, the Andromeda galaxy and the Milky Way Galaxy. Remember that a substantial amount of the mass in the Local Group is in the form of dark matter."
                  - heading "Neighboring Groups and Clusters" [level=3] [ref=f531e24]
                  - paragraph [ref=f531e25]: "Small galaxy groups like ours are hard to notice at larger distances. However, there are much more substantial groups called galaxy clusters that are easier to spot even many millions of light-years away. Such clusters are described as poor or rich depending on how many galaxies they contain. Rich clusters have thousands or even tens of thousands of galaxies, although many of the galaxies are quite faint and hard to detect. The nearest moderately rich galaxy cluster is called the Virgo Cluster, after the constellation in which it is seen. It is about 50 million light-years away and contains thousands of members, of which a few are in Figure \\(\\PageIndex{1}\\). The giant elliptical, and very active, galaxy M87 belongs to the Virgo Cluster. The two galaxies to the top right of the image are known as The Eyes."
                  - figure [ref=f531e26]:
                    - img "Central Virgo Cluster with giant elliptical galaxy M87 and surrounding galaxies. Details in caption." [ref=f531e27]
                    - generic [ref=f531e28]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Virgo Cluster. This image shows the central region of the Virgo Cluster, the nearest rich galaxy cluster at about 50 million light-years, dominated by the giant elliptical galaxy M87 and surrounded by hundreds of smaller member galaxies. ("
                      - link "CC BY 4.0" [ref=f531e29]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f531e30]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f531e31]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f531e32]':
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.08:_Accessible_Descriptions#Figure_17.3.1_Virgo_Cluster
                      - text: .
                  - paragraph [ref=f531e33]:
                    - text: "A good example of a cluster that is much larger than the Virgo complex is the Coma cluster, with a diameter of at least 10 million light-years. Figure \\(\\PageIndex{1}\\) is a combined visible-light, from the Sloan Digital Sky Survey, and infrared, from the Spitzer Space Telescope, image. It has been color coded so that faint dwarf galaxies are seen as green. The number of little green smudges on the image greatly outnumber the other types of galaxies in the cluster. Really rich clusters such as Coma usually have a high concentration of galaxies near the center. We can see giant elliptical galaxies in these central regions but few, if any, spiral galaxies. The spirals that do exist generally occur on the outskirts of clusters. The cluster is roughly 320 million light-years away from us. The total mass of this cluster is about 4 × 10"
                    - superscript [ref=f531e34]: "15"
                    - generic [ref=f531e35]:
                      - text: M
                      - subscript [ref=f531e36]: Sun
                    - text: ", enough mass to make 4 million billion stars like the Sun."
                  - figure [ref=f531e37]:
                    - img "Coma Cluster image color-coded to show dwarf galaxies outnumbering large galaxies. Details in caption." [ref=f531e38]
                    - generic [ref=f531e39]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Coma Cluster. This combined visible-light and infrared image of the Coma Cluster, color-coded to highlight faint dwarf galaxies in green, shows that small dwarf galaxies vastly outnumber the cluster's large ellipticals and spirals. ("
                      - link "CC BY 4.0" [ref=f531e40]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f531e41]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f531e42]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f531e43]':
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.08:_Accessible_Descriptions#Figure_17.3.2_Coma_Cluster
                      - text: .
                  - paragraph [ref=f531e44]: Ellipticals are often found in groups with other ellipticals in crowded situations. It is precisely in such crowds that collisions are most likely. We think that most large ellipticals are built through mergers of smaller galaxies. Spirals, on the other hand, are more likely to be found in poor clusters or on the edges of rich clusters where collisions are less likely to disrupt the spiral arms or strip out the gas needed for continued star formation.
                  - heading "Gravitational Lensing" [level=3] [ref=f531e45]
                  - paragraph [ref=f531e46]: "Spacetime is more strongly curved in regions where the gravitational field is strong. Light passing very near a concentration of matter appears to follow a curved path. In the case of starlight passing close to the Sun, we measure the position of the distant star to be slightly different from its true position. Now let's consider the case of light from a distant galaxy or quasar that passes near a concentration of matter such as a cluster of galaxies on its journey to our telescopes. According to general relativity, the light path may be bent in a variety of ways. As a result we can observe distorted and even multiple images. Figure \\(\\PageIndex{3}\\) is a diagram demonstrating how a gravitational lens can make two images. Two light rays from a distant quasar are shown being bent while passing a foreground galaxy. They then arrive together at Earth. Although the two beams of light contain the same information, they now appear to come from two different points on the sky. This diagram is oversimplified and not to scale, but it gives a rough idea of the lensing phenomenon. Note that the visible mass in a galaxy is not the only possible gravitational lens. Dark matter can also reveal itself by producing this effect. Astronomers are using lensed images from all over the sky to learn more about where dark matter is located and how much of it exists."
                  - figure [ref=f531e47]:
                    - img "Diagram of gravitational lensing producing two images of a background quasar. Details in caption." [ref=f531e48]
                    - generic [ref=f531e49]:
                      - text: "Figure \\(\\PageIndex{3}\\) : Gravitational Lensing. This diagram illustrates how a foreground galaxy's gravity bends two light paths from a distant quasar, so that an observer on Earth sees two separate images of the same quasar in different directions on the sky. ("
                      - link "CC BY 4.0" [ref=f531e50]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f531e51]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f531e52]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{3}\\)" [ref=f531e53]':
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.08:_Accessible_Descriptions#Figure_17.3.3_Gravitational_Lensing
                      - text: .
                  - paragraph [ref=f531e54]: "Gravitational lenses can produce not only double images, as shown in Figure \\(\\PageIndex{3}\\), but also multiple images, arcs, or rings. The first gravitational lens discovered, in 1979, showed two images of the same distant object. Eventually, astronomers used the Hubble Space Telescope to capture remarkable images of the effects of gravitational lenses. Figure \\(\\PageIndex{4}\\) is an example of gravitational lensing. Light from a supernova at a distance of 9 billion light-years passed near a galaxy in a cluster at a distance of about 5 billion light-years. In the enlarged inset view of the galaxy, the arrows point to the multiple images of the exploding star. The images are arranged around the galaxy in a pattern called an Einstein Cross. The blue streaks wrapping around the galaxy are the stretched images of the supernova's host spiral galaxy, which has been distorted by the warping of space."
                  - figure [ref=f531e55]:
                    - img "Hubble image of a galaxy cluster with inset showing a lensed supernova's Einstein Cross. Details in caption." [ref=f531e56]
                    - generic [ref=f531e57]:
                      - text: "Figure \\(\\PageIndex{4}\\) : Gravitationally Lensed Supernova. Gravitational lensing by a foreground galaxy cluster produced four separate images of a single background supernova, arranged in a Einstein Cross pattern around the lensing galaxy, along with a stretched image of the supernova's distorted host galaxy. ("
                      - link "CC BY 4.0" [ref=f531e58]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f531e59]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
