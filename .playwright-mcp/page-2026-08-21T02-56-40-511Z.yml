                  - paragraph [ref=f531e62]: "General relativity predicts that the light from a distant object may also be amplified by the lensing effect, thereby making otherwise invisible objects bright enough to detect. This is particularly useful for probing the earliest stages of galaxy formation, when the universe was young. Figure \\(\\PageIndex{5}\\) is an example of a very distant faint galaxy that we can study in detail only because its light path passes through a large concentration of massive galaxies and we now see a brighter image of it. The rounded outlines show the location of distinct, distorted images of the background galaxy resulting from lensing by the mass in the cluster. The image in the box at lower left is a reconstruction of what the lensed galaxy would look like in the absence of the cluster, based on a model of the cluster's mass distribution, which can be derived from studying the distorted galaxy images. The reconstruction shows far more detail about the galaxy than could have been seen in the absence of lensing. As the image shows, this galaxy contains regions of star formation that are much brighter than any star-formation regions in our Milky Way Galaxy."
                  - figure [ref=f531e63]:
                    - img "Lensed arcs of a background galaxy and its reconstructed appearance in a Hubble image. Details in caption." [ref=f531e64]
                    - generic [ref=f531e65]:
                      - text: "Figure \\(\\PageIndex{5}\\) : Gravitational Lensing Distortions. This image shows multiple distorted arcs produced by a galaxy cluster gravitationally lensing a single background galaxy, along with a reconstruction of that galaxy's true appearance, revealing unusually bright regions of star formation. ("
