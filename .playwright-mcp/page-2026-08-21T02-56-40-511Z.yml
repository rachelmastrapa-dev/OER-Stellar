                  - heading "Superclusters and Voids" [level=3] [ref=f531e70]
                  - paragraph [ref=f531e71]: After astronomers discovered clusters of galaxies, they naturally wondered whether there were still larger structures in the universe. To answer this question, we must be able to map large parts of the universe in three dimensions. We must know not only the position of each galaxy on the sky but also its distance from us. This means we must be able to measure the redshift of each galaxy in our map. Taking a spectrum of each individual galaxy to do this is a much more time-consuming task than simply counting galaxies seen in different directions on the sky. Today, astronomers have found ways to get the spectra of many galaxies in the same field of view to cut down the time it takes to finish their three-dimensional maps. Larger telescopes are also able to measure the redshifts, and therefore the distances, of much more distant galaxies and to do so much more quickly than previously possible.
                  - paragraph [ref=f531e72]: Another challenge astronomers faced in deciding how to go about constructing a map of the universe is how to begin. We cannot explore the universe in every direction to infinite depth or sensitivity. There are far too many galaxies and far too few telescopes to do the job. But we can pick a single direction or a small slice of the sky and start mapping the galaxies. Margaret Geller, the late John Huchra, and their students at the Harvard-Smithsonian Center for Astrophysics used this technique, and several other groups have extended their work to cover larger volumes of space.
                  - paragraph [ref=f531e73]:
                    - text: The largest universe mapping project to date is the
                    - link "Sloan Digital Sky Survey" [ref=f531e74]:
                      - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.03:_The_Distribution_of_Galaxies#The_Sloan_Digital_Sky_Survey
                    - text: ". A map of the distribution of galaxies observed by the Sloan survey is in Figure \\(\\PageIndex{6}\\). The point at the center corresponds to the Milky Way. Points on the map moving outward from the center are farther away. The distance to the galaxies is indicated by their redshifts, shown on the horizontal line going right from the center. Hour angle on the sky is shown around the circumference of the circular map. The colors of the galaxies indicate the ages of their stars, with the redder color showing galaxies that are made of older stars. The outer circle is at a distance of two billion light-years from us. Note that red galaxies, with older stars, are more strongly clustered than blue galaxies, with young stars.. The unmapped areas are where our view of the universe is obstructed by dust in our own Galaxy."
                  - paragraph [ref=f531e75]:
                    - text: To the surprise of astronomers, these new maps showed that clusters of galaxies are not arranged uniformly throughout the universe, but are found in huge filamentary
                    - generic [ref=f531e76]:
                      - strong [ref=f531e77]:
                        - link "supercluster" [ref=f531e78]:
                          - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#supercluster
                      - text: s
                    - text: that look like great arcs of inkblots splattered across a page. The Local Group is part of a supercluster we call the Virgo Supercluster because it also includes the giant Virgo cluster of galaxies. The superclusters resemble an irregularly torn sheet of paper or a pancake in shape. They can extend for hundreds of millions of light-years in two dimensions, but are only 10 to 20 million light-years thick in the third dimension. Detailed study of some of these structures shows that their masses are roughly 10
                    - superscript [ref=f531e79]: "16"
                    - text: M
                    - subscript [ref=f531e80]: Sun
                    - text: ", which is 10,000 times more massive than the Milky Way Galaxy."
                  - figure [ref=f531e81]:
                    - img "SDSS map of galaxy redshift and clustering, colored by stellar age. Details in caption." [ref=f531e82]
                    - generic [ref=f531e83]:
                      - text: "Figure \\(\\PageIndex{6}\\) : Sloan Digital Sky Survey Map. This map from the Sloan Digital Sky Survey plots galaxy positions by redshift and sky angle out to two billion light-years, revealing a clumpy, web-like large-scale structure in which older, redder galaxies cluster more strongly than younger, bluer galaxies. ("
