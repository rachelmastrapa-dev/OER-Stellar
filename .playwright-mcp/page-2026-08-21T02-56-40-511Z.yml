                      - text: .
                  - paragraph [ref=f531e88]:
                    - text: Separating the filaments and sheets in a supercluster are
                    - strong [ref=f531e89]:
                      - link "voids" [ref=f531e90]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#void
                    - text: ", which look like huge empty bubbles walled in by the great arcs of galaxies. They have typical diameters of 150 million light-years, with the clusters of galaxies concentrated along their walls. The whole arrangement of filaments and voids reminds us of a sponge, the inside of a honeycomb, or a hunk of Swiss cheese with very large holes. If you take a good slice or cross-section through any of these, you will see something that looks roughly like Figure \\(\\PageIndex{6}\\)."
                  - paragraph [ref=f531e91]: Before these voids were discovered, most astronomers would probably have predicted that the regions between giant clusters of galaxies were filled with many small groups of galaxies, or even with isolated individual galaxies. Careful searches within these voids have found few galaxies of any kind. Apparently, 90 percent of the galaxies occupy less than 10 percent of the volume of space.
                  - paragraph [ref=f531e92]: Even larger, more sensitive telescopes and surveys are currently being designed and built to peer farther and farther out in space and back in time. The new 50-meter Large Millimeter Telescope in Mexico and the Atacama Large Millimeter Array in Chile can detect far-infrared and millimeter-wave radiation from massive starbursting galaxies at redshifts and thus distances more than 90% of the way back to the Big Bang. These cannot be observed with visible light because their star formation regions are wrapped in clouds of thick dust. The James Webb Space Telescope has been able to pierce the clouds of dust with its infrared camera and observe galaxies that formed within a billion years of the Big Bang. Astronomers have described these young galaxies as chaotic and messy, nothing like the beautiful spirals of today. It seems these turbulent galaxies go through repeated mergers and bursts of star formation. Further studies will lead to a better understanding of the first generation of galaxies.
                  - heading "The Sloan Digital Sky Survey" [level=3] [ref=f531e93]
                  - paragraph [ref=f531e94]: Modern technology has come to the rescue of astronomers who seek three-dimensional maps of the universe of galaxies. One ambitious survey of the sky was produced using a special telescope, camera, and spectrograph atop the Sacramento Mountains of New Mexico. Called the Sloan Digital Sky Survey (SDSS), after the foundation that provided a large part of the funding, the program used a 2.5-meter telescope as a wide-angle astronomical camera. During a mapping program lasting more than ten years, astronomers used the SDSS's 30 charge-coupled devices (CCDs) to take images of over 500 million objects and spectra of over 3 million, covering more than one-quarter of the celestial sphere. Like many large projects in modern science, the Sloan Survey involved scientists and engineers from many different institutions, ranging from universities to national laboratories.
                  - paragraph [ref=f531e95]: Every clear night for more than a decade, astronomers used the instrument to make images recording the position and brightness of celestial objects in long strips of the sky. The key to the success of the project was a series of optical fibers, thin tubes of flexible glass that can transmit light from a source to the CCD that then records the spectrum. After taking images of a part of the sky and identifying which objects are galaxies, project scientists drilled an aluminum plate with holes for attaching fibers at the location of each galaxy. The telescope was then pointed at the right section of the sky, and the fibers led the light of each galaxy to the spectrometer for individual recording. About an hour was sufficient for each set of spectra, and the pre-drilled aluminum plates could be switched quickly. Thus, it was possible to take as many as 5000 spectra in one night.
                  - paragraph [ref=f531e96]: The galaxy survey led to a more comprehensive map of the sky than has ever before been possible, allowing astronomers to test their ideas about large-scale structure and the evolution of galaxies against an impressive array of real data. The information recorded by the Sloan Survey staggers the imagination. The data came in at 8 megabytes per second (this means 8 million individual numbers or characters every second). Over the course of the project, scientists recorded over 15 terabytes, or 15 thousand billion bytes, which they estimate is comparable to the information contained in the Library of Congress. Organizing and sorting this volume of data and extracting the useful scientific results it contains is a formidable challenge, even in our information age.
                  - paragraph [ref=f531e97]: One very successful solution to the challenge of dealing with such large datasets is to turn to citizen science, or crowd-sourcing. The human eye is very good at recognizing subtle differences among shapes, such as between two different spiral galaxies. When Sloan project astronomers wanted to catalog the shapes of some of the millions of galaxies in their new images, they launched the Galaxy Zoo project. Volunteers around the world were given a short training course online, then were provided with a few dozen galaxy images to classify by eye. The project was wildly successful, resulting in over 40 million galaxy classifications by more than 100,000 volunteers.
                  - heading "Examples and Exercises" [level=2] [ref=f531e98]
                  - generic [ref=f531e99]:
                    - 'heading "Example: Galaxy Survey Volumes" [level=5] [ref=f531e100]'
                    - paragraph [ref=f531e102]: To determine the distribution of galaxies in three-dimensional space, astronomers have to measure their positions and their redshifts. The larger the volume of space surveyed, the more likely the measurement is a fair sample of the universe as a whole. However, the work involved increases very rapidly as you increase the volume covered by the survey.
                    - paragraph [ref=f531e103]: Let's do a quick calculation to see why this is so.
                    - paragraph [ref=f531e104]:
                      - text: Suppose that you have completed a survey of all the galaxies within 30 million light-years and you now want to survey to 60 million light-years. What volume of space is covered by your second survey? How much larger is this volume than the volume of your first survey? Remember that the volume of a sphere, V, is given by the formula V = 4/3πR
                      - superscript [ref=f531e105]: "3"
                      - text: ", where R is the radius of the sphere."
                    - heading "Solution" [level=6] [ref=f531e106]
                    - paragraph [ref=f531e107]:
                      - text: Since the volume of a sphere depends on R
                      - superscript [ref=f531e108]: "3"
                      - text: and the second survey reaches twice as far in distance, it will cover a volume that is 2
                      - superscript [ref=f531e109]: "3"
                      - text: = 8 times larger. The total volume covered by the second survey will be (4/3)π × (60 million light-years)
                      - superscript [ref=f531e110]: "3"
                      - text: = 9 × 10
                      - superscript [ref=f531e111]: "23"
                      - text: light-years
                      - superscript [ref=f531e112]: "3"
                      - text: .
