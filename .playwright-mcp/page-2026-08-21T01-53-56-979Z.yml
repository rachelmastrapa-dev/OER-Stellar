                    - listitem [ref=f162e3]:
                      - strong [ref=f162e5]: aperture
                      - text: ": diameter of the primary lens or mirror of a telescope"
                    - listitem [ref=f162e6]:
                      - strong [ref=f162e8]: charge-coupled device (CCD)
                      - text: ": array of high-sensitivity electronic detectors of electromagnetic radiation, used at the focus of a telescope (or camera lens) to record an image or spectrum"
                    - listitem [ref=f162e9]:
                      - strong [ref=f162e11]: chromatic aberration
                      - text: ": distortion that causes an image to appear fuzzy when each wavelength coming into a transparent material focuses at a different spot"
                    - listitem [ref=f162e12]:
                      - strong [ref=f162e14]: detector
                      - text: ": device sensitive to light that makes a record of astronomical observations"
                    - listitem [ref=f162e15]:
                      - strong [ref=f162e17]: eyepiece
                      - text: ": magnifying lens used to view the image produced by the objective lens or primary mirror of a telescope"
                    - listitem [ref=f162e18]:
                      - strong [ref=f162e20]: filter
                      - text: ": a type of window that absorbs certain colors of light while allowing others to pass through"
                    - listitem [ref=f162e21]:
                      - strong [ref=f162e23]: focus
                      - text: ": point in a telescope where the rays of light converged by a mirror or lens meet"
                    - listitem [ref=f162e24]:
                      - strong [ref=f162e26]: interference
                      - text: ": process in which waves mix together such that their crests and troughs can alternately reinforce and cancel one another"
                    - listitem [ref=f162e27]:
                      - strong [ref=f162e29]: interferometer
                      - text: ": instrument that combines electromagnetic radiation from one or more telescopes to obtain a resolution equivalent to what would be obtained with a single telescope with a diameter equal to the baseline separating the individual separate telescopes"
                    - listitem [ref=f162e30]:
                      - strong [ref=f162e32]: interferometer array
                      - text: ": combination of multiple radio dishes to, in effect, work like a large number of two-dish interferometers"
                    - listitem [ref=f162e33]:
                      - strong [ref=f162e35]: lander
                      - text: ": a spacecraft designed to set down on the surface of another celestial body"
                    - listitem [ref=f162e36]:
                      - strong [ref=f162e38]: lens
                      - text: ": an object, usually made of glass, that focuses or defocuses the light that passes through it"
                    - listitem [ref=f162e39]:
                      - strong [ref=f162e41]: orbiter
                      - text: ": an object that orbits another, especially a spacecraft that orbits a planet etc. without landing on it"
                    - listitem [ref=f162e42]:
                      - strong [ref=f162e44]: photometer
                      - text: ": an instrument used to measure the intensity of light"
                    - listitem [ref=f162e45]:
                      - strong [ref=f162e47]: prime focus
                      - text: ": point in a telescope where the objective lens or primary mirror focuses the light"
                    - listitem [ref=f162e48]:
                      - strong [ref=f162e50]: radar
                      - text: ": technique of transmitting radio waves to an object and then detecting the radiation that the object reflects back to the transmitter; used to measure the distance to, and motion of, a target object or to form images of it"
                    - listitem [ref=f162e51]:
                      - strong [ref=f162e53]: reflecting telescope
                      - text: ": telescope in which the principal light collector is a concave mirror"
                    - listitem [ref=f162e54]:
                      - strong [ref=f162e56]: reflection
                      - text: ": the property of a light wave being thrown back from a surface, such as a mirror"
                    - listitem [ref=f162e57]:
                      - strong [ref=f162e59]: refracting telescope
                      - text: ": telescope in which the principal light collector is a lens or system of lenses"
                    - listitem [ref=f162e60]:
                      - strong [ref=f162e62]: refraction
                      - text: ": changing of a light ray's direction when it passes through variations in matter"
                    - listitem [ref=f162e63]:
                      - strong [ref=f162e65]: resolution
                      - text: ": detail in an image; specifically, the smallest angular (or linear) features that can be distinguished"
                    - listitem [ref=f162e66]:
                      - strong [ref=f162e68]: rover
                      - text: ": a vehicle for exploring extraterrestrial bodies"
                    - listitem [ref=f162e69]:
                      - strong [ref=f162e71]: spectrometer
                      - text: ": an instrument for obtaining a spectrum; in astronomy, usually attached to a telescope to record the spectrum of a star, galaxy, or other astronomical object"
                    - listitem [ref=f162e72]:
                      - strong [ref=f162e74]: telescope
                      - text: ": an instrument used to observe distant objects by collecting and focusing their light"
