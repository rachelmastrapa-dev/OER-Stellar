                  - heading "Sunrise, Sunset" [level=2] [ref=f44e2]
                  - heading "Daytime, Nighttime" [level=3] [ref=f44e3]
                  - paragraph [ref=f44e4]: One of the obvious motions of the heavens is our day and night cycle. Earth turns on its axis in approximately 24 hours. This brings our planet into continuous day and night cycles, where half of Earth is always exposed to sunlight and the other half of Earth is in nighttime, with no sunlight. Note that there are other luminous objects in the heavens, such as the Moon. Yet, by far, the vast majority of our natural lighting comes from the Sun. Even when it is cloudy, we know when it is daytime and likewise nighttime.
                  - generic [ref=f44e5]:
                    - img "Dayside of Earth, including North America." [ref=f44e6]
                    - generic [ref=f44e7]:
                      - text: Dayside of Earth, including North America. [”
                      - link "Dayside Earth" [ref=f44e8]:
                        - /url: https://www.nasa.gov/sites/default/files/1-bluemarble_west.jpg
                      - text: ” by
                      - link "NASA" [ref=f44e9]:
