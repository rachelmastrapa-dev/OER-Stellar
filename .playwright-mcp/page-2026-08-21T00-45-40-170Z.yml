                      - text: "]"
                  - paragraph [ref=f44e16]:
                    - text: Understanding the day-night cycle was essential to ancient civilizations as well as indirectly our modern society. The planting of crops or best time to hunt – survival with plenty to eat – was foremost. Today, we take this for granted since the vast majority of us go to a grocery store to choose the already-cultivated food we want, or go to a restaurant to enjoy an already-prepared meal.
                    - superscript [ref=f44e17]: (1)
                  - generic [ref=f44e18]:
                    - heading "Earth’s Motions" [level=3] [ref=f44e19]
                    - generic [ref=f44e20]:
                      - img "Earth is shown in four different places in its orbit around the sun, with a red line indicating the orbit path." [ref=f44e21]
                      - generic [ref=f44e22]:
                        - text: Earth’s orbit or revolution around the Sun. [”
                        - link "North season" [ref=f44e23]:
                          - /url: https://commons.wikimedia.org/wiki/File:North_season.jpg
                        - text: ” by Tauʻolunga , Wikimedia Commons is in
                        - generic [ref=f44e24]:
                          - text: the
                          - link "Public" [ref=f44e25]:
                            - /url: http://creativecommons.org/publicdomain/zero/1.0
                        - link "Domain, CC0" [ref=f44e26]:
                          - /url: http://creativecommons.org/publicdomain/zero/1.0
                        - text: "]"
                    - paragraph [ref=f44e27]: Our Universe is a Universe of motion. We see and experience evidence of some of the motions, from sunrise to sunset, moonrise and moonset, the seasons, bright planets moving against the background of stars, and even shooting stars — meteors. Earth spins, or rotates, on its axis and it orbits or revolves around the Sun.
                    - paragraph [ref=f44e28]: Other bodies in our Solar System and other stellar systems undergo such motions. Earth rotates once every 24 hours and revolves around the Sun once every 365.24 days. Mars rotates once every 24 hours 39.5 minutes and revolves around the Sun once every 687 earth days. Jupiter rotates once every 9 hours 48 minutes and revolves around the Sun once every 11.86 earth years.
                    - paragraph [ref=f44e29]:
                      - text: The Sun is also moving along with the rotating Milky Way galaxy. What is more, the Milky Way is not static; besides rotating, it is also moving through space. It all seems to be a dizzying dance.
                      - superscript [ref=f44e30]: (1)
                    - generic [ref=f44e31]:
                      - img "This detailed annotated artist’s impression shows the structure of the Milky Way, including the location of the spiral arms and other components such as the bulge. An arrow points towards our sun." [ref=f44e32]
