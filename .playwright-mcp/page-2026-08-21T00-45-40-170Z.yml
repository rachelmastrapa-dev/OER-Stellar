                      - text: is in the
                      - link "Public Domain" [ref=f44e10]:
                        - /url: https://wiki.creativecommons.org/Public_domain
                      - text: "]"
                  - generic [ref=f44e11]:
                    - img "A view of Earth shows part of it is in daylight, part in nighttime." [ref=f44e12]
                    - generic [ref=f44e13]:
                      - text: A view of Earth shows part of it is in daylight, part in nighttime; Apollo 8. NASA. [”
                      - link "Half-full Earth" [ref=f44e14]:
                        - /url: https://nssdc.gsfc.nasa.gov/imgcat/html/object_page/a08_h_15_2561.html
                      - text: ” by NASA is in the
                      - link "Public Domain" [ref=f44e15]:
