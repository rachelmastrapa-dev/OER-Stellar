                  - paragraph [ref=f44e143]
                  - heading "Rising and Setting of the Sun" [level=3] [ref=f44e144]
                  - paragraph [ref=f44e145]: We described the movement of stars in the night sky, but what about during the daytime? The stars continue to circle during the day, but the brilliance of the Sun makes them difficult to see. (The Moon can often be seen in the daylight, however.) On any given day, we can think of the Sun as being located at some position on the hypothetical celestial sphere. When the Sun rises—that is, when the rotation of Earth carries the Sun above the horizon—sunlight is scattered by the molecules of our atmosphere, filling our sky with light and hiding the stars above the horizon.
                  - paragraph [ref=f44e146]: "For thousands of years, astronomers have been aware that the Sun does more than just rise and set. It changes position gradually on the celestial sphere, moving each day about 1° to the east relative to the stars. Very reasonably, the ancients thought this meant the Sun was slowly moving around Earth, taking a period of time we call 1 year to make a full circle. Today, of course, we know it is Earth that is going around the Sun, but the effect is the same: the Sun’s position in our sky changes day to day. We have a similar experience when we walk around a campfire at night; we see the flames appear in front of each person seated about the fire in turn."
                  - paragraph [ref=f44e147]: The path the Sun appears to take around the celestial sphere each year is called the ecliptic (Figure 2.6). Because of its motion on the ecliptic, the Sun rises about 4 minutes later each day with respect to the stars. Earth must make just a bit more than one complete rotation (with respect to the stars) to bring the Sun up again.
                  - 'figure "Figure 2.5 : Star Circles at Different Latitudes. The turning of the sky looks different depending on your latitude on Earth. The red circle in each case is your horizon. Your zenith is the point above your head. (a) At the North Pole, the stars circle the zenith and do not rise and set. (b) At the equator, the celestial poles are on the horizon, and the stars rise straight up and set straight down. (c) At intermediate latitudes, the north celestial pole is at some position between overhead and the horizon. Its angle above the horizon turns out to be equal to the observer’s latitude. Stars rise and set at an angle to the horizon." [ref=f44e148]':
                    - img [ref=f44e150]
                  - paragraph [ref=f44e152]: As the months go by and we look at the Sun from different places in our orbit, we see it projected against different places in our orbit, and thus against different stars in the background (Figure 2.6 and Table 2.1)—or we would, at least, if we could see the stars in the daytime. In practice, we must deduce which stars lie behind and beyond the Sun by observing the stars visible in the opposite direction at night. After a year, when Earth has completed one trip around the Sun, the Sun will appear to have completed one circuit of the sky along the ecliptic.
                  - figure [ref=f44e153]:
                    - img [ref=f44e155]
                    - generic [ref=f44e156]:
                      - text: "Figure 2.6 : Constellations on the Ecliptic. As Earth revolves around the Sun, we sit on “platform Earth” and see the Sun moving around the sky. The circle in the sky that the Sun appears to make around us in the course of a year is called the"
                      - emphasis [ref=f44e157]: ecliptic
                      - text: . This circle (like all circles in the sky) goes through a set of constellations. The ancients thought these constellations, which the Sun (and the Moon and planets) visited, must be special and incorporated them into their system of astrology. Note that at any given time of the year, some of the constellations crossed by the ecliptic are visible in the night sky; others are in the day sky and are thus hidden by the brilliance of the Sun. (The term constellation will be defined more precisely in the next subsection.)
