                  - heading "Seasons and the Sun’s Location" [level=2] [ref=f44e43]
                  - paragraph [ref=f44e44]:
                    - text: Seasons occur on a planet or moon because the axis of rotation remains tilted in one direction during its orbit about its star; Earth about the Sun. The tilt is relative to the planet’s or satellite’s orbit. This tilt results in a planet or moon having Seasons. Earth’s axis is tilted about 23
                    - superscript [ref=f44e45]: "1"
                    - subscript [ref=f44e46]: "2"
                    - text: °. And for comparison, the axis of Mars is tilted about 25°. Not all planets are tilted on their axis, for example Mercury’s tilt is 0°.
                  - paragraph [ref=f44e47]: One of the results of Earth undergoing seasons is changes in day and night lengths. In the summer the days are longer and nights shorter. In the winter it is just the opposite.
