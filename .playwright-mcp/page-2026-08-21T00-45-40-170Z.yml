                  - paragraph [ref=f44e204]: The ecliptic does not lie along the celestial equator but is inclined to it at an angle of about 23.5°. In other words, the Sun’s annual path in the sky is not linked with Earth’s equator. This is because our planet’s axis of rotation is tilted by about 23.5° from a vertical line sticking out of the plane of the ecliptic (Figure 2.7). Being tilted from “straight up” is not at all unusual among celestial bodies; Uranus and Pluto are actually tilted so much that they orbit the Sun “on their side.”
                  - 'figure "Figure 2.7 : The Celestial Tilt. The celestial equator is tilted by 23.5° to the ecliptic. As a result, North Americans and Europeans see the Sun north of the celestial equator and high in our sky in June, and south of the celestial equator and low in the sky in December." [ref=f44e205]':
                    - img [ref=f44e207]
                  - paragraph [ref=f44e209]: The inclination of the ecliptic is the reason the Sun moves north and south in the sky as the seasons change. In Earth, Moon, and Sky, we discuss the progression of the seasons in more detail.
