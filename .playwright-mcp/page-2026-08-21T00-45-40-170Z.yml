                  - paragraph [ref=f44e103]: "If you watch sunrise and sunset locations over a year, you will also note that the location of where the Sun rises and sets changes. As we orbit the Sun, the rising and setting points are further north in the summer and further south in the winter. There is a variable here: your location on Earth. For example, if you are at far northern or southern latitudes, you will experience extreme day and night lengths, depending on the seasons. And, for those north of the Arctic Circle or south of the Antarctic Circle, you will experience some days with no nights, or some nights with no days."
                  - 'figure "The sunset position changes throughout the year, as does the sunrise position. Note: change “W” (west) to “E” (east) for sunrise position. [“Sunset Cycle”, Florida State College at Jacksonville is licensed under CC BY-SA 4.0 / A derivative from the original work ] CC licensed content, Original" [ref=f44e104]':
                    - img "The location of the sunset through the seasons is shown. The sun appears at the furthest left, or Southwest, on December 21. Next, the sunset is to the right, or further north; then in the center of the image on March 21 and September 21. It continues to the right, or Northwest, and finally is to the furthest right on June 21." [ref=f44e105]
                    - generic [ref=f44e106]:
