                      - 'link "Accessible description of Figure \\(\\PageIndex{8}\\)" [ref=f339e107]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.8_Gas_Jets
                      - text: .
                  - paragraph [ref=f339e108]: "On occasion, the jets of high-speed particles streaming away from the protostar collide with a somewhat-denser lump of gas nearby, excite its atoms, and cause them to emit light. Herbig-Haro (HH) objects allow us to trace the progress of the jet to a distance of a light-year or more from the star that produced it. Figure \\(\\PageIndex{9}\\) includes two spectacular images of HH objects. These Hubble Space Telescope images include jets flowing outward from newly formed stars. In the HH47 image, a protostar 1500 light-years away, invisible inside a dust disk at the left edge of the image, produces a very complicated jet. The star may actually be wobbling, perhaps because it has a companion. Light from the star illuminates the white region at the left because light can emerge perpendicular to the disk, along with the jet. At right, the jet is plowing into existing clumps of interstellar gas, producing a shock wave that resembles an arrowhead. The image of HH1 and HH2 includes a double-beam jet emanating from a protostar, hidden in a dust disk in the center, in the constellation of Orion. These jets are more than 1 light-year long. The bright regions are places where the jet is a slamming into a clump of interstellar gas and causing it to glow."
                  - figure [ref=f339e109]:
                    - img "Herbig Haro object 1,2, and 47. Details in caption." [ref=f339e110]
                    - generic [ref=f339e111]:
                      - text: "Figure \\(\\PageIndex{9}\\): Jets of gas up to 1 light year long flow from Herbig Haro objects 47, 1, and 2. ("
                      - link "CC BY" [ref=f339e112]:
