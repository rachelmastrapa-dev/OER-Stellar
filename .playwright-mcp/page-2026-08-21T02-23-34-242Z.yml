                  - paragraph [ref=f339e124]: This description of a protostar surrounded by a rotating disk of gas and dust sounds very much like what happened in the Solar System when the Sun and planets formed. Indeed, one of the most important discoveries from the study of star formation in the last decade of the twentieth century was that disks are an inevitable byproduct of the process of creating stars.
                  - paragraph [ref=f339e125]: To keep things simple, we have described the formation of single stars. Many stars, however, are members of binary or triple systems, where several stars are born together. In this case, the stars form in nearly the same way. Widely separated binaries may each have their own disk; close binaries may share a single disk.
