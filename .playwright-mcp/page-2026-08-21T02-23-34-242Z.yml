                      - text: .
                  - paragraph [ref=f339e116]: "The wind from a forming star will ultimately sweep away the material that remains in the obscuring envelope of dust and gas, leaving behind the disk and protostar, which can then be seen with visible light. We should note that at this point, the protostar itself is still contracting slowly and has not yet reached the main-sequence stage on the H–R diagram. The disk can be detected directly when observed at infrared wavelengths or when it is seen silhouetted against a bright background Figure \\(\\PageIndex{10}\\). These Hubble Space Telescope infrared images include disks around young stars in the constellation of Taurus, in a region about 450 light-years away. In some cases, the stars are visible. In other cases, the dark, horizontal bands indicate regions where the dust disk is so thick that even infrared radiation from the star embedded within it cannot make its way through. The brightly glowing regions are starlight reflected from the upper and lower surfaces of the disk, which are less dense than the central, dark regions."
                  - figure [ref=f339e117]:
                    - img "Protostars with disks. Details in caption." [ref=f339e118]
                    - generic [ref=f339e119]:
                      - text: "Figure \\(\\PageIndex{10}\\): Disks around Protostars. Images of multiple protostars demonstrate that as stars form, they are surrounded by a disk of gas and dust. ("
