                  - heading "Star Formation" [level=2] [ref=f339e2]
                  - paragraph [ref=f339e3]:
                    - text: "There are specific terms in biology, which deal with life: birth, growing up, getting old, death, and even evolution. For the sake of convenience and familiarity, astronomers use similar terminology when dealing with stars. Note that stars are not alive!"
                    - strong [ref=f339e4]
                    - text: "These are simply terms of familiarity. As we begin our exploration of how stars are formed, let’s review some basics about stars discussed in earlier chapters:"
                  - list [ref=f339e5]:
                    - listitem [ref=f339e6]: Main-sequence stars such as our Sun maintain equilibrium by producing energy through nuclear fusion in their cores. The ability to generate energy by fusion defines a star.
                    - listitem [ref=f339e7]: Each second in the Sun, approximately 600 million tons of hydrogen undergo fusion into helium, with about 4 million tons turning into energy in the process. This rate of hydrogen use means that eventually the Sun, and all other stars, will run out of central fuel.
                    - listitem [ref=f339e8]:
                      - text: Stars come with many different masses, ranging from 1/12
                      - generic [ref=f339e9]:
                        - text: M
                        - subscript [ref=f339e10]: Sun
                      - text: to roughly 100–200
                      - generic [ref=f339e11]:
                        - text: M
                        - subscript [ref=f339e12]: Sun
                      - text: . There are far more low-mass than high-mass stars.
                    - listitem [ref=f339e13]: The most massive main-sequence stars, spectral type O, are also the most luminous and have the highest surface temperature. The lowest-mass stars on the main sequence, spectral type M or L, are the least luminous and the coolest.
                    - listitem [ref=f339e14]: A galaxy of stars such as the Milky Way contains enormous amounts of gas and dust, enough to make billions of stars like the Sun.
                  - paragraph [ref=f339e15]: If we want to find stars still in the process of formation, we must look in places that have plenty of the raw material from which stars are assembled. Since stars are made of gas, we focus our attention on the dense and cold clouds of gas and dust that dot the Milky Way .
                  - 'heading "Molecular Clouds: Stellar Nurseries" [level=3] [ref=f339e16]'
                  - paragraph [ref=f339e17]:
                    - text: The most massive reservoirs of interstellar matter are
                    - strong [ref=f339e18]:
                      - link "molecular clouds" [ref=f339e19]:
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.05:_Key_Terms#molecular cloud
                    - text: . These clouds have cold interiors with characteristic temperatures of only 10–20 K Most of their gas atoms are bound into molecules. These clouds turn out to be the birthplaces of most stars in our Galaxy.
                  - paragraph [ref=f339e20]:
                    - text: The masses of molecular clouds range from a thousand times the mass of the Sun to about 3 million solar masses, or
                    - generic [ref=f339e21]:
                      - text: M
                      - subscript [ref=f339e22]: Sun
                    - text: ". Molecular clouds have a complex filamentary structure, similar to cirrus clouds in Earth’s atmosphere, but much less dense. The molecular cloud filaments can be up to 1000 light-years long. Within the clouds are cold, dense regions called clumps, with typical masses of 50 to 500 times the mass of the Sun. Within these clumps, there are even denser, smaller regions called cores. The cores are the embryos of stars. The conditions in cores, low temperature and high density, are just what is required to make stars. Remember that the essence of the life story of any star is the ongoing competition between two forces: gravity and pressure. The force of gravity, pulling inward, tries to make a star collapse. Internal pressure produced by the motions of the gas atoms, pushing outward, tries to force the star to expand. When a star is first forming, low temperature and low pressure and high density both work to give gravity the advantage. In order to form a star, we need a typical core of interstellar atoms and molecules to shrink in radius and increase in density by a factor of nearly 10"
                    - superscript [ref=f339e23]: "20"
                    - text: .
                  - figure [ref=f339e24]:
                    - img "The Eagle Nebula (M16). Details in Caption." [ref=f339e25]
                    - generic [ref=f339e26]:
                      - text: "Figure \\(\\PageIndex{1}\\): Dust and Dense Globules in M16. These Hubble Space Telescope images of M16, the Eagle Nebula, includes huge columns of cool gas and dust. The very dense globules contain areas where stars are forming. ("
                      - link "CC BY" [ref=f339e27]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f339e28]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f339e29]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{1}\\)" [ref=f339e30]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.1_Dust_and_Dense_Globules_in_M16
                      - text: .
                  - paragraph [ref=f339e31]: "Figure \\(\\PageIndex{1}\\) includes two Hubble Space Telescope images of M16, the Eagle Nebula. In image a there are huge columns of cool gas and dust that are of higher density than the surrounding regions. The tallest pillar is about 1 light-year long, and the M16 region is about 7000 light-years away from us. Image b is a close-up view of one of the pillars with some very dense globules, many of which harbor embryonic stars. Astronomers coined the term evaporating gas globules (EGGs) for these structures, in part so that they could say we found EGGs inside the Eagle Nebula."
                  - heading "The Orion Molecular Cloud" [level=3] [ref=f339e32]
                  - paragraph [ref=f339e33]: "One of the best-studied stellar nurseries is in the constellation of Orion, The Hunter, about 1500 light-years away, Figure \\(\\PageIndex{2}\\). In image a, the pattern of the hunter is a roughly human figure with a “belt” of three stars that mark his waist. The Horsehead Nebula is near the leftmost star of Orion's belt. The ancients imagined a sword hanging from the belt. The object near the end of this sword is the Orion Nebula."
                  - figure [ref=f339e34]:
                    - img "Orion in visible and infrared light. Details in Caption." [ref=f339e35]
                    - generic [ref=f339e36]:
                      - text: "Figure \\(\\PageIndex{2}\\): Orion is an asterism named after the hunter in Greek mythology. The infrared image demonstrates the large size of the Orion molecular cloud, including dense regions near Orion's belt and sword. ("
                      - link "CC BY" [ref=f339e37]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f339e38]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f339e39]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{2}\\)" [ref=f339e40]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.2_Orion_in_Visible_and_Infrared
                      - text: .
                  - paragraph [ref=f339e41]: "The Orion molecular cloud is much larger than the star pattern and is truly an impressive structure. In its long dimension, it stretches over a distance of about 100 light-years. The total quantity of molecular gas is about 200,000 times the mass of the Sun. Most of the cloud does not glow with visible light but betrays its presence by the radiation that the dusty gas gives off at infrared and radio wavelengths. In Figure \\(\\PageIndex{2}\\), image b is an infrared view of the same area in Image a collected by the Infrared Astronomical Satellite. Heated dust clouds dominate in this false-color image, and many of the stars in image a are now invisible. An exception is the cool, red-giant star Betelgeuse, which is a yellowish point near Orion’s left armpit. The large, yellow ring to the right of Betelgeuse is the remnant of an exploded star. The infrared image lets us see how large and full of cooler material the Orion molecular cloud really is. The Horsehead and Orion nebulae are much larger and brighter in the infrared image compared to the visible image."
                  - paragraph [ref=f339e42]: "The stars in Orion’s belt are typically about 5 million years old, whereas the stars near the middle of the “sword” hanging from Orion’s belt are only 300,000 to 1 million years old. The Orion Nebula, at the end of the sword, is where star formation is still taking place. About 2200 young stars are found in this region, which is only slightly larger than a dozen light-years in diameter. In Figure \\(\\PageIndex{3}\\), image a is the Orion Nebula in visible light. In image b, with near-infrared radiation, astronomers detect more detail within the dusty nebula and more than 2000 stars."
                  - figure [ref=f339e43]:
                    - img "Orion Nebula in visible and infrared. Details in Caption." [ref=f339e44]
                    - generic [ref=f339e45]:
                      - text: "Figure \\(\\PageIndex{3}\\): The visible light in Image (a) of the Orion nebula reveals its structure, but infrared light in Image (b) can reveal significantly more details. ("
                      - link "CC BY" [ref=f339e46]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f339e47]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f339e48]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{3}\\)" [ref=f339e49]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.3_Orion_Nebula
                      - text: .
                  - paragraph [ref=f339e50]: "The Orion Nebula also contains a tight cluster of stars called the Trapezium. The Trapezium cluster includes four very bright stars that provide much of the energy that causes the nebula to glow so brightly. In Figure \\(\\PageIndex{4}\\), image a is a visible light image of the four bright stars of Trapezium. In image b, infrared light reveals many more stars which are completely hidden by dust in the visible image. Studies of Orion and other star-forming regions show that star formation is not a very efficient process. In the region of the Orion Nebula, about 1% of the material in the cloud has been turned into stars. That is why we still see a substantial amount of gas and dust near the Trapezium stars. The leftover material is eventually heated, either by the radiation and winds from the hot stars that form or by explosions of the most massive stars."
                  - figure [ref=f339e51]:
                    - img "Trapezium star cluster. Details in Caption." [ref=f339e52]
                    - generic [ref=f339e53]:
                      - text: "Figure \\(\\PageIndex{4}\\): The four stars in the visible image (a) make up the Trapezium cluster. The same image in the infrared reveals many more stars surrounding Trapezium. ("
                      - link "CC BY" [ref=f339e54]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f339e55]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f339e56]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{4}\\)" [ref=f339e57]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.4_Trapezium_Star_Cluster
                      - text: .
                  - paragraph [ref=f339e58]: "Whether gently or explosively, the material in the neighborhood of the new stars is blown away into interstellar space. Older groups or clusters of stars can now be easily observed in visible light because they are no longer shrouded in dust and gas. In Figure \\(\\PageIndex{5}\\), the young cluster of stars known as Westerlund 2, which formed within the Carina star-forming region about 2 million years ago. Stellar winds and pressure produced by the radiation from the hot stars within the cluster are blowing and sculpting the surrounding gas and dust. The nebula still contains many globules of dust. Stars are continuing to form within the denser globules and pillars of the nebula. This Hubble Space Telescope image includes near-infrared exposures of the star cluster and visible-light observations of the surrounding nebula. Colors in the nebula are dominated by the red glow of hydrogen gas, and blue-green emissions from glowing oxygen."
                  - figure [ref=f339e59]:
                    - img "Young stars in Westerland 2. Details in caption." [ref=f339e60]
                    - generic [ref=f339e61]:
                      - text: "Figure \\(\\PageIndex{5}\\): This Hubble image includes new stars in Westerlund 2 that are no longer surrounded by dust. ("
                      - link "CC BY" [ref=f339e62]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f339e63]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f339e64]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{5}\\)" [ref=f339e65]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.5_Westerlund_2
                      - text: .
                  - paragraph [ref=f339e66]: "Although we do not know what initially caused stars to begin forming in Orion, there is good evidence that the first generation of stars triggered the formation of additional stars, which in turn led to the formation of still more stars, as depicted in Figure \\(\\PageIndex{5}\\). Star formation can move progressively through a molecular cloud. The oldest group of stars lies to the left of the diagram and has expanded because of the motions of individual stars. Eventually, the stars in the group will disperse and no longer be recognizable as a cluster. The youngest group of stars lies to the right, next to the molecular cloud. This group of stars is only 1 to 2 million years old. The pressure of the hot, ionized gas surrounding these stars compresses the material in the nearby edge of the molecular cloud and initiates the gravitational collapse that will lead to the formation of more stars."
                  - figure [ref=f339e67]:
                    - img "Star formation creates other new stars. Details in caption." [ref=f339e68]
                    - generic [ref=f339e69]:
                      - text: "Figure \\(\\PageIndex{6}\\): Propagating Star Formation. As new stars form, they are surrounded by hot, ionized gases that compress regions of the molecular cloud leading to the formation of more stars. ("
                      - link "CC BY" [ref=f339e70]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f339e71]:
