                      - text: .
                  - paragraph [ref=f339e89]: "The natural turbulence inside a clump tends to give any portion of it some initial spinning motion. As a result, each collapsing core is expected to spin. According to the law of conservation of angular momentum, a rotating body spins more rapidly as it decreases in size. In other words, if the object can turn its material around a smaller circle, it can move that material more quickly, like a figure skater spinning more rapidly as she brings her arms in tight to her body. This is exactly what happens when a core contracts to form a protostar: as it shrinks, its rate of spin increases."
                  - paragraph [ref=f339e90]:
                    - text: "But all directions on a spinning sphere are not created equal. As the protostar rotates, it is much easier for material to fall onto the poles, which spin most slowly, than onto the equator, where material moves around most rapidly. Therefore, gas and dust near the protostar’s equator do not fall into the star due to the rotation and form an extended disk around the equator, Figure \\(\\PageIndex{7}\\) part (b). However, gas and dust can fall onto the protostar easily from directions away from the star’s equator. At the same time,"
                    - strong [ref=f339e91]:
                      - link "stellar winds" [ref=f339e92]:
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.05:_Key_Terms#stellar wind
                    - text: "break out but are confined by the disk to flow out along the two poles of the star, Figure \\(\\PageIndex{7}\\) part (c)."
                  - paragraph [ref=f339e93]:
                    - text: "The protostar and disk at this stage are embedded in an envelope of dust and gas from which material is still falling onto the protostar. This dusty envelope blocks visible light, but infrared radiation can get through. As a result, in this phase of its evolution, the protostar itself is emitting infrared radiation and so is observable only in the infrared region of the spectrum. Once almost all of the available material has been accreted and the central protostar has reached nearly its final mass, it is given a special name: it is called a"
                    - strong [ref=f339e94]: T Tauri star
                    - text: ", named after one of the best studied and brightest members of this class of stars, which was discovered in the constellation of Taurus. (Only stars with masses less than or similar to the mass of the Sun become T Tauri stars. Massive stars do not go through this stage, although they do appear to follow the formation scenario of smaller stars."
                  - paragraph [ref=f339e95]: "Eventually, wind sweeps away the cloud material and halts the accumulation of additional material, and a newly formed star, surrounded by a disk, becomes observable, as in Figure \\(\\PageIndex{7}\\) part (d). These sketches are not drawn to the same scale. The typical diameter of the disk around a new star is about 100 AU or slightly larger than the diameter of the orbit of Pluto."
                  - heading "Winds and Jets" [level=2] [ref=f339e96]
                  - paragraph [ref=f339e97]: Recent observations suggest that T Tauri stars may actually be stars in a middle stage between protostars and hydrogen-fusing stars such as the Sun. High-resolution infrared images have revealed jets of material as well as stellar winds coming from some T Tauri stars, proof of interaction with their environment. The stellar wind consists mainly of protons, or hydrogen nuclei, and electrons streaming away from the star at speeds of a few hundred kilometers per second. When the wind first starts up, the disk of material around the star’s equator blocks the wind in its direction. Where the wind particles can escape most effectively is in the direction of the star’s poles.
                  - paragraph [ref=f339e98]:
                    - text: "Astronomers have actually seen evidence of these beams of particles shooting out in opposite directions from the polar regions of newly formed stars. In many cases, these beams point back to the location of a protostar that is still so completely shrouded in dust that we cannot yet see it. Figure \\(\\PageIndex{8}\\) includes images of HH 34 a"
                    - strong [ref=f339e99]:
                      - link "Herbig-Haro (HH) object" [ref=f339e100]:
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.05:_Key_Terms#Herbig-Haro (HH) object
                    - text: ". The star is about 450 light-years away and only about 1 million years old. Light from the star itself is blocked by a disk, which is larger than 60 billion kilometers in diameter and is almost edge-on as observed from Earth. Jets emerge perpendicular to the disk. The material in these jets is flowing outward at speeds up to 580,000 kilometers per hour. The series of three images shows changes during a period of 5 years. Every few months, a compact clump of gas is ejected, and its motion outward can be followed. The changes in the brightness of the disk may be due to motions of clouds within the disk that alternately block some of the light and then let it through. This image corresponds to the stage in the life of a protostar shown in part (c) of Figure \\(\\PageIndex{7}\\)."
                  - figure [ref=f339e101]:
                    - img "Gas jets flowing from HH 34. Details in caption." [ref=f339e102]
                    - generic [ref=f339e103]:
                      - text: "Figure \\(\\PageIndex{8}\\): Gas Jets. Gas jets flowing out of HH34 from 1995 to 2000. ("
                      - link "CC BY" [ref=f339e104]:
