                      - 'link "Accessible description of Figure \\(\\PageIndex{6}\\)" [ref=f339e73]':
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.06:_Accessible_Descriptions#Figure_11.1.6_Propagating_Star_Formation
                      - text: .
                  - paragraph [ref=f339e74]: "The basic idea of triggered star formation is this: when a massive star is formed, it emits a large amount of ultraviolet radiation and ejects high-speed gas in the form of a stellar wind. This injection of energy heats the gas around the stars and causes it to expand. When massive stars exhaust their supply of fuel, they explode, and the energy of the explosion also heats the gas. The hot gases pile into the surrounding cold molecular cloud, compressing the material in it and increasing its density. If this increase in density is large enough, gravity will overcome pressure, and stars will begin to form in the compressed gas. Such a chain reaction, where the brightest and hottest stars of one area become the cause of star formation “next door,” seems to have occurred not only in Orion but also in many other molecular clouds."
                  - paragraph [ref=f339e75]: There are many molecular clouds that form mostly low-mass stars. Because low-mass stars do not have strong winds and do not die by exploding, triggered star formation cannot occur in these clouds. There are also stars that form in relative isolation in small cores. Therefore, not all star formation is originally triggered by the death of massive stars. However, there are likely to be other possible triggers, such as spiral density waves and other processes we do not yet understand.
                  - heading "The Birth of a Star" [level=2] [ref=f339e76]
                  - paragraph [ref=f339e77]: So how are stars ‘born’? That is, what are the steps to a stellar birth? First, hydrogen, helium, and dust, the interstellar medium has to accumulate. The interstellar medium starts to collapse due to gravity; these various atoms and dust particles attract each other, forming larger and larger clumps, attracting more gas and dust. As the interstellar medium collapses, the density, pressure, and temperature within the interstellar medium increase. As the density increases, more particles are striking each other, generating more energy and heat.
                  - paragraph [ref=f339e78]: Although regions such as Orion give us clues about how star formation begins, the subsequent stages are still shrouded in mystery. There is an enormous difference between the density of a molecular cloud core and the density of the youngest stars that can be detected. Direct observations of this collapse to higher density are nearly impossible for two reasons. First, the dust-shrouded interiors of molecular clouds where stellar births take place cannot be observed with visible light. Second, the timescale for the initial collapse, thousands of years, is very short, astronomically speaking. Since each star spends such a tiny fraction of its life in this stage, relatively few stars are going through the collapse process at any given time. Nevertheless, through a combination of theoretical calculations and the limited observations available, astronomers have pieced together a picture of what the earliest stages of stellar evolution are likely to be.
                  - paragraph [ref=f339e79]:
                    - text: "The first step in the process of creating stars is the formation of dense cores within a clump of gas and dust, Figure \\(\\PageIndex{7}\\). It is generally thought that all the material for the star comes from the core. Part (a) of Figure \\(\\PageIndex{7}\\) is a core that is 5000 AU across. Part b is when the gravitational force of the infalling gas becomes strong enough to overwhelm the pressure exerted by the cold material that forms the dense cores. The material then undergoes a rapid collapse, and the density of the core increases greatly as a result. During the time a dense core is contracting to become a true star, but before the fusion of protons to produce helium begins, we call the object a"
                    - strong [ref=f339e80]:
                      - link "protostar" [ref=f339e81]:
                        - /url: /Workbench/De_Anza_-_ASTR10/11:_Star_Formation/11.05:_Key_Terms#protostar
                    - text: .
                  - figure [ref=f339e82]:
                    - img "Four phases of star formation. Details in caption." [ref=f339e83]
                    - generic [ref=f339e84]:
                      - text: "Figure \\(\\PageIndex{7}\\): Formation of a Star. This diagram demonstrates the four stages of star formation. ("
                      - link "CC BY" [ref=f339e85]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
