        - generic [ref=f387e95]:
          - heading "Introduction" [level=2] [ref=f387e96]
          - paragraph [ref=f387e97]: In this chapter we will discuss the end-states of stars. Just as the length of a stars life is dependent on the stars initial mass, what are star looks like at the end of its life also depends on mass. Almost all stars end in a bang, but the size of the explosion also depends on its initial mass, but also whether it has on or more companion stars.
