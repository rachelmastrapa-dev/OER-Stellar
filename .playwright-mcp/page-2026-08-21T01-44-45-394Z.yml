            - application "Rich Text Editor, editarea" [ref=f99e255]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f99e269]: "<h2>Introduction</h2> <p>How do you collect a sample of a star? An astronomer can't scoop up a piece of a star and take it to a lab to learn its composition. They also can't measure the rotation or motion of a star using the same procedures that we measure the motion of a car or airplane due to their extreme distance. Instead, astronomers rely on different measurements by analyzing the light of the star. By analyzing the color of a star, astronomers can calculate its temperature. The next step in light analysis is to break the light into smaller pieces by wavelength, producing a spectrum. The analysis of spectra and the information derived from them is the focus of this chapter.</p> <section class=\"box-objectives\"> <h5 class=\"box-legend lt-phys-64679\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <p class=\"lt-phys-64679\">By the end of this section, you will be able to:</p> <dl> </dl> <ul> <li class=\"lt-phys-64679\">Describe the structure of atoms and the components of nuclei</li> <li class=\"lt-chem-414605\">Define the atomic mass unit</li> <li class=\"lt-phys-64680\">Explain how emission line spectra and absorption line spectra are formed</li> <li class=\"lt-phys-64680\">Explain how spectral lines and ionization levels in a gas can help us determine its temperature</li> <li class=\"lt-phys-64678\">Explain how astronomers learn the composition of a gas by examining its spectral lines</li> <li class=\"lt-phys-64759\">Describe how astronomers use spectral classes to characterize stars</li> <li class=\"lt-phys-64760\">List the stellar properties that astronomers can learn about a star by studying its spectrum</li> <li class=\"lt-phys-64760\">Describe the proper motion of a star and how it relates to a star’s space velocity</li> </ul> </section> <p>{{template.ShowOrg()}}</p> <p><strong>Thumbnail</strong>: The spectrum of the Sun, discussed in detail in <a href=\"/Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.03:_Spectral_Lines#Analysis_of_the_Solar_Spectrum\" target=\"_blank\" title=\"4.3: Spectral Lines\">Spectral Lines</a>. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://kpno.noirlab.edu/\" target=\"_blank\" title=\"N.A. Sharp/KPNO/NOIRLab/NSO/NSF/AURA\">N.A. Sharp/KPNO/NOIRLab/NSO/NSF/AURA</a> via <a href=\"https://commons.wikimedia.org/wiki/File:High_resolution_solar_spectrum_(noao-sun).jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>). &nbsp;</p>"
