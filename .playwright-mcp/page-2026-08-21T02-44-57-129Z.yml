            - application "Rich Text Editor, editarea" [ref=f460e322]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f460e336]: "<h2>Weighing the Galaxy</h2> <p class=\"lt-phys-64818\">Just like the Earth and the Sun, it is not possible to put the galaxy on a scale to measure its mass. Astronomers could estimate the mass by counting the number of stars in the galaxy and multiplying that by the average mass in a star. However, there are too many stars to count, and that would not include the dust and gas. Even if astronomers could weigh all of the stars and gas, that would only be the mass of all of the normal matter in the galaxy. When we described the sections of the Milky Way, we said that the stars are now known to be surrounded by a much larger halo of invisible matter. Let's see how this surprising discovery was made.</p> <h3 class=\"lt-phys-64818\">Estimating the Galaxy's Mass</h3> <p class=\"lt-phys-64818\">The Sun, like all the other stars in the Galaxy, orbits the center of the Milky Way. Our star's orbit is nearly circular and lies in the Galaxy's disk. The speed of the Sun in its orbit is about 200 kilometers per second, which means it takes us approximately 225 million years to go once around the center of the Galaxy. We call the period of the Sun's revolution the galactic year. It is a long time compared to human time scales. During the entire lifetime of Earth, only about 20 galactic years have passed. This means that we have gone only a tiny fraction of the way around the Galaxy in all the time that humans have gazed into the sky.</p> <p class=\"lt-phys-64818\">We can use the information about the Sun's orbit to estimate the mass of the Galaxy, just as we could weigh the Sun by monitoring the orbit of a planet around it. Let's assume that the Sun's orbit is circular and that the Galaxy is roughly spherical. We know the Galaxy is shaped more like a disk, but to simplify the calculation we will make this assumption to simplify the calculation. If you have matter distributed in the shape of a sphere, then you can calculate the pull of gravity on some object just outside that sphere by assuming that gravity acts as if all the matter were concentrated at a point in the center of the sphere. For our calculation, we can assume that all the mass that lies inward of the Sun's position is concentrated at the center of the Galaxy, and that the Sun orbits that point from a distance of about 26,000 light-years. Plugging numbers into Kepler's third law, we can calculate the sum of the masses of the Galaxy and the Sun. The results is the mass of the galaxy is about 100 billion times the mass of the Sun. More sophisticated calculations based on more sophisticated models give a similar result.</p> <p class=\"lt-phys-64818\">Our estimate tells us how much mass is contained in the volume inside the Sun's orbit. This is a good estimate for the total mass of the Galaxy only if hardly any mass lies outside the Sun's orbit. For many years astronomers thought this assumption was reasonable. The number of bright stars and the amount of luminous matter, or any material from which we can detect electromagnetic radiation, both drop off dramatically at distances of more than about 30,000 light-years from the galactic center.</p> <h3 class=\"lt-phys-64818\">Invisible Matter</h3> <p class=\"lt-phys-64818\">In science, what seems to be a reasonable assumption can later turn out to be wrong which is why we continue to do observations and experiments at every opportunity. While there is relatively little luminous matter beyond 30,000 light-years, we now know that a lot of invisible matter exists at great distances from the galactic center.</p> <p class=\"lt-phys-64818\">We can understand how astronomers detected this invisible matter by remembering that according to Kepler's third law, objects orbiting at large distances from a massive object will move more slowly than objects that are closer to that central mass. There are a few objects, including globular clusters and some nearby small satellite galaxies, that lie well outside the luminous boundary of the Milky Way. If most of the mass of our Galaxy were concentrated within the luminous region, then these very distant objects should travel around their galactic orbits at lower speeds than the Sun does. However, the few objects seen at large distances from the luminous boundary of the Milky Way Galaxy are not moving more slowly than the Sun. There are some globular clusters and RR Lyrae stars between 30,000 and 150,000 light-years from the center of the Galaxy, and their orbital velocities are even greater than the Sun's.</p> <p>Figure \\(\\PageIndex{1}\\) plots the orbital speed of carbon monoxide (CO) and hydrogen (H) gas at different distances from the center of the Milky Way Galaxy in red. Model calculations of what the rotation curve would look like if all the matter in the Galaxy were located inside a radius of 50,000 light-years is the blue line. The model predicts that the speed of objects would decrease with distance from the galactic center. The data says that objects orbiting the galaxy remains the same and even increases their speed with distance, starting at a distance of about 15 kiloparsecs. A kiloparsec equals 3,260 light-years, so that is about 49,000 light years.</p> <figure><img alt=\"Milky Way rotation curve vs. enclosed-mass prediction. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46199/3a003c0f13392801c21caa6c87873c5549057e38\" /> <figcaption>Figure \\(\\PageIndex{1}\\): The observed rotation curve, in red, stays flat or rises with distance from the galactic center, rather than declining as the blue, model predicted curve would suggest if most of the Galaxy's mass were concentrated within the inner 10 kpc, providing evidence for dark matter extending well beyond the Sun's orbit. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.3.1_Rotation_Curve_of_the_Galaxy\" target=\"_blank\" title=\"15.9: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64818\">Objects must orbit a source of gravity at a specific velocity if they are not going to fall in because they move too slowly or escape because they move too fast. If the Milky Way had only the mass calculated by Kepler's third law, then the high-speed outer objects should long ago have escaped. This means that our galaxy must have more gravity than can be supplied by the luminous matter. The high speed of these outer objects tells us that the source of this extra gravity must extend outward from the center far beyond the Sun's orbit and that there must be a lot of it. If the gravity were supplied by stars or by something else that gives off radiation, we should have spotted this additional outer material long ago. We are therefore forced to the reluctant conclusion that this matter is invisible and has, except for its gravitational pull, gone entirely undetected.</p> <p class=\"lt-phys-64818\">Studies of the motions of the most remote globular clusters and the small galaxies that orbit our own show that the total mass of the Milky Way is at least 2 x 10<sup>12</sup> M<sub>Sun</sub>, which is about twenty times greater than the amount of luminous matter. Also, the dark matter extends to a distance of at least 200,000 light-years from the center of the Galaxy. Observations indicate that this dark matter halo is almost but not quite spherical.</p> <h3>Identifying Dark Matter</h3> <p class=\"lt-phys-64818\">As scientists, the next thing to do is to identify dark matter. Let's look at a list of possibilities from our study of astronomy so far. Since this matter is invisible, it clearly cannot be in the form of ordinary stars. And it cannot be gas in any form. If it were neutral hydrogen gas, its 21-cm wavelength spectral-line emission would have been detected as radio waves. If it were ionized hydrogen, it should be hot enough to emit visible radiation. If a lot of hydrogen atoms out there had combined into hydrogen molecules, these should produce dark features in the ultraviolet spectra of objects lying beyond the Galaxy, but such features have not been seen. Nor can the dark matter consist of interstellar dust, since in the required quantities, the dust would significantly obscure the light from distant galaxies.</p> <p class=\"lt-phys-64818\">What are our other possibilities? The dark matter cannot be a huge number of black holes or old neutron stars, since interstellar matter falling onto such objects would produce more X-rays than are observed. Also, recall that the formation of black holes and neutron stars is preceded by a substantial amount of mass loss, which scatters heavy elements into space to be incorporated into subsequent generations of stars. If the dark matter consisted of an enormous number of any of those objects, they would have blown off and recycled a lot of heavier elements over the history of the Galaxy. In that case, the young stars we observe in our Galaxy today would contain much greater abundances of heavy elements than they actually do.</p> <p class=\"lt-phys-64818\">Brown dwarfs and lone Jupiter-like planets have also been ruled out. First of all, there would have to be an enormous number of them to make up so much dark matter. But we have a more direct test of whether so many low-mass objects could actually be lurking out there. The general theory of relativity predicts that the path traveled by light is changed when it passes near a concentration of mass. It turns out that when the two objects appear close enough together in the sky, the mass closer to us can bend the light from farther away. With just the right alignment, the image of the more distant object also becomes significantly brighter. By looking for the temporary brightening that occurs when a dark matter object in our own Galaxy moves across the path traveled by light from stars in the Magellanic Clouds, astronomers have now shown that the dark matter cannot be made up of a lot of small objects with masses between one-millionth and one-tenth the mass of the Sun.</p> <p class=\"lt-phys-64818\">What's left? One possibility is that the dark matter is composed of exotic subatomic particles of a type not yet detected on Earth. Very sophisticated experiments are now under way to look for such particles. Stay tuned to see whether anything like that turns up. We should add that the problem of dark matter is by no means confined to the Milky Way. Observations show that dark matter must also be present in other galaxies whose outer regions also have flat rotation curves. Dark matter also exists in great clusters of galaxies whose members are now known to move around under the influence of far more gravity than can be accounted for by luminous matter alone. The discovery of dark matter has changed the make-up of the universe. Astronomers once thought that the universe was made of luminous matter. We now know that perhaps as much as 95% of the mass in our galaxy is dark matter. Understanding the nature of this dark matter is one of the great challenges of astronomy today.</p> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: </span></h5> <p>You can use the <a href=\"https://foothillastrosims.github.io/dark-matter/\" rel=\"noopener nofollow\" target=\"_blank\" title=\"https://foothillastrosims.github.io/dark-matter/\">Dark Matter Simulator</a> to explore the distribution of invisible dark matter in our galaxy. Use the controls in the upper right to. You can change the amount of dark matter at different distances from the center of the galaxy and compare the orbital speeds in your simulated galaxy with orbital speeds measured in the Milky Way.</p> </section>"
