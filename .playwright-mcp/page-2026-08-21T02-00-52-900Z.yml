                  - generic [ref=f207e2]:
                    - heading "Learning Objectives" [level=5] [ref=f207e3]
                    - paragraph [ref=f207e5]: "By the end of this section, you will be able to:"
                    - list [ref=f207e6]:
                      - listitem [ref=f207e7]: Identify different forms of energy
                      - listitem [ref=f207e8]: Understand the law of conservation of energy
                      - listitem [ref=f207e9]: Explain ways that energy can be transformed
                  - paragraph [ref=f207e10]: "Energy is a challenging concept to grasp because it exists in so many different forms that it defies any single simple explanation. In many ways, comprehending energy is like comprehending wealth: There are very different forms of wealth and they follow different rules, depending on if they are the stock market, real estate, a collection of old comic books, great piles of cash, or one of the many other ways to make and lose money. It is easier to discuss one or two forms of wealth—or energy—than to discuss that concept in general."
                  - paragraph [ref=f207e11]:
                    - text: "When striving to understand how the Sun can put out so much energy for so long, scientists considered many different types of energy. Nineteenth-century scientists knew of two possible sources for the Sun’s energy: chemical and gravitational energy. The source of chemical energy most familiar to them was the burning (the chemical term is"
                    - emphasis [ref=f207e12]: oxidation
                    - text: ) of wood, coal, gasoline, or other fuel. We know exactly how much energy the burning of these materials can produce. We can thus calculate that even if the immense mass of the Sun consisted of a burnable material like coal or wood, our star could not produce energy at its present rate for more than few thousand years. However, we know from geologic evidence that water was present on Earth’s surface nearly 4 billion years ago, so the Sun must have been shining brightly (and making Earth warm) at least as long as that. Today, we also know that at the temperatures found in the Sun, nothing like solid wood or coal could survive.
                  - generic [ref=f207e13]:
                    - 'heading "Astronomy Basics: What’s Watt?" [level=5] [ref=f207e14]'
                    - paragraph [ref=f207e16]:
                      - text: Just a word about the units we are using. A watt (W) is a unit of
                      - emphasis [ref=f207e17]: power
                      - text: ", which is energy used or given off per unit time. It is measured in joules per second (J/s). You know from your everyday experience that it is not just"
                      - emphasis [ref=f207e18]: how much
                      - text: energy you expend, but
                      - emphasis [ref=f207e19]: how long
                      - text: you take to do it. (Burning 10 Calories in 10 minutes requires a very different kind of exercise than burning those 10 Calories in an hour.) Watts tell you the
                      - emphasis [ref=f207e20]: rate
                      - text: at which energy is being used; for example, a 100-watt bulb uses 100 joules (J) of energy every second.
                    - paragraph [ref=f207e21]: And how big is a joule? A 73-kilogram (160-pound) astronomy instructor running at about 4.4 meters per second (10 miles per hour) because he is late for class has a motion energy of about 700 joules.
                  - heading "Conservation of Energy" [level=3] [ref=f207e22]
                  - paragraph [ref=f207e23]: Other nineteenth-century attempts to determine what makes the Sun shine used the law of conservation of energy. Simply stated, this law says that energy cannot be created or destroyed, but can be transformed from one type to another, such as from heat to mechanical energy. The steam engine, which was key to the Industrial Revolution, provides a good example. In this type of engine, the hot steam from a boiler drives the movement of a piston, converting heat energy into motion energy.
                  - paragraph [ref=f207e24]: Conversely, motion can be transformed into heat. If you clap your hands vigorously at the end of an especially good astronomy lecture, your palms become hotter. If you rub ice on the surface of a table, the heat produced by friction melts the ice. The brakes on cars use friction to reduce speed, and in the process, transform motion energy into heat energy. That is why after bringing a car to a stop, the brakes can be very hot; this also explains why brakes can overheat when used carelessly while descending long mountain roads.
                  - paragraph [ref=f207e25]: In the nineteenth century, scientists thought that the source of the Sun’s heat might be the mechanical motion of meteorites falling into it. Their calculations showed, however, that in order to produce the total amount of energy emitted by the Sun, the mass in meteorites that would have to fall into the Sun every 100 years would equal the mass of Earth. The resulting increase in the Sun’s mass would, according to Kepler’s third law, change the period of Earth’s orbit by 2 seconds per year. Such a change would be easily measurable and was not, in fact, occurring. Scientists could then disprove this as the source of the Sun’s energy.
                  - heading "Gravitational Contraction as a Source of Energy" [level=3] [ref=f207e26]
                  - paragraph [ref=f207e27]: Proposing an alternative explanation, British physicist Lord Kelvin and German scientist Hermann von Helmholtz (Figure 16.2), in about the middle of the nineteenth century, proposed that the Sun might produce energy by the conversion of gravitational energy into heat. They suggested that the outer layers of the Sun might be “falling” inward because of the force of gravity. In other words, they proposed that the Sun could be shrinking in size, staying hot and bright as a result.
                  - 'figure "Figure 16.2 : Kelvin (1824–1907) and Helmholtz (1821–1894). (a) British physicist William Thomson (Lord Kelvin) and (b) German scientist Hermann von Helmholtz proposed that the contraction of the Sun under its own gravity might account for its energy. (credit a: modification of work by Wellcome Library, London; credit b: modification of work by Wellcome Library, London)" [ref=f207e28]':
                    - 'img "Left: photograph of William Thomson (Lord Kelvin). Right: photograph of Hermann von Helmholtz." [ref=f207e30]'
                  - paragraph [ref=f207e32]: To imagine what would happen if this hypothesis were true, picture the outer layer of the Sun starting to fall inward. This outer layer is a gas made up of individual atoms, all moving about in random directions. If a layer falls inward, the atoms acquire an additional speed because of falling motion. As the outer layer falls inward, it also contracts, moving the atoms closer together. Collisions become more likely, and some of them transfer the extra speed associated with the falling motion to other atoms. This, in turn, increases the speeds of those atoms. The temperature of a gas is a measure of the kinetic energy (motion) of the atoms within it; hence, the temperature of this layer of the Sun increases. Collisions also excite electrons within the atoms to higher-energy orbits. When these electrons return to their normal orbits, they emit photons, which can then escape from the Sun (see Radiation and Spectra).
                  - paragraph [ref=f207e33]: Kelvin and Helmholtz calculated that a contraction of the Sun at a rate of only about 40 meters per year would be enough to produce the amount of energy that it is now radiating. Over the span of human history, the decrease in the Sun’s size from such a slow contraction would be undetectable.
                  - paragraph [ref=f207e34]:
                    - text: If we assume that the Sun began its life as a large, diffuse cloud of gas, then we can calculate how much energy has been radiated by the Sun during its entire lifetime as it has contracted from a very large diameter to its present size. The amount of energy is on the order of 10
                    - superscript [ref=f207e35]: "42"
                    - text: joules. Since the solar luminosity is
                    - math [ref=f207e36]:
                      - generic [ref=f207e39]:
                        - generic [ref=f207e40]: "4"
                        - generic [ref=f207e41]: ×
                        - generic [ref=f207e42]:
                          - generic [ref=f207e43]: "10"
                          - generic [ref=f207e44]: "26"
                    - text: watts (joules/second) or about
                    - math [ref=f207e45]:
                      - generic [ref=f207e49]:
                        - generic [ref=f207e50]: "10"
                        - generic [ref=f207e51]: "34"
                    - text: joules per year, contraction could keep the Sun shining at its present rate for roughly 100 million years.
                  - paragraph [ref=f207e52]: In the nineteenth century, 100 million years at first seemed plenty long enough, since Earth was then widely thought to be much younger than this. But toward the end of that century and into the twentieth, geologists and physicists showed that Earth (and, hence, the Sun) is actually much older. Contraction therefore cannot be the primary source of solar energy (although, as we shall see in The Birth of Stars and the Discovery of Planets Outside the Solar System, contraction is an important source of energy for a while in stars that are just being born). Scientists were thus confronted with a puzzle of enormous proportions. Either an unknown type of energy was responsible for the most important energy source known to humanity, or estimates of the age of the solar system (and life on Earth) had to be seriously modified. Charles Darwin, whose theory of evolution required a longer time span than the theories of the Sun seemed to permit, was discouraged by these results and continued to worry about them until his death in 1882.
                  - paragraph [ref=f207e53]: It was only in the twentieth century that the true source of the Sun’s energy was identified. The two key pieces of information required to solve the puzzle were the structure of the nucleus of the atom and the fact that mass can be converted into energy.
                  - paragraph [ref=f207e54]
