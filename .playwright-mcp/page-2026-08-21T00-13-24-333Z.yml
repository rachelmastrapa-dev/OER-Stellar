                        - generic [ref=f14e9]: "108"
                      - text: Appendix
                    - text: C and Example 1.1 for more information. The second way we try to keep numbers simple is to use a consistent set of units—the metric International System of Units, or SI (from the French
                    - emphasis [ref=f14e10]: Système International d’Unités
                    - text: ). The metric system is summarized in Appendix D (see Example 1.2).
                  - generic [ref=f14e11]:
                    - heading "Link to Learning" [level=5] [ref=f14e12]
                    - paragraph [ref=f14e14]:
                      - text: Watch this
                      - link "brief PBS animation" [ref=f14e15]:
                        - /url: https://openstax.org/l/30scinotation
                      - text: that explains how scientific notation works and why it’s useful.
                  - paragraph [ref=f14e16]: A common unit astronomers use to describe distances in the universe is a light-year, which is the distance light travels during one year. Because light always travels at the same speed, and because its speed turns out to be the fastest possible speed in the universe, it makes a good standard for keeping track of distances. You might be confused because a “light-year” seems to imply that we are measuring time, but this mix-up of time and distance is common in everyday life as well. For example, when your friend asks where the movie theater is located, you might say “about 20 minutes from downtown.”
