                      - row [ref=f14e243]:
                        - cell "Silicon" [ref=f14e244]
                        - cell "Si" [ref=f14e245]
                        - cell "37" [ref=f14e246]
                      - row [ref=f14e247]:
                        - cell "Sulfur" [ref=f14e248]
                        - cell "S" [ref=f14e249]
                        - cell "19" [ref=f14e250]
                      - row [ref=f14e251]:
                        - cell "Iron" [ref=f14e252]
