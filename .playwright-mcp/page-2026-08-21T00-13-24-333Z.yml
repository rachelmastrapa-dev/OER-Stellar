                  - paragraph [ref=f14e3]:
                    - text: In astronomy we deal with distances on a scale you may never have thought about before, with numbers larger than any you may have encountered. We adopt two approaches that make dealing with astronomical numbers a little bit easier. First, we use a system for writing large and small numbers called
                    - emphasis [ref=f14e4]: scientific notation
                    - text: (or sometimes
                    - emphasis [ref=f14e5]: powers-of-ten notation
                    - text: ). This system is very appealing because it eliminates the many zeros that can seem overwhelming to the reader. In scientific notation, if you want to write a number such as 500,000,000, you express it as
                    - math
                    - generic [ref=f14e6]:
                      - generic [ref=f14e8]:
