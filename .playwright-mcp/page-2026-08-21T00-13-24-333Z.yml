                        - columnheader "Number of Atoms per Million Hydrogen Atoms" [ref=f14e213]: Number of Atoms perMillion Hydrogen Atoms
                    - rowgroup [ref=f14e214]:
                      - row [ref=f14e215]:
                        - cell "Hydrogen" [ref=f14e216]
                        - cell "H" [ref=f14e217]
                        - cell "1,000,000" [ref=f14e218]
                      - row [ref=f14e219]:
