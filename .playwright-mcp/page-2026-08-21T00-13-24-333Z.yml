                    - paragraph [ref=f14e159]: That’s almost 10,000,000,000,000 km that light covers in a year. To help you imagine how long this distance is, we’ll mention that a string 1 light-year long could fit around the circumference of Earth 236 million times.
                  - paragraph [ref=f14e160]: There is another reason the speed of light is such a natural unit of distance for astronomers. Information about the universe comes to us almost exclusively through various forms of light, and all such light travels at the speed of light—that is, 1 light-year every year. This sets a limit on how quickly we can learn about events in the universe. If a star is 100 light-years away, the light we see from it tonight left that star 100 years ago and is just now arriving in our neighborhood. The soonest we can learn about any changes in that star is 100 years after the fact. For a star 500 light-years away, the light we detect tonight left 500 years ago and is carrying 500-year-old news.
                  - paragraph [ref=f14e161]: Because many of us are accustomed to instant news from the Internet, some might find this frustrating.
                  - paragraph [ref=f14e162]: “You mean, when I see that star up there,” you ask, “I won’t know what’s actually happening there for another 500 years?”
                  - paragraph [ref=f14e163]:
                    - text: But this isn’t the most helpful way to think about the situation. For astronomers,
                    - emphasis [ref=f14e164]: now
                    - text: is when the light reaches us here on Earth. There is no way for us to know anything about that star (or other object) until its light reaches us.
                  - paragraph [ref=f14e165]: But what at first may seem a great frustration is actually a tremendous benefit in disguise. If astronomers really want to piece together what has happened in the universe since its beginning, they must find evidence about each epoch (or period of time) of the past. Where can we find evidence today about cosmic events that occurred billions of years ago?
                  - paragraph [ref=f14e166]: The delay in the arrival of light provides an answer to this question. The farther out in space we look, the longer the light has taken to get here, and the longer ago it left its place of origin. By looking billions of light-years out into space, astronomers are actually seeing billions of years into the past. In this way, we can reconstruct the history of the cosmos and get a sense of how it has evolved over time.
                  - paragraph [ref=f14e167]: This is one reason why astronomers strive to build telescopes that can collect more and more of the faint light in the universe. The more light we collect, the fainter the objects we can observe. On average, fainter objects are farther away and can, therefore, tell us about periods of time even deeper in the past. Instruments such as the Hubble Space Telescope (Figure 1.5) and the Very Large Telescope in Chile (which you will learn about in the chapter on Astronomical Instruments), are giving astronomers views of deep space and deep time better than any we have had before.
                  - 'figure "Figure 1.5 : Telescope in Orbit. The Hubble Space Telescope, shown here in orbit around Earth, is one of many astronomical instruments in space. (credit: modification of work by European Space Agency)" [ref=f14e168]':
                    - img "Image of the Hubble Space Telescope in orbit, seen against the bright surface of the Earth." [ref=f14e170]
                  - heading "The Universe on the Large Scale" [level=2] [ref=f14e172]
                  - paragraph [ref=f14e173]:
                    - text: In a very rough sense, you could think of the solar system as your house or apartment and the Galaxy as your town, made up of many houses and buildings. In the twentieth century, astronomers were able to show that, just as our world is made up of many, many towns, so the universe is made up of enormous numbers of galaxies. (We define the universe to be everything that exists that is accessible to our observations.) Galaxies stretch as far into space as our telescopes can see, many billions of them within the reach of modern instruments. When they were first discovered, some astronomers called galaxies
                    - emphasis [ref=f14e174]: island universes
                    - text: ", and the term is aptly descriptive; galaxies do look like islands of stars in the vast, dark seas of intergalactic space."
                  - paragraph [ref=f14e175]:
                    - text: The nearest galaxy, discovered in 1993, is a small one that lies 70,000 light-years from the Sun in the direction of the constellation Sagittarius, where the smog in our own Galaxy makes it especially difficult to discern. (A constellation, we should note, is one of the 88 sections into which astronomers divide the sky, each named after a prominent star pattern within it.) Beyond this Sagittarius dwarf galaxy lie two other small galaxies, about 160,000 light-years away. First recorded by Magellan’s crew as he sailed around the world, these are called the
                    - emphasis [ref=f14e176]: Magellanic Clouds
                    - text: (Figure 1.12). All three of these small galaxies are satellites of the Milky Way Galaxy, interacting with it through the force of gravity. Ultimately, all three may even be swallowed by our much larger Galaxy, as other small galaxies have been over the course of cosmic time.
                  - 'figure "Figure 1.12 : Neighbor Galaxies. This image shows both the Large Magellanic Cloud and the Small Magellanic Cloud above the telescopes of the Atacama Large Millimeter/Submillimeter Array (ALMA) in the Atacama Desert of northern Chile. (credit: ESO, C. Malin)" [ref=f14e177]':
                    - img "Image of the Atacama Large Millimeter/Submillimeter Array (ALMA) observatory at night. In the foreground are the many radio telescopes of the array. In the background above the array are two diffuse patches of light. The larger patch of light close to the horizon is the Large Magellanic Cloud. The smaller patch above and to the right is the Small Magellanic Cloud. A few stars from our Milky Way are scattered across the sky." [ref=f14e179]
                  - paragraph [ref=f14e181]:
                    - text: The nearest large galaxy is a spiral quite similar to our own, located in the constellation of Andromeda, and is thus called the Andromeda galaxy; it is also known by one of its catalog numbers, M31 (Figure 1.13). M31 is a little more than 2 million light-years away and, along with the Milky Way, is part of a small cluster of more than 50 galaxies referred to as the
                    - emphasis [ref=f14e182]: Local Group
                    - text: .
                  - 'figure "Figure 1.13 : Closest Spiral Galaxy. The Andromeda galaxy (M31) is a spiral-shaped collection of stars similar to our own Milky Way. (credit: Adam Evans)" [ref=f14e183]':
                    - img "Image of the Andromeda Galaxy. This spiral galaxy is seen almost edge-on as an oval patch of light with a very bright center (nucleus), and dark bands of dust along its outer edges." [ref=f14e185]
                  - paragraph [ref=f14e187]: At distances of 10 to 15 million light-years, we find other small galaxy groups, and then at about 50 million light-years there are more impressive systems with thousands of member galaxies. We have discovered that galaxies occur mostly in clusters, both large and small (Figure 1.14).
                  - 'figure "Figure 1.14 : Fornax Cluster of Galaxies. In this image, you can see part of a cluster of galaxies located about 60 million light-years away in the constellation of Fornax. All the objects that are not pinpoints of light in the picture are galaxies of billions of stars. (credit: ESO, J. Emerson, VISTA. Acknowledgment: Cambridge Astronomical Survey Unit)" [ref=f14e188]':
                    - img "Image of the Fornax Cluster of Galaxies. Many elliptical and spiral galaxies are scattered throughout the image." [ref=f14e190]
                  - paragraph [ref=f14e192]:
                    - text: Some of the clusters themselves form into larger groups called
                    - emphasis [ref=f14e193]: superclusters
                    - text: . The Local Group is part of a supercluster of galaxies, called the
                    - generic [ref=f14e194]: Virgo Supercluster
                    - text: ", which stretches over a diameter of 110 million light-years. We are just beginning to explore the structure of the universe at these enormous scales and are already encountering some unexpected findings."
                  - paragraph [ref=f14e195]:
                    - text: At even greater distances, where many ordinary galaxies are too dim to see, we find
                    - emphasis [ref=f14e196]: quasars
                    - text: . These are brilliant centers of galaxies, glowing with the light of an extraordinarily energetic process. The enormous energy of the quasars is produced by gas that is heated to a temperature of millions of degrees as it falls toward a massive black hole and swirls around it. The brilliance of quasars makes them the most distant beacons we can see in the dark oceans of space. They allow us to probe the universe 10 billion light-years away or more, and thus 10 billion years or more in the past.
                  - paragraph [ref=f14e197]: With quasars we can see way back close to the Big Bang explosion that marks the beginning of time. Beyond the quasars and the most distant visible galaxies, we have detected the feeble glow of the explosion itself, filling the universe and thus coming to us from all directions in space. The discovery of this “afterglow of creation” is considered to be one of the most significant events in twentieth-century science, and we are still exploring the many things it has to tell us about the earliest times of the universe.
                  - paragraph [ref=f14e198]: Measurements of the properties of galaxies and quasars in remote locations require large telescopes, sophisticated light-amplifying devices, and painstaking labor. Every clear night, at observatories around the world, astronomers and students are at work on such mysteries as the birth of new stars and the large-scale structure of the universe, fitting their results into the tapestry of our understanding.
                  - heading "Small Scale" [level=2] [ref=f14e199]
                  - heading [level=2] [ref=f14e200]
                  - paragraph [ref=f14e201]:
                    - text: The foregoing discussion has likely impressed on you that the universe is extraordinarily large and extraordinarily empty. On average, it is 10,000 times more empty than our Galaxy. Yet, as we have seen, even the Galaxy is mostly empty space. The air we breathe has about 10
                    - superscript [ref=f14e202]: "19"
                    - text: atoms in each cubic centimeter—and we usually think of air as empty space. In the interstellar gas of the Galaxy, there is about one atom in every cubic centimeter. Intergalactic space is filled so sparsely that to find one atom, on average, we must search through a cubic meter of space. Most of the universe is fantastically empty; places that are dense, such as the human body, are tremendously rare.
                  - paragraph [ref=f14e203]:
                    - text: Even our most familiar solids are mostly space. If we could take apart such a solid, piece by piece, we would eventually reach the tiny molecules from which it is formed. Molecules are the smallest particles into which any matter can be divided while still retaining its chemical properties. A molecule of water (H
                    - subscript [ref=f14e204]: "2"
                    - text: O), for example, consists of two hydrogen atoms and one oxygen atom bonded together.
                  - paragraph [ref=f14e205]: Molecules, in turn, are built of atoms, which are the smallest particles of an element that can still be identified as that element. For example, an atom of gold is the smallest possible piece of gold. Nearly 100 different kinds of atoms (elements) exist in nature. Most of them are rare, and only a handful account for more than 99% of everything with which we come in contact. The most abundant elements in the cosmos today are listed in Table 1.1; think of this table as the “greatest hits” of the universe when it comes to elements. Note that the list includes the four elements most common in life on Earth—hydrogen, carbon, nitrogen, and oxygen.
                  - table [ref=f14e206]:
                    - caption [ref=f14e207]: "Table 1.1: The Cosmically Abundant Elements"
                    - rowgroup [ref=f14e208]:
                      - row [ref=f14e209]:
                        - columnheader [ref=f14e210]:
                          - text: Element
                          - superscript [ref=f14e211]: "1"
