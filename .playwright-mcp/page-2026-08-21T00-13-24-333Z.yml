                        - cell "32" [ref=f14e254]
                  - paragraph [ref=f14e255]:
                    - text: All atoms consist of a central, positively charged nucleus surrounded by negatively charged electrons. The bulk of the matter in each atom is found in the nucleus, which consists of positive protons and electrically neutral neutrons all bound tightly together in a very small space. Each element is defined by the number of protons in its atoms. Thus, any atom with 6 protons in its nucleus is called
                    - emphasis [ref=f14e256]: carbon
                    - text: ", any with 50 protons is called"
                    - emphasis [ref=f14e257]: tin
                    - text: ", and any with 70 protons is called"
                    - emphasis [ref=f14e258]: ytterbium
                    - text: . (For a list of the elements, see Appendix K.)
                  - paragraph [ref=f14e259]: The distance from an atomic nucleus to its electrons is typically 100,000 times the size of the nucleus itself. This is why we say that even solid matter is mostly space. The typical atom is far emptier than the solar system out to Neptune. (The distance from Earth to the Sun, for example, is only 100 times the size of the Sun.) This is one reason atoms are not like miniature solar systems.
                  - paragraph [ref=f14e260]: "Remarkably, physicists have discovered that everything that happens in the universe, from the smallest atomic nucleus to the largest superclusters of galaxies, can be explained through the action of only four forces: gravity, electromagnetism (which combines the actions of electricity and magnetism), and two forces that act at the nuclear level. The fact that there are four forces (and not a million, or just one) has puzzled physicists and astronomers for many years and has led to a quest for a unified picture of nature."
                  - generic [ref=f14e261]:
                    - heading "Link to Learning" [level=5] [ref=f14e262]
