            - application "Rich Text Editor, editarea" [ref=f253e321]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f253e335]: "<h3>Science and Society - Oral Tradition and Other Stories of Variable Stars</h3> <p>This chapter has been all about how astronomers track the motion and visibility of stars over time. As you now know, these changes are extremely subtle, and sometimes take months, years, if not millennia, to demonstrate any noticeable difference in the night sky.&nbsp;</p> <p>Chapter 2 of the text discussed the methods of ancient astronomers to map the skies, along with more detail in this chapter&nbsp;about astronomers' observations of tiny motions of the stars in our sky over time.&nbsp;In addition to stars' motion, ancient astronomers also had methods for observing variable stars. How does a person document changes in a star's brightness if there is no digital telescope to measure how much light is coming in?</p> <p>In this case, it might help&nbsp;to picture yourself living on Earth in a remote location,&nbsp;before electricity had been invented. During this time, there were not many forms of entertainment after dark, and thus led to humans being very in tune with the night sky. Night after night, one could gaze up at the stars and see the exact same pattern for a lifetime. In the case of variable stars, one need only notice how the brightness of one star compares to&nbsp;those around it.&nbsp;Of course, this is simpler said than done, but the following two examples demonstrate how ancient astronomers made these measurements without telescopes or electronics.&nbsp;</p> <p>Here we will note that the two types of variable stars mentioned are NOT RR Lyrae or Cepheid variable stars. However, the concept you learned earlier in the chapter, about changing apparent magnitude, remains the same. These astronomers were observing the stars night after night, and took notice of very small changes over time.&nbsp;</p> <p>Australian Aboriginals'&nbsp;Measurements of Giant Variable Stars</p> <p>The ancient Aboriginals of Australia&nbsp;are well known as master astronomers&nbsp;</p> <p>Ancient Egyptian Measurements of Algol</p> <p>&nbsp;</p> <p>&nbsp;</p> <p>&nbsp;</p> <h3>References</h3> <p>Cepheid Variables, <a href=\"https://www.ebsco.com/research-starters/history/cepheid-variables\" rel=\"freelink\" title=\"https://www.ebsco.com/research-starters/history/cepheid-variables\">https://www.ebsco.com/research-start...heid-variables</a></p> <p><a href=\"https://theconversation.com/stars-that-vary-in-brightness-shine-in-the-oral-traditions-of-aboriginal-australians-85833\" title=\"https://theconversation.com/stars-that-vary-in-brightness-shine-in-the-oral-traditions-of-aboriginal-australians-85833\">Oral Traditions of Aboriginal Australians, Tracking Variable Stars</a>&nbsp;(CC BY ND)</p> <p><a href=\"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0144140\" title=\"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0144140\">Egyptian Discovery of Algol's Period</a>&nbsp;(<a href=\"https://journals.plos.org/plosone/s/journal-information#loc-open-access\" title=\"https://journals.plos.org/plosone/s/journal-information#loc-open-access\">Journal is CC BY</a>)</p> <p>Harvard Computers (Henrietta Leavitt) and Variable Stars</p> <figure><img alt=\"Observatory domes on a mountain ridge above a blanket of clouds under a clear sky.\" class=\"internal default\" src=\"/@api/deki/files/66356/Subaru%252C_Keck_and_NASA_Telescopes._Mauna_Kea_Summit_(503910)_(21665383948).jpg\" /> <figcaption>Figure \\(\\PageIndex{1}\\): From left to right the, <a href=\"https://subarutelescope.org/en/\" title=\"https://subarutelescope.org/en/\">Subaru Telescope</a>, the two&nbsp;<a href=\"https://keckobservatory.org/\" title=\"https://keckobservatory.org/\">Keck</a> telescopes, NASA's <a href=\"https://irtfweb.ifa.hawaii.edu/\" title=\"https://irtfweb.ifa.hawaii.edu/\">Infrared Telescope </a><a href=\"https://irtfweb.ifa.hawaii.edu/\" title=\"https://irtfweb.ifa.hawaii.edu/\">Facility</a>&nbsp;were all built on the summit of Maunakea. The two Keck telescopes&nbsp;had planned extensions that were highly opposed by Native Hawaiians. (<a href=\"https://creativecommons.org/licenses/by/2.0/\" target=\"_blank\" title=\"CC BY 2.0\">CC BY 2.0</a>; <a href=\"https://www.flickr.com/people/92487715@N03\" target=\"_blank\" title=\"Robert Linsdell\">Robert Linsdell</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Subaru,_Keck_and_NASA_Telescopes._Mauna_Kea_Summit_(503910)_(21665383948).jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>).</figcaption> </figure> <p>Alternative and/or addition:&nbsp;<a href=\"https://en.wikipedia.org/wiki/Hypatia\" title=\"https://en.wikipedia.org/wiki/Hypatia\">Hypatia and the astrolabe</a></p>"
