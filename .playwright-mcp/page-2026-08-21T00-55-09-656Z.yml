            - application "Rich Text Editor, editarea" [ref=f81e311]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f81e345]: "<h3>Radiation and Temperature</h3> <p>Some astronomical objects emit mostly infrared radiation, others mostly visible light, and still others mostly ultraviolet radiation. What determines the type of electromagnetic radiation emitted by the Sun, stars, and other dense astronomical objects? The answer often turns out to be their <em data-effect=\"italics\">temperature</em>.</p> <p>At the microscopic level, everything in nature is in motion. A solid is composed of molecules and atoms in continuous vibration: they move back and forth in place, but their motion is much too small for our eyes to make out. A gas consists of atoms and/or molecules that are flying about freely at high speed, continually bumping into one another and bombarding the surrounding matter. The hotter the solid or gas, the more rapid the motion of its molecules or atoms. The temperature of something is thus a measure of the average motion energy of the particles that make it up.</p> <p>This motion at the microscopic level is responsible for much of the electromagnetic radiation on Earth and in the universe. As atoms and molecules move about and collide, or vibrate in place, their electrons give off electromagnetic radiation. The characteristics of this radiation are determined by the temperature of those atoms and molecules. In a hot material, for example, the individual particles vibrate in place or move rapidly from collisions, so the emitted waves are, on average, more energetic. And recall that higher energy waves have a higher frequency. In very cool material, the particles have low-energy atomic and molecular motions and thus generate lower-energy waves.</p> <p class=\"lt-phys-64098\">An object’s <strong>temperature </strong>is the measure of the speed at which the object’s particles move. To measure temperature, astronomers prefer the <strong>Kelvin temperature scale</strong>. This scale is much like Celsius, but 0 <sup>o </sup>is Absolute Zero – scale starts at zero, 0K. <strong>Wien’s Law </strong>relates the color of an incandescent object to its temperature. The law states that wavelength of the brightest color is inversely proportional to the object’s temperature.</p> <div class=\"bc-figure figure\"><img alt=\"Image of Wien’s Law in an equation. The wavelength of the brightest color multiplied by one divided by t. \" src=\"/@api/deki/files/42783/figure-34-wiensLaw. png\" /></div> <p class=\"lt-phys-64098\">Where:</p> <ul> <li class=\"lt-phys-64098\"><strong>Stefan-Boltzmann Law </strong>states that the power, <strong>P</strong>, emitted per unit of area of an object is proportional to the fourth power of its temperature, <strong>T</strong>. Mathematically, this is: <div class=\"bc-figure figure\"><img alt=\"Image of Stefan-Boltzmann Law in an equation. Power, P, emitted per unit of area of an object is proportional to the fourth power of its temperature, T\" src=\"/@api/deki/files/42901/figure-35-stefanBoltzmannLaw. png\" /></div> <ul> <li class=\"lt-phys-64098\"><strong>P </strong>is the power</li> <li class=\"lt-phys-64098\"><strong>T </strong>is the temperature</li> </ul> </li> </ul> <h3 class=\"lt-phys-64677\">Radiation Laws</h3> <p class=\"lt-phys-64677\">To understand, in more quantitative detail, the relationship between temperature and electromagnetic radiation, we imagine an idealized object called a <span data-type=\"term\" group-by=\"b\">blackbody</span>. Such an object (unlike your sweater or your astronomy instructor’s head) does not reflect or scatter any radiation, but absorbs all the electromagnetic energy that falls onto it. The energy that is absorbed causes the atoms and molecules in it to vibrate or move around at increasing speeds. As it gets hotter, this object will radiate electromagnetic waves until absorption and radiation are in balance. We want to discuss such an idealized object because, as you will see, stars behave in very nearly the same way.</p> <p class=\"lt-phys-64677\">The radiation from a blackbody has several characteristics, as illustrated in Figure 5.8. The graph shows the power emitted at each wavelength by objects of different temperatures. In science, the word <em data-effect=\"italics\">power</em> means the energy coming off per second (and it is typically measured in <em data-effect=\"italics\">watts</em>, which you are probably familiar with from buying lightbulbs).</p> <figure><span data-alt=\"Graph of radiation laws. The horizontal axis shows wavelength ranging from 1000 to 3000 nanometers. The vertical axis shows intensity in arbitrary units. Four different curves are shown, each corresponding to an object at a certain temperature in degrees Kelvin. The highest point of each curve is labeled with a dot that indicates the wavelength corresponding to the peak energy emitted by the object at that temperature. The 3000 K curve peaks at 1200 nm in the infrared. The 4000 K object peaks at 900 nm in the near-infrared, the 5000 K curve peaks at 700 nm in the visible-red, and the 6000 K object peaks at about 500 nm in the yellow part of the visible spectrum.\" data-type=\"media\"><img alt=\"Graph of radiation laws. The horizontal axis shows wavelength ranging from 1000 to 3000 nanometers. The vertical axis shows intensity in arbitrary units. Four different curves are shown, each corresponding to an object at a certain temperature in degrees Kelvin. The highest point of each curve is labeled with a dot that indicates the wavelength corresponding to the peak energy emitted by the object at that temperature. The 3000 K curve peaks at 1200 nm in the infrared. The 4000 K object peaks at 900 nm in the near-infrared, the 5000 K curve peaks at 700 nm in the visible-red, and the 6000 K object peaks at about 500 nm in the yellow part of the visible spectrum.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46120/6a47d55943035469cc43227c4c0c3bdf9c115fc0\" /> </span> <figcaption>Figure 5.8 : Radiation Laws Illustrated. This graph shows in arbitrary units how many photons are given off at each wavelength for objects at four different temperatures. The wavelengths corresponding to visible light are shown by the colored bands. Note that at hotter temperatures, more energy (in the form of photons) is emitted at all wavelengths. The higher the temperature, the shorter the wavelength at which the peak amount of energy is radiated (this is known as Wien’s law).</figcaption> </figure> <p class=\"lt-phys-64677\">First of all, notice that the curves show that, at each temperature, our blackbody object emits radiation (photons) at all wavelengths (all colors). This is because in any solid or denser gas, some molecules or atoms vibrate or move between collisions slower than average and some move faster than average. So when we look at the electromagnetic waves emitted, we find a broad range, or spectrum, of energies and wavelengths. More energy is emitted at the average vibration or motion rate (the highest part of each curve), but if we have a large number of atoms or molecules, some energy will be detected at each wavelength.</p> <p class=\"lt-phys-64677\">Second, note that an object at a higher temperature emits more power at all wavelengths than does a cooler one. In a hot gas (the taller curves in Figure 5.8), for example, the atoms have more collisions and give off more energy. In the real world of stars, this means that hotter stars give off more energy at every wavelength than do cooler stars.</p> <p class=\"lt-phys-64677\">Third, the graph shows us that the higher the temperature, the shorter the wavelength at which the maximum power is emitted. Remember that a shorter wavelength means a higher frequency and energy. It makes sense, then, that hot objects give off a larger fraction of their energy at shorter wavelengths (higher energies) than do cool objects. You may have observed examples of this rule in everyday life. When a burner on an electric stove is turned on low, it emits only heat, which is infrared radiation, but does not glow with visible light. If the burner is set to a higher temperature, it starts to glow a dull red. At a still-higher setting, it glows a brighter orange-red (shorter wavelength). At even higher temperatures, which cannot be reached with ordinary stoves, metal can appear brilliant yellow or even blue-white.</p> <p class=\"lt-phys-64677\">We can use these ideas to come up with a rough sort of “thermometer” for measuring the temperatures of stars. Because many stars give off most of their energy in visible light, the color of light that dominates a star’s appearance is a rough indicator of its temperature. If one star looks red and another looks blue, which one has the higher temperature? Because blue is the shorter-wavelength color, it is the sign of a hotter star. (Note that the temperatures we associate with different colors in science are not the same as the ones artists use. In art, red is often called a “hot” color and blue a “cool” color. Likewise, we commonly see red on faucet or air conditioning controls to indicate hot temperatures and blue to indicate cold temperatures. Although these are common uses to us in daily life, in nature, it’s the other way around.)</p> <p class=\"lt-phys-64677\">We can develop a more precise star thermometer by measuring how much energy a star gives off at each wavelength and by constructing diagrams like Figure 5.8. The location of the peak (or maximum) in the power curve of each star can tell us its temperature. The average temperature at the surface of the Sun, which is where the radiation that we see is emitted, turns out to be 5800 K. (Throughout this text, we use the kelvin or absolute temperature scale. On this scale, water freezes at 273 K and boils at 373 K. All molecular motion ceases at 0 K. The various temperature scales are described in Appendix D.) There are stars cooler than the Sun and stars hotter than the Sun.</p> <p class=\"lt-phys-64677\">The wavelength at which maximum power is emitted can be calculated according to the equation</p> <p class=\"lt-phys-64677\"><math display=\"block\"><semantics><mrow><mrow><msub><mtext>λ</mtext><mrow><mtext>max</mtext></mrow></msub><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mrow><mn>3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>6</mn></msup></mrow><mrow><mi>T</mi></mrow></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msub><mtext>λ</mtext><mrow><mtext>max</mtext></mrow></msub></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mrow><mn>3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>6</mn></msup></mrow><mrow><mi>T</mi></mrow></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64677\">where the wavelength is in nanometers (one billionth of a meter) and the temperature is in K (the constant <math display=\"inline\"><semantics><mrow><mrow><mn>3</mn><mo>×</mo><mn>10</mn><mo>^</mo><mn>6</mn><mtext> has units of </mtext></mrow></mrow><mrow><mrow><mi>nm</mi><mo>×</mo><mi>K</mi></mrow></mrow>Table 5.1.</semantics></math></p> <p class=\"lt-phys-64677\">Since this star has a peak wavelength that is at a shorter wavelength (in the ultraviolet part of the spectrum) than that of our Sun (in the visible part of the spectrum), it should come as no surprise that its surface temperature is much hotter than our Sun’s.</p> <p class=\"lt-phys-64677\">We can also describe our observation that hotter objects radiate more power at all wavelengths in a mathematical form. If we sum up the contributions from all parts of the electromagnetic spectrum, we obtain the total energy emitted by a blackbody. What we usually measure from a large object like a star is the <span data-type=\"term\" group-by=\"e\">energy flux</span>, the power emitted per square meter. The word <em data-effect=\"italics\">flux</em> means “flow” here: we are interested in the flow of power into an area (like the area of a telescope mirror). It turns out that the energy flux from a blackbody at temperature <em data-effect=\"italics\">T</em> is proportional to the fourth power of its absolute temperature. This relationship is known as the <span data-type=\"term\" group-by=\"S\">Stefan-Boltzmann law</span> and can be written in the form of an equation as</p> <p class=\"lt-phys-64677\"><math display=\"block\"><semantics><mrow><mrow><mi>F</mi><mo>=</mo></mrow></mrow><mrow><mrow><mtext>σ</mtext><msup><mi>T</mi><mn>4</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>F</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mtext>σ</mtext><msup><mi>T</mi><mn>4</mn></msup></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64677\">where <em data-effect=\"italics\">F</em> stands for the energy flux (in units of watts per square meter), T is given in Kelvins, and σ (Greek letter sigma) is a constant number <math display=\"inline\"><semantics><mrow><mrow><mo>(</mo><mn>5.67</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mo>)</mo></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mo>(</mo><mn>5.67</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mo>)</mo></mrow></annotation-xml></semantics></math>.</p> <p class=\"lt-phys-64677\">Notice how impressive this result is. Increasing the temperature of a star would have a tremendous effect on the power it radiates. If the Sun, for example, were twice as hot—that is, if it had a temperature of 11,600 K—it would radiate 2<sup>4</sup>, or 16 times more power than it does now. Tripling the temperature would raise the power output 81 times. Hot stars really shine away a tremendous amount of energy.&nbsp;</p> <div class=\"bc-section section\"> <h2>Stars in the Night Skies</h2> <p>As one looks at the stars in the night sky, a couple of things become obvious, especially if you are observing from a dark sky site. First, you will observe that the stars are of various brightnesses. This is due to two main factors: the distance to the star and the type of star. Second, you will see that not all stars are white in color. You will see red stars, orange stars, blue and blue-white stars. No, your eyes are not playing tricks on you. And, by the way, yellow stars, like the Sun, are a little harder for the human eye to see the star’s yellow color. Yet, through a telescope, and for some in binoculars, the yellow color is visible. <sup>(1)</sup></p> </div> <div class=\"bc-section section\"> <h2>Star Color</h2> <p>Astronomers measure a star’s surface temperature at its photosphere. Recall that the photosphere is the outer layer of the star from which light is radiated. The star’s photosphere temperature dictates its color. Conversely, the color of a star at its photosphere shows its temperature. The hotter the star is, the more blue or blue-white it is. And, the cooler the star, the redder the star will appear in color.</p> <p>Astronomers classify stars by their color and/or photosphere temperature, called a star’s Spectral Type or Spectral Class. An astronomer, Annie Jump Cannon, sorted spectral data and designed the stellar spectral types we still use; O-B-A-F-G-K-M.</p> <div class=\"bc-figure figure\"><img alt=\"Seven stars are shown on a black background with the smallest type, M on the left, through the largest, O, on the right.\" src=\"/@api/deki/files/19990/fig10-2-1.png\" /> <div class=\"bc-figcaption figcaption\">Stars – colors with spectral types. Not all of the star types are shown, such as the Red Supergiant stars.<a href=\"https://commons.wikimedia.org/wiki/File:Morgan-Keenan_spectral_classification.png\" rel=\"noopener noreferrer\" target=\"_blank\">Morgan-Keenan spectral classification </a>by LucasVB is licensed under <a href=\"https://creativecommons.org/licenses/by-sa/3.0\" rel=\"noopener noreferrer\" target=\"_blank\">CC BY-SA 3.0</a></div> </div> <p>A more-detailed form of Cannon’s classification, the Morgan-Keenan classification, provides more information about each star by adding Roman numerals with the spectral types. See the table, below, for examples of stars, temperature, and color.<sup>(1)</sup></p> <div class=\"bc-section section\"> <h4>Examples of Stars and Spectral Types</h4> <table class=\"mt-responsive-table\"> <thead> <tr> <th>Spectral Type</th> <th>Star Example</th> <th>Temperature Range, K</th> <th>Stellar Color</th> </tr> </thead> <tbody> <tr> <td data-th=\"Spectral Type\">O</td> <td data-th=\"Star Example\">Orion Belt Stars</td> <td data-th=\"Temperature Range, K\">&gt;30,000</td> <td data-th=\"Stellar Color\">Blue-Blue White</td> </tr> <tr> <td data-th=\"Spectral Type\">B</td> <td data-th=\"Star Example\">Rigel</td> <td data-th=\"Temperature Range, K\">10,000–30,000</td> <td data-th=\"Stellar Color\">Blue-White</td> </tr> <tr> <td data-th=\"Spectral Type\">A</td> <td data-th=\"Star Example\">Sirius</td> <td data-th=\"Temperature Range, K\">7,500–10,000</td> <td data-th=\"Stellar Color\">White</td> </tr> <tr> <td data-th=\"Spectral Type\">F</td> <td data-th=\"Star Example\">Polaris</td> <td data-th=\"Temperature Range, K\">6,000–7,500</td> <td data-th=\"Stellar Color\">Yellow</td> </tr> <tr> <td data-th=\"Spectral Type\">G</td> <td data-th=\"Star Example\">Sun</td> <td data-th=\"Temperature Range, K\">5,000–6,000</td> <td data-th=\"Stellar Color\">Deep Yellow</td> </tr> <tr> <td data-th=\"Spectral Type\">K</td> <td data-th=\"Star Example\">Arcturus</td> <td data-th=\"Temperature Range, K\">3,5000–5,000</td> <td data-th=\"Stellar Color\">Orange</td> </tr> <tr> <td data-th=\"Spectral Type\">M</td> <td data-th=\"Star Example\">Betelgeuse</td> <td data-th=\"Temperature Range, K\">&lt;3,500</td> <td data-th=\"Stellar Color\">Red</td> </tr> </tbody> </table> </div> </div> <div class=\"bc-section section\"> <h2>Seeing Star Colors</h2> <div class=\"bc-figure figure\"><img alt=\"The constellation Orion. Deep sky objects visible in this image include the Orion Belt Stars, Betelgeuse, and Rigel.\" src=\"/@api/deki/files/20023/fig10-3-1.jpg\" /> <div class=\"bc-figcaption figcaption\">Orion the Hunter. Note several identified stars; Betelgeuse (red), Belt Stars (blue-blue white), and Rigel (blue-white). Orion 3008 by Florida State College at Jacksonville is licensed under <a href=\"https://creativecommons.org/licenses/by-sa/3.0\" rel=\"noopener noreferrer\" target=\"_blank\">CC BY-SA 3.0 </a>/ A derivative from the original work</div> </div> <p>Perhaps the best constellation to view various star colors is Orion. This winter constellation includes the stars Rigel (Blue-White), Belt Stars (Blue-Blue White), and Betelgeuse (Red).</p> <p>You can easily see the star colors without a telescope or binoculars, especially red Betelgeuse and the other blue stars. With a pair of binoculars, star colors become even-more obvious. Many have likened these colorful stars as celestial gems.</p> <p>Albireo, also known as Beta Cygni, is a double star system in the constellation Cygnus the Swan. With the naked eye, Albireo looks like a single star. Through a small telescope or even binoculars, one can see two stars that astronomers call Albireo A and Albireo B. The obvious orange and blue stars are occasionally referred to as the “Gator Double.”</p> <div class=\"bc-figure figure\"><img alt=\"The orange and blue stars of Albireo are shown.\" src=\"/@api/deki/files/20049/fig10-3-2.jpg\" /> <div class=\"bc-figcaption figcaption\">The orange and blue stars of Albireo NewAlbireo by Hewholooks is licensed under <a href=\"https://creativecommons.org/licenses/by-sa/3.0\" rel=\"noopener noreferrer\" target=\"_blank\">CC BY-SA 3.0</a></div> </div> <p>Polaris, the Pole Star in the constellation Ursa Minor (the little bear), is usually easy to find, unless you have too many streetlights around you or your horizon blocks your view to the north. Polaris is an F star, based on Annie Jump Cannon’s classification. It is a yellow star, and slightly hotter at its photosphere than our Sun. <sup>(1)</sup></p> <div class=\"bc-figure figure\"><img alt=\"A star trail photograph. Polaris — a yellow star — is at the very center of the photo, indicated by the arrow.\" src=\"/@api/deki/files/20068/fig10-3-3.jpg\" /> <div class=\"bc-figcaption figcaption\">A star trail photograph. Polaris — a yellow star — is at the very center of the photo, indicated by the arrow. Star Trail above Beccles by Florida State College at Jacksonville is licensed under <a href=\"https://creativecommons.org/licenses/by-sa/4.0\" rel=\"noopener noreferrer\" target=\"_blank\">CC BY-SA 4.0 </a>/ A derivative from the original work</div> </div> </div> <div class=\"licensing\"> <div class=\"license-attribution-dropdown-subheading\">CC licensed content, Original</div> <ul class=\"citation-list\"> <li><strong>Authored by</strong>: Florida State College at Jacksonville. <strong>License</strong>: <em><a href=\"https://creativecommons.org/licenses/by/4.0\" rel=\"license\" target=\"_blank\">CC BY: Attribution</a></em></li> </ul> </div> <p>&nbsp;</p> <h2>Further Exploration</h2> <ul> <li>Check out the <a href=\"https://openstax.org/l/30elmagsp1\" rel=\"noopener nofollow\" target=\"_blank\">NASA briefing</a> or <a href=\"https://openstax.org/l/30elmagsp2\" rel=\"noopener nofollow\" target=\"_blank\">NASA’s 5-minute introductory video</a> to learn more about the electromagnetic spectrum.</li> <li>You can use the <a href=\"https://openstax.org/l/30blackbodysim\" rel=\"noopener nofollow\" target=\"_blank\">Blackbody Spectrum simulator</a> to explore the relationship between an object’s temperature, peak wavelength, overall brightness, and apparent color.</li> </ul> <h2>Examples and Exercises</h2> <p class=\"box-legend lt-phys-64677\">Example: Calculating the Temperature of a Blackbody</p> <p class=\"lt-phys-64677\">We can use Wien’s law to calculate the temperature of a star provided we know the wavelength of peak intensity for its spectrum. If the emitted radiation from a red dwarf star has a wavelength of maximum power at 1200 nm, what is the temperature of this star, assuming it is a blackbody?</p> <p class=\"lt-phys-64677\">Solution</p> <p class=\"lt-phys-64677\">Solving Wien’s law for temperature gives:</p> <p class=\"lt-phys-64677\"><math display=\"block\"><semantics><mrow><mrow><mi>T</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>6</mn></msup><mspace width=\"0.2em\"></mspace><mtext>nm</mtext><mtext> </mtext></mrow><mrow><mtext>K</mtext></mrow><mrow><msub><mtext>λ</mtext><mrow><mtext>max</mtext></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>6</mn></msup><mspace width=\"0.2em\"></mspace><mtext>nm</mtext><mtext> </mtext></mrow><mrow><mtext>K</mtext></mrow><mrow><mtext>1200</mtext></mrow><mrow><mtext> nm</mtext></mrow></mfrac><mo>=</mo></mrow></mrow></semantics></math></p> <p class=\"box-legend\">Example: Calculating the Power of a Star</p> <p>While energy flux tells us how much power a star emits per square meter, we would often like to know how much total power is emitted by the star. We can determine that by multiplying the energy flux by the number of square meters on the surface of the star. Stars are mostly spherical, so we can use the formula <math display=\"inline\"><semantics><mrow><mrow><mn>4</mn><mo>π</mo><msup><mi>R</mi><mn>2</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>4</mn><mo>π</mo><msup><mi>R</mi><mn>2</mn></msup></mrow></annotation-xml></semantics></math> for the surface area, where <em data-effect=\"italics\">R</em> is the radius of the star. The total power emitted by the star (which we call the star’s “absolute luminosity”) can be found by multiplying the formula for energy flux and the formula for the surface area:</p> <p><math display=\"block\"><semantics><mrow><mrow><mi>L</mi><mo>=</mo></mrow></mrow><mrow><mrow><mn>4</mn><mtext>π</mtext><msup><mi>R</mi><mn>2</mn></msup><mtext>σ</mtext><msup><mi>T</mi><mn>4</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>L</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mn>4</mn><mtext>π</mtext><msup><mi>R</mi><mn>2</mn></msup><mtext>σ</mtext><msup><mi>T</mi><mn>4</mn></msup></mrow></annotation-xml></semantics></math></p> <p>Two stars have the same size and are the same distance from us. Star A has a surface temperature of 6000 K, and star B has a surface temperature twice as high, 12,000 K. How much more luminous is star B compared to star A?</p> <p>Solution</p> <p><math display=\"block\"><semantics><mrow><mrow><msub><mi>L</mi><mtext>A</mtext></msub><mo>=</mo><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>and</mtext><mspace width=\"0.2em\"></mspace><msub><mi>L</mi><mtext>B</mtext></msub><mo>=</mo></mrow></mrow><mrow><mrow><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msub><mi>L</mi><mtext>A</mtext></msub></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>and</mtext><mspace width=\"0.2em\"></mspace><msub><mi>L</mi><mtext>B</mtext></msub><mo>=</mo><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></annotation-xml></semantics></math></p> <p>Take the ratio of the luminosity of Star A to Star B:</p> <p><math display=\"block\"><semantics><mrow><mrow><mfrac><mrow><msub><mi>L</mi><mtext>B</mtext></msub></mrow><mrow><msub><mi>L</mi><mtext>A</mtext></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mrow><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><msub><mi>L</mi><mtext>B</mtext></msub></mrow><mrow><msub><mi>L</mi><mtext>A</mtext></msub></mrow></mfrac></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mrow><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mn>4</mn><mtext>π</mtext><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mtext>σ</mtext><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><msub><mrow><mi>R</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac></mrow></annotation-xml></semantics></math></p> <p>Because the two stars are the same size, <em data-effect=\"italics\">R</em><sub>A</sub> = <em data-effect=\"italics\">R</em><sub>B</sub>, leaving</p> <p><math display=\"block\"><semantics><mrow><mrow><mfrac><mrow><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mrow><mo>(</mo><mrow><mn>12,</mn><mn>000</mn><mspace width=\"0.2em\"></mspace><mtext>K</mtext></mrow><mo>)</mo></mrow></mrow><mn>4</mn></msup></mrow><mrow><msup><mrow><mrow><mo>(</mo><mrow><mn>6000</mn><mspace width=\"0.2em\"></mspace><mtext>K</mtext></mrow><mo>)</mo></mrow></mrow><mn>4</mn></msup></mrow></mfrac><mo>=</mo><msup><mn>2</mn><mn>4</mn></msup><mo>=</mo></mrow></mrow><mrow><mrow><mn>16</mn></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mfrac><mrow><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>B</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><msub><mrow><mi>T</mi></mrow><mrow><mtext>A</mtext></mrow></msub></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"box-legend\">Exercise</p> <p>Two stars with identical diameters are the same distance away. One has a temperature of 8700 K and the other has a temperature of 2900 K. Which is brighter? How much brighter is it?</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p>&nbsp;</p> <p>The 8700 K star has triple the temperature, so it is 3<sup>4</sup> = 81 times brighter.</p> </dd> </dl> <h2>Attributions</h2> <p><a class=\"link-https\" href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_Lab_(Lumen)/10:_Star_Colors_and_Spectroscopy/10.02:_Star_Color\" rel=\"freelink\" title=\"https://phys.libretexts.org/Bookshelves/Astronomy__Cosmology/Astronomy_Lab_(Lumen)/10%3A_Star_Colors_and_Spectroscopy/10.02%3A_Star_Color\">https://phys.libretexts.org/Bookshel...%3A_Star_Color</a></p> <p>&nbsp;</p>"
