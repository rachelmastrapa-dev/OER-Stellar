            - application "Rich Text Editor, editarea" [ref=f286e311]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f286e345]: "<h2>Science and Society - Red Sky Paradox</h2> <h3>How unique are we?</h3> <p>Given the 100 billion or so stars in our galaxy and the incredibly old age of many such systems, you might expect that intelligent life, if it exists, would have had plenty of opportunity to spread itself across the universe in ways that should be obvious to humankind — thus, the Fermi Paradox asks, where is everyone? A similar paradox can be considered regarding the types of stars that seem to host life. Our sun is part of a group of stellar types referred to as FGK-dwarfs, but the vast majority of stars (~¾) are instead red dwarfs (i.e., M-dwarfs), which are smaller, cooler, and dimmer.</p> <p>Assuming intelligent life can occur around all kinds of stars in the universe, then the greater number of M-dwarfs suggests it is somewhat unusual that we look up and instead find ourselves orbiting a G-dwarf.</p> <p>Alternatively, perhaps our situation suggests that there is something about these common M-dwarf systems that prohibits life, and FGK-dwarfs are the place to be. The author of today’s paper considers arguments on either side of this problem, dubbed the Red Sky Paradox, using Bayesian statistical analysis to discuss four possible resolutions. The author of this work aims to improve on the somewhat problematic framing of previous studies, which computed probabilities without considering the variable abundance of planets and habitability around different star types.</p> <p>The author investigates probabilities by developing a formula in which biology develops at a uniform rate that leads directly from non-living chemical processes to eventual intelligent life. This rate is included alongside a time window for life to develop (based on the length of the host star’s life cycle) in order to find the probability of life emerging around an FGK-dwarf versus the more common M-dwarf. These equations are then used to compute the probability of life in various scenarios. There are of course many other types of stars and subtypes, but treating the issue as having just two solutions — a lifeform either develops around an FGK- or an M-dwarf — seems to be a reasonable and helpful simplification.</p> <h3>Four possible solutions</h3> <p>Resolution I – Our situation is a 1-in-100 outlier. If the rates of developing intelligent life are the same for both star types, then the probability comes down to the stars’ different rates of occurrence, of which FGK types are more rare and shorter lived.</p> <p>Resolution II – FGK-dwarfs provide better habitability than M-dwarfs. If the probability of intelligent life emerging around both stars were similar, then the rate of life’s development around FGK-stars would need to be at least two orders of magnitude greater.</p> <p>Resolution III – Life doesn’t have enough time to develop around M-dwarfs. If the probability of life around both stars was similar AND the rate of life’s development was the same, then the time window available for development of life around FGK-dwarfs may be at least 5 times greater than that for M-dwarfs.</p> <p>Resolution IV – Earth-like worlds are rarer than we think. If the habitable worlds occur at different rates between the two star types, then Earth-like planets would need to be at least two orders of magnitude more common around FGK- than M-dwarfs.</p> <figure><img alt=\"Observatory domes on a mountain ridge above a blanket of clouds under a clear sky.\" class=\"internal default\" src=\"/@api/deki/files/66356/Subaru%252C_Keck_and_NASA_Telescopes._Mauna_Kea_Summit_(503910)_(21665383948).jpg\" /> <figcaption>Figure \\(\\PageIndex{1}\\): From left to right the, <a href=\"https://subarutelescope.org/en/\" title=\"https://subarutelescope.org/en/\">Subaru Telescope</a>, the two&nbsp;<a href=\"https://keckobservatory.org/\" title=\"https://keckobservatory.org/\">Keck</a> telescopes, NASA's <a href=\"https://irtfweb.ifa.hawaii.edu/\" title=\"https://irtfweb.ifa.hawaii.edu/\">Infrared Telescope </a><a href=\"https://irtfweb.ifa.hawaii.edu/\" title=\"https://irtfweb.ifa.hawaii.edu/\">Facility</a>&nbsp;were all built on the summit of Maunakea. The two Keck telescopes&nbsp;had planned extensions that were highly opposed by Native Hawaiians. (<a href=\"https://creativecommons.org/licenses/by/2.0/\" target=\"_blank\" title=\"CC BY 2.0\">CC BY 2.0</a>; <a href=\"https://www.flickr.com/people/92487715@N03\" target=\"_blank\" title=\"Robert Linsdell\">Robert Linsdell</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Subaru,_Keck_and_NASA_Telescopes._Mauna_Kea_Summit_(503910)_(21665383948).jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>).</figcaption> </figure> <p>&nbsp;</p> <p><span style=\"font-weight:400;\">Plot of Resolution I with probability of humanity developing around an FGK-dwarf over the necessary rate for intelligent life to spawn for such stars. The probability may fall between 1% and 10% (10<sup>-2</sup> and 10<sup>-1</sup> on the y-axis), though the former seems more consistent with the slow development of intelligent life that occurred on Earth, as shown by the bluer colors. </span><em>Figure 1 in today’s paper.</em>)</p> <p>&nbsp;</p> <p>The authors make note of a few caveats for each outcome. For Resolution I (<span class=\"mt-bgcolor-e74c3c\">see Figure 1</span>), a fast emergence/evolution of life would lead to us being less of an outlier (1-in-10) and resolve the Red Sky Paradox, but should result in a universe teeming with intelligent life and so seems at odds with the apparent Fermi Paradox. A slower emergence rate is more consistent with the billions of years it took intelligent life to develop on Earth, but with the 1-in-100 outlier outcome seems to go against the Copernican Principle that we are not special but just a tiny drop in a vast sea.</p> <p>Alternatively, Resolution II has good theoretical support due to existing concerns about less-than-habitable conditions that may arise around m-dwarfs (e.g., frequent tidal locking, high stellar activity, etc.). Resolution III has similarly good support since the pre-main sequence for m-dwarfs seems to be at least several times less than the main sequence lifetime of FGK-stars, giving a smaller time window for life to develop. Resolution IV could also be relevant, as the occurrence rates of Earth-sized worlds around different star types are hotly debated, not to mention that Earth-sized doesn’t necessarily mean habitable and doesn’t include other bodies of interest like exomoons.</p> <h3>Narrowing things down</h3> <p>Of course, these options are not mutually exclusive and a combination of them could be responsible. Fortunately, observational astronomy may be able to test some of these possibilities in the near future. For example, frequently finding runaway greenhouse worlds around m-dwarfs would support Resolution III, whereas a paucity of Earth-like planets around late m-dwarfs would support Resolution IV. Ultimately, this sort of probability study, in combination with incoming results, can help us to best direct future observations (e.g., using JWST) with the highest chance of finding evidence of life in the universe.</p> <p>For more details on this work (from the author himself!) check out the excellent summary video below:</p> <p>(<span class=\"mt-bgcolor-e74c3c\">Insert youtube video: Why don't we live around a Red Dwarf)</span>&nbsp;</p> <p><i><span style=\"font-weight:400;\">Edited by: Zili Shen</span></i></p> <p><i><span style=\"font-weight:400;\">Featured image: Edit of figure from Kepler’s Epitome astronomiae Copernicanae (1618), from </span></i><a href=\"https://www.sacred-texts.com/astro/cwiu/cwiu06.htm\"><i><span style=\"font-weight:400;\">sacred-texts.com</span></i></a></p> <h3>Attributions</h3> <p><a href=\"https://astrobites.org/2021/08/24/red-sky-paradox/\" title=\"https://astrobites.org/2021/08/24/red-sky-paradox/\">Astrobites - Shouldn't we be orbiting a red dwarf?&nbsp;</a></p>"
