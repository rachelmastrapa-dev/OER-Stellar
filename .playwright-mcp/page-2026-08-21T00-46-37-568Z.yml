                      - text: ", Pluto, Ceres, and"
                      - generic [ref=f50e155]: Makemake
                      - text: . Note that Pluto’s orbit is not in the plane of the planets.
                  - paragraph [ref=f50e156]: Each of the planets and dwarf planets also rotates (spins) about an axis running through it, and in most cases the direction of rotation is the same as the direction of revolution about the Sun. The exceptions are Venus, which rotates backward very slowly (that is, in a retrograde direction), and Uranus and Pluto, which also have strange rotations, each spinning about an axis tipped nearly on its side. We do not yet know the spin orientations of Eris, Haumea, and Makemake.
                  - paragraph [ref=f50e157]: The four planets closest to the Sun (Mercury through Mars) are called the inner or terrestrial planets. Often, the Moon is also discussed as a part of this group, bringing the total of terrestrial objects to five. (We generally call Earth’s satellite “the Moon,” with a capital M, and the other satellites “moons,” with lowercase m’s.) The terrestrial planets are relatively small worlds, composed primarily of rock and metal. All of them have solid surfaces that bear the records of their geological history in the forms of craters, mountains, and volcanoes (Figure 7.4).
                  - 'figure "Figure 7.4 : Surface of Mercury. The pockmarked face of the terrestrial world of Mercury is more typical of the inner planets than the watery surface of Earth. This black-and-white image, taken with the Mariner 10 spacecraft, shows a region more than 400 kilometers wide. (credit: modification of work by NASA/John Hopkins University Applied Physics Laboratory/Carnegie Institution of Washington)" [ref=f50e158]':
                    - img "Image of the surface of Mercury taken from Mariner 10. Large craters, with many overlapping one upon the other, cover the surface of this 400 km wide scene." [ref=f50e160]
                  - paragraph [ref=f50e162]: The next four planets (Jupiter through Neptune) are much larger and are composed primarily of lighter ices, liquids, and gases. We call these four the jovian planets (after “Jove,” another name for Jupiter in mythology) or giant planets—a name they richly deserve (Figure 7.5). About 1,300 Earths could fit inside Jupiter, for example. These planets do not have solid surfaces on which future explorers might land. They are more like vast, spherical oceans with much smaller, dense cores.
                  - 'figure "Figure 7.5 : The Four Giant Planets. This montage shows the four giant planets: Jupiter, Saturn, Uranus, and Neptune. Below them, Earth is shown to scale. (credit: modification of work by NASA, Solar System Exploration)" [ref=f50e163]':
                    - img "Diagram of the Four Giant Planets Shown to Scale. Arranged from left to right are Jupiter, Saturn, Uranus, and Neptune. Also shown to scale at lower center is the Earth." [ref=f50e165]
                  - paragraph [ref=f50e167]: Near the outer edge of the system lies Pluto, which was the first of the distant icy worlds to be discovered beyond Neptune (Pluto was visited by a spacecraft, the NASA New Horizons mission, in 2015 [see Figure 7.6]). Table 7.2 summarizes some of the main facts about the planets.
                  - 'figure "Figure 7.6 : Pluto Close-up. This intriguing image from the New Horizons spacecraft, taken when it flew by the dwarf planet in July 2015, shows some of its complex surface features. The rounded white area is called the Sputnik Plain, after humanity’s first spacecraft. (credit: modification of work by NASA/Johns Hopkins University Applied Physics Laboratory/Southwest Research Institute)" [ref=f50e168]':
