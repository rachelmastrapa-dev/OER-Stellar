                      - text: that trace the history of the Apollo mission.
                  - heading "An Inventory" [level=3] [ref=f50e117]
                  - paragraph [ref=f50e118]: The Sun, a star that is brighter than about 80% of the stars in the Galaxy, is by far the most massive member of the solar system, as shown in Table 7.1. It is an enormous ball about 1.4 million kilometers in diameter, with surface layers of incandescent gas and an interior temperature of millions of degrees. The Sun will be discussed in later chapters as our first, and best-studied, example of a star.
