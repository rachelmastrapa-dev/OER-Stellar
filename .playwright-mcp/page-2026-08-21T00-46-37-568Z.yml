                  - heading "Smaller Members of the Solar System" [level=3] [ref=f50e454]
                  - paragraph [ref=f50e455]: Most of the planets are accompanied by one or more moons; only Mercury and Venus move through space alone. There are more than 210 known moons orbiting planets and dwarf planets (see Appendix G for a listing of the larger ones), and undoubtedly many other small ones remain undiscovered. The largest of the moons are as big as small planets and just as interesting. In addition to our Moon, they include the four largest moons of Jupiter (called the Galilean moons, after their discoverer) and the largest moons of Saturn and Neptune (confusingly named Titan and Triton).
                  - paragraph [ref=f50e456]: Each of the giant planets also has rings made up of countless small bodies ranging in size from mountains to mere grains of dust, all in orbit about the equator of the planet. The bright rings of Saturn are, by far, the easiest to see. They are among the most beautiful sights in the solar system (Figure 7.7). But, all four ring systems are interesting to scientists because of their complicated forms, influenced by the pull of the moons that also orbit these giant planets.
                  - 'figure "Figure 7.7 : Saturn and Its Rings. This 2007 Cassini image shows Saturn and its complex system of rings, taken from a distance of about 1.2 million kilometers. This natural-color image is a composite of 36 images taken over the course of 2.5 hours. (credit: modification of work by NASA/JPL/Space Science Institute)" [ref=f50e457]':
                    - img "Image of Saturn and its Rings. Taken almost directly over one of Saturn’s poles, the rings are seen nearly face-on, completely encircling the planet. Sunlight arrives from lower left as the rings cast a thin shadow on Saturn’s cloud tops, while Saturn itself casts a shadow on the rings at upper right." [ref=f50e459]
                  - paragraph [ref=f50e461]: The solar system has many other less-conspicuous members. Another group is the asteroids, rocky bodies that orbit the Sun like miniature planets, mostly in the space between Mars and Jupiter (although some do cross the orbits of planets like Earth—see Figure 7.8). Most asteroids are remnants of the initial population of the solar system that existed before the planets themselves formed. Some of the smallest moons of the planets, such as the moons of Mars, are very likely captured asteroids.
                  - 'figure "Figure 7.8 : Asteroid Eros. This small Earth-crossing asteroid image was taken by the NEAR-Shoemaker spacecraft from an altitude of about 100 kilometers. This view of the heavily cratered surface is about 10 kilometers wide. The spacecraft orbited Eros for a year before landing gently on its surface. (credit: modification of work by NASA/JHUAPL)" [ref=f50e462]':
                    - img "Image of the Asteroid Eros. Like nearly all asteroids, Eros is not spherical but very irregular in shape, in this case similar to a potato. The surface is pock-marked with many craters." [ref=f50e464]
                  - paragraph [ref=f50e466]: Another class of small bodies is composed mostly of ice, made of frozen gases such as water, carbon dioxide, and carbon monoxide; these objects are called comets (see Figure 7.9). Comets also are remnants from the formation of the solar system, but they were formed and continue (with rare exceptions) to orbit the Sun in distant, cooler regions—stored in a sort of cosmic deep freeze. This is also the realm of the larger icy worlds, called dwarf planets.
                  - figure [ref=f50e467]:
                    - img "Image of Comet Churyumov-Gerasimenko (67P). Two lobes of this irregularly shaped object are illuminated by sunlight coming from the upper left. Bright streaks of material are seen radiating away from the sunlit surfaces of the comet. These streaks are not seen coming from the shaded portions." [ref=f50e469]
                    - generic [ref=f50e470]:
                      - text: "Figure 7.9 : Comet Churyumov-Gerasimenko (67P). This image shows Comet Churyumov-Gerasimenko, also known as 67P, near its closest approach to the Sun in 2015, as seen from the"
                      - emphasis [ref=f50e471]: Rosetta
                      - text: "spacecraft. Note the jets of gas escaping from the solid surface. (credit: modification of work by ESA/Rosetta/NAVACAM,"
                      - link "CC BY-SA IGO 3.0" [ref=f50e472]:
                        - /url: http://creativecommons.org/licenses/by-sa/3.0/igo/
                      - text: )
                  - paragraph [ref=f50e473]: Finally, there are countless grains of broken rock, which we call cosmic dust, scattered throughout the solar system. When these particles enter Earth’s atmosphere (as millions do each day) they burn up, producing a brief flash of light in the night sky known as a meteor (meteors are often referred to as shooting stars). Occasionally, some larger chunk of rocky or metallic material survives its passage through the atmosphere and lands on Earth. Any piece that strikes the ground is known as a meteorite. (You can see meteorites on display in many natural history museums and can sometimes even purchase pieces of them from gem and mineral dealers.)
                  - generic [ref=f50e474]:
                    - 'heading "Voyagers in Astronomy: Carl Sagan: Solar System Advocate" [level=5] [ref=f50e475]'
                    - paragraph [ref=f50e477]: The best-known astronomer in the world during the 1970s and 1980s, Carl Sagan devoted most of his professional career to studying the planets and considerable energy to raising public awareness of what we can learn from exploring the solar system (see Figure 7.10). Born in Brooklyn, New York, in 1934, Sagan became interested in astronomy as a youngster; he also credits science fiction stories for sustaining his fascination with what’s out in the universe.
                    - 'figure "Figure 7.10 : Carl Sagan (1934–1996) and Neil deGrasse Tyson. Sagan was Tyson’s inspiration to become a scientist. (credit “Sagan”: modification of work by NASA, JPL; credit “Tyson”: modification of work by Bruce F. Press)" [ref=f50e478]':
                      - 'img "Left image: photograph of Carl Sagan. Right image: Photograph of Neil deGrasse Tyson." [ref=f50e480]'
                    - paragraph [ref=f50e482]: In the early 1960s, when many scientists still thought Venus might turn out to be a hospitable place, Sagan calculated that the thick atmosphere of Venus could act like a giant greenhouse, keeping the heat in and raising the temperature enormously. He showed that the seasonal changes astronomers had seen on Mars were caused, not by vegetation, but by wind-blown dust. He was a member of the scientific teams for many of the robotic missions that explored the solar system and was instrumental in getting NASA to put a message-bearing plaque aboard the Pioneer spacecraft, as well as audio-video records on the Voyager spacecraft—all of them destined to leave our solar system entirely and send these little bits of Earth technology out among the stars.
                    - paragraph [ref=f50e483]: To encourage public interest and public support of planetary exploration, Sagan helped found The Planetary Society, now the largest space-interest organization in the world. He was a tireless and eloquent advocate of the need to study the solar system close-up and the value of learning about other worlds in order to take better care of our own.
                    - paragraph [ref=f50e484]: Sagan simulated conditions on early Earth to demonstrate how some of life’s fundamental building blocks might have formed from the “primordial soup” of natural compounds on our planet. In addition, he and his colleagues developed computer models showing the consequences of nuclear war for Earth would be even more devastating than anyone had thought (this is now called the nuclear winter hypothesis) and demonstrating some of the serious consequences of continued pollution of our atmosphere.
                    - paragraph [ref=f50e485]:
                      - text: Sagan was perhaps best known, however, as a brilliant popularizer of astronomy and the author of many books on science, including the best-selling
                      - emphasis [ref=f50e486]: Cosmos
                      - text: ", and several evocative tributes to solar system exploration such as"
                      - emphasis [ref=f50e487]: The Cosmic Connection
                      - text: and
                      - emphasis [ref=f50e488]: Pale Blue Dot
                      - text: . His book
                      - emphasis [ref=f50e489]: The Demon Haunted World
                      - text: ", completed just before his death in 1996, is perhaps the best antidote to fuzzy thinking about pseudo-science and irrationality in print today. An intriguing science fiction novel he wrote, titled"
                      - emphasis [ref=f50e490]: Contact
                      - text: ", which became a successful film as well, is still recommended by many science instructors as a scenario for making contact with life elsewhere that is much more reasonable than most science fiction."
                    - paragraph [ref=f50e491]:
                      - text: Sagan was a master, too, of the television medium. His 13-part public television series,
                      - emphasis [ref=f50e492]: Cosmos
                      - text: ", was seen by an estimated 500 million people in 60 countries and has become one of the most-watched series in the history of public broadcasting. A few astronomers scoffed at a scientist who spent so much time in the public eye, but it is probably fair to say that Sagan’s enthusiasm and skill as an explainer won more friends for the science of astronomy than anyone or anything else in the second half of the twentieth century."
                    - paragraph [ref=f50e493]:
                      - text: In the two decades since Sagan’s death, no other scientist has achieved the same level of public recognition. Perhaps closest is the director of the Hayden Planetarium, Neil deGrasse Tyson, who followed in Sagan’s footsteps by making an updated version of the
                      - emphasis [ref=f50e494]: Cosmos
                      - text: program in 2014. Tyson is quick to point out that Sagan was his inspiration to become a scientist, telling how Sagan invited him to visit for a day at Cornell when he was a high school student looking for a career. However, the media environment has fragmented a great deal since Sagan’s time. It is interesting to speculate whether Sagan could have adapted his communication style to the world of cable television, Twitter, Facebook, and podcasts.
                  - generic [ref=f50e495]:
                    - heading "Link to Learning" [level=5] [ref=f50e496]
                    - paragraph [ref=f50e498]:
                      - text: Two imaginative videos provide a tour of the solar system objects we have been discussing. Shane Gellert’s
                      - link "I Need Some Space" [ref=f50e499]:
                        - /url: https://openstax.org/l/30needsomespace
                      - text: uses NASA photography and models to show the various worlds with which we share our system. In the more science fiction-oriented
                      - link "Wanderers" [ref=f50e500]:
                        - /url: https://openstax.org/l/30wanderers
                      - text: video, we see some of the planets and moons as tourist destinations for future explorers, with commentary taken from recordings by Carl Sagan.
                  - heading "A Scale Model of the Solar System" [level=3] [ref=f50e501]
                  - paragraph [ref=f50e502]: Astronomy often deals with dimensions and distances that far exceed our ordinary experience. What does 1.4 billion kilometers—the distance from the Sun to Saturn—really mean to anyone? It can be helpful to visualize such large systems in terms of a scale model.
                  - paragraph [ref=f50e503]:
                    - text: In our imaginations, let us build a scale model of the solar system, adopting a scale factor of 1 billion (10
                    - superscript [ref=f50e504]: "9"
                    - text: )—that is, reducing the actual solar system by dividing every dimension by a factor of 10
                    - superscript [ref=f50e505]: "9"
                    - text: . Earth, then, has a diameter of 1.3 centimeters, about the size of a grape. The Moon is a pea orbiting this at a distance of 40 centimeters, or a little more than a foot away. The Earth-Moon system fits into a standard backpack.
                  - paragraph [ref=f50e506]: In this model, the Sun is nearly 1.5 meters in diameter, about the average height of an adult, and our Earth is at a distance of 150 meters—about one city block—from the Sun. Jupiter is five blocks away from the Sun, and its diameter is 15 centimeters, about the size of a very large grapefruit. Saturn is 10 blocks from the Sun; Uranus, 20 blocks; and Neptune, 30 blocks. Pluto, with a distance that varies quite a bit during its 249-year orbit, is currently just beyond 30 blocks and getting farther with time. Most of the moons of the outer solar system are the sizes of various kinds of seeds orbiting the grapefruit, oranges, and lemons that represent the outer planets.
                  - paragraph [ref=f50e507]: In our scale model, a human is reduced to the dimensions of a single atom, and cars and spacecraft to the size of molecules. Sending the Voyager spacecraft to Neptune involves navigating a single molecule from the Earth–grape toward a lemon 5 kilometers away with an accuracy equivalent to the width of a thread in a spider’s web.
                  - paragraph [ref=f50e508]: If that model represents the solar system, where would the nearest stars be? If we keep the same scale, the closest stars would be tens of thousands of kilometers away. If you built this scale model in the city where you live, you would have to place the representations of these stars on the other side of Earth or beyond.
                  - paragraph [ref=f50e509]: By the way, model solar systems like the one we just presented have been built in cities throughout the world. In Sweden, for example, Stockholm’s huge Globe Arena has become a model for the Sun, and Pluto is represented by a 12-centimeter sculpture in the small town of Delsbo, 300 kilometers away. Another model solar system is in Washington on the Mall between the White House and Congress (perhaps proving they are worlds apart?).
                  - generic [ref=f50e510]:
                    - heading "Link to Learning" [level=5] [ref=f50e511]
                    - paragraph [ref=f50e513]:
                      - text: This
                      - link "model of the solar system" [ref=f50e514]:
                        - /url: https://openstax.org/l/30modsolsys
                      - text: shows all orbits and sizes to scale, and it lets you fly between the planets at an enhanced speed.
                  - generic [ref=f50e515]:
                    - 'heading "Making Connections: Names in the Solar System" [level=5] [ref=f50e516]'
                    - paragraph [ref=f50e518]: We humans just don’t feel comfortable until something has a name. Types of butterflies, new elements, and the mountains of Venus all need names for us to feel we are acquainted with them. How do we give names to objects and features in the solar system?
                    - paragraph [ref=f50e519]: Planets and moons are named after gods and heroes in Greek and Roman mythology (with a few exceptions among the moons of Uranus, which have names drawn from English literature). When William Herschel, a German immigrant to England, first discovered the planet we now call Uranus, he wanted to name it Georgium Sidus (George’s star) after King George III of his adopted country. This caused such an outcry among astronomers in other nations, however, that the classic tradition was upheld—and has been maintained ever since. Luckily, there were a lot of minor gods in the ancient pantheon, so plenty of names are left for the many small moons we are discovering around the giant planets. (Appendix G lists the larger moons). More recently, the names of dwarf planets and their moons have been drawn from the mythology of other cultures besides Greek and Roman.
                    - paragraph [ref=f50e520]: Comets are often named after their discoverers (offering an extra incentive to comet hunters). Asteroids are named by their discoverers after just about anyone or anything they want. Recently, asteroid names have been used to recognize people who have made significant contributions to astronomy, including the three senior authors of this book.
                    - paragraph [ref=f50e521]: That was pretty much all the naming that was needed while our study of the solar system was confined to Earth. But now, our spacecraft have surveyed and photographed many worlds in great detail, and each world has a host of features that also need names. To make sure that naming things in space remains multinational, rational, and somewhat dignified, astronomers have given the responsibility of approving names to a special committee of the International Astronomical Union (IAU), the body that includes scientists from every country that does astronomy.
                    - paragraph [ref=f50e522]:
                      - text: This IAU committee has developed a set of rules for naming features on other worlds. For example, craters on Venus are named for women who have made significant contributions to human knowledge and welfare. Volcanic features on Jupiter’s moon Io, which is in a constant state of volcanic activity, are named after gods of fire and thunder from the mythologies of many cultures. Craters on Mercury commemorate famous novelists, playwrights, artists, and composers. On Saturn’s moon Tethys, all the features are named after characters and places in Homer’s great epic poem,
                      - emphasis [ref=f50e523]: The Odyssey
                      - text: . As we explore further, it may well turn out that more places in the solar system need names than Earth history can provide. Perhaps by then, explorers and settlers on these worlds will be ready to develop their own names for the places they may (if but for a while) call home.
                    - paragraph [ref=f50e524]:
                      - text: You may be surprised to know that the meaning of the word
                      - emphasis [ref=f50e525]: planet
                      - text: has recently become controversial because we have discovered many other planetary systems that don’t look very much like our own. Even within our solar system, the planets differ greatly in size and chemical properties. The biggest dispute concerns Pluto, which is much smaller than the other eight major planets. The category of dwarf planet was invented to include Pluto and similar icy objects beyond Neptune. But is a dwarf planet also a planet? Logically, it should be, but even this simple issue of grammar has been the subject of heated debate among both astronomers and the general public.
