                  - paragraph [ref=f50e89]: The individual paths of the Moon and planets in the sky all lie close to the ecliptic, although not exactly on it. This is because the paths of the planets about the Sun, and of the Moon about Earth, are all in nearly the same plane, as if they were circles on a huge sheet of paper. The planets, the Sun, and the Moon are thus always found in the sky within a narrow 18-degree-wide belt, centered on the ecliptic, called the zodiac (Figure 2.6). (The root of the term “zodiac” is the same as that of the word “zoo” and means a collection of animals; many of the patterns of stars within the zodiac belt reminded the ancients of animals, such as a fish or a goat.)
                  - paragraph [ref=f50e90]: How the planets appear to move in the sky as the months pass is a combination of their actual motions plus the motion of Earth about the Sun; consequently, their paths are somewhat complex. As we will see, this complexity has fascinated and challenged astronomers for centuries.
                  - generic [ref=f50e91]:
                    - heading "Learning Objectives" [level=5] [ref=f50e92]
                    - paragraph [ref=f50e94]: "By the end of this section, you will be able to:"
                    - list [ref=f50e95]:
                      - listitem [ref=f50e96]: Describe how the objects in our solar system are identified, explored, and characterized
                      - listitem [ref=f50e97]: Describe the types of small bodies in our solar system, their locations, and how they formed
                      - listitem [ref=f50e98]: Model the solar system with distances from everyday life to better comprehend distances in space
                  - paragraph [ref=f50e99]:
                    - text: The solar
                    - generic [ref=f50e100]:
                      - text: system
                      - superscript [ref=f50e101]: "1"
                    - text: "consists of the Sun and many smaller objects: the planets, their moons and rings, and such “debris” as asteroids, comets, and dust. Decades of observation and spacecraft exploration have revealed that most of these objects formed together with the Sun about 4.5 billion years ago. They represent clumps of material that condensed from an enormous cloud of gas and dust. The central part of this cloud became the Sun, and a small fraction of the material in the outer parts eventually formed the other objects."
                  - paragraph [ref=f50e102]:
                    - text: During the past 50 years, we have learned more about the solar system than anyone imagined before the space age. In addition to gathering information with powerful new telescopes, we have sent spacecraft directly to many members of the planetary system. (Planetary astronomy is the only branch of our science in which we can, at least vicariously, travel to the objects we want to study.) With evocative names such as
                    - emphasis [ref=f50e103]: Voyager
                    - text: ","
                    - emphasis [ref=f50e104]: Pioneer
                    - text: ","
                    - emphasis [ref=f50e105]: Curiosity
                    - text: ", and"
                    - emphasis [ref=f50e106]: Pathfinder
                    - text: ", our robot explorers have flown past, orbited, or landed on every planet, returning images and data that have dazzled both astronomers and the public. In the process, we have also investigated two dwarf planets, hundreds of fascinating moons, four ring systems, a dozen asteroids, and several comets (smaller members of our solar system that we will discuss later)."
                  - paragraph [ref=f50e107]: Our probes have penetrated the atmosphere of Jupiter and landed on the surfaces of Venus, Mars, our Moon, Saturn’s moon Titan, the asteroids Eros, Itokawa, Ryugu, and Bennu, and the Comet Churyumov-Gerasimenko (usually referred to as 67P). Humans have set foot on the Moon and returned samples of its surface soil for laboratory analysis (Figure 7.2). We have flown a helicopter drone on Mars. We have even discovered other places in our solar system that might be able to support some kind of life.
                  - 'figure "Figure 7.2 : Astronauts on the Moon. The lunar lander and surface rover from the Apollo 15 mission are seen in this view of the one place beyond Earth that has been explored directly by humans. (credit: modification of work by David R. Scott, NASA)" [ref=f50e108]':
                    - img "Photograph of Astronauts on the Moon. At center is the landing module, and to the right is the Lunar rover used by the Astronauts to travel large distances from the landing site. At left an Astronaut salutes the American flag placed near the lander. Scattered throughout the foreground are footprints in the Lunar soil." [ref=f50e110]
                  - generic [ref=f50e112]:
                    - heading "Link to Learning" [level=5] [ref=f50e113]
