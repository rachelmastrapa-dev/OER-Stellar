                    - paragraph [ref=f50e58]: The actual time is a few minutes shorter than this, and we will explore why in a later chapter.
                  - generic [ref=f50e59]:
                    - 'heading "Exercise \\(\\PageIndex{1}\\)" [level=5] [ref=f50e60]'
                    - paragraph [ref=f50e62]: The Moon moves in the sky relative to the background stars (in addition to moving with the stars as a result of Earth’s rotation.) Go outside at night and note the position of the Moon relative to nearby stars. Repeat the observation a few hours later. How far has the Moon moved? (For reference, the diameter of the Moon is about 0.5°.) Based on your estimate of its motion, how long will it take for the Moon to return to the position relative to the stars in which you first observed it?
