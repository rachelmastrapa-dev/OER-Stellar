                    - paragraph [ref=f50e19]: This is true whether the motion is measured in kilometers per hour or degrees per hour; we just need to use consistent units.
                    - paragraph [ref=f50e20]: As an example, let’s say you notice the bright star Sirius due south from your observing location in the Northern Hemisphere. You note the time, and then later, you note the time that Sirius sets below the horizon. You find that Sirius has traveled an angular distance of about 75° in 5 h. About how many hours will it take for Sirius to return to its original location?
