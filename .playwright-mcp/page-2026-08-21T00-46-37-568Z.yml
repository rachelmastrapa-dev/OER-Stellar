                      - generic [ref=f50e530]:
                        - text: The generic term for a group of planets and other bodies circling a star is
                        - emphasis [ref=f50e531]: planetary system
                        - text: . Ours is called the
                        - emphasis [ref=f50e532]: solar system
                        - text: because our Sun is sometimes called
