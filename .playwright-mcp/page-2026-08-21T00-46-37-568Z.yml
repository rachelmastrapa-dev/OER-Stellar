                  - heading "Fixed and Wandering Stars" [level=3] [ref=f50e2]
                  - paragraph [ref=f50e3]:
                    - text: The Sun is not the only object that moves among the fixed stars. The Moon and each of the planets that are visible to the unaided eye—Mercury, Venus, Mars, Jupiter, Saturn, and Uranus (although just barely)—also change their positions slowly from day to day. During a single day, the Moon and planets all rise and set as Earth turns, just as the Sun and stars do. But like the Sun, they have independent motions among the stars, superimposed on the daily rotation of the celestial sphere. Noticing these motions, the Greeks of 2000 years ago distinguished between what they called the
                    - emphasis [ref=f50e4]: fixed stars
                    - text: —those that maintain fixed patterns among themselves through many generations—and the
                    - emphasis [ref=f50e5]: wandering stars
                    - text: ", or planets. The word “planet,” in fact, means “wanderer” in ancient Greek."
                  - paragraph [ref=f50e6]:
                    - text: Today, we do not regard the Sun and Moon as planets, but the ancients applied the term to all seven of the moving objects in the sky. Much of ancient astronomy was devoted to observing and predicting the motions of these celestial wanderers. They even dedicated a unit of time, the week, to the seven objects that move on their own; that’s why there are 7 days in a week. The Moon, being Earth’s nearest celestial neighbor, has the fastest apparent motion; it completes a trip around the sky in about 1 month (or
                    - emphasis [ref=f50e7]: moonth
                    - text: ). To do this, the Moon moves about 12°, or 24 times its own apparent width on the sky, each day.
                  - generic [ref=f50e8]:
                    - 'heading "Example 2.1: Angles in the Sky" [level=5] [ref=f50e9]'
                    - paragraph [ref=f50e11]: "A circle consists of 360 degrees (°). When we measure the angle in the sky that something moves, we can use this formula:"
