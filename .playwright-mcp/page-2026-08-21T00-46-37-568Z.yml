                  - paragraph [ref=f50e147]: Table 7.1 also shows that most of the material of the planets is actually concentrated in the largest one, Jupiter, which is more massive than all the rest of the planets combined. Astronomers were able to determine the masses of the planets centuries ago using Kepler’s laws of planetary motion and Newton’s law of gravity to measure the planets’ gravitational effects on one another or on moons that orbit them (see Orbits and Gravity). Today, we make even more precise measurements of their masses by tracking their gravitational effects on the motion of spacecraft that pass near them.
                  - paragraph [ref=f50e148]:
                    - text: "Beside Earth, five other planets were known to the ancients—Mercury, Venus, Mars, Jupiter, and Saturn—and two were discovered after the invention of the telescope: Uranus and Neptune. The eight planets all revolve in the same direction around the Sun. They orbit in approximately the same plane, like cars traveling on concentric tracks on a giant, flat racecourse. Each planet stays in its own “traffic lane,” following a nearly circular orbit about the Sun and obeying the “traffic” laws discovered by Galileo, Kepler, and Newton. Besides these planets, we have also been discovering smaller worlds beyond Neptune that are called trans-Neptunian objects or TNOs (see Figure 7.3). The first to be found, in 1930, was Pluto, but others have been discovered during the twenty-first century. One of them, Eris, is about the same size as Pluto and has at least one moon (Pluto has five known moons.) The largest TNOs are also classed as"
                    - emphasis [ref=f50e149]: dwarf planets,
                    - text: as is the largest asteroid, Ceres. (Dwarf planets will be discussed further in the chapter on Rings, Moons, and Pluto). To date, more than 2600 of these TNOs have been discovered, and one, called Arrokoth, was explored by the New Horizons spacecraft.
                  - 'figure "Figure 7.3 : Orbits of the Planets. All eight major planets orbit the Sun in roughly the same plane. The five currently known dwarf planets are also shown: Eris, Haumea, Pluto, Ceres, and Makemake. Note that Pluto’s orbit is not in the plane of the planets." [ref=f50e150]':
                    - img "Diagram of the Orbits of the Planets and the five known Dwarf-Planets. The orbits of each object is shown as a blue ellipse. All eight major planets and the asteroids orbit the Sun in roughly the same plane, but the orbits of the outer dwarf planets do not. The objects plotted in the diagram moving outward from the Sun are Mercury, Venus, Earth, Mars, Ceres, Jupiter, Saturn, Uranus, Neptune, Pluto, Haumea, Makemake, and Eris." [ref=f50e152]
