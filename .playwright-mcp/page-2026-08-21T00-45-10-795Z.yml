                  - heading "Locating Places in the Sky" [level=3] [ref=f41e78]
                  - paragraph [ref=f41e79]:
                    - text: "Positions in the sky are measured in a way that is very similar to the way we measure positions on the surface of Earth. Instead of latitude and longitude, however, astronomers use coordinates called declination and right ascension. To denote positions of objects in the sky, it is often convenient to make use of the fictitious celestial sphere. We saw in Observing the Sky: The Birth of Astronomy that the sky appears to rotate about points above the North and South Poles of Earth—points in the sky called the north celestial pole and the south celestial pole. Halfway between the celestial poles, and thus 90° from each pole, is the"
                    - emphasis [ref=f41e80]: celestial equator,
                    - text: a great circle on the celestial sphere that is in the same plane as Earth’s equator. We can use these markers in the sky to set up a system of celestial coordinates.
                  - paragraph [ref=f41e81]: "Declination on the celestial sphere is measured the same way that latitude is measured on the sphere of Earth: from the celestial equator toward the north (positive) or south (negative). So Polaris, the star near the north celestial pole, has a declination of almost +90°."
                  - paragraph [ref=f41e82]:
                    - text: Right ascension (RA) is like longitude, except that instead of Greenwich, the arbitrarily chosen point where we start counting is the
                    - emphasis [ref=f41e83]: vernal equinox
                    - text: ", a point in the sky where the"
                    - emphasis [ref=f41e84]: ecliptic
                    - text: (the Sun’s path) crosses the celestial equator. RA can be expressed either in units of angle (degrees) or in units of time. This is because the celestial sphere appears to turn around Earth once a day as our planet turns on its axis. Thus the 360° of RA that it takes to go once around the celestial sphere can just as well be set equal to 24 hours. Then each 15° of arc is equal to 1 hour of time. For example, the approximate celestial coordinates of the bright star Capella are RA
