                  - generic [ref=f41e2]:
                    - heading "Learning Objectives" [level=5] [ref=f41e3]
                    - paragraph [ref=f41e5]: "By the end of this section, you will be able to:"
                    - list [ref=f41e6]:
                      - listitem [ref=f41e7]: Describe how latitude and longitude are used to map Earth
                      - listitem [ref=f41e8]: Explain how right ascension and declination are used to map the sky
                  - paragraph [ref=f41e9]:
                    - text: In order to create an accurate map, a mapmaker needs a way to uniquely and simply identify the location of all the major features on the map, such as cities or natural landmarks. Similarly, astronomical mapmakers need a way to uniquely and simply identify the location of stars, galaxies, and other celestial objects. On Earth maps, we divide the surface of Earth into a grid, and each location on that grid can easily be found using its
                    - emphasis [ref=f41e10]: latitude
                    - text: and
                    - emphasis [ref=f41e11]: longitude
                    - text: coordinate. Astronomers have a similar system for objects on the sky. Learning about these can help us understand the apparent motion of objects in the sky from various places on Earth.
                  - heading "Locating Places on Earth" [level=3] [ref=f41e12]
                  - paragraph [ref=f41e13]: "Let’s begin by fixing our position on the surface of planet Earth. As we discussed in Observing the Sky: The Birth of Astronomy, Earth’s axis of rotation defines the locations of its North and South Poles and of its equator, halfway between. Two other directions are also defined by Earth’s motions: east is the direction toward which Earth rotates, and west is its opposite. At almost any point on Earth, the four directions—north, south, east, and west—are well defined, despite the fact that our planet is round rather than flat. The only exceptions are exactly at the North and South Poles, where the directions east and west are ambiguous (because points exactly at the poles do not turn)."
                  - paragraph [ref=f41e14]: We can use these ideas to define a system of coordinates attached to our planet. Such a system, like the layout of streets and avenues in Manhattan or Salt Lake City, helps us find where we are or want to go. Coordinates on a sphere, however, are a little more complicated than those on a flat surface. We must define circles on the sphere that play the same role as the rectangular grid that you see on city maps.
                  - paragraph [ref=f41e15]: A great circle is any circle on the surface of a sphere whose center is at the center of the sphere. For example, Earth’s equator is a great circle on Earth’s surface, halfway between the North and South Poles. We can also imagine a series of great circles that pass through both the North and South Poles. Each of the circles is called a meridian; they are each perpendicular to the equator, crossing it at right angles.
                  - paragraph [ref=f41e16]: Any point on the surface of Earth will have a meridian passing through it (Figure 4.2). The meridian specifies the east-west location, or longitude, of the place. By international agreement (and it took many meetings for the world’s countries to agree), longitude is defined as the number of degrees of arc along the equator between your meridian and the one passing through Greenwich, England, which has been designated as the Prime Meridian. The longitude of the Prime Meridian is defined as 0°.
                  - 'figure "Figure 4.2 : Latitude and Longitude of Washington, DC. We use latitude and longitude to find cities like Washington, DC, on a globe. Latitude is the number of degrees north or south of the equator, and longitude is the number of degrees east or west of the Prime Meridian. Washington, DC’s coordinates are 38° N and 77° W." [ref=f41e17]':
                    - img "On this illustration of the Earth, roughly centered on the North Atlantic, lines of latitude and longitude are drawn in white. The lines of longitude are parallel with the equator, which is indicated with an arrow at lower right. The “Prime Meridian of longitude” is indicated with an arrow at upper right. A grey arrow, labeled “Latitude”, is drawn northward from the equator in South America to intersect with a grey arrow, labeled “Longitude”, that is drawn westward from the prime meridian. At the intersection of these arrows, “Washington D.C.” is labeled." [ref=f41e19]
                  - paragraph [ref=f41e21]: Why Greenwich, you might ask? Every country wanted 0° longitude to pass through its own capital. Greenwich, the site of the old Royal Observatory (Figure 4.3), was selected because it was between continental Europe and the United States, and because it was the site for much of the development of the method to measure longitude at sea. Longitudes are measured either to the east or to the west of the Greenwich meridian from 0° to 180°. As an example, the longitude of the clock-house benchmark of the U.S. Naval Observatory in Washington, DC, is 77.066° W.
                  - paragraph [ref=f41e22]
                  - paragraph [ref=f41e23]: Your latitude (or north-south location) is the number of degrees of arc you are away from the equator along your meridian. Latitudes are measured either north or south of the equator from 0° to 90°. (The latitude of the equator is 0°.) As an example, the latitude of the previously mentioned Naval Observatory benchmark is 38.921° N. The latitude of the South Pole is 90° S, and the latitude of the North Pole is 90° N.
                  - heading "The Length of the Day" [level=3] [ref=f41e24]
                  - paragraph [ref=f41e25]: The most fundamental astronomical unit of time is the day, measured in terms of the rotation of Earth. There is, however, more than one way to define the day. Usually, we think of it as the rotation period of Earth with respect to the Sun, called the solar day. After all, for most people sunrise is more important than the rising time of Arcturus or some other star, so we set our clocks to some version of Sun-time. However, astronomers also use a sidereal day, which is defined in terms of the rotation period of Earth with respect to the stars.
                  - paragraph [ref=f41e26]: A solar day is slightly longer than a sidereal day because (as you can see from Figure 4.10) Earth not only turns but also moves along its path around the Sun in a day. Suppose we start when Earth’s orbital position is at day 1, with both the Sun and some distant star (located in the direction indicated by the long white arrow pointing left), directly in line with the zenith for the observer on Earth. When Earth has completed one rotation with respect to the distant star and is at day 2, the long arrow again points to the same distant star. However, notice that because of the movement of Earth along its orbit from day 1 to 2, the Sun has not yet reached a position above the observer. To complete a solar day, Earth must rotate an additional amount, equal to 1/365 of a full turn. The time required for this extra rotation is 1/365 of a day, or about 4 minutes. So the solar day is about 4 minutes longer than the sidereal day.
                  - 'figure "Figure 4.10 : Difference Between a Sidereal Day and a Solar Day. This is a top view, looking down as Earth orbits the Sun. Because Earth moves around the Sun (roughly 1° per day), after one complete rotation of Earth relative to the stars, we do not see the Sun in the same position." [ref=f41e27]':
                    - img "The Sun is drawn at left as a yellow disc and the Earth is drawn at two positions at far right. The lower position labeled “Earth, day 1” shows an observer looking up at the Sun, whose line of sight indicated by a white arrow connecting the Earth to the Sun. A clockwise arrow is drawn circling the Earth. The upper position labeled “Earth, day 2” shows the observer looking up again one day later. (A short curved arrow pointing clockwise is drawn from the observer’s line of sight to indicate the direction of Earth’s rotation.) Due to the motion of Earth along its orbit, the observer’s line of sight no longer points to the Sun but now points “To remote point on celestial sphere”. A dashed line connects the observer’s position on day 2 to the Sun as seen on day 1. The angle between the new line of sight and the previous line of sight to the Sun is labeled '1°''" [ref=f41e29]
                  - paragraph [ref=f41e31]: Because our ordinary clocks are set to solar time, stars rise 4 minutes earlier each day. Astronomers prefer sidereal time for planning their observations because in that system, a star rises at the same time every day.
                  - generic [ref=f41e32]:
                    - 'heading "Example 4.3: Sidereal Time and Solar Time" [level=5] [ref=f41e33]'
                    - paragraph [ref=f41e35]:
                      - text: The Sun makes a complete circle in the sky approximately every 24 hours, while the stars make a complete circle in the sky in 4 minutes less time, or 23 hours and 56 minutes. This causes the positions of the stars at a given time of day or night to change slightly each day. Since stars rise 4 minutes earlier each day, that works out to about 2 hours per month
                      - math [ref=f41e36]:
