                  - heading "The Seasons" [level=2] [ref=f41e109]
                  - generic [ref=f41e110]:
                    - heading "Learning Objectives" [level=5] [ref=f41e111]
                    - paragraph [ref=f41e113]: "By the end of this section, you will be able to:"
                    - list [ref=f41e114]:
                      - listitem [ref=f41e115]: Describe how the tilt of Earth’s axis causes the seasons
                      - listitem [ref=f41e116]: Explain how seasonal differences on Earth vary with latitude
                  - paragraph [ref=f41e117]:
                    - text: One of the fundamental facts of life at Earth’s midlatitudes, where most of this book’s readers live, is that there are significant variations in the heat we receive from the Sun during the course of the year. We thus divide the year into
                    - emphasis [ref=f41e118]: seasons
                    - text: ", each with its different amount of sunlight. The difference between seasons gets more pronounced the farther north or south from the equator we travel, and the seasons in the Southern Hemisphere are the opposite of what we find on the northern half of Earth. With these observed facts in mind, let us ask what causes the seasons."
                  - paragraph [ref=f41e119]: "Many people have believed that the seasons were the result of the changing distance between Earth and the Sun. This sounds reasonable at first: it should be colder when Earth is farther from the Sun. But the facts don’t bear out this hypothesis. Although Earth’s orbit around the Sun is an ellipse, its distance from the Sun varies by only about 3%. That’s not enough to cause significant variations in the Sun’s heating. To make matters worse for people in North America who hold this hypothesis, Earth is actually closest to the Sun in January, when the Northern Hemisphere is in the middle of winter. And if distance were the governing factor, why would the two hemispheres have opposite seasons? As we shall show, the seasons are actually caused by the 23.5° tilt of Earth’s axis."
                  - heading "The Seasons and Sunshine" [level=3] [ref=f41e120]
                  - paragraph [ref=f41e121]: "Figure 4.5 shows Earth’s annual path around the Sun, with Earth’s axis tilted by 23.5°. Note that our axis continues to point the same direction in the sky throughout the year. As Earth travels around the Sun, in June the Northern Hemisphere “leans into” the Sun and is more directly illuminated. In December, the situation is reversed: the Southern Hemisphere leans into the Sun, and the Northern Hemisphere leans away. In September and March, Earth leans “sideways”—neither into the Sun nor away from it—so the two hemispheres are equally favored with sunshine."
                  - figure [ref=f41e122]:
                    - img "Earth’s Seasons. This illustration shows the Earth at four positions along its orbit around the Sun, which is drawn in the center of the orbit indicated by circular arrows. At left, the Earth is shown at “Summer Solstice June 21”, and has its northern axis of rotation (tilted 23-degrees from vertical) pointing toward the Sun. At bottom center, the Earth is at “Autumnal Equinox September 21”, with the northern rotation axis pointing toward the right. At right, the Earth is shown at “Winter Solstice December 21”, with the northern axis of rotation pointing away from the Sun. Finally, at top, the Earth is shown at “Vernal Equinox March 21”, with the northern rotation axis pointing toward the right." [ref=f41e124]
                    - generic [ref=f41e125]:
                      - text: "Figure 4.5 : Seasons. We see Earth at different seasons as it circles the Sun. In June, the Northern Hemisphere “leans into” the Sun, and those in the North experience summer and have longer days. In December, during winter in the Northern Hemisphere, the Southern Hemisphere “leans into” the Sun and is illuminated more directly. In spring and autumn, the two hemispheres receive more equal shares of sunlight."
                      - superscript [ref=f41e126]: "1"
                  - paragraph [ref=f41e127]: How does the Sun’s favoring one hemisphere translate into making it warmer for us down on the surface of Earth? There are two effects we need to consider. When we lean into the Sun, sunlight hits us at a more direct angle and is more effective at heating Earth’s surface (Figure 4.6). You can get a similar effect by shining a flashlight onto a wall. If you shine the flashlight straight on, you get an intense spot of light on the wall. But if you hold the flashlight at an angle (if the wall “leans out” of the beam), then the spot of light is more spread out. Like the straight-on light, the sunlight in June is more direct and intense in the Northern Hemisphere, and hence more effective at heating.
                  - 'figure "Figure 4.6 : The Sun’s Rays in Summer and Winter. (a) In summer, the Sun appears high in the sky and its rays hit Earth more directly, spreading out less. (b) In winter, the Sun is low in the sky and its rays spread out over a much wider area, becoming less effective at heating the ground." [ref=f41e128]':
                    - img "The Sun’s Rays in Summer and Winter. Panel (a), at left, illustrates how sunlight strikes the Earth’s surface in Summer. Five parallel yellow arrows, labeled “1 m2”, are drawn pointing downward at a 73-degree angle relative to the ground. Where the arrows strike the ground, a scale is drawn spanning the width of the arrows that reads “1.04 m2”. In panel (b), at right, illustrates how sunlight strikes the Earth’s surface in Winter. The five arrows are now drawn at 26-degrees relative to the ground. Where the arrows strike the ground, a scale is drawn spanning the width of the arrows that reads “2.24 m2”. Thus one square meter of sunlight falls on over twice the surface area in winter vs. summer." [ref=f41e130]
                  - paragraph [ref=f41e132]: The second effect has to do with the length of time the Sun spends above the horizon (Figure 4.7). Even if you’ve never thought about astronomy before, we’re sure you have observed that the hours of daylight increase in summer and decrease in winter. Let’s see why this happens.
                  - 'figure "Figure 4.7 : The Sun’s Path in the Sky for Different Seasons. On June 21, the Sun rises north of east and sets north of west. For observers in the Northern Hemisphere of Earth, the Sun spends about 15 hours above the horizon in the United States, meaning more hours of daylight. On December 21, the Sun rises south of east and sets south of west. It spends 9 hours above the horizon in the United States, which means fewer hours of daylight and more hours of night in northern lands (and a strong need for people to hold celebrations to cheer themselves up). On March 21 and September 21, the Sun spends equal amounts of time above and below the horizon in both hemispheres." [ref=f41e133]':
                    - img [ref=f41e135]
                  - paragraph [ref=f41e137]: "As we saw in Observing the Sky: The Birth of Astronomy, an equivalent way to look at our path around the Sun each year is to pretend that the Sun moves around Earth (on a circle called the ecliptic). Because Earth’s axis is tilted, the ecliptic is tilted by about 23.5° relative to the celestial equator (review Figure 2.7). As a result, where we see the Sun in the sky changes as the year wears on."
                  - paragraph [ref=f41e138]: In June, the Sun is north of the celestial equator and spends more time with those who live in the Northern Hemisphere. It rises high in the sky and is above the horizon in the United States for as long as 15 hours. Thus, the Sun not only heats us with more direct rays, but it also has more time to do it each day. (Notice in Figure 4.7 that the Northern Hemisphere’s gain is the Southern Hemisphere’s loss. There the June Sun is low in the sky, meaning fewer daylight hours. In Chile, for example, June is a colder, darker time of year.) In December, when the Sun is south of the celestial equator, the situation is reversed.
                  - generic [ref=f41e139]:
                    - heading "Link to Learning" [level=5] [ref=f41e140]
                    - paragraph [ref=f41e142]:
                      - text: The
                      - link "Motions of the Sun Simulator" [ref=f41e143]:
                        - /url: https://openstax.org/l/30motionsunsim
                      - text: from Columbia University's Center for Teaching and Learning provides a demonstration of the Sun's apparent motion in the sky as the Earth rotates each day, and its changing altitude with latitude and time of year.
                  - paragraph [ref=f41e144]:
                    - text: Let’s look at what the Sun’s illumination on Earth looks like at some specific dates of the year, when these effects are at their maximum. On or about June 21 (the date we who live in the Northern Hemisphere call the
                    - emphasis [ref=f41e145]: summer solstice
                    - text: or sometimes the first day of summer), the Sun shines down most directly upon the Northern Hemisphere of Earth. It appears about 23° north of the equator, and thus, on that date, it passes through the zenith of places on Earth that are at 23° N latitude. The situation is shown in detail in Figure 4.8. To a person at 23° N (near Hawaii, for example), the Sun is directly overhead at noon. This latitude, where the Sun can appear at the zenith at noon on the first day of summer, is called the
                    - emphasis [ref=f41e146]: Tropic of Cancer
                    - text: .
                  - paragraph [ref=f41e147]:
                    - text: We also see in Figure 4.8 that the Sun’s rays shine down all around the North Pole at the solstice. As Earth turns on its axis, the North Pole is continuously illuminated by the Sun; all places within 23° of the pole have sunshine for 24 hours. The Sun is as far north on this date as it can get; thus, 90° – 23° (or 67° N) is the southernmost latitude where the Sun can be seen for a full 24-hour period (sometimes called the “land of the midnight Sun”). That circle of latitude is called the
                    - emphasis [ref=f41e148]: Arctic Circle
                    - text: .
                  - 'figure "Figure 4.8 : Earth on June 21. This is the date of the summer solstice in the Northern Hemisphere. Note that as Earth turns on its axis (the line connecting the North and South Poles), the North Pole is in constant sunlight while the South Pole is veiled in 24 hours of darkness. The Sun is at the zenith for observers on the Tropic of Cancer." [ref=f41e149]':
                    - 'img "The Summer Solstice – June 21. The Earth is drawn with its axis of rotation, labeled “Earth axis”, pointing toward upper left. Sunlight is drawn as three red arrows coming from the left and striking the surface of the Earth. On the right-hand side of the figure, the five important circles of latitude are labeled. Starting from the bottom are: “Antarctic Circle”, “Tropic of Capricorn”, “Equator”, “Tropic of Cancer” and “Arctic Circle”." [ref=f41e151]'
                  - paragraph [ref=f41e153]: Many early cultures scheduled special events around the summer solstice to celebrate the longest days and thank their gods for making the weather warm. This required people to keep track of the lengths of the days and the northward trek of the Sun in order to know the right day for the “party.” (You can do the same thing by watching for several weeks, from the same observation point, where the Sun rises or sets relative to a fixed landmark. In spring, the Sun will rise farther and farther north of east, and set farther and farther north of west, reaching the maximum around the summer solstice.)
                  - paragraph [ref=f41e154]:
                    - text: Now look at the South Pole in Figure 4.8. On June 21, all places within 23° of the South Pole—that is, south of what we call the
                    - emphasis [ref=f41e155]: Antarctic Circle
                    - text: —do not see the Sun at all for 24 hours.
                  - paragraph [ref=f41e156]:
                    - text: The situation is reversed 6 months later, about December 21 (the date of the
                    - emphasis [ref=f41e157]: winter solstice
                    - text: ", or the first day of winter in the Northern Hemisphere), as shown in Figure 4.9. Now it is the Arctic Circle that has the 24-hour night and the Antarctic Circle that has the midnight Sun. At latitude 23° S, called the"
                    - emphasis [ref=f41e158]: Tropic of Capricorn
                    - text: ", the Sun passes through the zenith at noon. Days are longer in the Southern Hemisphere and shorter in the north. In the United States and Southern Europe, there may be only 9 or 10 hours of sunshine during the day. It is winter in the Northern Hemisphere and summer in the Southern Hemisphere."
                  - 'figure "Figure 4.9 : Earth on December 21. This is the date of the winter solstice in the Northern Hemisphere. Now the North Pole is in darkness for 24 hours and the South Pole is illuminated. The Sun is at the zenith for observers on the Tropic of Capricorn and thus is low in the sky for the residents of the Northern Hemisphere." [ref=f41e159]':
                    - 'img "The Winter Solstice – December 21. The Earth is drawn with its axis of rotation, labeled “Earth axis”, pointing toward upper right. Sunlight is drawn as three red arrows coming from the left and striking the surface of the Earth. On the right-hand side of the figure, the five important circles of latitude are labeled. Starting from the bottom are: “Antarctic Circle”, “Tropic of Capricorn”, “Equator”, “Tropic of Cancer” and “Arctic Circle”." [ref=f41e161]'
                  - generic [ref=f41e163]:
                    - 'heading "Example 4.1: Seasonal Variations" [level=5] [ref=f41e164]'
                    - paragraph [ref=f41e166]: As you can see in Figure 4.8, the Tropic of Cancer is the latitude for which the Sun is directly overhead on the summer solstice. At this time, the Sun is at a declination of 23° N of the celestial equator, and the corresponding latitude on Earth is 23° N of the equator. If Earth were tilted a bit less, then the Tropic of Cancer would be at a lower latitude, closer to the equator.
                    - paragraph [ref=f41e167]: The Arctic Circle marks the southernmost latitude for which the day length is 24 hours on the day of the summer solstice. This is located at 90° – 23° = 67° N of Earth’s equator. If Earth were tilted a bit less, then the Arctic Circle would move farther North. In the limit at which Earth is not tilted at all (its axis is perpendicular to the ecliptic), the Tropic of Cancer would be right on Earth’s equator, and the Arctic Circle would simply be the North Pole. Suppose the tilt of Earth’s axis were tilted only 5°. What would be the effect on the seasons and the locations of the Tropic of Cancer and Arctic Circle?
                    - heading "Solution" [level=6] [ref=f41e168]
                    - paragraph [ref=f41e169]: If Earth were tilted less, the seasons would be less extreme. The variation in day length and direct sunlight would be very small over the course of a year, and the Sun’s daily path in the sky would not vary much. If Earth were tilted by 5°, the Sun’s position on the day of the summer solstice would be 5° N of the celestial equator, so the Tropic of Cancer would be at the corresponding latitude on Earth of 5° N of the Equator. The Arctic Circle would be located at 90° – 5° = 85° N of the equator.
                  - generic [ref=f41e170]:
                    - 'heading "Exercise \\(\\PageIndex{1}\\)" [level=5] [ref=f41e171]'
                    - paragraph [ref=f41e173]: Suppose the tilt of Earth’s axis were 16°. What, then, would be the difference in latitude between the Arctic Circle and the Tropic of Cancer? What would be the effect on the seasons compared with that produced by the actual tilt of 23°?
                    - generic [ref=f41e174]:
                      - term [ref=f41e175]:
                        - strong [ref=f41e176]: Answer
                      - definition [ref=f41e177]:
                        - paragraph [ref=f41e178]
                        - paragraph [ref=f41e179]: The Tropic of Cancer is at a latitude equal to Earth’s tilt, so in this case, it would be at 16° N latitude. The Arctic Circle is at a latitude equal to 90° minus Earth’s tilt, or 90° – 16° = 74°. The difference between these two latitudes is 74° – 16° = 58°. Since the tilt of Earth is less, there would be less variation in the tilt of Earth and less variation in the Sun’s paths throughout the year, so there would be milder seasonal changes.
                  - generic [ref=f41e180]:
                    - heading "Link to Learning" [level=5] [ref=f41e181]
                    - paragraph [ref=f41e183]:
                      - text: The Columbia University’s Center for Teaching and Learning’s
                      - link "Motions of the Sun Simulator" [ref=f41e184]:
                        - /url: https://openstax.org/l/30motionsunsim
                      - text: allows you to see how the Sun’s changing altitude over the course of the year changes the intensity of lighting experienced on Earth. Select the “Step by day” option before running the animation to illustrate this effect.
                  - paragraph [ref=f41e185]: Many cultures that developed some distance north of the equator have a celebration around December 21 to help people deal with the depressing lack of sunlight and the often dangerously cold temperatures. Originally, this was often a time for huddling with family and friends, for sharing the reserves of food and drink, and for rituals asking the gods to return the light and heat and turn the cycle of the seasons around. Many cultures constructed elaborate devices for anticipating when the shortest day of the year was coming. Stonehenge in England, built long before the invention of writing, is probably one such device. In our own time, we continue the winter solstice tradition with various holiday celebrations around that December date.
                  - paragraph [ref=f41e186]:
                    - text: Halfway between the solstices, on about March 21 and September 21, the Sun is on the celestial equator. From Earth, it appears above our planet’s equator and favors neither hemisphere. Every place on Earth then receives roughly 12 hours of sunshine and 12 hours of night. The points where the Sun crosses the celestial equator are called the
                    - emphasis [ref=f41e187]: vernal
                    - text: (spring) and
                    - emphasis [ref=f41e188]: autumnal
                    - text: (fall)
                    - emphasis [ref=f41e189]: equinoxes
                    - text: .
                  - heading "The Seasons at Different Latitudes" [level=3] [ref=f41e190]
                  - paragraph [ref=f41e191]: The seasonal effects are different at different latitudes on Earth. Near the equator, for instance, all seasons are much the same. Every day of the year, the Sun is up half the time, so there are approximately 12 hours of sunshine and 12 hours of night. Local residents define the seasons by the amount of rain (wet season and dry season) rather than by the amount of sunlight. As we travel north or south, the seasons become more pronounced, until we reach extreme cases in the Arctic and Antarctic.
                  - paragraph [ref=f41e192]: At the North Pole, all celestial objects that are north of the celestial equator are always above the horizon and, as Earth turns, circle around parallel to it. The Sun is north of the celestial equator from about March 21 to September 21, so at the North Pole, the Sun rises when it reaches the vernal equinox and sets when it reaches the autumnal equinox. Each year there are 6 months of sunshine at each pole, followed by 6 months of darkness.
                  - generic [ref=f41e193]:
                    - 'heading "Example 4.2: The Position of the Sun in the Sky" [level=5] [ref=f41e194]'
                    - paragraph [ref=f41e196]: The Sun’s coordinates on the celestial sphere range from a declination of 23° N of the celestial equator (or +23°) to a declination 23° S of the celestial equator (or –23°). So, the Sun’s altitude at noon, when it crosses the meridian, varies by a total of 46°. What is the altitude of the Sun at noon on March 21, as seen from a place on Earth’s equator? What is its altitude on June 21, as seen from a place on Earth’s equator?
                    - heading "Solution" [level=6] [ref=f41e197]
                    - paragraph [ref=f41e198]: On Earth’s equator, the celestial equator passes through the zenith. On March 21, the Sun is crossing the celestial equator, so it should be found at the zenith (90°) at noon. On June 21, the Sun is 23° N of the celestial equator, so it will be 23° away from the zenith at noon. The altitude above the horizon will be 23° less than the altitude of the zenith (90°), so it is 90° – 23° = 67° above the horizon.
                  - generic [ref=f41e199]:
                    - 'heading "Exercise \\(\\PageIndex{1}\\)" [level=5] [ref=f41e200]'
                    - paragraph [ref=f41e202]: What is the altitude of the Sun at noon on December 21, as seen from a place on the Tropic of Cancer?
                    - generic [ref=f41e203]:
                      - term [ref=f41e204]:
                        - strong [ref=f41e205]: Answer
                      - definition [ref=f41e206]:
                        - paragraph [ref=f41e207]
                        - paragraph [ref=f41e208]: On the day of the winter solstice, the Sun is located about 23° S of the celestial equator. From the Tropic of Cancer, a latitude of 23° N, the zenith would be a declination of 23° N. The difference in declination between zenith and the position of the Sun is 46°, so the Sun would be 46° away from the zenith. That means it would be at an altitude of 90° – 46° = 44°.
                  - heading "Clarifications about the Real World" [level=3] [ref=f41e209]
                  - paragraph [ref=f41e210]:
                    - text: In our discussions so far, we have been describing the rising and setting of the Sun and stars as they would appear if Earth had little or no atmosphere. In reality, however, the atmosphere has the curious effect of allowing us to see a little way “over the horizon.” This effect is a result of
                    - emphasis [ref=f41e211]: refraction
                    - text: ", the bending of light passing through air or water, something we will discuss in Astronomical Instruments. Because of this atmospheric refraction (and the fact that the Sun is not a point of light but a disk), the Sun appears to rise earlier and to set later than it would if no atmosphere were present."
                  - paragraph [ref=f41e212]: In addition, the atmosphere scatters light and provides some twilight illumination even when the Sun is below the horizon. Astronomers define morning twilight as beginning when the Sun is 18° below the horizon, and evening twilight extends until the Sun sinks more than 18° below the horizon.
                  - paragraph [ref=f41e213]: These atmospheric effects require small corrections in many of our statements about the seasons. At the equinoxes, for example, the Sun appears to be above the horizon for a few minutes longer than 12 hours, and below the horizon for fewer than 12 hours. These effects are most dramatic at Earth’s poles, where the Sun actually can be seen more than a week before it reaches the celestial equator.
                  - paragraph [ref=f41e214]: You probably know that the summer solstice (June 21) is not the warmest day of the year, even if it is the longest. The hottest months in the Northern Hemisphere are July and August. This is because our weather involves the air and water covering Earth’s surface, and these large reservoirs do not heat up instantaneously. You have probably observed this effect for yourself; for example, a pond does not get warm the moment the Sun rises but is warmest late in the afternoon, after it has had time to absorb the Sun’s heat. In the same way, Earth gets warmer after it has had a chance to absorb the extra sunlight that is the Sun’s summer gift to us. And the coldest times of winter are a month or more after the winter solstice.
                  - heading "Footnotes" [level=3] [ref=f41e215]
