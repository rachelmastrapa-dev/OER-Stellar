            - application "Rich Text Editor, editarea" [ref=f274e319]:
              - iframe [active] [ref=f274e320]:
                - generic [active] [ref=f276e1]:
                  - heading "The Colors of Stars" [level=2] [ref=f276e2]
                  - paragraph [ref=f276e3]:
                    - text: Look at the beautiful picture of the stars in the Sagittarius Star Cloud shown in Figure 17.3. The stars show a multitude of colors, including red, orange, yellow, white, and blue. As we have seen, stars are not all the same color because they do not all have identical temperatures. To define
                    - emphasis [ref=f276e4]: color
                    - text: precisely, astronomers have devised quantitative methods for characterizing the color of a star and then using those colors to determine stellar temperatures. In the chapters that follow, we will provide the temperature of the stars we are describing, and this section tells you how those temperatures are determined from the colors of light the stars give off.
                  - 'figure "Figure 17.3 : Sagittarius Star Cloud. This image, which was taken by the Hubble Space Telescope, shows stars in the direction toward the center of the Milky Way Galaxy. The bright stars glitter like colored jewels on a black velvet background. The color of a star indicates its temperature. Blue-white stars are much hotter than the Sun, whereas red stars are cooler. On average, the stars in this field are at a distance of about 25,000 light-years (which means it takes light 25,000 years to traverse the distance from them to us) and the width of the field is about 13.3 light-years. (credit: Hubble Heritage Team (AURA/STScI/NASA))" [ref=f276e5]':
                    - img "Hubble Space Telescope image of the Sagittarius Star Cloud. The image shows many stars of various colors, white, blue, red and yellow spread over a black background. The most common star colors in this image are red and yellow." [ref=f276e7]
                  - heading "Color and Temperature" [level=3] [ref=f276e9]
                  - paragraph [ref=f276e10]: "As we learned in The Electromagnetic Spectrum section, Wien’s law relates stellar color to stellar temperature. Blue colors dominate the visible light output of very hot stars (with much additional radiation in the ultraviolet). On the other hand, cool stars emit most of their visible light energy at red wavelengths (with more radiation coming off in the infrared) (Table 17.1). The color of a star therefore provides a measure of its intrinsic or true surface temperature (apart from the effects of reddening by interstellar dust, which will be discussed in Between the Stars: Gas and Dust in Space). Color does not depend on the distance to the object. This should be familiar to you from everyday experience. The color of a traffic signal, for example, appears the same no matter how far away it is. If we could somehow take a star, observe it, and then move it much farther away, its apparent brightness (magnitude) would change. But this change in brightness is the same for all wavelengths, and so its color would remain the same."
                  - table [ref=f276e11]:
                    - caption [ref=f276e12]: "Table 17.1: Example Star Colors and Corresponding Approximate Temperatures"
                    - rowgroup [ref=f276e13]:
                      - row [ref=f276e14]:
                        - columnheader "Star Color" [ref=f276e15]
                        - columnheader "Approximate Temperature" [ref=f276e16]
                        - columnheader "Example" [ref=f276e17]
                    - rowgroup [ref=f276e18]:
                      - row [ref=f276e19]:
                        - cell "Blue" [ref=f276e20]
                        - cell "25,000 K" [ref=f276e21]
                        - cell "Spica" [ref=f276e22]
                      - row [ref=f276e23]:
                        - cell "White" [ref=f276e24]
                        - cell "10,000 K" [ref=f276e25]
                        - cell "Vega" [ref=f276e26]
                      - row [ref=f276e27]:
                        - cell "Yellow" [ref=f276e28]
                        - cell "6000 K" [ref=f276e29]
                        - cell "Sun" [ref=f276e30]
                      - row [ref=f276e31]:
                        - cell "Orange" [ref=f276e32]
                        - cell "4000 K" [ref=f276e33]
                        - cell "Aldebaran" [ref=f276e34]
                      - row [ref=f276e35]:
                        - cell "Red" [ref=f276e36]
                        - cell "3000 K" [ref=f276e37]
                        - cell "Betelgeuse" [ref=f276e38]
                  - paragraph [ref=f276e39]: "The hottest stars have temperatures of over 40,000 K, and the coolest stars have temperatures of about 2000 K. Our Sun’s surface temperature is about 6000 K; its peak wavelength color is a slightly greenish-yellow. In space, the Sun would look white, shining with about equal amounts of reddish and bluish wavelengths of light. It looks somewhat yellow as seen from Earth’s surface because our planet’s nitrogen molecules scatter some of the shorter (i.e., blue) wavelengths out of the beams of sunlight that reach us, leaving more long wavelength light behind. This also explains why the sky is blue: the blue sky is sunlight scattered by Earth’s atmosphere."
                  - heading "Color Indices" [level=3] [ref=f276e40]
                  - paragraph [ref=f276e41]: In order to specify the exact color of a star, astronomers normally measure a star’s apparent brightness through filters, each of which transmits only the light from a particular narrow band of wavelengths (colors). A crude example of a filter in everyday life is a green-colored, plastic, soft drink bottle, which, when held in front of your eyes, lets only the green colors of light through.
                  - paragraph [ref=f276e42]: "One commonly used set of filters in astronomy measures stellar brightness at three wavelengths corresponding to ultraviolet, blue, and yellow light. The filters are named: U (ultraviolet), B (blue), and V (visual, for yellow). These filters transmit light near the wavelengths of 360 nanometers (nm), 420 nm, and 540 nm, respectively. The brightness measured through each filter is usually expressed in magnitudes. The difference between any two of these magnitudes—say, between the blue and the visual magnitudes (B–V)—is called a color index."
                  - paragraph [ref=f276e43]: By agreement among astronomers, the ultraviolet, blue, and visual magnitudes of the UBV system are adjusted to give a color index of 0 to a star with a surface temperature of about 10,000 K, such as Vega. The B–V color indexes of stars range from −0.4 for the bluest stars, with temperatures of about 40,000 K, to +2.0 for the reddest stars, with temperatures of about 2000 K. The B–V index for the Sun is about +0.65. Note that, by convention, the B–V index is always the “bluer” minus the “redder” color.
                  - paragraph [ref=f276e44]: Why use a color index if it ultimately implies temperature? Because the brightness of a star through a filter is what astronomers actually measure, and we are always more comfortable when our statements have to do with measurable quantities.
                  - paragraph [ref=f276e45]: As you look up at the sky at night, you might notice stars are not all white in color. If you happen to look up at a winter sky, you will be greeted by the blue-white Dog Star Sirius in the constellation Canis Major. And nearby is the reddish star Betelgeuse in Orion the Hunter. Contrast these colors to that of our yellow Sun.
                  - paragraph [ref=f276e46]:
                    - text: Yet star color is an important indicator for astronomers; the color is an indication of a
                    - strong [ref=f276e47]: star’s surface temperature
                    - text: at its
                    - strong [ref=f276e48]: photosphere
                    - text: . A star’s
                    - strong [ref=f276e49]: photosphere temperature
                    - text: dictates its
                    - strong [ref=f276e50]: color
                    - text: . It turns out that the hotter stars are
                    - strong [ref=f276e51]: whiter
                    - text: and
                    - strong [ref=f276e52]: cooler
                    - text: stars are redder. This is exactly what we observe around us. If you heat a piece of metal, you will note that the hotter metal glows what we call “a white hot. ” As the metal cools, it becomes orange and then red. It is still hot if it is red, it is just not as hot as the white-hot metal. Stars are the same.
                  - paragraph [ref=f276e53]:
                    - text: We classify stars by their colors and thus their
                    - strong [ref=f276e54]: photosphere temperatures
                    - text: . This is called a star’s
                    - strong [ref=f276e55]: Spectral Type
                    - text: . Stars are categorized by their spectral types. This categorization was first done
                    - generic [ref=f276e56]:
                      - text: by
                      - strong [ref=f276e57]: Father
                    - strong [ref=f276e58]: Angelo Secchi
                    - text: in the 1860s and 1870s. In the 1880s at Harvard University,
                    - strong [ref=f276e59]: Edward Pickering
                    - text: observed and recorded stellar spectra and
                    - strong [ref=f276e60]: Williamina Fleming
                    - text: classified Pickering’s spectra with a system of letters.
                  - paragraph [ref=f276e61]:
                    - text: In 1901, Harvard astronomer
                    - strong [ref=f276e62]: Annie Jump Cannon
                    - text: revised the various classifications to give us our more-modern Spectral Types interpretation. One of the final notes in this all-important classification system was
                    - strong [ref=f276e63]: Cecilia Payne Gaposchkin’s
                    - text: 1925 doctoral dissertation, where she showed that spectral types were a sequence in stellar photosphere temperatures.
                  - paragraph [ref=f276e64]:
                    - text: Harvard astronomer
                    - strong [ref=f276e65]: Henry Norris Russell
                    - text: was concerned about Payne Gaposchkin’s dissertation conclusion that the Sun was primarily composed of hydrogen. This contradicted the theory at the time of the publication of her doctoral dissertation — that Earth could be so different than the Sun. Later, Russell came to the same conclusion, published his own paper, and barely mentioned Payne Gaposchkin’s work. Russell is often given credit for this discovery, even though it was not originally his work for which to receive credit.
                  - paragraph [ref=f276e66]:
                    - text: Look at the beautiful picture of the stars in the Sagittarius Star Cloud shown in Figure 17.3. The stars show a multitude of colors, including red, orange, yellow, white, and blue. As we have seen, stars are not all the same color because they do not all have identical temperatures. To define
                    - emphasis [ref=f276e67]: color
                    - text: precisely, astronomers have devised quantitative methods for characterizing the color of a star and then using those colors to determine stellar temperatures. In the chapters that follow, we will provide the temperature of the stars we are describing, and this section tells you how those temperatures are determined from the colors of light the stars give off.
                  - heading "Further Exploration" [level=2] [ref=f276e68]
                  - paragraph [ref=f276e69]:
                    - text: Go to this
                    - link "interactive simulation from the University of Colorado" [ref=f276e70]:
                      - /url: https://openstax.org/l/30UofCsimstar
                    - text: to see the color of a star changing as the temperature is changed.
