                  - heading "Atmospheric Effects on Observing" [level=2] [ref=f156e2]
                  - paragraph [ref=f156e3]: "Earth’s atmosphere blocks most light at wavelengths shorter than visible, so we can only make direct ultraviolet, X-ray, and gamma ray observations from space, Figure \\(\\PageIndex{1}\\). This illustration shows how well Earth’s atmosphere transmits different types of light depending on its wavelength, along with the different layers of the atmosphere. Short wavelength light does not make it to the surface and must be observed from space. Some infrared and microwaves are absorbed by water near Earth's surface but can be observed at high altitudes where the atmosphere is drier. Although there is a broad range of radio that reaches Earth's surface, the longest wavelength radio waves are blocked by Earth’s atmosphere."
                  - figure [ref=f156e4]:
                    - img "Light interacts with Earth's atmosphere. Details in caption." [ref=f156e5]
                    - generic [ref=f156e6]:
                      - text: "Figure \\(\\PageIndex{1}\\): Light and Earth’s Atmosphere. Different wavelength of light penetrate different distances into Earth's atmosphere. Visible and radio wavelengths are observable from the surface of Earth. ("
                      - link "CC BY 4.0" [ref=f156e7]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f156e8]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f156e9]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f156e10]':
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.5.1_Light_and_Earth's_Atmosphere
                      - text: .
                  - paragraph [ref=f156e11]: Even though visible light can reach the surface of Earth, the image is distorted by the movement of air in the atmosphere making stars twinkle. In space, the amount of detail in an image is limited only by the size of the telescope. On the other hand, it is expensive to place telescopes into space, and repairs can present a major challenge. This is why astronomers continue to build telescopes for use on the ground as well as for launching into space.
                  - heading "Hubble Space Telescope" [level=2] [ref=f156e12]
                  - paragraph [ref=f156e13]:
                    - text: "Space-based telescopes allow for observations outside the Earth’s atmosphere and light pollution. Probably the most-famous of the space-based telescopes is the Hubble Space Telescope (HST). With an aperture of 2.4 meters, which was limited by the size of the payload bay in the Space Shuttle that served as its launch vehicle, Figure \\(\\PageIndex{2}\\). It was named for"
                    - link "Edwin Hubble" [ref=f156e14]:
                      - /url: /Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.12:_Hubble_Edwin
                    - text: ", the astronomer who discovered the expansion of the universe in the 1920s. Within weeks of launch, the HST showed serious problems with its primary mirror, which affected the precise focus of the telescope. A fix was designed and astronauts about Space Shuttle Endeavor in December 1993 captured and repaired the near-sighted telescope. The repair was somewhat simple, equip the HST with glasses. The fix worked and images returned from the Hubble Space Telescope have amazed and intrigued both astronomers and the general public ever since."
                  - figure [ref=f156e15]:
                    - img "Deployment of Hubble Space Telescope from shuttle Endeavor." [ref=f156e16]
                    - generic [ref=f156e17]:
                      - text: "Figure \\(\\PageIndex{2}\\): Release of Hubble Space Telescope. The Hubble Space Telescope was released from the Space Shuttle Endeavour on April 25, 1990. ("
                      - link "Public Domain" [ref=f156e18]:
                        - /url: https://en.wikipedia.org/wiki/Public_domain
                      - text: ;
                      - link "NASA Hubble Space Telescope" [ref=f156e19]:
                        - /url: https://science.nasa.gov/mission/hubble/
                      - text: via
                      - link "Wikimedia Commons" [ref=f156e20]:
                        - /url: https://commons.wikimedia.org/wiki/File:Deployment_of_the_Hubble_Space_Telescope_(28248653761).jpg
                      - text: ).
                  - paragraph [ref=f156e21]: "HST is operated jointly by NASA’s Goddard Space Flight Center and the Space Telescope Science Institute in Baltimore. It was the first orbiting observatory designed to be serviced by Shuttle astronauts and, though this repair program has now been discontinued, and no more visits or improvements will be made. With the Hubble, astronomers have obtained some of the most detailed images of astronomical objects from the solar system outward to the most distant galaxies. Among its many great achievements is the Hubble Ultra-Deep Field, an image of a small region of the sky observed for almost 100 hours. It contains views of about 10,000 galaxies, some of which formed when the universe was just a few percent of its current age, Figure \\(\\PageIndex{3}\\)."
                  - figure [ref=f156e22]:
                    - img "Hubble Telescope ultra-deep field. Details in caption." [ref=f156e23]
                    - generic [ref=f156e24]:
                      - text: "Figure \\(\\PageIndex{3}\\): This Hubble Space Telescope image has provided an image of a specific region of space built from data collected between September 24, 2003, and January 16, 2004. These data allow us to search for galaxies that existed approximately 13 billion years ago. ("
                      - link "CC BY 4.0" [ref=f156e25]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f156e26]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f156e27]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{3}\\)" [ref=f156e28]':
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.5.3_Hubble_Ultra-Deep_Field
                      - text: .
                  - heading "Infrared Telescopes" [level=2] [ref=f156e29]
                  - paragraph [ref=f156e30]: Water vapor, which absorbs infrared light, is concentrated in the lower part of Earth’s atmosphere. For this reason, a gain of even a few hundred meters in elevation can make an important difference in the quality of an infrared observatory site. Given the limitations of high mountains, most of which attract clouds and violent storms, and the fact that the ability of humans to perform complex tasks degrades at high altitudes, it was natural for astronomers to investigate the possibility of observing infrared waves from airplanes and ultimately from space.
                  - paragraph [ref=f156e31]: "Infrared observations from airplanes were first made in the 1960s, starting with a 15-centimeter telescope on board a Learjet. From 1974 through 1995, NASA operated a 0.9-meter airborne telescope flying regularly out of the Ames Research Center south of San Francisco. Observing from an altitude of 12 kilometers, the telescope was above 99% of the atmospheric water vapor. More recently, NASA and the German Space Agency at DLR constructed a much larger 2.5-meter telescope, called the Stratospheric Observatory for Infrared Astronomy (SOFIA), which flew in a modified Boeing 747SP until it was decommissioned in 2022, Figure \\(\\PageIndex{4}\\). A section of the plane behind the wing could be opened for observations."
                  - figure [ref=f156e32]:
                    - img "Stratospheric Observatory for Infrared Astronomy (SOFIA)." [ref=f156e33]
                    - generic [ref=f156e34]:
                      - text: "Figure \\(\\PageIndex{4}\\): SOFIA allowed observations to be made above most of Earth’s atmospheric water vapor. ("
                      - link "CC BY 4.0" [ref=f156e35]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f156e36]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f156e37]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                  - paragraph [ref=f156e38]: Getting even higher and making observations from space itself have important advantages for infrared astronomy. First is the elimination of all interference from the atmosphere. Equally important is the opportunity to cool the entire optical system of the instrument in order to nearly eliminate infrared radiation from the telescope itself. If we tried to cool a telescope within the atmosphere, it would quickly become coated with condensing water vapor and other gases, making it useless. Only in the vacuum of space can optical elements be cooled to hundreds of degrees below freezing and still remain operational.
                  - paragraph [ref=f156e39]: "The first orbiting infrared observatory, launched in 1983, was the Infrared Astronomical Satellite (IRAS), built as a joint project by the United States, the Netherlands, and Britain. IRAS was equipped with a 0.6-meter telescope cooled to a temperature of less than 10 K. For the first time, the infrared sky could be seen as if it were night, rather than through a bright foreground of atmospheric and telescope emissions. IRAS carried out a rapid but comprehensive survey of the entire infrared sky over a 10-month period, cataloging about 350,000 sources of infrared radiation. Since then, several other infrared telescopes have operated in space with much better sensitivity and resolution due to improvements in infrared detectors including the 0.85-meter Spitzer Space Telescope, which launched in 2003, Figure \\(\\PageIndex{5}\\). With infrared observations, astronomers can detect cooler parts of cosmic objects, such as the dust clouds around star nurseries and the remnants of dying stars, that visible-light images don’t reveal. Since the human eye, can't detect infrared light, astronomers select visible colors and assign them to infrared wavelengths to create a false color image. The bright colors and cloud structures would not in Figure \\(\\PageIndex{5}\\) could not be detected without infrared telescopes."
                  - figure [ref=f156e40]:
                    - img "Spitzer infrared Flame Nebula, Cassopeia A, Helix Nebula. Details in caption." [ref=f156e41]
                    - generic [ref=f156e42]:
                      - text: "Figure\\(\\PageIndex{5}\\): Observations from the Spitzer Space Telescope (SST). These infrared images of a the Flame nebula, a region of star formation, Cassiopeia A, the remnant of an exploded star, and the Helix nebula, a region where an old star is losing its outer shell, show just a few of the observations made and transmitted back to Earth from the SST. ("
                      - link "CC BY 4.0" [ref=f156e43]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f156e44]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f156e45]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                  - heading "James Webb Space Telescope" [level=2] [ref=f156e46]
                  - paragraph [ref=f156e47]: "The largest telescope sent into space so far, and one specifically designed to observe infrared radiation from the universe, is the James Webb Space Telescope. Launched on December 25, 2021, the telescope is now in a stable orbit around the Sun about 1.5 million km from Earth, four times further than the Moon. This is a good, cold location for infrared viewing, but a place where no astronauts can currently travel if the facility needs repair. With the Webb, astronomers are able to look into the dusty regions where stars are formed and to probe the atmospheres of planets orbiting other stars, just to name two of its primary aims. The Webb’s 18-segment primary mirror is 6.5 meters in diameter, Figure \\(\\PageIndex{6}\\). Below, the mirror, a multi-layer shield the size of a tennis court protects it from the heat of the Sun and allows its liquid-helium-cooled instruments to gather extremely faint infrared light from the universe. Its giant mirror is already allowing scientists to look back close to the time when galaxies were first being assembled by the pull of gravity."
                  - figure [ref=f156e48]:
                    - img "James Webb Space Telescope model. Details in text." [ref=f156e49]
                    - generic [ref=f156e50]:
                      - text: "Figure \\(\\PageIndex{6}\\): Model of James Webb Space Telescope (JWST). The James Webb Space Telescope (JWST) is an orbiting infrared observatory that complements and extends the discoveries of the Hubble Space Telescope, with longer wavelength coverage and greatly improved sensitivity. Details in text. ("
                      - link "Public Domain" [ref=f156e51]:
                        - /url: https://en.wikipedia.org/wiki/Public_domain
                      - text: ;
                      - link "NASA" [ref=f156e52]:
                        - /url: https://www.nasa.gov/
                      - text: via
                      - link "Wikimedia Commons" [ref=f156e53]:
                        - /url: https://commons.wikimedia.org/wiki/File:JWST_spacecraft_model_3.png
                      - text: ).
                  - heading "High-Energy Observatories" [level=2] [ref=f156e54]
                  - paragraph [ref=f156e55]: Ultraviolet, X-ray, and gamma-ray observations can be made only from space. Such observations first became possible in 1946, with V2 rockets captured from Germany after World War II. The US Naval Research Laboratory put instruments on these rockets for a series of pioneering flights, used initially to detect ultraviolet light from the Sun. Since then, many other rockets have been launched to make X-ray and ultraviolet observations of the Sun, and later of other celestial objects.
                  - paragraph [ref=f156e56]:
                    - text: One major challenge is to design mirrors to reflect such penetrating radiation as X-rays and gamma rays, which normally pass straight through matter. However, although the technical details of design are more complicated, the three basic components of an observing system are the same at all wavelengths. The system needs a telescope to gather up the radiation, filters or instruments to sort the radiation according to wavelength, and some method of detecting and making a permanent record of the observations. Astronomers have built many spacecraft to observe short wavelength light, included on a
                    - link "list of high-energy observatories" [ref=f156e57]:
                      - /url: /Workbench/De_Anza_-_ASTR10/18:_Appendices/18.02:_Tables#Space+Telescopes
                    - text: .
                  - paragraph [ref=f156e58]: Beginning in the 1960s, a steady stream of high-energy observatories has been launched into orbit to reveal and explore the universe at short wavelengths. Among recent X-ray telescopes is the Chandra X-ray Observatory, which was launched in 1999. It is producing X-ray images with unprecedented resolution and sensitivity. Designing instruments that can collect and focus energetic radiation like X-rays and gamma rays is an enormous technological challenge. The 2002 Nobel Prize in physics was awarded to Riccardo Giacconi, a pioneer in the field of building and launching sophisticated X-ray instruments. In 2008, NASA launched the Fermi Gamma-ray Space Telescope, designed to measure cosmic gamma rays at energies greater than any previous telescope, and thus able to collect radiation from some of the most energetic events in the universe.
                  - paragraph [ref=f156e59]: Gamma-ray detections can also be made from Earth’s surface by using the atmosphere as the primary detector. When a gamma ray hits our atmosphere, it accelerates charged particles, mostly electrons, in the atmosphere. Those energetic particles hit other particles in the atmosphere and give off their own radiation. The effect is a cascade of light and energy that can be detected on the ground. The VERITAS array in Arizona and the H.E.S.S. array in Namibia are two such ground-based gamma-ray observatories.
                  - heading "Solar System Exploration" [level=2] [ref=f156e60]
                  - paragraph [ref=f156e61]:
                    - text: The spacecraft discussed so far are
                    - link [ref=f156e62]:
                      - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#orbiter
                      - strong [ref=f156e63]: orbiters
                    - text: ", because they were designed to orbit an object such as the Earth or the Sun. There are many other types of spacecraft that have been designed to explore the Solar System."
                  - paragraph [ref=f156e64]:
                    - text: Before orbiters were common, engineers designed spacecraft that could pass by one or more objects called
                    - link [ref=f156e65]:
                      - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#orbiter
                      - strong [ref=f156e66]: flybys
                    - text: . The engineers designing the early missions to explore the Solar System were still developing the tools to send spacecraft to other planets. Making the spacecraft go into orbit was considered risky because, if the calculations were even a little off, there was a possibility for it to crash on the surface or be deflected on a new path. For a spacecraft to enter orbit around another object, it needs to change speed, which costs fuel and therefore more money. Even today, flybys can be more cost-effective than orbiters. Flybys have the advantage of being able to visit more than one object. The Voyager missions took advantage of the flyby design and a once in a lifetime planetary alignment to visit all four outer planets. The downside of flybys is that they are not always able to fully image all sides of the object they visit. For example, there are parts of Pluto that the New Horizons spacecraft was not able to see. So, our current maps remain incomplete.
                  - paragraph [ref=f156e67]:
                    - text: If an object has a solid surface, astronomers can send
                    - strong [ref=f156e68]:
                      - link "landers" [ref=f156e69]:
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#lander
                    - text: ", spacecraft that land on the surface. After many flybys of Mars, NASA sent the Viking mission. It consisted of twin spacecraft, each one consisting of both an orbiter and a lander. The Viking orbiters were able to relay signals from the landers back to Earth while also collecting images of the surface. The purpose of the Viking landers was to be able to study the Martian surface in ways that could not be done remotely, including several experiments designed to detect life on the Martian surface."
                  - paragraph [ref=f156e70]:
                    - text: The only downside of a lander is that it is stuck in one place. Sometimes landers include machines that can move across the surface, called
                    - strong [ref=f156e71]:
                      - link "rovers" [ref=f156e72]:
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#rover
                    - text: ". Decades after the Viking landers touched down on Mars, the Pathfinder mission successfully landed on the surface and released the Sojourner rover to explore the nearby rocks. The most recent rover on Mars is Zhurong, which functioned for 347 Martian days, much longer than its planned 90 Martian days, Figure \\(\\PageIndex{7}\\)."
                  - figure [ref=f156e73]:
                    - img "Zhurong rover and Tianwen-1 lander." [ref=f156e74]
                    - generic [ref=f156e75]:
                      - text: "Figure \\(\\PageIndex{7}\\): Zhurong rover with the Tianwen-1 lander, taken by the deployable Tianwen-1 Remote Camera on the surface of Mars. ("
                      - link "CC BY 3.0" [ref=f156e76]:
                        - /url: https://creativecommons.org/licenses/by/3.0
                      - text: ;
                      - link "China News Service Website" [ref=f156e77]:
                        - /url: https://www.ecns.cn/
                      - text: via
                      - link "Wikimedia Commons" [ref=f156e78]:
                        - /url: https://commons.wikimedia.org/wiki/File:Zhurong-with-lander-selfie-flat.jpg
                      - text: ).
                  - generic [ref=f156e79]:
                    - 'heading "Further Exploration: Interactive Activity" [level=5] [ref=f156e80]'
                    - list [ref=f156e82]:
                      - listitem [ref=f156e83]:
                        - text: Learn about NASA's
                        - link "Stratospheric Observatory for Infrared Astronomy" [ref=f156e84]:
                          - /url: https://science.nasa.gov/mission/sofia/
                        - text: (SOFIA), a modified Boeing 747 that carried a powerful infrared telescope above most of Earth's atmosphere to study star formation, planetary systems, and the interstellar medium.
                      - listitem [ref=f156e85]:
                        - text: Explore the
                        - link "Infrared Astronomical Satellite (IRAS)" [ref=f156e86]:
                          - /url: https://www.jpl.nasa.gov/missions/infrared-astronomical-satellite-iras/
                        - text: ", the first space telescope to conduct a complete all-sky infrared survey. IRAS laid the foundation for modern infrared astronomy by revealing previously hidden stars, galaxies, and other cosmic objects obscured at visible wavelengths."
                      - listitem [ref=f156e87]:
                        - text: Discover how
                        - link "Spitzer" [ref=f156e88]:
                          - /url: https://science.nasa.gov/mission/spitzer/
                        - text: used infrared observations to investigate exoplanets, stellar nurseries, galaxies, and the distant universe.
                      - listitem [ref=f156e89]:
                        - text: Watch a behind-the-scenes tour of the
                        - link "SOFIA" [ref=f156e90]:
                          - /url: https://www.youtube.com/watch?v=g5z6fZKOtP4
                        - text: observatory and learn how airborne infrared astronomy enabled observations impossible from the ground.
                      - listitem [ref=f156e91]:
                        - text: Explore NASA's
                        - link "Flagship Infrared Observatory" [ref=f156e92]:
                          - /url: https://science.nasa.gov/mission/webb/
                        - text: ", which is investigating the earliest galaxies, exoplanet atmospheres, and the evolution of the universe."
                      - listitem [ref=f156e93]:
                        - text: Learn how astronomers use
                        - link "X-ray Observations" [ref=f156e94]:
                          - /url: https://chandra.harvard.edu/
                        - text: to study black holes, supernova remnants, neutron stars, and other high-energy cosmic phenomena.
                      - listitem [ref=f156e95]:
                        - text: Discover
                        - link "NASA's Mission" [ref=f156e96]:
                          - /url: https://fermi.gsfc.nasa.gov/
                        - text: for observing the universe in gamma rays, revealing extreme events such as pulsars, black holes, and gamma-ray bursts.
                      - listitem [ref=f156e97]:
                        - text: Explore
                        - link "VERITAS (Very Energetic Radiation Imaging Telescope Array System)" [ref=f156e98]:
                          - /url: https://arxiv.org/abs/astro-ph/0108478
                        - text: a ground-based observatory that detects very high-energy gamma rays, complementing space-based missions studying energetic astrophysical sources.
                      - listitem [ref=f156e99]:
                        - text: Follow the historic
                        - link "Voyager" [ref=f156e100]:
                          - /url: https://science.nasa.gov/mission/voyager/
                        - text: missions, which explored the outer planets and continue to send data from interstellar space.
                      - listitem [ref=f156e101]:
                        - text: Learn about the mission that provided humanity's first close-up views of
                        - link "Pluto" [ref=f156e102]:
                          - /url: https://science.nasa.gov/mission/new-horizons/
                        - text: and continues to explore the Kuiper Belt.
                      - listitem [ref=f156e103]:
                        - text: Examine NASA's pioneering
                        - link "Mars Mission" [ref=f156e104]:
                          - /url: https://science.nasa.gov/mission/viking/
                        - text: ", which achieved the first successful long-term operations on the Martian surface and searched for signs of life."
                      - listitem [ref=f156e105]:
                        - text: Discover China's first independent
                        - link "Mars Mission" [ref=f156e106]:
