            - application "Rich Text Editor, editarea" [ref=f606e314]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f606e348]: "<p class=\"lt-phys-46151\">Issac Newton’s (1642–1727) laws of motion were just one part of the monumental work that has made him legendary. The development of Newton’s laws marks the transition from the Renaissance into the modern era. This transition was characterized by a revolutionary change in the way people thought about the physical universe. For many centuries natural philosophers had debated the nature of the universe based largely on certain rules of logic with great weight given to the thoughts of earlier classical philosophers such as Aristotle (384–322 BC). Among the many great thinkers who contributed to this change were Newton and Galileo.</p> <figure><img alt=\"fig-ch01_patchfile_01.jpg\" class=\"internal default\" height=\"250px\" src=\"/@api/deki/files/36160/Figure_04_00_02.jpg\" style=\"width: 212px; height: 250px;\" width=\"212px\" /> <figcaption><strong>Figure </strong>\\(\\PageIndex{2}\\): Issac Newton’s monumental work,&nbsp;<em data-effect=\"italics\">Philosophiae Naturalis Principia Mathematica</em>, was published in 1687. It proposed scientific laws that are still used today to describe the motion of objects. (credit: Service commun de la documentation de l'Université de Strasbourg)</figcaption> </figure> <p class=\"lt-phys-64079\">The next major leap was that of Sir Isaac Newton, an English physicist and mathematician. Newton is credited with developing the <strong>Laws of Motion, Law of Universal Gravitation</strong>, building the first <strong>Reflecting Telescope </strong>(still called the Newtonian Reflector), and developing a <strong>Theory of Color</strong>.</p> <p class=\"lt-phys-64079\">The Theory of Color was based on Newton’s observations that a prism breaks sunlight into component colors. Newton also shares credit for the development of Calculus with Gottfried Leibniz, as well as developed other ideas in physics, including an empirical law of cooling, studies the speed of sound, and the idea of a Newtonian fluid.</p> <p>&nbsp;</p> <p>It was the genius of Isaac <span class=\"no-emphasis\" data-type=\"term\" group-by=\"N\">Newton</span> that found a conceptual framework that completely explained the observations and rules assembled by Galileo, Brahe, Kepler, and others. Newton was born in Lincolnshire, England, in the year after Galileo’s death (Figure 3.6). Against the advice of his mother, who wanted him to stay home and help with the family farm, he entered Trinity College at Cambridge in 1661 and eight years later was appointed professor of mathematics. Among Newton’s contemporaries in England were architect Christopher Wren, authors Aphra Behn and Daniel Defoe, and composer G. F. Handel.</p> <figure><span data-alt=\"Portrait of Isaac Newton.\" data-type=\"media\"><img alt=\"Portrait of Isaac Newton.\" data-media-type=\"image/jpeg\" height=\"366px\" src=\"/@api/deki/files/46265/3db40569e39c17b63a0d74e7da3dc2bbf2d382dd\" style=\"width: 267px; height: 366px;\" width=\"267px\" /> </span> <figcaption>Figure 3.6 : Isaac Newton (1643–1727), 1689 Portrait by Sir Godfrey Kneller. Isaac Newton’s work on the laws of motion, gravity, optics, and mathematics laid the foundations for much of physical science.</figcaption> </figure> <h3>Newton’s Laws of Motion</h3> <p>As a young man in college, Newton became interested in natural philosophy, as science was then called. He worked out some of his first ideas on machines and optics during the plague years of 1665 and 1666, when students were sent home from college. Newton, a moody and often difficult man, continued to work on his ideas in private, even inventing new mathematical tools to help him deal with the complexities involved. Eventually, his friend Edmund <span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">Halley</span> (profiled in Comets and Asteroids: Debris of the Solar System) prevailed on him to collect and publish the results of his remarkable investigations on motion and gravity. The result was a volume that set out the underlying system of the physical world, <em data-effect=\"italics\">Philosophiae Naturalis Principia Mathematica</em>. The <em data-effect=\"italics\">Principia</em>, as the book is generally known, was published at Halley’s expense in 1687.</p> <figure><a name=\"Fig7\"><img alt=\"A portrait of Isaac Newton. \" data-media-type=\"image/jpg\" height=\"275\" src=\"/@api/deki/files/34826/Figure_01_01_07_aa.jpg\" width=\"187.72\" /></a> <figcaption><strong>Figure </strong>\\(\\PageIndex{7}\\): <strong>Isaac Newton</strong>&nbsp;(1642–1727) was very reluctant to publish his revolutionary work and had to be convinced to do so. In his later years, he stepped down from his academic post and became exchequer of the Royal Mint. He took this post seriously, inventing reeding (or creating ridges) on the edge of coins to prevent unscrupulous people from trimming the silver off of them before using them as currency. (credit: Arthur Shuster and Arthur E. Shipley:&nbsp;<em data-effect=\"italics\">Britain’s Heritage of Science</em>. London, 1917.)</figcaption> </figure> <p>Sir Isaac Newton was the first scientist to precisely define the gravitational force, and to show that it could explain both falling bodies and astronomical motions. See&nbsp;<a href=\"/Bookshelves/Conceptual_Physics/Introduction_to_Physics_(Park)/02:_Mechanics_I_-_Motion_and_Forces/02:_Dynamics/2.09:_Newtons_Universal_Law_of_Gravitation#Fig1\" title=\"3.8: Newton’s Universal Law of Gravitation\">Figure</a>&nbsp;\\(\\PageIndex{1}\\). But Newton was not the first to suspect that the same force caused both our weight and the motion of planets. His forerunner Galileo Galilei had contended that falling bodies and planetary motions had the same cause. Some of Newton’s contemporaries, such as Robert Hooke, Christopher Wren, and Edmund Halley, had also made some progress toward understanding gravitation. But Newton was the first to propose an exact mathematical form and to use that form to show that the motion of heavenly bodies should be conic sections—circles, ellipses, parabolas, and hyperbolas. This theoretical prediction was a major triumph—it had been known for some time that moons, planets, and comets follow such paths, but no one had been able to propose a mechanism that caused them to follow these paths and not others. &nbsp;</p> <p class=\"lt-phys-46200\"><br type=\"_moz\" /> It was the genius of Isaac <span class=\"no-emphasis\" data-type=\"term\" group-by=\"N\">Newton</span> that found a conceptual framework that completely explained the observations and rules assembled by Galileo, Brahe, Kepler, and others. Newton was born in Lincolnshire, England, in the year after Galileo’s death (Figure 3.6). Against the advice of his mother, who wanted him to stay home and help with the family farm, he entered Trinity College at Cambridge in 1661 and eight years later was appointed professor of mathematics. Among Newton’s contemporaries in England were architect Christopher Wren, authors Aphra Behn and Daniel Defoe, and composer G. F. Handel.Newton’s Laws of Motion</p> <h3>Attributions</h3> <p>This section was adapted&nbsp;from \"<a href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/03:_Orbits_and_Gravity/3.03:_Newtons_Great_Synthesis\" title=\"3.3: Newton’s Great Synthesis\">Newton's Great Synthesis</a>\" in <a class=\"link-https\" href=\"https://openstax.org/details/books/astronomy-2e/\" rel=\"external noopener nofollow\" target=\"_blank\" title=\"https://openstax.org/details/books/astronomy-2e/\">Openstax Astronomy 2nd ed.</a>&nbsp;originally written by Andrew Fraknoi, David Morrison, and Sidney Wolff, and published under a <a class=\"link-https\" href=\"https://creativecommons.org/licenses/by/4.0/\" rel=\"external noopener nofollow\" target=\"_blank\" title=\"https://creativecommons.org/licenses/by/4.0/\">Creative Common Attribution Licence&nbsp;4.0</a>.</p> <p><a class=\"link-https\" href=\"/Bookshelves/Conceptual_Physics/Introduction_to_Physics_(Park)/02:_Mechanics_I_-_Motion_and_Forces/02:_Dynamics/2.01:_Introduction_to_Dynamics-_Newtons_Laws_of_Motion\" rel=\"freelink\" title=\"https://phys.libretexts.org/Bookshelves/Conceptual_Physics/Introduction_to_Physics_(Park)/02%3A_Mechanics_I_-_Motion_and_Forces/02%3A_Dynamics/2.01%3A_Introduction_to_Dynamics-_Newtons_Laws_of_Motion\">https://phys.libretexts.org/Bookshel...Laws_of_Motion</a></p> <p><a class=\"link-https\" href=\"/Bookshelves/Astronomy__Cosmology/Introduction_to_Astronomy_(Lumen)/02:_Historical_Astronomy/2.11:_The_Mathematical_Finish-_Newton\" rel=\"freelink\" title=\"https://phys.libretexts.org/Bookshelves/Astronomy__Cosmology/Introduction_to_Astronomy_(Lumen)/02%3A_Historical_Astronomy/2.11%3A_The_Mathematical_Finish-_Newton\">https://phys.libretexts.org/Bookshel...Finish-_Newton</a></p> <p><a class=\"link-https\" href=\"/Bookshelves/Conceptual_Physics/Introduction_to_Physics_(Park)/01:_Introduction/00:_Introduction/0.02:_Physics_-_An_Introduction\" rel=\"freelink\" title=\"https://phys.libretexts.org/Bookshelves/Conceptual_Physics/Introduction_to_Physics_(Park)/01%3A_Introduction/00%3A_Introduction/0.02%3A_Physics_-_An_Introduction\">https://phys.libretexts.org/Bookshel...n_Introduction</a></p> <h2>Further Exploration</h2> <p><a href=\"https://www.bbc.co.uk/teach/articles/zh8792p\" title=\"https://www.bbc.co.uk/teach/articles/zh8792p\">A timeline of Newton's life by BBC</a>&nbsp; &nbsp;(<span class=\"mt-bgcolor-e74c3c\">Copyright)</span></p>"
