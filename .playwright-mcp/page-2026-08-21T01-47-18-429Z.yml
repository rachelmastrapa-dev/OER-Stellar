                  - heading "Spectral Classes L, T, and Y" [level=2] [ref=f118e2]
                  - paragraph [ref=f118e3]:
                    - text: The scheme devised by Cannon was expanded in 1988, when astronomers began to discover objects even cooler than M9-type stars. We use the word object because many of the new discoveries are not true stars. A star is defined as an object that during some part of its lifetime derives 100% of its energy from the fusion of hydrogen into helium. Objects with masses less than about 7.5% of the mass of our Sun, about 0.075
                    - generic [ref=f118e4]:
                      - text: M
                      - subscript [ref=f118e5]: Sun
                    - text: ", do not become hot enough for hydrogen fusion to take place. Even before the first such failed star was found, this class of objects, with masses intermediate between stars and planets, was given the name"
                    - strong [ref=f118e6]:
                      - link "brown dwarfs" [ref=f118e7]:
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#brown dwarf
                    - text: .
                  - paragraph [ref=f118e8]: Brown dwarfs are very difficult to observe because they are extremely faint and cool, and they put out most of their light in the infrared part of the spectrum. It was only after the construction of very large telescopes, like the Keck telescopes in Hawaii, and the development of very sensitive infrared detectors, that the search for brown dwarfs succeeded. The first brown dwarf was discovered in 1988, and, as of the summer of 2015, there are more than 2200 known brown dwarfs.
                  - paragraph [ref=f118e9]:
                    - text: Initially, brown dwarfs were given spectral classes like M10
                    - superscript [ref=f118e10]: +
                    - text: "or “much cooler than M9,” but so many are now known that it is possible to begin assigning spectral types. The hottest brown dwarfs are given types L0–L9 (temperatures in the range 2400–1300 K), whereas still cooler (1300–700 K) objects are given types T0–T9, Figure \\(\\PageIndex{1}\\). In the Class L brown dwarfs, the lines of titanium oxide, which are strong in M stars, have disappeared. This is because the L dwarfs are so cool that atoms and molecules can gather together into dust particles in their atmospheres; the titanium is locked up in the dust grains rather than being available to form molecules of titanium oxide. Lines of steam (hot water vapor) are present, along with lines of carbon monoxide and neutral sodium, potassium, cesium, and rubidium. Methane ("
                    - generic [ref=f118e11]:
                      - text: CH
                      - subscript [ref=f118e12]: "4"
                    - text: ) lines are strong in class-T brown dwarfs, as methane exists in the atmosphere of the giant planets in our own solar system.
                  - paragraph [ref=f118e13]:
                    - text: In 2009, astronomers discovered ultra-cool brown dwarfs with temperatures of 500–600 K. These objects exhibited absorption lines due to ammonia (
                    - generic [ref=f118e14]:
                      - text: NH
                      - subscript [ref=f118e15]: "3"
                    - text: ), which are not seen in T dwarfs. A new spectral class, Y, was created for these objects. As of 2021, over 50 brown dwarfs belonging to spectral class Y have been discovered, some with temperatures comparable to that of the human body, at about 300 K. The record-holder for the coldest Type Y dwarf is WISE 0855-0714, at around 250 K.
                  - figure [ref=f118e16]:
                    - img "Comparison of stars and brown dwarfs. Details in caption." [ref=f118e17]
                    - generic [ref=f118e18]:
                      - text: "Figure \\(\\PageIndex{1}\\): This illustration shows the sizes and surface temperatures of brown dwarfs Teide 1, Gliese 229B, and WISE1828 in relation to the Sun, a red dwarf star (Gliese 229A), and Jupiter. ("
                      - link "CC BY 4.0" [ref=f118e19]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f118e20]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                        - generic [ref=f118e21]: Fraknoi
                        - text: ", et al."
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f118e22]:
                        - /url: https://openstax.org/details/books/astronomy
                        - generic [ref=f118e23]: Openstax
                        - text: Astronomy
                        - generic [ref=f118e24]: 2nd
                        - text: ed.
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{1}\\)" [ref=f118e25]':
                        - /url: /Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.09:_Accessible_Descriptions#Figure_4.5.1_Brown_Dwarfs
                      - text: .
                  - paragraph [ref=f118e26]: Most brown dwarfs start out with atmospheric temperatures and spectra like those of true stars with spectral classes of M6.5 and later, even though the brown dwarfs are not hot and dense enough in their interiors to fuse hydrogen. In fact, the spectra of brown dwarfs and true stars are so similar from spectral types late M through L that it is not possible to distinguish the two types of objects based on spectra alone. An independent measure of mass is required to determine whether a specific object is a brown dwarf or a very low mass star. Since brown dwarfs cool steadily throughout their lifetimes, the spectral type of a given brown dwarf changes with time over a billion years or more from late M through L, T, and Y spectral types.
                  - heading "Low-Mass Brown Dwarfs vs. High-Mass Planets" [level=2] [ref=f118e27]
                  - paragraph [ref=f118e28]:
                    - text: An interesting property of brown dwarfs is that they have approximately the same radius as Jupiter, regardless of their masses. Amazingly, this covers a range of masses from about 13 to 80 times the mass of Jupiter, M
                    - subscript [ref=f118e29]: J
                    - text: . This can make distinguishing a low-mass brown dwarf from a high-mass planet very difficult.
                  - paragraph [ref=f118e30]:
                    - text: So, what is the difference between a low-mass brown dwarf and a high-mass planet? The International Astronomical Union considers the distinctive feature to be deuterium fusion. Although brown dwarfs do not sustain regular hydrogen fusion, they are capable of fusing deuterium, a rare form of hydrogen with one proton and one neutron in its nucleus. The fusion of deuterium can happen at a lower temperature than the fusion of hydrogen. If an object has enough mass to fuse deuterium, about 13 M
                    - subscript [ref=f118e31]: J
                    - text: or 0.012
                    - generic [ref=f118e32]:
                      - text: M
                      - subscript [ref=f118e33]: Sun
                    - text: ", it is a brown dwarf. Objects with less than 13 M"
                    - subscript [ref=f118e34]: J
                    - text: do not fuse deuterium and are usually considered planets.
                  - list
