                  - heading "Capturing Light" [level=2] [ref=f150e2]
                  - paragraph [ref=f150e3]: After the telescope forms an image, there needs to be a way to detect and record it so that the data can be measured, reproduced, and analyzed. Before the nineteenth century, astronomers simply viewed images with their eyes and wrote descriptions of what they saw. This was very inefficient and did not lead to a very reliable long-term record. Remember that anyone can benefit from looking through a telescope at the stars for their own personal enjoyment. For the study of astronomy, data needs to be collected and stored in a way that is objective and consistent.
                  - paragraph [ref=f150e4]: Before detectors, astronomers would look through a telescope and either write down what they saw or describe the observations to an assistant. It was very common for there to be slight differences between observations made by different astronomers. This was not necessarily due to bad observing, but the natural variability in human vision. The eye also suffers from having a very short integration time, or the amount of time over which the eye can collect light. The light that enters the eye is processed by the brain within a fraction of a second. This means that the eye can't collect photons over a long period of time. One important advantage of modern detectors is that the light from astronomical objects can be collected by the detector over longer time periods in a long exposure. Exposures of several hours are required to detect very faint objects in the cosmos.
                  - heading "Photographic and Electronic Detectors" [level=2] [ref=f150e5]
                  - paragraph [ref=f150e6]: Once an image is focused and magnified by the telescope, it can be captured by a film or digital camera. In the nineteenth century, the use of photography became widespread. Today, the image is generally detected with sensors similar to those in digital cameras, recorded electronically, and stored in computers.
                  - paragraph [ref=f150e7]: Throughout most of the twentieth century, photographic film or glass plates served as the primary astronomical detectors. In a photographic plate, a light-sensitive chemical coating is applied to a piece of glass that, when developed, provides a lasting record of the image. At observatories around the world, vast collections of photographs preserve what the sky has looked like during the past 100 years. Photography represents a huge improvement over the human eye, but it still has limitations. Over a long exposure of a star, the chemical reaction would spread out, creating a larger image as it collected more light. In this case, brighter stars would look larger than dimmer stars on the photographic plate. This was helpful to note the relative brightness of stars, but not an accurate record of the stars' relative sizes in the night sky. Photographic films are also inefficient. Only about 1% of the light that falls on the film contributes to the chemical change that makes the image. That means that the vast majority of photons are not recorded.
                  - paragraph [ref=f150e8]:
                    - text: Astronomers today have much more efficient electronic detectors to record astronomical images. The
                    - link [ref=f150e9]:
                      - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#photometer
                      - strong [ref=f150e10]: photometer
                    - text: was an early electronic detector used by astronomers. Photometers convert light into an electric signal and the most advanced ones are able to count individual photons. An astronomer could focus their telescope at a star and count the number of photons detected over a set period of time. Then, they could point the telescope at another star and repeat the process. The result was a quantitative measurement of the brightness of both stars.
                  - paragraph [ref=f150e11]:
                    - text: The next technological development in detectors was to arrange many individual photometer-like devices into a grid. A
                    - strong [ref=f150e12]:
                      - link "charge-coupled device" [ref=f150e13]:
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#CCD
                    - text: "(CCD) is able to create an image using many individual sensors that are each capable of counting photons Figure \\(\\PageIndex{1}\\). Unlike the photometer, a CCD can collect quantitative measurements of several stars at once. In a CCD, photons of radiation hitting any part of the detector generate a stream of electrons that are stored and counted at the end of the exposure. Each place where the photons are counted is called a pixel, and modern detectors can count the photons in millions of pixels. CCDs are not just for astronomical observations. The same general concept was used to create the cameras in phones and computers."
                  - figure [ref=f150e14]:
                    - img "Charge-Coupled Devices (CCDs). Details in caption." [ref=f150e15]
                    - generic [ref=f150e16]:
                      - text: "Figure \\(\\PageIndex{1}\\): (a) A CCD that can be held in the palm of your hand and is a mere 300-micrometers thick, thinner than a human hair, holds more than 21 million pixels. (b) This matrix of 42 CCDs served the Kepler telescope. ("
                      - link "CC BY 4.0" [ref=f150e17]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f150e18]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f150e19]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Alternative description of the Figure \\(\\PageIndex{1}\\)" [ref=f150e20]':
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.3.1__Charge-Coupled_Devices_(CCDs)
                      - text: .
                  - paragraph [ref=f150e21]: Because CCDs typically record as much as 60–70% of all the photons that strike them, and the best silicon and infrared CCDs exceed 90% sensitivity, we can detect much fainter objects. Among these are many small moons around the outer planets, icy dwarf planets beyond Pluto, and dwarf galaxies of stars. CCDs also provide more accurate measurements of the brightness of astronomical objects than photography, and their output is digital so it can be stored in a computer for analysis.
                  - heading "Infrared Observations" [level=2] [ref=f150e22]
                  - paragraph [ref=f150e23]: "Observing the universe in the infrared band of the spectrum presents some additional challenges. The infrared region extends from wavelengths near 1 micrometer (µm), which is about the long wavelength sensitivity limit of both CCDs and photography, to 100 micrometers or longer. Figure \\(\\PageIndex{2}\\) is an example of how infrared light can pass through materials that visible light cannot. In the visible image, the person's hands are covered by a garbage bag, but the infrared light passes through the bag, showing the hands. An image of the same object taken in visible and infrared can also highlight different objects, such as the person's glasses that are clear in the visible image, but very dark in the infrared image. The main challenge to astronomers using infrared is to distinguish between the tiny amount of heat radiation that reaches Earth from stars and galaxies, and the much greater heat radiated by the telescope itself and our planet’s atmosphere."
                  - figure [ref=f150e24]:
                    - img "Comparison of visible and infrared images. Details in text." [ref=f150e25]
                    - generic [ref=f150e26]:
                      - text: "Figure \\(\\PageIndex{2}\\): Infrared Observations. The same image in infrared and visible light demonstrate significant differences in how different objects are highlighted or able to be seen. ("
                      - link "CC BY 4.0" [ref=f150e27]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f150e28]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f150e29]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                  - paragraph [ref=f150e30]: Typical temperatures on Earth’s surface are near 300 K, and the atmosphere through which observations are made is only a little cooler. The telescope, the observatory, and even the sky are radiating infrared energy with a peak wavelength of about 10 micrometers. To infrared eyes, everything on Earth is brightly aglow, including the telescope and camera. The challenge is to detect faint cosmic sources against this sea of infrared light. Another way to look at this is that an astronomer using infrared must always contend with the situation that a visible-light observer would face if working in broad daylight with a telescope and optics lined with bright fluorescent lights.
                  - paragraph [ref=f150e31]: To solve this problem, astronomers must protect the infrared detector from nearby radiation, just as you would shield photographic film from bright daylight. Since anything warm radiates infrared energy, the detector must be isolated in very cold surroundings. Often, it is held near absolute zero by immersing it in liquid helium. The second step is to reduce the radiation emitted by the telescope structure and optics, and to block this heat from reaching the infrared detector.
                  - heading "Spectroscopy" [level=2] [ref=f150e32]
                  - paragraph [ref=f150e33]: Before the light reaches the detector, astronomers today are able to use some type of instrument to sort the light according to wavelength. The instrument may be as simple as colored filters, which transmit light within a specified range of wavelengths. A red transparent plastic is an everyday example of a filter that transmits only the red light and blocks the other colors. After the light passes through a filter, it forms an image that astronomers can then use to measure the apparent brightness and color of objects.
                  - paragraph [ref=f150e34]: "Alternatively, the instrument between telescope and detector may be one of several devices that spread the light out into its full rainbow of colors so that astronomers can measure individual lines in the spectrum. In 1814, Joseph von Fraunhofer invented the modern spectroscope. Originally, astronomers used a spectroscope to break the light of the incoming image into its component wavelengths for study, Figure \\(\\PageIndex{3}\\)."
                  - paragraph [ref=f150e35]:
                    - text: The modern, more sophisticated version is called a
                    - link [ref=f150e36]:
                      - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.07:_Key_Terms#spectrometer
                      - strong [ref=f150e37]: spectrometer
                    - text: because it allows astronomers to measure the spectrum of a source of light. Whether a filter or a spectrometer, both types of wavelength-sorting instruments still have to use detectors to record and measure the properties of light. Spectroscopy is one of the astronomer’s most powerful tools, providing information about the composition, temperature, motion, and other characteristics of celestial objects. More than half of the time spent on most large telescopes is used for spectroscopy.
                  - figure [ref=f150e38]:
                    - img "Spectroscope in museum display case." [ref=f150e39]
                    - generic [ref=f150e40]:
                      - text: "Figure \\(\\PageIndex{3}\\): Older spectroscopes, like this one in a museum in Portugal, used prisms unlike most modern astronomical spectrometers which use slits or gratings. ("
                      - link "CC0" [ref=f150e41]:
                        - /url: https://creativecommons.org/publicdomain/zero/1.0/
                      - text: ;
                      - link "Daderot" [ref=f150e42]:
                        - /url: https://commons.wikimedia.org/wiki/User:Daderot
                      - text: via
                      - link "Wikimedia Commons" [ref=f150e43]:
                        - /url: https://commons.wikimedia.org/wiki/File:Spectroscope,_Secretan,_Paris_-_Museu_da_Ci%C3%AAncia_da_Universidade_de_Coimbra_-_University_of_Coimbra_-_Coimbra,_Portugal_-_DSC09094.jpg
                      - text: ).
                  - paragraph [ref=f150e44]: "The many different wavelengths present in light can be separated by passing them through a spectrometer to form a spectrum, Figure \\(\\PageIndex{4}\\). In this diagram, the light from the source focused onto a small hole or narrow slit, and is collimated, or made into a beam of parallel rays by a lens. The light then passes through a prism, producing a spectrum. Different wavelengths leave the prism in different directions because each wavelength is bent by a different amount when it enters and leaves the prism. A second lens placed behind the prism focuses the many different images of the slit or entrance hole onto a CCD or other detecting device. The spectrum can then be analyzed at a later point. As spectroscopy spreads the light out into more and more collecting bins, fewer photons go into each bin, so either a larger telescope is needed or the integration time must be greatly increased."
                  - figure [ref=f150e45]:
                    - img "Prism spectrometer schematic. Details in caption." [ref=f150e46]
                    - generic [ref=f150e47]:
                      - text: "Figure \\(\\PageIndex{4}\\): In a spectrometer, the light is dispersed into a spectrum, which is either photographed or recorded electronically. ("
                      - link "CC BY 4.0" [ref=f150e48]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f150e49]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f150e50]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: ).
                      - 'link "Alternative description of Figure \\(\\PageIndex{4}\\)" [ref=f150e51]':
                        - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.08:_Accessible_Descriptions#Figure_5.3.4_Prism_Spectrometer
                      - text: .
                  - paragraph [ref=f150e52]: In practice, astronomers today are more likely to use a different device, called a grating, to disperse the spectrum. A grating is a piece of material with thousands of grooves on its surface. Think of the diffraction grating as many small prisms on a thin sheet of plastic or glass with 500 or more rulings per inch, similar to a CD. A grating, like a prism, also spreads light out into a spectrum.
                  - generic [ref=f150e53]:
                    - 'heading "Further Exploration: Interactive Activity" [level=5] [ref=f150e54]'
                    - list [ref=f150e56]:
