                          - /url: https://coolcosmos.ipac.caltech.edu/infrared_gallery/1
                        - text: to compare astronomical objects observed in visible and infrared light and discover how infrared observations can reveal structures, dust clouds, and other features that are hidden at visible wavelengths.
