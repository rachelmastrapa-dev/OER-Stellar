            - application "Rich Text Editor, editarea" [ref=f316e322]:
              - iframe [active] [ref=f316e323]:
                - generic [active] [ref=f318e1]:
                  - heading "The Sun and ISM" [level=2] [ref=f318e2]
                  - paragraph [ref=f318e3]:
                    - text: We want to conclude our discussion of interstellar matter by asking how this material is organized in our immediate neighborhood. As we discussed above, orbiting X-ray observatories have shown that the Galaxy is full of bubbles of hot, X-ray-emitting gas. They also revealed a diffuse background of X-rays that appears to fill the entire sky from our perspective (Figure 20.19). While some of this emission comes from the interaction of the solar wind with the interstellar medium, a majority of it comes from beyond the solar system. The natural explanation for why there is X-ray-emitting gas all around us is that the Sun is itself inside one of the bubbles. We therefore call our “neighborhood” the Local Hot Bubble, or Local Bubble for short. The Local Bubble is much less dense—an average of approximately 0.01 atoms per
                    - generic [ref=f318e4]:
                      - text: cm
                      - superscript [ref=f318e5]: "3"
                    - text: —than the average interstellar density of about 1 atom per
                    - generic [ref=f318e6]:
                      - text: cm
                      - superscript [ref=f318e7]: "3"
                    - text: . This local gas has a temperature of about a million degrees, just like the gas in the other superbubbles that spread throughout our Galaxy, but because there is so little hot material, this high temperature does not affect the stars or planets in the area in any way.
                  - paragraph [ref=f318e8]: What caused the Local Bubble to form? Scientists are not entirely sure, but the leading candidate is winds from stars and supernova explosions. In a nearby region in the direction of the constellations Scorpius and Centaurus, a lot of star formation took place about 15 million years ago. The most massive of these stars evolved very quickly until they produced strong winds, and some ended their lives by exploding. These processes filled the region around the Sun with hot gas, driving away cooler, denser gas. The rim of this expanding superbubble reached the Sun about 7.6 million years ago and now lies more than 200 light-years past the Sun in the general direction of the constellations of Orion, Perseus, and Auriga.
                  - 'figure "Figure 20.19 : Sky in X-Rays. This image, made by the ROSAT satellite, shows the whole sky in X-rays as seen from Earth. Different colors indicate different X-ray energies: red is 0.25 kiloelectron volts, green is 0.75 kiloelectron volts, and blue is 1.5 kiloelectron volts. The image is oriented so the plane of the Galaxy runs across the middle of the image. The ubiquitous red color, which does not disappear completely even in the galactic plane, is evidence for a source of X-rays all around the Sun. (credit: modification of work by NASA)" [ref=f318e9]':
                    - img "In this image of the X-ray sky the dark, dusty plane of the Milky Way runs from left to right across the center of the picture. Blue light (1.5 keV) is scattered all along the lower portion of the dark band of the Milky Way. At center, extending above and below the dark band is a circular region of green (0.75 keV), and covering the entire image is the red glow of 0.25 keV X-rays." [ref=f318e11]
                  - paragraph [ref=f318e13]:
                    - text: A few clouds of interstellar matter do exist within the Local Bubble. The Sun itself seems to have entered a cloud about 10,000 years ago. This cloud is warm (with a temperature of about 7000 K) and has a density of 0.3 hydrogen atom per
                    - generic [ref=f318e14]:
                      - text: cm
                      - superscript [ref=f318e15]: "3"
                    - text: —higher than most of the Local Bubble but still so tenuous that it is also referred to as Local Fluff (Figure 20.20). (Aren’t these astronomical names fun sometimes?)
                  - paragraph [ref=f318e16]: While this is a pretty thin cloud, we estimate that it contributes 50 to 100 times more particles than the solar wind to the diffuse material between the planets in our solar system. These interstellar particles have been detected and their numbers counted by the spacecraft traveling between the planets. Perhaps someday, scientists will devise a way to collect them without destroying them and to return them to Earth, so that we can touch—or at least study in our laboratories—these messengers from distant stars.
                  - figure [ref=f318e17]:
                    - img [ref=f318e19]
                    - generic [ref=f318e20]:
                      - text: "Figure 20.20 : Local Fluff. The Sun and planets are currently moving through the Local Interstellar Cloud, which is also called the Local Fluff. Fluff is an appropriate description because the density of this cloud is only about 0.3 atom per"
                      - generic [ref=f318e21]:
                        - text: cm
                        - superscript [ref=f318e22]: "3"
                      - text: . In comparison, Earth’s atmosphere at the edge of space has around 1.2 × 10
                      - superscript [ref=f318e23]: "13"
                      - text: molecules per
                      - generic [ref=f318e24]:
                        - text: cm
                        - superscript [ref=f318e25]: "3"
                      - text: ". This image shows the patches of interstellar matter (mostly hydrogen gas) within about 20 light-years of the Sun. The temperature of the Local Interstellar Cloud is about 7000 K. The arrows point toward the directions that different parts of the cloud are moving. The names associated with each arrow indicate the constellations located on the sky toward which the parts of the cloud are headed. The solar system is thought to have entered the Local Interstellar Cloud, which is a small cloud located within a much larger superbubble that is expanding outward from the Scorpius-Centaurus region of the sky, at some point between 44,000 and 150,000 years ago and is expected to remain within it for another 10,000 to 20,000 years. (credit: modification of work by NASA/Goddard/Adler/University Chicago/Wesleyan)"
