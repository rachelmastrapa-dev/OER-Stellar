              - textbox "Rich Text Editor, editarea" [active] [ref=f511e332]: "<h2>Figure 16.1.1 Whirlpool Galaxy</h2> <p>An illustration of the Whirlpool Galaxy, drawn by Lord Rosse.</p> <h3>Illustration Elements</h3> <ul> <li>Rendered in black and white using shading to represent the brightness of different regions.</li> <li>A dense, tightly wound spiral structure is in the center of the drawing, with the darkest shading at the core.</li> <li>Several spiral arms wind outward from the core, gradually becoming fainter toward the outer edges.</li> <li>A smaller, separate patch of shading appears near the upper right, corresponding to a companion galaxy detached from the main spiral structure.</li> <li>Small numbers are scattered across the drawing, marking specific points of reference within the structure.</li> </ul> <h2>Figure 16.1.2 Messier 51</h2> <p>A Hubble Space Telescope image of the Whirlpool Galaxy.</p> <h3>Image Elements</h3> <ul> <li>The Whirlpool Galaxy, a spiral galaxy, occupies most of the image, with a bright, yellow-white core at its center.</li> <li>Two prominent spiral arms wind outward from the core, traced by dark, reddish-brown lanes of dust.</li> <li>Bright pink patches are scattered along the spiral arms, marking regions of active star formation.</li> <li>Clusters of blue stars line the spiral arms, representing groups of young, hot stars.</li> <li>A smaller, yellow companion galaxy, NGC 5195, is located to the right, joined to the Whirlpool Galaxy by a faint arm of stars and dust.</li> </ul> <h2>Figure 16.1.3 Andromeda Galaxy</h2> <p>Visible light image of the Andromeda Galaxy and two satellite galaxies.</p> <h3>Image Elements</h3> <ul> <li>The Andromeda Galaxy, also known as M31, is a large spiral galaxy that fills most of the frame.</li> <li>The galaxy's disk is tilted and appears elongated, stretching from the upper left to the lower right of the image.</li> <li>A bright, glowing central bulge, or nucleus, marks the middle of the galaxy.</li> <li>Reddish-brown dust lanes form a mottled, ring-like pattern around the central bulge.</li> <li>Faint blue spiral arms extend outward from the center, dotted with clusters of stars.</li> <li>Thousands of foreground stars from our own galaxy are scattered across the black background, appearing as small points of white, blue, and orange light.</li> <li>A smaller, round satellite galaxy, M32, appears as a compact glowing patch above and to the right of the galaxy's center.</li> <li>A second satellite galaxy, M110, appears as an elongated glowing patch below the main galaxy.</li> </ul> <p>Credit: Adam Evans</p> <h2>Figure 16.2.1 Classification of Galaxies</h2> <p>Diagram illustrating the tuning fork classification of galaxies.</p> <h3>Ellipticals</h3> <ul> <li>A row of five shapes runs along the left side of the diagram, connected by a blue line, labeled Ellipticals.</li> <li>From left to right, the shapes progress from round to increasingly flattened ovals, labeled E0, E3, E5, E7, and S0.</li> <li>E0 is a circular shape.</li> <li>E3 and E5 are progressively flatter ovals.</li> <li>E7 is a very elongated, thin oval.</li> <li>S0 is a more circular shape with a bright core, marking the transition point where the line splits into two branches.</li> <li>Below each labeled shape is an illustration of an elliptical galaxy of that type, shown as a fuzzy, glowing patch of light without spiral structure.</li> </ul> <h3>Spirals</h3> <ul> <li>From the S0 transition point, the upper branch of the line curves to the right and is labeled Spirals.</li> <li>Three illustrated spiral shapes are spaced along this branch, labeled Sa, Sb, and Sc from left to right.</li> <li>Sa has short, tightly wound spiral arms around a large central bulge.</li> <li>Sb has longer arms and a smaller central bulge.</li> <li>Sc has long, open, multiple spiral arms and a small central bulge.</li> <li>Above each illustrated type is an illustration of a spiral galaxy of that type.</li> </ul> <h3>Barred Spirals</h3> <ul> <li>From the S0 transition point, the lower branch of the line curves downward and to the right, forming the second prong of the tuning fork.</li> <li>Three illustrated barred spiral shapes are spaced along this branch, labeled SBa, SBb, and SBc from left to right.</li> <li>SBa has a short central bar with tightly wound arms extending from its ends.</li> <li>SBb has a longer bar with more open arms.</li> <li>SBc has a long, prominent bar with long, open arms extending from its ends.</li> <li>Below each illustrated type is an image of a real barred spiral galaxy of that type.</li> </ul> <p>Credit: NASA, ESA</p> <h2>Figure 16.2.2 Spiral Galaxies</h2> <p>Two images of spiral galaxies viewed from different angles, face-on and edge-on.</p> <h3>Image (a)</h3> <ul> <li>On the left</li> <li>A face-on image of the spiral galaxy M100, with the bulge, spiral arms, disk, and halo labeled.</li> <li>The Bulge label points to the bright, rounded region at the center of the galaxy.</li> <li>The Spiral arms label points, with two lines, to the curving arm structures extending from the center.</li> <li>The Disk label is in the lower part of the image indicating the rotating region that contains the spiral arms.</li> <li>The Halo label marks the faint outer region surrounding the disk and bulge.</li> <li>The spiral arms appear bluer than the rest of the galaxy, with red dust lanes trailing around them.</li> <li>Credit: modification of work by Hubble Legacy Archive, NASA, ESA, and Judy Schmidt</li> </ul> <h3>Image (b)</h3> <ul> <li>On the right</li> <li>An edge-on image of the spiral galaxy NGC 4565.</li> <li>The galaxy appears as a diagonal line of light extending from the upper right to the lower left.</li> <li>A thin, dark dust lane runs down the center of the galaxy along its entire length. Light glows around the dark dust.</li> <li>The central bulge is thicker than the thin surrounding disk and significantly brighter.</li> <li>Credit: modification of work by \"Jschulman555\"/Wikimedia</li> </ul> <h2>Figure 16.2.3 Barred Spiral Galaxy</h2> <p>An image of the barred spiral galaxy NGC 1300.</p> <h3>Image Elements</h3> <ul> <li>A large, bright spiral galaxy seen nearly face-on, filling most of the frame against a dark background of scattered stars.</li> <li>A straight, elongated bar of stars and dust extends through the center of the galaxy, rather than a rounded central bulge.</li> <li>Two spiral arms begin at the ends of the bar, curving outward and wrapping around the galaxy.</li> <li>The arms are lined with reddish dust lanes near the bar and lighter blue clusters of young stars farther out.</li> <li>A small, bright yellow-white nucleus sits at the center of the bar.</li> </ul> <p>Credit: NASA, ESA, and the Hubble Heritage Team (STScI/AURA)</p> <h2>Figure 16.2.4 Elliptical Galaxies</h2> <p>Two images of elliptical galaxies with different amounts of internal structure.</p> <h3>Image (a)</h3> <ul> <li>On the left</li> <li>An image of the giant elliptical galaxy ESO 325-G004, appearing as a large, nearly featureless oval of light with a bright central nucleus.</li> <li>The light of the galaxy is brightest at the center, and dims smoothly in all directions, revealing very little structure.</li> <li>Several other elliptical galaxies and background stars are scattered around the edges of the image.</li> <li>Credit: NASA, ESA, and The Hubble Heritage Team (STScI/AURA)</li> </ul> <h3>Image (b)</h3> <ul> <li>On the right</li> <li>An image of an unnamed elliptical galaxy that shows more internal structure than a typical elliptical, including faint wisps and irregular patches of light within the oval.</li> <li>This structure suggests the galaxy formed relatively recently from the collision of two spiral galaxies.</li> <li>A bright foreground star appears in the lower right of the image along with tiny, scattered stars and galaxies.</li> <li>Credit: ESA/Hubble, NASA</li> </ul> <h2>Figure 16.2.5 Dwarf Elliptical Galaxy</h2> <p>A black-and-white image of the dwarf elliptical galaxy M32.</p> <h3>Image Elements</h3> <ul> <li>A bright, featureless, oval-shaped glow of light fills the center of the image, brightest at its core and fading smoothly outward.</li> <li>The galaxy has no visible spiral arms or internal structure.</li> <li>Individual stars of the galaxy&nbsp;become visible as small points of light at the outer edges of the galaxy, where the density of stars declines.</li> <li>The surrounding field is dark and scattered with faint background stars.</li> <li>Credit: NOAO/AURA/NSF</li> </ul> <h2>Figure 16.2.6 Large Magellanic Cloud</h2> <p>A wide-field image of the irregular dwarf galaxy the Large Magellanic Cloud.</p> <h3>Image Elements</h3> <ul> <li>A large, elongated, hazy cloud of stars and gas stretches diagonally across the center of the image, brighter and denser toward the middle.</li> <li>The central region glows with a soft pink and white haze, dotted with many individual stars.</li> <li>Most of the stars are red, but there is a group of blue stars on its up right side.</li> <li>A bright, colorful clustering of stars and glowing gas, the Tarantula Nebula, appears as a distinct bright patch to the upper left of the galaxy's center.</li> <li>Numerous smaller clusters of blue and red stars are scattered throughout the galaxy, marking regions of active star formation.</li> <li>The galaxy has no organized spiral or elliptical structure, giving it an irregular, patchy shape.</li> <li>A dense field of foreground stars in various colors, blue, white, orange, and red, fills the surrounding dark background.</li> </ul> <h2>Figure 16.3.1 The Pinwheel Galaxy</h2> <p>A face-on image of a spiral galaxy taken by the Hubble Space Telescope.</p> <h3>Image Elements</h3> <p>Credit: NASA, ESA, K. Kuntz (Johns Hopkins University), F. Bresolin (University of Hawaii), J. Trauger (Jet Propulsion Lab), J. Mould (NOAO), Y.-H. Chu (University of Illinois, Urbana), and STScI</p> <ul> <li>The galaxy fills most of the frame, oriented face-on so its full spiral structure is visible.</li> <li>A bright, compact, yellowish-white core sits near the center of the galaxy.</li> <li>Multiple spiral arms wind outward from the core in a spiral pattern, tightly wound near the center and loosening toward the outer edge, similar to a pinwheel shape.</li> <li>The spiral arms are traced by reddish-brown dust lanes and clusters of bright blue points marking regions of active star formation.</li> <li>The outer regions of the galaxy fade into faint, diffuse blue light with wispy, irregular edges rather than a sharp boundary.</li> <li>A patch of clumpy blue material extends from the upper left edge of the galaxy, appearing separate from the main spiral structure.</li> <li>Numerous foreground stars are scattered across the black background, appearing as small white, blue, and orange points of light.</li> </ul> <h2>Figure 16.4.1 Cepheid Variable Star</h2> <p>A Hubble Space Telescope image of the galaxy M100 with three close-up insets tracking a variable star's brightness over time.</p> <h3>Background Image</h3> <ul> <li>A grayscale image shows part of the spiral galaxy M100, with part of the bright, dense nuclear bulge toward the lower left and fainter, thinner spiral arms curving to the right and down.</li> <li>A small white square near the right of the image marks the location of the Cepheid variable star.</li> <li>Two thin lines extend upward from the square, connecting it to the closest inset panels above.</li> </ul> <h3>May 4</h3> <ul> <li>Top left inset panel.</li> <li>A close-up, grainy, black-and-white view of the marked region.</li> <li>The target star is faint and difficult to distinguish from the surrounding scattered points of light.</li> </ul> <h3>May 9</h3> <ul> <li>Top center inset panel.</li> <li>The same region as the May 4 panel, showing the target star slightly brighter and easier to distinguish near the center of the panel.</li> </ul> <h3>May 31</h3> <ul> <li>Top right inset panel.</li> <li>The same region again, with the target star now clearly the brightest point in the panel, standing out against the surrounding fainter stars.</li> </ul> <p>Credit: Wendy L. Freedman, Observatories of the Carnegie Institution of Washington, and NASA/ESA</p> <h2>Figure 16.4.2 Type Ia Supernova</h2> <p>An image of a type Ia supernova outshining its host spiral galaxy.</p> <h3>Image Elements</h3> <ul> <li>A very bright, white star-like point of light with prominent spikes, sits left of center.</li> <li>This bright point is the type Ia supernova, appearing far brighter than any individual star in the surrounding field.</li> <li>A spiral galaxy that is not quite face-on is in the upper right of the image, with a bright central bulge and dusty, reddish-brown spiral arms winding outward.</li> <li>A second, fainter bright star with is&nbsp;near the top of the galaxy, above and to the left of its center.</li> <li>The supernova lies at the outer edge of the galaxy's spiral arms, appearing much brighter than the galaxy's own bright core despite being part of the same system.</li> <li>The background is filled with numerous faint, distant galaxies of varying shapes, along with scattered foreground stars.</li> </ul> <p>Credit: NASA, ESA, A. Riess (STScI)</p> <h2>Figure 16.5.1 Hubble's Law</h2> <p>Two charts comparing Hubble's early velocity-distance data to a later, more extensive dataset.</p> <h3>Chart (a): Hubble's Data (1929)</h3> <ul> <li>The vertical axis is labeled Velocity (km/s) and goes from 0 at the bottom to 1500 at the top, in increments of 500 km/s.</li> <li>The horizontal axis is labeled Distance (millions of LY) and goes from 0 on the left to 6 on the right, in increments of 3 million light-years.</li> <li>Red dots show individual galaxy measurements, scattered broadly around a general upward trend, with substantial spread at any given distance.</li> <li>A red line representing the average trend runs from about 0 million LY, 0 km/s at the lower left to about 6 million LY, 1000 km/s at the upper right.</li> </ul> <h3>Chart (b): Hubble and Humason (1931)</h3> <ul> <li>The vertical axis is labeled Velocity (km/s) and goes from 0 at the bottom to 20,000 at the top, in increments of 5,000 km/s.</li> <li>The horizontal axis is labeled Distance (millions of LY) and goes from 0 on the left to 120 on the right, in increments of 30 million light-years.</li> <li>Black dots show individual galaxy measurements, following a tight, nearly straight upward trend extending out to about 100 million light-years and 19,000 km/s.</li> <li>A black line representing the average trend runs from about 0 million LY, 0 km/s at the lower left to about 100 million LY, 19,000 km/s at the upper right.</li> <li>The red data points from Chart (a) are also plotted here, clustered near the lower left corner, showing how limited the 1929 dataset was compared to the 1931 dataset.</li> </ul> <h3>Key Trend</h3> <ul> <li>Both charts show that galaxy velocity increases with distance, but the 1931 dataset extends to distances and velocities roughly 20 times greater than the 1929 dataset, with a much tighter, more clearly linear relationship.</li> </ul> <h2>Figure 16.5.2 Stretching a Ruler</h2> <p>A diagram of two rulers, one normal and one stretched, illustrating how ants on the stretched ruler move apart.</p> <h3>Top Ruler (Normal Length)</h3> <ul> <li>A short wooden ruler marked with tick marks labeled 0 through 12 in increments of 2.</li> <li>Four ants sit on the ruler, positioned above the marks at 2, 4, 7, and 12.</li> </ul> <h3>Bottom Ruler (Stretched)</h3> <ul> <li>A longer wooden ruler, stretched to about twice the length of the top ruler, with arrows at both ends indicating the stretching.</li> <li>The same tick marks, labeled 0 through 12, are now spaced twice as far apart as on the top ruler.</li> <li>The four ants remain positioned above the same numbers, 2, 4, 7, and 12, but are now spread farther apart in physical space because the ruler has stretched.</li> <li>The assumption is that it took 1 minute for the ruler to stretch.</li> <li>Three labeled arrows beneath the ruler show the speed at which each pair of neighboring ants moves apart, as seen by the ant at position 2: <ul> <li>Between 2 and 4: 2 cm/min.</li> <li>Between 4 and 7: 5 cm/min.</li> <li>Between 7 and 12: 10 cm/min.</li> </ul> </li> </ul> <h3>Key Takeaway</h3> <ul> <li>The farther apart two ants are on the ruler, the faster they appear to move away from each other as the ruler stretches, illustrating that recession speed is proportional to distance.</li> </ul> <h2>Figure 16.5.3 Expanding Raisin Bread</h2> <p>A diagram of two loaves of raisin bread, one unrisen and one expanded, showing the raisins inside the loves moving farther apart.</p> <h3>Unrisen Loaf (30 cm)</h3> <ul> <li>A smaller loaf of bread, 30 cm wide, with several raisins scattered through its right half.</li> <li>A reference raisin near the upper left of the raisin-filled region has arrows pointing to four other raisins, each labeled with its distance from the reference.</li> <li>Clockwise from upper left, the distances are 3 cm, 16 cm, 20 cm, and 7 cm.</li> </ul> <h3>Risen Loaf (60 cm)</h3> <ul> <li>A larger loaf of bread, 60 cm wide, twice the width of the unrisen loaf, with the same raisins now spread farther apart.</li> <li>The same reference raisin has arrows to the same four raisins, with the distances increased proportionally.</li> <li>Clockwise from upper left, the distances are now 6 cm, 32 cm, 40 cm, and 14 cm.</li> </ul> <h3>Key Takeaway</h3> <ul> <li>Every distance from the reference raisin has doubled as the loaf doubled in width, so raisins that started farther away end up moving away faster than raisins that started close by.</li> </ul>"
