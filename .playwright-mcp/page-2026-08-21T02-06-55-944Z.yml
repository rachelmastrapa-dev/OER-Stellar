                  - heading "Proper Motion" [level=3] [ref=f240e2]
                  - paragraph [ref=f240e3]:
                    - text: There is another type of motion stars can have that cannot be detected with stellar spectra. Unlike radial motion, which is along our line of sight (i.e., toward or away from Earth), this motion, called proper motion, is
                    - emphasis [ref=f240e4]: transverse
                    - text: ": that is, across our line of sight. We see it as a change in the relative positions of the stars on the celestial sphere (Figure 17.11). These changes are very slow. Even the star with the largest proper motion takes 200 years to change its position in the sky by an amount equal to the width of the full Moon, and the motions of other stars are smaller yet."
                  - 'figure "Figure 17.11 : Large Proper Motion. Three photographs of Barnard’s star, the star with the largest known proper motion, show how this faint star has moved over a period of 20 years. (modification of work by Steve Quirk)" [ref=f240e5]':
                    - img "Photographs of Barnard’s Star demonstrating its large proper motion. At left (a) the star is seen in the center of an image taken in 1985, along with several background stars. At center (b) is the same field as photographed in 1995. The background stars have not moved, but Barnard’s Star has moved downward from the center of the image (where is was seen in 1985). At right (c) is the same field in 2005. The background stars have again not moved, and Barnard’s Star is now near the bottom of the image." [ref=f240e7]
                  - paragraph [ref=f240e9]: For this reason, with our naked eyes, we do not notice any change in the positions of the bright stars during the course of a human lifetime. If we could live long enough, however, the changes would become obvious. For example, some 50,000 years from now, terrestrial observers will find the handle of the Big Dipper unmistakably more bent than it is now (Figure 17.12).
                  - 'figure "Figure 17.12 : Changes in the Big Dipper. This figure shows changes in the appearance of the Big Dipper due to proper motion of the stars over 100,000 years." [ref=f240e10]':
                    - img "Illustrations of changes in the Big Dipper as a result of proper motion. The upper panel shows the seven stars of the Big Dipper as they appeared 50,000 years ago. The central panel shows how the asterism appears today, with an arrow attached to each star pointing in the direction of its proper motion across the sky. The bottom panel shows how the Big Dipper will appear in 50,000 years." [ref=f240e12]
                  - paragraph [ref=f240e14]: We measure the proper motion of a star in arcseconds (1/3600 of a degree) per year. That is, the measurement of proper motion tells us only by how much of an angle a star has changed its position on the celestial sphere. If two stars at different distances are moving at the same velocity perpendicular to our line of sight, the closer one will show a larger shift in its position on the celestial sphere in a year’s time. As an analogy, imagine you are standing at the side of a freeway. Cars will appear to whiz past you. If you then watch the traffic from a vantage point half a mile away, the cars will move much more slowly across your field of vision. In order to convert this angular motion to a velocity, we need to know how far away the star is.
                  - paragraph [ref=f240e15]: To know the true space velocity of a star—that is, its total speed and the direction in which it is moving through space relative to the Sun—we must know its radial velocity, proper motion, and distance (Figure 17.13). A star’s space velocity can also, over time, cause its distance from the Sun to change significantly. Over several hundred thousand years, these changes can be large enough to affect the apparent brightnesses of nearby stars. Today, Sirius, in the constellation Canis Major (the Big Dog) is the brightest star in the sky, but 100,000 years ago, the star Canopus in the constellation Carina (the Keel) was the brightest one. A little over 200,000 years from now, Sirius will have moved away and faded somewhat, and Vega, the bright blue star in Lyra, will take over its place of honor as the brightest star in Earth’s skies.
                  - figure [ref=f240e16]:
                    - img [ref=f240e18]
                    - generic [ref=f240e19]:
                      - text: "Figure 17.13 : Space Velocity and Proper Motion. This figure shows the true space velocity of a star. The radial velocity is the component of the space velocity projected along the line of sight from the Sun to a star. The transverse velocity is a component of the space velocity projected on the sky. What astronomers measure is proper motion (μ), which is the change in the apparent direction on the sky measured in fractions of a degree. To convert this change in direction to a speed in, say, kilometers per second, it is necessary to also know the distance ("
                      - emphasis [ref=f240e20]: d
                      - text: ) from the Sun to the star.
                  - paragraph [ref=f240e21]
