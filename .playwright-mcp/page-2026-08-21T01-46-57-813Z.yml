            - application "Rich Text Editor, editarea" [ref=f113e330]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f113e344]: "<h2>Sampling the Stars</h2> <p class=\"lt-phys-64678\">Imagine if astronomers had to collect a sample of the Sun to discover its composition. One challenge would be the distance between the Sun and the Earth. Another is the temperature of the Sun. The Sun's atmosphere is around 5700 K, much too hot for a human to survive. It is also too hot for any kind of technology that humans can build to not be quickly destroyed. Fortunately, astronomers are able to determine the composition of the Sun by analyzing its spectrum. Analyzing an object from a distance is called <strong><a href=\"/Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.08:_Key_Terms#remote sensing\" target=\"_blank\" title=\"remote sensing\">remote sensing</a></strong>.</p> <p class=\"lt-phys-64678\">Analysis of spectra is the key to modern astronomy. This is the only way astronomers can sample&nbsp;the stars, which are significantly farther away than the Sun. Encoded in the light from celestial objects is clear information about the chemical makeup of these objects. Only by understanding what the stars were made of could astronomers begin to form theories about what made them shine and how they evolved.</p> <p>One spectrum of a star, the Sun, tells us the composition of one star. As astronomers observed the stars, they noted that just as stars have different visible colors, they also have different spectra. Once a scientist collects a large amount of data, such as the spectra of hundreds of stars, the next step is to organize the spectra into groups. Once those groups are created, it is up to the astronomers to determine why stars have different types of spectra. Are they all made of different types of material, or are other physical properties of the stars affecting the spectra?</p> <h2>Organizing Spectral Data</h2> <p class=\"lt-phys-64759\">Although&nbsp;many astronomers began collecting spectra of stars, one of the most impressive observing programs took place at the Harvard College Observatory. The observatory's director, <a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.17:_Pickering_Edward_C.\" target=\"_blank\" title=\"18.1.17: Pickering, Edward C.\">Edward Pickering</a>,&nbsp;hired a group of female astronomers, known as the Harvard Computers, to analyze the data.&nbsp;In the 1880s, one of the computers, <a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.08:_Fleming_Williamina\" title=\"18.1.8: Fleming, Williamina\">Williamina <span class=\"no-emphasis\" data-type=\"term\" group-by=\"F\">Fleming</span></a>,&nbsp;devised a system to classify roughly 10,000 stars based on the strength of hydrogen absorption lines. Spectra with the strongest lines were classified as A&nbsp;stars, the next strongest B, and so on down the alphabet to O stars, in which the hydrogen lines were very weak.</p> <p>With Fleming's system, it would be reasonable to conclude that some stars are made of hydrogen and other stars are made of something else. Among&nbsp;the computers there was some disagreement regarding how the stars were organized in classes. When analyzing groups of data, it is good to see if there are other factors that may be affecting the data. The computers not only measured spectra of stars, they also knew the colors, and therefore the temperatures of the stars.</p> <p><a href=\"/Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.04:_Cannon_Annie_Jump\" title=\"18.1.4: Cannon, Annie Jump\">Annie Jump Cannon</a>&nbsp;was another of the computers who managed to classify around 500,000 stars over her lifetime, at a rate of up to three stars per minute. She revised the classification of stars by focusing on just a few letters from the original system: A, B, F, G, K, M, and O. She then rearranged them in order of decreasing temperature into the sequence O, B, A, F, G, K, M. This is how astronomers ended up with a group of letters that doesn't make sense at first glance. This is the system that astronomers still use today.</p> <h2>Spectral Classes</h2> <p class=\"lt-phys-64759\">After Annie Jump Cannon created the spectral classes, astronomers created subclasses within each letter and&nbsp;added three more classes L, T, and Y. They were able to do this as telescope and detector technology improved and they gathered more data. Each of these spectral classes is further subdivided into 10 subclasses designated by the numbers 0 through 9. A B0 star is the hottest type of B star while a B9 star is the coolest type of B star and is only slightly hotter than an A0 star. Each star is assigned a letter and number based&nbsp;on its temperature and spectral characteristics. For example, the Sun is G2 while Polaris is an F7. There are further subclasses, but we will not get into those here.</p> <p class=\"lt-phys-64759\">Figure \\(\\PageIndex{1}\\) is a table of images representing each&nbsp;spectral classes. The spectral classes, O to Y, are listed in the first column and the first row is the subclasses 0 to 9. The O0 star is dark blue with a lighter blue center. Moving along the row of O stars, the shade of blue changes from dark to light blue. B0 is slightly lighter blue than O9 and the rest of the B row changes to cyan by B9. This pattern continues through the row of Y stars and is summarized in Table \\(\\PageIndex{1}\\).</p> <figure><img alt=\"Star classification table. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/66988/Star_classification_table.png\" /> <figcaption>Figure \\(\\PageIndex{1}\\): These images of stars are organized by stellar classes.&nbsp;(<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\" target=\"_blank\" title=\"CC0\">CC0</a>; <a href=\"https://commons.wikimedia.org/wiki/User:BIG_DADDY_Dunkleosteuss\" target=\"_blank\" title=\"BIG DADDY Dunkleosteuss\">BIG DADDY Dunkleosteuss</a> via <a href=\"https://commons.wikimedia.org/wiki/File:Star_classification_table.png\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>).<a href=\"/Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.09:_Accessible_Descriptions#Figure_4.4.1_Star_Classification_Table\" title=\"4.9: Accessible Descriptions\">&nbsp;Alternative description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64759\">Now that the stellar classes are clearly defined, new stars can be easily classified by measuring the color of the star. However, the differences in spectra between classes is still important. Figure \\(\\PageIndex{2}\\) includes examples of 13 different stellar spectra ranging from O to M. In spectral type A1 the strongest four lines include one in the red, one in the blue-green, and two in the blue. These are the Balmer lines of hydrogen. These lines weaken at both higher (O and B) and lower (F-M) temperatures. The strong pair of closely spaced lines in the yellow in the cool stars (K and M) is due to neutral sodium. Given an unclassified stellar spectrum, an astronomer can match the pattern of spectral lines to a star whose type has already been determined.</p> <figure><img alt=\"Composite image of the spectra of 13 stars of different spectral classes. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/45951/d2cc0928e8f9fda083f507e65a49ff67ee3de663\" /> <figcaption>Figure \\(\\PageIndex{2}\\): Spectra of Different Classes. Each class of stars has a different spectrum. The spectral class assigned to each of these stellar spectra is listed on the left. <span class=\"mt-bgcolor-f1c40f\">(</span><a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\"><span class=\"mt-bgcolor-f1c40f\">CC BY 4.0</span></a><span class=\"mt-bgcolor-f1c40f\">; </span><a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\"><span class=\"mt-bgcolor-f1c40f\">Fraknoi</span><span class=\"mt-bgcolor-f1c40f\">, et al.</span></a><span class=\"mt-bgcolor-f1c40f\"> via </span><a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\"><span class=\"mt-bgcolor-f1c40f\">Openstax</span><span class=\"mt-bgcolor-f1c40f\"> Astronomy </span><span class=\"mt-bgcolor-f1c40f\">2nd</span><span class=\"mt-bgcolor-f1c40f\"> ed.</span></a><span class=\"mt-bgcolor-f1c40f\">).&nbsp;</span><a href=\"/Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.09:_Accessible_Descriptions#Figure_4.4.2_Spectra_of_Different_Classes\" title=\"4.9: Accessible Descriptions\">Alternative description&nbsp;of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <p>We know that the Sun is made of hydrogen because astronomers identified the spectral lines. However, the spectra of different stellar classes have different absorption lines. The classes B through F have the strongest hydrogen lines of all of the classes. The other classes have weaker hydrogen lines, but have lines from a variety of materials, such as sodium, iron, magnesium, and more listed in Table \\(\\PageIndex{2}\\). Does this mean that different classes of stars are made of different types of materials? As astronomers collected spectral data, other researches collected more data in the lab and also developed more complicated models of electronic transitions in atoms. They eventually learned that the spectral lines that appear depend strongly on the temperature of the material they come from, which is explained in the next section.</p> <table class=\"mt-responsive-table\"> <caption>Table \\(\\PageIndex{2}\\): Spectral Classes of Stars</caption> <thead> <tr valign=\"top\"> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Spectral Class</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Color</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Approximate Temperature (K)</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Principal Features</th> <th data-align=\"center\" data-valign=\"top\" scope=\"col\">Examples</th> </tr> </thead> <tbody> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">O</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Dark to light blue</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">&gt; 30,000</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Neutral and ionized helium lines, weak hydrogen lines</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">10 Lacertae,&nbsp;Orion Belt Stars (3 stars)</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">B</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Light blue to cyan</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">10,000–30,000</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Neutral helium lines, strong hydrogen lines</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">Rigel, Spica</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">A</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Light green to white</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">7500–10,000</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Strongest hydrogen lines, weak ionized calcium lines, weak ionized metal (e.g., iron, magnesium) lines</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\"><span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span>, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vega</span></td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">F</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">White to yellow</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">6000–7500</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Strong hydrogen lines, strong ionized calcium lines, weak sodium lines, many ionized metal lines</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">Canopus, Procyon, Polaris</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">G</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Yellow to orange</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">5200–6000</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Weaker hydrogen lines, strong ionized calcium lines, strong sodium lines, many lines of ionized and neutral metals</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\"><span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sun</span>, Capella</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">K</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Orange to light red</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">3700–5200</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Very weak hydrogen lines, strong ionized calcium lines, strong sodium lines, many lines of neutral metals</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">Arcturus, Aldebaran</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">M</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Light red to dark red</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">2400–3700</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Strong lines of neutral metals and molecular bands of titanium oxide dominate</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\"><span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Betelgeuse (Orion's Armpit)</span>, Antares</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">L</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Red losing brightness</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">1300–2400</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Metal hydride lines, alkali metal lines (e.g., sodium, potassium, rubidium)</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">Teide 1</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">T</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Magenta, low brightness</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">700–1300</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Methane lines</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">Gliese 229B</td> </tr> <tr valign=\"top\"> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Spectral Class\" data-valign=\"top\">Y</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Color\" data-valign=\"top\">Infrared</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Approximate Temperature (K)\" data-valign=\"top\">&lt; 700</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Principal Features\" data-valign=\"top\">Ammonia lines</td> <td class=\"lt-phys-64759\" data-align=\"left\" data-th=\"Examples\" data-valign=\"top\">WISE 1828+2650</td> </tr> </tbody> </table> <h2>Temperature and Spectra</h2> <p>The spectra of a gas is also dependent on the temperature of a gas. Emission spectra are created when a warm gas releases photons and specific wavelengths. Assuming that, like the Sun, all stars are made of hydrogen, how does temperature affect the spectra of stars. In the atmospheres of the hottest stars, hydrogen atoms are completely ionized. Because the electron and the proton are separated, ionized hydrogen cannot produce absorption lines.</p> <p class=\"lt-phys-64759\">In the atmospheres of the coolest stars, hydrogen atoms have their electrons attached and can switch energy levels to produce lines. However, practically all of the hydrogen atoms are in the lowest energy state in these stars and thus can absorb only those photons able to lift an electron from that first energy level to a higher level. Photons with enough energy to do this lie in the ultraviolet part of the electromagnetic spectrum, and there are very few ultraviolet photons in the radiation from a cool star. What this means is that if you observe the spectrum of a very hot or very cool star with a typical telescope on the surface of Earth, the most common element in that star, hydrogen, will show very weak spectral lines or none at all.</p> <p class=\"lt-phys-64759\">The hydrogen lines in the visible part of the spectrum Balmer lines are strongest in stars with intermediate temperatures. Calculations show that the optimum temperature for producing visible hydrogen lines is about 10,000 K. At this temperature, an large amount of hydrogen atoms are excited to the second energy level. They can then absorb additional photons, rise to higher levels of excitation, and produce a dark absorption line. Similarly, every other chemical element, in each of its possible stages of ionization, has a characteristic temperature at which it is most effective in producing absorption lines in any particular part of the spectrum.</p> <p class=\"lt-phys-64759\">In the hottest O stars, those with temperatures over 28,000 K, only lines of ionized helium and highly ionized atoms of other elements are conspicuous, Figure \\(\\PageIndex{3}\\). Hydrogen lines are strongest in A stars with atmospheric temperatures of about 10,000 K. Ionized metals provide the most conspicuous lines in stars with temperatures from 6000 to 7500 K, spectral type F. In the coolest M stars, below 3500 K, absorption bands of titanium oxide and other molecules are very strong.</p> <figure><img alt=\"Absorption line strength vs. temperature. Details in text.\" class=\"internal default\" src=\"/@api/deki/files/45952/0b7a7088cf0622031e0403ad5d070ad1eeaa0e73\" /> <figcaption>Figure \\(\\PageIndex{3}\\): Temperature Effect on Absorption. In this graph, the strengths of absorption lines of different atoms, ions, molecules change as a function of temperature. <span class=\"mt-bgcolor-f1c40f\">(</span><a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\"><span class=\"mt-bgcolor-f1c40f\">CC BY 4.0</span></a><span class=\"mt-bgcolor-f1c40f\">; </span><a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\"><span class=\"mt-bgcolor-f1c40f\">Fraknoi</span><span class=\"mt-bgcolor-f1c40f\">, et al.</span></a><span class=\"mt-bgcolor-f1c40f\"> via </span><a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\"><span class=\"mt-bgcolor-f1c40f\">Openstax</span><span class=\"mt-bgcolor-f1c40f\"> Astronomy </span><span class=\"mt-bgcolor-f1c40f\">2nd</span><span class=\"mt-bgcolor-f1c40f\"> ed.</span></a><span class=\"mt-bgcolor-f1c40f\">).</span>&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/04:_Stellar_Spectra/4.09:_Accessible_Descriptions#Figure_4.4.3_Temperature_Effect_on_Absorption\" title=\"4.9: Accessible Descriptions\">Alternative description of Figure \\(\\PageIndex{3}\\)</a>.</figcaption> </figure> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Further Exploration: Interactive Activity</span></h5> <ul> <li>Explore the <a href=\"https://foothillastrosims.github.io/SpectrumExplorer/\" title=\"https://foothillastrosims.github.io/SpectrumExplorer/\">AstroSims Spectrum Explorer</a> simulation&nbsp;to investigate how absorption and emission lines appear in stellar spectra and how astronomers use spectral patterns to identify elements and determine the properties of stars.</li> <li>Use the <a href=\"https://cas.sdss.org/dr12/en/proj/advanced/spectraltypes/studentclasses.aspx\" title=\"https://cas.sdss.org/dr12/en/proj/advanced/spectraltypes/studentclasses.aspx\">Sloan Digital Sky Survey Classifying Stars</a> activity&nbsp;to compare stellar spectra, identify absorption lines, and practice assigning spectral classifications based on observed spectral characteristics.</li> </ul> </section> <h2>References</h2> <p>Stellar Classification. (2026, Feb 13). In <em>Wikipedia</em>. <a href=\"https://en.wikipedia.org/w/index.php?title=Stellar_classification&amp;oldid=1338195752\" rel=\"freelink\" title=\"https://en.wikipedia.org/w/index.php?title=Stellar_classification&amp;oldid=1338195752\">https://en.wikipedia.org/w/index.php...did=1338195752</a></p> <p>Harvard Computers. (2026, March 11). In <em>Wikipedia</em>. <a href=\"https://en.wikipedia.org/w/index.php?title=Harvard_Computers&amp;oldid=1343012847\" rel=\"freelink\" title=\"https://en.wikipedia.org/w/index.php?title=Harvard_Computers&amp;oldid=1343012847\">https://en.wikipedia.org/w/index.php...did=1343012847</a></p> <h2>Attributions</h2> <p>This page was adapted from \"<a href=\"/Bookshelves/Astronomy__Cosmology/Introduction_to_Astronomy_(Lumen)/11:_Stellar_Properties/11.21:_Sample_Spectral_Types\" title=\"Sample Spectral Types\">Sample Spectral Types</a>\" in <a href=\"https://courses.lumenlearning.com/atd-fscj-introastronomy/\" title=\"Introduction to Astronomy (Lumen)\">Introduction to Astronomy (Lumen)</a> originally written by <a href=\"https://lumenlearning.com/\" title=\"Lumen Learning\">Lumen Learning</a>, and published under <a href=\"https://creativecommons.org/licenses/by/4.0/\" title=\"CC BY 4.0\">CC BY 4.0</a>.</p>"
