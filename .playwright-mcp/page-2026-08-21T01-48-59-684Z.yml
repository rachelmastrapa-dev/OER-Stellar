            - application "Rich Text Editor, editarea" [ref=f127e318]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f127e332]: "<ul> <li><a id=\"absorption-spectrum\" name=\"absorption-spectrum\"><strong>absorption spectrum</strong></a>: The unique pattern of dark lines that form when light passes through a material and into a spectrometer.</li> <li><a id=\"atomic-number\" name=\"atomic-number\"><strong>atomic number</strong></a>: The number of protons in an atom, Z.</li> <li><a id=\"brown-dwarf\" name=\"brown-dwarf\"><strong>brown dwarf</strong></a>: An object lacking the mass needed to sustain hydrogen fusion.</li> <li><a id=\"continuous-spectrum\" name=\"continuous-spectrum\"><strong>continuous spectrum</strong></a>: An uninterrupted distribution of colors according to wavelength.</li> <li><a id=\"electron\" name=\"electron\"><strong>electron</strong></a>: A particle in an atom with a negative charge.</li> <li><a id=\"element\" name=\"element\"><strong>element</strong></a>: Atoms that have the same number of protons, or the same atomic number.</li> <li><a id=\"emission-spectrum\" name=\"emission-spectrum\"><strong>emission spectrum</strong></a>: The spectrum that includes bright lines at the wavelengths related to the transition of an electron from a higher to lower energy level.</li> <li><a id=\"energy-levels\" name=\"energy-levels\"><strong>energy levels</strong></a>: The unique energy values of possible electron orbits.</li> <li><a id=\"excitation\" name=\"excitation\"><strong>excitation</strong></a>: The transition to an excited state of an electron that has absorbed a specific amount of energy.</li> <li><a id=\"ground-state\" name=\"ground-state\"><strong>ground state</strong></a>: The lowest possible energy state of an electron in an atom.</li> <li><a id=\"ion\" name=\"ion\"><strong>ion</strong></a>: An atom that has gained or lost an electron, leaving it in a positive or negative charge instead of neutral.</li> <li><a id=\"ionization\" name=\"ionization\"><strong>ionization</strong></a>: The removal or addition of one or more electrons from an atom.</li> <li><a id=\"isotope\" name=\"isotope\"><strong>isotope</strong></a>: When an atom has a number of neutrons that is not equal to its atomic number, or number of protons.</li> <li><a id=\"mass-number\" name=\"mass-number\"><strong>mass number</strong></a>: The total number of protons and neutrons in the nucleus of an atom, A.</li> <li><a id=\"neutron\" name=\"neutron\"><strong>neutron</strong></a>: A particle in an atom with a neutral charge.</li> <li><a id=\"nucleus\" name=\"nucleus\"><strong>nucleus</strong></a>: The center of an atom, consisting of protons and neutrons and having a positive charge.</li> <li><a id=\"opaque\" name=\"opaque\"><strong>opaque</strong></a>: When a material does not transmit light.</li> <li><a id=\"periodic-table\" name=\"periodic-table\"><strong>periodic table</strong></a>: A table of the elements organized by atomic number, electron configuration, and other properties.</li> <li><a id=\"proton\" name=\"proton\"><strong>proton</strong></a>: A particle in an atom with a positive charge.</li> <li><a id=\"quantum-number\" name=\"quantum-number\"><strong>quantum number</strong></a>: A number assigned to specific energy levels in an atom.</li> <li><a id=\"remote-sensing\" name=\"remote-sensing\"><strong>remote sensing</strong></a>: Learning about an object without coming into direct contact with it.</li> <li><a id=\"reflection\" name=\"reflection\"><strong>reflection</strong></a>: When light bounces off the surface of an object such as a mirror.</li> <li><a id=\"refraction\" name=\"refraction\"><strong>refraction</strong></a>: Changing of the path of light when passing from one medium to another.</li> <li><a id=\"spectral-line\" name=\"spectral-line\"><strong>spectral line</strong></a>: In a spectrum, light emitted or absorbed at a specific wavelength by an atom or molecule.</li> <li><a id=\"spectrum\" name=\"spectrum\"><strong>spectrum</strong></a>: The dispersion of light by wavelength.</li> <li><a id=\"transmission\" name=\"transmission\"><strong>transmission</strong></a>: When light passes through a material.</li> <li><a id=\"transparent\" name=\"transparent\"><strong>transparent</strong></a>: A material that light is able to pass through.</li> </ul>"
