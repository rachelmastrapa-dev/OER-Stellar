            - application "Rich Text Editor, editarea" [ref=f490e322]:
              - iframe [active] [ref=f490e323]:
                - generic [active] [ref=f492e1]:
                  - heading "Galaxies Beyond the Milky Way" [level=2] [ref=f492e2]
                  - paragraph [ref=f492e3]: A galaxy is a massive, gravitationally bound system of stars, stellar remnants, interstellar medium, and dark matter. The term galaxy comes from the Greek galaxias, literally translated as milk or milky, referring to our Milky Way galaxy. Galaxies can range in size from the dwarf galaxies as small as ten million stars, to giant galaxies with one hundred trillion stars. It is currently estimated that there are 170 billion galaxies in the Universe. Astronomer think that nearly all galaxies also contain planetary systems. That has not been confirmed, but is a solid theory based on what we have discovered in the Milky Way, and comparing the characteristics of the Milky Way to other galaxies. However, early astronomers did not even know that other galaxies existed.
                  - heading "Early Observations" [level=3] [ref=f492e4]
                  - paragraph [ref=f492e5]: Early astronomers differentiated between the planets and stars and deep sky objects. With the telescopes available in earlier centuries, galaxies looked like small fuzzy patches of light that were difficult to distinguish from the star clusters and gas-and-dust clouds that are part of our own Galaxy. All objects that were not sharp points of light were given the same name, nebulae, the Latin word for clouds.
                  - paragraph [ref=f492e6]: The study and discussions of galaxies goes back millennia. Abd al-Rahman al-Sufi, an astronomer from Persia, modern Iran, studied the Large Magellanic Cloud, an irregular galaxy, which he called Al Bakr. He also studied the Andromeda Galaxy, which he described as a small cloud.
                  - paragraph [ref=f492e7]: Thomas Wright hypothesized in 1750 that the Milky Way galaxy was a flattened disk of stars. Wright also thought that some of the 'nebulae' observed were actually objects like the Milky Way. Nebulae was the term used to describe all of these nebula-like objects, many of which are now known to be galaxies. Five years later, in 1755, Immanuel Kant coined the term Island Universe to describe these nebulae that Wright had hypothesized.
                  - paragraph [ref=f492e8]: "During the search for comets from 1771 to 1784, Charles Messier completed a catalog listing of a number of bright nebulae. The designations in this catalog, such as M51 for Messier 51, are still used today. Several of the Messier Objects are now known to be galaxies. When William Herschel created his 1786 catalogue of deep sky objects, he used the phrase spiral nebula for a number of the objects, such as the Andromeda nebula. This indicated that Herschel was able to discern the spiral nature of these objects. William Parsons, 3rd Earl of Rosse, was an engineer and astronomer. In 1845 he was able to differentiate between elliptical and spiral nebulae using his 72-inch telescope. Figure \\(\\PageIndex{1}\\) is Rosse's sketch of the spiral structure of the Whirlpool Galaxy, then classified as a spiral nebula. Figure \\(\\PageIndex{2}\\) is a Hubble Space Telescope image of the same object, also called Messier 51. Comparing the two figures, it is impressive how much detail Rosse was able to glean from his early observations, including the presence of the companion galaxy NGC5195, considering he did not know the true nature of the objects."
