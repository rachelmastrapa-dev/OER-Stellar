                  - heading "Nebulae or Galaxies" [level=3] [ref=f492e23]
                  - paragraph [ref=f492e24]: Into the 1920s, many astronomers thought the Milky Way encompassed all that exists in the universe. Because the precise shapes of galaxies were often hard to make out and no techniques had yet been devised for measuring their distances, the nature of the nebulae was the subject of much debate.
                  - paragraph [ref=f492e25]:
                    - text: In 1917, Heber Curtis (1872-1942) was observing a nova in the Andromeda galaxy, called nebula at the time. Researching previous novae, including those in the Milky Way, Curtis was convinced that Andromeda was indeed a galaxy much like the Milky Way Galaxy, and that the dust lanes seen in Andromeda were similar to those in the Milky Way Galaxy.
                    - link "Edwin Hubble" [ref=f492e26]:
                      - /url: /Workbench/De_Anza_-_ASTR10/18:_Appendices/18.01:_Alphabetical_List_of_Scientists/18.1.12:_Hubble_Edwin
                    - text: (1889-1953) settled that question a couple of years later when his research and observations determined "nebula" like Andromeda were indeed actually galaxies.
                  - heading "Identifying Other Galaxies" [level=3] [ref=f492e27]
                  - paragraph [ref=f492e28]: By the early twentieth century, some nebulae had been correctly identified as star clusters, and others, such as the Orion Nebula, as gaseous nebulae. Most nebulae, however, looked faint and indistinct, even with the best telescopes, and their distances remained unknown. If these nebulae were nearby, with distances comparable to those of observable stars, they were most likely clouds of gas or groups of stars within our Galaxy. If, on the other hand, they were remote, far beyond the edge of the Galaxy, they could be other star systems containing billions of stars. To determine what the nebulae are, astronomers had to find a way of measuring the distances to at least some of them. When the 2.5-meter (100-inch) telescope on Mount Wilson in Southern California went into operation, astronomers finally had the large telescope they needed to settle the controversy.
                  - paragraph [ref=f492e29]: "Working with the 2.5-meter telescope, Edwin Hubble was able to resolve individual stars in several of the brighter spiral-shaped nebulae, including M31, the great spiral in Andromeda. Figure \\(\\PageIndex{3}\\) the Andromeda galaxy, including the stars that Hubble was able to observe. When he analyzed the light curves, of some of the stars he discovered some faint variable stars also called cepheids. Henrietta Leavitt, and astronomer working at Harvard, had developed a technique of measuring distances in space by using cepheid variables. Using her method, Hubble estimated that the Andromeda galaxy was about 900,000 light-years away from us. At that enormous distance, it had to be a separate galaxy of stars located well outside the boundaries of the Milky Way. Today, we know the Andromeda galaxy is actually slightly more than twice as distant as Hubble's first estimate, but his conclusion about its true nature remains unchanged."
                  - figure [ref=f492e30]:
                    - img "Andromeda Galaxy with satellite galaxies M32 and M110. Details in caption." [ref=f492e31]
