                    - generic [ref=f26e105]: 
                    - text: "2.1: A Tour of the Universe"
                - definition [ref=f26e106]: We can now take a brief introductory tour of the universe as astronomers understand it today to get acquainted with the types of objects and distances you will encounter throughout the text.
            - listitem [ref=f26e107]:
