                  - paragraph [ref=f273e2]:
                    - text: "Before we can make our own survey, we need to agree on a unit of distance appropriate to the objects we are studying. The stars are all so far away that kilometers (and even astronomical units) would be very cumbersome to use; so—as discussed in Science and the Universe: A Brief Tour—astronomers use a much larger “measuring stick” called the"
                    - emphasis [ref=f273e3]: light-year
                    - text: ". A light-year is the distance that light (the fastest signal we know) travels in 1 year. Since light covers an astounding 300,000 kilometers per second, and since there are a lot of seconds in 1 year, a light-year is a very large quantity: 9.5 trillion"
                    - math [ref=f273e4]:
                      - generic [ref=f273e7]:
                        - generic [ref=f273e8]: (
                        - generic [ref=f273e9]: "9.5"
                        - generic [ref=f273e10]: ×
                        - generic [ref=f273e11]:
                          - generic [ref=f273e12]: "10"
                          - generic [ref=f273e13]: "12"
                        - generic [ref=f273e14]: )
                    - text: kilometers to be exact. (Bear in mind that the light-year is a unit of
                    - emphasis [ref=f273e15]: distance
                    - text: even though the term
                    - emphasis [ref=f273e16]: year
                    - text: appears in it.) If you drove at the legal US speed limit without stopping for food or rest, you would not arrive at the end of a light-year in space until roughly 12 million years had passed. And the closest star is more than 4 light-years away.
                  - paragraph [ref=f273e17]: Notice that we have not yet said much about how such enormous distances can be measured. That is a complicated question, to which we will return in Celestial Distances. For now, let us assume that distances have been measured for stars in our cosmic vicinity so that we can proceed with our census.
                  - heading "Small Is Beautiful—Or at Least More Common" [level=3] [ref=f273e18]
                  - paragraph [ref=f273e19]:
                    - text: When we do a census of people in the United States, we count the inhabitants by neighborhood. We can try the same approach for our stellar census and begin with our own immediate neighborhood. As we shall see, we run into two problems—just as we do with a census of human beings. First, it is hard to be sure we have counted
                    - emphasis [ref=f273e20]: all
                    - text: the inhabitants; second, our local neighborhood may not contain all possible types of people.
                  - paragraph [ref=f273e21]:
                    - text: Table 18.1 shows an estimate of the number of stars of each spectral type, as described in
                    - generic [ref=f273e22]: XXXX
                    - text: in our own local neighborhood—within 21 light-years of the Sun. (The Milky Way Galaxy, in which we live, is about 100,000 light-years in diameter, so this figure really applies to a
                    - emphasis [ref=f273e23]: very
                    - text: local neighborhood, one that contains a
                    - emphasis [ref=f273e24]: tiny
                    - text: fraction of all the billions of stars in the Milky Way.) You can see that there are many more low-luminosity (and hence low mass) stars than high-luminosity ones. Only three of the stars in our local neighborhood (one F type and two A types) are significantly more luminous and more massive than the Sun. This is truly a case where small triumphs over large—at least in terms of numbers. The Sun is more massive than the vast majority of stars in our vicinity.
                  - table [ref=f273e25]:
                    - caption [ref=f273e26]: "Table 18.1: Stars within 21 Light-Years of the Sun"
                    - rowgroup [ref=f273e27]:
                      - row [ref=f273e28]:
                        - columnheader "Spectral Type" [ref=f273e29]
                        - columnheader "Number of Stars" [ref=f273e30]
                    - rowgroup [ref=f273e31]:
                      - row [ref=f273e32]:
                        - cell "A" [ref=f273e33]
                        - cell "2" [ref=f273e34]
                      - row [ref=f273e35]:
                        - cell "F" [ref=f273e36]
                        - cell "1" [ref=f273e37]
                      - row [ref=f273e38]:
                        - cell "G" [ref=f273e39]
                        - cell "7" [ref=f273e40]
                      - row [ref=f273e41]:
                        - cell "K" [ref=f273e42]
                        - cell "17" [ref=f273e43]
                      - row [ref=f273e44]:
                        - cell "M" [ref=f273e45]
                        - cell "94" [ref=f273e46]
                      - row [ref=f273e47]:
                        - cell "White dwarfs" [ref=f273e48]
                        - cell "8" [ref=f273e49]
                      - row [ref=f273e50]:
                        - cell "Brown dwarfs" [ref=f273e51]
                        - cell "33" [ref=f273e52]
                  - paragraph [ref=f273e53]: This table is based on data published through 2015, and it is likely that more faint objects remain to be discovered (see Figure 18.2). Along with the L and T brown dwarfs already observed in our neighborhood, astronomers expect to find perhaps hundreds of additional T dwarfs and Y dwarfs. Many of these are likely to be even cooler than the coolest currently known T dwarf. The reason the lowest-mass dwarfs are so hard to find is that they put out very little light—ten thousand to a million times less light than the Sun. Only recently has our technology progressed to the point that we can detect these dim, cool objects.
                  - 'figure "Figure 18.2 : Dwarf Simulation. This computer simulation shows the stars in our neighborhood as they would be seen from a distance of 30 light-years away. The Sun is in the center. All the brown dwarfs are circled; those found earlier are circled in blue, the ones found recently with the WISE infrared telescope in space (whose scientists put this diagram together) are circled in red. The common M stars, which are red and faint, are made to look brighter than they really would be so that you can see them in the simulation. Note that luminous hot stars like our Sun are very rare. (credit: modification of work by NASA/ JPL-Caltech)" [ref=f273e54]':
                    - img "Computer Simulation of the Solar Neighborhood out to 30 Light Years. The Sun is labeled and surrounded by a white circle in the center of this image. Very few bright stars like the Sun are seen. All the known brown dwarfs are circled; those found earlier are circled in blue, the ones found recently with the WISE infrared telescope are circled in red. The very common M type stars are made to look bright in this image so they can be visible." [ref=f273e56]
                  - paragraph [ref=f273e58]:
                    - text: To put all this in perspective, we note that even though the stars counted in the table are our closest neighbors, you can’t just look up at the night sky and see them without a telescope; stars fainter than the Sun cannot be seen with the unaided eye unless they are
                    - emphasis [ref=f273e59]: very
                    - text: nearby. For example, stars with luminosities ranging from 1/100 to 1/10,000 the luminosity of the Sun (
                    - generic [ref=f273e60]:
                      - emphasis [ref=f273e61]: L
                      - subscript [ref=f273e62]: Sun
                    - text: ) are very common, but a star with a luminosity of 1/100
                    - generic [ref=f273e63]:
                      - emphasis [ref=f273e64]: L
                      - subscript [ref=f273e65]: Sun
                    - text: would have to be within 5 light-years to be visible to the naked eye—and only three stars (all in one system) are this close to us. The nearest of these three stars,
                    - generic [ref=f273e66]: Proxima Centauri
                    - text: ", still cannot be seen without a telescope because it has such a low luminosity."
                  - paragraph [ref=f273e67]: Astronomers are working hard these days to complete the census of our local neighborhood by finding our faintest neighbors. Recent discoveries of nearby stars have relied heavily upon infrared telescopes that are able to find these many cool, low-mass stars. You should expect the number of known stars within 21 light-years of the Sun to keep increasing as more and better surveys are undertaken.
                  - heading "Bright Does Not Necessarily Mean Close" [level=3] [ref=f273e68]
                  - paragraph [ref=f273e69]: If we confine our census to the local neighborhood, we will miss many of the most interesting kinds of stars. After all, the neighborhood in which you live does not contain all the types of people—distinguished according to age, education, income, race, and so on—that live in the entire country. For example, a few people do live to be over 100 years old, but there may be no such individual within several miles of where you live. In order to sample the full range of the human population, you would have to extend your census to a much larger area. Similarly, some types of stars simply are not found nearby.
                  - paragraph [ref=f273e70]: A clue that we are missing something in our stellar census comes from the fact that only six of the 20 stars that appear brightest in our sky—Sirius, Vega, Altair, Alpha Centauri, Fomalhaut, and Procyon—are found within 26 light-years of the Sun (Figure 18.3). Why are we missing most of the brightest stars when we take our census of the local neighborhood?
                  - 'figure "Figure 18.3 : The Closest Stars. (a) This image, taken with a wide-angle telescope at the European Southern Observatory in Chile, shows the system of three stars that is our nearest neighbor. (b) Two bright stars that are close to each other (Alpha Centauri A and B) blend their light together. (c) Indicated with an arrow (since you’d hardly notice it otherwise) is the much fainter Proxima Centauri star, which is spectral type M. (credit: modification of work by ESO)" [ref=f273e71]':
                    - img "The Closest Stars. Image (a) shows Alpha Centauri A and B as a single bright object against the background stars of the Milky Way. Panel (b) zooms in on Alpha Centauri A and B, with two small circles representing the individual stars superimposed on the image, larger Alpha Centauri A above and Alpha Centauri B below. Image (c) shows a close-up of the lower right portion of image (a). A white arrow points to what looks like one of the thousands of background stars. This is Proxima Centauri." [ref=f273e73]
                    - generic [ref=f273e74]:
                      - text: "Figure 18.3 : The Closest Stars. (a) This image, taken with a wide-angle telescope at the European Southern Observatory in Chile, shows the system of three stars that is our nearest neighbor. (b) Two bright stars that are close to each other ("
                      - generic [ref=f273e75]: Alpha Centauri
                      - text: A and B) blend their light together. (c) Indicated with an arrow (since you’d hardly notice it otherwise) is the much fainter
                      - generic [ref=f273e76]: Proxima Centauri
                      - text: "star, which is spectral type M. (credit: modification of work by ESO)"
                  - paragraph [ref=f273e77]:
                    - text: The answer, interestingly enough, is that the stars that appear brightest are
                    - emphasis [ref=f273e78]: not
                    - text: the ones closest to us. The brightest stars look the way they do because they emit a very large amount of energy—so much, in fact, that they do not have to be nearby to look brilliant. You can confirm this by looking at Appendix J, which gives distances for the 20 stars that appear brightest from Earth. The most distant of these stars is more than
                    - emphasis [ref=f273e79]: 1000 light-years
                    - text: from us. In fact, it turns out that most of the stars visible without a telescope are hundreds of light-years away and many times more luminous than the Sun. Among the 9000 stars visible to the unaided eye, only about 50 are intrinsically fainter than the Sun. Note also that several of the stars in Appendix J are spectral type B, a type that is completely missing from Table 18.1.
                  - paragraph [ref=f273e80]: The most luminous of the bright stars listed in Appendix J emit more than 50,000 times more energy than does the Sun. These highly luminous stars are missing from the solar neighborhood because they are very rare. None of them happens to be in the tiny volume of space immediately surrounding the Sun, and only this small volume was surveyed to get the data shown in Table 18.1.
                  - paragraph [ref=f273e81]: For example, let’s consider the most luminous stars—those 100 or more times as luminous as the Sun. Although such stars are rare, they are visible to the unaided eye, even when hundreds to thousands of light-years away. A star with a luminosity 10,000 times greater than that of the Sun can be seen without a telescope out to a distance of 5000 light-years. The volume of space included within a distance of 5000 light-years, however, is enormous; so even though highly luminous stars are intrinsically rare, many of them are readily visible to our unaided eye.
                  - paragraph [ref=f273e82]: The contrast between these two samples of stars, those that are close to us and those that can be seen with the unaided eye, is an example of a selection effect. When a population of objects (stars in this example) includes a great variety of different types, we must be careful what conclusions we draw from an examination of any particular subgroup. Certainly we would be fooling ourselves if we assumed that the stars visible to the unaided eye are characteristic of the general stellar population; this subgroup is heavily weighted to the most luminous stars. It requires much more effort to assemble a complete data set for the nearest stars, since most are so faint that they can be observed only with a telescope. However, it is only by doing so that astronomers are able to know about the properties of the vast majority of the stars, which are actually much smaller and fainter than our own Sun. In the next section, we will look at how we measure some of these properties.
