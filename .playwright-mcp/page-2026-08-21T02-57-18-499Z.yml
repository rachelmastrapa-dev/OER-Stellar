                  - heading "Dark Matter in Clusters of Galaxies" [level=3] [ref=f534e17]
                  - paragraph [ref=f534e18]: Galaxies in clusters orbit the cluster's center of mass. It is not possible for us to follow a galaxy around its entire orbit because that typically takes about a billion years. It is possible, however, to measure the velocities with which galaxies in a cluster are moving, and then estimate what the total mass in the cluster must be to keep the individual galaxies from flying out of the cluster. The observations indicate that the mass of the galaxies alone cannot keep the cluster together. Some other gravity must again be present. The total amount of dark matter in clusters exceeds by more than ten times the luminous mass contained within the galaxies themselves, indicating that dark matter exists between galaxies as well as inside them.
                  - paragraph [ref=f534e19]: There is another approach we can take to measuring the amount of dark matter in clusters of galaxies. As we saw, the universe is expanding, but this expansion is not perfectly uniform, thanks to local gravity. Suppose, for example, that a galaxy lies outside but relatively close to a rich cluster of galaxies. The gravitational force of the cluster will tug on that neighboring galaxy and slow down the rate at which it moves away from the cluster due to the expansion of the universe. Consider the Local Group of galaxies, lying on the outskirts of the Virgo Supercluster. The mass concentrated at the center of the Virgo Cluster exerts a gravitational force on the Local Group. As a result, the Local Group is moving away from the center of the Virgo Cluster at a velocity a few hundred kilometers per second slower than what Hubble law predicts. By measuring such deviations from a smooth expansion, astronomers can estimate the total amount of mass contained in large clusters.
                  - paragraph [ref=f534e20]: "Gravitational lensing can also be used to detect dark matter. The theory of general relativity predicts that the presence of mass bends the surrounding fabric of spacetime. Light follows those bends, so very massive objects can bend light significantly. Visible galaxies are not the only possible gravitational lenses. Dark matter can also reveal its presence by producing this effect. In Figure \\(\\PageIndex{2}\\) the galaxy cluster Abell 2218 is acting like a gravitational lens. The streaks and arcs in the picture are lensed images of more distant galaxies. Gravitational lensing is well enough understood that astronomers can use the many ovals and arcs seen in this image to calculate detailed maps of how much matter there is in the cluster and how that mass is distributed. The result from studies of many such gravitational lens clusters shows that, like individual galaxies, galaxy clusters contain more than ten times as much dark matter as luminous matter."
                  - paragraph [ref=f534e21]: "Dark matter can also be found using X-rays. When the first sensitive X-ray telescopes were launched into orbit around Earth in the 1970s and trained on massive galaxy clusters, it was quickly discovered that the clusters emit copious X-ray radiation. It turns out that just as galaxies have gas distributed between their stars, clusters of galaxies have gas distributed between their galaxies. The particles in these huge reservoirs of gas are not just sitting still. They are constantly moving around under the influence of the cluster's immense gravity. As they move and bump against each other, the gas heats up hotter and hotter until, at temperatures as high as 100 million K, it shines brightly at X-ray wavelengths. The diffuse purple haze in Figure \\(\\PageIndex{2}\\) are X-rays from the hot gas in Abell 2218. The more mass the cluster has, the faster the motions, the hotter the gas, and the brighter the X-rays. Astronomers calculate that the mass present to induce those motions must be about ten times the mass they can see in the clusters, including all the galaxies and all the gas. Once again, this is evidence that the galaxy clusters are seen to be dominated by dark matter."
                  - figure [ref=f534e22]:
                    - img "Composite Hubble and X-ray image of massive galaxy cluster Abell 2218. Details in caption." [ref=f534e23]
                    - generic [ref=f534e24]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Cluster Abell 2218. This composite Hubble and Chandra X-ray image reveals the massive galaxy cluster Abell 2218, where abundant X-ray emission, gravitationally lensed background galaxies, and galaxy velocities together indicate a total mass of about 10"
                      - superscript [ref=f534e25]: "15"
                      - text: solar masses, most of it dark matter. (
