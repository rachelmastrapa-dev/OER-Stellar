                  - heading "Mass-to-Light Ratio" [level=3] [ref=f534e30]
                  - paragraph [ref=f534e31]: "We described the use of the mass-to-light ratio to characterize the matter in galaxies or clusters of galaxies previously. For systems containing mostly old stars, the mass-to-light ratio is typically 10 to 20, where mass and light are measured in units of the Sun's mass and luminosity. A mass-to-light ratio of 100 or more is a signal that a substantial amount of dark matter is present. Table \\(\\PageIndex{1}\\) summarizes the results of measurements of mass-to-light ratios for various classes of objects. The mass to light ratios are small, for smaller objects, such as the Solar System, indicating that there are no large concentrations of dark matter on that scale. Very large mass-to-light ratios are found for all systems of galaxy size and larger, indicating that dark matter is present in all these types of objects. This is why we say that dark matter apparently makes up most of the total mass of the universe."
                  - table [ref=f534e32]:
                    - caption [ref=f534e33]: "Table \\(\\PageIndex{1}\\): Mass-To-Light Ratios"
                    - rowgroup [ref=f534e34]:
                      - row [ref=f534e35]:
                        - columnheader "Type of Object" [ref=f534e36]
                        - columnheader "Mass-to-Light Ratio" [ref=f534e37]
                    - rowgroup [ref=f534e38]:
                      - row [ref=f534e39]:
                        - cell "Sun" [ref=f534e40]
                        - cell "1" [ref=f534e41]
                      - row [ref=f534e42]:
                        - cell "Matter in vicinity of Sun" [ref=f534e43]
                        - cell "2" [ref=f534e44]
                      - row [ref=f534e45]:
                        - cell "Mass in Milky Way within 80,000 light-years of the center" [ref=f534e46]
                        - cell "10" [ref=f534e47]
                      - row [ref=f534e48]:
                        - cell "Small groups of galaxies" [ref=f534e49]
                        - cell "50–150" [ref=f534e50]
                      - row [ref=f534e51]:
                        - cell "Rich clusters of galaxies" [ref=f534e52]
                        - cell "250–300" [ref=f534e53]
                  - paragraph [ref=f534e54]: The clustering of galaxies can be used to derive the total amount of mass in a given region of space, while visible radiation is a good indicator of where the luminous mass is. Studies show that the dark matter and luminous matter are very closely associated. The dark matter halos do extend beyond the luminous boundaries of the galaxies that they surround. However, where there are large clusters of galaxies, you will also find large amounts of dark matter. Voids in the galaxy distribution do not have a lot of dark matter.
                  - heading "Properties of Dark Matter" [level=3] [ref=f534e55]
                  - paragraph [ref=f534e56]: "How do we go about figuring out what dark matter consists of? The technique we might use depends on its composition. Let's consider the possibility that some of the dark matter is made up of normal particles: protons, neutrons, and electrons. Suppose these particles were assembled into black holes, brown dwarfs, or white dwarfs. If the black holes had no accretion disks, they would be invisible to us. White and brown dwarfs do emit some radiation but have such low luminosities that they cannot be seen at distances greater than a few thousand light-years."
                  - paragraph [ref=f534e57]: Suppose the dark matter in the halo of the Milky Way were made up of black holes, brown dwarfs, and white dwarfs. These objects have been dubbed MACHOs (MAssive Compact Halo Objects). If an invisible MACHO passes directly between a distant star and Earth, it acts as a gravitational lens, focusing the light from the distant star. This causes the star to appear to brighten over a time interval of a few hours to several days before returning to its normal brightness. Since we can't predict when any given star might brighten this way, we have to monitor huge numbers of stars to catch one in the act. There are not enough astronomers to keep monitoring so many stars, but today's automated telescopes and computer systems can do it for us. Research teams making observations of millions of stars in the nearby galaxy called the Large Magellanic Cloud have reported several examples of the type of brightening expected if MACHOs are present in the halo of the Milky Way. However, there are not enough MACHOs in the halo of the Milky Way to account for the mass of the dark matter in the halo. This result, along with a variety of other experiments, leads us to conclude that the types of matter we are familiar with can make up only a tiny portion of the dark matter. Another possibility is that dark matter is composed of some new type of particle, one that researchers are now trying to detect in laboratories here on Earth.
                  - paragraph [ref=f534e58]: "The kinds of dark matter particles that astronomers and physicists have proposed generally fall into two main categories: hot and cold dark matter. The terms hot and cold refer to the average velocities of the particles, analogous to how we might think of particles of air moving in your room right now. In a cold room, the air particles move more slowly on average than in a warm room."
                  - paragraph [ref=f534e59]:
                    - text: In the early universe, if dark matter particles easily moved fast and far compared to the lumps and bumps of ordinary matter that eventually became galaxies and larger structures, we call those particles
                    - strong [ref=f534e60]:
                      - link "hot dark matter" [ref=f534e61]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#hot_dark_matter
                    - text: . In that case, smaller lumps and bumps would be smeared out by the particle motions, meaning fewer small galaxies would get made.
                  - paragraph [ref=f534e62]:
                    - text: On the other hand, if the dark matter particles moved slowly and covered only small distances compared to the sizes of the lumps in the early universe, we call that
                    - strong [ref=f534e63]:
                      - link "cold dark matter" [ref=f534e64]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#cold_dark_matter
                    - text: . Their slow speeds and energy would mean that even the smaller lumps of ordinary matter would survive to grow into small galaxies. By looking at when galaxies formed and how they evolve, we can use observations to distinguish between the two kinds of dark matter. So far, observations seem most consistent with models based on cold dark matter.
                  - paragraph [ref=f534e65]: Solving the dark matter problem is one of the biggest challenges facing astronomers. After all, we can hardly understand the evolution of galaxies and the long-term history of the universe without understanding what its most massive component is made of. For example, we need to know just what role dark matter played in starting the higher-density seeds that led to the formation of galaxies. And since many galaxies have large halos made of dark matter, how does this affect their interactions with one another and the shapes and types of galaxies that their collisions create?
                  - paragraph [ref=f534e66]: Astronomers armed with various theories are working hard to produce models of galaxy structure and evolution that take dark matter into account in just the right way. Even though we don't know what the dark matter is, we do have some clues about how it affected the formation of the very first galaxies. Careful measurements of the microwave radiation left over after the Big Bang have allowed astronomers to set very tight limits on the actual sizes of those early seeds that led to the formation of the large galaxies that we see in today's universe. Astronomers have also measured the relative numbers and distances between galaxies and clusters of different sizes in the universe today. So far, most of the evidence seems to weigh heavily in favor of cold dark matter, and most current models of galaxy and large-scale structure formation use cold dark matter as their main ingredient.
                  - paragraph [ref=f534e67]:
                    - text: The other mystery facing astronomers is the nature of
                    - strong [ref=f534e68]:
                      - link "dark energy" [ref=f534e69]:
                        - /url: /Workbench/De_Anza_-_ASTR10/17:_Evolution_of_Galaxies/17.07:_Key_Terms#dark_energy
                    - text: ", the energy that pushes spacetime apart, taking galaxies and the larger structures made of galaxies along with it. Observations show that dark energy becomes more and more important relative to gravity as the universe ages. As a result, the expansion of the universe is accelerating, and this acceleration seems to be happening mostly since the universe was about half its current age. Astronomers find that for every gram of luminous normal matter, such as protons, neutrons, electrons, and atoms in the universe, there are about 4 grams of nonluminous normal matter, mainly intergalactic hydrogen and helium. For that same gram of luminous matter, there are about 27 grams of dark matter, and the energy equivalent of about 68 grams of dark energy. We understand about 5% of the universe."
