                  - heading "Dark Matter and the Universe" [level=2] [ref=f534e2]
                  - paragraph [ref=f534e3]: Galaxies contain large amounts of dark matter, more than matter we can observer. Just as the location of the planet Neptune was predicted by its gravitational effect on the Solar System, astronomers can determine the location and amount of dark matter in galaxies by measuring its gravitational effects on objects we can see. By measuring the way that galaxies move in clusters, scientists have discovered that dark matter is also distributed among the galaxies in the clusters. Since the environment surrounding a galaxy is important in its development, dark matter must play a central role in galaxy evolution as well. But what is dark matter? What is it made of? We'll look next at the search for dark matter and the quest to determine its nature.
                  - heading "Local Dark Matter" [level=3] [ref=f534e4]
                  - paragraph [ref=f534e5]: Is there dark matter in the Solar System? Astronomers have examined the orbits of the known planets and of spacecraft as they journey to the outer planets and beyond. No deviations have been found from the orbits predicted on the basis of the masses of objects already discovered in the Solar System and the theory of gravity. We therefore conclude that there is no evidence that there are large amounts of dark matter nearby. Since dark matter is part of our galaxy, there probably is some amount here, but it is not enough to create a measurable difference.
                  - paragraph [ref=f534e6]: Astronomers have also looked for evidence of dark matter in the region of the Milky Way Galaxy that lies within a few hundred light-years of the Sun. In this vicinity, most of the stars are restricted to a thin disk. It is possible to calculate how much mass the disk must contain in order to keep the stars from wandering far above or below it. The total matter that must be in the disk is less than twice the amount of luminous matter. This means that no more than half of the mass in the region near the Sun can be dark matter.
                  - heading "Dark Matter and Galaxies" [level=3] [ref=f534e7]
                  - paragraph [ref=f534e8]: In contrast to our local neighborhood near the Solar System, there is ample evidence strongly suggesting that about 90% of the mass in the entire galaxy is in the form of a halo of dark matter. There is about nine times more dark matter than visible matter. Astronomers have found some stars in the outer regions of the Milky Way beyond its bright disk, and these stars are revolving very rapidly around its center. The mass contained in all the stars and all the interstellar matter we can detect in the galaxy does not exert enough gravitational force to explain how those fast-moving stars remain in their orbits and do not fly away. Only by having large amounts of unseen matter could the galaxy be holding on to those fast-moving outer stars. The same result is found for other spiral galaxies as well.
                  - paragraph [ref=f534e9]: "Figure \\(\\PageIndex{1}\\) is an example of the kinds of observations astronomers are making, for the Triangulum galaxy, a member of our Local Group. The observed rotation of spiral galaxies like Andromeda is usually seen in charts, known as rotation curves, that show velocity versus distance from the galaxy center. In the rotation curve for the Traiangulum galaxy, the velocity at which stars and clouds of gas orbit the galaxy at different distances from the center are the red line. As is true of the Milky Way, the rotational velocity, or orbital speed, does not decrease with distance from the center, which is what you would expect if an assembly of objects rotates around a common center. A calculation, the blue line, based on the total mass visible as stars, gas, and dust predicts that the velocity should be much lower at larger distances from the center. The discrepancy between the two curves implies the presence of a halo of massive dark matter extending outside the boundary of the luminous matter. The radius of the halos around the Milky Way and Andromeda may be as large as 300,000 light-years, much larger than the visible size of these galaxies."
                  - figure [ref=f534e10]:
                    - img "Rotation curve of the Triangulum galaxy showing evidence for dark matter. Details in caption." [ref=f534e11]
                    - generic [ref=f534e12]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Rotation Indicates Dark Matter. This chart compares the observed rotational velocity of the Triangulum galaxy with the velocity predicted from its visible mass alone, showing that stars and gas far from the center orbit much faster than expected, evidence for a surrounding halo of dark matter. ("
