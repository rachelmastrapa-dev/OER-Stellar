            - application "Rich Text Editor, editarea" [ref=f457e321]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f457e335]: "<h2>Mapping the Milky Way</h2> <p class=\"lt-phys-64247\">The Milky Way Galaxy is a Spiral Galaxy and most likely a barred spiral. This characteristic is difficult to confirm due to our location within the Milky Way and all of the gas and dust we have to look through. Astronomers were able to make tremendous progress in mapping the spiral structure of the Milky Way after the discovery of the 21-cm line that comes from cool hydrogen. The obscuring effect of interstellar dust prevents us from seeing stars at large distances in the disk at visible wavelengths. However, radio waves of 21-cm wavelength pass right through the dust, enabling astronomers to detect hydrogen atoms throughout the Galaxy. More recent surveys of the infrared emission from stars in the disk have provided a similar dust-free perspective of our Galaxy's stellar distribution. Despite all this progress over the past fifty years, we are still just beginning to pin down the precise structure of our Galaxy.</p> <h3>The Arms of the Milky Way</h3> <p class=\"lt-phys-64248\">Figure \\(\\PageIndex{1}\\) is a map of our Galaxy's arm structure derived from Spitzer Space Telescope observations in the infrared. The map has a polar coordinate system that is centered on the Sun, so the positions of all objects are measured by their distance and direction from the Sun. Radio observations of the disk's gaseous component indicate that the Galaxy has two major spiral arms, Perseus and Scutum-Centaurus, that emerge from the bar and several fainter arms and shorter spurs.</p> <figure><img alt=\"Milky Way map with bar, spiral arms, and Sun's location. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46200/1ea0d93909095f73cb9c3d8c2c8011df0c96daf8\" /> <figcaption>Figure \\(\\PageIndex{1}\\): This face-on map, assembled from Spitzer Space Telescope infrared data, shows the Milky Way's central bar with the Scutum-Centaurus and Perseus arms winding out from its ends, while the fainter Sagittarius and Outer arms contain comparatively fewer stars. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.2.1_Milky_Way_Bar_and_Arms\" target=\"_blank\" title=\"15.9: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{1}\\)</a>.</figcaption> </figure> <p class=\"lt-phys-64244\">The Sun is in the Orion Spur, between the Perseus and Sagittarius arms, 26,000 light years from the galactic center. Our Sun and Solar System orbit&nbsp;around the Milky Way Galaxy once every 225 million Earth years. We are also not too close to the Galaxy's center. Some postulate it would always be daytime if we were near the Milky Way Galaxy's center because there are so many stars.</p> <p class=\"lt-phys-64243\">The Orion Spur is a stream of stars and gas about 10,000 light-years long that runs from the Cygnus arm diagonally downward to the right through the Perseus arm and on to the Sagittarius arm. It contains features like the Cygnus Rift, the great dark nebula in the summer Milky Way, and the bright Orion Nebula. Figure \\(\\PageIndex{2}\\) includes a few other objects that share this small section of the Galaxy with us. The farther away we try to look from our own arm, the more the dust in the Galaxy builds up and makes it hard to observe with visible light.</p> <figure><img alt=\"Sun's location in the Orion Spur among Milky Way's spiral arms. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46201/ad10445b1b5388ef1aa77ec1fb6a24603628045d\" /> <figcaption>Figure \\(\\PageIndex{2}\\): The Sun lies within the Orion Spur, a minor spiral arm located between the Perseus and Sagittarius arms, alongside several other notable star-forming regions and objects. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>).&nbsp;<a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.2.2_Orion_Spur\" target=\"_blank\" title=\"15.9: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{2}\\)</a>.</figcaption> </figure> <h3 class=\"lt-phys-64817\">Differential Galactic Rotation</h3> <p class=\"lt-phys-64817\">At the Sun's distance from its center, the Galaxy does not rotate like a solid plate. Instead, the way individual objects orbit around the center of the Galaxy is more like the Solar System. Stars, as well as the clouds of gas and dust, obey Kepler's third law. Objects farther from the center take longer to complete an orbit around the Galaxy than do those closer to the center. In other words, stars and interstellar matter in larger orbits in the Galaxy trail behind those in smaller ones. This effect is called <strong><a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.08:_Key_Terms#differential galactic rotation\" target=\"_blank\" title=\"differential galactic rotation\">differential galactic rotation</a></strong>.</p> <p class=\"lt-phys-64817\">Differential rotation would appear to explain why so much of the material in the disk of the Milky Way is concentrated into the spiral arms. No matter what the original distribution of the material might be, the differential rotation of the Galaxy can stretch it out into spiral features. Figure \\(\\PageIndex{3}\\) is a diagram of the development of spiral arms from two irregular clouds of interstellar matter. The clouds start as two separate objects on either side of the galactic center. Over time, as the portions of the clouds closest to the galactic center move faster, those farther out trail behind, stretching the material into a spiral shape.</p> <figure><img alt=\"Four-panel model of spiral arm formation by differential rotation. Details in caption.\" class=\"internal default\" src=\"/@api/deki/files/46198/e9644aae83af08357813ae49e1fdad966238e567\" /> <figcaption>Figure \\(\\PageIndex{3}\\): Because regions farther from the galactic center take longer to complete an orbit than regions closer in, differential rotation can stretch irregular clouds of gas into spiral arms. Since real spiral arms persist over time rather than winding up completely, other processes must help maintain them. (<a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" title=\"CC BY 4.0\">CC BY 4.0</a>; <a href=\"https://openstax.org/books/astronomy-2e/pages/preface\" target=\"_blank\" title=\"Fraknoi, et al.\">Fraknoi, et al.</a> via <a href=\"https://openstax.org/details/books/astronomy\" target=\"_blank\" title=\"Openstax Astronomy 2nd ed.\">Openstax Astronomy 2nd ed.</a>). <a href=\"/Workbench/De_Anza_-_ASTR10/15:_Milky_Way_Galaxy/15.09:_Accessible_Descriptions#Figure_15.2.3_Differential_Galactic_Rotation\" target=\"_blank\" title=\"15.9: Accessible Descriptions\">Accessible description of Figure \\(\\PageIndex{3}\\)</a>.</figcaption> </figure> <h3>Evolution of Spiral Arms</h3> <p class=\"lt-phys-64817\">This model of spiral arms formation presents astronomers with a problem. Over the roughly 13-billion-year history of the Galaxy, differential rotation would have wound the Galaxy's arms tighter and tighter until the spiral structure disappeared. Did the Milky Way actually have spiral arms when it formed 13 billion years ago? And do spiral arms, once formed, last for that long a time?</p> <p class=\"lt-phys-64817\">With the advent of the Hubble Space Telescope, it has become possible to observe the structure of very distant galaxies and to see what they were like shortly after they began to form more than 13 billion years ago. What the observations show is that galaxies in their infancy had bright, clumpy star-forming regions, but no regular spiral structure.</p> <p class=\"lt-phys-64817\">Over the next few billion years, the galaxies that were to become spirals lost their massive clumps and developed a central bulge. The turbulence in these galaxies decreased and rotation began to dominate the motions of the stars and gas. Smaller star-forming clumps began to form simple spiral arms. Bright, well-defined spiral arms began to appear only when the galaxies were about 3.6 billion years old. Initially, there were two well-defined arms. Multi-armed structures in galaxies like we see in the Milky Way appeared only when the universe was about 8 billion years old.</p> <p class=\"lt-phys-64817\">Scientists have used supercomputer calculations to model the formation and evolution of the arms. These calculations follow the motions of up to 100 million star particles to see whether gravitational forces can cause them to form spiral structure. What these calculations show is that giant molecular clouds have enough gravitational influence over their surroundings to initiate the formation of structures that look like spiral arms. These arms then become self-perpetuating and can survive for at least several billion years. The arms may change their brightness over time as star formation comes and goes, but they are not temporary features. The concentration of matter in the arms exerts sufficient gravitational force to keep the arms together over long periods of time.</p>"
