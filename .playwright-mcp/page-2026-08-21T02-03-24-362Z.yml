            - application "Rich Text Editor, editarea" [ref=f214e343]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f214e357]: "<h2>Science and Society - The Story of the Solar Neutrino Problem</h2> <h3>Introduction to Astrobites</h3> <p>This Science and Society is a showcase example&nbsp;from the Astrobites website, which contains articles written by undergraduate and graduate students of all different backgrounds.&nbsp;Students read over a published scientific article about Astronomy or Physics, then write a student-friendly version of it. We (the authors of this textbook) have only made minor adjustment to follow copyright agreements.&nbsp;After reading this student-written article, we hope you take some time to also review the original scientific article about neutrinos included at the end of this page.</p> <h3>The Mysterious Neutrino</h3> <p>Here are some facts about our Sun: it rises in the east and sets in the west. It is powered by nuclear fusion taking place in its molten hot core. Radiation is emitted from the Sun’s surface out into interstellar space. It takes light eight minutes to get from the Sun to Earth. The Earth’s magnetic field protects it from most of these rays, but some end up reaching the ground. Solar radiation is what makes life on Earth possible, and therefore one of the most important physical phenomena of our existence. However, it wasn’t until the past 100 years that humans finally began to understand the nature of these life-giving beams. We didn’t know that the Sun was made up of mostly hydrogen until 1929. In 1942, the first solar radio-wave emissions were detected. The ultraviolet portion of the Sun’s electromagnetic spectrum remained a mystery until 1946. Even though the Sun has been a part of every single human being’s daily life since we began walking the Earth, we are only just starting to truly understand it.</p> <p>One of the most fascinating mysteries of the Sun involved the creation, emission, and detection of solar neutrinos. Neutrinos are neutral subatomic particles that are incredibly tiny and abundant in the universe. They are created every time atomic nuclei fuse together or break apart. It is incredibly difficult to detect neutrinos because they almost never interact with matter. In fact, for every 100 billion neutrinos that reach Earth, only one will end up interacting with anything. Additionally, the only way to detect a neutrino is to measure its interaction with another particle. Scientists have been able to detect three different types of neutrinos based on what particle they interact with: electron neutrinos, muon neutrinos, and tau neutrinos. In the Sun’s furnace, only electron neutrinos are created due to the nuclear reactions taking place there.</p> <p>In 1964, Dr. Raymond David Jr. and Dr. John Bahcall conducted an experiment to figure out whether nuclear fusion was the source of sunlight. During their experiment, they created a computer model that approximated the relative number of neutrinos passing through a unit area per unit time, or flux, of neutrinos the Sun produces at different energies. When they compared their model to observational data, though, only a third of the predicted flux was measured. This discrepancy was coined “the solar neutrino problem” and ended up puzzling scientists for nearly forty years. Where were the other neutrinos? Was there something wrong with our detectors, or was it our models? The answer happened to be both.</p> <p>At the end of the 20th century, a massive group of scientists, led by Dr. Arthur B. McDonald from Queen’s University, came together to solve the solar neutrino problem. They were using the Sudbury Neutrino Observatory (SNO) located in Ontario, Canada to detect solar neutrinos emitted from the decay of boron-8, an isotope of boron. When the neutrinos interact with the heavy water molecules, they release Cherenkov radiation. This type of radiation is emitted when particles move faster than light in a specific medium. In the SNO, light is slowed down by the water’s refractive index, but charged particles are not. The detected Cherenkov radiation can then be used to make assumptions about its source—in this case, the neutrinos.</p> <figure><img alt=\"SNODetector.png\" class=\"internal default\" src=\"/@api/deki/files/68049/SNODetector.png\" /> <figcaption>Figure \\(\\PageIndex{1}\\):&nbsp; <span class=\"mw-mmv-title\" original-title=\"\">Photograph of the SNO+ Detector, taken when the water within the Acrylic Vessel was being replaced with liquid scintillator</span>. (<a href=\"https://creativecommons.org/licenses/by/4.0/deed.en\" title=\"https://creativecommons.org/licenses/by/4.0/deed.en\">CC-BY 4.0</a>;&nbsp;<a href=\"https://commons.wikimedia.org/wiki/File:SNO%2B_Detector,_Partially_Filled_with_Scintillator_and_Water.webp\" title=\"https://commons.wikimedia.org/wiki/File:SNO%2B_Detector,_Partially_Filled_with_Scintillator_and_Water.webp\">The SNO Collaboration</a>&nbsp;via <a href=\"https://commons.wikimedia.org/wiki/Main_Page\" title=\"https://commons.wikimedia.org/wiki/Main_Page\">Wikimedia Commons</a>).</figcaption> </figure> <p>The SNO is built 6,800 feet underground to protect it from cosmic rays and uses 1,000 tons of heavy water contained by an acrylic vessel twelve meters in diameter. It has an array of 9,600 photomultiplier tubes mounted on a support structure around the vessel to detect Cherenkov radiation.</p> <p>The SNO is unique when compared to other neutrino observatories because it can detect neutrinos through three different reactions, meaning that it can detect all three neutrino types. The charged-current (CC) reaction is only sensitive to electron neutrinos, the neutral-current (NC) reaction is sensitive to all neutrino types, and the elastic-scattering (ES) reaction is also sensitive to all three types, but less sensitive to muon and tau neutrinos than electron neutrinos. Earlier observatories were only calibrated to detect electron neutrinos, so they couldn’t make any observations about the other two types. I don’t know what lead the physicists on the SNO project to consider the other two reactions. Was it instinct, intuition, incidental? Was it fate?</p> <h3>Neutrino Flavors</h3> <p>Between November 2, 1999 and May 28, 2001, data was recorded at the Sudbury Neutrino Observatory. They used the timing and hit patterns of the Cherenkov radiation to reconstruct the neutrino paths and the most probable kinetic energy of the particles. From these observations, they could determine the flux for each neutrino type. When all three fluxes were added together, they found that the total flux matched the predicted value found by David Jr. and Bahcall. This was a surprising result considering that only electron neutrinos are produced in the Sun. Could the neutrinos be changing types as they travel through space? As unlikely as it sounds, the answer is yes. At some point during the eight minutes the Sun’s light spends traveling to Earth, most of the electron neutrinos become muon and tau neutrinos. This phenomenon is called neutrino oscillations or neutrino flavor transformations, which describes how low energy solar neutrinos can switch types as they travel. The number of changes the neutrino can make and the frequency of the changes depends on its energy.</p> <figure><img alt=\"A table showing how elementary particles are organized\" class=\"internal default\" src=\"/@api/deki/files/68050/Standard_Model_of_Elementary_Particles.jpg\" /> <figcaption>Figure \\(\\PageIndex{2}\\):&nbsp;The Standard Model of Particle Physics, with neutrino flavors shown along the bottom row. (Public Domain; <a href=\"https://commons.wikimedia.org/wiki/User:Cush\" title=\"https://commons.wikimedia.org/wiki/User:Cush\">Cush</a>&nbsp;via <a href=\"https://commons.wikimedia.org/wiki/Main_Page\" target=\"_blank\" title=\"https://commons.wikimedia.org/wiki/Main_Page\">Wikimedia Commons</a>).</figcaption> </figure> <p>The discovery of neutrino flavor transformation not only solved the solar neutrino problem, it also exposed an incompleteness of the Standard Model of physics, shown above. Before this paper, neutrinos were thought to have no mass at all; however, if neutrinos had no mass, they wouldn’t be able to oscillate. The fact that neutrinos have mass changes the way scientists treat them in calculations and alters our view of the quantum world. The physicists involved in the SNO project might have been looking for the smallest particles known to mankind, but their discoveries had large impacts that are still felt today. As a result, Dr. McDonald won the Nobel Prize in Physics in 2015 for his contribution to the discovery of neutrino oscillations, along with Dr. Takaaki Kajita who showed that some muon neutrinos disappeared as they traveled from their origin to the detector.</p> <p>The solar neutrino problem might have been untangled, but there are still many mysteries about the Sun that physicists are trying to solve. Why is the solar atmosphere so much hotter than the surface? How can we predict coronal mass ejections? How does solar wind effect the shape and orbit of comets? As an astronomer, I know how easy it is to desire to look beyond our solar system towards distant stars and galaxies, but we cannot forget about the well of information right in front of us. We learned more about the nature of neutrinos from studying the Sun, so maybe the secret to finding a “Theory of Everything” is hidden somewhere beneath its flares. Every day, the Sun rises in the east and sets in the west, waving for our attention—inviting us to unlock its secrets.</p> <p>&nbsp;</p> <h3>Attributions&nbsp;</h3> <p><a href=\"https://astrobites.org/2024/07/15/eight-minutes-the-discovery-of-neutrino-oscillations/\" rel=\"freelink\" title=\"https://astrobites.org/2024/07/15/eight-minutes-the-discovery-of-neutrino-oscillations/\">https://astrobites.org/2024/07/15/ei...-oscillations/</a>&nbsp;</p> <h3>References</h3> <p><a href=\"https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.89.011301\" rel=\"freelink\" title=\"https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.89.011301\">https://journals.aps.org/prl/abstrac...Lett.89.011301</a>&nbsp;</p> <h3>For Further Exploration</h3> <p>The Sudbury Neutrino Observatory:&nbsp;<a href=\"https://sno.phy.queensu.ca/\" rel=\"freelink\" title=\"https://sno.phy.queensu.ca/\">https://sno.phy.queensu.ca/</a>&nbsp;</p> <p>2015 Nobel Prize on Neutrino Oscillations:&nbsp;<a href=\"https://www.nobelprize.org/uploads/2017/09/advanced-physicsprize2015.pdf\" rel=\"freelink\" title=\"https://www.nobelprize.org/uploads/2017/09/advanced-physicsprize2015.pdf\">https://www.nobelprize.org/uploads/2...sprize2015.pdf</a>&nbsp;</p> <p>Fermilab Neutrino Video:&nbsp;<a href=\"https://youtu.be/1FSOYNlMMRQ\" rel=\"freelink\" title=\"https://youtu.be/1FSOYNlMMRQ\">https://youtu.be/1FSOYNlMMRQ</a>&nbsp;</p> <p>&nbsp;</p>"
