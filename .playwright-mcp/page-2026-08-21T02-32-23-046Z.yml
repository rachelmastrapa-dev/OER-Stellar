                    - list [ref=f391e7]:
                      - listitem [ref=f391e8]: Distinguish the mass range of stars that will become white dwarfs
                      - listitem [ref=f391e9]: Describe the interior of a massive star before a supernova
                      - listitem [ref=f391e10]: Describe the observed features of SN 1987A both before and after the supernova
                      - listitem [ref=f391e11]: Explain the research method that led to the discovery of neutron stars
                      - listitem [ref=f391e12]: Describe the features of a neutron star that allow it to be detected as a pulsar
                      - listitem [ref=f391e13]: List the observational evidence that links pulsars and neutron stars to supernovae
                      - listitem [ref=f391e14]: Describe the kind of binary star system that leads to a nova event
                      - listitem [ref=f391e15]: Describe the type of binary star system that leads to a type Ia supernovae event
                      - listitem [ref=f391e16]: Indicate how type Ia supernovae differ from type II supernovae
