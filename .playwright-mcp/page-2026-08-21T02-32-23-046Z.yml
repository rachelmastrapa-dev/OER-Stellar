                  - heading "Introduction" [level=2] [ref=f391e2]
                  - paragraph [ref=f391e3]: In this chapter we will discuss the end-states of stars. Just as the length of a stars life is dependent on the stars initial mass, what are star looks like at the end of its life also depends on mass. Almost all stars end in a bang, but the size of the explosion also depends on its initial mass, but also whether it has on or more companion stars.
                  - generic [ref=f391e4]:
