                    - text: ": When a massive star exploded in the Large Magellanic Cloud, a satellite galaxy to the Milky Way, it left behind an expanding shell of debris called SNR 0519-69.0. Here, multimillion degree gas is seen in X-rays from Chandra in blue. The outer edge of the explosion in red and stars in the field of view are in visible light from Hubble. ("
