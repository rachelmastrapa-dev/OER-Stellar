                - generic [active] [ref=f438e1]:
                  - heading "Science and Society - How We \"See\" Black Holes" [level=2] [ref=f438e2]
                  - paragraph [ref=f438e3]: "While this Science and Society may be a little more science-heavy than others, it's an interesting story to consider how we humans have dreamt, pondered, and searched for black holes throughout history. Today, it may seem like a common practice to produce an image of a black hole, especially after the first widely published image of a black hole in 2017. Figure \\(\\PageIndex{1}\\) is the first ever image of a black hole, which was produced by the Event Horizon Telescope (EHT) using radio wavelengths. This first image was multiple centuries in the making, and was no easy feat in itself."
                  - figure [ref=f438e4]:
                    - img "M87 black hole in radio to gamma rays, using multiple observatories. Details in caption." [ref=f438e5]
                    - generic [ref=f438e6]:
                      - text: "Figure \\(\\PageIndex{1}\\) : Black Hole M87. This composite of images from nineteen telescopes and observatories shows the black hole at the center of the M87 galaxy and its jet across the entire electromagnetic spectrum, from radio to gamma-ray wavelengths. The images reveal how much more information is available at very long and short wavelengths compared to the limited data in visible light. ("
                      - link "CC BY 4.0" [ref=f438e7]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "The EHT Multi-wavelength Science Working Group; the EHT Collaboration; ALMA (ESO/NAOJ/NRAO); the EVN; the EAVN Collaboration; VLBA (NRAO); the GMVA; the Hubble Space Telescope; the Neil Gehrels Swift Observatory; the Chandra X-ray Observatory; the Nuclear Spectroscopic Telescope Array; the Fermi-LAT Collaboration; the H.E.S.S collaboration; the MAGIC collaboration; the VERITAS collaboration; NASA and ESA. Composition by J. C. Algaba" [ref=f438e8]:
                        - /url: https://eventhorizontelescope.org/
                      - text: via
                      - link "Wikimedia Commons" [ref=f438e9]:
                        - /url: https://commons.wikimedia.org/wiki/File:Telescopes_Unite_in_Unprecedented_Observations_of_Famous_Black_Hole_M87.jpg
                      - text: ).
                      - 'link "Accessible description of Figure \\(\\PageIndex{1}\\)" [ref=f438e10]':
                        - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.4.1_Black_Hole_M87
                      - text: .
                  - paragraph [ref=f438e11]: In addition to the EHT image of the M87 black hole, the figure also contains several other views of the M87 in each portion of the electromagnetic spectrum. We encourage you to pay special attention to the visible wavelengths and what types of images we have obtained in this range. They are basically nothing but wispy cloud-like features. This lack of visibility in optical wavelengths takes us to our first stop on the interesting journey of how humans have moved from theory to observable reality of black holes.
                  - heading "Theorizing the Invisible" [level=3] [ref=f438e12]
                  - paragraph [ref=f438e13]:
                    - text: The cosmically mysterious and elusive black hole emits little to no radiation itself (see Hawking Radiation in
                    - link "Further Exploration" [ref=f438e14]:
                      - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.04:_How_We_See_Black_Holes#Further_Exploration:_Black_Holes
                    - text: for more details), and thus can only be measured by it effects on matter and energy that surrounds it. For example, you read in
                    - link "How to Find a Black Hole" [ref=f438e15]:
                      - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.02:_Evidence_for_Black_Holes#How_to_Find_a_Black_Hole
                    - text: that the hot material near the event horizon releases X-rays.
                  - paragraph [ref=f438e16]: However, we humans have only been able to view the cosmos in wavelengths outside of the visible for about 100 years. Prior to 1900, how did scientists know that something so dark and elusive should be out there in the cosmos?
                  - paragraph [ref=f438e17]: Two of the first theorists to attempt such an explanation were Reverend John Michell from Britain and Pierre-Simon Laplace from France. In the late 1700s, the hot research topic was the observation of multi-star systems, and how they orbit one another. In 1784, Michell wrote a paper containing the description of a black hole developed out of his theory about the distance to and relative sizes of double stars. It is worth pointing out that on page 50 Michell also describes the perturbations of stars by “… bodies of a somewhat smaller size, which are not naturally luminous …”. Just twelve years later Laplace, followed up Michell’s work by independently proposing the existence of ‘black holes’ and three years on he provided the mathematical proof of these objects. In short, both theorists described the concept of gravitational forces being so strong in some binary systems, that one object would literally pull light into it. They were describing black holes without even knowing exactly what they were!
                  - heading "Hubble's Proof of Black Holes" [level=3] [ref=f438e18]
                  - paragraph [ref=f438e19]: The Hubble Space Telescope (HST) is considered one of the first telescopes to prove the existence of black holes through a variety of methods.
                  - paragraph [ref=f438e20]: Unlike previous telescopes, Hubble has the ability to resolve individual stars in tightly-packed groups of stars called globular clusters. By tracking stars' speedy orbits around the center of globular clusters, HST was able to find many black hole candidates by inferring their existence at the center of each.
                  - paragraph [ref=f438e21]: "In some lucky cases, Hubble also observed the lensing effect of black holes as stars or other objects pass behind them. Figure \\(\\PageIndex{2}\\) demonstrates how if a black hole passes perfectly between Earth and a background star, we will observe a momentary brightening effect of the background star. Hubble pioneered this observation of gravitational lensing, which is now a regular practice for observation with more modern telescopes."
                  - paragraph [ref=f438e22]: "Finally, Hubble takes images primarily in the visible portion of the electromagnetic spectrum. In Figure \\(\\PageIndex{1}\\), HST also imaged M87 as it sends out massive jets of charged particles that get accelerated to near light-speed and shot out into deep space."
                  - figure [ref=f438e23]:
                    - img "Diagram of gravitational microlensing by a black hole. Details in caption." [ref=f438e24]
                    - generic [ref=f438e25]:
                      - text: "Figure \\(\\PageIndex{2}\\): Gravitational Microlensing. As a black hole passes in front of a background star, its gravity bends and focuses the star's light, temporarily brightening and distorting the star's image as seen from Earth. ("
                      - link "CC BY 4.0" [ref=f438e26]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "NASA/ESA" [ref=f438e27]:
                        - /url: http://www.nasa.gov/
                      - text: via
                      - link "ESAHubble" [ref=f438e28]:
                        - /url: https://esahubble.org/images/opo0003e/
                      - text: )
                      - 'link "Accessible description of Figure \\(\\PageIndex{2}\\)" [ref=f438e29]':
                        - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes/14.06:_Accessible_Descriptions#Figure_14.4.2_Gravitational_Microlensing
                      - text: .
                  - heading "Caught on Camera" [level=3] [ref=f438e30]
                  - paragraph [ref=f438e31]: Up until the mid 2010s, telescopes such as HST, Chandra Space Telescope, and Swift Observatory all had indirectly observed black holes and ultimately proved their existence. Then in 2017, the EHT blew everyone out of the water by producing a real, direct image of a black hole. Okay, it's still somewhat of an indirect image, but it's closer than anything we've ever seen before!
                  - paragraph [ref=f438e32]:
                    - text: The EHT is actually a collaboration of several radio telescopes located all over the Earth, all working together to produce a single image. As you learned in section on
                    - link "Radio Telescopes" [ref=f438e33]:
                      - /url: /Workbench/De_Anza_-_ASTR10/05:_Astronomical_Instruments/5.04:_Radio_Telescopes
                    - text: ", radio signals can be compiled together using a process called interferometry. Through this technique, the EHT can peer through essentially all gas and dust that's blocking our view of a black hole in other wavelengths. To be clear, this seemingly blurry image is not what we'd actually see with our eyes, if we were to look at a black hole. Instead, we are looking at a visual interpretation of radio waves that are orbiting the black hole very, very quickly. The radio waves also experience a lensing effect, so that the top portion is actually showing the light that is circling around the back side of the black hole."
                  - paragraph [ref=f438e34]: Earlier in this chapter you learned what the event horizon is. This is the black center we see that's surrounded by the radio waves. However, remember that the actual black hole is a singularity, so that we are really just seeing the edge of the event horizon.
                  - generic [ref=f438e35]:
                    - 'heading "Further Exploration: Black Holes" [level=5] [ref=f438e36]'
                    - list [ref=f438e38]:
                      - listitem [ref=f438e39]:
                        - text: Hawking proposed that black holes are not completely black but can slowly lose energy through a process known as
                        - emphasis [ref=f438e40]: Hawking radiation
                        - text: . This resource explains the quantum physics behind this phenomenon and its implications for the long-term evolution of black holes. Visit the
                        - link "Wikipedia page on Hawking radiation" [ref=f438e41]:
                          - /url: https://en.wikipedia.org/wiki/Hawking_radiation
                        - text: .
                      - listitem [ref=f438e42]:
                        - text: In 2019, the Event Horizon Telescope collaboration released the first image of a black hole. In this TED Talk, computer scientist Katie Bouman discusses the challenges of combining data from telescopes around the world and the computational methods that helped make the image possible. Watch the
                        - link "TED Talk by Katie Bouman" [ref=f438e43]:
                          - /url: https://www.ted.com/talks/katie_bouman_how_to_take_a_picture_of_a_black_hole
                        - text: .
