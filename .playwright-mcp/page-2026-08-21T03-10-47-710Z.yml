            - application "Rich Text Editor, editarea" [ref=f600e314]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f600e348]: "<p>Percival <span class=\"no-emphasis\" data-type=\"term\" group-by=\"L\">Lowell</span> was born into the well-to-do Massachusetts family about whom John Bossidy made the famous toast:</p> <blockquote> <p>And this is good old Boston,<br /> The home of the bean and the cod,<br /> Where the Lowells talk to the Cabots<br /> And the Cabots talk only to God.</p> </blockquote> <p>Percival’s brother Lawrence became president of Harvard University, and his sister, Amy, became a distinguished poet. Percival was already interested in astronomy as a boy: he made observations of Mars at age 13. His undergraduate thesis at Harvard dealt with the origin of the solar system, but he did not pursue this interest immediately. Instead, he entered the family business and traveled extensively in Asia. In 1892, however, he decided to dedicate himself to carrying on Schiaparelli’s work and solving the mysteries of the martian canals.</p> <p>In 1894, with the help of astronomers at Harvard but using his own funds, Lowell built an observatory on a high plateau in Flagstaff, Arizona, where he hoped the seeing would be clear enough to show him Mars in unprecedented detail. He and his assistants quickly accumulated a tremendous number of drawings and maps, purporting to show a vast network of martian canals (see Figure 10.4). He elaborated his ideas about the inhabitants of the red planet in several books, including <em data-effect=\"italics\">Mars</em> (1895) and <em data-effect=\"italics\">Mars and Its Canals</em> (1906), and in hundreds of articles and speeches.</p> <p>As Lowell put it,</p> <blockquote> <p>A mind of no mean order would seem to have presided over the system we see—a mind certainly of considerably more comprehensiveness than that which presides over the various departments of our own public works. Party politics, at all events, have had no part in them; for the system is planet-wide. . . . Certainly what we see hints at the existence of beings who are in advance of, not behind us, in the journey of life.</p> </blockquote> <p>Lowell’s views captured the public imagination and inspired many novels and stories, the most famous of which was H. G. Wells’ <em data-effect=\"italics\">War of the Worlds</em> (1897). In this famous “invasion” novel, the thirsty inhabitants of a dying planet Mars (based entirely on Lowell’s ideas) come to conquer Earth with advanced technology.</p> <p>Although the Lowell Observatory first became famous for its work on the martian canals, both Lowell and the observatory eventually turned to other projects as well. He became interested in the search for a ninth (and then undiscovered) planet in the solar system. In 1930, Pluto was found at the Lowell Observatory, and it is not a coincidence that the name selected for the new planet starts with Lowell’s initials. It was also at the Lowell Observatory that the first measurements were made of the great speed at which galaxies are moving away from us, observations that would ultimately lead to our modern view of an expanding universe.</p> <p>Lowell (Figure 10.5) continued to live at his observatory, marrying at age 53 and publishing extensively. He relished the debate his claims about Mars caused far more than the astronomers on the other side, who often complained that Lowell’s work was making planetary astronomy a less respectable field. At the same time, the public fascination with the planets fueled by Lowell’s work (and its interpreters) may, several generations later, have helped fan support for the space program and the many missions whose results grace the pages of our text.</p> <figure><span data-alt=\"This is a photograph of Percival Lowell seated at the eyepiece of the 24-inch refractor near Flagstaff, Arizona.\" data-type=\"media\"><img alt=\"This is a photograph of Percival Lowell seated at the eyepiece of the 24-inch refractor near Flagstaff, Arizona.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45914/e3dd625397b4b9e52b9b411bd75e1f420ebe384b\" /> </span> <figcaption>Figure 10.5 : Percival Lowell (1855–1916). This 1914 photograph shows Percival <span class=\"no-emphasis\" data-type=\"term\" group-by=\"L\">Lowell</span> observing Venus with his 24-inch telescope at Flagstaff, Arizona.</figcaption> </figure> <h2>Attributions</h2> <p><a class=\"link-https\" href=\"/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/10:_Earthlike_Planets_-_Venus_and_Mars/10.02:_The_Nearest_Planets_-_An_Overview\" rel=\"freelink\" title=\"https://phys.libretexts.org/Bookshelves/Astronomy__Cosmology/Astronomy_2e_(OpenStax)/10%3A_Earthlike_Planets_-_Venus_and_Mars/10.02%3A_The_Nearest_Planets_-_An_Overview\">https://phys.libretexts.org/Bookshel..._-_An_Overview</a>&nbsp;</p>"
