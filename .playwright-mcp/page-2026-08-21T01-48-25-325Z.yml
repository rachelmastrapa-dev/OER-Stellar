            - application "Rich Text Editor, editarea" [ref=f122e331]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f122e345]: "<h2>What is Sonification?</h2> <p>Throughout this chapter we've focused on the visible aspects&nbsp;of spectra and their appearance using our eyes. Another important and rapidly emerging branch of astronomical research is through the use of sound, or Sonification. We can think of this research as \"hearing\" data collected from space.&nbsp;</p> <p>Before getting into the details, it's helpful to see/hear&nbsp;a few examples of Sonification. NASA has created a full repository of Sonifications, using data from James Webb and Hubble Space Telescopes, as well as Spitzer and Chandra X-ray observatories on a number of astronomical objects. You can view NASA's main <a href=\"https://science.nasa.gov/mission/hubble/multimedia/sonifications/\" title=\"https://science.nasa.gov/mission/hubble/multimedia/sonifications/\">Sonifications Webpage</a>&nbsp;to view some examples.</p> <p>The linked YouTube video below is a composite image/sound from the center of the Milky Way galaxy. The data includes x-ray, optical, and infrared light both visually and using sound.&nbsp;</p> <section class=\"box-note\"> <h2 class=\"box-legend\"><span class=\"lt-icon-default\">Sounds from Around the Milky Way</span></h2> <p><strong>Video Length</strong>: 1 minute 4 seconds</p> <p><strong>Context</strong>: This video allows users to \"listen\" to the center of the Milky Way as observed in X-ray, optical, and infrared light.</p> <div class=\"mt-video-widget mt-video-width-40\"><img aspectratio=\"56.25%\" class=\"mt-media\" media=\"https://www.youtube.com/embed/3N9RnmwIWbA\" src=\"\" /></div> <p class=\"mt-align-center\">(<a href=\"https://youtu.be/3N9RnmwIWbA\" title=\"https://youtu.be/3N9RnmwIWbA\">\"Sounds from Around the Milky Way</a>,\" <a href=\"https://www.jpl.nasa.gov/edu/\" title=\"https://www.jpl.nasa.gov/edu/\">NASA JPL Education</a>,&nbsp;<a href=\"https://creativecommons.org/licenses/by/4.0/\" title=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>, <a href=\"https://www.youtube.com\" title=\"https://www.youtube.com\">Youtube</a>)</p> </section> <p>Using visual data alone, we normally&nbsp;analyze data from images by peaks on a graph. In other words, a bright spot on an image is represented by a sharp peak on the graph. The NASA sonifications we see above also provide an audio representation of this data by \"reading\" the image from left to right. As the video plays, we see the peaks of the graph change as bright or dim objects pass by, matched by the audible sounds being played.</p> <p>Sonification takes a visual signal and&nbsp;translates it into corresponding frequencies that can be heard by the human ear. To be clear, the sound you hear in the video is NOT one you would actually hear from space. Think of it like the difference between reading a physical book versus listening to an audiobook. An audiobook contains the same information as the printed words, but has been translated into sounds so that we no longer need to rely on our eyes to read.</p> <p>To help understand the motivation for using sound instead of light, we turn to the many astronomers that currently perform this research. According to Zanella et al. (2022), there are several limitations of analyzing astronomical data using solely visual methods. In their Nature Astronomy article, the authors state, \"datasets are becoming extremely large and complex, often containing many dimensions. This makes it difficult to effectively and comprehensively display the data using standard visualization techniques and it is often required to prioritize and filter the data to only visualize the information that is believed to be relevant.\"(p. 1241). This complexity can also be observed in the sonification examples from above. Composite images that contain multiple types of electromagnetic waves become nearly impossible to display all of the meaningful data at the same time (consider what it would look like seeing all of the peaks from the video displayed on a single graph. Yikes, that's a lot!).</p> <p>The authors also point out several benefits to using sound for data analysis, \"Sound is inherently multidimensional because it is characterized by various parameters (for example, pitch, volume, tempo, location in a stereo field, timbre). We can also perceive several sounds simultaneously, meaning that we can listen to different sonified streams in parallel and our hearing can focus on one of many audio streams\" (p. 1241). Returning to the audiobook analogy, one extra dimension you might consider is how the audiobookreader uses their voice to convey extra dimensions of tone, volume, and pace in their reading to add additional meaning than if you were silently reading the words on the page.</p> <h2>Sonification and Accessibility</h2> <p>Dr. Wanda Díaz-Merced, pictured below, has played a major role in the advancement of sonification research in Astronomy, calling particular attention to elements of accessibility and access to Astronomy data for the visually impaired. She began her journey into sonification during college, having lost her sight, but still maintained her desire to pursue astronomy as a career. Since then, her work has been a major source of advancement in analyzing large data sets in the form of auditory sound.</p> <figure><img alt=\"Dr. Wanda Diaz-Merced shown smiling and dressed in a business casual style of dress\" class=\"internal default\" height=\"410px\" src=\"/@api/deki/files/61809/Wanda_Di%25CC%2581az-Merced_(KH9A1942-180822-CC).jpg\" style=\"width: 313px; height: 410px;\" width=\"313px\" /> <figcaption>Figure \\(\\PageIndex{1}\\): <span class=\"mw-mmv-title\" original-title=\"\">Wanda Díaz-Merced.&nbsp;Wanda Díaz-Merced at the inauguration of the the Inspiring Stars exhibition at the IAU General Assembly in Vienna, Austria</span>.<span class=\"mt-bgcolor-f1c40f\">&nbsp;(\"</span><a href=\"https://commons.wikimedia.org/w/index.php?curid=136315090\" title=\"https://commons.wikimedia.org/w/index.php?curid=136315090\"><span class=\"mw-mmv-title\" original-title=\"\"><span class=\"mt-bgcolor-f1c40f\">Wanda </span><span class=\"mt-bgcolor-f1c40f\">Díaz</span><span class=\"mt-bgcolor-f1c40f\">-</span></span></a><span class=\"mw-mmv-title\" original-title=\"\"><a href=\"https://commons.wikimedia.org/w/index.php?curid=136315090\" title=\"https://commons.wikimedia.org/w/index.php?curid=136315090\"><span class=\"mt-bgcolor-f1c40f\">Merced</span></a><span class=\"mt-bgcolor-f1c40f\">\",&nbsp;</span></span><span class=\"mt-bgcolor-f1c40f\">IAU</span><span class=\"mt-bgcolor-f1c40f\">/M. </span><span class=\"mt-bgcolor-f1c40f\">Zamani</span><span class=\"mt-bgcolor-f1c40f\">,&nbsp;</span><a href=\"https://www.iau.org/public_press/images/detail/KH9A1942-180822-CC\" title=\"https://www.iau.org/public_press/images/detail/KH9A1942-180822-CC\"><span class=\"mt-bgcolor-f1c40f\">IAU</span><span class=\"mt-bgcolor-f1c40f\">&nbsp;identifier </span><span class=\"mt-bgcolor-f1c40f\">KH9A1942</span><span class=\"mt-bgcolor-f1c40f\">-180822-CC</span></a><span class=\"mt-bgcolor-f1c40f\">.&nbsp;</span><a href=\"https://creativecommons.org/licenses/by/4.0/\" title=\"https://creativecommons.org/licenses/by/4.0/\"><span class=\"mt-bgcolor-f1c40f\">CC BY 4.0</span></a><span class=\"mt-bgcolor-f1c40f\">, via </span><a href=\"https://commons.wikimedia.org/wiki/Main_Page\" title=\"https://commons.wikimedia.org/wiki/Main_Page\"><span class=\"mt-bgcolor-f1c40f\">Wikimedia</span><span class=\"mt-bgcolor-f1c40f\"> Commons</span></a><span class=\"mt-bgcolor-f1c40f\">).</span></figcaption> </figure> <p>Throughout her career, Dr. Díaz-Merced has collaborated with other astronomers on numerous applications of sonification in astronomy, particularly with accessibility in mind. Some of her most notable research has involved the development of advanced sonification software, making the process easier and more useful for modern research applications (Díaz-Merced et al., 2011). In one application, her team analyzed data from the Chandra X-Ray telescope, identifying frequencies of a <a href=\"https://en.wikipedia.org/wiki/Cataclysmic_variable_star\" title=\"https://en.wikipedia.org/wiki/Cataclysmic_variable_star\"><span class=\"mt-bgcolor-2980b9\">cataclysmic variable star</span></a>. <span class=\"mt-bgcolor-e74c3c\">(Change to link in textbook when ready)</span> She has also studied solar phenomena such as major solar flares, coronal mass ejections (CMEs), and solar wind plasma using this technique. In short, all of this work has significantly advanced the field of sonification and the software required to utilize this technique.</p> <section class=\"box-note\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Futher Exploration: Interactive Activity</span></h5> <ul> <li>Watch the TED Talk <a href=\"https://www.ted.com/talks/wanda_diaz_merced_how_a_blind_astronomer_found_a_way_to_hear_the_stars?utm_campaign=tedspread&amp;utm_medium=referral&amp;utm_source=tedcomshare\" rel=\"noopener noreferrer\" target=\"_blank\">How a Blind Astronomer Found a Way to Hear the Stars</a> to learn how Dr. Wanda Díaz-Merced uses sonification to analyze astronomical data and advance accessibility in astronomy research.</li> </ul> </section> <h2>References</h2> <p>Diaz-Merced, W. L., Candey, R. M., Brickhouse, N., Schneps, M., Mannone, J. C., Brewster, S., &amp; Kolenberg, K. (2011). Sonification of Astronomical Data. <i>Proceedings of the International Astronomical Union</i>, <i>7</i>(S285), 133–136. <a href=\"https://doi.org/10.1017/S1743921312000440\" rel=\"freelink\" title=\"https://doi.org/10.1017/S1743921312000440\">https://doi.org/10.1017/S1743921312000440</a></p> <p>Zanella, A., Harrison, C. M., Lenzi, S., Cooke, J., Damsma, P., &amp; Fleming, S. W. (2022). Sonification and sound design for astronomy research, education and public engagement. Nature Astronomy, 6(11), 1241-1248. <a href=\"https://doi.org/10.1038/s41550-022-01721-z\" rel=\"freelink\" title=\"https://doi.org/10.1038/s41550-022-01721-z\">https://doi.org/10.1038/s41550-022-01721-z</a></p>"
