                  - heading "The Matter Between the Stars" [level=2] [ref=f306e2]
                  - paragraph [ref=f306e3]:
                    - text: Astronomers refer to all the material between stars as
                    - emphasis [ref=f306e4]: interstellar
                    - text: matter; the entire collection of interstellar matter is called the interstellar medium (ISM). Some interstellar material is concentrated into giant clouds, each of which is known as a nebula (plural “nebulae,” Latin for “clouds”). The best-known nebulae are the ones that we can see glowing or reflecting visible light; there are many pictures of these in this chapter.
                  - paragraph [ref=f306e5]: Interstellar clouds do not last for the lifetime of the universe. Instead, they are like clouds on Earth, constantly shifting, merging with each other, growing, or dispersing. Some become dense and massive enough to collapse under their own gravity, forming new stars. When stars die, they, in turn, eject some of their material into interstellar space. This material can then form new clouds and begin the cycle over again.
                  - paragraph [ref=f306e6]:
                    - text: About 99% of the material between the stars is in the form of a
                    - emphasis [ref=f306e7]: gas
                    - text: —that is, it consists of individual atoms or molecules. The most abundant elements in this gas are hydrogen and helium (which we saw are also the most abundant elements in the stars), but the gas also includes other elements. Some of the gas is in the form of molecules—combinations of atoms. The remaining 1% of the interstellar material is solid—frozen particles consisting of many atoms and molecules that are called
                    - emphasis [ref=f306e8]: interstellar grains
                    - text: or interstellar dust (Figure 20.2). A typical dust grain consists of a core of rocklike material (silicates) or graphite surrounded by a mantle of ices; water, methane, and ammonia are probably the most abundant ices.
                  - 'figure "Figure 20.2 : Various Types of Interstellar Matter. The reddish nebulae in this spectacular photograph glow with light emitted by hydrogen atoms. The darkest areas are clouds of dust that block the light from stars behind them. The upper part of the picture is filled with the bluish glow of light reflected from hot stars embedded in the outskirts of a huge, cool cloud of dust and gas. The cool supergiant star Antares can be seen as a big, reddish patch in the lower-left part of the picture. The star is shedding some of its outer atmosphere and is surrounded by a cloud of its own making that reflects the red light of the star. The red nebula in the middle right partially surrounds the star Sigma Scorpii. (To the right of Antares, you can see M4, a much more distant cluster of extremely old stars.) (credit: modification of work by ESO/Digitized Sky Survey 2)" [ref=f306e9]':
                    - img "Various Types of Interstellar Matter. Antares, the brightest star in the constellation Scorpio, is at lower left in this wide-field image. It is surrounded by reddish nebulosity. To the right of Antares is the globular cluster M4. At center left a bright star is surrounded by the blue glow of a reflection nebula, and at center right another bright star is surrounded by red nebulosity. Above these two stars a dark nebula snakes its way across the image, blocking the light from behind. Finally, at top center, a bright star is surrounded by a large area of blue reflection nebulosity, criss-crossed by dark dust lanes." [ref=f306e11]
                  - paragraph [ref=f306e13]:
                    - text: If all the interstellar gas within the Galaxy were spread out smoothly, there would be only about one atom of gas per
                    - generic [ref=f306e14]:
                      - text: cm
                      - superscript [ref=f306e15]: "3"
                    - text: in interstellar space. (In contrast, the air in the room where you are reading this book has roughly 10
                    - superscript [ref=f306e16]: "19"
                    - text: atoms per
                    - generic [ref=f306e17]:
                      - text: cm
                      - superscript [ref=f306e18]: "3"
                    - text: .) The dust grains are even scarcer. A
                    - generic [ref=f306e19]:
                      - text: km
                      - superscript [ref=f306e20]: "3"
                    - text: of space would contain only a few hundred to a few thousand tiny grains, each typically less than one ten-thousandth of a millimeter in diameter. These numbers are just averages, however, because the gas and dust are distributed in a patchy and irregular way, much as water vapor in Earth’s atmosphere is often concentrated into clouds.
                  - paragraph [ref=f306e21]: In some interstellar clouds, the density of gas and dust may exceed the average by as much as a thousand times or more, but even this density is more nearly a vacuum than any we can make on Earth. To show what we mean, let’s imagine a vertical tube of air reaching from the ground to the top of Earth’s atmosphere with a cross-section of 1 square meter. Now let us extend the same-size tube from the top of the atmosphere all the way to the edge of the observable universe—over 10 billion light-years away. Long though it is, the second tube would still contain fewer atoms than the one in our planet’s atmosphere.
                  - paragraph [ref=f306e22]:
                    - text: While the
                    - emphasis [ref=f306e23]: density
                    - text: of interstellar matter is very low, the volume of space in which such matter is found is huge, and so its
                    - emphasis [ref=f306e24]: total
                    - emphasis [ref=f306e25]: mass
                    - text: is substantial. To see why, we must bear in mind that stars occupy only a tiny fraction of the volume of the Milky Way Galaxy. For example, it takes light only about four seconds to travel a distance equal to the diameter of the Sun, but more than four
                    - emphasis [ref=f306e26]: years
                    - text: to travel from the Sun to the nearest star. Even though the spaces among the stars are sparsely populated, there’s a lot of space out there!
                  - paragraph [ref=f306e27]: Astronomers estimate that the total mass of gas and dust in the Milky Way Galaxy is equal to about 15% of the mass contained in stars. This means that the mass of the interstellar matter in our Galaxy amounts to about 10 billion times the mass of the Sun. There is plenty of raw material in the Galaxy to make generations of new stars and planets (and perhaps even astronomy students).
                  - heading "Examples and Exercises" [level=2] [ref=f306e28]
                  - paragraph [ref=f306e29]: "Example: Estimating Interstellar Mass"
