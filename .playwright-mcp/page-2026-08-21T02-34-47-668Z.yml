                  - heading "The Discovery of Neutron Stars" [level=3] [ref=f405e50]
                  - paragraph [ref=f405e51]:
                    - text: In 1967, Jocelyn Bell, a research student at Cambridge University, was studying distant radio sources with a special detector that had been designed and built by her advisor Antony Hewish to find rapid variations in radio signals. In September 1967, Bell discovered a source of rapid, sharp, intense, and extremely regular pulses of radio radiation in the constellation of Vulpecula. The pulses arrived precisely every 1.33728 seconds, leading the scientists to speculate that perhaps they had found signals from an intelligent civilization. Radio astronomers even half-jokingly dubbed the source LGM for little green men. Since then, nearly 3000 such sources have been discovered, and they are now called
                    - strong [ref=f405e52]:
                      - link "pulsars" [ref=f405e53]:
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.07:_Key_Terms#pulsar
                    - text: ", short for “pulsating radio sources.”"
                  - paragraph [ref=f405e54]: .
                  - paragraph [ref=f405e55]: "The pulse periods of different pulsars range from a little longer than 1/1000 of a second to nearly 10 seconds. At first, the pulsars seemed particularly mysterious because nothing could be seen at their location on visible-light photographs. But then a pulsar was discovered right in the center of the Crab Nebula, a cloud of gas produced by SN 1054 that is roughly 6500 light-years away. Figure \\(\\PageIndex{2}\\)) includes the Crab Nebula in X-ray light. The pulsar is the bright spot at the center of the concentric rings. Data taken over about a year show that particles stream away from the inner ring at about half the speed of light. The jet that is perpendicular to this ring is a stream of matter and antimatter electrons also moving at half the speed of light. The energy from the Crab Nebula pulsar arrives in sharp bursts that occur 30 times each second. In addition to pulses of radio energy, there are pulses of visible light and X-rays from the Crab Nebula. Since this pulsar was detected inside a supernova remnant, astronomers began exploring the connection between pulsars and supernove."
                  - figure [ref=f405e56]:
                    - img "The Crab Nebula in X-ray. Details in caption." [ref=f405e57]
                    - generic [ref=f405e58]:
                      - text: "Figure \\(\\PageIndex{2}\\) : Crab Nebula. This X-ray image includes the pulsar with its jet, that are not observable in visible light. ("
                      - link "CC BY" [ref=f405e59]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f405e60]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f405e61]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{2}\\)" [ref=f405e62]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.4.2_Crab_Nebula_in_X-rays
                      - text: .
                  - heading "A Spinning Lighthouse Model" [level=3] [ref=f405e63]
                  - paragraph [ref=f405e64]: By applying a combination of theory and observation, astronomers eventually concluded that pulsars must be spinning neutron stars. According to this model, a neutron star is something like a lighthouse. A lighthouse, light source projects a beam of light and rotates. From the a ship, the light appears to blink on and off at a regular rate as the turning beam sweeps past you. In the same way, radiation from a small region on a neutron star sweeps across space, giving us a pulse of radiation each time the beam points toward Earth.
                  - paragraph [ref=f405e65]: The principle of conservation of angular momentum states that if an object gets smaller, it can spin more rapidly. Even if the original star was rotating very slowly when it was on the main sequence, its rotation rate increased as it collapsed to form a neutron star. With a diameter of only 10 to 20 kilometers, a neutron star can complete one full spin in only a fraction of a second, similar to observed pulsars.
                  - paragraph [ref=f405e66]: "The magnetic field that existed in the original star is compressed when the core collapses to a neutron star. At the surface of the neutron star, in the outer layer consisting of ordinary matter and not just pure neutrons, protons and electrons are caught up in this spinning field and accelerated nearly to the speed of light. At the north and south magnetic poles, the trapped particles escape the strong hold of the magnetic field. They are focused into a narrow beam and are ejected out of the magnetic pole at enormous speeds. They give off energy over a broad range of the electromagnetic spectrum. Figure \\(\\PageIndex{3}\\)) is a diagram showing how beams of radiation at the magnetic poles of a neutron star can appear to be a pulsar. As each beam sweeps over Earth, we see a short pulse of radiation. This model requires that the magnetic poles be located in different places from the rotation poles. In this model, all pulsars are neutron stars, but not all neutron stars are observed on Earth as pulsars. If a neutron star has magnetic poles that never point at Earth or if a neutron star's rotation poles and magnetic poles are aligned, then Earth will not observe a pulsing signal from the neutron star."
                  - figure [ref=f405e67]:
                    - img "Pulsar diagram with magnetic field lines and particle beams. Details in text." [ref=f405e68]
                    - generic [ref=f405e69]:
                      - text: "Figure \\(\\PageIndex{3}\\) : Model of a Pulsar. This diagram demonstrates that pulsars are neutron stars that have a spin axis perpendicular to its magnetic poles. The beams from the magnetic poles rotate similar to a lighthouse and, if they are pointing correctly, observed by Earth. ("
                      - link "CC BY" [ref=f405e70]:
                        - /url: https://creativecommons.org/licenses/by/4.0/
                      - text: ;
                      - link "Fraknoi, et al." [ref=f405e71]:
                        - /url: https://openstax.org/books/astronomy-2e/pages/preface
                      - text: via
                      - link "Openstax Astronomy 2nd ed." [ref=f405e72]:
                        - /url: https://openstax.org/details/books/astronomy
                      - text: )
                      - 'link "Alternative description of Figure \\(\\PageIndex{3}\\)" [ref=f405e73]':
                        - /url: /Workbench/De_Anza_-_ASTR10/13:_Stellar_Finale/13.08:_Accessible_Descriptions#Figure_13.4.3_Model_of_a_Pulsar
                      - text: .
                  - heading "Tests of the Model" [level=3] [ref=f405e74]
                  - paragraph [ref=f405e75]:
                    - text: To confirm this model, astronomers needed to connect the model predictions with observations. Using Kepler's law for pulsars in binary star systems, astronomer can calculate the some pulsars. They are in the range of 1.4 to 1.8
                    - generic [ref=f405e76]:
                      - text: M
                      - subscript [ref=f405e77]: Sun
                    - text: which is what theorists predict for neutron stars. Also, when the high-energy charged particles from the neutron star pulsar hit the slower-moving material from a supernova, they energize this material and cause it to glow at many different wavelengths. In the Crab Nebula, the pulsar beams are a power source that light up the nebula long after the initial explosion of the star that made it.
                  - paragraph [ref=f405e78]: The ultimate energy source in this model is the rotation of the neutron star, which propels charged particles outward and spins its magnetic field at enormous speeds. As its rotational energy is used to excite the Crab Nebula year after year, the pulsar inside the nebula slows down. As it slows, the pulses come a little less often. Several decades of careful observations have now shown that the Crab Nebula pulsar is gradually slowing down. Having measured how much the pulsar is slowing down, we can calculate how much rotation energy the neutron star is losing. Remember that it is very densely packed and spins amazingly quickly. Even a tiny slowing down can mean an immense loss of energy. The rotational energy lost by the pulsar turns out to be the same as the amount of energy emerging from the nebula surrounding it. The slowing down of a rotating neutron star can explain precisely why the Crab Nebula is glowing with the amount of energy we observe.
                  - heading "The Evolution of Pulsars" [level=3] [ref=f405e79]
                  - paragraph [ref=f405e80]: From observations of the pulsars discovered so far, astronomers have concluded that one new pulsar is born somewhere in the Galaxy every 25 to 100 years, the same rate at which supernovae are estimated to occur. Calculations suggest that the typical lifetime of a pulsar is about 10 million years. After that, the neutron star no longer rotates fast enough to produce significant beams of particles and energy. We estimate that there are about 100 million neutron stars in our Galaxy, most of them rotating too slowly to be observed as a pulsar. Also, we are unable to observe any pulsars whose beams never point at Earth.
                  - paragraph [ref=f405e81]: The Crab pulsar is rather young, only about 960 years old, and has a short period, whereas other, older pulsars have already slowed to longer periods. Pulsars thousands of years old have lost too much energy to emit appreciably in the visible and X-ray wavelengths, and they are observed only as radio pulsars; their periods are a second or longer. Only a few of the pulsars discovered so far are embedded in the visible clouds of gas that mark the remnant of a supernova. The lifetime of a pulsar turns out to be about 100 times longer than the length of time required for the expanding gas of a supernova remnant to disperse into interstellar space. Thus, most pulsars are found with no other trace left of the explosion that produced them.
                  - paragraph [ref=f405e82]: In addition, some pulsars are ejected by a supernova explosion that is not the same in all directions. If the supernova explosion is stronger on one side, it can kick the pulsar entirely out of the supernova remnant. Astronomers have detected several young supernova remnants in nearby galaxies where the pulsar is to one side of the remnant and racing away at several hundred miles per second.
                  - heading "Touched by a Neutron Star" [level=3] [ref=f405e83]
                  - paragraph [ref=f405e84]: On December 27, 2004, Earth was bathed with a stream of X-ray and gamma-ray radiation from a neutron star known as SGR 1806-20. Despite the distance of the source, its burst of energy had measurable effects on Earth’s atmosphere. The apparent brightness of this gamma-ray flare was greater than any historical star explosion. The primary effect was on a layer high in Earth’s atmosphere called the ionosphere. At night, the ionosphere is normally at a height of about 85 kilometers, but during the day, energy from the Sun ionizes more molecules and lowers the boundary of the ionosphere to a height of about 60 kilometers. The pulse of X-rays and gamma-rays produced about the same level of ionization as the daytime Sun. It also caused some sensitive satellites above the atmosphere to shut down their electronics.
                  - paragraph [ref=f405e85]: Measurements by telescopes in space indicate that SGR 1806-20 was a special type of fast-spinning neutron star called a magnetar. Astronomers Robert Duncan and Christopher Thomson gave them this name because their magnetic fields are stronger than that of any other type of astronomical source, about 800 trillion times stronger than the magnetic field of Earth. A magnetar is thought to consist of a superdense core of neutrons surrounded by a rigid crust of atoms about a mile deep with a surface made of iron. The magnetar’s field is so strong that it creates huge stresses inside that can sometimes crack open the hard crust, causing a starquake. The vibrating crust produces an enormous blast of energy.
                  - paragraph [ref=f405e86]: Fortunately, we were far enough away from magnetar SGR 1806-20 to be safe. Could a magnetar ever present a real danger to Earth? To produce enough energy to disrupt the ozone layer, a magnetar would have to be located within the cloud of comets that surround the Solar System, and we know no magnetars are that close. Nevertheless, it is a fascinating discovery that events on distant star corpses can have measurable effects on Earth.
