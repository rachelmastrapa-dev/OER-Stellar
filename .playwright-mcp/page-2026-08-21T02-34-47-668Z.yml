                  - heading "Neutron Stars" [level=2] [ref=f405e2]
                  - paragraph [ref=f405e3]:
                    - text: After a type II supernova explosion fades away, all that is left behind is either a neutron star or a black hole. We will describe the properties of black holes in
                    - link "Black Holes" [ref=f405e4]:
                      - /url: /Workbench/De_Anza_-_ASTR10/14:_Black_Holes
                    - text: . For now, we will discuss neutron stars.
                  - paragraph [ref=f405e5]:
                    - text: The densest objects in the universe, neutron stars are dim and intensely hot. the force of gravity at their surface is 10
                    - superscript [ref=f405e6]: "11"
                    - text: times greater than what we experience at Earth’s surface. The interior of a neutron star is composed of about 95% neutrons, with a small number of protons and electrons mixed in. In effect, a neutron star is a giant atomic nucleus, with a mass about 10
                    - superscript [ref=f405e7]: "57"
                    - text: "times the mass of a proton. Its diameter is more like the size of a small town or an asteroid than a star. Table \\(\\PageIndex{1}\\) compares the properties of neutron stars and white dwarfs."
                  - paragraph [ref=f405e8]: "Because they are so small, a neutron star can be very hard to detect. In Figure \\(\\PageIndex{1}\\), there is a lone neutron star, RX J1856.5−3754, indicated with an arrow. This star is over 700 thousand K at the surface, and can is roughly 28 kilometers across. The first clue that there was a neutron star at this location came in 1992, when ROSAT, the Roentgen Satellite, found a bright X-ray source without any visible counterpart in the sky. Hubble's Wide Field Planetary Camera 2 was used in October 1996 to undertake asensitive search for the object in visible light, and found this star near the X-ray position. Astronomers haven't directly measured the neutron star's distance, but it lies in front of a molecular cloud known to be about 400 light-years away in the southern constellation Corona Australis."
                  - figure [ref=f405e9]:
                    - img "Neutron Star RX J1856.5−3754 by Hubble Space Telescope." [ref=f405e10]
                    - generic [ref=f405e11]:
