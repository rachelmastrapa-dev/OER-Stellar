                  - heading "The First Telescopic Observer" [level=2] [ref=f587e2]
                  - figure "Public Domain | Image courtesy of Pixabay. com." [ref=f587e3]:
                    - img "Image of a statue of Galileo Galilei." [ref=f587e4]
                  - paragraph [ref=f587e6]:
                    - text: Italian astronomer and physicist Galileo Galilei first used the telescope astronomically in 1609. He was the first to see such wonders as sunspots, which he described as blemishes on the Sun, and features on the Moon like
                    - emphasis [ref=f587e7]: Mare
                    - text: —seas or bodies of water.
                  - paragraph [ref=f587e8]: Galileo’s observations of the planets were monumental.
                  - list [ref=f587e9]:
                    - listitem [ref=f587e10]:
                      - text: Mercury and Venus showed
                      - emphasis [ref=f587e11]: phases
                      - text: ", which meant Mercury and Venus orbits the Sun"
                      - emphasis [ref=f587e12]: between
                      - text: Earth and the Sun
                    - listitem [ref=f587e13]:
                      - text: Four bright moons around Jupiter
                      - list [ref=f587e14]:
                        - listitem [ref=f587e15]: Galileo’s continued observation of Jupiter’s moons was important in the Geocentric-Heliocentric Solar System debate.
                    - listitem [ref=f587e16]: Milky Way and found it had countless stars
                  - heading "An interesting note about Galileo…" [level=3] [ref=f587e17]
                  - paragraph [ref=f587e18]: Galileo also worked on several problems in physics, in addition to his pioneering astronomical observations. He was a deeply religious man, as his daughter who was a nun. Galileo was held on house arrest by the Church and made to recant his theory of a Heliocentric Sun-centered Solar System. Galileo’s right hand middle finger was removed after his death and is on display in the Science Museum of Florence, along with some of his telescopes.
                  - paragraph [ref=f587e19]:
                    - text: Galileo was instrumental in establishing
                    - emphasis [ref=f587e20]: observation
                    - text: as the absolute determinant of truth, rather than “logical” argument. Galileo’s use of the telescope was his most notable achievement in demonstrating the importance of observation. He discovered moons orbiting Jupiter and made other observations that were inconsistent with certain ancient ideas and religious dogma. For this reason, and because of the manner in which he dealt with those in authority, Galileo was tried by the Inquisition and punished. He spent the final years of his life under a form of house arrest. Because others before Galileo had also made discoveries by
                    - emphasis [ref=f587e21]: observing
                    - text: the nature of the universe, and because repeated observations verified those of Galileo, his work could not be suppressed or denied. After his death, his work was verified by others, and his ideas were eventually accepted by the church and scientific communities.
                  - paragraph [ref=f587e22]: Galileo also contributed to the formation of what is now called Newton’s first law of motion. Newton made use of the work of his predecessors, which enabled him to develop laws of motion, discover the law of gravity, invent calculus, and make great contributions to the theories of light and color. It is amazing that many of these developments were made with Newton working alone, without the benefit of the usual interactions that take place among scientists today.
                  - heading "Attributions" [level=2] [ref=f587e23]
                  - paragraph [ref=f587e24]:
                    - link "https://phys.libretexts.org/Bookshel...avens-_Galileo" [ref=f587e25]:
                      - /url: /Bookshelves/Astronomy__Cosmology/Introduction_to_Astronomy_(Lumen)/02:_Historical_Astronomy/2.10:_Observations_of_the_Heavens-_Galileo
                  - paragraph [ref=f587e26]:
