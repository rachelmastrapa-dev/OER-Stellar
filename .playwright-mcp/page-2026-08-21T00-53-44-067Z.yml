              - textbox "Rich Text Editor, editarea" [active] [ref=f72e344]: "<h2>Defining Light</h2> <p class=\"lt-phys-64676\">&nbsp;</p> <p class=\"lt-phys-64676\">The visible light and other radiation we receive from the stars and planets is generated by processes at the atomic level,&nbsp;by changes in the way the parts of an atom interact and move. To understand how light is generated, we must explore how atoms work.&nbsp;One of the key ideas explored in this chapter is that visible light is not unique, it is merely the most familiar example of a much larger family of radiation that can carry information to us.</p> <p class=\"lt-phys-64676\">In everyday language, radiation is often used to describe certain kinds of energetic subatomic particles released by radioactive materials in our environment. An example is the kind of radiation used to treat some cancers. But this is not what we mean when we use the word radiation in an astronomy text. Radiation, as used in this book, is a general term for waves that radiate outward from a source.</p> <h2 class=\"lt-phys-64676\">Electromagnetism</h2> <p class=\"lt-phys-64676\">We will look at the structure of the atom in more detail later, but we begin by noting that the typical atom consists of several types of particles, a number of which have not only mass but an additional property called electric charge. In the nucleus (central part) of every atom are <em data-effect=\"italics\">protons</em>, which are positively charged; outside the nucleus are electrons, which have a negative charge.</p> <h3 class=\"lt-phys-64676\">James Clerk Maxwell</h3> <p class=\"lt-phys-64676\">In the nineteenth century, many physicists turned to the study of electricity and magnetism, which are intimately connected with the production of light, including the&nbsp;physicist James Clerk <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Maxwell</span>. Inspired by a number of ingenious experiments that showed an intimate relationship between electricity and magnetism, Maxwell developed a theory that describes both electricity and magnetism with only a small number of simple equations. It is this theory that gives us important insights into the nature and behavior of light.&nbsp;Maxwell unified the rules governing electricity and magnetism into a coherent theory.&nbsp;</p> <p class=\"lt-phys-64676\">Maxwell’s theory deals with these electric charges and their effects, especially when they are moving. In the vicinity of an electron charge, another charge feels a force of attraction or repulsion: opposite charges attract; like charges repel. When charges are not in motion, we observe only this electric attraction or repulsion. If charges are in motion, however (as they are inside every atom and in a wire carrying a current), then we measure another force called <em data-effect=\"italics\">magnetism</em>.</p> <p class=\"lt-phys-64676\">Magnetism was well known for much of recorded human history, but its cause was not understood until the nineteenth century. Experiments with electric charges demonstrated that <span class=\"no-emphasis\" data-type=\"term\" group-by=\"m\">magnetism</span> was the result of moving charged particles. Sometimes, the motion is clear, as in the coils of heavy wire that make an industrial electromagnet. Other times, it is more subtle, as in the kind of magnet you buy in a hardware store, in which many of the electrons inside the atoms are spinning in roughly the same direction; it is the alignment of their motion that causes the material to become magnetic.</p> <p class=\"lt-phys-64676\">Physicists use the word <em data-effect=\"italics\">field</em> to describe the action of forces that one object exerts on other distant objects. For example, we say the Sun produces a <em data-effect=\"italics\">gravitational field</em> that controls Earth’s orbit, even though the Sun and Earth do not come directly into contact. Using this terminology, we can say that stationary electric charges produce <em data-effect=\"italics\">electric fields</em>, and moving electric charges also produce <em data-effect=\"italics\">magnetic fields</em>.</p> <h3 class=\"lt-phys-64676\">Electromagnetic Waves</h3> <p class=\"lt-phys-64676\">Actually, the relationship between electric and magnetic phenomena is even more profound. Experiments showed that changing magnetic fields could produce electric currents (and thus changing electric fields), and changing electric currents could in turn produce changing magnetic fields. So once begun, electric and magnetic field changes could continue to trigger each other.</p> <p class=\"lt-phys-64676\"><span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Maxwell</span> analyzed what would happen if electric charges were oscillating (moving constantly back and forth) and found that the resulting pattern of electric and magnetic fields would spread out and travel rapidly through space. Something similar happens when a raindrop strikes the surface of water or a frog jumps into a pond. The disturbance moves outward and creates a pattern we call a <em data-effect=\"italics\">wave</em> in the water (Figure 5.3). You might, at first, think that there must be very few situations in nature where electric charges oscillate, but this is not at all the case. As we shall see, atoms and molecules (which consist of charged particles) oscillate back and forth all the time. The resulting electromagnetic disturbances are among the most common phenomena in the universe.</p> <figure><span data-alt=\"Photo of a frog sitting in a shallow pool of water. A concentric series of waves spreading out from the center where the frog’s song has impacted the water.\" data-type=\"media\"><img alt=\"Photo of a frog sitting in a shallow pool of water. A concentric series of waves spreading out from the center where the frog’s song has impacted the water.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46119/6442f249039ab14cb13664381bf4b4071cc75eaa\" /> </span> <figcaption>Figure 5.3 : Making Waves. An oscillation in a pool of water creates an expanding disturbance called a wave. (credit: modification of work by \"vastateparksstaff\"/Flickr)</figcaption> </figure> <p class=\"lt-phys-64676\">Maxwell was able to calculate the speed at which an electromagnetic disturbance moves through space; he found that it is equal to the speed of light, which had been measured experimentally. On that basis, he speculated that light was one form of a family of possible electromagnetic disturbances called <span data-type=\"term\" group-by=\"e\">electromagnetic radiation</span>, a conclusion that was again confirmed in laboratory experiments. When light (reflected from the pages of an astronomy textbook, for example) enters a human eye, its changing electric and magnetic fields stimulate nerve endings, which then transmit the information contained in these changing fields to the brain. The science of astronomy is primarily about analyzing radiation from distant objects to understand what they are and how they work.</p> <h2 class=\"lt-phys-64676\">Observing Light</h2> <p>&nbsp;</p> <h3 class=\"lt-phys-64676\">The Wave-Like Characteristics of Light</h3> <p class=\"lt-phys-64676\">The changing electric and magnetic fields in light are similar to the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"w\">waves</span> that can be set up in a quiet pool of water. In both cases, the disturbance travels rapidly outward from the point of origin and can use its energy to disturb other things farther away. (For example, in water, the expanding ripples moving away from our frog could disturb the peace of a dragonfly resting on a leaf in the same pool.) In the case of electromagnetic waves, the radiation generated by a transmitting antenna full of charged particles and moving electrons at your local radio station can, sometime later, disturb a group of electrons in your car radio antenna and bring you the news and weather while you are driving to class or work in the morning.</p> <p class=\"lt-phys-64676\">The waves generated by charged particles differ from water waves in some profound ways, however. Water waves require water to travel in. The sound waves we hear, to give another example, are pressure disturbances that require air to travel though. But electromagnetic waves do not require water or air: the fields generate each other and so can move through a vacuum (such as outer space). This was such a disturbing idea to nineteenth-century scientists that they actually made up a substance to fill all of space—one for which there was not a single shred of evidence—just so light waves could have something to travel through: they called it the <em data-effect=\"italics\">aether</em>. Today, we know that there is no aether and that electromagnetic waves have no trouble at all moving through empty space (as all the starlight visible on a clear night must surely be doing).</p> <p class=\"lt-phys-64676\">The other difference is that <em data-effect=\"italics\">all</em> electromagnetic waves move at the same speed in empty space (the speed of light—approximately 300,000 kilometers per second, or 300,000,000 meters per second, which can also be written as <math display=\"inline\"><semantics><mrow><mrow><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup><mtext> m/</mtext></mrow></mrow><mrow><mrow><mtext>s</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext> m/s</mtext></mrow></annotation-xml></semantics></math>), which turns out to be the fastest possible speed in the universe. No matter where electromagnetic waves are generated from and no matter what other properties they have, when they are moving (and not interacting with matter), they move at the speed of light. Yet you know from everyday experience that there are different kinds of light. For example, we perceive that light waves differ from one another in a property we call color. Let’s see how we can denote the differences among the whole broad family of electromagnetic waves.</p> <p class=\"lt-phys-64676\">The nice thing about a wave is that it is a repeating phenomenon. Whether it is the up-and-down motion of a water wave or the changing electric and magnetic fields in a wave of light, the pattern of disturbance repeats in a cyclical way. Thus, any wave motion can be characterized by a series of crests and troughs (Figure 5.4). Moving from one crest through a trough to the next crest completes one cycle. The horizontal length covered by one cycle is called the <span data-type=\"term\" group-by=\"w\">wavelength</span>. Ocean waves provide an analogy: the wavelength is the distance that separates successive wave crests.</p> <figure><span data-alt=\"This figure shows a simple wave. Both the crest (or highest point of the wave) and the trough (or lowest part of the wave) are labeled. Also labeled is the wavelength, i.e. the distance between successive peaks.\" data-type=\"media\"><img alt=\"This figure shows a simple wave. Both the crest (or highest point of the wave) and the trough (or lowest part of the wave) are labeled. Also labeled is the wavelength, i.e. the distance between successive peaks.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46118/8caecaac580f639ebf6ba550db228a684da01ca6\" /> </span> <figcaption>Figure 5.4 : Characterizing Waves. Electromagnetic radiation has wave-like characteristics. The wavelength (λ) is the distance between crests, the frequency (<em data-effect=\"italics\">f</em>) is the number of cycles per second, and the speed (<em data-effect=\"italics\">c</em>) is the distance the wave covers during a specified period of time (e.g., kilometers per second).</figcaption> </figure> <p class=\"lt-phys-64676\">For visible light, our eyes perceive different wavelengths as different colors: red, for example, is the longest visible wavelength, and violet is the shortest. The main colors of visible light from longest to shortest wavelength can be remembered using the mnemonic ROY G BIV—for <u data-effect=\"underline\">R</u>ed, <u data-effect=\"underline\">O</u>range, <u data-effect=\"underline\">Y</u>ellow, <u data-effect=\"underline\">G</u>reen, <u data-effect=\"underline\">B</u>lue, <u data-effect=\"underline\">I</u>ndigo, and <u data-effect=\"underline\">V</u>iolet. Other invisible forms of electromagnetic radiation have different wavelengths, as we will see in the next section.</p> <p class=\"lt-phys-64676\">We can also characterize different waves by their <span data-type=\"term\" group-by=\"f\">frequency</span>, the number of wave cycles that pass by per second. If you count 10 crests moving by each second, for example, then the frequency is 10 cycles per second (cps). In honor of Heinrich Hertz, the physicist who—inspired by Maxwell’s work—discovered radio waves, a cps is also called a <em data-effect=\"italics\">hertz</em> (Hz). Take a look at your radio, for example, and you will see the channel assigned to each radio station is characterized by its frequency, usually in units of KHz (kilohertz, or thousands of hertz) or MHz (megahertz, or millions of hertz).</p> <p class=\"lt-phys-64676\">Wavelength (λ) and frequency (<em data-effect=\"italics\">f</em>) are related because all electromagnetic waves travel at the same speed. To see how this works, imagine a parade in which everyone is forced by prevailing traffic conditions to move at exactly the same speed. You stand on a corner and watch the waves of marchers come by. First you see row after row of miniature ponies. Because they are not very large and, therefore, have a shorter wavelength, a good number of the ponies can move past you each minute; we can say they have a high frequency. Next, however, come several rows of circus elephants. The elephants are large and marching at the same speed as the ponies, so far fewer of them can march past you per minute: Because they have a wider spacing (longer wavelength), they represent a lower frequency.</p> <p class=\"lt-phys-64676\">The formula for this relationship can be expressed as follows: for any wave motion, the speed at which a wave moves equals the frequency times the wavelength. Waves with longer wavelengths have lower frequencies. Mathematically, we can express this as</p> <p class=\"lt-phys-64676\"><math display=\"block\"><semantics><mrow><mrow><mi>c</mi><mo>=</mo></mrow></mrow><mrow><mrow><mtext>λ</mtext><mi>f</mi></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>c</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mtext>λ</mtext><mi>f</mi></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64676\">where the Greek letter for “l”—lambda, λ—is used to denote wavelength and <em data-effect=\"italics\">c</em> is the scientific symbol for the speed of light. Solving for the wavelength, this is expressed as:</p> <p class=\"lt-phys-64676\"><math display=\"block\"><semantics><mrow><mrow><mtext>λ</mtext><mo>=</mo><mfrac><mi>c</mi><mi>f</mi></mfrac><mo>.</mo></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>λ</mtext><mo>=</mo><mfrac><mi>c</mi><mi>f</mi></mfrac><mo>.</mo></mrow></annotation-xml></semantics></math></p> <p>&nbsp;</p> <h3 class=\"lt-phys-64676\">Light as a Photon</h3> <p class=\"lt-phys-64676\">The electromagnetic wave model of light (as formulated by Maxwell) was one of the great triumphs of nineteenth-century science. In 1887, when Heinrich <span class=\"no-emphasis\" data-type=\"term\" group-by=\"H\">Hertz</span> actually made invisible electromagnetic waves (what today are called radio waves) on one side of a room and detected them on the other side, it ushered in a new era that led to the modern age of telecommunications. His experiment ultimately led to the technologies of television, cell phones, and today’s wireless networks around the globe.</p> <p class=\"lt-phys-64676\">However, by the beginning of the twentieth century, more sophisticated experiments had revealed that light behaves in certain ways that cannot be explained by the wave model. Reluctantly, physicists had to accept that sometimes light behaves more like a “particle”—or at least a self-contained packet of energy—than a wave. We call such a packet of electromagnetic energy a <span data-type=\"term\" group-by=\"p\">photon</span>.</p> <p class=\"lt-phys-64676\">The fact that light behaves like a wave in certain experiments and like a particle in others was a very surprising and unlikely idea. After all, our common sense says that waves and particles are opposite concepts. On one hand, a wave is a repeating disturbance that, by its very nature, is not in only one place, but spreads out. A particle, on the other hand, is something that can be in only one place at any given time. Strange as it sounds, though, countless experiments now confirm that electromagnetic radiation can sometimes behave like a wave and at other times like a particle.</p> <p class=\"lt-phys-64676\">Then, again, perhaps we shouldn’t be surprised that something that always travels at the “speed limit” of the universe and doesn’t need a medium to travel through might not obey our everyday common sense ideas. The confusion that this wave-particle duality of light caused in physics was eventually resolved by the introduction of a more complicated theory of waves and particles, now called quantum mechanics. (This is one of the most interesting fields of modern science, but it is mostly beyond the scope of our book. If you are interested in it, see some of the suggested resources at the end of this chapter.)</p> <p class=\"lt-phys-64676\">In any case, you should now be prepared when scientists (or the authors of this book) sometimes discuss electromagnetic radiation as if it consisted of waves and at other times refer to it as a stream of photons. A photon (being a packet of energy) carries a specific amount of energy. We can use the idea of energy to connect the photon and wave models. How much energy a photon has depends on its frequency when you think about it as a wave. A low-energy radio wave has a low frequency as a wave, while a high-energy X-ray at your dentist’s office is a high-frequency wave. Among the colors of visible light, violet-light photons have the highest energy and red-light photons have the lowest.</p> <p class=\"lt-phys-64676\">Test whether the connection between photons and waves is clear to you. In the above example, which photon would have the longer wavelength as a wave: the radio wave or the X-ray? If you answered the radio wave, you are correct. Radio waves have a lower frequency, so the wave cycles are longer (they are elephants, not miniature ponies).</p> <h3 class=\"lt-phys-64676\">Propagation of Light</h3> <p class=\"lt-phys-64676\">Let’s think for a moment about how <span class=\"no-emphasis\" data-type=\"term\" group-by=\"l\">light</span> from a lightbulb moves through space. As waves expand, they travel away from the bulb, not just toward your eyes but in all directions. They must therefore cover an ever-widening space. Yet the total amount of light available can’t change once the light has left the bulb. This means that, as the same expanding shell of light covers a larger and larger area, there must be less and less of it in any given place. Light (and all other electromagnetic radiation) gets weaker and weaker as it gets farther from its source.</p> <p class=\"lt-phys-64676\">The increase in the area that the light must cover is proportional to the square of the distance that the light has traveled (Figure 5.5). If we stand twice as far from the source, our eyes will intercept two-squared (2 × 2), or four times less light. If we stand 10 times farther from the source, we get 10-squared, or 100 times less light. You can see how this weakening means trouble for sources of light at astronomical distances. One of the nearest stars, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Alpha Centauri</span> A, emits about the same total energy as the Sun. But it is about 270,000 times farther away, and so it appears about 73 billion times fainter. No wonder the stars, which close-up would look more or less like the Sun, look like faint pinpoints of light from far away.</p> <figure><span data-alt=\"Figure illustrating the inverse square law for light. At left is a spherical light source such as a star. Four arrows move radially outward from the source toward the right, with each arrow representing one corner of a square. At one unit away from the source (labeled 1), the arrows are close together to form a square one unit high, and thus one unit square. At the next labeled unit (labeled 2), two steps away from the source, the square is now two units high, and thus four units square. At this distance from the source the energy is 4 times less than at step 1. The final labeled step (labeled 3) is 3 units away, thus the square bounded by the arrows is now 9 units in area, and the energy is 9 times less than at step 1.\" data-type=\"media\"><img alt=\"Figure illustrating the inverse square law for light. At left is a spherical light source such as a star. Four arrows move radially outward from the source toward the right, with each arrow representing one corner of a square. At one unit away from the source (labeled 1), the arrows are close together to form a square one unit high, and thus one unit square. At the next labeled unit (labeled 2), two steps away from the source, the square is now two units high, and thus four units square. At this distance from the source the energy is 4 times less than at step 1. The final labeled step (labeled 3) is 3 units away, thus the square bounded by the arrows is now 9 units in area, and the energy is 9 times less than at step 1.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/46117/aad696909e6981d02228be5ea816888f64ede8ed\" /> </span> <figcaption>Figure 5.5 : Inverse Square Law for Light. As light radiates away from its source, it spreads out in such a way that the energy per unit area (the amount of energy passing through one of the small squares) decreases as the square of the distance from its source.</figcaption> </figure> <p class=\"lt-phys-64676\">This idea—that the apparent brightness of a source (how bright it looks to us) gets weaker with distance in the way we have described—is known as the <span data-type=\"term\" group-by=\"i\">inverse square law</span> for light propagation. In this respect, the propagation of light is similar to the effects of gravity. Remember that the force of gravity between two attracting masses is also inversely proportional to the square of their separation.</p> <h2>Examples and Exercises&nbsp;</h2> <p>Example: Deriving and Using the Wave Equation</p> <p class=\"lt-phys-64676\">The equation for the relationship between the speed and other characteristics of a wave can be derived from our basic understanding of motion. The average speed of anything that is moving is:</p> <p class=\"lt-phys-64676\"><math display=\"block\"><semantics><mrow><mrow><mtext>average speed</mtext><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mrow><mtext>distance</mtext></mrow><mrow><mtext>time</mtext></mrow></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>average</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext> speed</mtext><mo>=</mo><mfrac><mrow><mtext>distance</mtext></mrow><mrow><mtext>time</mtext></mrow></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64676\">(So, for example, a car on the highway traveling at a speed of 100 km/h covers 100 km during the time of 1 h.) For an electromagnetic wave to travel the distance of one of its wavelengths, λ, at the speed of light, <em data-effect=\"italics\">c</em>, we have <math display=\"inline\"><semantics><mrow><mrow><mi>c</mi><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mi>λ</mi><mi>t</mi></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>c</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mi>λ</mi><mi>t</mi></mfrac></mrow></annotation-xml></semantics></math>. The frequency of a wave is the number of cycles per second. If a wave has a frequency of a million cycles per second, then the time for each cycle to go by is a millionth of a second. So, in general, <math display=\"inline\"><semantics><mrow><mrow><mi>t</mi><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mn>1</mn><mi>f</mi></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>t</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mn>1</mn><mi>f</mi></mfrac></mrow></annotation-xml></semantics></math>. Substituting into our <span class=\"no-emphasis\" data-type=\"term\" group-by=\"w\">wave equation</span>, we get <math display=\"inline\"><semantics><mrow><mrow><mi>c</mi><mo>=</mo></mrow></mrow><mrow><mrow><mi>λ</mi><mo>×</mo><mi>f</mi></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>c</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mi>λ</mi><mo>×</mo><mi>f</mi></mrow></annotation-xml></semantics></math>. Now let’s use this to calculate an example. What is the wavelength of visible light that has a frequency of <math display=\"inline\"><semantics><mrow><mrow><mn>5.66</mn><mo>×</mo><msup><mn>10</mn><mn>14</mn></msup><mtext> Hz</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mn>5.66</mn><mo>×</mo><msup><mn>10</mn><mn>14</mn></msup><mtext> Hz</mtext></mrow></annotation-xml></semantics></math>?</p> <p class=\"lt-phys-64676\">Solution</p> <p class=\"lt-phys-64676\">Solving the wave equation for wavelength, we find:</p> <p class=\"lt-phys-64676\"><math display=\"block\"><semantics><mrow><mrow><mtext>λ</mtext><mo>=</mo></mrow></mrow><mrow><mrow><mfrac><mi>c</mi><mi>f</mi></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>λ</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mi>c</mi><mi>f</mi></mfrac></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64676\">Substituting our values gives:</p> <p class=\"lt-phys-64676\"><math display=\"block\"><semantics><mrow><mrow><mtext>λ</mtext><mo>=</mo><mfrac><mrow><mn>3.00</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mrow><mn>5.66</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mn>14</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>Hz</mtext></mrow></mfrac><mo>=</mo><mn>5.30</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–</mtext></mrow></msup></mrow></mrow><mrow><mrow><msup><mrow><mtext>7</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>λ</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mfrac><mrow><mn>3.00</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mn>8</mn></msup><mspace width=\"0.2em\"></mspace><mtext>m/s</mtext></mrow><mrow><mn>5.66</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mn>14</mn></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>Hz</mtext></mrow></mfrac><mo>=</mo><mn>5.30</mn><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msup><mrow><mn>10</mn></mrow><mrow><mtext>–7</mtext></mrow></msup><mspace width=\"0.2em\"></mspace><mtext>m</mtext></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64676\">This answer can also be written as 530 nm, which is in the yellow-green part of the visible spectrum (nm stands for nanometers, where the term “nano” means “billionths”).</p> <p class=\"lt-phys-64676\">Exercise</p> <p class=\"lt-phys-64676\">“Tidal waves,” or tsunamis, are waves caused by earthquakes that travel rapidly through the ocean. If a tsunami travels at the speed of 600 km/h and approaches a shore at a rate of one wave crest every 15 min (4 waves/h), what would be the distance between those wave crests at sea?</p> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64676\"><math display=\"inline\"><semantics><mrow><mrow><mtext>λ</mtext><mo>=</mo><mfrac><mrow><mtext>600 km/h</mtext></mrow><mrow><mtext>4 waves/h</mtext></mrow></mfrac><mo>=</mo></mrow></mrow><mrow><mrow><mn>150</mn><mspace width=\"0.2em\"></mspace><mtext>km</mtext></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mtext>λ</mtext></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mtext></mtext></mrow></annotation-xml></semantics></math></p> </dd> </dl> <p class=\"box-legend lt-phys-64676\">Example : The Inverse Square Law for Light</p> <p class=\"lt-phys-64676\">The intensity of a 120-W lightbulb observed from a distance 2 m away is 2.4 W/m<sup>2</sup>. What would be the intensity if this distance was doubled?</p> <p class=\"lt-phys-64676\">Solution</p> <p class=\"lt-phys-64676\">If we move twice as far away, then the answer will change according to the inverse square of the distance, so the new intensity will be <math display=\"inline\"><semantics><mrow><mrow><msup><mrow><mo>(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msup><mrow><mo>(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></annotation-xml></semantics></math> of the original intensity, or 0.6 W/m<sup>2</sup>.</p> <p class=\"lt-phys-64676\">Exercise</p> <p class=\"lt-phys-64676\">How many times brighter or fainter would a star appear if it were moved to:</p> <ol style=\"list-style-type:lower-alpha;\"> <li class=\"lt-phys-64676\">twice its present distance?</li> <li class=\"lt-phys-64676\">ten times its present distance?</li> <li class=\"lt-phys-64676\">half its present distance?</li> </ol> <dl> <dt><strong class=\"emphasis bold\">Answer</strong></dt> <dd> <p class=\"lt-phys-64676\">&nbsp;</p> <p class=\"lt-phys-64676\">a. <math display=\"inline\"><semantics><mrow><mrow><msup><mrow><mrow><mo>(</mo><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow><mo>)</mo></mrow></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msup><mrow><mrow><mo>(</mo><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow><mo>)</mo></mrow></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></annotation-xml></semantics></math>; b. <math display=\"inline\"><semantics><mrow><mrow><msup><mrow><mrow><mo>(</mo><mrow><mfrac><mn>1</mn><mrow><mn>10</mn></mrow></mfrac></mrow><mo>)</mo></mrow></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mrow><mn>100</mn></mrow></mfrac></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msup><mrow><mrow><mo>(</mo><mrow><mfrac><mn>1</mn><mrow><mn>10</mn></mrow></mfrac></mrow><mo>)</mo></mrow></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mrow><mn>100</mn></mrow></mfrac></mrow></annotation-xml></semantics></math>; c. <math display=\"inline\"><semantics><mrow><mrow><msup><mrow><mrow><mo>(</mo><mrow><mfrac><mn>1</mn><mrow><mtext>1/2</mtext></mrow></mfrac></mrow><mo>)</mo></mrow></mrow><mn>2</mn></msup><mo>=</mo><mn>4</mn></mrow></mrow></semantics></math></p> </dd> </dl>"
