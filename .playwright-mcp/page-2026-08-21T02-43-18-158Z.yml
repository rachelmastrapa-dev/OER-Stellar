        - generic [ref=f452e104]:
          - heading "Introduction" [level=2] [ref=f452e105]
          - paragraph [ref=f452e106]: One of the most striking features you can see in a truly dark sky—one without light pollution—is the band of faint white light called the Milky Way, which stretches from one horizon to the other. This chapter will discuss early observations of the Milky Way, our galaxy's structure, formation, and many other things that we have learned while observing the Milky Way.
          - generic [ref=f452e108]:
            - heading " Learning Objectives" [level=5] [ref=f452e109]
            - paragraph [ref=f452e111]: "By the end of this section, you will be able to:"
            - list [ref=f452e112]:
              - listitem [ref=f452e113]: List the main components of the Galaxy
              - listitem [ref=f452e114]: Describe how astronomers determine the mass of the galaxy
              - listitem [ref=f452e115]: Describe how the observed rotation curve of our galaxy suggest the presence of dark matter
              - listitem [ref=f452e116]: Describe the radio and X-ray observations that indicate energetic phenomena are occurring at the galactic center
              - listitem [ref=f452e117]: Explain what has been revealed by high-resolution near-infrared imaging of the galactic center
              - listitem [ref=f452e118]: Distinguish between population I and population II stars according to their locations, motions, heavy-element abundances, and ages
              - listitem [ref=f452e119]: Describe the roles played by the collapse of a single cloud and mergers with other galaxies in building the Milky Way Galaxy we see today
          - paragraph
