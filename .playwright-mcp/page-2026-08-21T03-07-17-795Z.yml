            - application "Rich Text Editor, editarea" [ref=f582e319]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f582e333]: "<h2>Williamina Paton Stevens Fleming</h2> <p>Williamin Fleming (15 May 1857 – 21 May 1911) was a Scottish&nbsp;<a href=\"https://en.wikipedia.org/wiki/Astronomer\" id=\"mwCw\" rel=\"mw:WikiLink\" title=\"Astronomer\">astronomer</a>.<sup about=\"#mwt10\" data-mw=\"{&quot;name&quot;:&quot;ref&quot;,&quot;attrs&quot;:{&quot;name&quot;:&quot;:2&quot;},&quot;body&quot;:{&quot;id&quot;:&quot;mw-reference-text-cite_note-:2-1&quot;}}\" id=\"cite_ref-:2_1-0\" rel=\"dc:references\" typeof=\"mw:Extension/ref\"><a href=\"https://en.wikipedia.org/wiki/Williamina_Fleming#cite_note-:2-1\" id=\"mwDA\">[1]</a></sup><sup about=\"#mwt7\" id=\"mwEQ\">[<i><a href=\"https://en.wikipedia.org/wiki/Template:AI-retrieved_source/doc\" rel=\"mw:WikiLink\" title=\"Template:AI-retrieved source/doc\">AI-retrieved source</a></i>]</sup>&nbsp;At the&nbsp;<a href=\"https://en.wikipedia.org/wiki/Harvard_College_Observatory\" id=\"mwEg\" rel=\"mw:WikiLink\" title=\"Harvard College Observatory\">Harvard College Observatory</a>, she contributed to the photographic classification of&nbsp;<a href=\"https://en.wikipedia.org/wiki/Stellar_spectra\" id=\"mwEw\" rel=\"mw:WikiLink\" title=\"Stellar spectra\">stellar spectra</a>, helping to develop a common designation system for stars. Fleming cataloged more than ten thousand stars, 59 gaseous&nbsp;<a href=\"https://en.wikipedia.org/wiki/Nebula\" id=\"mwFA\" rel=\"mw:WikiLink\" title=\"Nebula\">nebulae</a>, over 310&nbsp;<a href=\"https://en.wikipedia.org/wiki/Variable_star\" id=\"mwFQ\" rel=\"mw:WikiLink\" title=\"Variable star\">variable stars</a>, and 10&nbsp;<a href=\"https://en.wikipedia.org/wiki/Nova\" id=\"mwFg\" rel=\"mw:WikiLink\" title=\"Nova\">novae</a>, among other astronomical phenomena. She is credited with the discovery of the&nbsp;<a href=\"https://en.wikipedia.org/wiki/Horsehead_Nebula\" id=\"mwFw\" rel=\"mw:WikiLink\" title=\"Horsehead Nebula\">Horsehead Nebula</a>&nbsp;in 1888, and she was a vocal supporter of women's representation in her field.</p> <p><a href=\"https://en.wikipedia.org/wiki/Williamina_Fleming\" title=\"https://en.wikipedia.org/wiki/Williamina_Fleming\">Attribution</a></p>"
