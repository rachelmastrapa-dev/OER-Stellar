              - listitem [ref=f102e106]: Explain how emission line spectra and absorption line spectra are formed
              - listitem [ref=f102e107]: Explain how spectral lines and ionization levels in a gas can help us determine its temperature
              - listitem [ref=f102e108]: Explain how astronomers learn the composition of a gas by examining its spectral lines
              - listitem [ref=f102e109]: Describe how astronomers use spectral classes to characterize stars
              - listitem [ref=f102e110]: List the stellar properties that astronomers can learn about a star by studying its spectrum
              - listitem [ref=f102e111]: Describe the proper motion of a star and how it relates to a star’s space velocity
