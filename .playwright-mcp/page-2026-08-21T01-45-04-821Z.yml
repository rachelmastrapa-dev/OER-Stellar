        - generic [ref=f102e95]:
          - heading "Introduction" [level=2] [ref=f102e96]
          - paragraph [ref=f102e97]: How do you collect a sample of a star? An astronomer can't scoop up a piece of a star and take it to a lab to learn its composition. They also can't measure the rotation or motion of a star using the same procedures that we measure the motion of a car or airplane due to their extreme distance. Instead, astronomers rely on different measurements by analyzing the light of the star. By analyzing the color of a star, astronomers can calculate its temperature. The next step in light analysis is to break the light into smaller pieces by wavelength, producing a spectrum. The analysis of spectra and the information derived from them is the focus of this chapter.
          - generic [ref=f102e99]:
            - heading " Learning Objectives" [level=5] [ref=f102e100]
            - paragraph [ref=f102e102]: "By the end of this section, you will be able to:"
