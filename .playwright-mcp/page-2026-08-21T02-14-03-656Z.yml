            - application "Rich Text Editor, editarea" [ref=f280e310]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f280e344]: "<h2>Measuring the Size of a Star&nbsp;&nbsp;</h2> <p class=\"lt-phys-64765\">It is easy to measure the diameter of the Sun. Its angular diameter—that is, its apparent size on the sky—is about 1/2°. If we know the angle the Sun takes up in the sky and how far away it is, we can calculate its true (linear) diameter, which is 1.39 million kilometers, or about 109 times the diameter of Earth.</p> <p class=\"lt-phys-64765\">Unfortunately, the Sun is the only star whose angular diameter is easily measured. All the other stars are so far away that they look like pinpoints of light through even the largest ground-based telescopes. (They often seem to be bigger, but that is merely distortion introduced by turbulence in Earth’s atmosphere.) Luckily, there are several techniques that astronomers can use to estimate the sizes of stars.</p> <h3 class=\"lt-phys-64765\">Stars Blocked by the Moon</h3> <p class=\"lt-phys-64765\">One technique, which gives very precise diameters but can be used for only a few stars, is to observe the dimming of light that occurs when the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"M\">Moon</span> passes in front of a star. What astronomers measure (with great precision) is the time required for the star’s brightness to drop to zero as the edge of the Moon moves across the star’s disk. Since we know how rapidly the Moon moves in its orbit around Earth, it is possible to calculate the angular diameter of the star. If the distance to the star is also known, we can calculate its diameter in kilometers. This method works only for fairly bright stars that happen to lie along the zodiac, where the Moon (or, much more rarely, a planet) can pass in front of them as seen from Earth.</p> <h3 class=\"lt-phys-64765\">Eclipsing Binary Stars</h3> <p class=\"lt-phys-64765\">Accurate sizes for a large number of stars come from measurements of <span data-type=\"term\" group-by=\"e\">eclipsing binary</span> star systems, and so we must make a brief detour from our main story to examine this type of star system. Some binary stars are lined up in such a way that, when viewed from Earth, each star passes in front of the other during every revolution (Figure 18.10). When one star blocks the light of the other, preventing it from reaching Earth, the brightness of the system decreases, and astronomers say that an eclipse has occurred.</p> <figure><span data-alt=\"Light Curve of an Eclipsing Binary. In this plot the vertical axis is labeled “Brightness” in arbitrary units, and the horizontal axis is labeled “Time” in arbitrary units. The plotted line is labeled “Light curve”. The plot begins as a horizontal line at upper left and is labeled “1”. The line then drops very sharply downward as it moves to the right, then quickly becomes horizontal again. This horizontal section is labeled “2”. The curve then rises sharply again back to the same brightness level as segment 1. This horizontal section is labeled “3”. After a time, the horizontal line drops, but not as deeply as segment 2, and becomes horizontal again. This horizontal segment is labeled “4”. The curve then rises again to the level of segment 1. Inset is a diagram of the binary star system. The larger star is drawn as a red sphere. A blue elliptical arrow surrounds the larger star with an arrowhead pointing to the right, indicating the motion of the companion star. The companion star is drawn on the elliptical arrow in four places corresponding to the sections 1-4 on the light curve. At position 1 the smaller star is separated from the larger star and the light curve is at its brightest. At position 2 the smaller star is behind the larger star and the light curve dips to its lowest brightness. At position 3 the smaller star emerges from behind the larger star and the full brightness is restored. Finally, at position 4, the smaller star is in front of the larger star, and the light curve dips to its next lowest level.\" data-type=\"media\"><img alt=\"Light Curve of an Eclipsing Binary. In this plot the vertical axis is labeled “Brightness” in arbitrary units, and the horizontal axis is labeled “Time” in arbitrary units. The plotted line is labeled “Light curve”. The plot begins as a horizontal line at upper left and is labeled “1”. The line then drops very sharply downward as it moves to the right, then quickly becomes horizontal again. This horizontal section is labeled “2”. The curve then rises sharply again back to the same brightness level as segment 1. This horizontal section is labeled “3”. After a time, the horizontal line drops, but not as deeply as segment 2, and becomes horizontal again. This horizontal segment is labeled “4”. The curve then rises again to the level of segment 1. Inset is a diagram of the binary star system. The larger star is drawn as a red sphere. A blue elliptical arrow surrounds the larger star with an arrowhead pointing to the right, indicating the motion of the companion star. The companion star is drawn on the elliptical arrow in four places corresponding to the sections 1-4 on the light curve. At position 1 the smaller star is separated from the larger star and the light curve is at its brightest. At position 2 the smaller star is behind the larger star and the light curve dips to its lowest brightness. At position 3 the smaller star emerges from behind the larger star and the full brightness is restored. Finally, at position 4, the smaller star is in front of the larger star, and the light curve dips to its next lowest level.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45725/d27800a8f9f05d64276f71c7b5310cf12a4825cd\" /> </span> <figcaption>Figure 18.10 : Light Curve of an Eclipsing Binary. The light curve of an eclipsing binary star system shows how the combined light from both stars changes due to eclipses over the time span of an orbit. This light curve shows the behavior of a hypothetical eclipsing binary star with total eclipses (one star passes directly in front of and behind the other). The numbers indicate parts of the light curve corresponding to various positions of the smaller star in its orbit. In this diagram, we have assumed that the smaller star is also the hotter one so that it emits more flux (energy per second per square meter) than the larger one. When the smaller, hotter star goes behind the larger one, its light is completely blocked, and so there is a strong dip in the light curve. When the smaller star goes in front of the bigger one, a small amount of light from the bigger star is blocked, so there is a smaller dip in the light curve.</figcaption> </figure> <p class=\"lt-phys-64765\">The discovery of the first eclipsing binary helped solve a long-standing puzzle in astronomy. The star Algol, in the constellation of Perseus, changes its brightness in an odd but regular way. Normally, Algol is a fairly bright star, but at intervals of 2 days, 20 hours, 49 minutes, it fades to one-third of its regular brightness. After a few hours, it brightens to normal again. This effect is easily seen, even without a telescope, if you know what to look for.</p> <p class=\"lt-phys-64765\">In 1783, a young English astronomer named John <span class=\"no-emphasis\" data-type=\"term\" group-by=\"G\">Goodricke</span> (1764–1786) made a careful study of <span class=\"no-emphasis\" data-type=\"term\" group-by=\"A\">Algol</span> (see the feature on John Goodricke for a discussion of his life and work). Even though Goodricke could neither hear nor speak, he made a number of major discoveries in the 21 years of his brief life. He suggested that Algol’s unusual brightness variations might be due to an invisible companion that regularly passes in front of the brighter star and blocks its light. Unfortunately, Goodricke had no way to test this idea, since it was not until about a century later that equipment became good enough to measure Algol’s spectrum.</p> <p class=\"lt-phys-64765\">In 1889, the German astronomer Hermann <span class=\"no-emphasis\" data-type=\"term\" group-by=\"V\">Vogel</span> (1841–1907) demonstrated that, like Mizar, Algol is a spectroscopic binary. The spectral lines of Algol were not observed to be double because the fainter star of the pair gives off too-little light compared with the brighter star for its lines to be conspicuous in the composite spectrum. Nevertheless, the periodic shifting back and forth of the brighter star’s lines gave evidence that it was revolving about an unseen companion. (The lines of both components need not be visible for a star to be recognized as a spectroscopic binary.)</p> <p class=\"lt-phys-64765\">The discovery that Algol is a spectroscopic binary verified Goodricke’s hypothesis. The plane in which the stars revolve is turned nearly edgewise to our line of sight, and each star passes in front of the other during every revolution. (The eclipse of the fainter star in the Algol system is not very noticeable because the part of it that is covered contributes little to the total light of the system. This second eclipse can, however, be detected by careful measurements.)</p> <p class=\"lt-phys-64765\">Any binary star produces eclipses if viewed from the proper direction, near the plane of its orbit, so that one star passes in front of the other (see Figure 18.10). But from our vantage point on Earth, only a few binary star systems are oriented in this way.&nbsp;</p> <h3 class=\"lt-phys-64765\">Diameters of Eclipsing Binary Stars</h3> <p class=\"lt-phys-64765\">We now turn back to the main thread of our story to discuss how all this can be used to measure the sizes of stars. The technique involves making a light curve of an eclipsing binary, a graph that plots how the brightness changes with time. Let us consider a hypothetical binary system in which the stars are very different in size, like those illustrated in Figure 18.11. To make life easy, we will assume that the orbit is viewed exactly edge-on.</p> <p class=\"lt-phys-64765\">Even though we cannot see the two stars separately in such a system, the light curve can tell us what is happening. When the smaller star just starts to pass behind the larger star (a point we call <em data-effect=\"italics\">first contact</em>), the brightness begins to drop. The eclipse becomes total (the smaller star is completely hidden) at the point called <em data-effect=\"italics\">second contact</em>. At the end of the total eclipse (<em data-effect=\"italics\">third</em> <em data-effect=\"italics\">contact</em>)<em data-effect=\"italics\">,</em> the smaller star begins to emerge. When the smaller star has reached <em data-effect=\"italics\">last contact</em>, the eclipse is completely over.</p> <p class=\"lt-phys-64765\">To see how this allows us to measure diameters, look carefully at Figure 18.11. During the time interval between the first and second contacts, the smaller star has moved a distance equal to its own diameter. During the time interval from the first to third contacts, the smaller star has moved a distance equal to the diameter of the larger star. If the spectral lines of both stars are visible in the spectrum of the binary, then the speed of the smaller star with respect to the larger one can be measured from the Doppler shift. But knowing the speed with which the smaller star is moving and how long it took to cover some distance can tell the span of that distance—in this case, the diameters of the stars. The speed multiplied by the time interval from the first to second contact gives the diameter of the smaller star. We multiply the speed by the time between the first and third contacts to get the diameter of the larger star.</p> <figure><span data-alt=\"Light Curve of an Eclipsing Binary. In this plot the vertical axis is labeled “Brightness” in arbitrary units, and the horizontal axis is labeled “Time” in arbitrary units. The plotted line is labeled “Light curve”. The plot begins as a horizontal line at center left. The line then drops downward as it moves to the right, then quickly becomes horizontal again. As time goes on the curve rises again back to its original brightness. Above the curve is a diagram of the binary system. The larger star is drawn as a red sphere. A blue arrow is drawn horizontally through the center of the larger star pointing to the right, indicating the motion of the companion star. The companion star is drawn as a blue dot at four positions on the blue arrow, labeled “1” through “4”. At position 1 on the left, the companion star just touches the left edge of the larger star. A dashed line is drawn downward to the light curve at the point where the brightness just begins to drop. At position 2 the companion star has just been fully eclipsed by the larger star. A dashed line is drawn downward to the light curve at the point where lowest brightness begins. At position 3 the companion star is just about to emerge from eclipse. A dashed line is drawn downward to the light curve at the point where the brightness begins to rise. Finally, at position 4, the companion star has emerged from eclipse and just touches the right edge of the larger star. A dashed line is drawn downward to the light curve at the point where the light curve returns to maximum brightness.\" data-type=\"media\"><img alt=\"Light Curve of an Eclipsing Binary. In this plot the vertical axis is labeled “Brightness” in arbitrary units, and the horizontal axis is labeled “Time” in arbitrary units. The plotted line is labeled “Light curve”. The plot begins as a horizontal line at center left. The line then drops downward as it moves to the right, then quickly becomes horizontal again. As time goes on the curve rises again back to its original brightness. Above the curve is a diagram of the binary system. The larger star is drawn as a red sphere. A blue arrow is drawn horizontally through the center of the larger star pointing to the right, indicating the motion of the companion star. The companion star is drawn as a blue dot at four positions on the blue arrow, labeled “1” through “4”. At position 1 on the left, the companion star just touches the left edge of the larger star. A dashed line is drawn downward to the light curve at the point where the brightness just begins to drop. At position 2 the companion star has just been fully eclipsed by the larger star. A dashed line is drawn downward to the light curve at the point where lowest brightness begins. At position 3 the companion star is just about to emerge from eclipse. A dashed line is drawn downward to the light curve at the point where the brightness begins to rise. Finally, at position 4, the companion star has emerged from eclipse and just touches the right edge of the larger star. A dashed line is drawn downward to the light curve at the point where the light curve returns to maximum brightness.\" data-media-type=\"image/jpeg\" src=\"/@api/deki/files/45726/db9a8bd2f21edd85df72c5e94c04b7f6ab8c9772\" /> </span> <figcaption>Figure 18.11 : Light Curve of an Edge-On Eclipsing Binary. Here we see the light curve of a hypothetical eclipsing binary star whose orbit we view exactly edge-on, in which the two stars fully eclipse each other. From the time intervals between contacts, it is possible to estimate the diameters of the two stars.</figcaption> </figure> <p class=\"lt-phys-64765\">In actuality, the situation with eclipsing binaries is often a bit more complicated: orbits are generally not seen exactly edge-on, and the light from each star may be only partially blocked by the other. Furthermore, binary star orbits, just like the orbits of the planets, are ellipses, not circles. However, all these effects can be sorted out from very careful measurements of the light curve.&nbsp;</p> <h3 class=\"lt-phys-64765\">Using the Radiation Law to Get the Diameter</h3> <p class=\"lt-phys-64765\">Another method for measuring star diameters makes use of the Stefan-Boltzmann law for the relationship between energy radiated and temperature (see Radiation and Spectra). In this method, the <em data-effect=\"italics\">energy flux</em> (energy emitted per second per square meter by a blackbody, like the Sun) is given by</p> <p class=\"lt-phys-64765\"><math display=\"block\"><semantics><mrow><mrow><mi>F</mi><mo>=</mo></mrow></mrow><mrow><mrow><mtext>σ</mtext><msup><mi>T</mi><mn>4</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>F</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mtext>σ</mtext><msup><mi>T</mi><mn>4</mn></msup></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64765\">where σ is a constant and <em data-effect=\"italics\">T</em> is the temperature. The surface area of a sphere (like a star) is given by</p> <p class=\"lt-phys-64765\"><math display=\"block\"><semantics><mrow><mrow><mi>A</mi><mo>=</mo></mrow></mrow><mrow><mrow><mtext>4</mtext><mtext>π</mtext><msup><mi>R</mi><mn>2</mn></msup></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>A</mi></mrow></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mrow><mo>=</mo><mtext>4</mtext><mtext>π</mtext><msup><mi>R</mi><mn>2</mn></msup></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64765\">The luminosity (<em data-effect=\"italics\">L</em>) of a star is then given by its surface area in square meters times the energy flux:</p> <p class=\"lt-phys-64765\"><math display=\"block\"><semantics><mrow><mrow><mi>L</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mi>A</mi><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mi>F</mi><mo stretchy=\"false\">)</mo></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><mi>L</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mi>A</mi><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><mi>F</mi><mo stretchy=\"false\">)</mo></mrow></annotation-xml></semantics></math></p> <p class=\"lt-phys-64765\">Previously, we determined the masses of the two stars in the <span class=\"no-emphasis\" data-type=\"term\" group-by=\"S\">Sirius</span> binary system. Sirius gives off 8200 times more energy than its fainter companion star, although both stars have nearly identical temperatures. The extremely large difference in luminosity is due to the difference in radius, since the temperatures and hence the energy fluxes for the two stars are nearly the same. To determine the relative sizes of the two stars, we take the ratio of the corresponding luminosities:</p> <p class=\"lt-phys-64765\"><math display=\"block\"><semantics><mrow><mtable><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mi>L</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>L</mi><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mo>(</mo><mrow><msub><mi>A</mi><mrow><mtext>Sirius</mtext></mrow></msub><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msub><mi>F</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mo>)</mo></mrow></mrow><mrow><mrow><mo>(</mo><mrow><msub><mi>A</mi><mrow><mtext>companion</mtext></mrow></msub><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msub><mi>F</mi><mrow><mtext>companion</mtext></mrow></msub></mrow><mo>)</mo></mrow></mrow></mfrac></mtd></mtr><mtr></mtr><mtr></mtr><mtr><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><msub><mi>A</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>A</mi><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>4</mtext><mi>π</mi><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><mtext>4</mtext><mi>π</mi><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac><mo>=</mo></mtd></mtr><mtr><mtd columnalign=\"left\"><mfrac><mrow><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mi>L</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>L</mi><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr><mtr><mtd columnalign=\"left\"><mo>=</mo><mn>8200</mn><mo>=</mo></mtd></mtr></mtable></mrow><mrow><mtable><mtr><mtd columnalign=\"left\"><mfrac><mrow><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msup><mi>R</mi><mn>2</mn></msup><msub><mrow></mrow><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr></mtable></mrow><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mi>L</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>L</mi><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr></mtable></annotation-xml><annotation-xml encoding=\"MathML-Content\"><mtable><mtr><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><mrow><mo>(</mo><mrow><msub><mi>A</mi><mrow><mtext>Sirius</mtext></mrow></msub><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msub><mi>F</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mo>)</mo></mrow></mrow><mrow><mrow><mo>(</mo><mrow><msub><mi>A</mi><mrow><mtext>companion</mtext></mrow></msub><mspace width=\"0.2em\"></mspace><mo>×</mo><mspace width=\"0.2em\"></mspace><msub><mi>F</mi><mrow><mtext>companion</mtext></mrow></msub></mrow><mo>)</mo></mrow></mrow></mfrac></mtd></mtr><mtr></mtr><mtr></mtr><mtr><mtd columnalign=\"left\"><mo>=</mo><mfrac><mrow><msub><mi>A</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>A</mi><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>4</mtext><mi>π</mi><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><mtext>4</mtext><mi>π</mi><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac><mo>=</mo></mtd></mtr><mtr><mtd columnalign=\"left\"><mfrac><mrow><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr><mtr><mtd columnalign=\"left\"><mfrac><mrow><msub><mi>L</mi><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msub><mi>L</mi><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr><mtr><mtd columnalign=\"left\"><mo>=</mo><mn>8200</mn><mo>=</mo><mfrac><mrow><msup><mi>R</mi><mtext>2</mtext></msup><msub><mrow></mrow><mrow><mtext>Sirius</mtext></mrow></msub></mrow><mrow><msup><mi>R</mi><mn>2</mn></msup><msub><mrow></mrow><mrow><mtext>companion</mtext></mrow></msub></mrow></mfrac></mtd></mtr></mtable></annotation-xml></semantics></math></p> <p class=\"lt-phys-64765\">Therefore, the relative sizes of the two stars can be found by taking the square root of the relative luminosity. Since <math display=\"inline\"><semantics><mrow><mrow><msqrt><mrow><mn>8200</mn></mrow></msqrt><mo>=</mo><mn>91</mn></mrow></mrow><annotation-xml encoding=\"MathML-Content\"><mrow><msqrt><mrow><mn>8200</mn></mrow></msqrt><mo>=</mo><mn>91</mn></mrow></annotation-xml></semantics></math>, the radius of Sirius is 91 times larger than the radius of its faint companion.</p> <p class=\"lt-phys-64765\">The method for determining the radius shown here requires both stars be visible, which is not always the case.&nbsp;</p> <h3 class=\"lt-phys-64765\">Stellar Diameters</h3> <p class=\"lt-phys-64765\">The results of many stellar size measurements over the years have shown that most nearby stars are roughly the size of the Sun, with typical diameters of a million kilometers or so. Faint stars, as we might have expected, are generally smaller than more luminous stars. However, there are some dramatic exceptions to this simple generalization.</p> <p class=\"lt-phys-64765\">A few of the very luminous stars, those that are also red (indicating relatively low surface temperatures), turn out to be truly enormous. These stars are called, appropriately enough, <span class=\"no-emphasis\" data-type=\"term\" group-by=\"g\">giant stars</span> or <span class=\"no-emphasis\" data-type=\"term\" group-by=\"s\">supergiant stars</span>. An example is <span class=\"no-emphasis\" data-type=\"term\" group-by=\"B\">Betelgeuse</span>, the second brightest star in the constellation of Orion and one of the dozen brightest stars in our sky. Its diameter, remarkably, is greater than 10 AU (1.5 <em data-effect=\"italics\">billion</em> kilometers!), large enough to fill the entire inner solar system almost as far out as Jupiter. In Stars from Adolescence to Old Age, we will look in detail at the evolutionary process that leads to the formation of such giant and supergiant stars.&nbsp;</p> <h3 class=\"lt-phys-64765\" data-type=\"footnote-refs-title\">Further Exploration</h3> <ul> <li>The <a href=\"https://openstax.org/l/30eclipsbinsim\" rel=\"noopener nofollow\" target=\"_blank\">Eclipsing Binary Simulator</a> allows you to explore how the eclipse timing can be used to determine the size of stars in a binary pair. Other traits can be explored as well, such as their mass, separation, and surface temperatures.</li> <li>Use the <a href=\"https://openstax.org/l/30stellumsim\" rel=\"noopener nofollow\" target=\"_blank\">Stellar Luminosity Simulato</a>r to explore the relationship between a star’s surface temperature, luminosity, and radius. Move the sliders to see what happens. Try to make two stars with the same luminosity but different surface temperatures.</li> <li>Watch this <a href=\"https://openstax.org/l/30starsizecomp\" rel=\"noopener nofollow\" target=\"_blank\">star size comparison video</a> for a striking visual that highlights the size of stars versus planets and the range of sizes among stars.</li> </ul> <p>&nbsp;</p>"
