            - application "Rich Text Editor, editarea" [ref=f485e266]:
              - textbox "Rich Text Editor, editarea" [active] [ref=f485e280]: "<h2>Introduction</h2> <p class=\"lt-phys-3805 lt-phys-64823\">In this chapter, we start our exploration of the vast realm of galaxies. We will discuss the different types of galaxies, how astronomers measure the properties of galaxies, and how observations of galaxies led to the discovery of an expanding universe.</p> <section class=\"box-objectives\"> <h5 class=\"box-legend\"><span class=\"lt-icon-default\">Learning Objectives</span></h5> <ul> <li class=\"lt-phys-64824\">Describe the discoveries that confirmed the existence of galaxies that lie far beyond the Milky Way Galaxy</li> <li class=\"lt-phys-64825\">Describe the properties and features of elliptical, spiral, and irregular galaxies</li> <li class=\"lt-phys-64826\">Describe the methods through which astronomers can estimate the mass of a galaxy</li> <li class=\"lt-phys-64826\">Characterize each type of galaxy by its mass-to-light ratio</li> <li class=\"lt-phys-64827\">Describe the use of variable stars to estimate distances to galaxies</li> <li class=\"lt-phys-64827\">Explain how standard bulbs and the Tully-Fisher relation can be used to estimate distances to galaxies</li> <li class=\"lt-phys-64828\">Explain how to use Hubble’s law to determine distances to remote galaxies</li> <li class=\"lt-phys-64828\">Describe models for the nature of an expanding universe</li> </ul> </section> <p class=\"lt-phys-3805 lt-phys-64823\">{{template.ShowOrg()}}</p> <p><strong>Thumbnail</strong>: NGC 6946 is a medium-sized, face-on spiral galaxy about 22 million light years away from Earth. In the past century, eight supernovas have been observed to explode in the arms of this galaxy. Chandra observations (purple) have, in fact, revealed three of the oldest supernovas ever detected in X-rays, giving more credence to its nickname of the \"Fireworks Galaxy.\" This composite image also includes optical data from the Gemini Observatory in red, yellow, and cyan.. (<a href=\"https://en.wikipedia.org/wiki/Public_domain\" target=\"_blank\" title=\"Public Domain\">Public Domain</a>; <a href=\"https://www.nasa.gov/\" target=\"_blank\" title=\"NASA\">NASA/CXC/MSSL/R.Soria et al, Optical: AURA/Gemini OBs</a> via <a href=\"https://commons.wikimedia.org/wiki/File:NGC_6946.jpg\" target=\"_blank\" title=\"Wikimedia Commons\">Wikimedia Commons</a>)</p>"
