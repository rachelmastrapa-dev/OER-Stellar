                  - paragraph [ref=f252e2]: There is another reason the speed of light is such a natural unit of distance for astronomers. Information about the universe comes to us almost exclusively through various forms of light, and all such light travels at the speed of light—that is, 1 light-year every year. This sets a limit on how quickly we can learn about events in the universe. If a star is 100 light-years away, the light we see from it tonight left that star 100 years ago and is just now arriving in our neighborhood. The soonest we can learn about any changes in that star is 100 years after the fact. For a star 500 light-years away, the light we detect tonight left 500 years ago and is carrying 500-year-old news.
                  - paragraph [ref=f252e3]: Because many of us are accustomed to instant news from the Internet, some might find this frustrating.
                  - paragraph [ref=f252e4]: “You mean, when I see that star up there,” you ask, “I won’t know what’s actually happening there for another 500 years?”
                  - paragraph [ref=f252e5]:
                    - text: But this isn’t the most helpful way to think about the situation. For astronomers,
                    - emphasis [ref=f252e6]: now
                    - text: is when the light reaches us here on Earth. There is no way for us to know anything about that star (or other object) until its light reaches us.
                  - paragraph [ref=f252e7]: But what at first may seem a great frustration is actually a tremendous benefit in disguise. If astronomers really want to piece together what has happened in the universe since its beginning, they must find evidence about each epoch (or period of time) of the past. Where can we find evidence today about cosmic events that occurred billions of years ago?
                  - paragraph [ref=f252e8]: The delay in the arrival of light provides an answer to this question. The farther out in space we look, the longer the light has taken to get here, and the longer ago it left its place of origin. By looking billions of light-years out into space, astronomers are actually seeing billions of years into the past. In this way, we can reconstruct the history of the cosmos and get a sense of how it has evolved over time.
                  - paragraph [ref=f252e9]: This is one reason why astronomers strive to build telescopes that can collect more and more of the faint light in the universe. The more light we collect, the fainter the objects we can observe. On average, fainter objects are farther away and can, therefore, tell us about periods of time even deeper in the past. Instruments such as the Hubble Space Telescope (Figure 1.5) and the Very Large Telescope in Chile (which you will learn about in the chapter on Astronomical Instruments), are giving astronomers views of deep space and deep time better than any we have had before.
                  - 'figure "Figure 1.5 : Telescope in Orbit. The Hubble Space Telescope, shown here in orbit around Earth, is one of many astronomical instruments in space. (credit: modification of work by European Space Agency)" [ref=f252e10]':
                    - img "Image of the Hubble Space Telescope in orbit, seen against the bright surface of the Earth." [ref=f252e12]
                  - paragraph [ref=f252e14]
